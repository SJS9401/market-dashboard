<body>
<h1>그룹군 지수 비교 <span class="small">일별 동적 재분류 · 동일가중 · 전일 멤버십으로 당일 수익 귀속 (look-ahead 없음)</span></h1>
<div class="meta">buy&hold 성격 지수 — 스윙 전략 수익이 아니라 그룹의 "체질 흐름" 확인용 ·
RS 강세 = 3M 하락일 방어 + 상승일 우위 · 소르티노 = 하락일 방어 + 상승일 소외 · 방어주 = 양방향 저베타 (상승·하락 β 모두 &lt;0.7, 섹터 무관 — RS·소르티노는 방어주 제외 후 분류) · 코스피 패널 마커 = 반등 사이클 (▼-3% ▲저점 ●50%되돌림)</div>
<div class="bar">
  <button id="rbBtn" onclick="rebase()">보이는 구간 시작 = 100 리베이스</button>
  <button onclick="resetView()">전체 기간 (원지수)</button>
  <button id="cycBtn" onclick="toggleCyc()">사이클 마커 ON</button>
  <span id="lgd"></span>
</div>
<div class="panel"><div class="ptitle" style="display:flex;align-items:center;gap:8px;"><span id="ptitle">그룹 지수 (2014-01=100)</span>
<span style="margin-left:auto;display:flex;gap:6px;align-items:center;">
<input id="anchorDate" type="date" style="background:#181818;color:#ccc;border:1px solid #3a3a3a;border-radius:5px;padding:3px 6px;font-size:12px;">
<button onclick="rebaseAt()" style="padding:3px 10px;font-size:12px;">이 날짜 = 100</button></span></div><div id="ch"></div></div>

<script>
const D = JSON.parse(document.getElementById('gd').textContent);
const CYC = JSON.parse(document.getElementById('cyc').textContent);
const COLORS = {"RS 강세":"#000000","소르티노":"#9900CC","방어주":"#6a6a6a","KOSPI":"#d10000","KOSDAQ":"#1750e0"};
const chart = LightweightCharts.createChart(document.getElementById('ch'), {
  height: 560,
  localization:{timeFormatter:t=>{if(typeof t==='string'){const p=t.split('-');return p[0].slice(2)+'/'+p[1]+'/'+p[2];}if(t&&typeof t==='object')return String(t.year).slice(2)+'/'+String(t.month).padStart(2,'0')+'/'+String(t.day).padStart(2,'0');const d=new Date(t*1000);return String(d.getUTCFullYear()).slice(2)+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+String(d.getUTCDate()).padStart(2,'0');}},
  layout:{background:{type:'solid',color:'#8C8C8C'},textColor:'#1c2128',fontSize:11},
  grid:{vertLines:{color:'#6D6D6D'},horzLines:{color:'#6D6D6D'}},
  rightPriceScale:{borderColor:'#707070',minimumWidth:64,mode:1},
  timeScale:{borderColor:'#707070'},
  crosshair:{mode:0,horzLine:{color:'#2b3138'},vertLine:{color:'#2b3138'}},
});
const seriesMap = {};
for (const [name, vals] of Object.entries(D.series)) {
  const s = chart.addLineSeries({color:COLORS[name],lineWidth:(name==='KOSPI'||name==='KOSDAQ')?3:2,
    priceLineVisible:false,lastValueVisible:true,title:''});
  s.setData(D.dates.map((d,i)=>({time:d,value:vals[i]})));
  seriesMap[name]=s;
}
document.getElementById('lgd').innerHTML = Object.entries(COLORS)
  .map(([n,c])=>`<span class="lg"><b style="background:${c}"></b>${n}</span>`).join('');

let rebased=false;
function rebaseAt(){
  const v = document.getElementById('anchorDate').value;
  if(!v) return;
  const r = chart.timeScale().getVisibleRange();
  const i0 = D.dates.findIndex(d=>d>=v);
  if(i0<0) return;
  _applyRebase(i0, r);
}
function _applyRebase(i0, r){
  for (const [name, vals] of Object.entries(D.series)) {
    const b = vals[i0];
    seriesMap[name].setData(D.dates.map((d,i)=>({time:d,value:+(vals[i]/b*100).toFixed(2)})));
  }
  rebased=true;
  document.getElementById('ptitle').textContent='그룹 지수 — '+D.dates[i0]+' = 100 리베이스';
  if(r) chart.timeScale().setVisibleRange(r);
}
function rebase(){
  const r = chart.timeScale().getVisibleRange();
  if(!r) return;
  const i0 = D.dates.findIndex(d=>d>=r.from);
  if(i0<0) return;
  _applyRebase(i0, r);
}
function resetView(){
  for (const [name, vals] of Object.entries(D.series))
    seriesMap[name].setData(D.dates.map((d,i)=>({time:d,value:vals[i]})));
  rebased=false;
  document.getElementById('ptitle').textContent='그룹 지수 (2014-01=100)';
  chart.timeScale().fitContent();
}
let cycOn=false;
function toggleCyc(){
  cycOn=!cycOn;
  const m=[];
  if(cycOn) CYC.forEach(c=>{
    m.push({time:c.t,position:'aboveBar',color:'#555',shape:'arrowDown',text:''});
    m.push({time:c.l,position:'belowBar',color:'#1b6e3c',shape:'arrowUp',text:c.ld});
    m.push({time:c.e,position:'aboveBar',color:'#0033cc',shape:'circle',text:''});
  });
  seriesMap['KOSPI'].setMarkers(m.sort((a,b)=>a.time<b.time?-1:1));
  document.getElementById('cycBtn').textContent='사이클 마커 '+(cycOn?'OFF':'ON');
}
toggleCyc();
window.addEventListener('resize',()=>chart.applyOptions({width:document.getElementById('ch').clientWidth}));
</script>
