→ 삼성전자: 2027 CapEx 100～108조원(다올·유안타). 2028E BNK 122조원(−72%) / 키움 337조원(−11%)
→ 셀사이드 해석 차이: 3사 모두 "2027 공급 부족"은 만장일치. 갈림은 2028년 — 한국 2사는 BNK·키움이 공개적으로 2028 이익 감소를 추정에 넣었고, Micron 커버 국내사는 2028E에서도 +5～10% 증익(컨센 경로상 OPM만 하락)
→ [판단] 3사 동시 "건설 먼저, 장비는 수요 보고" 전략은 2027 공급을 묶는 대신 **2028 말～2029 공급 증가를 예약**한 것. 2028 논쟁은 이번 분기 숫자로 끝나지 않고, 2028 물량 장기계약 체결 속도로 판가름 난다

(2) 장기공급계약 확대 — 이익 하방 상승, 상방 제한 (3/3 종목)
→ Micron: SCA 16 → 26건, 2030년까지 매출 35%+, 약 75%는 가격 하한·상한 밴드, RPO $150B
→ SK하이닉스: LTA 14개사, 2027～28 Capa 50%+, "2029년까지 DRAM·HBM 사실상 완판", 가격은 협의 범위 내 시장 반영
→ 삼성전자: 대형 고객 10개사 LTA + 10개사 협상, LTA 매출 비중 60～70% 가이던스, KB "2030년까지 생산능력의 70%"
→ 셀사이드 해석 차이: 한국 2사 커버리지는 LTA를 "재평가 근거"(KB·SK증권·교보)로, Micron 커버리지(키움)는 "예상 범위, 서프라이즈 아님"으로 본다
→ [판단] 장기계약 비중은 삼성(60～70%) > SK하이닉스(50%+) > Micron(35%+) 순. 이익 변동성은 줄지만 가격 상단 밴드가 있어 **델타 재가속은 어렵게 만드는 구조** — 모멘텀 관점에서는 "꺾임 폭 축소"가 장점, "재가속 제한"이 단점

(3) HBM과 범용 DRAM의 마진 역전 (3/3 종목)

→ 삼성전자: HBM은 DRAM 매출의 10% 미만(유안타) — 이익 개선 대부분이 범용 DRAM 가격. 2027 HBM ASP +150%(KB)
→ [판단] 이번 사이클의 이익 레버리지는 HBM이 아니라 **범용 DRAM 가격**이 쥐고 있다. 범용 노출이 큰 순서(삼성 > Micron > SK하이닉스)대로 2026 이익 서프라이즈가 컸고, 같은 순서로 2027 하반기 범용 가격 하락에 가장 민감하다
