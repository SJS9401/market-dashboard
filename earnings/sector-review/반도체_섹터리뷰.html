> **11/16 잠정판 콜 체크**: 잠정판은 "섹터 중립(잠정) | 파운드리 확대 > 로직·CPU 유지 > 메모리 축소 | 한국 언더퍼폼(믹스 효과)", Nvidia 콜은 "가속이면 섹터 확대 검토"였다. Nvidia는 꺾임(규칙)·둔화(조정)로 나와 확대 조건 미충족 — **중립 유지, 서브섹터 순위·한국 콜 모두 그대로 맞았다.** 관전 포인트 2순위(글로벌 통합 재판정)는 이번 판으로 처리, ASIC 편입만 남았다

→ **원/달러 (분기 평균, 메모리 리뷰 표 그대로)**: 4Q23 1,320 · 1Q24 1,329 · 2Q24 1,371 · 3Q24 1,358 · 4Q24 1,397 · 1Q25 1,453 · 2Q25 1,404 · 3Q25 1,387 · 4Q25 1,444 · 1Q26 1,466 · 2Q26 1,502 · 3Q26 1,420 · 4Q26E 1,340 (BNK·하나증권 가정치·근사치 — `메모리_섹터리뷰.md` 누적 시계열 주석)
→ **NT$/US$ (TSMC, NT$ 매출 ÷ US$ 매출)**: 4Q24 32.3 · 1Q25 32.9 · 2Q25 31.1 · 3Q25 29.9 · 4Q25 31.0 · 1Q26 31.6 · 2Q26 31.6 · 3Q26 32.0 · 4Q26G 31.8. TSMC는 US$ 매출 × 회사 OPM(파운드리 리뷰)으로 합산에 넣었다 — 파운드리 서브섹터 판정은 NT$ 기준이지만 섹터 합산은 US$다
→ **캘린더 정렬**: 3Q26 합산은 2026년 6～10월에 걸친다. Micron 3Q26 = FQ4 FY26(6～8월), Nvidia 3Q26 = FQ3 FY27(8～10월), Arm = FQ2 FY27(7～9월), 나머지 7～9월. 월 단위 재배분 없이 가장 가까운 캘린더 분기에 매핑(서브섹터 리뷰와 같은 처리). Nvidia 4Q26E(FQ4 FY27)는 14주 분기
→ **같은 표본 YoY — 서브섹터 기준을 그대로 따랐다**: 메모리 = 삼성 DS(메모리 리뷰 기준, 전사 아님), 로직 = Non-GAAP(Nvidia도 Non-GAAP, GAAP과 3Q26 차이 0.5%), TSMC = 회사 영업이익. 2Q26 → 3Q26 델타는 로직 리뷰와 같이 Intel 제외. Nvidia 1Q25 H20 비용($4.5B) 저기저가 1Q26 YoY를 부풀린 효과는 조정값으로 병기했다(로직 리뷰와 같은 처리) — 섹터 판정은 바뀌지 않는다(1Q26 가속, 2Q26 가속)
→ **4Q26E**: 메모리 = 메모리 리뷰 E(SK 증권사 중간값·삼성 DS 3사 중간값·Micron 가이던스), 로직 = 4사 가이던스 합산($90.0B), TSMC = 가이던스 중간값(US$30.65B)
→ **이익 레벨**: 3Q26 8사 영업이익 $291.4B(413.8조원), OPM 68.5% — 둘 다 표본 최고. 4Q26E $347.8B로 레벨은 계속 오른다 [계산]
→ **컨센 경로상 정점**: 섹터 영업이익 YoY 정점은 **2Q26**(6사 +300.7%, 7사 +298.7%)으로 이미 통과. 매출 YoY는 4Q26E(+160%)까지 오르지만 증가 폭이 줄어든다(+14.5 → +5.1%p) [계산]
→ 비영업 요인: 인수 주도 가속 없음. 일회성은 Nvidia 1Q25 H20·AMD 2Q25 MI308(조정 병기), SK하이닉스 3Q26 영업외 손실(영업이익 무관)

→ **순위 기준**: 델타 큰 순서. 메모리는 레벨(+961%)이 압도적이지만 방향이 가장 나쁘다. 파운드리 가속 라벨은 대만달러 약세(격차 +11.3%p)에 기대지만 US$로도 +1.2%p로 3개 중 유일하게 플러스다 [판단]
→ **정점 시차**: 메모리(2Q26) = 로직·CPU(2Q26 조정 / 1Q26 보고) → 파운드리(4Q26～1Q27 예상) → 커스텀 ASIC(정점 미도래, 3Q26G +90.5%). AI 반도체 안에서 델타의 무게중심이 **메모리·GPU → 파운드리·커스텀 ASIC**으로 옮겨 가는 중 [판단]
→ 선행 서브섹터 = 메모리(Micron이 선행 종목). 로직·CPU 안 선행은 Intel → Nvidia

③ 섹터 공통 쟁점 (서브섹터 리뷰 2개 이상에 나온 것)

(1) 메모리 가격 상승의 양면 (메모리 · 로직·CPU · 파운드리)
→ 메모리: 범용 DRAM 가격이 이익 레버리지를 쥐었다(메모리 리뷰 ③(3)), 1Q27 모바일 DRAM +30～50% 인상 시도
→ 로직·CPU: 4사 모두 "메모리 가격 → PC·스마트폰 출하 감소". Intel CCPG 4Q QoQ −20% 이상, AMD C&G −20% 이상, Arm 로열티 +8%. Nvidia·AMD GPM은 HBM 원가에 눌림(Nvidia 4Q GPM 71～72%, 판가 15% 인상으로 전가)
→ 파운드리: TSMC 스마트폰 매출 YoY −1%. 메모리 확장층 HDD는 원가 전가 부담(WDC 원가 절감률 10% 하회)
→ [판단] 메모리 가격이 오를수록 섹터 안 이익이 메모리(= 한국)로 이동하고 나머지 층의 마진·물량이 깎인다. 섹터 합산 기준으로는 메모리 이익 증가($161B YoY)가 로직 소비자 부문 역풍(CPU 2사 PC 부문 영업이익 −20%)보다 압도적으로 크다. 2027 하반기 메모리 가격이 꺾이면 순서가 뒤집힌다 — 한국 반도체가 섹터 안에서 역헤지 성격이라는 잠정판 판단 유지

(2) 데이터센터 수요 > 공급 — 제약은 공급 (전 서브섹터)
→ 메모리: 2027 공급 부족 만장일치, SK하이닉스 "2029년까지 DRAM·HBM 사실상 완판". 로직: 4사 모두 "수요 > 공급", Nvidia 클라우드 수주잔고 $2.0T → $2.5T, 데이터센터 매출 Nvidia +110%·AMD +97%·Intel +78%. 파운드리: TSMC "수요 > 공급", 2027 선단 가동률 100% 초과(BofA), HPC +22% QoQ. ASIC(참고): Broadcom FY27 AI 매출 약 $115B 전망
→ [판단] 내러티브 '강화'의 근거. 수요 스토리는 모든 층에서 숫자로 확인됐다. 서브섹터 간 차이는 수요가 아니라 **기저와 가격 탄력**(누가 아직 YoY를 올릴 수 있나)에서 난다

(3) 공급망 선확보 — 장기계약과 구매 약정이 맞물린다 (메모리 · 로직·CPU)
→ 메모리: 장기계약 비중 삼성 60～70%·SK하이닉스 50%+·Micron 35%+, Micron RPO $150B. 로직: Nvidia 구매 약정 $279B → $390B(대부분 다년 메모리), AMD 재고 +$3B·패키징 장비 직접 매입
→ [판단] Nvidia의 구매 약정은 메모리 3사 장기계약의 거울이다. 메모리 이익의 하방은 받치지만(가격 밴드), 섹터 델타의 재가속은 제한한다 — 2027 섹터 이익은 "레벨 유지, 증가율 감속" 경로에 묶인다

(4) 2027 CapEx 한 단계 상승 (메모리 · 파운드리 · 로직)
→ Micron FY27 >$50B, SK하이닉스 "상당한 증가", 삼성 2027 100～108조원. TSMC 2027E US$80～90B. Intel 2027 CapEx "대폭 증액" + FCF 적자
→ [판단] 3사 메모리 "건설 먼저" + TSMC 선단 증설이 같은 해에 겹친다. 2028 말～2029 공급 증가를 예약한 것이라 2028 이익 논쟁(BNK 2028 SK하이닉스 −72% vs SK증권 증익)은 이번 분기 숫자로 끝나지 않는다

(5) 이익 상향 + 멀티플 하향 (전 서브섹터)
→ 고점 대비: SK하이닉스 −49%, 삼성 −36%, Micron 약 −22%, AMD −39%, Arm −56%, Intel 실적 후 −28.5%, Nvidia 1개월 −27%(12MF P/E 10.8배), TSMC ADR −17.9%
→ [판단] 섹터 전체가 "AI CapEx 지속성 의심"으로 디레이팅 중. 델타가 꺾인 메모리와 델타가 남은 TSMC의 낙폭 차이(−36～−49% vs −18%)는 방향은 맞지만, 델타 차이만큼 벌어지지는 않았다

### (참고) 커스텀 ASIC — 합산 제외 (12/1·12/9 실적 후 편입)

→ **합산·판정에는 넣지 않음.** BT 지시(2026-11-22): "ASIC 2개사는 12월 실적 발표라서 미리 섹터 리뷰 작성해서 추후 업데이트". 준비판(`커스텀 ASIC_섹터리뷰.md`)의 2026-Q2 판정을 인용: **가속 | 강화**, 델타 급증 후보 (BT 판단 필요), 서브섹터 확대, 1등 Broadcom
→ 2Q26 합산 Non-GAAP 영업이익 $21.1B(OPM 65.3%), YoY +51.1% → +89.2%. 증가분의 97%가 Broadcom(AI 반도체 $16.7B, +221%). 3Q26 가이던스 +90.5%(유지 경로), OPM 63.6%로 처음 하락
→ 섹터와의 관계 [판단]: 반도체 안에서 델타가 가장 위로 열린 층이다. 편입 시 섹터 3Q26 델타가 −11.4%p → 약 −5.5%p로 줄어(①(2) 민감도) 판정이 둔화/유지 경계에 선다. 순위는 파운드리와 1위 경합
→ 편입 절차: 12/1 Marvell·12/9 Broadcom 실적 리뷰(v11) → ASIC 서브섹터 리뷰 3Q26 갱신 → 이 문서 ① 합산·② 순위·⑦ 재작성. 캘린더 정렬: Broadcom FQ4 FY26·Marvell FQ3 FY27 = 2026년 8～10월 → 3Q26 (Nvidia와 같은 처리)

### (참고) 메모리 확장층 — 합산 제외

→ SanDisk(NAND, 둔화)·WDC·Seagate(HDD, 가속)는 메모리 서브섹터 리뷰 (서브) 섹션 그대로 합산 밖. HDD는 반도체 섹터에서 델타가 플러스인 마지막 메모리 층이지만 규모가 작다. 별도 레이어 판단은 BT (`메모리_섹터리뷰.md` (서브))
