→ (출처: 각 서브섹터 리뷰 상태 블록·① 표)
→ 성장률 레벨은 메모리가 압도적(+961%)이지만 **방향은 정반대** — 메모리는 정점을 지나 둔화, 파운드리는 가속. AI 반도체 안에서 델타의 무게중심이 메모리 → 파운드리(TSMC)로 옮겨 가는 중 [판단]
→ 메모리 안에서도 HDD(WDC·Seagate)는 아직 가속 — 메모리 섹터 리뷰 (서브) 층별 정점 차트 참고

③ 섹터 공통 쟁점 (서브섹터 리뷰에서 2개 이상 겹친 것)

(1) 메모리 가격 상승의 양면 — 메모리에는 이익, 로직·CPU·HDD에는 원가·수요 역풍
→ 메모리: 범용 DRAM 가격이 2026 이익을 끌었다(메모리 리뷰 쟁점 3). 로직·CPU: AMD·Intel·Arm 모두 메모리 가격 → PC·스마트폰 출하 감소(로직·CPU 리뷰 쟁점 1). HDD: WDC 원가 절감률 10% 하회. 파운드리: TSMC 스마트폰 매출 YoY −1%
→ [판단] 메모리 가격이 오를수록 한국 2사는 좋고 나머지 층은 나빠진다. 메모리 가격이 꺾이는 2027 하반기에는 순서가 뒤집힐 수 있다 — 한국 반도체가 섹터 안에서 역(逆)헤지 성격

(2) 데이터센터 수요 > 공급 (전 서브섹터 공통)
→ 메모리 2027 공급 부족 만장일치, 서버 CPU 수요 > 공급, TSMC "수요 > 공급, AI CAGR 아마 더 높아질 것"
→ [판단] 수요 스토리는 모든 층에서 숫자로 확인 — 내러티브 '강화'의 근거. 차이는 **누가 아직 가격·물량을 더 올릴 수 있나**에서 난다

(3) 이익 상향 + 멀티플 하향 (전 서브섹터 공통)
→ 한국 2사 고점 대비 SK하이닉스 −49%, 삼성 −36%. AMD −39%, Arm −56%, TSMC ADR −8%(발표 후), Micron 약 −22%
→ [판단] 섹터 전체가 "AI CapEx 지속성 의심"으로 디레이팅 중. 이익이 꺾인 층(메모리)과 안 꺾인 층(파운드리)의 낙폭 차이가 아직 작다 — 델타 차이가 주가에 덜 반영됐다

④ 섹터 판정 (한국 기준 · 잠정)

→ 내러티브 근거: SK하이닉스·삼성전자 리뷰 모두 '강화'(장기계약 50～70%, 2027 공급 부족, HBM4 경쟁력). 서브섹터 내러티브도 강화 2(메모리·파운드리)·유지 1(로직·CPU) — 수요 스토리는 훼손되지 않았다
→ 직전 판정 대비: 첫 통합 리뷰. 소급 궤적 = 꺾임(2Q25) → 가속 4분기 연속(3Q25～2Q26) → **둔화(3Q26)**

⑤ 모멘텀 신호

→ 메모리 섹터 리뷰의 BT 판단(2026-11-01)을 그대로 따른다: **에이전트AI 테마 유지, 메모리 레이어 모멘텀 종료(2026-Q3)**. 한국 반도체 = 메모리라서 한국 기준 섹터 신호도 같다
→ 파운드리(가속·강화)는 델타 급증 후보 조건 일부만 충족(가속은 대만달러 약세 효과가 커 달러 기준은 고원) — 후보로 올리지 않음 (파운드리 섹터 리뷰 ⑤)
→ 반대 논거: 삼성전자 4Q26 QoQ +24% 재가속, 1Q27 모바일 DRAM +30～50% 인상 — 4Q26 2사 합산이 316조원(+705%)을 넘으면 '유지'로 돌아선다. 다만 컨센(235조원)과 격차가 커 가능성은 낮다 [판단]

(1) 섹터 비중 — 중립 (잠정)

| 판단 축 | 근거 | 방향 |
|---|---|---|
| 이익 델타 (1순위) | 한국 2사 둔화(−270%p), 서브섹터는 가속 1·유지 1·둔화 1 | 중립 |
| YoY 정점 | 메모리 2Q26 통과, 파운드리 4Q26～1Q27 예상, 로직·CPU 미확정(Nvidia 대기) | 중립 |
| 최종 수요 | 데이터센터 수요 > 공급 — 전 서브섹터 공통 | 확대 |
| 밸류에이션 (2순위) | 이익 상향 + 멀티플 하향, 고점 대비 −8～−56% | 중립 |

→ 섹터 베타는 중립, 섹터 안에서 비중을 메모리 → 파운드리로 옮기는 구간. Nvidia가 들어오면 섹터 비중 판단이 바뀔 수 있다
