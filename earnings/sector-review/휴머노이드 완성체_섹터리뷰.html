③ 섹터 공통 쟁점

(1) **이익 역성장의 원인 = 비용 투입** — Unitree·레인보우·Tesla·UBTech
(1-1) Unitree R&D +249.6% YoY(매출 대비 19.1%), 레인보우 3Q 인건비 4.6배·판관비 +68%(임직원 161 → 247명), Tesla R&D +69%·주식보상 +76%, UBTech는 1H26 적자 축소 속도가 2H25보다 느려짐 (각 리뷰)
(1-2) [판단] 휴머노이드 완성체는 지금 "매출은 늘고 이익은 줄어드는" 투자 국면이다. 매출 YoY는 Unitree +70%·레인보우 +30%·UBTech +104%로 빠르지만, 이익 델타 기준으로는 3사 모두 꺾임·둔화 — BT 프레임(이익 델타)에서는 매매 대상 종목이 없다

(2) **양산·인도 지연** — UBTech·레인보우·Tesla·현대차
(2-1) UBTech 광시 공장 2\~3개월 지연 / 레인보우 RB-Y1 1H 수출 65억 → 3Q 0.6억(RB-Y2 전환 공백) / Tesla Optimus 주 2만 대는 "최소 1년", 외부 인도 2027년 말 / 현대차 BD 아틀라스는 2028년 연 3만 대 계획, 로봇생산법인·BD 1조원+ 제3자 유증은 연말 예정 (각 리뷰)
(2-2) [판단] 모든 완성체의 매출 램프 시점이 2027년 하반기 이후로 밀려 있다. 2026년 휴머노이드 매출은 연구·교육·데모 수요라 분기마다 출렁인다(레인보우 휴머노이드 매출 비중 40.5% → 13.5%)

(3) **가격 하락 속 마진 방어** — Unitree·UBTech
(3-1) Unitree 휴머노이드 평균단가 26.0 → 16.6만위안(2024 → 2025), GPM 62.0% → 50.6% / UBTech 풀사이즈 평균단가 84.9 → 64.1만위안인데 GPM 66.8% (각 리뷰)
(3-2) [판단] 중국 완성체는 단가를 내리며 물량을 키우는 중 — 피지컬AI 테마분석의 "완제품 레이어 D(중국 F 전조)" 진단과 같은 방향

(4) **TP 하향 = 멀티플** — 현대차
(4-1) 현대차 원문 7곳 TP 57.8만 → 48.8만(-15.6%), 하향 6·유지 4·상향 0, 하향 원인은 Target P/E -25% 등 멀티플 (현대차 리뷰). 중국 2사·레인보우는 셀사이드 편차 비교 불가(첨부 0\~1건)

→ 종목 고유 이슈: 현대차 — 2027년 감익(삼성·메리츠 -8%) vs 하반기 증익(상상인 +14%) 논쟁 / 레인보우 — 삼성향 용역 75억이 매출을 메움, 4Q 흑자 계절성(4Q25 +17억) / Unitree — 제품별 분기 공시 없음 / UBTech — 매출채권 22.25억위안(1년 초과 7.67억)

(2) 같은 서브섹터 안 한국 vs 글로벌 — 중립 [판단]

| 경쟁력 축 | 한국 (현대차·레인보우) | 글로벌 (Unitree·UBTech, 참고 Tesla) | 우위 |
|---|---|---|---|
| 델타 방향 (1순위) | 현대차 가속(⚠ 비영업), 레인보우 꺾임(악화) | Unitree 꺾임, UBTech 둔화(1H), Tesla 꺾임 | 보고 기준 한국 / 질 기준 동률 |
| 마진 레벨 | 레인보우 OPM -12.8% | Unitree OPM 16.6%, UBTech -22.0%(1H) | 중국(Unitree) |
| 매출 성장 | 레인보우 +30.1% | Unitree +69.9%, UBTech +104.2% | 중국 |
| 휴머노이드 매출 | 레인보우 19억/분기(비중 13.5%), 현대차 0(BD 지분법) | Unitree 2025 휴머노이드 8.68억위안(5,215대), UBTech 1H26 풀사이즈 5.90억위안 | 중국 |
| 양산 시점 | BD 아틀라스 2028년 연 3만 대 계획 | Unitree·UBTech 이미 수천 대 출하, Tesla 외부 인도 2027년 말 | 중국 |
| 이익 추정 방향 | 현대차 2027E 컨센 -4.3% 하향, 레인보우 2027E 흑자전환(유진 1곳) | 공개 컨센 없음 | 판단 불가 |

→ 결론: **중립** — 이유 ① 델타: 보고 기준 한국이 앞서지만 그 원천(현대차 보증비 환입)은 로봇과 무관 ② 순수 플레이 비교: 레인보우 적자 확대 vs Unitree 흑자 감익 — 둘 다 꺾임이지만 마진 레벨·출하 규모는 중국 우위 ③ 구조: 한국은 "완성체 지분(BD) + 대기업 협력(삼성-레인보우)" 모델, 중국은 출하 기반 — 실적 비교는 중국이 유리, 이벤트 레버리지는 한국이 크다
→ 반대 논거: 현대차 연말 로봇생산법인·BD 유증은 한국 쪽에만 있는 이벤트 — 이벤트 프레임이면 한국 아웃퍼폼 가능
→ 비교 범위: 한국 2사 실적 리뷰(현대차 셀사이드 10건 풀) / 중국 2사 숫자 중심 리뷰(셀사이드 0건). UBTech는 반기 숫자라 분기 델타 비교에서 제외 — **근거 얇음**(중국 쪽 셀사이드 부재)

(3) 서브섹터 1등 종목
→ **1등 현대차** — 가속·약화. 서브섹터에서 유일한 보고 기준 가속이지만 ⚠ 판매보증비 환율효과·관세 기저, 본업 감익. "로봇주"가 아니라 자동차 사이클 + BD 옵션
→ **글로벌 1등 — 해당 없음(델타 기준)**: Unitree 꺾임(분기 표본 유일, 흑자·매출 +70%), UBTech 둔화(1H 반기 기준 참고상 Unitree보다 덜 나쁨)
→ 비선호: 레인보우로보틱스 — 꺾임(악화)·유지. **반등 후보 (이벤트 드리븐)**: 레인보우 — 확인 이벤트 CES 2027 삼성 휴머노이드 공개 + 4Q 흑자 17억 초과

### (서브) Tesla — 어떻게 되고 있나

→ **합산·판정에는 넣지 않음** — Tesla 단독 판정 `꺾임 | 유지 → 숫자 기준 매매 제외 구간, 주가는 이벤트(Optimus·합병·EU FSD)로 움직이는 국면` (`2026-Q3_TSLA_리뷰.md`)
→ 제외 이유: ① 실적 리뷰의 주 섹터가 미국 빅테크·소비자·모빌리티라 그 섹터 리뷰에 이미 합산 — 중복 합산 금지 ② Optimus 매출 0(외부 인도 2027년 말) ③ 영업이익 10,188억원(3Q26, 고정환율)으로 넣으면 서브섹터 합산의 27%가 되어 "자동차 2사 합산"이 된다 [계산]
→ 3Q26 영업이익 $718M(-55.8%), 2개 분기 연속 -56\~57% — 현대차와 같은 자동차 사이클이지만 방향은 반대(현대차는 관세 기저로 플러스 전환). R&D +69%의 상당 부분이 Optimus·AI
→ 휴머노이드 관점: Optimus는 프리몬트에서 초기 생산 개시(양산 품질), 주 2만 대까지 "최소 1년" — 완성체 양산 램프가 2027년 하반기 이후라는 점에서 현대차 BD(2028)·UBTech(2H26 램프 지연)와 같은 시간표
→ 주가: 실적 후 10/27 $407(발표 전 +5.4%) — 이익 델타와 주가가 가장 무관한 종목. 휴머노이드 이벤트의 글로벌 기준점으로만 본다
