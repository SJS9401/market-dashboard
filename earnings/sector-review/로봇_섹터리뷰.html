> 최신 분기: 2026-Q3
> 섹터 델타: 꺾임 | 내러티브: 약화
> 모멘텀 신호: 없음
> 활성 테마: 없음
> 포지셔닝: 섹터 축소 | 한국 언더퍼폼 | 선호 Leaderdrive, 현대모비스
> 델타 근거: 보고 반등은 환입·관세 기저라 불인정 → 4Q 컨센도 기저발
> 내러티브 근거: 약화 종목이 다수, 로봇 옵션 가치가 멀티플 하향으로 깎이는 중
> PM 근거: 본업 꺾임으로 축소, 한국은 세 서브섹터 모두 글로벌에 열위
> 편입 종목: 합산 9사 — 휴머노이드 완성체(현대차, 레인보우로보틱스, Unitree) + 로봇 부품(현대모비스, Leaderdrive, 로보티즈) + 산업·물류 자동화(현대오토에버, 두산로보틱스, Symbotic). 합산 제외: UBTech(반기), Sanhua·Tuopu(BT 결정), Tesla(확장), 에스비비테크·Teradyne(트래킹)

→ 이유 3개: ① 델타 — 비영업 제외 한국 약 -28% vs 중국 -10.5% vs 미국 가속(Symbotic), 한국 순수 3사 적자 확대 ② 이익 추정 — 한국 대형 3사 TP 멀티플 하향·현대차 2027E -4.3%, 로보티즈 4Q 컨센 -67% / 중국은 공개 컨센 없음(Leaderdrive 4Q 역산 +98\~192%) ③ 구조 — 한국 로봇 이익은 그룹 수직계열(BD 지분법-모비스-오토에버) 안에 묻혀 숫자로 안 잡히고, 중국은 출하·가격 경쟁력으로 흑자
→ 반대 논거: 미국 공급망 규제(비중국 관절 프리미엄)가 구체화되면 한국(모비스 미국 연 30만 개 액추에이터 계획) 아웃퍼폼 — 이벤트 프레임이면 한국 쪽 레버리지가 크다. 델타 프레임 결론이며 이벤트 프레임이면 반대일 수 있다
→ **예외 종목: 현대모비스** — 한국 안에서 유일하게 인정되는 가속(본업, 인수·환입 아님) + 로봇 액추에이터 실행(31종 시제품). 다만 로봇 순수도 0%, 컨센상 3Q26이 YoY 정점
→ 비교 범위: 한국 6사 실적 리뷰(대형 3사 셀사이드 8\~10건 풀, 소형 3사 0\~5건) / 중국 2사(+UBTech·Sanhua·Tuopu) 숫자 중심 리뷰, 셀사이드 0건 / 미국 1사(Symbotic, 숫자 중심, 셀사이드·컨콜 0건) + 트래킹 Teradyne — **글로벌 쪽 근거 얇음** (미국 편입 후보: 산업·물류 KION·AutoStore는 유럽 — BT 판단)

### (서브) UBTech — 어떻게 되고 있나

→ **3Q 합산·판정에는 넣지 않음** — 반기 공시(최신 1H26). 단독 판정 `둔화 | 약화 → 경계 구간 (2H26 매출 22\~27억위안 달성 확인 전까지)` (`2026-Q2_9880.HK_리뷰.md`, 3Q 분기 업데이트 덧붙임 없음)
