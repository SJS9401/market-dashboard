③ 섹터 공통 쟁점

(1) **로봇 매출이 합산에 안 잡힌다** — 현대차·모비스·오토에버·Sanhua·Tuopu·Tesla
(1-1) 섹터 영업이익의 99.6%를 내는 현대차 계열 3사의 로봇 매출은 0에 가깝다(BD 지분법, 액추에이터 시제품 실비, 로봇 SI 미분리). 로봇 매출이 의미 있는 시점은 셀사이드 공통으로 2027 설비·2028 양산 (각 리뷰)
(1-2) [판단] 로봇 섹터 합산 델타는 2027년까지 "현대차 그룹 자동차 사이클 + 순수 로봇 적자 변화"의 합이다. 섹터 판정과 별개로 순수 로봇 5사 델타를 함께 보는 이중 프레임이 필요하다 — 이번 분기는 둘이 반대 방향(보고 합산 가속 vs 순수 꺾임) — BT 2026-11-23 결정으로 섹터 판정은 비영업 제외 기준(꺾임(악화))

(2) **매출은 빠르고 이익은 역성장 — 투자 국면** — Unitree·레인보우·로보티즈·두산로보틱스·UBTech·Tesla
(2-1) 순수 로봇 5사 매출 YoY +61.7%(3Q26) vs 영업이익 -26.9% [계산]. Unitree R&D +250%, 레인보우 인력 1.5배, 로보티즈 판관비 +68%, 두산 판관비 동반 증가, Tesla R&D +69% (각 리뷰)
(2-2) [판단] 피지컬AI 테마분석의 "수요 폭증 × 공급 증가(D)" 진단이 이익에서 확인된다 — 수요는 매출로 오는데 경쟁·투자가 이익을 다 먹는다

|---|---|---|---|---|
| 휴머노이드 완성체 | 현대차 보고 +26.4%p / 보증비 제외 약 -22%p(유지 — 가속 불인정), 레인보우 축소율 -147.8%p(꺾임(악화)) | Unitree -24.5%p(꺾임, 흑자), UBTech 축소율 +8.1%p(둔화, 1H — 비교 제외) | 글로벌 (덜 나쁨·마진 우위) | 99.1% |

→ 결론: **한국 언더퍼폼 = 믹스 효과 한국에 불리(크다) + 서브섹터 내 효과 한국에 불리(휴머노이드·부품)**. 한국 이익은 비영업 제외 시 꺾임(악화)인 휴머노이드(현대차)에 몰려 있고(믹스), 같은 서브섹터 안에서도 휴머노이드는 Unitree가 덜 나쁘고 부품은 Leaderdrive가 로보티즈를 이긴다(서브섹터 내)

→ 반대 논거: 미국 공급망 규제(비중국 관절 프리미엄)가 구체화되면 한국(모비스 미국 연 30만 개 액추에이터 계획) 아웃퍼폼 — 이벤트 프레임이면 한국 쪽 레버리지가 크다. 델타 프레임 결론이며 이벤트 프레임이면 반대일 수 있다
→ **예외 종목: 현대모비스** — 한국 안에서 유일하게 인정되는 가속(본업, 인수·환입 아님) + 로봇 액추에이터 실행(31종 시제품). 다만 로봇 순수도 0%, 컨센상 3Q26이 YoY 정점
→ 비교 범위: 한국 6사 실적 리뷰(대형 3사 셀사이드 8\~10건 풀, 소형 3사 0\~5건) / 중국 2사(+UBTech·Sanhua·Tuopu) 숫자 중심 리뷰, 셀사이드 0건 / 미국 편입 종목 없음(Symbotic 발표 전) — **글로벌 쪽 근거 얇음**

→ 다음 손익: 2026 연간 실적(2027-03 말) — 2H26 영업적자 -1.89억위안 이하면 가속

### (서브) Tesla — 어떻게 되고 있나

→ **합산·판정에는 넣지 않음** — 단독 판정 `꺾임 | 유지 → 숫자 기준 매매 제외 구간` (`2026-Q3_TSLA_리뷰.md`). 주 섹터(미국 빅테크·소비자·모빌리티)에 이미 합산되고 Optimus 매출 0 — 상세는 `휴머노이드 완성체_섹터리뷰.md` (서브) 섹션
