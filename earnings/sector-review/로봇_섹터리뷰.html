③ 섹터 공통 쟁점

(1) **로봇 매출이 합산에 안 잡힌다** — 현대차·모비스·오토에버·Sanhua·Tuopu·Tesla
(1-1) 섹터 영업이익의 99.6%를 내는 현대차 계열 3사의 로봇 매출은 0에 가깝다(BD 지분법, 액추에이터 시제품 실비, 로봇 SI 미분리). 로봇 매출이 의미 있는 시점은 셀사이드 공통으로 2027 설비·2028 양산 (각 리뷰)
(1-2) [판단] 로봇 섹터 합산 델타는 2027년까지 "현대차 그룹 자동차 사이클 + 순수 로봇 적자 변화"의 합이다. 섹터 판정과 별개로 순수 로봇 5사 델타를 함께 보는 이중 프레임이 필요하다 — 이번 분기는 둘이 반대 방향(합산 가속 vs 순수 꺾임)

(2) **매출은 빠르고 이익은 역성장 — 투자 국면** — Unitree·레인보우·로보티즈·두산로보틱스·UBTech·Tesla
(2-1) 순수 로봇 5사 매출 YoY +61.7%(3Q26) vs 영업이익 -26.9% [계산]. Unitree R&D +250%, 레인보우 인력 1.5배, 로보티즈 판관비 +68%, 두산 판관비 동반 증가, Tesla R&D +69% (각 리뷰)
(2-2) [판단] 피지컬AI 테마분석의 "수요 폭증 × 공급 증가(D)" 진단이 이익에서 확인된다 — 수요는 매출로 오는데 경쟁·투자가 이익을 다 먹는다

(3) **양산·공급 지연** — UBTech(광시 공장), 로보티즈(모터·희토류), 레인보우(RB-Y2 전환 공백), Tesla(Optimus 램프), 모비스(대량 양산 2029년 이후 — 메리츠)

→ 보고 델타는 가속이라 축소할 숫자 근거는 없지만, 가속의 원천이 로봇이 아니고(순수도 0.4%) 순수 로봇은 꺾였다 → **중립**. 이 섹터는 이익 델타보다 이벤트로 움직이는 구간이고, BT 프레임(델타 증가 구간에서만 매매)에서는 섹터 베타 매수 근거가 없다

**서브섹터 × 국가**

| 서브섹터 | 한국 (종목 · 영업이익 YoY 델타) | 글로벌 (종목 · 영업이익 YoY 델타) | 서브섹터 내 우위 | 한국 이익 비중 |
|---|---|---|---|---|
| 휴머노이드 완성체 | 현대차 +26.4%p(가속 ⚠), 레인보우 축소율 -147.8%p(꺾임(악화)) | Unitree -24.5%p(꺾임), UBTech 축소율 +8.1%p(둔화, 1H — 비교 제외) | 보고 기준 한국 / 질·마진 기준 중국 → 동률 | 99.1% |
| 로봇 부품 | 모비스 +5.1%p(가속), 로보티즈 적자전환(꺾임) | Leaderdrive +46.5%p(가속), Sanhua -2.2%p·Tuopu +30.7%p(둘 다 꺾임, 합산 제외) | 글로벌 (Leaderdrive) | 98.8% |

→ 결론: **한국 중립 = 믹스 효과 한국에 유리(크다) + 서브섹터 내 효과 한국에 불리(부품) / 동률(휴머노이드)**. 한국은 보고 가속이 나온 휴머노이드(현대차)에 이익이 몰려 있어 합산으로는 이기지만, 그 가속은 로봇과 무관한 비영업발이다. 같은 순수 로봇끼리 비교하면 한국 3사는 적자 확대(꺾임), 중국 2사는 흑자 감익(꺾임)이고, 부품 안에서는 Leaderdrive가 로보티즈를 이긴다
→ 이유 3개: ① 델타 — 보고 기준 한국 +8.0%(가속) vs 중국 -10.5%(꺾임), 순수 로봇 기준 양국 모두 꺾임 ② 이익 추정 — 한국 대형 3사 TP 멀티플 하향·현대차 2027E -4.3%, 로보티즈 4Q 컨센 -67% / 중국은 공개 컨센 없음(Leaderdrive 4Q 역산 +98\~192%) ③ 구조 — 한국은 "그룹 내 수직계열(BD-모비스-오토에버) + 미국 현지 생산" 이벤트 레버리지, 중국은 출하·가격 경쟁력
→ 반대 논거: 미국 공급망 규제(비중국 관절 프리미엄)가 구체화되면 한국(모비스 미국 연 30만 개 액추에이터 계획) 아웃퍼폼 — 이벤트 프레임이면 한국 쪽 레버리지가 크다. 델타 프레임 결론이며 이벤트 프레임이면 반대일 수 있다
→ **예외 종목: 현대모비스** — 한국 안에서 본업(인수·환입 아님) 가속 + 로봇 액추에이터 실행(31종 시제품). 다만 로봇 순수도 0%, 컨센상 3Q26이 YoY 정점
→ 비교 범위: 한국 6사 실적 리뷰(대형 3사 셀사이드 8\~10건 풀, 소형 3사 0\~5건) / 중국 2사(+UBTech·Sanhua·Tuopu) 숫자 중심 리뷰, 셀사이드 0건 / 미국 편입 종목 없음(Symbotic 발표 전) — **글로벌 쪽 근거 얇음**. 미국 휴머노이드·로봇 상장 피어가 거의 없어 국가 구멍은 Symbotic 편입으로 일부만 메워진다
