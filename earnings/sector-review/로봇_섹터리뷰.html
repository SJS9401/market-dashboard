> 현재 상태 (최신 분기 기준)
> 최신 분기: 2026-Q3
> 섹터 델타: 꺾임 | 내러티브: 약화
> 모멘텀 신호: 없음
> 활성 테마: 없음
> 포지셔닝: 섹터 축소 | 한국 언더퍼폼 | 선호 Leaderdrive, 현대모비스
> 델타 근거: 보고 반등은 환입·관세 기저라 불인정 → 4Q 컨센도 기저발
> 내러티브 근거: 약화 종목이 다수, 로봇 옵션 가치가 멀티플 하향으로 깎이는 중
> PM 근거: 본업 꺾임으로 축소, 한국은 세 서브섹터 모두 글로벌에 열위
> 편입 종목: 합산 9사 — 휴머노이드 완성체(현대차, 레인보우로보틱스, Unitree) + 로봇 부품(현대모비스, Leaderdrive, 로보티즈) + 산업·물류 자동화(현대오토에버, 두산로보틱스, Symbotic). 합산 제외: UBTech(반기), Sanhua·Tuopu(BT 결정), Tesla(확장), 에스비비테크·Teradyne(트래킹)
> 갱신 시각: 2026-11-24 13:10 KST (v3.1 — Symbotic 편입 9사 + BT 2026-11-24 "델타는 항상 % 기준": 증감액 판정 폐기, 산업·물류 둔화로 재판정)

→ **환율 (고정, 3Q26 평균)**: $1 = 1,419원, RMB 1 = 211원 — 엔터 섹터 리뷰와 같은 값(한국은행 원/달러 MBW 인용, 위안은 TME 3Q26 역산 교차환율). 전 분기 같은 환율 적용(YoY에 환율 효과 없음), 괄호 달러도 같은 환율 [계산]. 3Q26 합산에서 위안 종목(Unitree·Leaderdrive)은 영업이익의 0.9%라 환율 선택이 판정에 주는 영향은 없다
→ **3Q26 행 = 9사** (Symbotic 편입, 2026-11-24). 과거 행(4Q24\~2Q26)은 8사 기준 그대로 두고 정정하지 않는다 — 9사 동일 표본 YoY는 4Q25 -28.4%, 1Q26 -24.5%, **2Q26 -12.1%**(8사 -13.8%), 3Q26 +10.6%. 3Q26 델타 +22.7%p는 9사 2Q26(-12.1%) 대비 [계산]. Symbotic은 GAAP 영업이익(캘린더 분기 정렬, 3Q26 = FQ4 26)을 같은 고정 환율로 환산
→ **합산 방식**: 서브섹터 리뷰 3개(`휴머노이드 완성체_섹터리뷰.md`, `로봇 부품_섹터리뷰.md`, `산업·물류 자동화_섹터리뷰.md`)의 합산을 더했다 — 종목 중복 없음(현대차 계열 3사는 각자 한 서브섹터에만). 동일 표본: Unitree는 YoY 1Q26부터 편입
→ **이익 비중 (3Q26, 9사)**: 현대차 계열 3사(현대차·모비스·오토에버) 36,602억원 = **97.5%** / Symbotic 776억원(2.1%) / 순수 로봇 5사(레인보우·Unitree·Leaderdrive·로보티즈·두산로보틱스) 164억원(0.4%) [계산] — **섹터 합산 델타는 로봇이 아니라 자동차·자동차 부품·그룹 IT 사이클을 반영한다.** BT가 핵심으로 지정해 합산에 넣었지만, 판정 해석은 아래 "로봇 순수도" 표와 함께 봐야 한다
→ **4Q26E 표본**: 컨센이 있는 5사(현대차·레인보우·모비스·로보티즈·오토에버), 4Q25도 같은 5사 [계산]

→ 결론: **한국 언더퍼폼 = 믹스 효과 한국에 불리(크다) + 서브섹터 내 효과 한국에 불리(세 서브섹터 모두 — 휴머노이드·부품·산업·물류)**. Symbotic 편입으로 산업·물류 칸이 "보류" → "글로벌 우위"로 채워졌다. 한국 이익은 비영업 제외 시 꺾임(악화)인 휴머노이드(현대차)에 몰려 있고(믹스), 같은 서브섹터 안에서도 휴머노이드는 Unitree가 덜 나쁘고 부품은 Leaderdrive가 로보티즈를 이긴다(서브섹터 내)
→ 이유 3개: ① 델타 — 비영업 제외 한국 약 -28% vs 중국 -10.5% vs 미국 가속(Symbotic), 한국 순수 3사 적자 확대 ② 이익 추정 — 한국 대형 3사 TP 멀티플 하향·현대차 2027E -4.3%, 로보티즈 4Q 컨센 -67% / 중국은 공개 컨센 없음(Leaderdrive 4Q 역산 +98\~192%) ③ 구조 — 한국 로봇 이익은 그룹 수직계열(BD 지분법-모비스-오토에버) 안에 묻혀 숫자로 안 잡히고, 중국은 출하·가격 경쟁력으로 흑자
→ 반대 논거: 미국 공급망 규제(비중국 관절 프리미엄)가 구체화되면 한국(모비스 미국 연 30만 개 액추에이터 계획) 아웃퍼폼 — 이벤트 프레임이면 한국 쪽 레버리지가 크다. 델타 프레임 결론이며 이벤트 프레임이면 반대일 수 있다
→ **예외 종목: 현대모비스** — 한국 안에서 유일하게 인정되는 가속(본업, 인수·환입 아님) + 로봇 액추에이터 실행(31종 시제품). 다만 로봇 순수도 0%, 컨센상 3Q26이 YoY 정점
→ 비교 범위: 한국 6사 실적 리뷰(대형 3사 셀사이드 8\~10건 풀, 소형 3사 0\~5건) / 중국 2사(+UBTech·Sanhua·Tuopu) 숫자 중심 리뷰, 셀사이드 0건 / 미국 1사(Symbotic, 숫자 중심, 셀사이드·컨콜 0건) + 트래킹 Teradyne — **글로벌 쪽 근거 얇음** (미국 편입 후보: 산업·물류 KION·AutoStore는 유럽 — BT 판단)
