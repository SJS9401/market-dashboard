→ 서브섹터 안 델타를 끄는 곳은 플랫폼 HPC 단독이다 — HPC 매출 YoY(US$) +47% → +68%, 스마트폰 +9% → −1% (TSMC 리뷰 1-②(1) [계산]). 노드로는 2nm+3nm 매출 US$19.2B(+152% YoY)

③ 섹터 공통 쟁점

> 편입 종목이 1개라 "2개 종목 이상 공통 쟁점"은 성립하지 않는다. 아래는 TSMC 쟁점 4개를 그대로 쓰고, 같은 분기 다른 리뷰(Intel·삼성전자·AMD·ARM)에서 같은 쟁점이 어떻게 보였는지 교차 확인한 것이다

(1) AI 수요 > 공급 — 고객 측 리뷰도 "제약은 공급"

| 리뷰 | 같은 쟁점이 어떻게 나왔나 |
|---|---|
| TSMC | "수요 둔화 신호 없음, 자체 평가 수요 > 공급", 2027 선단 가동률 100% 초과(BofA). HPC +22% QoQ (TSMC 리뷰 2-2(1)) |
| AMD | 2027 매출 +80% 가이던스, "수요가 공급보다 많다 — 웨이퍼·기판·어드밴스드 패키징·메모리를 함께 계획", 웨이퍼 투입이 매출로 이어지는 데 약 6개월(Citi). 증권사 8/8이 "제약은 수요가 아니라 공급" (`2026-Q3_AMD_리뷰.md` 2번 쟁점 1) |
| Intel | 서버 CPU TAM 5배·2028까지 공급 부족, 다만 인텔 자체 공급 제약이 DCAI 성장을 묶음 (`2026-Q3_INTC_리뷰.md`) |
| ARM | AGI CPU 출시, TSMC·삼성전자 등과 추가 부품 공급 계약 (`2026-Q3_ARM_리뷰.md`, NH) |

→ **[판단]** 고객 측(AMD 2027 +80%, 인텔 서버 TAM 5배)의 수요 가이던스는 TSMC가 말한 "수요 > 공급"과 같은 방향이다. AMD의 "웨이퍼 투입 → 매출 6개월"은 TSMC 매출이 고객 매출을 2분기가량 앞선다는 뜻이라, 고객 2027 가이던스가 꺾이기 전에는 파운드리 물량 델타가 먼저 꺾일 근거가 약하다. 위험은 수요가 아니라 TSMC 리뷰가 짚은 "HPC 한 곳 집중"이다

(2) 마진 희석 — 선단 램프 + 해외 팹 (TSMC 고유이지만 경쟁사와 레벨 차이가 결론)
→ TSMC: GPM 66.4%(−1.3%p QoQ), 해외 팹 희석 2026 약 2%p → 향후 수년 3～4%p, 2027 OPM 추정 FactSet 55.8% vs BofA 60.8% (TSMC 리뷰 2-2(2))
→ Intel Foundry: OPM −45.0% → −36.2% → −27.7%로 3개 분기 연속 개선, 18A 원가 1Q 대비 −40% (`2026-Q3_INTC_리뷰.md` 1-②)
→ 삼성 S.LSI·Foundry: 3Q 적자 지속(영업손실 약 −1.3～−2.0조원 [추정, 메리츠·DS투자·BNK]), 8나노 이하 Full capa·HBM4 베이스 다이로 적자 축소 중 (`2026-Q3_삼성전자_리뷰.md` 1-②)
→ **[판단]** 경쟁사가 "적자를 줄이는" 단계에서 TSMC는 OPM 58.7%로 희석 논쟁을 한다. 희석 3～4%p가 다 들어와도 OPM 50%대 중반 — 파운드리 서브섹터 안에서 마진 축의 순위는 바뀌지 않는다

(3) CapEx 한 단계 상승 — 2027 US$80～90B
→ TSMC: 2026 US$60～64B 유지, 이사회 예산 +116% YoY, BofA 2027E US$80～90B, "매출 성장률 > CapEx 증가율" (TSMC 리뷰 2-2(3))
→ 삼성전자: 2027 CapEx 108조원(2026 84.2조원, 유안타) — "파운드리 보유로 자본집약도 높음", 美 Taylor 첫 팹 2027 가동 (`2026-Q3_삼성전자_리뷰.md`)
→ **[판단]** 파운드리 공급 측 증설은 TSMC(선단 N3 신규 팹 3곳·애리조나 2팹 3Q27 앞당김)와 삼성(Taylor 2027)이 같은 해에 겹친다. 다만 삼성 2nm 수주는 "고객명·규모 미공개, 적자 지속"(삼성 리뷰 2-0)이라 2027 가격 경쟁 변수로 보기엔 이르다

(4) 2027 가이던스 공백 — 주가가 실적과 어긋남
→ TSMC: 비트·레이즈에도 ADR US$422.3(10/15) → US$388.62(11/10) −8.0%, EPS 컨센 2027E는 +4% 상향 → "실적 하향이 아니라 멀티플 압축" (TSMC 리뷰 2-2(4)·2-4)
→ 같은 분기 AI 공급 측 전반(메모리 3사 고점 대비 −22～−49%, `메모리_섹터리뷰.md` ⑤)에서 나타난 "숫자는 좋은데 주가는 빠진다" 흐름과 같은 모양
→ **[판단]** 파운드리는 메모리와 달리 델타가 꺾이지 않았는데 주가가 같이 빠졌다 — 델타 프레임에서는 파운드리가 AI 공급 측 안에서 상대적으로 유리한 자리다

(5) 종목 고유 이슈
→ 환율: 대만달러 약세가 NT$ 델타를 부풀림 (3Q 격차 +11.3%p) — 판정 라벨(가속 vs 유지)이 환율에 걸려 있다
→ 스마트폰 YoY −1%: "가격 민감 소비자 수요 둔화", 1Q27 비수기가 시험대 (TSMC 리뷰 1-②)
→ Section 232 반도체 관세 최종 세율, 인텔 14A·삼성 2nm 외부 대형 수주 (TSMC 리뷰 3-⑤)

④ 섹터 판정

> 섹터 델타: **가속** | 내러티브: **강화** → **파운드리(= TSMC)는 AI 공급 측에서 델타가 아직 위로 열린 레이어 — NT$ 영업이익 YoY +75%로 이번 사이클 최고지만 가속분의 대부분은 환율이고 달러 기준은 +63%대 고원이다. 적극 구간 유지, 정점은 4Q26～1Q27. 4Q26 NT$ 영업이익 YoY 70% 미만이면 둔화**

→ **결론: 서브섹터 확대** [판단]. 반도체 안에서 메모리가 정점을 지난(3Q26 둔화) 반면 파운드리는 아직 오르고 있다 — 델타 1순위 프레임에서 AI 공급 측 비중을 메모리에서 파운드리로 옮기는 근거다. 가속 라벨이 환율에 기댄 점은 알지만, 환율을 빼도 +60%대 고원이 4개 분기째라 "축소" 근거는 없다
→ 델타 방향과 정점 시점이 엇갈리는 지점: 3Q26 가속 확인 분기가 컨센상 정점 1～2분기 전이다. 확대는 1월 2027 가이던스까지의 콜이다

→ **축소 조건**: 4Q26 둔화 + 1Q27 가이던스 QoQ 마이너스(2개 분기 연속 둔화 경로 = 꺾임)

(2) 같은 서브섹터 안 한국 vs 글로벌

→ **한국: 비교 불가 — 편입 종목 없음.** 삼성전자 파운드리는 실적을 따로 공시하지 않는다. 삼성전자 리뷰의 "S.LSI·Foundry" 숫자는 매출 약 6.3조원(키움 추정)·영업손실 약 −1.3～−2.0조원(메리츠·DS투자·BNK 추정)뿐이고, 삼성전자는 이미 메모리 서브섹터에 DS(메모리) 기준으로 들어가 있다. 한국 국가 판단은 결론에서 뺀다
→ **대체 대비 축: 선단 파운드리 1위(TSMC) vs 추격자(Intel Foundry)** — 트래킹 비교. Intel Foundry는 로직·CPU 서브섹터(Intel)의 부문 숫자라 합산에 넣지 않는다

→ **결론**: 서브섹터 내 대비는 TSMC 일방 우위. Intel Foundry의 유일한 우위는 "마진 방향"인데, 레벨이 −27.7%라 델타 프레임 비교 대상이 아니다 [판단]
→ **비교 범위**: 글로벌 편입 TSMC 1개(풀 리뷰) + 트래킹 Intel Foundry 1개(인텔 리뷰 부문 숫자). 한국 비교 없음, 성숙 노드 비교 없음 — 근거 얇음
→ **편입 후보 제안 (BT 판단)**
→ Intel Foundry: 워치리스트 파운드리 행 `트래킹 피어` 열에 등재 제안 — 이미 인텔 리뷰에 부문 숫자가 있어 추가 작업 없이 (트래킹) 표 갱신 가능
→ UMC·GlobalFoundries: **성숙 노드 트래킹 피어**로 제안 — 노션 실적 캘린더 발표일 UMC 10/28, GFS 11/04(3Q26 이미 발표). 선단(TSMC) vs 성숙(UMC·GF) 대비가 생기면 "AI 독점 vs 사이클형" 축으로 ⑦(2)를 쓸 수 있다. 기업개요상 UMC·GF는 가격 경쟁·중국 증설에 노출된 사이클형(점유율 3.9%·3.2%)
→ 삼성 파운드리: 공시 분리 전까지 한국 칸은 계속 `비교 불가`
