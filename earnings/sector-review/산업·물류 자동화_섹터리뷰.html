→ **합산 방식 (3Q26부터 3사)**: 3사 실적 리뷰 1번 ① 표 합산. 한국 2사는 K-IFRS 연결 매출·영업이익(억원), Symbotic은 GAAP 매출·영업이익($M, 캘린더 분기 정렬 — 3Q26 = FQ4 26)을 **고정 환율 $1 = 1,419원**(로봇 섹터 통합 리뷰와 같은 값, 3Q26 평균)으로 원화 환산해 더했다 — 통화 혼합이라 `억원 (달러)` 표기. 전 분기 같은 환율이라 YoY에 환율 효과 없음 [계산]
→ **과거 행(4Q24\~2Q26)은 2사 기준 그대로 둔다** (누적 표 원칙 — 정정하지 않음). 3사 소급 숫자는 아래 ① 표에 따로 둔다
→ 두산로보틱스 3Q26은 회사 IR 잠정치, 오토에버는 분기보고서 확정치, Symbotic은 8-K 보도자료(주식보상 배분 변경 후 재작성 기준 — 3Q25 -$11.6M)
→ **3Q26 판정 방식**: 3사 합산 영업이익 YoY는 +320.5%(2Q26) → +240.4%(3Q26)로 %상 -80.1%p지만, 전년 분모(2Q25 292억·3Q25 391억)가 Symbotic 적자(-366억·-164억)로 눌려 있어 %가 부풀려졌다. 전년 적자 구간 규칙(earnings-review)과 같은 방식으로 **영업이익 YoY 증감액**을 판정 기준으로 쓴다 — +936억 → **+940억(+0.4%, 보합) = 유지**. %로 기계 판정하면 "둔화"다 — 병기 [판단]

(1-3) [판단] 한국 2사의 로봇 이익 레버는 2027\~2028년, 미국 물류 자동화는 2026년에 이미 레버리지 구간 — 같은 서브섹터 안 "시간차"가 국가 콜을 가른다

(2) **TP 하향 = 멀티플·신사업 가치 조정** — 오토에버·두산로보틱스
(2-1) 오토에버 7개사 평균 TP 49.4만 → 42.6만(-14%), 2026E 영업이익 -4% — 하향 대부분은 멀티플 / 두산로보틱스 실적 후 2거래일 -10%, 고점 대비 -69%, CEO 교체 (각 리뷰). Symbotic은 셀사이드 TP 미확보(숫자 중심), 주가는 2025-11 고점 대비 -60%(11/13, 기업 개요)

(3) **매출 성장 ↔ 비용 구조** — 두산로보틱스·Teradyne·Symbotic
(3-1) 두산 매출 +59%에 판관비(북미 사업장·AI R&D 인력) 동반 증가로 적자 12% 축소에 그침 / Teradyne YoY 개선 $17.9M 중 82%가 매출총이익 증가 / Symbotic YoY 개선 $66.3M 중 70%가 매출총이익, 27%가 R&D 감소(엔지니어 고객 프로젝트 배치) — Systems GPM은 21.4%로 하락 (각 리뷰)
(3-2) [판단] 미국 2사 모두 "매출 레버리지 + 비용 재배치"로 이익을 냈다. 다음 단계는 제품 마진(Symbotic Systems GPM, Teradyne GPM) 개선 확인

→ 종목 고유 이슈: 오토에버 — GPUaaS(HMG AI 팩토리 지분 26%, 지분법) / 두산로보틱스 — 2Q26 장기차입금 500억, 순현금 2,024억 → 1,584억 / Symbotic — Walmart 매출 86.7%(집중 심화), 매출채권 고객 B 25.5% 등장, 내부통제 취약점 개선 진행 / Teradyne — Robotics 가이던스 미제공

→ 반대 논거: Symbotic 이익 가이던스(조정 EBITDA QoQ 보합)상 4Q26 이익 델타는 둔화 가능성이 크고, 오토에버는 4Q 이연 회수로 +26% 컨센 — **4Q26 한 분기는 방향이 반대로 나올 수 있다**. 델타 프레임 결론
→ 비교 범위: 글로벌 편입 종목 Symbotic 1사(숫자 중심 리뷰, 셀사이드 0건) + 트래킹 Teradyne(부문) / 한국 2사(오토에버 풀 8건, 두산 숫자 중심) — 글로벌 편입이 1사라 **근거 얇음**. 편입 후보: KION(Dematic)·AutoStore(분기 공시, 유럽 물류 자동화) — BT 판단

(3) 서브섹터 1등 종목
→ **서브섹터 1등 = 글로벌 1등: Symbotic** — 가속·강화. 가속이 영업 내(매출총이익·R&D 재배치)라 선호 종목 원칙(비영업발 가속 제외)에 걸리지 않는다. 확인 이벤트: 4Q26 영업이익 $72.8M+, RPO $28B+
→ **한국 1등: 두산로보틱스** — 유지·약화. "덜 나쁜 1등"(적자 축소 4개 분기 연속, 폭 작음) — 이익 델타로 매매할 대상은 아님
→ 현대오토에버 — 꺾임·약화. **반등 후보 (이벤트 드리븐)**: 확인 이벤트 4Q26 영업이익 900억 이상(이연 회수)
→ 트래킹 Teradyne은 1등 후보에서 제외

(4) 콜을 바꾸는 조건과 일정

→ 직전 콜 체크 (v1, 2026-11-23): "Symbotic 가속이면 확대 검토, 꺾임이면 축소 / Symbotic 가속이면 글로벌 1등 = 서브섹터 1등" → Symbotic 가속 확인 → **1등 Symbotic으로 교체(이행)**. 확대 조건 중 오토에버 900억·두산 -100억은 4Q26 확인 사항이라 서브섹터 비중은 유지
