# 반도체 · 로직·CPU 섹터 리뷰

> 최신 분기: 2026-Q3
> 섹터 델타: 유지 | 내러티브: 유지
> 모멘텀 신호: 없음
> 활성 테마: 에이전트AI (2026-Q2～)
> 포지셔닝: 서브섹터 유지 | 한국 해당 없음 | 1등 AMD
> 편입 종목: AMD, Intel, Arm
> 갱신 시각: 2026-11-16 13:51 KST

**Nvidia 미편입 — 11/17(ET) 발표 후 갱신 예정.** 워치리스트 핵심 종목 Nvidia의 3Q FY27(2026년 8～10월) 실적이 아직 나오지 않았다. 이 판은 리뷰가 있는 AMD(핵심)·Intel·Arm(확장) 3사로만 합산·판정했다. Nvidia가 들어오면 합산 매출의 약 70%를 차지해 판정이 사실상 Nvidia 쪽으로 기운다 [계산: Nvidia 1Q FY27 매출 $81.6B(`earnings_calendar.md`) vs 3사 3Q26 합산 $31.3B]. 갱신 때는 "Nvidia 포함 합산"과 "CPU 3사 합산"을 함께 적는다

→ **합산 기준 — Non-GAAP(조정) 영업이익, 달러 단일 통화**. 3사 모두 Non-GAAP을 주 지표로 쓰고, 종목 리뷰도 Non-GAAP으로 델타를 판정했다. GAAP은 Intel 구조조정·손상(3Q24 -$9.1B, 1Q26 -$3.1B)과 Arm 주식보상비용 변동으로 YoY가 대부분 n.m.이라 합산 기준으로 쓰지 않는다 (`2026-Q3_INTC_리뷰.md`·`2026-Q3_ARM_리뷰.md` 1번 표 주석)
→ **매출**: 3사 리뷰 1번 분기 표 그대로 합산. 4Q23～3Q24 매출 YoY는 리뷰의 종목별 YoY로 전년 분기를 역산했다 (Intel 4Q22 $14,042M은 리뷰 기재치) [계산]
→ **영업이익 표본 공백**: Intel Non-GAAP 분기치는 1Q25부터, Arm은 2Q25부터 있다(2Q25 Arm은 연간 - 3개 분기 역산치). AMD는 4Q23부터 있지만 1개사라 합산 행에 넣지 않았다. 따라서 3사 합산 YoY는 2Q26부터, 의미 있는 값은 3Q26부터 나온다
→ **2Q26 n.m.**: Intel 2Q25 Non-GAAP 영업이익이 일회성 비용으로 적자(-$503M)라 3사 2Q26 YoY가 +693%로 튄다. AMD 2Q25도 MI308 재고 비용 약 $0.8B로 낮았다 — AMD는 리뷰의 조정 기저($1,697M)를 쓴다
→ **델타 판정 표본 = AMD(조정)+Arm**. 2Q26과 3Q26 모두 같은 회사 구성으로 YoY를 낼 수 있는 조합은 이 둘뿐이다 (Intel은 2Q26 YoY n.m.). 3사 합산 YoY(+84.3%)는 레벨 지표로 함께 적는다
→ **Intel은 연결 기준**: 리뷰와 같다. Intel Foundry 매출($6,697M)은 대부분 Products 향 내부 매출이라 연결 조정(-$6,291M)으로 지워진다. CPU 사업 자체(Intel Products 영업이익 $5,324M, GAAP 부문)만 따로 볼 수도 있지만, 공통비·Foundry 손실(-$1,853M)을 떼면 다른 2사와 기준이 달라져 연결 Non-GAAP을 썼다
→ **Arm은 캘린더 분기로 정렬**했다 (3Q26 = FQ2 FY27, 7～9월)
→ 내러티브·모멘텀·테마 열은 소급 분기에 리뷰가 없어 `-`로 두었다

→ **Intel 4Q 영업이익은 출처별 차이가 크다**: 가이던스 역산 $1,490M vs 발표 후 Bloomberg 컨센 $1,952M(NH 11/2 인용). 컨센을 넣으면 3사 4Q26E 합산 $8,222M, YoY +80.1%다 (`2026-Q3_INTC_리뷰.md` 1번 표 주석) [계산]
→ **이익 레벨**: 3Q26 합산 Non-GAAP 영업이익 $7.8B, OPM 24.9%로 둘 다 표본 내 최고다. 4Q26E는 AMD가 +$1.7B 늘고 Intel이 -$1.7B 줄어 합산 레벨이 제자리($7.76B)다 [계산]
→ **3Q26 증가분의 출처**: 합산 영업이익 YoY 증가 +$3,566M 중 Intel +$1,710M(48%), AMD +$1,685M(47%), Arm +$171M(5%) [계산]. 3Q26까지는 Intel이 AMD만큼 끌었다. 4Q부터 Intel이 빠진다
→ **컨센 경로상 정점**: 3사 합산 YoY는 3Q26(+84%)이 표본 내 최고이고, 4Q 가이던스 합산은 +70%로 내려온다. 반대로 AMD+Arm만 보면 4Q +87%로 올라간다 — 정점 여부는 Intel 4Q 실적이 정한다 [판단]

→ 공통: 원인이 같다. 메모리 사이클이 강할수록 세트 가격이 오르고, 그 비용을 CPU 3사가 소비자 출하로 치른다
→ 갈리는 지점: 재고조정 기간이다. Intel 셀사이드는 1Q27 종료(대신·NH) vs 2Q27까지 + 메모리 정상화 2028(삼성)으로 갈린다. Arm은 회사가 "출하 정체에도 모바일 매출 두 자릿수"를 주장하지만 유진·NH 모두 숫자로는 반영하지 않았다
→ **[판단]** 노출 비중이 결과를 갈랐다. 3Q26 매출 중 소비자 노출은 Intel 49%(CCPG), AMD 28%(C&G), Arm은 로열티의 대부분이 모바일이다. 4Q 영향도 같은 순서다 — Intel은 CCPG 감소폭(약 -$1.6B QoQ)이 DCAI 증가폭(약 +$1.1B)보다 커 연결이 역성장하고, AMD는 데이터센터(+50% QoQ)가 C&G 감소를 크게 덮는다. 메모리 섹터 리뷰의 "레이어 모멘텀 종료"와 반대로, 메모리 가격이 2027 상반기에도 오르면 이 서브섹터의 PC·모바일 역풍은 더 길어진다

(2) 서버 CPU 수요 > 공급 — 에이전틱 AI가 CPU 수요를 키운다 (3사 공통)

| 종목 | 데이터센터 3Q26 | 공급 상황 | 2027 성장 가이던스·코멘트 |
|---|---|---|---|
| AMD | Data Center $8,546M (+96.9%, OPM 33.7%). 서버 CPU 클라우드·엔터프라이즈 YoY 2배 이상 | TSMC 기반, 패키징 장비 직접 매입·재고 +$3B로 공급 선확보 | 서버 CPU 약 2배(직전 +70%), 전사 매출 +80% 이상 |
| Intel | DCAI $7,318M (+77.8%, OPM 41.5%) — 15년 만의 성장 | Intel 3 수율·EMIB 기판·Fab 28로 출하 제약, 기판 증설은 2027 하반기 | 4Q DCAI 연율 약 $30B 중반이 2027 출발점 → 2027 DCAI +30% 안팎 [리뷰 계산] |
| Arm | 데이터센터 로열티 약 2배, 하이퍼스케일러 CPU 내 Arm 점유율 2026년 말 60% 돌파 전망 | AGI CPU 웨이퍼·기판·메모리 공급망 확보 진전 | 데이터센터 로열티 "수년간 세 자릿수 성장", AGI CPU FY27～28 누적 $20억 |

→ (출처: 3사 2026-Q3 리뷰. AMD 쟁점 1·4, Intel 쟁점 2, Arm 쟁점 3·4)
→ 공통: 수요는 문제가 아니다. 3사 모두 "수요 > 공급"을 말했고 Intel은 "서버 CPU TAM 5년 내 $40B → $200B 이상", Arm은 "2030 CPU 시장 $2,000억 이상 거론"을 제시했다
→ 갈리는 지점: **누가 공급을 가졌나**. TSMC에서 찍는 AMD는 공급을 늘려 Data Center +97%, 자체 팹·기판에 묶인 Intel은 +78%, Arm은 하이퍼스케일러 자체 칩(Graviton·Axion·Cobalt)과 Nvidia Vera로 x86 공백을 메운다
→ **[판단]** 에이전틱 CPU 수요의 수혜가 공급을 가진 쪽으로 쏠린다. 2027 상반기까지 Intel 공급이 풀리지 않는 동안 AMD(2027 서버 CPU 약 2배)와 Arm(데이터센터 로열티 세 자릿수)이 점유율을 가져가는 구도다 — Intel 리뷰가 "점유율을 내주는 경로"로 계산한 것과 같은 결론이다

→ **델타 판정 근거**: 2Q26 → 3Q26 동일 표본(AMD 조정+Arm) 합산 영업이익 YoY가 +71.9% → +68.6%(-3.3%p)로 ±5%p 이내다. 종목 판정도 가속 1·둔화 1·꺾임 1로 엇갈린다 — 기준표의 "유지". 3사 합산 레벨 YoY(+84.3%)는 Intel 3Q26 +112%가 끌어올린 값이다
→ **다음 분기 예고**: 4Q 가이던스 합산은 +70.0%(-14.3%p)로 "둔화" 경로다. Intel 4Q를 발표 후 Bloomberg 컨센($1.95B)으로 바꾸면 +80.1%로 "유지" 경계에 걸린다. 결국 4Q 판정은 Intel이 가이던스 하단에 서는지, 컨센 쪽으로 붙는지가 정한다. AMD+Arm만 보면 +86.7%로 가속이다
→ **내러티브 판정 근거**: 종목별 내러티브는 강화 1(AMD)·유지 1(Arm)·약화 1(Intel)이다. 서브섹터 공통 스토리("에이전틱 AI로 서버 CPU 수요 폭증")는 3사 모두 숫자로 확인됐다(데이터센터 매출 AMD +97%, Intel +78%, Arm 로열티 약 2배). 약화는 스토리 자체가 아니라 Intel이 공급·PC 때문에 그 수요를 못 담은 것 — 서브섹터 스토리는 "유지" [판단]
→ **직전 판정 대비**: 첫 로직·CPU 리뷰다. 소급 궤적은 표본 공백으로 1Q26(AMD+Intel +70%)부터만 보이며, 1Q26 +70% → 2Q26 +72%(AMD+Arm) → 3Q26 +84%(3사)로 고원 위에서 레벨이 오르는 중이다. 정점 통과 신호는 아직 없다(Intel 단독 제외)

| YoY 정점 시점 | 3사 합산은 3Q26이 표본 내 최고, 4Q 가이던스 +70%. AMD는 정점 미도래(4Q +96%), Arm은 3Q26 정점 후 2027 2Q 재가속, Intel은 1Q26 정점 통과 | 유지 (종목별 시차 큼) |
| 선행지표 | AMD 2027 매출 +80% 이상·서버 CPU 약 2배, Intel 서버 CPU TAM 5배·공급 부족 2028까지, Arm 라이선스 +50%(12～24개월 뒤 로열티)·AGI CPU 가시성 2배 | 확대 |
| 최종 수요 | 데이터센터는 3사 모두 가속(+78～97%), PC·모바일은 3사 모두 역성장·보합 | 유지 |
| 이벤트·정책 | 11/17 Nvidia, 중간선거 이후 AI 규제 우려·AI CapEx 지속성 의심 | 중립 |
| 이익 추정 방향 | 상향 1(AMD) / 보합 1(Arm) / 하향 1(Intel 2027E -15%) | 유지 |
| 밸류에이션·낙폭 (2순위) | AMD 12MF P/E 33배·고점 -39%, Intel 선행 PER 45배, Arm FY27 PER 85배·고점 -56% | 유지 (AMD만 성장 대비 저평가) |

→ **결론: 서브섹터 유지** [판단]. 판정 표본 델타가 유지이고, 서브섹터 안에서 가장 강한 종목(AMD)과 가장 약한 종목(Intel)의 방향이 정반대라 서브섹터 베타를 늘릴 근거가 약하다. 대신 서브섹터 안 비중을 AMD로 옮기는 것이 델타 프레임에 맞다. Nvidia 편입 후 재판정한다
→ **확대 전환 조건**: ① 4Q26 3사 합산 영업이익 YoY 89.3% 이상($8.64B) ② Nvidia 3Q FY27 영업이익 YoY 가속 ③ Intel 1Q27 가이던스 QoQ 플랫 이상. ①+② 충족 시
→ **축소 전환 조건**: 4Q26 79.3% 미만(둔화) + Intel 1Q27 YoY 마이너스 가이던스 + 메모리 가격 2027 상반기 추가 상승(PC TAM -10% 하향)

(2) 같은 서브섹터 안 한국 vs 글로벌 — **한국 해당 없음**

→ 편입 종목에 한국 종목이 없어 서브섹터 내 한국 vs 글로벌은 `비교 불가 — 편입 종목 없음`이다. 결론에서 국가 판단은 뺀다
→ **편입 후보 점검 (구멍)**: 적합한 한국 종목이 없다. 삼성전자 System LSI(Exynos)는 DS 부문 안에 묶여 부문 영업이익이 따로 공시되지 않아 합산 기준을 만들 수 없다. 국내 AI 반도체 팹리스(리벨리온·퓨리오사 등)는 CPU가 아니고, 분기 실적 공시 여부도 확인이 필요하다 [판단]. 한국 투자자가 이 서브섹터의 델타를 담는 경로는 직접 종목보다 메모리(원가 상대방)·기판 등 공급망 쪽이며, 이는 해당 서브섹터 리뷰에서 다룬다
→ 대체 대비 축 — **데이터센터 노출 vs PC·모바일 노출** (서브섹터 안 승패를 가르는 축)

| 경쟁력 축 | 데이터센터 노출 | PC·모바일 노출 | 우위 |
|---|---|---|---|
| 델타 방향 (1순위) | AMD Data Center + Intel DCAI 합산 매출 $15,864M (+87.6% YoY), 부문 영업이익 $5,919M (+190.5%) [계산] | AMD C&G + Intel CCPG 합산 매출 $11,819M (-6.1%), 부문 영업이익 $2,858M (-19.8%) [계산] | 데이터센터 |
| 다음 분기 방향 | AMD DC 약 +138% (QoQ +50%), Intel DCAI 약 +78% | AMD C&G 약 -24%, Intel CCPG 약 -21% | 데이터센터 |
| Arm 내부 | 데이터센터 로열티 약 2배 | Edge AI(모바일) 로열티 보합, 전체 로열티 +8% | 데이터센터 |
| 마진 레벨 | AMD DC OPM 33.7%, Intel DCAI 41.5% | AMD C&G 15.4%, Intel CCPG 28.2% | 데이터센터 |
| 마진 방향 | AMD DC +9%p YoY, Intel DCAI +18%p YoY | AMD C&G -6%p, Intel CCPG -3%p | 데이터센터 |
| 공급 | 수요 > 공급 (Intel 기판·Intel 3 제약) | 출하가 수요보다 더 빠짐 (OEM 재고조정) | — |
| 비용 변수 | HBM·메모리 원가가 GPM을 누름 | 메모리 가격이 세트 수요를 누름 | 둘 다 메모리 가격의 함수 |

→ (출처: AMD 리뷰 1번 ②(1)(2), Intel 리뷰 1번 ②(1)(2)(3), Arm 리뷰 1번 ②. 전년 분기 부문값은 리뷰의 부문 YoY로 역산 [계산])
→ **결론: 서브섹터 안 승패 = 데이터센터 매출 비중** [판단]. 3Q26 기준 데이터센터 비중은 AMD 64%, Intel 44%(DCAI), Arm 로열티 내 1/3 미만이다. 이 비중 순서가 4Q 가이던스 델타 순서(AMD > Arm > Intel)와 거의 같다 — 단 Arm은 라이선스가 순서를 끌어올렸다
→ 이유 (1) 델타 방향: 데이터센터 부문 영업이익 +190% vs PC·모바일 -20%
→ 이유 (2) 이익 추정: 데이터센터 비중이 큰 AMD만 이익 추정이 올라갔다
→ 이유 (3) 구조: 2027 PC는 두 자릿수 역성장(AMD·Intel 공통 전제), 데이터센터는 공급 부족이 2028까지(Intel)
→ x86 vs Arm 축 보조: 하이퍼스케일러 CPU 내 Arm 점유율 2024년 15% → 2026년 말 60% 초과 전망(유진). x86 안에서는 공급을 가진 AMD가 Intel 공백을 가져간다 — x86 vs Arm보다 "공급을 가진 쪽 vs 못 가진 쪽"이 3Q26 델타를 더 잘 설명한다 [판단]
→ **반대 논거**: 메모리 가격이 안정되면 PC·모바일 노출이 큰 Intel·Arm이 반등 탄력이 가장 크다. Intel PC 재고조정이 1Q27에 끝나면(대신·NH) CCPG 바닥 확인이 이벤트가 된다. 이것은 델타 프레임 밖 반등 시나리오다
→ **비교 범위**: 글로벌 편입 3사 리뷰(셀사이드 첨부: AMD 8건·Intel 6건·Arm 2건)만 썼다. Nvidia(핵심)와 하이퍼스케일러 자체 Arm CPU(Graviton·Axion·Cobalt)는 숫자가 없다. Arm 리뷰는 셀사이드 2건이라 근거가 얇다

→ **1등을 델타 순위 1위(Arm)가 아닌 AMD로 둔 이유** [판단]: ② 델타 순위는 이번 분기 실적만 본 것이다. Arm의 가속은 대형 라이선스 계약 시점이 만든 "질 낮은 가속"이고(Arm 리뷰), 다음 분기 가이던스에서 바로 감속한다. AMD의 둔화는 PC·게이밍이 만든 한 분기 쉼이고 4Q 가이던스로 재가속이 이미 그려졌다. 두 종목 리뷰 모두 서브섹터 내 위치를 AMD > Arm > Intel로 적었다
→ **선호 / 비선호** (로직·CPU 안, Nvidia 제외)
→ 선호: AMD — 4Q 실적이 가이던스(매출 $17B·영업이익 $5.6B)를 확인하면 "가속" 복귀
→ 반등 후보 (이벤트 드리븐, 델타 프레임 밖): Arm — FQ3(2월 초) 로열티 바닥 + FQ4 AGI CPU 본격 매출 가이던스 확인 후. Intel — 1Q27 가이던스 QoQ 플랫 이상(PC 바닥 + DCAI 공급 증가) 확인 후
→ 비선호: Intel (1Q27 가이던스 전까지)
