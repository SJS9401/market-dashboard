→ **캘린더 정렬**: Nvidia 회계분기는 캘린더보다 1개월 늦다(3Q26 = FQ3 FY27, 2026년 8～10월). 다른 3사는 7～9월(Arm은 FQ2 FY27로 캘린더와 같음)이다. Nvidia는 리뷰 표기대로 가장 가까운 캘린더 분기에 매핑했고 월 단위로 재배분하지 않았다 — Micron(9～11월 → 4Q)과 같은 처리다. 따라서 4사 3Q26은 2026년 7～10월에 걸친 합산이다. 4Q26E Nvidia(FQ4 FY27, 11～1월)는 14주 분기다(1주 추가, 리뷰)
→ **Nvidia Non-GAAP 전년 분기(1Q24～4Q24)는 역산**: 리뷰의 Non-GAAP YoY(+28.9% / +51.3% / +62.2% / +80.7%)로 역산하면 $18,057M / $19,937M / $23,275M / $25,516M [역산]. 1Q25～4Q25의 NVDA+AMD YoY는 이 역산치와 AMD 리뷰 1번 표(4Q23부터 Non-GAAP)로 냈다. Intel(1Q25～)·Arm(2Q25～) Non-GAAP 전년치가 없어 2Q26 이전 4사 YoY는 나오지 않는다
→ **Nvidia 1Q25 H20 비용**: 1Q25(FQ1 FY26) H20 재고·구매약정 비용 $4.5B가 Nvidia 1Q25 이익을 눌렀다 (리뷰 ⚠ 비영업 요인 플래그). 이 비용은 Non-GAAP에도 포함돼 있어 Non-GAAP 1Q26 YoY(+131.1%)도 부풀었다. 되돌리면 Nvidia 1Q25 Non-GAAP 약 $27,775M, 1Q26 YoY 약 +93.6%, NVDA+AMD 1Q25 YoY +54.0%·1Q26 +90.6% [계산]. 판정 열은 조정 기준을 앞에, 보고 기준을 괄호에 적었다
→ **Intel 2Q25 적자 기저·AMD 2Q25 MI308 비용**: 11/16판과 같이 AMD는 리뷰의 조정 기저($1,697M)를 쓰고, Intel 2Q25 Non-GAAP 적자(-$503M)는 판정 표본에서 뺐다. Nvidia가 들어오면서 Intel 기저 왜곡은 4사 합산에서 작아졌지만(4사 2Q26 +121.4%로 n.m. 아님), 같은 기준을 유지하려고 2Q26 → 3Q26 델타 판정 표본은 **Intel 제외 3사(Nvidia+AMD 조정+Arm)**로 둔다. 4사 기준으로 봐도 +121.4% → +104.1%(-17.3%p)로 같은 둔화다
→ **소급 판정 열**: NVDA+AMD가 1Q25부터 끊기지 않는 유일한 동일 표본이라(4사 영업이익의 약 95%) 2Q25～1Q26 판정은 이 표본으로 기준표대로 산정했다 [계산]. 내러티브·모멘텀 열은 소급 분기에 리뷰가 없어 `-`. 활성 테마 2Q26은 메모리 섹터 리뷰와 같은 기준(에이전트AI 2026-Q2～)
→ **Intel은 연결 기준, Arm은 캘린더 분기 정렬**: 11/16판과 같다. Intel Foundry 내부 매출은 연결 조정으로 지워지고, Arm 3Q26 = FQ2 FY27(7～9월)
→ **11/16판 대비 정정**: 3사 행을 4사로 다시 썼다. CPU 3사 수치는 괄호 안에 그대로 남겼고 바뀐 숫자는 없다. 3Q26 판정은 유지(CPU 3사) → 둔화(4사)로 바뀌었다

→ **델타 순위 기준**: 이번 분기 Non-GAAP 영업이익 YoY 델타 큰 순서 — Arm(+7.7%p) > Nvidia(-5.7%p) > AMD(-7.0%p) > Intel(-29.5%p). 4Q 가이던스 델타로 보면 AMD(+20.9%p) > Arm(-3.9%p) > Nvidia(-27.9%p) > Intel(-88.5%p)로 바뀐다. Nvidia는 이번 분기 델타로는 2위지만 다음 분기 경로가 세 번째로 나쁘다 — 4Q GPM 저점(74.9% → 71.5%)과 영업비용 +20%(14주·경영진 교체) 때문이다 (Nvidia 리뷰 1번 (2)) [판단]
→ **Nvidia 판정의 기준 문제**: 리뷰 판정은 규칙대로 "꺾임"이지만, 꺾임을 만든 정점(1Q26)은 H20 비용 저기저가 만든 값이다. 비용을 되돌리면 Nvidia 단독도 "가속 후 1회 둔화 = 둔화"다. 이 문서는 종목 판정을 리뷰 그대로 가져오고(스킬 규칙), 섹터 판정에서만 조정 기준을 쓴다 — ④에서 영향을 설명한다
→ **섹터 델타를 끈 것과 내린 것**: 3Q26 4사 합산 YoY 증가분의 92%가 Nvidia다. 섹터 델타 -5.6%p도 Nvidia(-5.7%p) 그대로다. CPU 3사 안에서는 Intel·AMD가 반씩 끌었고(증가분 48% vs 47%), 4Q부터는 AMD 혼자 끈다 [계산]
→ **선행 종목은 Intel, 다음이 Nvidia**다. Intel은 Non-GAAP 영업이익 YoY 정점(1Q26 +142%)·매출 YoY 정점(2Q26 +25.4%)이 가장 빨랐고 가장 먼저 꺾였다. Nvidia는 보고 기준 정점이 같은 1Q26(+131%), 조정 기준 2Q26(+112%)이다. 정점 시차는 Intel(1Q26) → Nvidia(1Q26 보고 / 2Q26 조정) → Arm(3Q26) → AMD(정점 미도래, 4Q 가이던스 +96%) 순서다 [판단]

③ 섹터 공통 쟁점

(1) 메모리 가격 상승 → PC·스마트폰 수요 급감 (4사 공통)

| 종목 | 소비자 노출 부문 3Q26 | 4Q 이후 가이던스·코멘트 | 회사가 든 원인 |
|---|---|---|---|
| Nvidia | Edge Computing $8,234M (+42.2% YoY, 매출 비중 7.1%) — 블랙웰 워크스테이션·피지컬 AI가 끌었고 소비자 PC 수요는 약해짐 | 부문 가이던스 없음 | "메모리·시스템 가격 상승으로 소비자 PC 수요 약화" (KB 11/20) |
| AMD | Client & Gaming $3,722M (-8.1% YoY, 영업이익 -33.9%) | 4Q C&G QoQ -20% 이상, 2027 PC 시장 두 자릿수 감소 전제 | "부품 가격 상승이 시스템 가격에 전가" |
| Intel | CCPG $8,097M (-5.1% YoY, -8.8% QoQ, 영업이익 -15.2%) | 4Q CCPG QoQ -20% 이상, 2026 PC TAM -12%(하반기 -20% 이상)·2027 -10% | "메모리 가격 상승과 가용성 악화로 OEM 재고조정 가속" |
| Arm | 로열티 +8.1% (Edge AI 보합) | FQ3 로열티 "한 자릿수 초반", 2027 스마트폰 출하 보합 전제 | "메모리 가격 → 스마트폰 출하 감소" |

→ (출처: 4사 2026-Q3 리뷰 1번 ②·2번 쟁점. Nvidia 1번 ②(3), AMD 쟁점 4, Intel 쟁점 1, Arm 쟁점 1)
→ 공통: 원인이 같다. 메모리 사이클이 강할수록 세트 가격이 오르고, 그 비용을 소비자 출하로 치른다
→ 갈리는 지점: 노출 크기와 재고조정 기간이다. Nvidia는 소비자 노출이 매출의 7%이고 그마저 워크스테이션·피지컬 AI가 덮었다. Intel 셀사이드는 재고조정 종료를 1Q27(대신·NH) vs 2Q27까지 + 메모리 정상화 2028(삼성)로 본다
→ **[판단]** 노출 비중이 결과를 갈랐다. 3Q26 매출 중 소비자 노출은 Intel 49%(CCPG), AMD 28%(C&G), Nvidia 7%(Edge, 일부만 소비자), Arm은 로열티의 대부분이 모바일이다. 이 쟁점은 섹터 합산(Nvidia 79%)에는 작고, CPU 3사 안 순위에는 크다. 메모리 가격이 2027 상반기에도 오르면 Intel·Arm의 PC·모바일 역풍이 길어진다

(2) 데이터센터 수요 > 공급 — 에이전틱 AI가 GPU·CPU 수요를 함께 키운다 (4사 공통)

| 종목 | 데이터센터 3Q26 | 공급 상황 | 2027 성장 가이던스·코멘트 |
|---|---|---|---|
| Nvidia | Data Center $107,610M (+110.1%, 매출 비중 92.9%). Hyperscale +71%·ACIE +195%, Vera Rubin 첫 분기 약 $20B | 구매 약정 $279B → $390B(대부분 다년 메모리), 기판(Kinsus·삼성전기)·패키징(SPIL) 신규 계약. "성장 제약은 수요가 아니라 공급" | FY28(CY27) 매출 +70% → +75%, FY28 CPU 매출·엔터프라이즈 매출 각각 2배 이상 (모건스탠리·KB) |
| AMD | Data Center $8,546M (+96.9%, OPM 33.7%). 서버 CPU 클라우드·엔터프라이즈 YoY 2배 이상 | TSMC 기반, 패키징 장비 직접 매입·재고 +$3B로 공급 선확보 | 서버 CPU 약 2배(직전 +70%), 전사 매출 +80% 이상 |

| Arm | 데이터센터 로열티 약 2배, 하이퍼스케일러 CPU 내 Arm 점유율 2026년 말 60% 돌파 전망 | AGI CPU 웨이퍼·기판·메모리 공급망 확보 진전 | 데이터센터 로열티 "수년간 세 자릿수 성장", AGI CPU FY27～28 누적 $20억, Nvidia Vera 출하 2026년 말 본격화 |

→ (출처: 4사 2026-Q3 리뷰. Nvidia 1번 ②·쟁점 2, AMD 쟁점 1·4, Intel 쟁점 2, Arm 쟁점 3·4·2-0)
→ 공통: 수요는 문제가 아니다. 4사 모두 "수요 > 공급"을 말했다. Nvidia는 클라우드 수주잔고 $2.0T → $2.5T와 에이전틱 토큰(오픈라우터 주간 토큰 YoY 35배, 80%가 에이전틱)을, Intel은 "서버 CPU TAM 5년 내 $40B → $200B 이상"을, Arm은 "2030 CPU 시장 $2,000억 이상 거론"을 근거로 들었다
→ 갈리는 지점: **누가 공급을 가졌나**. 구매 약정으로 메모리·기판·패키징을 먼저 묶은 Nvidia와 TSMC·패키징 장비를 선확보한 AMD는 데이터센터 +97～110%, 자체 팹·기판에 묶인 Intel은 +78%. Arm은 하이퍼스케일러 자체 칩과 Nvidia Vera(Arm 기반 CPU)로 x86 공백을 메운다 — Nvidia FY28 CPU 매출 2배 이상 전망은 Arm 데이터센터 로열티의 재료다 (Arm 리뷰 2-0: Vera 출하 확인, 로열티 반영 2027)
→ **[판단]** 에이전틱 수요의 수혜가 공급을 가진 쪽으로 쏠리는 구도는 Nvidia가 들어와도 같다. 다만 Nvidia의 델타가 내려가는 이유는 수요·공급이 아니라 기저(3Q25 Nvidia Non-GAAP YoY +62%)와 4Q 마진 저점이다 — 데이터센터 노출이 가장 큰 회사가 델타는 가장 먼저 내려가는 중이다

→ **꺾임 vs 둔화 — Nvidia 기준 문제가 섹터 판정에 주는 영향**: 보고 기준이면 NVDA+AMD 표본이 1Q26 +124.8%(정점) → 2Q26 +110.4% → 3Q26 +104.6%로 2개 분기 연속 둔화 + 정점 통과 = **꺾임**이다(Nvidia 리뷰의 규칙 판정과 같은 구조). 그러나 1Q26 정점은 Nvidia 1Q25 H20 비용 $4.5B 저기저가 만든 값이고, 되돌리면 1Q26 +90.6% → 2Q26 +110.4%(가속, 정점) → 3Q26 +104.6%(1회 둔화) = **둔화**다. 스킬 기준("기저효과·일회성으로 왜곡되면 조정 기준으로 판정하고 병기")에 따라 섹터 판정은 **둔화**, 보고 기준 꺾임을 병기한다 [판단]
→ **기준 문제가 바꾸는 것과 바꾸지 않는 것**: 바꾸는 것은 꺾임의 시점뿐이다 — 보고 기준은 이미 꺾임, 조정 기준은 4Q26이 한 번 더 둔화하면 꺾임이다. 4Q 가이던스 합산(+77.6%)은 조정 기준 꺾임선(99.1%)보다 21%p 아래라, 두 기준은 다음 분기에 같은 "꺾임"으로 합쳐질 가능성이 높다. 바꾸지 않는 것은 ⑤ 모멘텀 신호다 — 테마 종료 후보 조건 ①(섹터 델타 둔화·꺾임 전환)은 두 기준 모두 충족한다. 또 하나의 민감도: 판정 표본 델타 -5.6%p는 유지 범위(±5%p)를 0.6%p 넘은 값이고, Nvidia 3Q25 기저를 Visible Alpha로 쓰면 델타가 플러스가 된다(①). 세 가지 기준 편차가 모두 "정점 부근 고원"을 가리킨다는 점에서, 판정의 실질은 "가속은 끝났다"이다 [판단]
→ **다음 분기 예고**: 4Q 가이던스 합산은 4사 +77.6%(-26.5%p)다. Intel을 발표 후 Bloomberg 컨센($1.95B)으로 바꿔도 +78.5%, Nvidia가 3Q만큼(Non-GAAP 영업이익 컨센 대비 +7.8%) 가이던스를 넘어도 약 +90%로 꺾임선 99.1%($100.9B) 아래다 [계산]. 경로대로면 4Q26은 2개 분기 연속 둔화 + 정점(2Q26) 통과 = 꺾임
→ **내러티브 판정 근거**: 종목별 내러티브는 강화 1(AMD)·유지 2(Nvidia·Arm)·약화 1(Intel)이다. 서브섹터 공통 스토리("에이전틱 AI로 데이터센터 컴퓨트 수요 > 공급")는 4사 모두 숫자로 확인됐다(데이터센터 매출 Nvidia +110%, AMD +97%, Intel +78%, Arm 로열티 약 2배, Nvidia FY28 +75% 상향). 약화 요인은 스토리가 아니라 회사 고유 문제다 — Intel은 공급·PC, Nvidia는 CEO 공백·규제로 멀티플이 깎였다. 서브섹터 스토리는 "유지" [판단]
→ **직전 판정 대비**: 11/16판(CPU 3사) 유지 → 11/22판(4사) 둔화. 소급 궤적(NVDA+AMD 표본, 조정 기준)은 2Q25 유지 → 3Q25～2Q26 4개 분기 가속 → 3Q26 둔화로, 6분기 만의 첫 둔화다. 이익 레벨은 계속 오르지만(1Q25 $25.7B → 3Q26 $85.7B → 4Q26E $90.0B) 증가율이 정점을 지났다

→ **결론: 서브섹터 유지** [판단]. 이익 델타(1순위)는 둔화로 내려왔고 경로상 다음 분기 꺾임이 유력하다. 그래도 지금 축소하지 않는 이유는 (a) 꺾임 판정의 정점이 일회성 저기저(H20)에 걸려 있고 조정 기준 둔화는 1회뿐이며 (b) 11/16판에서 정한 Nvidia 결과별 콜("둔화 → 유지")을 따르고 (c) 이익 레벨·추정치는 계속 오르고 있어서다. 대신 서브섹터 안 비중을 델타가 남은 AMD로 옮기고, 4Q26 판정선에서 축소 여부를 정한다. 델타 프레임 결론이며, 밸류에이션 프레임(Nvidia P/E 10.8배)이면 확대 결론이 나올 수 있다
→ **확대 전환 조건**: ① 4Q26 4사 합산 영업이익 YoY 109.1% 이상($106.0B) ② Nvidia 1Q FY28 가이던스 내재 GAAP 영업이익 YoY +85% 이상 ③ Nvidia 후임 CEO 선임. ①은 가이던스 대비 +18%라 사실상 ②+③ + AMD 가이던스 초과가 필요하다
→ **축소 전환 조건**: 4Q26 4사 합산 99.1% 미만(꺾임 확정) + Nvidia 1Q FY28 가이던스 내재 영업이익 YoY +85% 미만 — 둘이 함께 나오면 2027-02 하순 축소. Intel 1Q27 YoY 마이너스 가이던스·메모리 가격 2027 상반기 추가 상승은 축소를 앞당기는 보조 조건

(2) 같은 서브섹터 안 한국 vs 글로벌 — **한국 해당 없음**

→ 편입 종목에 한국 종목이 없어 서브섹터 내 한국 vs 글로벌은 `비교 불가 — 편입 종목 없음`이다. 결론에서 국가 판단은 뺀다
→ **편입 후보 점검 (구멍)**: 적합한 한국 종목이 없다. 삼성전자 System LSI(Exynos)는 DS 부문 안에 묶여 부문 영업이익이 따로 공시되지 않아 합산 기준을 만들 수 없다. 국내 AI 반도체 팹리스(리벨리온·퓨리오사 등)는 분기 실적 공시 여부 확인이 필요하다 [판단]. 한국 투자자가 이 서브섹터의 델타를 담는 경로는 메모리(원가 상대방 — Nvidia 구매 약정 $390B 대부분이 다년 메모리)·기판(삼성전기 — Nvidia 신규 기판 계약) 등 공급망 쪽이며, 해당 서브섹터 리뷰에서 다룬다
→ 대체 대비 축 — **데이터센터 노출 vs PC·모바일 노출** (서브섹터 안 승패를 가르는 축)

| 경쟁력 축 | 데이터센터 노출 | PC·모바일·엣지 노출 | 우위 |
|---|---|---|---|
| 델타 방향 (1순위) | Nvidia Data Center $107,610M (+110.1%) / AMD Data Center + Intel DCAI 합산 매출 $15,864M (+87.6%), 부문 영업이익 $5,919M (+190.5%) [계산] | Nvidia Edge $8,234M (+42.2%) / AMD C&G + Intel CCPG 합산 매출 $11,819M (-6.1%), 부문 영업이익 $2,858M (-19.8%) [계산] | 데이터센터 |
| 다음 분기 방향 | AMD DC 약 +138% (QoQ +50%), Intel DCAI 약 +78%, Nvidia는 ACIE가 4Q 최대 성장 기여(회사) | AMD C&G 약 -24%, Intel CCPG 약 -21% | 데이터센터 |
| Arm 내부 | 데이터센터 로열티 약 2배 | Edge AI(모바일) 로열티 보합, 전체 로열티 +8% | 데이터센터 |
| 마진 레벨 | AMD DC OPM 33.7%, Intel DCAI 41.5% (Nvidia 부문 영업이익 미공개, 전사 OPM 66.9%) | AMD C&G 15.4%, Intel CCPG 28.2% | 데이터센터 |
| 마진 방향 | AMD DC +9%p YoY, Intel DCAI +18%p YoY | AMD C&G -6%p, Intel CCPG -3%p | 데이터센터 |
| 공급 | 수요 > 공급 (Nvidia 구매 약정 선점, Intel 기판·Intel 3 제약) | 출하가 수요보다 더 빠짐 (OEM 재고조정) | — |
| 비용 변수 | HBM·메모리 원가가 GPM을 누름 (Nvidia는 판가 인상으로 전가) | 메모리 가격이 세트 수요를 누름 | 둘 다 메모리 가격의 함수 |

→ (출처: Nvidia 리뷰 1번 ②(1)(3), AMD 리뷰 1번 ②(1)(2), Intel 리뷰 1번 ②(1)(2)(3), Arm 리뷰 1번 ②. 전년 분기 부문값은 리뷰의 부문 YoY로 역산 [계산]. Nvidia Edge는 워크스테이션·피지컬 AI 포함이라 순수 소비자 PC가 아님)
→ **결론: CPU 3사 안 승패 = 데이터센터 매출 비중, 다만 Nvidia는 예외** [판단]. 3Q26 기준 데이터센터 비중은 Nvidia 93%, AMD 64%, Intel 44%(DCAI), Arm 로열티 내 1/3 미만이다. CPU 3사는 이 비중 순서가 4Q 가이던스 델타 순서(AMD > Arm > Intel)와 거의 같다. Nvidia는 비중이 가장 높은데 4Q 가이던스 델타는 세 번째다 — 노출이 아니라 고기저(3Q25 Nvidia Non-GAAP YoY +62%, 매출은 1년 새 2배)와 4Q 마진 저점이 델타를 내린다. "데이터센터 노출 = 델타"는 성장 초입 회사에 맞는 축이고, 데이터센터 매출이 이미 연율 약 $430B(3Q26 × 4) [계산]인 Nvidia에는 "기저"가 더 맞는 축이다
→ 이유 (1) 델타 방향: CPU 2사 데이터센터 부문 영업이익 +190% vs PC -20%
→ 이유 (2) 이익 추정: 데이터센터 비중이 큰 Nvidia·AMD만 이익 추정이 올라갔다
→ 이유 (3) 구조: 2027 PC는 두 자릿수 역성장(AMD·Intel 공통 전제), 데이터센터는 공급 부족이 2028까지(Intel)·FY28 +75%(Nvidia)
→ x86 vs Arm vs GPU 축 보조: 하이퍼스케일러 CPU 내 Arm 점유율 2024년 15% → 2026년 말 60% 초과 전망(유진), Nvidia FY28 CPU 매출 2배 이상(Arm 기반 Vera). x86 안에서는 공급을 가진 AMD가 Intel 공백을 가져간다 — "공급을 가진 쪽 vs 못 가진 쪽"이 3Q26 델타를 가장 잘 설명한다 [판단]
→ **반대 논거**: 메모리 가격이 안정되면 PC·모바일 노출이 큰 Intel·Arm이 반등 탄력이 가장 크다. Intel PC 재고조정이 1Q27에 끝나면(대신·NH) CCPG 바닥 확인이 이벤트가 된다. Nvidia는 CEO 선임·조사 종결이 멀티플 이벤트다. 모두 델타 프레임 밖 반등 시나리오다
→ **비교 범위**: 글로벌 편입 4사 리뷰(셀사이드 첨부: Nvidia 14건·AMD 8건·Intel 6건·Arm 2건)만 썼다. 하이퍼스케일러 자체 Arm CPU(Graviton·Axion·Cobalt)는 숫자가 없다. Arm 리뷰는 셀사이드 2건이라 근거가 얇다. Nvidia는 사업부 영업이익이 미공개라 부문 영업이익 비교에서 빠진다

(3) 로직·CPU 1등 종목

| 구분 | 종목 | 델타 판정 | 근거 한 줄 |
|---|---|---|---|

→ **1등을 AMD로 유지한 이유** [판단]: 델타 프레임은 "다음 분기에 증가율이 더 붙느냐"를 본다. 4사 중 다음 분기 영업이익 YoY가 올라가는 회사는 AMD뿐이다(+75% → +96%). Nvidia는 이익 규모·추정 상향·밸류에이션 모두 가장 좋지만 4Q 경로가 +106% → +78%로 내려가고, 재가속 여부는 1Q FY28 가이던스(2027-02 하순)에서야 보인다. Arm의 가속은 대형 라이선스 계약 시점이 만든 "질 낮은 가속"이라 2위에 둔다. 11/16판의 1등 교체 조건("Nvidia 델타가 AMD보다 좋으면")은 미충족
→ **선호 / 비선호** (로직·CPU 안)
→ 선호: AMD — 4Q 실적이 가이던스(매출 $17B·영업이익 $5.6B)를 확인하면 "가속" 복귀
→ 반등 후보 (이벤트 드리븐, 델타 프레임 밖): **Nvidia** — 확인 이벤트 = 후임 CEO 선임·조사 결과, 1Q FY28 가이던스 GPM 72% 이상 + 내재 영업이익 YoY +85% 이상(델타 재가속). 12MF P/E 10.8배는 가치 프레임의 매수 근거지만 델타 프레임의 근거는 아니다. **Arm** — FQ3(2월 초) 로열티 바닥 + FQ4 AGI CPU 본격 매출 가이던스 확인 후. **Intel** — 1Q27 가이던스 QoQ 플랫 이상(PC 바닥 + DCAI 공급 증가) 확인 후
→ 비선호: Intel (1Q27 가이던스 전까지)
