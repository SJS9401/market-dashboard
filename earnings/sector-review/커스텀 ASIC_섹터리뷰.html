## 2026-Q2 섹터 리뷰

> 대상: Broadcom FQ3 FY26, Marvell FQ2 FY27 (둘 다 2026년 5～7월). 개별 v11 실적 리뷰 없음 — 기업개요 v1.0 기준 [준비판]
> 2층 구조의 서브섹터 리뷰다. 섹터 비중(1단계)과 서브섹터 순위(2단계)는 반도체 통합 리뷰(`반도체_섹터리뷰.md`, 잠정판)가 맡는다. 이 문서는 커스텀 ASIC 판정, 서브섹터 안 대비, 1등 종목(3단계)에 답한다
> 첫 커스텀 ASIC 리뷰라 직전 분기 관전 포인트·⑦ 콜 체크는 없다
> 참고: `earnings-review/2026-Q2_AVGO_리뷰.md`는 FQ2 FY26(2026년 2～4월)을 "2026-Q2"로 적은 옛 형식 리뷰다. 이 문서의 캘린더 기준으로는 **1Q26**에 해당한다

→ 컨센서스는 확보하지 못했다. 3Q26E는 가이던스 중간값만 쓴다. 두 회사 모두 최근 분기에 가이던스를 넘겼다는 점은 기업개요에서 확인된다(예: Broadcom FQ2 FY26 매출 $22.2B vs 가이던스 $22.0B — `2026-Q2_AVGO_리뷰.md`) [준비판]

→ **2025년 = 30～40%대 고원**: 합산 영업이익 YoY는 4Q24부터 4Q25까지 +43% → +30%로 천천히 내려왔다(둔화 3번·유지 2번). 1Q26(+51%)에 방향을 틀었고 2Q26(+89%)에 크게 뛰었다. Broadcom AI 반도체 매출이 $5.2B → $16.7B(+221%)로 늘어난 분기다
→ **컨센 경로상 정점**: 가이던스 경로로는 3Q26 +90.5%로 YoY가 한 번 더 높아진다(델타 +1.3%p = 유지). 반면 OPM은 65.3% → 63.6%로 표본에서 처음 꺾인다 — XPU·랙 매출 비중이 커지면서 매출총이익률이 희석되기 때문이다(③(3)). 4Q26 경로는 Broadcom이 12/9 내놓을 FQ1 FY27 가이던스가 정한다. 회사 전망대로 FY2027 AI 매출이 약 $115B(FY2026 약 $58B의 2배)면 2027년 내내 YoY가 높은 수준에 머무는 경로다 [판단]

→ **내러티브 판정 근거 (종목)** [판단]: Broadcom — 2Q26 분기 안에 Google 차세대 TPU 장기공급계약(최장 2031)·Anthropic 확대(4/6 8-K), AI XPV 플랫폼(6월), Apple 커스텀 ASIC 계약 연장(7/6 8-K)이 나왔고, 발표 때 FY2027·2028 AI 전망을 처음 제시했다 → 강화. Marvell — Google TPU 생태계 커스텀 계약(7/29, 워런트 최대 5,897만 주)·Nvidia 전환우선주 $2.0B(3/31)가 나왔고, FY2027 매출 약 $12B·FY2028 약 $18B를 제시했다 → 강화. **단 분기가 끝난 뒤 나온 악재(Broadcom 잔존가치 보증 최대 약 $43B 10/27, Marvell Lumentum 전액 주식 인수 11/2, 11/5 섹터 급락)는 3Q26 판정에서 반영한다**
→ **델타 순위**: 2Q26 델타는 Broadcom(+39.8%p) > Marvell(+12.7%p). 3Q26 가이던스 델타로 보면 Marvell(+12.0%p) > Broadcom(+0.5%p)으로 순서가 바뀐다 — Broadcom은 2Q26에 +92%까지 올라간 뒤 그 수준을 유지하는 경로이고, Marvell은 데이터센터 커스텀 매출이 하반기에 가속하는 경로다(FY2026 커스텀 약 $1.5B → "FY2027 하반기 급가속", 기업개요 ③ 사업 개요)
→ **섹터 델타를 끈 것**: Broadcom 반도체 사업부. 2Q26 반도체 사업부 영업이익 $12,770M(+144.8% YoY)로, 소프트웨어 $7,325M(+39.8%)의 3.6배를 더 늘렸다(증가액 +$7,553M vs +$2,087M) [계산 — 기업개요 사업부 분기 원자료]. Non-AI 반도체는 $4.2B(+5%)로 보탬이 거의 없다
→ **선행 종목은 Broadcom**이다. 가속이 1Q26에 먼저 시작됐고(Broadcom +52.4% vs Marvell +30.8%), 가이던스로 보면 YoY 고점(3Q26 약 +93%)에도 먼저 다가선다. Marvell은 1Q25에 +139%를 찍었지만 이는 통신 재고조정 저점(1Q24 OPM 23.3%) 기저효과였고, 이후 4Q25 +29%까지 내려왔다가 다시 가속 중이다 — 두 회사의 이익 사이클이 1～2개 분기 어긋나 있다 [판단]

→ 공통: 두 회사 모두 하이퍼스케일러 자체 설계 칩의 외주 설계·공급자다. 2026년에 장기계약(LTA)과 워런트 형태로 고객을 묶는 계약이 늘었다
→ 갈리는 지점: Broadcom은 **메인 XPU**(Google TPU 본체·Meta·OpenAI·Anthropic)이고, Marvell은 AWS 외에는 **XPU 부속(attach)** 위주다. Google 안에서는 Broadcom이 본체, Marvell이 주변 칩으로 함께 들어간다
→ **[판단]** 2Q26 델타 차이(+39.8%p vs +12.7%p)는 이 위치 차이를 그대로 보여준다. 메인 XPU는 랙·GW 단위로 매출이 붙고(Broadcom: GW당 콘텐츠 $20～30B), 부속 칩은 그보다 늦고 작게 붙는다. Marvell의 커스텀 매출이 데이터센터의 25%(FY2026 약 $1.5B / $6.1B)에서 회사 목표(FY2029 $12B 초과)대로 커지기 전까지 서브섹터 델타는 Broadcom이 정한다

(2) 고객 집중 (2사 공통)

| Marvell | **상위 10대 고객 82%**, 유통사 A 37%·직접 고객 A 14% | 10-K FY2026 |

→ 공통: 두 회사 모두 고객 수가 적고, 고객의 데이터센터 CapEx·부지·전력 일정에 따라 출하가 움직인다(Broadcom FQ3 FY26 컨콜 "다차원 병목", Marvell 10-Q가 데이터센터 입지 반대·전력·물 문제를 리스크로 새로 적음)
→ **[판단]** 고객 집중은 델타 가속 구간에서는 레버리지(대형 프로그램 하나가 YoY를 수십 %p 움직인다)이고, 둔화 구간에서는 급락 요인이다. Broadcom 재분류 트리거가 "단일 고객 50% 초과"인데, 2027년 Anthropic이 최대 XPU 고객이 된다는 전망이 맞으면 FY2026 10-K(12월 중순)부터 고객 구성이 바뀐다 — ⑥ 관전 포인트

| Marvell | Non-GAAP GPM 64.9%(FY2022) → 58.9%(FQ2 FY27) → 57.5～58.5%(FQ3 가이던스) | 36.6%(FQ2) → 약 37%(FQ3 계산) → FQ4 FY27에 장기 목표 38～40% 진입 | 커스텀 확대가 FQ3 GPM 하락 요인 |

→ (출처: 각 기업개요 ④ 밸류에이션·⑥ 가이던스·③ 리스크)
→ 공통: 커스텀 비중이 커질수록 GPM이 내려간다. Broadcom은 XPU에 HBM 같은 메모리까지 묶어 랙 단위로 팔기 시작했다
→ 갈리는 지점: OPM 방향이 반대다. Broadcom은 이미 OPM 66～68%라 GPM 희석이 OPM을 끌어내리고(3Q26 가이던스 -1.9%p), Marvell은 OPM이 30%대라 opex 레버리지가 GPM 희석을 이긴다(3Q26 +0.4%p, 4Q26 38～40%)
→ **[판단]** 섹터 합산 OPM이 3Q26에 처음 꺾이는 이유가 이것이다(65.3% → 63.6%). 영업이익 YoY는 매출 성장으로 유지되지만, "매출 YoY > 영업이익 YoY"로 뒤집히는 분기가 오면 델타가 꺾이는 신호다. 3Q26 가이던스상 매출 +88.9% vs 영업이익 +90.5%로 차이가 1.6%p까지 좁아진다 [계산]. NVDA 리뷰의 "ASIC 경쟁 속 GPU 가격결정력" 쟁점(`2026-Q3_NVDA_리뷰.md` 쟁점 3, SK증권: "모델사들은 엔비디아의 높은 마진을 좋아하지 않는다")은 이 마진 구조의 반대편이다 — 고객이 ASIC을 쓰는 이유가 낮은 마진(Broadcom: "XPU는 GPU 대비 절반 이하 비용")이다

→ 공통: 커스텀 XPU 다음 병목이 광·레이저·기판이라고 보고, 두 회사 모두 그 앞단 공정을 직접 갖기 시작했다
→ 갈리는 지점: Broadcom은 자체 증설(CapEx)로, Marvell은 대형 주식 인수로 간다. Marvell은 인수가 끝나면 주식 수가 약 1.5배가 되고(Marvell 67% : Lumentum 33%) 광부품 업황 사이클을 떠안는다 [기업개요 계산]
→ **[판단]** 광 사이클은 테마 연결 후보다. 같은 반도체 섹터의 파운드리 리뷰가 CoWoS·첨단 패키징을 에이전트AI의 구조적 병목으로 보고 있고(`2026-Q3_TSM_리뷰.md` — HPC 매출 +68% YoY, 비중 68%), 커스텀 ASIC 두 회사의 2027년 공급 확보(Broadcom "FY2027 공급 확보 완료", Marvell 공급 선급금 약 $1B)도 같은 병목을 상대한다

→ **델타 판정 근거**: 1Q26 → 2Q26 합산 Non-GAAP 영업이익 YoY가 +51.1% → +89.2%(+38.1%p)로 기준(+5%p 초과)을 크게 넘었다. 1Q26(+20.7%p)에 이은 2개 분기 연속 확대이고 두 종목 모두 가속이다 — "가속"
→ **다음 분기 예고**: 가이던스 중간값 합산은 3Q26 +90.5%(+1.3%p)로 "유지" 경로다. Broadcom은 +92.2% → +92.7%(유지), Marvell은 +43.6% → +55.6%(가속)이다. 섹터 "가속" 판정을 이어가려면 3Q26 합산 영업이익이 $24.61B 이상이어야 하고, 이는 Broadcom이 가이던스보다 영업이익을 약 $0.47B 더 내야 한다는 뜻이다(Marvell 가이던스 달성 전제: Broadcom 매출 $34.8B에서 Non-GAAP OPM 약 67.3%, 또는 OPM 66%에서 매출 약 $35.5B) [계산]
