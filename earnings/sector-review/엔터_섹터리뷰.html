→ **합산 방식**: 종목 실적 리뷰 1-1 표의 보고 기준 매출·영업이익을 **고정환율(3Q26 평균)로 원화 환산**해 합산 — $1 = 1,419원(한국은행, MBW 인용), €1 = 1,590원(Spotify 3Q26 €4.969B = $5.569B 역산), RMB 1 = 211원(TME 3Q26 RMB 8.94B = $1.33B 역산) [계산]. 분기마다 환율을 바꾸지 않아 YoY에 환율 효과가 섞이지 않는다(현지 통화 YoY와 같은 성격)
→ **UMG 제외**: UMG는 1·3분기에 IFRS 영업이익을 공시하지 않아(조정 EBITDA만) 같은 표본 원칙대로 모든 분기에서 뺐다. UMG 단독 판정(조정 EBITDA 기준 가속)은 ② 순위표와 ⑦에만 쓴다
→ **중복 제거**: 에스엠은 2Q25부터 디어유를 연결 → 에스엠 숫자에서 디어유 몫을 빼고 디어유는 팬덤 플랫폼에 따로 넣었다
→ **이익 비중**: 3Q26 합산 영업이익 31,917억원 중 Live Nation 40%·Spotify 33%·TME 18%·한국 5사 9% [계산] — **섹터 합산 델타는 사실상 글로벌 하류(공연·음원)가 정한다**
→ 1Q26 합산 −48.9%: Live Nation 반독점 소송 충당금(영업손실 −$371M), 하이브 주식증여 비용 2,550억, TME 1Q25 간주처분이익 고기저가 겹친 분기 — 모두 보고 기준 그대로 판정(꺾임)

→ 판정은 각 종목 리뷰·기획사 서브섹터 리뷰 그대로. 팬덤 플랫폼은 1종목이라 디어유 리뷰 판정(꺾임)을 따른다
→ 비영업 요인: 기획사 가속 = 하이브 3Q25 적자 기저 / 음원 TME = Ximalaya 인수 편입(오가닉 분리 불가)·기타이익 / UMG = Downtown 인수(제외해도 +7.8%) / 공연 Live Nation = 3Q26 해당 없음 — **인수 주도 가속으로 집계를 바꿀 종목은 없음**
→ **선행 종목**: 와이지(3Q25)·에스엠(본사 1Q26)·디어유(4Q25 정점)가 먼저 꺾였고, 글로벌은 Spotify가 3Q26에 둔화 시작. 가속은 Live Nation(오가닉)·하이브(기저)·UMG(회복 초입)·JYP(4Q 꺾임 예고)

③ 섹터 공통 쟁점

(1) **가격이 성장을 끈다** — Spotify·UMG·TME
(1-1) Spotify Premium ARPU +9.3%(매출 성장의 절반이 가격) / UMG 오가닉 구독 성장의 1/3 이상이 가격(Streaming 2.0) / TME 멤버십 +9.2%는 SVIP(5배 요금) 믹스 (각 리뷰)
(1-2) [판단] 음원 하류는 가입자보다 **가격**으로 크는 국면. 가격 인상 1년 경과(2027년 1H)에 기저가 붙으면 음원 서브섹터 매출 성장률이 한 단계 내려갈 위험

(2) **투어·공연 사이클** — 하이브·와이지·JYP·Live Nation
(2-1) 하이브 공연 +197%(BTS) / 와이지 −57%(BLACKPINK 기저) / JYP 콘서트 −31% / Live Nation 관객 +19%, 3만석 이상 스타디움 성장률 최고(Pollstar — BTS가 최고 흥행 투어 헤드라이너) (각 리뷰)
(2-2) [판단] 같은 '공연'이라도 기획사는 IP별 투어 유무로 출렁이고, Live Nation은 수천 개 공연의 합이라 매끄럽다. 2027년 BTS 투어 종료는 하이브에는 기저 부담, Live Nation에는 라인업 하나의 공백일 뿐 — **상류는 변동, 하류는 분산**

(3) **팬덤 수익화 — MD·플랫폼** — 기획사 4사·디어유·TME
(3-1) 기획사 4사 MD 모두 +23\~99% / 디어유 버블 구독 197만으로 2개 분기 정체, 성장분은 QQ뮤직 로열티뿐 / TME SVIP·아티스트 MD·공연 매출(마케팅·소비 +12.1%) (각 리뷰)
(3-2) [판단] 팬덤 지출은 늘지만 그 돈이 **현장·굿즈(MD)** 로 가고 **구독형 플랫폼(버블)** 으로는 덜 간다. 디어유 꺾임과 기획사 MD 성장이 같은 흐름의 양면

(4) **비용·마진 압박** — Spotify·Live Nation·TME·디어유
(4-1) Spotify 영업비용 +19%(마케팅·클라우드·AI) / Live Nation AOI 마진 11.7%(전년 12.2%) / TME 영업비용 +16.9% / 디어유 뉴욕 버블 하우스 손실 약 −17억 (각 리뷰)
(4-2) [판단] 매출은 가속(합산 +19.3%)하는데 영업이익 YoY는 둔화(+18.2%) — 섹터 전반에서 **매출 레버리지가 비용 투자로 상쇄**되는 중

(5) **원화 강세 외화평가손실** — 하이브·에스엠·디어유 (영업외, 판정 무관)

→ 종목 고유 이슈: Live Nation — 반독점 구제 판결 / UMG — Pershing 인수 제안 거절 후 재평가 촉매 / TME — KPI 공시 중단·Ximalaya 오가닉 불명 / JYP — TWICE 재계약 / 에스엠 — IR 잠정 vs 확정 차이

⑦ 글로벌 PM 포지셔닝 — 결론

> **섹터: 비중 유지(중립) — 4Q26 합산 YoY 18.2% 미만이면 축소** | **서브섹터: 공연 확대 > 기획사(하이브) 유지 > 음원 유지 > 팬덤 축소** | **한국: 언더퍼폼 (예외 하이브)**

(1) 섹터 비중 — 중립 [판단]

| 판단 축 | 이번 분기 근거 (수치) | 방향 |
|---|---|---|
| 이익 델타 (1순위) | 합산 영업이익 YoY +25.7% → +18.2%, 둔화 | 중립 |
| YoY 정점 시점 | 섹터 정점 4Q25(+53%) 통과, 이번 분기 정점 통과 종목 5사(와이지·에스엠·디어유·Spotify·TME) | 축소 쪽 |
| 선행지표 | Live Nation 이연매출 $3.8B(+8%)·2027 선판매 두 자릿수 / Spotify 4Q 가이던스 영업이익 +17% | 중립\~확대 |
| 최종 수요 | 관객 +19%, 유료 구독 Spotify 3.06억(+9%) — 수요는 견조, 성장은 가격 의존 | 중립 |
| 이벤트·정책 | Live Nation 반독점 구제 판결, UMG Apple 계약, 하이브 BTS 2027 활동 | 양방향 |
| 밸류에이션 (2순위) | 하이브 TP 하향은 멀티플, JYP 외국계는 실적 하향 | 축소 쪽 |
| 주가 낙폭 | 하이브 고점 대비 −62%, JYP −68%, UMG 제안가 대비 −42% | 디레이팅 선행 |

→ 델타는 둔화지만 플러스이고, 이익 비중이 큰 공연(Live Nation)이 가속 중이라 섹터 전체를 줄일 근거는 아직 약하다 → **중립**. 섹터 베타보다 공연·하이브로 비중을 옮기는 구간
→ 축소 전환: 4Q26 합산 YoY 18.2% 미만(꺾임) 또는 Live Nation 반독점 구제가 티켓마스터 분리로 결론
→ 확대 전환: 4Q26 합산 YoY 23.2% 이상 + Live Nation 2027 가이던스 두 자릿수 + 하이브 2027년 BTS 활동 확정

(2) 한국 vs 글로벌 — 한국 언더퍼폼 [판단]

| 국가 | 합산 편입 종목 (이번 분기) | 영업이익 YoY 2Q26 → 3Q26 | 델타 판정 | 제외 종목 |
|---|---|---|---|---|

| 유럽 | Spotify (UMG 제외) | +61.3% → +15.5% | 둔화 | UMG (분기 IFRS 영업이익 미공시) |

**서브섹터 × 국가 (밸류체인 상류 vs 하류)**

| 서브섹터 | 한국 (종목 · 영업이익 YoY 델타) | 글로벌 (종목 · 영업이익 YoY 델타) | 서브섹터 내 우위 | 한국 매출 비중 |
|---|---|---|---|---|
| 기획사 (IP 상류) | 하이브 n.m.(흑전), JYP +59.0%p, 에스엠 −41.4%p, 와이지 −87.6%p | 비교 불가 — 편입 종목 없음 | — | 100% |
| 팬덤 플랫폼 | 디어유 −21.3%p | 비교 불가 — 편입 종목 없음 (Weverse는 하이브 내부) | — | 100% |
| 음원 글로벌 (유통 하류) | 비교 불가 — 편입 종목 없음 | Spotify −45.8%p, TME −1.5%p, UMG +10.1%p(조정 EBITDA) | — | 0% |
| 공연 글로벌 (현장 하류) | 비교 불가 — 편입 종목 없음 | Live Nation +5.3%p | — | 0% |

→ 결론: **한국 언더퍼폼 = 믹스 효과 크다 + 서브섹터 내 효과 판단 불가.** 한국 종목은 전부 IP 상류(기획사·팬덤)에 있고, 상류는 투어 사이클로 출렁이며 2027년 감익 컨센이다. 하류(공연·음원)는 수천 개 IP의 합이라 델타가 매끄럽다. 같은 서브섹터 안 비교는 구조상 불가
→ 이유 3개: ① 델타 — 하이브 제외 한국 4사는 2개 분기 연속 마이너스, 글로벌은 4사 중 2사 가속(Live Nation·UMG) ② 이익 추정 — 한국은 외국계 JYP·와이지 실적 하향, 하이브 2027E 감익 / 글로벌은 Live Nation 가이던스 3분기 연속 상향(Ticketing), Spotify 4Q 가이던스 +17% ③ 구조 — 한국 IP 이익은 소수 아티스트 투어에 집중(하이브 공연 매출 +197%가 증가분의 60%)
→ 반대 논거: 한국 기획사 주가는 이미 고점 대비 60%대 하락(하이브 −62%, JYP −68%)으로 2027년 감익을 상당 부분 반영했다. 하이브 2027년 하반기 BTS 활동이 확정되면 가장 크게 반등할 수 있는 건 한국 쪽 — **델타 프레임 결론이며 가치 프레임이면 반대일 수 있다**
→ 예외 종목: **하이브** — 한국 언더퍼폼 안에서 유일하게 다음 분기(4Q26E)까지 YoY 증가 경로
→ 비교 범위: 글로벌 4사 모두 숫자 중심 실적 리뷰가 있는 편입 종목(셀사이드 첨부 0건) / 한국 5사는 셀사이드 첨부 풀 리뷰. 근거 깊이가 한국 쪽이 두껍다

→ **반등 후보 (이벤트 드리븐)**: UMG — 조정 EBITDA 가속 + Pershing 제안가(€30.40) 대비 −42% / 확인 이벤트: FY26 실적에서 4Q 조정 EBITDA 두 자릿수, Apple Streaming 2.0 체결. 에스엠 — 2027 증익 컨센 / 확인 이벤트: 1Q27 영업이익 YoY 플러스 복귀
