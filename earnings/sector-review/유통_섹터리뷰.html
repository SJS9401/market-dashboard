## 2026-Q3 섹터 리뷰

> 대상: `earnings-review/2026-Q3_실리콘투_리뷰.md` (2026-11-22 작성, 통합 검수 완료, 셀사이드 6건). 교차 확인용 참고: 같은 섹터 브랜드사 `2026-Q3_{에이피알|달바글로벌|아모레퍼시픽}_리뷰.md`, ODM `2026-Q3_{코스맥스|한국콜마|코스메카코리아}_리뷰.md` — 합산에는 넣지 않는다
> 2층 구조의 서브섹터 리뷰다. 뷰티 섹터 비중(1단계)과 서브섹터 순위(2단계)는 뷰티 통합 리뷰(`뷰티_섹터리뷰.md`, 미작성)가 맡는다. 이 문서는 유통 판정, K-뷰티 수출 채널 지표로서의 교차 검증, 유통 1등 종목(3단계)에 답한다
> 첫 유통 리뷰라 직전 분기 관전 포인트·⑦ 콜 체크는 없다
> **국가 프레임 구멍**: 글로벌 종목 없음 (K-뷰티 B2B 수출 유통에 직접 대응하는 상장 글로벌 피어가 없다) → ⑦(2)는 `비교 불가 — 편입 종목 없음`, 대체 축으로 "유통(실리콘투) vs 브랜드 직진출(에이피알·달바)"을 쓴다. 편입 후보는 ⑦(2) 끝에 제안
> **비영업 요인**: 종목 리뷰 ⚠ 플래그 = 원화 강세(영업 내 GPM -3.3%p QoQ + 영업외 외환 손실 577억원), 일회성 대손상각비 23억원(영업이익 포함), 미국 관세 환입(영업외). 판정은 보고 기준 그대로 쓰고 ② 비영업 요인 열·④ 근거에 표시한다. 인수 주도 가속 해당 없음

③ 섹터 공통 쟁점 — K-뷰티 수출 채널 지표로서의 교차 검증

> 편입 종목이 1개라 "2개 종목 이상 공통 쟁점"은 성립하지 않는다. 아래는 실리콘투 쟁점을 같은 분기 브랜드사·ODM 리뷰와 맞대어, 유통 숫자가 K-뷰티 수출 전체에 대해 무엇을 말하는지 교차 확인한 것이다

(1) 원화 강세 — 뷰티 전 종목 공통, 유통이 가장 민감

| 리뷰 | 같은 쟁점이 어떻게 나왔나 | 영업이익에 들어갔나 |
|---|---|---|
| 실리콘투 | GPM 32.0% → 28.7%(-3.3%p QoQ), 영업외 외환 손실 577억원(미실현 약 390억원), 순이익 -85% | 영업 내(GPM) + 영업외 |
| 에이피알 | 환율 영향 -278억원(IFRS 18 외화 매출채권 환손실 OPM -1.9%p + 환산 매출·원가율 -1.7%p) | 영업 내 (IFRS 18) |
| 아모레퍼시픽 | 영업외손익 -442억원(대부분 외환손실), 순이익 -14% | 영업외만 |
| 코스맥스 | 영업외 외화 관련 손실 277억원 | 영업외만 |
| 코스메카코리아 | 외화환산손실 약 103억원, 순이익 -35% | 영업외만 |
| 달바글로벌 | 외환 관련 손실 47억원 | 영업외만 |

→ (출처: 각 종목 2026-Q3 리뷰 상단 비영업 요인·⚠ 플래그)
→ **[판단]** 원화 강세가 **영업이익(마진)까지 깎은 곳은 유통(실리콘투)과 직진출 브랜드(에이피알) 둘**이다. ODM·아모레는 순이익만 맞았다. 실리콘투는 원가가 원화 매입, 매출 98%가 외화라 환율이 GPM에 바로 꽂히는 "순수 수출 유통" 구조이고(외화 10% = 세전이익 ±423억원, 연간 영업이익의 약 15%), 뷰티 안에서 환율 베타가 가장 크다. **K-뷰티 수출 채널 지표로 쓸 때 실리콘투 마진은 수요가 아니라 환율 지표**로 읽어야 한다
→ **4Q 환율 체크** [계산]: 4Q26 누적 원/달러(10/1~11/13, Yahoo 일간 종가 평균, `방산_섹터리뷰.md` 환율표) 약 1,338원으로 3Q26 평균(1,417~1,421원, Yahoo·NH)보다 약 -6% 더 강하다. 셀사이드 4Q GPM 회복(삼성 29.8%) 가정의 전제인 "환율 변동성 완화"가 아직 숫자로 나오지 않았다

(2) 수요는 살아 있다 — 유통 매출은 한국 화장품 수출과 같은 속도

| 지표 | 3Q26 | 비고 |
|---|---|---|
| 실리콘투 매출 YoY | +41.7% | 매출 98% 수출 |
| 한국 화장품 수출 (HS 3304) YoY | 7월 +36%, 8월 +53%, 9월 +30% (3Q 평균 약 +38%) → 10월 +57%(잠정), 11월 1~10일 +64% | `2026-Q3_코스맥스_리뷰.md` 2번(NH 표5, TRASS) |
| 코스맥스 한국 법인 매출 YoY | +23.3% → **+60.7%** | ODM 국내 = 수출 브랜드 생산 |
| 한국콜마 화장품(proxy) 영업이익 YoY | +48.7% → **+72.5%** | `2026-Q3_한국콜마_리뷰.md` |

→ **[판단]** 유통 매출 YoY(+42%)는 3Q 수출 평균(약 +38%)과 거의 같은 속도로, 유통 외형은 수출 수요를 그대로 따라가고 있다. 수요 축의 둔화는 없다 — 오히려 10~11월 수출(+57~64%)과 ODM 국내 가속은 **4Q 유통 매출에 순풍**이다. 따라서 3Q 유통 델타 둔화는 수요가 아니라 **마진(환율) + 채널 지위(아래 (3))** 문제다
→ ODM과 유통이 엇갈리는 이유: ODM은 원화 매출(국내 법인) 비중이 커 환율이 영업이익에 안 들어오고, 생산 물량 증가가 바로 레버리지로 간다. 유통은 같은 수요를 받지만 외화 매출 환산과 저마진 대형 거래선 믹스가 마진을 깎는다

(3) 채널 지위 — 브랜드 직진출이 유통 몫을 가져간다

| 권역 (3Q26 매출 YoY) | 실리콘투 (유통) | 에이피알 (브랜드, 직진출) | 달바글로벌 (브랜드) | 아모레퍼시픽 |
|---|---|---|---|---|
| 유럽 | +57.7% (1Q +99 → 2Q +62 → 3Q +58, 3개 분기 감속, QoQ -7%) | **+738%** (QoQ +22.6%) | +163% (1Q +254 → 2Q +240) | EMEA +9.9% |
| 북미 | +49.4% (QoQ +24%) | +117.5% (QoQ -5.5%) | +31.8% (2Q +174% → 급감속) | 미주 +16.8% |
| 중남미·기타 | 중남미 +123% | 기타(중동·중남미) +311% | 기타 +274% | — |
| 아시아 | +4.8% | +11.3% | 일본 +34% | 기타 아시아 +19.5% |

→ (출처: `2026-Q3_실리콘투_리뷰.md` 1-③(2), `2026-Q3_에이피알_리뷰.md` 1-②(2), `2026-Q3_달바글로벌_리뷰.md` 1-②(2), `2026-Q3_아모레퍼시픽_리뷰.md` 1-②. 에이피알 유럽 YoY 1Q26 +334%·2Q26 +380% = 리뷰 표 원자료 [계산])
→ **[판단] 유럽이 가장 선명한 신호다.** K-뷰티 유럽 수요는 브랜드 숫자로 보면 오히려 가속(에이피알 +334% → +738%)인데, 유통의 유럽은 3개 분기 연속 감속했다. 유로 기준 QoQ 보합(실리콘투 리뷰 [계산])이라 환율·계절만으로는 설명이 안 된다. 1위 브랜드(메디큐브)가 아마존 EU·부츠 등 직진출을 늘리고, 2위 브랜드(조선미녀·구다이글로벌)가 한성USA 인수로 자체 유통을 키우면서 **유통이 연 시장을 브랜드가 직접 가져가는 단계**에 들어섰다
→ 북미는 반대다: 유통 북미가 QoQ +24%로 재가속하는 동안 에이피알 북미는 QoQ -5.5%, 달바 북미는 +174% → +32%로 급감속했다. 북미 유통 재가속은 Ulta·Target·Sam's Club 등 **오프라인 리테일러 입점 대행** 수요(브랜드가 직접 못 하는 영역)다. 유통의 역할이 "신규 지역 개척"에서 "대형 오프라인 리테일러·신흥 지역(중남미) 대행"으로 이동하고 있다
→ **K-뷰티 수출 채널 지표로서의 함의**: 유통 매출 YoY가 수출 YoY를 밑돌기 시작하면(지금은 비슷) 직유통 전환이 수요를 잠식하는 것이다. 4Q 수출(+57~64%) 대비 유통 매출 컨센(+37%)이 이미 20%p 이상 낮다 → 컨센 자체가 "유통 몫 축소"를 내재하고 있다 [판단]

(4) 멀티플 압축 — 뷰티 공통, 유통 할인이 더 크다
→ 실리콘투: TP 평균 -26.1%(5.36 → 3.96만원), 목표 PER 11~13배 → 8~10.5배, 2027E 영업이익 하향은 -6%. 유안타는 "대형 브랜드 직유통 전환"을 멀티플 할인 근거로 명시
→ 에이피알: TP 평균 -11.4%, 목표 PER 27~28배 → 18.5~25배, 연간 영업이익 하향 -2~5% (`2026-Q3_에이피알_리뷰.md` 2번 쟁점 ③)
→ **[판단]** 뷰티 전반의 멀티플 압축 위에 유통 고유의 할인(환율 민감도 + 브랜드 이탈)이 얹혔다. 주가는 52주 고가 대비 -56%(11/13 24,000원), 12MF PER 5.9~6배로 역사적 하단

(5) 종목 고유 이슈
→ 매출채권: 내셔널 리테일러 여신 거래 확대로 매출채권 1,112억원(2024말 422억원), 첫 대손 23억원(다올이 처음 부각)

→ 순이익은 분기말 환율 파생 지표 — 미실현 환산손실 약 390억원의 4Q 환입 여부가 12/31 환율에 걸려 있다

④ 섹터 판정

→ (2) 레이어 성격: 유통의 마진 하락 일부(유럽 내셔널 리테일러·중남미 대형 거래선 저마진 믹스)는 신규 채널 확장의 비용이다. 2027 월마트·코스트코·더글라스 직거래가 매출로 들어오면 외형 델타는 다시 커질 수 있다 — 다만 마진은 더 낮아지는 방향이다 [판단]
→ (3) 원화 약세 전환 시 GPM·환산이익이 동시에 돌아오는 비대칭 — 환율 한 변수에 델타 방향이 뒤집힐 수 있다

⑦ 글로벌 PM 포지셔닝 — 결론

> **서브섹터: 축소 — 4Q26 영업이익 YoY +15.4%(489억원) 이상 + GPM 29.5% 이상이면 유지로 상향** | **서브섹터 내: 한국 해당 없음 (글로벌 피어 없음 — 비교 불가)** | **1등: 실리콘투 (한국, 유일) / 글로벌 1등 없음**

→ **결론: 서브섹터 축소** [판단]. 델타 1순위 프레임에서 둔화 + 약화, 컨센 경로상 정점 통과, 환율 역풍이 4Q에도 이어진다. 같은 K-뷰티 수요를 받는 ODM(코스맥스 가속·강화)이 레버리지 측면에서 더 깨끗한 노출이다 — 뷰티 안 비중 이동은 통합 리뷰가 판단한다
→ 델타 방향과 정점 시점이 엇갈리는 지점: 4Q26은 저기저로 보고 기준 "가속"이 나올 가능성이 높다(컨센 +34%). 이 가속은 정점(2Q26 +59%) 아래의 기저 효과라 **GPM 동반 없이는 축소 콜을 바꾸지 않는다**

→ **확대 조건**: 위 + 1Q27 영업이익 YoY 컨센(+21%) 상회 경로 + 원화 약세 전환 — 정상 기저에서 재가속 확인
→ **축소 유지·강화 조건**: 4Q26 영업이익 447억원 미만(꺾임) 또는 메디큐브 등 1위권 브랜드의 직유통 확대로 유통 매출 YoY가 수출 YoY를 10%p 이상 하회
