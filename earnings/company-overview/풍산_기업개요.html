## 1. 기업 분류

- **Primary 분류: 사이클 — 혼합형 (신동 = 구리 가격·메탈 사이클 / 방산 = 지정학·납기 사이클)** — 매출은 LME 구리 가격을 거의 그대로 따라가고(신동 판가 = 전기동 가격 + 가공비), 이익은 ① 구리 가격 방향에 따른 메탈게인/로스와 ② 방산 탄약의 수출 선적·내수 납품 타이밍에 따라 크게 출렁인다. 12년 OPM range 1.7\~9.0% (폭 7.3%p)
- **Secondary 노트: 방산(탄약) 구조적 성장** — 2022 러-우 전쟁 이후 155mm 등 대구경탄·추진제 공급 부족이 이어지며 방산 매출 0.72조(2020) → 1.31조(2025), 부문 세전이익 584억 → 2,108억. 2023\~2025 연결 세전이익의 **88\~91%가 방산**이었다 [DART 부문별 재무정보, 계산]. 다만 9M26은 구리 급등으로 신동이 세전 2,108억을 내며 방산 비중이 30%로 역전 — 이익의 축이 분기마다 바뀌는 구조

### ② 산업 분류

- 산업: **신동(伸銅, 구리·구리합금 압연·압출 소재)** + **방위산업(군용·스포츠 탄약)** 2개 사업
- DART 업종: 242 1차 비철금속 제조업 [OpenDART 기업개황]
- 워치리스트 섹터: **철강·비철** / 서브섹터: **비철 (고려아연·풍산)**
- 시장 지위 (회사 추정, DART 분기보고서(2026.09)): 판·대 국내 50%, 반도체 리드프레임 소재 국내 89%, 봉·선 18%, 소전(주화 소재) 58%(국내+해외), PMX(미국 압연) 20%, PMC(미국 소구경 스포츠탄) 24%. 국내 군용 탄약은 사실상 독점 공급자 [IB토마토 2026-04-17 — 한화의 인수 시 공정위 기업결합 심사 우려로 언급]

### ③ 분류 결정 논리

**(1) 가장 매출 큰 사업부 기준 적용 시: 신동 → 사이클**
→ 신동이 연결 매출의 72\~83% (2025 74%, 9M26 83%)
→ 판가가 LME 전기동 가격에 연동되고 판매량은 18\~20만톤(별도)에서 정체 — 매출 = 구리 가격 함수
→ 구리 상승기: 저가 재고 투입 → 메탈게인 (1Q26 신동 세전률 9.5%), 하락기: 메탈로스 (3Q22 -3.4%, 4Q18 -2.6%)

**(2) 단, 이익 비중 우선 sub-rule 적용 시: 방산 → 사이클(지정학) + 구조적 성장 혼합**
→ 2023\~2025 연결 세전이익의 88\~91%가 방산 [DART 부문별 재무정보]
→ 방산 역시 분기 변동이 크다: 세전률 1Q19 1.3% ↔ 2Q24 29.5%. 내수는 정부 전력화 계획에 따라 4분기에 몰리고(매년 4Q 내수 매출 최대), 수출은 계약·선적 시점에 따라 들쭉날쭉
→ 러-우 전쟁 이후 탄약 공급 부족이 이어지는 동안은 "성장"이지만, 휴전·재고 정상화 시 수요가 꺾일 수 있는 지정학 사이클

**(3) Boundary case 처리: Primary 사이클(혼합형) + Secondary 방산 성장**
→ 두 사업 모두 사이클이지만 사이클의 원인이 다르다 (구리 가격 vs 지정학·납기). 두 사이클이 같은 방향일 때(2021, 2024 상반기) 이익이 크게 늘고, 엇갈리면 서로 상쇄
→ 9M26처럼 신동이 다시 이익 중심이 되는 시기에는 구리 가격 민감도가 높아진다 — 4Q26 메탈로스 확대 예상(3Q 120억 → 4Q 400억, BNK투자증권 추정 [아시아경제 2026-11-04])

**(4) 글로벌 피어 대비:**
→ 신동 피어: Wieland(독일, 비상장)·Mitsubishi Materials·Furukawa Electric(일본)·Aurubis(독일, 제련+압연) — 판가 구리 연동 + 가공 마진 구조 동일
→ 탄약 피어: Rheinmetall(독일)·Nammo(노르웨이·핀란드, 비상장)·CSG(체코)·Olin Winchester(미국 스포츠탄)·한화에어로스페이스(국내 추진장약·탄약)
→ 풍산은 두 사업을 한 회사에 묶은 드문 구조 — 순수 탄약 피어 대비 구리 사이클 할인, 순수 신동 피어 대비 방산 프리미엄이 동시에 붙는다

### ④ 적정 밸류에이션 방법

- **PBR (사이클 밴드) 1순위** — 이익이 구리·납기에 따라 출렁여 PER이 분기마다 왜곡됨. 2008 분할 이후 연말 PBR은 대체로 0.5\~1.0배 밴드 (2025말 시총 2.98조 ÷ 자본 2.30조 = **1.30배**로 밴드 상단 이탈 → 2026-11-24 1.29조 ÷ 3Q26 자본 2.44조 = **0.53배**로 밴드 하단 복귀) [계산]
- **SOTP 2순위** — 신동(사이클 소재: EV/EBITDA·PBR 피어 평균) + 방산(탄약: PER, 유럽 탄약 피어 대비 할인) 분리 평가. 방산이 세전이익의 70\~90%를 내는 해에는 SOTP가 PBR보다 설명력이 큼
- **PER 보조** — 직전 4분기 지배순이익 2,320억 (4Q25 88억 + 1Q26 780억 + 2Q26 825억 + 3Q26 627억) 기준 **PER 5.6배** [계산]. 4Q25 법인세 일회성 탓에 trailing PER이 높게 나오는 구간이 있으니 세전이익 기준으로 함께 볼 것
- 순수 탄약 피어(PER 고배수)와 단순 비교 금지 — ① 신동 사이클 이익 ② 지주사 풍산홀딩스 할인 ③ 승계·방산 지배권 제약(아래 ⑤·5장)이 디스카운트 요인

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **방산 세전이익 비중이 4개 분기 연속 70%+ 유지 + 방산 매출 비중 35%+** → Primary를 "방산(탄약) 성장"으로 재분류 검토 (현재 매출 비중 17\~28%)
- **방산 부문 분할·매각 확정** (2026-04 한화에어로스페이스 협상 무산 이후 회장이 "더 이상 추진 안 함" 발언 [한경비즈니스 2026-07-31]) → 잔존 사업 기준 "순수 신동 사이클"로 재분류
- **신동 세전률이 8개 분기 연속 3%+ 유지** (구리 방향과 무관하게) → 신동을 "가공마진형 지속성장"으로 격상 검토 — 반도체·AI 데이터센터용 고기능 합금 비중 확대가 근거가 될 수 있음

**narrative:**
- 풍산 주가는 오랫동안 **구리 가격의 레버리지 지표**였다 (2010·2017 고점 = 구리 고점). 2008 분할 후 17년간 시총 0.5\~1.6조 박스권
- **2022년 이후 방산이 두 번째 엔진**이 되면서 박스권을 돌파 — 2024 방산 세전이익 2,863억(전사 세전의 88%)
- 2025-06\~07 **구리 + 방산 동시 랠리**로 시총 4.6조까지 올랐으나, 2026년에는 ① 탄약 매각 무산(승계 불확실성) ② 방산 납기 지연 ③ 구리 가격 고점 논란이 겹치며 고점 대비 -72%
- 9M26 영업이익은 사상 최대(3,242억)인데 주가는 고점의 1/4 — 시장은 "올해 이익의 질(메탈게인 비중)"과 "방산 2027 수요 지속성"을 의심하는 구간

### ③ 사업부별 디테일

**(1) 신동 — "가공비 + 메탈 손익" 구조**
→ 판가 = LME 전기동 가격 + 가공비(roll margin). 구리 가격이 오르면 매출은 자동으로 늘지만 **이익의 본체는 가공비 × 판매량**이고, 그 위에 재고 평가·투입 시차에서 생기는 **메탈게인/로스**가 얹힌다
→ 판매량(별도)은 2016\~2017 20만톤 → 2019\~2020 17.6\~17.9만톤 → 2025 18.3만톤으로 정체. 2026은 9M 13.5만톤(-1.1% YoY) — 자동차 소재 파업, 내수 건설 부진 영향 [DART 분기보고서(2026.09), IR 3Q26]
→ 성장 축: 반도체 리드프레임 소재(국내 점유율 89%), AI·데이터센터·전기차 커넥터용 고강도 합금 (Cu-Ni-Co-Si계, P80 양산 개발 2026\~2028) [DART 신규사업]
→ 원재료: 9M26 별도 매입 2조 3,793억 중 전기동 1조 1,340억(LS MnM 등), 스크랩 9,949억, 아연 865억(고려아연·풍전비철) — 스크랩 투입 비율 확대로 원가 절감 [DART 분기보고서(2026.09)]
→ 리스크 관리: 판매계약·보유재고에 대해 LME 선물 헤지. 그래도 구리 급변동 시 분기 세전률이 -3%\~+10%로 흔들림

**(2) 방산 — 탄약 전문, 수출이 이익을 좌우**
→ 제품: 소구경(5.56mm 등)·중구경·대구경(105/155mm) 군용탄, 스포츠탄(미국 PMC 브랜드, 미국 시장 점유율 24%), 추진화약, 신관(풍산FNS — 국내 신관 점유율 20\~41%)
→ 내수: 정부 전력화 계획 기반. 매년 4Q에 납품이 몰림 (4Q 내수 비중 높음). 2025 내수 6,213억으로 사상 최대
→ 수출: 2022 러-우 전쟁 이후 대구경탄 수요 급증 → 수출 비중 23%(2019) → 59%(2024). 2024 수출 6,972억 사상 최대 후 2025 5,656억으로 감소
→ 9M26 방산 별도 매출 6,770억(-12.8% YoY) — 내수 -27.6%(관급자재 차질), 수출 +1.5% [DART 분기보고서(2026.09)]
→ 신규 개발: 155mm 포병고폭연습탄 개발 완료, 21개 신규 개발 추진 [DART]
→ 승계 제약: 방위사업법상 외국인은 국내 방산업체를 직·간접적으로 지배할 수 없다 — 류진 회장의 장남(미국 시민권, 풍산홀딩스 지분 2.43%)이 현 구조로는 방산을 물려받을 수 없어 탄약 사업 분리 논의가 반복됨 [IB토마토 2026-04-17]

**(3) 이익 outlier**
→ **2Q24 방산 세전 1,046억 (세전률 29.5%)** — 수출 2,272억, 분기 사상 최대
→ **1Q26 신동 세전 1,036억 (9.5%)** — LME 분기평균 $12.8천(+37% YoY) 메탈게인. 신동이 단일 분기에 2023\~2025 3년 합계(846억)보다 많이 벌었다
→ **4Q25 순이익 88억** — 세전 596억 대비 법인세 약 508억 [계산: 연간 법인세 884억 − 9M 376억]. 이연법인세자산이 404억(2024말) → 19억(2025말)으로 감소한 영향으로 추정 [DART 재무상태표, 사유 미공시]
