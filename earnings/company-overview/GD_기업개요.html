## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 지속성장 (방산 장기 계약 기반, 저변동)**

→ 12년 매출 CAGR **+4.96%** [계산] (2014 $30.9B → 2025 $52.6B), 매출 역성장은 4회(2014·2016·2020)뿐이고 폭도 -4% 이내

→ OPM 범위 **10.0%~13.7%** (12년 진폭 3.7%p) — 사이클 기준(±10%p)과 거리가 멀다. 매출 75~80%가 미국 정부 원가가산·고정가 장기계약

→ 2023년 이후 **잠수함 슈퍼사이클**로 성장 가속: 매출 YoY 2023 +7.3% → 2024 +12.9% → 2025 +10.1% → 9M26 +10.4%

**Secondary 노트: 비즈니스 제트 사이클 (걸프스트림, 매출 25%)**

→ Aerospace OPM 2015 19.7% → 2021 12.7% (G500/G600 신기종 초기 생산 + COVID 인도 급감) → 2025 13.3% → 3Q26 14.5%. 신기종 출시 사이클(약 5~7년)마다 마진이 깎였다가 회복

**4개 사업부 구조 (TTM 4Q25~3Q26, $M)** [계산]

→ **(1) Marine Systems** — 매출 $18,781 (33%), 영업이익 $1,394, OPM 7.4% — Electric Boat(버지니아·콜럼비아급 핵잠수함), Bath Iron Works(DDG-51 구축함), NASSCO(보급함·ESB). **성장 최고 (TTM +18%)** [계산], 마진 최저

→ **(2) Aerospace** — 매출 $14,128 (25%), 영업이익 $1,997, OPM 14.1% — 걸프스트림 G300~G800, Jet Aviation 정비·FBO. **이익 1위**

→ **(3) Technologies** — 매출 $14,117 (25%), 영업이익 $1,314, OPM 9.3% — GDIT(국방·정보·연방 IT), Mission Systems(C5ISR, 암호장비, 무인잠수정)

→ **(4) Combat Systems** — 매출 $9,494 (17%), 영업이익 $1,339, OPM 14.1% — Land Systems(M1 에이브럼스, 스트라이커), European Land Systems(ASCOD·피라냐·이글·교량), OTS(155mm 포탄·로켓모터·탄약). **한국 지상방산과 직접 경쟁 영역**

→ **방산 3사업부 합계 (Marine+Combat+Technologies)**: 매출 $42,392 (75%), 영업이익 $4,047, OPM 9.5%

**한국 방산 5사 + 글로벌 피어 이익률 비교 (각사 3Q26 분기 기준)**

- 현대로템: 15.2% (OPM, 방산 AD&RH 28.1%) — 3Q26 매출 1.62조원
- **GD Combat Systems: 13.8%** (지상장비·탄약) / **GD 연결: 10.5%** / **GD 방산 3사업부: 9.7%** [계산]
- GD Marine Systems: 7.9% (잠수함) — 한화오션 특수선과 비교 참고

**피어 비교 시사점**

→ GD Combat(13~15%)는 현대로템 방산(25~29%)·한화에어로 지상방산(20%대) 대비 마진이 절반 수준 `[판단]` — 미국 정부 원가가산 계약(마진 상한) 구조와 한국 수출 고정가 계약(폴란드)의 차이

→ 대신 GD는 잔고 $220B(매출 3.9년치 [계산])로 **물량 가시성**에서 압도적 — 한국 5사는 마진, GD는 규모·가시성

(3) 분류 결정 논리

→ ① 매출 변동성 낮음(역성장 최대 -3.8%) ② OPM 진폭 3.7%p ③ 미 정부 매출 75%+ ④ 잔고/매출 4배 → **지속성장**

→ 단 Aerospace(25%)가 경기 민감 → Secondary로 비즈니스 제트 사이클 병기

(4) 적정 밸류에이션 방법

→ **PER 우선** (방산 프라임 표준, 안정 이익). 현재 P/E: 2026E EPS 가이던스 $17.20~17.30 기준 **21.1x** [계산], 2027E 컨센 $18.63(stockanalysis, 2026-10-15) 기준 **19.5x** [계산]

→ 보조: EV/EBITDA, FCF Yield (2026 9M FCF $4.8B)

→ 국내 비교: 현대로템 2026E P/E 약 11배(현대로템 3Q26 리뷰) — GD가 약 2배 프리미엄 `[판단]` (가시성·주주환원 29년 연속 배당 증가)

(5) 분류 변경 조건 (재평가 트리거)

→ **고성장 승격**: 방산 3사업부 매출 YoY 15%+ 4분기 지속 (잠수함 잔고 매출화 가속)

② 사업부별 개요 (TTM 매출 비중 순)

→ **Marine Systems (33%)**: 미 해군 잠수함 2대 건조사 중 하나 (다른 하나는 HII Newport News). Electric Boat가 콜럼비아급 SSBN 주계약자, 버지니아급 SSN은 HII와 분담. 3Q26 잔고 $146.9B = Marine 매출 약 8년치 [계산]

→ **Aerospace (25%)**: 걸프스트림 — 초대형(G700·G800), 대형(G500·G600·G400), 중형(G280 → G300 교체). 2025 인도 158대, 9M26 119대. 2030년 연 200대 목표 (3Q26 컨콜)

→ **Technologies (25%)**: GDIT(연방 IT 서비스·클라우드·AI) + Mission Systems(C5ISR, 암호, 무인잠수정). 마진 9%대, 단기 두 자릿수 회복은 어렵다고 회사 언급 (3Q26 컨콜 요약)

→ **Combat Systems (17%)**: 미국 Land Systems(M1 에이브럼스·스트라이커), European Land Systems(스페인 Santa Bárbara, 오스트리아 Steyr — ASCOD, 스위스 MOWAG — 피라냐·이글, 독일 — 교량), OTS(155mm 포탄·로켓모터·탄약)

③ 사업부별 디테일

(1) Combat Systems — 9M26 매출 증감 분해 ($M, 3Q26 10-Q)
→ 무기·탄약 +343 (포병탄 증산), 해외 군용차량 +108 (유럽 차륜·궤도 차량), 미국 군용차량 -203 (미 육군 재편·M10 Booker 종료)
→ 3Q26 European Land Systems 매출 +28%, 탄약(OTS) +16% (컨콜 요약, StatementDog)
→ 회사 전망: 미 육군 차세대 전환기로 "단기 전투차량 생산량은 소폭 감소", 탄약 수요는 "높은 수준 유지" (3Q26 10-Q MD&A)

(2) Marine Systems — 콜럼비아급·버지니아급 증산
→ 3Q26 매출 +21%, OPM 7.9% (버지니아 Block IV 완료 근접 일회성 호조 포함, 기준선 "mid-7%"), Electric Boat 인력 연내 약 8,000명 순증 계획 (컨콜 요약)

(3) Aerospace — 신기종 주기
→ G700(2024)·G800(2025) 인도 → 3Q26 OPM 14.5%, 2027년 G280 → G300 교체기 인도 공백 예상 (컨콜 요약, Zacks)
