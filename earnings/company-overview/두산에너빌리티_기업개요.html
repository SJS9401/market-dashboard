### ② 산업 분류

- 산업: **발전설비 (원자력 주기기·가스/증기터빈·보일러·해상풍력) + 발전 EPC + 소형 건설기계(밥캣)**
- KRX/WICS 분류: 코스피 기계·장비 / WICS 기계
- 워치리스트 섹터: **T2 — 원전**, 서브섹터 **원전 기자재** (`earnings/watchlist.md` 38행)
- 국내 피어: 한전기술(원전 설계) · 현대건설(원전 시공) · 한전KPS(원전 정비) — 동일 섹터 기업개요 참조

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시
→ 2025 매출 비중: 두산밥캣 51.5% (8.79조) > 에너빌리티 46.2% (7.88조) > 퓨얼셀 2.7%
→ 밥캣(북미 소형 건설·농업 장비) = 금리·주택경기 연동 **사이클**

(2) **단, 영업이익·밸류에이션 기여 우선 sub-rule** 적용
→ 2025 영업이익: 밥캣 6,860억 vs 에너빌리티 3,024억 → 이익은 밥캣 우위
→ 그러나 시가총액(2026-11-03 33.4조) 대비 밥캣 지분가치(48.2%)는 일부에 불과 → 주가는 에너빌리티 부문(원전·GT 수주)이 결정
→ 에너빌리티 부문 자체도 **수주→매출 시차 2~4년의 수주 사이클** (2015~2016 수주 9조 → 2017~2018 5조 급감 → 2020 OPM -10.3% → 2025 수주 14.7조)
→ 두 사업부 모두 사이클 → **Primary 사이클 유지**

(3) **Boundary case 처리**: 사이클 + 꿈 섞임 → Primary + Secondary 표기
→ 수주잔고 내 성장사업(원자력·가스) 비중 75% (2025말) → 81% (2030P 회사 가이던스)
→ 2030 가이던스: 에너빌리티 매출 11.7조·OPM 9.9%·잔고 47.7조 (FY25 IR, 2026-02) — 실현 시 "고성장"으로 재분류 후보
→ 현재는 이익 실현 전(9M26 에너빌리티 OPM 4.6%) → Secondary "꿈" 단계

(4) **글로벌 피어 대비**
→ GE Vernova (GEV): 가스터빈 + 그리드 + 풍력, 순현금·OPM 두 자릿수 → 지속성장 진입
→ 두산에너빌리티: 동일 GT 사이클 수혜이나 이익률 한 자릿수·순차입 4.5조 → 아직 사이클 + 꿈
→ 일본 MHI·Siemens Energy와 함께 "대형 GT 3강 + 두산" 구도 (3Q26 IR: 미국 H급 18기 중 두산 7기 수주, McCoy 1Q26)

### ④ 적정 밸류에이션 방법

- **SOTP 우선** — 에너빌리티 부문 EV/EBITDA (또는 PER) + 두산밥캣·두산퓨얼셀 상장 지분가치(할인 적용) − 에너빌리티 순차입금
→ 이유: 연결 이익의 절반 이상이 상장 자회사(밥캣)에서 발생 → 연결 PER/PBR은 왜곡 (2025 연결 PER 420.9배, FnGuide)
→ 증권사 관행: 메리츠 = 에너빌리티 '27 EBITDA × 18.6배 + 자회사 지분가치 (2025-02-18) / 키움 = 부문별 SOTP
- **PBR 보조** (사이클 밴드) — 2026-11-02 PBR 4.36배 (BPS 12,767원, FnGuide TTM) vs 2024말 1.50배 / 2025말 6.20배 (키움 2Q26 Review)
→ 사이클 저점(2019~2020) PBR 0.4배 ↔ 2025~2026 꿈 단계 PBR 6~8배 밴드
- **수주잔고 커버리지 보조 지표** — 시가총액/수주잔고 (33.4조 / 26.6조 = 1.26배, 2026-11-03)
- 피어 차별화: GEV는 PER 단독 (순현금·지속이익), 두산에너빌리티는 SOTP + PBR 혼합 — 자회사 구조 + 이익 실현 전 단계 때문

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- 에너빌리티 부문 OPM **2개 분기 연속 8%+** 및 수주잔고 30조+ 도달 시 → Secondary "꿈" → "고성장" 격상 검토
- 에너빌리티 부문 영업이익이 **연간 기준 밥캣 영업이익 초과** 시 → 대표 사업부 변경 (사이클 원천 = 밥캣 → 원전·GT 수주 사이클로 재정의)
- 두산밥캣 지분 매각·분할 등으로 **연결 제외** 시 → 연결 시계열 재작성 + 분류 전면 재평가
- 대형원전 수주가 **2년 연속 계획 대비 50% 미만** (2026 9M: 0.4조 / 계획 4.9조) 시 → Secondary "꿈" 할인, 순수 사이클로 하향

## 2. 회사 개요

### ① 기본 사항

- **회사명**: 두산에너빌리티 주식회사 (Doosan Enerbility Co., Ltd.) — 2022-03 두산중공업에서 사명 변경
- **회사명 의미 / 비전**: Energy + Sustainability + Ability — "친환경 에너지 사업 중심으로 지구의 가치를 높이는 세계적인 기업" (2022 통합보고서 CEO 메시지)
- **사업 한 줄 정의**: 주단조 소재부터 원자로·증기발생기·가스/증기터빈·해상풍력 터빈을 직접 설계·제작하고 발전소 EPC까지 수행하는 한국 유일의 발전설비 종합 OEM (+ 북미 소형 건설장비 두산밥캣 보유)
- **설립**: 1962-09-20 (현대양행) → 1980 한국중공업 → 2001 민영화·두산 인수 (두산중공업)
- **본사**: 경상남도 창원시 성산구 두산볼보로 22 (창원 본사·공장)
- **발행주식**: 보통주 640,561,146주 (액면 5,000원, 자기주식 1,428,328주 — 1H26 검토보고서)

### ② 사업부별 개요 (매출 비중 큰 순서, 직관적 설명)

**두산밥캣 — 매출 비중 51.5% (2025)**

"미국에서 많이 쓰는 작은 굴삭기·로더·잔디깎이 같은 소형 장비를 만드는 자회사."

- **Compact Equipment**: 스키드 스티어 로더·컴팩트 트랙 로더 (북미 1위 브랜드 Bobcat), 미니 굴삭기, 텔레핸들러
- **Ground Maintenance / Portable Power**: 잔디깎이(제로턴 모어), 이동식 발전기·컴프레서
- **Material Handling**: 지게차 (舊 두산산업차량)
- 지분 48.23% (1H26) — 과반 미만이나 실질 지배력으로 연결

**에너빌리티 부문 — 매출 비중 46.2% (2025)**

"발전소의 심장(원자로·터빈·발전기)을 만들고, 발전소 자체를 지어주는 사업부."

- **원자력**: APR1400 원자로·증기발생기·원자로냉각재펌프 등 NSSS 주기기 + 터빈발전기(STG), 원전 시공, 가동원전 서비스, 사용후핵연료 Cask
    - 프로젝트: 신한울 3·4 (국내), 체코 두코바니 5·6 (2025 수주), UAE 바라카 (기수행), 미국 AP1000 주기기 (Vogtle 3·4·V.C. Summer 공급 실적)
    - **SMR**: NuScale (모듈 제작, 2026-10 1개 모듈 계약), X-energy (Xe-100, 16모듈 핵심소재 예약), TerraPower (Natrium 주기기 3종 GV·RSS·CBS 공급계약), 영국 GBE-N·체코 i-SMR
- **가스/수소**: 국산 대형 가스터빈 **DGT6-300H (S2)** + 증기터빈 + 장기서비스(LTSA)
    - 국내: 김포·하동·고양창릉·신일산 복합 / 해외: 북미 데이터센터向 GT 7기·ST 6기 (2026 누적)
    - 수소 전소·혼소 터빈 개발
- **복합 EPC**: 해외 가스복합 발전소 (사우디 PP12, 카타르 Peaking, 오만 Misfah·Duqm, 베트남 O Mon 3·4, 사우디 Jafurah)
- **신재생**: 국산 10MW 해상풍력 터빈 (금오도 160MW·굴업도 250MW 고정가격 낙찰), 수력
- **기타**: 주단조 소재 (창원), Water(담수)·석탄 EPC (Phase-out 중)

**두산퓨얼셀 — 매출 비중 2.7% (2025)**

"수소로 전기를 만드는 건물·발전용 연료전지(PAFC·SOFC)를 만드는 자회사."

- 발전용 PAFC (국내 CHPS 입찰 시장), SOFC 양산 준비, 수소 트럭·선박용 연료전지
- 지분 30.33% — 2025 영업적자 -1,057억 (키움), 3Q26 -170억
