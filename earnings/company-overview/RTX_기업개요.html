## ① 기업 분류

(1) Primary / Secondary 분류

**Primary: 지속성장 (방산 장기계약 + 민항 애프터마켓)**

→ 합병 후 FY20 → FY25 매출 $56.6B → $88.6B, CAGR **+9.4%** [계산]. FY20(코로나)·FY23(GTF 분말금속 충당 -$2.9B)의 두 번의 이익 저점은 업황 사이클이 아니라 외부 충격·기업 고유 품질 이벤트

→ 2026년 가이던스를 세 번 올렸다: 조정 매출 $92~93B(1월) → $97.0~97.5B(10월), 조정 EPS $6.60~6.80 → $7.65~7.75 (회사 보도자료)

**Secondary: 사이클 (민항 OE·애프터마켓 + 방산 예산)**

→ 매출의 49%가 민항(3Q26 고객유형 기준, 10-Q) — 항공 교통량·항공기 인도에 연동되는 사이클 업종 성격

→ 방산은 미국 국방예산(DoW)·동맹국 재무장에 연동. 3Q26 방산 수주 $59B로 수주 사이클이 상단 [판단]

**사업부 구조 (FY25, GAAP 사업부 영업이익, 10-K)**

→ (1) **Pratt & Whitney** — 매출 $32.9B (36%), 영업이익 $2.60B, OPM 7.9% — GTF·V2500 민항 엔진 + F135(F-35)·F119·F117 군용 엔진
→ (2) **Collins Aerospace** — 매출 $30.2B (33%), 영업이익 $4.92B, OPM 16.3% — 항공전자·기계·내장·동력 시스템, 방산 통신·센서
→ (3) **Raytheon** — 매출 $28.0B (31%), 영업이익 $3.23B, OPM 11.5% — **패트리어트·LTAMDS·NASAMS·SM-3/6·토마호크·AMRAAM·AIM-9X·SPY-6** (방산 100%)
→ 사업부 합계 $91.2B − 내부거래 $2.6B = 연결 $88.6B

(2) Summary Box (FY20~FY25 RTX 6년 + UTC 포함 12년)

**글로벌 방산 피어·한국 5사 대비 (FY25, 각사 주 지표, 참고)**

→ RTX 연결 OPM 10.5% (GAAP) — 방산 단독(Raytheon) 11.5%, 민항 Collins 16.3%가 끌어올림
→ 한국 방산 5사는 수출 마진으로 OPM 15~28%대(현대로템 방산 28%, 한화에어로 지상방산 20%대 — 각 사 3Q26 리뷰). **Raytheon의 방산 마진은 한국 수출형 대비 낮지만 미 정부 원가가산형 계약 비중이 커 변동성이 작다** [판단]

(3) 산업 분류
→ GICS Industrials / Aerospace & Defense, S&P 500
→ 워치리스트: 섹터 방산 / 서브섹터 방산 글로벌

(4) 분류 결정 논리
→ 매출 기준은 민항(51%) ≈ 방산(49%) 양분 → 이익 기준으로 보면 FY25 사업부 이익의 46%가 Collins, 30%가 Raytheon, 24%가 P&W [계산]
→ 두 축(민항 애프터마켓·방산 장기계약) 모두 구조적 성장 + 수주잔고 $340B(매출 3.5년치) → **Primary 지속성장**, 민항·예산 사이클은 Secondary
→ 섹터 비교 시에는 **Raytheon 부문만 떼어 방산 피어(LMT·NOC·GD·한국 5사)와 비교**하는 것이 원칙 [판단]

(5) 적정 밸류에이션 방법
→ **1차 Forward PER (조정 EPS)**: 2026 가이던스 중간값 $7.70 기준 **약 25.8배** [계산: $198.58 / $7.70]
→ **2차 SOTP**: Raytheon(방산 피어 멀티플) + Collins·P&W(민항 엔진·부품 피어 GE Aerospace·Safran 멀티플)
→ **3차 P/FCF**: 2026 FCF 가이던스 $9.0~9.2B → 시총 대비 약 29배 [계산]
→ PBR 미사용: 합병 영업권·무형자산이 자본의 대부분이라 의미 낮음

(6) 분류 재평가 트리거
→ ① GTF 관련 고객 보상·AOG가 다시 늘어 P&W 이익이 2개 분기 연속 역성장 → Secondary 사이클 격상
→ ② 방산 수주(B/B)가 4개 분기 연속 1.0 미만 + 방산 잔고 감소 전환 → 방산 수주 사이클 정점 통과 신호

→ **2012** Goodrich 인수 → UTC Aerospace Systems
→ **2015** Sikorsky를 Lockheed Martin에 $9.0B 매각
→ **2018-11** Rockwell Collins 인수(약 $30B) → **Collins Aerospace** 출범
→ **2020-04-03** UTC가 Otis·Carrier 분사 후 Raytheon Company와 합병 → **Raytheon Technologies** 출범 (4사업부: Collins·P&W·RIS·RMD)
→ **2023-07** RIS+RMD → **Raytheon** 통합 3사업부 재편, 사명 **RTX** / GTF 분말금속 이슈 공표, 3Q23 $2.9B 충당
→ **2023-10** $10B ASR 포함 $11B 자사주 매입 프로그램
→ **2024** 사이버보안 사업(CIS) 매각, 수출통제·FCPA 관련 법적 사안 합의 (DPA)
→ **2025** Collins 작동·비행제어(actuation) 사업 매각($1.2B 수취분, 10-Q), Simmonds Precision 매각
