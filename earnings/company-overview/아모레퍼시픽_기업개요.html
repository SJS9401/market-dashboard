## 1. 기업 분류

- **Primary 분류: 사이클 (구조적 다운사이클 → 턴어라운드 재진입)** — 2014\~2016 중국 관광객·면세 슈퍼사이클(OPM 15\~16%) → 2017 사드 이후 7년 다운사이클(2023 OPM 2.9%) → 2024\~2026 '글로벌 리밸런싱'(코스알엑스 인수·서구권 확대·중국 정리)으로 OPM 10%대 복귀 중
- **Secondary 노트: 지속성장 후보 (서구권 멀티브랜드)** — 서구권 매출이 2023 3,385억 → 2025 8,720억(2.6배)으로 커지며 '중국 단일 엔진'에서 '미주·EMEA·일본·국내 멀티 엔진'으로 구조가 바뀌는 중. 다만 12년 매출 CAGR이 +0.9%에 불과해 아직 지속성장으로 분류할 근거는 부족

### ② 산업 분류

- 산업: **화장품·생활용품 브랜드 제조/판매 (K-뷰티 대형 브랜드사)** — DART 업종코드 20423 (화장품 제조업)
- 사업부문 (DART 부문정보): 화장품 (2025 매출 89.2%, OP 3,208억) / Hair & Beauty (HB, 10.8%, OP 151억)
- IR 관리 부문: 국내 (럭셔리·프리미엄·데일리뷰티) / 해외 (미주·EMEA·중화권·기타아시아)
- 워치리스트: **소비재 > 뷰티 > 브랜드사 (핵심)**
- 동일 서브섹터 cross-ref: 에이피알(메디큐브·디바이스), 달바글로벌(달바), 브이티(리들샷) — 모두 서구권·일본 인디/온라인 성장주. 아모레퍼시픽은 그 중 유일한 '레거시 대형사 + M&A(코스알엑스)로 인디 성장축 편입' 구조
- 밸류체인 cross-ref: ODM 코스맥스·한국콜마·코스메카코리아 (인디 브랜드 공급 = 아모레 경쟁 강도의 선행지표), 유통 실리콘투 (K-뷰티 역직구 플랫폼)

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준**: 화장품 89% → 화장품 수요·채널 사이클 종속. 그러나 화장품 내부에서 이익 엔진이 '국내 면세·중국(2014\~2019)' → '서구권·국내 온라인/MBS(2024\~)'로 교체됨
(2) **사이클 사업부 영업이익 비중 우선 sub-rule**: 2025 해외 OP 2,099억(62%) > 국내 1,449억(43%) — 2018 이후 처음 해외가 이익 1위. 해외 OP 내부에서도 2023 중화권 적자 → 2025 흑자, 서구권 두 자릿수 OPM → 이익 원천이 중국 사이클에서 서구권 성장으로 이동
(3) **Boundary case 처리**: 한국 뷰티는 '관광객/중국 정책(사드·봉쇄·따이궁)'이라는 외생 사이클과 '브랜드 노후화→리브랜딩'이라는 내생 사이클이 겹친다. 2015→2023 하락은 대부분 중국(면세+현지) 손실로 설명되고, 국내 순수 채널(올리브영·온라인·다이소)에서는 인디 브랜드에 점유율을 내줌 → Primary 사이클 유지, 서구권 비중이 50%를 넘고 3년 이상 안정적으로 성장하면 지속성장 격상 검토
(4) **글로벌 피어 대비**: L'Oréal(OPM \~20%, 지속성장), Estée Lauder(2023\~25 중국·면세 리셋으로 아모레와 같은 사이클), Shiseido(중국·트래블리테일 리셋 진행). 아모레는 '중국 리셋을 먼저 끝내고 서구권 인디 M&A로 갈아탄 케이스'로 EL·시세이도보다 1\~2년 앞선 위치

### ④ 적정 밸류에이션 방법

- **PER (Forward 1\~2년) 우선** — 이익 정상화 국면이라 TTM보다 Forward 사용. TTM(4Q25\~3Q26) 영업이익 4,117억, 순이익 2,874억(3Q26 잠정 포함) → 보통주 시총 7.38조 기준 TTM PER 약 26배 (우선주 시총 제외, 지배순이익 미세조정 전)
- **PBR 보조** — 자본 5.63조(2Q26) 대비 PBR 약 1.3배 (보통주 시총 기준). 2016 정점기 약 7배(시총 25조 / 자본 3.4\~3.9조), 2022 저점기 약 1.1배
- **EV/EBITDA·SOTP 참고** — 코스알엑스(90.3% 보유, 별도 장부가 1.02조)를 별도 가치로 분리하는 SOTP가 셀사이드에서 사용됨. 순현금(현금성-차입금) 2,683억(2025말)이나 코스알엑스 잔여지분 매입의무 1,573억(기타지급채무) 반영 필요
- 회사 Value-up 목표 (2024.11 공시, 2025.11 이행평가): **매출 성장률 10% (2024\~27 평균) / OPM 12% (2027) / ROE 7\~8% (2024\~27 평균)**, 연결 순이익의 35% 수준 배당 → 목표 달성 시 2027 OP 약 6,000억+ 수준이 시장 밸류의 앵커

### ⑤ 분기 재평가 트리거

- **서구권(미주+EMEA) 매출이 해외의 50%+로 4개 분기 이상 유지** 시 → Secondary를 '지속성장'으로 격상 검토 (2025: 45.7%, 2Q26: 51.2%)
- **OPM 12% 2개 분기 연속** (Value-up 2027 목표 조기 달성) 시 → 정점 국면 진입 여부 점검 (2015 정점 16.2% 대비)
- **중화권 재적자 / 매출 연 -20% 재개** 시 → 리셋 미완료로 판단, 사이클 저점 재평가
- **코스알엑스 매출 역성장 지속** (2025 하반기 이익 감소 언급) → 영업권·브랜드 무형자산(연결 무형자산 1.71조, 대부분 코스알엑스 인수분) 손상 리스크, 인수 성과 재평가
- 국내 OP가 **4Q 일회성(인센티브)** 외 사유로 적자 전환 시 → 국내 '순수 채널' 경쟁력 훼손 여부 재점검

## 2. 회사 개요

### ① 기본 사항

- **회사명**: ㈜아모레퍼시픽 (AMOREPACIFIC CORPORATION)
- **설립**: 2006-06-01 ㈜태평양(현 ㈜아모레퍼시픽홀딩스)에서 인적분할 신설 / 2006-06-29 유가증권시장 재상장. 모태 = 1945-09-05 태평양화학공업사 (서성환 창업)
- **본사**: 서울 용산구 한강대로 100 (2017.11 준공 용산 신사옥, 자가. 일부 층을 삼일회계법인에 임대 — 2018.4\~2028.3, 10년 환산 2,096억)
- **대표이사**: 서경배 회장, 김승환 사장 (각자대표)
- **비전**: 'Create New Beauty' — 그룹 2035 목표 매출 15조원·해외 비중 70% (2025.9 창립 80주년 Investor Day)

- **판매 경로 비중 (2025)**: 순수 국내 44% · 면세 9% · 해외법인 및 수출 47%

**시가총액 데이터:** 2006-06 재상장 \~ 2026-11-13 (Yahoo Finance v8 월말 수정종가, 보통주만 — 우선주 시총 미포함)
- 현재: **126,200원 / 보통주 시총 7.38조원** (2026-11-13 종가). 52주 범위 94,000 \~ 169,000원
- **월말 종가 고점: 431,500원 (2016-05) → 보통주 시총 25.2조원** / 장중 고점 455,500원 (2015-06 월간 고가, 시총 환산 26.6조)
- 2020 이후 월말 저점: 92,700원 (2022-09) → 5.4조원 (중국 봉쇄·따이궁 축소)
- 고점 대비 현재 **-71%**

**주가 국면 narrative:**
1. **2006\~2013 박스권 (시총 3\~6조)** — 분할 상장 후 국내 방판·백화점 중심 안정 성장. 설화수 중국 진출(2011), 라네즈 아시아 확장
2. **2014\~2016 'K-뷰티·유커' 슈퍼사이클 (6조 → 25조)** — 중국 단체관광객 면세 소비 + 중국 현지 설화수·이니스프리 고성장. 2014 한 해 주가 +162%(연말 26.5만원, 분할 환산), 2015.4 액면분할 10:1. OPM 16%, PER 40배+ 프리미엄
3. **2016\~2020 장기 하락 (25조 → 8조)** — 2016.7 사드 배치 결정 → 2017.3 중국 단체관광 금지. 면세가 따이궁(보따리상) 의존으로 바뀌며 마진 희석, 중국 현지에서 로컬·글로벌 브랜드 경쟁 격화, 국내 로드숍(아리따움) 붕괴. 2020 코로나로 저점
4. **2021 리오프닝 기대 반등 → 2022 재하락** — 중국 봉쇄·리오프닝 지연, 2022.9 월말 92,700원 (5.4조)
5. **2023\~2026 '글로벌 리밸런싱' 재평가 (5\~10조)** — 2023.10 코스알엑스 콜옵션(7,551억) 결정, 2024 미주 라네즈·코스알엑스 고성장으로 서구권 비중 확대 → 2024.3\~4월 12만원 → 20.05만원(2024-04 고가) 급등. 이후 코스알엑스 성장 둔화 우려로 2024-11 9.95만원까지 반락. 2025\~2026은 중화권 흑자전환·OPM 10% 복귀에도 9.4만원(2026-05 저가)\~16.9만원(2026-01 고가) 박스. 현재 126,200원

### ③ 사업부별 디테일

**국내 (순수국내 + 면세 + 크로스보더)**
- 채널: 온라인(네이버·쿠팡·아모레몰)·MBS(올리브영·다이소)가 성장 채널, 면세는 국내 매출 대비 비중 18%(2Q26, 2021년 37% → 축소), 백화점·방판은 '정예화'. 국내 매출의 약 24%가 면세+크로스보더(2Q26)
- Top-seller: 설화수 윤조에센스·자음생크림, 헤라 블랙쿠션, 에스트라 아토베리어365 크림(올리브영 더마 1위 2년 연속), 일리윤 세라마이드 아토(올리브영 바디 1위), 라보에이치 두피강화 샴푸(샴푸 1위), 려 자양윤모
- Growth: 에스트라(3Q26 국내 +50%+), 일리윤(3Q26 +60%), 헤어(미쟝센·려·라보H)
- 이익 outlier: 4Q는 일회성 인센티브 충당금으로 국내 OP 급감 (4Q25 국내 -41억 적자)

**해외 — 서구권 (미주+EMEA)**
- 라네즈 립슬리핑마스크·립글로이밤 (미국 립 트리트먼트 1위), 코스알엑스 스네일 에센스·RX 펩타이드 라인(아마존·틱톡샵), 이니스프리 그린티·선케어, 에스트라(세포라 미국·멕시코, 2Q26 미주 +100%+), 일리윤(아마존 BPC 35위)
- 2Q26 미주 +56.5%, EMEA +63.3% — 아마존 프라임데이·세포라·Boots·Space NK·KICKS(북유럽)·Matas 등 리테일러 확장
- 서구권 OPM: 2025 신규 브랜드 마케팅 투자·코스알엑스 이익 감소·구딸 사업 종료 비용으로 둔화 → 2Q26 '고성장 브랜드 수익성 개선으로 영업이익 증가'

**해외 — 중화권 (중국 본토·홍콩·대만)**
- 2023 6,962억 → 2024 5,100억(-27%): 중국법인 이커머스 거래구조 변경(대리상 → 직접), 설화수 백화점 매장 효율화, 브랜드별 매장 수 최적화
- 2025 흑자전환, 매출 5,124억(+0.5%). 2026 들어 백화점 효율화로 다시 역성장(1Q26 -13.5%, 2Q26 -6.2%) — '매출보다 수익' 전략. 상해 공장 기초화장품 가동률 20.5% (2025)
- 성장 브랜드: 려(자양윤모 퍼퓸·탈모 에센스, 티몰 상위), 라네즈(로컬 MBS: Colorist·POYA·Cosmed)

**해외 — 기타아시아 (일본·APAC·인도)**
- 일본: Qoo10·라쿠텐·돈키호테·@cosme, 에스트라·코스알엑스·헤라 고성장 (3Q26 일본 코스알엑스 2,900개 매장 신규 입점)
- APAC: 쇼피·틱톡, 라네즈 네오쿠션·주스팝 틴트, 인도(3Q26 +60%, 마몽드 신규 진출)

**코스알엑스 (연결 자회사, 90.3%)** — 2024.5 연결. 아마존·틱톡 기반 더마/기능성 인디 브랜드(스네일 96 뮤신 에센스, 알파-알부틴, RX 펩타이드, PDRN). 2025 하반기 매출·이익 둔화 → 2026 RX 라인·선케어(독일 아마존 1위)·일본 오프라인 확대로 재성장. 지역 매출은 IR 권역에 분산 포함 (브랜드 단독 매출 IR 미공시 — **미확보**)

**HB (Hair & Beauty)** — 미쟝센(퍼펙트 세럼 미국 아마존 스타일링 세럼 1위), 려, 해피바스, 라보에이치, 메디안. 2024 적자(-22억) → 2025 OP 151억. 헤어케어를 '차세대 글로벌 성장축'으로 지정
