# 코스맥스 기업 개요 (v1.0 — 세계 1위 화장품 ODM, 지속성장 + K-뷰티 수출 고성장 국면)
> **Fact verify cutoff**: 2026-11-15. 재무는 **2026.09 분기보고서(3Q26, 2026-11-13 공시)까지 확정치**. 주가·시총은 2026-11-13 종가 279,000원(네이버) / 시총 3조 1,665억. 법인별 분기 매출은 DART 「주요 제품 현황」 누적 매출의 분기 차분(법인 별도·연결조정 전)이며 IR 지역 매출과 범위가 다르다(③-(1) 주석 참조)

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 지속성장 (글로벌 화장품 ODM 1위, 10년 매출 CAGR 16%)**

→ 연결 매출 2015 5,333억 → 2025 2조 3,988억 (10년 CAGR **+16.2%**). 매출 역성장 연도는 2022(+0.5%, 사실상 정체) 1회뿐
→ 반면 OPM은 3~8%대에서 **2~4년 주기로 출렁인다** — 2016 7.0% → 2017~2019 4%대(사드·미국 인수 비용) → 2021 7.7% → 2022 3.3%(중국 봉쇄) → 2024~2025 8%대
→ 3Q26 매출 8,758억(+49.5% YoY), 영업이익 833억(+94.9%), OPM 9.5% — **분기 사상 최대**. 3Q26 누적 OPM 8.9%로 연간 최고치 경신 페이스

**Secondary 노트: 고성장 국면 (K-뷰티 인디 브랜드 수출 사이클) + 레버리지 높은 재무구조**

→ 성장 엔진은 한국 별도 법인: 별도 매출 2022 8,540억 → 2025 1조 5,264억 → 3Q26 단일 분기 6,161억(+60.7%). 메디큐브(에이피알)·아누아·바이오던스·정샘물 등 K-뷰티 인디 브랜드의 해외 수출 물량 + 글로벌 MNC·유럽 인디 직수출
→ 해외 법인(중국·미국·동남아)은 매출 비중 약 30~35%(연결조정 전 기준)지만 이익 기여는 작다 — 미국 법인은 2Q26에 **창사 이래 첫 분기 영업흑자**(IR), 순이익은 여전히 적자
→ 부채비율 286%, 순차입금 1.12조(3Q26) — CapEx(평택·인니·태국 신공장, 3Q26 누적 2,600억)와 운전자본 확대를 차입으로 조달. 이익 성장 대비 FCF는 2024년 이후 마이너스

→ **(2) 중국** — 코스맥스이스트(주)(중국 중간지주, 2019 설립) 산하 COSMAX CHINA(상해), COSMAX GUANGZHOU(광저우), YATSEN Biotechnology(광저우, 완미일기 운영사 Yatsen과의 JV, 2024 1Q부터 연결) 등
→ **(3) 미국** — COSMAX WEST(중간지주) 산하 COSMAX USA(오하이오 공장, 2023.01 NU-WORLD(뉴저지) 흡수합병), Cosmax California(2024.08 편입)

(5) 분류 결정 논리

→ 매출은 11년간 한 번도 의미 있게 역성장하지 않았고 고객 수가 4,000여 개로 분산 → 단일 브랜드 흥행에 기대는 브랜드사보다 **지속성장**에 가깝다
→ 다만 이익은 (a) 중국 경기·규제, (b) 미국 법인 적자, (c) 국내 고객사 대손 등으로 크게 흔들려 왔다. 2023년 이후는 K-뷰티 수출이라는 산업 사이클에 올라탄 **고성장 국면** `[판단]`
→ 3Q26처럼 매출 +50%·OP +95%가 이어지면 분기 단위로는 '고성장'으로 재분류할 수 있으나, 과거 두 번의 마진 사이클을 고려해 Primary는 지속성장 유지 `[판단]`

|---|---|---|---|
| 1 | PER (최근 4분기) | 네이버 기준 **17.2배**(EPS 16,236원) / 자체 계산 시총 3.17조 ÷ 지배순이익 2,179억 = **14.5배** | 자체 계산은 4Q25 순이익 879억(영업외 이익 포함) 반영 — 일회성 성격 확인 필요 |
| 2 | PER (12M Fwd) | 네이버 추정 EPS 15,805원 → **17.7배** | 컨센서스 목표주가 평균 385,150원, 투자의견 4.00(매수) (2026-11-12) |
| 3 | EV/EBIT | (시총 3.17조 + 순차입금 1.12조 + 비지배지분 589억) ÷ 최근 4분기 OP 2,509억 ≈ **17.3배** | 차입 부담이 커서 EV 기준이 PER보다 보수적 |
