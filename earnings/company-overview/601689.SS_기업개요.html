# Tuopu 퉈푸그룹 (拓普集团, 601689) 기업 개요 (v1.0 — 로봇 부품 글로벌 피어 / Tier 0.5 자동차 모듈 공급사, 휴머노이드 액추에이터 소량 납품 단계)
> **Fact verify cutoff**: 2026-11-14 (A주 2026-11-13 종가 **50.28위안** [Yahoo Finance v8], 시가총액 ≈ **874억위안** [계산: 1,737.84백만주 × 50.28]. 장중 사상 최고 **86.88위안 (2025-09-18)** [Yahoo 일간] → 현재 -42.1% [계산]. 52주 최저 37.76위안)

> **로봇 매출 규모**: 로봇 액추에이터 매출은 2024년 1,343만위안 → 2025년 1,359만위안 → 1H26 1,404.8만위안(+83.4%). 전사 매출의 0.05~0.1%다. 이 문서의 손익·재무 숫자는 사실상 자동차 부품 회사의 숫자다 → 로봇 부품 섹터 합산 시 트래킹 처리 권고 (로봇 액추에이터 행은 별도 기록)

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 → 성장 둔화 전환 (12년 매출 CAGR 24.2%, 2021~2024 매출 +23~76%, 2025년 +11.2%·순이익 -7.4%)**

→ Tesla(회사 표기 "미국 혁신 차기업 A 고객")·Rivian·중국 신흥 EV(Seres·Xiaomi·Li Auto 등)의 성장에 올라타 매출이 2020년 65억 → 2025년 296억위안으로 4.5배가 됐다 [계산]

→ 2025년부터 "매출 성장 + 이익 정체" — 해외 신규 공장 램프업 감가상각, 원재료, 경쟁 심화 (회사 2025 경영실적 예고)

**Secondary 노트: 사이클(자동차) + 꿈(로봇 액추에이터)**

→ 상위 5개 고객 매출 65.8%(2025) — 최대 고객의 차량 판매 사이클에 이익이 묶인다. 로봇 액추에이터는 Tesla Optimus 공동 개발(회사 발언 보도)로 멀티플을 끌어왔다

(3) 정량적 분류 근거

→ 매출 YoY 12년 범위 -10.4%(2019) ~ +76.0%(2021). 조정 영업이익률 범위 9.8~16.9%(7.1%p)

→ 매출총이익률이 2016년 31.2% → 2025년 19.4%로 11.8%p 하락 — 고마진 NVH 감쇠 비중 축소, 저마진 대형 모듈(섀시·내장) 비중 확대 [판단]

(4) 산업 분류

→ 회사 분류: 자동차 부품(汽车零部件) 제조. 2026 반기 보고서부터 주영업을 "자동차 부품, 체화지능(具身智能) 부품, 액랭 제품"으로 서술

→ 워치리스트 섹터: 로봇 / 서브섹터: 로봇 부품 (글로벌 피어)

(5) 분류 결정 논리

→ 매출의 93%(1H26 주영업 기준)가 자동차 부품 [계산]. 로봇 액추에이터 0.1%는 분류를 바꾸지 않는다. 섹터 편입 근거는 회사의 로봇 액추에이터 사업부와 Tesla Optimus 공동 개발 발언(TrendForce 9/21 보도)

(6) 적정 밸류에이션 방법

→ 1차 — Forward PER: 2026E 35.2배 / 2027E 27.3배 (동오 순이익 24.85·31.99억위안 [보도 인용·계산]). 직전 4개 분기 순이익 24.76억위안 기준 35.3배 [계산]

→ 2차 — PBR 3.53배 [계산] (시총 874억 / 지배주주 자본 247.4억위안, 2026-09 말). ROE 2025 12.7% [계산, 평균 자본]

→ 이익이 2년 연속 감소하는데 PER 35배 — 로봇·액랭 옵션 가치가 상당 부분 남아 있다 [판단]

(7) 분기 재평가 트리거 (분류 변경 조건)

→ ① 로봇 액추에이터 반기 매출 1억위안 이상(전사 0.7%+) → 섹터 합산 핵심 편입 재검토

→ ② 분기 순이익 YoY 플러스 2개 분기 연속 + GPM 20% 회복 → "성장 재개"

→ ③ 매출 YoY 0% 미만 → 고성장 분류 철회, 사이클로 전환
