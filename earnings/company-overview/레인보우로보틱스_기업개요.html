# 레인보우로보틱스 기업 개요 (v1.0 — 휴머노이드 완성체, 꿈 단계 / 삼성전자 자회사)
> **Fact verify cutoff**: 2026-11-14 (주가·시가총액은 Yahoo Finance v8 2026-11-13 종가, 주주·품목 매출은 2026.06 반기보고서. **3Q26 분기보고서는 2026-11-14 현재 미공시**)

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 꿈 (Pre-profit 로봇 플랫폼, 매출 341억 vs 시가총액 7.05조)**

→ 2025 매출 341억, 영업손실 -25억. 상장(2021) 이후 연간 영업흑자는 2022년(+13억) 한 번뿐

→ 시가총액 7.05조(2026-11-13) = 2025 매출의 **약 207배(PSR)** — 주가는 현재 실적이 아니라 **삼성전자 휴머노이드·제조 자동화 전략의 실행 법인**이라는 옵션을 반영 `[판단]`

**Secondary 노트: 고성장 (매출 4년 CAGR +39.5%, 2026 상반기 +105%)**

→ 매출 2021 90억 → 2025 341억, 1H26 214억(+105% YoY) — 삼성전자 편입(2025.03) 이후 외형 성장 가속

→ 성장 동력은 삼성전자 향 공급(1H26 매출 56.8억, 전년 동기 19.2억 대비 +196%)과 모바일 휴머노이드(양팔로봇 RB-Y1) 매출 신설(1H26 86.5억)

**Entity 구조 (2026.06 반기 기준)**

→ **(1) 로봇부문 (1H26 매출 197.8억, 92.5%)** — ① 모바일 휴머노이드(이동형 양팔로봇 RB-Y1) 86.5억 (40.5%) ② 협동로봇(RB 시리즈, 가반하중 3~20kg) 45.0억 (21.1%) ③ 그 외(자율이동로봇 AMR, 사족보행, 이족보행 HUBO, 천문 마운트 등) 66.2억 (31.0%)

→ **(2) 기타 (1H26 16.0억, 7.5%)** — 용역(연구개발 용역 등). 2025년에는 기타 92.3억(27%, 대부분 용역 90.9억)으로 비중이 컸음

→ **(3) 연결종속회사 1개** — RAINBOW ROBOTICS USA (비상장, 미국 판매법인)

**품목 공시 변경 (시계열 연결 시 필수)**

→ 분기 영업이익은 전사 단일. 품목별 이익 미공시

(3) 정량적 분류 근거

→ **이익 미형성**: 2023 주식보상 일회성 제외해도 영업이익은 -54억 ~ +15억 범위. R&D(매출 대비 25~31%)와 인력 확충이 매출 성장을 상쇄

→ **삼성 의존 확대**: 삼성전자 연간 거래 약 104억(2025, 아주경제 2026-05-18 = 매출의 약 31%) → 1H26 삼성 매출 56.8억(26.6%) (DART 2026 반기 특수관계자 거래)

→ **재무 여력**: 2025말 현금+단기금융상품 691억, 부채비율 7.1% — 적자를 견딜 현금은 있으나 세종 신공장 투자(건설중인자산 270.8억 → 2026 대체)로 현금 감소 중

(4) 산업 분류

→ **한국표준산업분류** — 29280 산업용 로봇 제조업 (DART 기업개황)

→ **KRX** — 코스닥 기술특례 상장 (2021.02.03)

→ **워치리스트 섹터** — **로봇 / 휴머노이드 완성체** (현대차·Unitree·UBTech·Tesla와 같은 서브섹터)

→ 실질 분류: 매출 기준 협동로봇·AMR 제조 + 이동형 양팔(휴머노이드) 초기 상용화. 기술 기원은 KAIST 휴머노이드로봇연구센터(HUBO)

(5) 분류 결정 논리

(1) **이익 기준** — 연간 영업이익 대부분 적자 → 사이클·지속성장 판정 불가 → **꿈**

(2) **밸류 기준** — PSR 200배 이상, 시가총액 변동이 실적이 아닌 삼성 지분 이벤트(2023.01 증자, 2024.12 콜옵션)와 휴머노이드 테마에 연동 → 꿈 확정

(3) **Secondary 고성장** — 2025~1H26 매출 +76%·+105%로 외형은 고성장 구간. 단 절대 규모(분기 100억 안팎)가 작아 삼성 단일 발주에 따라 분기 변동 큼

(6) 적정 밸류에이션 방법

→ **1차 — 옵션 가치 (삼성 휴머노이드 로드맵 연동)**: 이익 기반 멀티플 적용 불가. 삼성전자 RX사업추진실(2026.07 신설, 미래로봇추진단+삼성리서치 로봇센터 통합) 로드맵, CES 2027 휴머노이드 공개 여부가 가치 결정 변수 (비즈니스워치 2026-11-09)

→ **2차 — PSR / 시가총액 대비 매출 성장**: 2026-11-13 시가총액 7.05조 ÷ 2025 매출 341억 = PSR 207배. 1H26 연율화 매출(428억) 기준 165배 `[추정]`

→ **3차 — 삼성 지배 프리미엄**: 삼성전자 35% 보유 최대주주 — 경영권 이전이 끝나 추가 지분 이벤트 기대는 소멸, 이제는 삼성 내 역할(제조 자동화 우선 → 상용화)이 핵심

→ DCF·PER 미사용 근거: 흑자 전환 시점·규모 추정 불가

(7) 분기 재평가 트리거 (**분류 변경 조건**)

→ ① **연간 영업흑자 + 매출 1,000억 돌파** → Primary 고성장으로 격상 (양팔로봇 양산·삼성 라인 대량 투입 확인)

→ ② **RB-Y2 2027 중반 안전인증·양산 일정 지연** 또는 **삼성 공급 2분기 연속 감소** → 꿈 프리미엄 축소

→ ③ **분기 매출 YoY 마이너스 전환** → 고성장 노트 삭제

(3) 사업부별 개요 (매출 비중 순)

→ **모바일 휴머노이드 (40.5%)** — 이동형 양팔로봇 RB-Y1: 한 팔당 7자유도 양팔 + 6자유도 외다리 + 바퀴형 고속 모바일 베이스. 연구기관·대학 타깃으로 진입 후 산업용 파생 모델 개발(DART 2025 사업보고서). 국내 공급은 에이딘로보틱스가 담당(유니콘팩토리 2026-04-21). 아주경제는 "아직 R&D 플랫폼 단계"로 평가(2026-05-18). 후속 RB-Y2 2027 양산 목표

→ **협동로봇 (21.1%)** — RB 시리즈(RB5-850 기준모델, 가반하중 3~20kg). SI 파트너사 41곳 경유 판매. RB5 연 2,500대 생산능력. F&B 로봇 시스템 MIXX(커피·음료 제조) 직접 영업

→ **로봇(그 외) (31.0%)** — 자율이동로봇(AMR, RBM 시리즈: 풀필먼트·팔레타이징), 사족보행(경비·소방), 이족보행 HUBO(연구용 프로젝트 판매), 초정밀 천문 마운트(16개국 40개 대리점, RST-135 연 600대)

(4) 삼성전자 편입 이후 관점

→ 삼성 공급처: 평택캠퍼스 등 삼성 생산 현장, 현재는 패키징·용접 등 특정 솔루션 공정에 한정 (아주경제 2026-05-18)
→ 삼성 전략: "제조 자동화 먼저, 상용화는 그 다음"(노태문 DX부문장, CES 2026). 2026.07 RX사업추진실 신설, 이재용 회장 2026-10-27 방문 — CES 2027 휴머노이드 공개 준비(비즈니스워치 2026-11-09)
