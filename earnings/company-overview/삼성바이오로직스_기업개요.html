# 삼성바이오로직스 기업 개요 (v1.1 — 순수 CDMO 전환 원년, CAPA 계단식 고성장 + 펩타이드 M&A 확장기)
> **Fact verify cutoff**: 2026-11-28 (재무는 2026.09 분기보고서까지 확정치. **2025 연간·2026 분기 연결은 삼성바이오에피스 인적분할(2025.11) 이후 계속영업 기준으로 재작성된 수치** — 2022\~3Q25 연결 원공시치와 직접 비교 불가, 비교가능 축은 별도(CDMO) 시계열로 별도 제시. v1.1에서 최대주주·임원·직원·생산능력·매출처·연구개발비·수주·신용등급·회사채는 DART 공시원문/OpenDART 원문으로 교체. 시가총액·주가는 2026-11-24 종가(알파스퀘어)·2026-11-25 장중(Yahoo), 월별 고저는 DART 정기보고서 '주가 및 주식거래실적' 기준)

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (CAPA 계단식 증설형 바이오의약품 CDMO)**

→ 별도(CDMO) 매출 2015 913억 → 2025 **4조 5,570억** — 10년 CAGR **+47.9%**, 2017\~2025 8년 CAGR **+33.0%**, 2020\~2025 5년 CAGR +31.4%. 2016년 이후 매출 역성장 연도 없음 (최저 성장 2018년 +15.3%)
→ OPM은 가동 초기 적자(2015 −223%, 2016 −10%) → 2017\~2019 10\~14% → 2020 25% → 2021\~2024 34\~41% → **2025 45.4%(사상 최고)**. 고정비 비중이 큰 장치산업이라 **공장 가동률 = 이익률** 구조
→ 성장 엔진은 "공장 1개 = 매출 1단계 레벨업": 1공장 3만L(2013) → 2공장 15.4만L → 3공장 18만L(2018) → 4공장 24만L(2023 완전가동) → 5공장 18만L(2025.04) → 美 록빌 6만L(2026.03 인수) = **총 84.5만L (세계 최대 단일 CDMO 생산능력 — 회사 주장)**

**Secondary 노트: CAPA 램프업 사이클 (신규 공장 가동 직후 OPM 일시 하락형)**

→ 이익 변동은 경기가 아니라 **신규 공장 가동 타이밍**이 만든다: ① 2018\~2019 3공장 가동 → OPM 14% → 10%, 2019 1H 분기 적자, ② 2022.10 4공장 부분가동 → 2024 OPM 37.8%(전년 41.0%), ③ **2026 5공장 램프업 + 록빌 편입 + 파업 → 3Q26 OPM 42.9%(연결)·2분기 연속 하락**
→ 장기 계약(CMO 다년 계약·물량 보장) 기반 반복매출이라 수요 측 변동성은 낮다 — 사이클은 공급(증설) 측 현상 `[판단]`

**Entity 구조 (2026.09 — 인적분할 후)**

→ **(1) 삼성바이오로직스(주)** — 인천 송도 제1·2바이오캠퍼스(1\~5공장, 78.5만L). 항체의약품 CMO·CDO, ADC·mRNA 등 신규 모달리티. 2026 3Q 누적 연결 매출의 대부분 (별도 매출 = 연결 매출 40,684억으로 동일)
→ **(2) 美 록빌 생산법인** — GSK의 Human Genome Sciences 메릴랜드주 록빌 시설(2개 cGMP 공장, 원료의약품 6만L, 인력 500명+) 인수 완료 2026.03.31, 3Q26부터 매출 인식 본격화 (인수가 약 2.8억 달러 ≈ 4,000\~4,100억원, 언론)
→ **(3) Samsung Biologics America** 등 해외 영업 법인 / 2026.08 네덜란드 유럽 세일즈 오피스 개소
→ **(4) 삼성펩타이드(SPC, 신설)** — 스위스 펩타이드 CDMO **PolyPeptide Group** 공개매수 비히클. 응모 97.98% 확보, 스퀴즈아웃으로 100% 목표, **종결 2026말\~2027 1Q 예정** → 연결 편입 시 Entity 구조 재작성 필요
→ **분할 전(2022.04\~2025.10)**: 삼성바이오에피스(바이오시밀러) 100% 종속회사 → **2025.11 인적분할로 신설 지주 삼성에피스홀딩스로 이관** (2025 연결에서 중단영업 처리)

(5) 분류 결정 논리 (4단계)

→ **(1) 매출 큰 사업부 기준**: 분할 후 매출 100%가 CDMO(항체 CMO 중심 + CDO). 매출은 '공장 CAPA × 가동률 × 배치 단가'의 함수이고, 공장이 늘 때마다 매출이 계단식으로 커짐 → 고성장
→ **(2) Secular 변수 sub-rule**: 바이오의약품 위탁생산 수요는 ① 블록버스터 항체 특허만료·바이오시밀러 확대, ② 빅파마의 자체 설비 대신 외주(asset-light) 전략, ③ ADC·이중항체·펩타이드(GLP-1 비만 치료제) 신규 모달리티 확산이 견인. 회사 누적 수주 **220억 달러+**(CMO 117건·CDO 184건, 2026.10) `[회사 발표]`
→ **(3) Boundary case 처리**: ① 2022\~2025.10 연결은 '고성장 CDMO + 지속성장 바이오시밀러(에피스)' 혼합이었으나 분할로 **순수 CDMO = 고성장 단일 분류**로 정리. ② 2026말\~2027 PolyPeptide 편입 후에는 '펩타이드 CDMO(저마진·턴어라운드형) 혼합' — Primary 고성장 유지, Secondary에 'M&A 통합·마진 희석' 추가 예정 `[판단]`. ③ 증설 주기마다 OPM이 꺾이는 구간이 반복되지만 매출은 역성장하지 않으므로 '사이클' Primary가 아님
→ **(4) 글로벌 피어 cross-reference**: Lonza는 바이오로직스+저분자+세포·유전자 복합형으로 성장률이 한 자릿수\~10%대·미국 Vacaville(Genentech 공장) 인수로 거점 확대 — 삼성바이오는 단일 모달리티(항체) 대형 CAPA 집중으로 성장률·OPM 모두 Lonza를 상회하는 '규모의 경제형'. WuXi Biologics는 美 Biosecure Act(중국 바이오 기업 견제) 리스크로 수주 일부가 비중국 CDMO로 이동하는 수혜 구도 — 삼성바이오의 美 록빌 인수·유럽 오피스는 이 수요를 겨냥. Fujifilm Diosynth는 덴마크·美 Holly Springs 대형 증설로 'CAPA 경쟁' 상대 `[판단 — 피어 수치는 본 리포트에서 미검증, 정성 비교]`

(6) 적정 밸류에이션 방법 (밸류에이션 다이얼)

| 우선순위 | 방법 | 현재 값 (2026-11-24 종가 기준) | 비고 |
|---|---|---|---|
| 1 | EV/EBITDA (TTM) | (시총 59.62조 − 순현금 약 1.52조) / EBITDA 약 2.75조 = **약 21배** | TTM OP 23,356억(4Q25 5,283 + 3Q26 누적 18,073) + 감가상각 약 4,200억(3Q26 EBITDA 7,515 − OP 6,401 = 1,114억/분기 기준 추정). 순현금 = 현금 6,860 + 단기금융상품 16,358 − 사채 7,993 (리스 제외) |
| 2 | PER (TTM 계속영업 순이익) | 59.62조 / 17,440억 = **약 34배** | TTM = 4Q25 계속영업 4,530 + 3Q26 누적 12,910 (억원) |

→ 사업 mix(설비 집약형 CDMO, 감가상각 부담이 크고 증설기마다 순이익이 왜곡) → **EV/EBITDA 1순위**. 글로벌 CDMO(Lonza 등)도 EV/EBITDA로 비교되는 관행. PER은 증설 사이클 왜곡(감가상각·금융비용)을 감안해 보조
→ PBR은 증설로 자본·자산이 계속 커지는 구조라 하방 지지 지표로만 의미. 무배당이라 배당수익률 프레임 해당 없음
→ 삼성전자(사이클 → PBR 1순위), 휴젤(지속성장·순현금 → PER 1순위)과 달리 삼성바이오(고성장·설비집약) → EV/EBITDA 1순위 — 분류 차이가 방법 차이를 만든다
→ PolyPeptide 인수 대금(약 CHF 14.6억 ≈ 2.7조) 지급 후 순현금 → 순차입 전환 가능성 — 종결 후 EV 재계산 필요
