## 1. 기업 분류

- **Primary 분류: 사이클 — 정유 마진(정제마진·유가·래깅효과) 사이클 대형주** — 연결 영업이익의 대부분이 석유 부문(정유)과 그 파생(화학·윤활유)에서 나오고, 2014\~2025 OPM이 -7.5% \~ +8.2%로 15.7%p를 오간다. 2026년(9M OPM 11.4%)은 중동 전쟁·호르무즈 봉쇄가 만든 3번째 정점 구간
- **Secondary 노트: "지주형 혼합 포트폴리오" — ① 배터리(SK온) 9년 연속 적자(성장 투자형), ② 2024-11 SK E&S 합병으로 LNG·전력 안정 이익(유틸리티형) 편입, ③ 윤활유(SK엔무브)·E&P는 고마진 현금창출원** — 석유 사이클의 이익을 배터리 적자가 상쇄하는 구조라 연결 이익률이 정유 단독사(S-Oil)보다 낮고 변동 방향도 섞인다

### ② 산업 분류

- 산업: **석유정제(정유) + 석유화학(방향족·올레핀) + 윤활기유 + 원유개발(E&P) + 이차전지(SK온) + 분리막(SKIET) + LNG·도시가스·발전(E&S)** — 국내 정유 4사(SK에너지·GS칼텍스·S-Oil·HD현대오일뱅크) 중 정제능력 1위
- DART 업종: 192 (코크스, 연탄 및 석유정제품 제조업) / KRX 화학 업종 / 사업지주회사 (SK㈜ 자회사)
- 워치리스트 대분류 **소재** / 섹터 **정유·화학** / 서브섹터 **정유·화학** (label = 석유 부문) — 같은 섹터 동시 작성 5종목: S-Oil·롯데케미칼·금호석유화학·LG화학·한화솔루션
- 정제능력: **SK에너지 울산CLX 840천 배럴/일 + SK인천석유화학 375천 배럴/일 = 1,215천 배럴/일** (상압증류 기준) [DART 분기보고서(2026.09) II-3 생산설비]. 울산CLX 9M26 가동률 93.0% (누적 처리량 185,093천 배럴)

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: 석유 부문 = 사내거래 제외 매출의 **59%** (2025, 47.19조 / 80.30조), 화학 12%, E&S 15%, 배터리 9%, 윤활유 5% [IR 4Q25 사업별 실적, 계산]. 석유 부문 매출은 '유가 × 판매량'이고 이익은 '정제마진 ± 재고평가(래깅)'로 결정 → 2014\~2025 석유 OPM -9.8% (2020) \~ +6.4% (2022) → **사이클**
(2) **이익 비중 sub-rule**: 석유 부문 OP가 연결 OP의 33\~87% (2015\~2025, 2014·2024는 연결 OP가 작아 비율 왜곡) — 석유·화학·윤활유 3개 부문 합산은 12년 중 10년 연결 OP의 100% 초과(배터리 적자 보전). 연결 이익의 변곡점(2014·2016·2020·2022·2024·2026)이 모두 석유 부문 변곡점과 일치 → **사이클 유지**
(3) **Boundary case 처리 — "석유 사이클 + 배터리 적자 + E&S 안정 이익" 혼합 구조**:
→ **배터리(SK온)**: 2017\~2025 누적 영업손실 약 -5.68조, 2023 매출 정점 12.90조(연결 매출의 16.7%)에도 연간 흑자 0회 [SK온_기업개요 1장과 동일 수치]. 연결 이익을 구조적으로 깎는 '적자 성장' 자회사 → Primary를 바꾸지는 않지만 **연결 OPM 평균을 정유 단독사 대비 낮추는 상수 항목**
→ **E&S (2024-11 합병)**: 2025 부문 OP 6,811억 = 연결 OP 4,487억의 152% — 2025년만 보면 E&S가 없었으면 연결 영업적자. 다만 2026 9M 연결 OP 9.35조 중 E&S는 1.16조 (12%) 수준으로, 정유 정점기에는 비중이 작아짐 [IR, 계산] → **완충재(Secondary)이지 Primary 변경 사유 아님**
→ 결론: Primary 사이클 유지, Secondary에 '지주형 혼합(배터리 적자 + E&S 안정)' 명시. 연결 OPM의 진폭은 정유 단독사보다 작고(배터리 적자가 정점을 깎고, E&S가 저점을 받침) 방향은 같다
(4) **국내·글로벌 피어 cross-ref** (같은 섹터 동시 작성 — 각 문서와 교차 확인 필요):
→ **S-Oil** (`S-Oil_기업개요.md`): 정유·석화·윤활 단일 법인 + 사우디 아람코 최대주주 구조 — '순수 정유 사이클'의 기준점. SK이노는 같은 석유 사이클에 배터리·E&S가 붙은 구조라, 정점 OPM은 S-Oil보다 낮고 주가는 SK온 가치·지배구조 이벤트에 추가로 흔들림
→ **GS칼텍스·HD현대오일뱅크** (비상장): 국내 정유 4사 비교 대상. 2Q26 HD현대오일뱅크 영업이익 1.82조, S-Oil 9,650억 vs SK에너지 6,512억 [뉴시스 2026-08-03] — 2Q26 SK에너지는 재고·래깅 효과가 상대적으로 작았던 것으로 보임 (분기별 순위는 래깅 구조 차이로 바뀜)
→ **LG화학** (`LG화학_기업개요.md`): '본업(화학) + 상장 배터리 자회사(LG에너지솔루션)' 지주형 구조가 가장 유사. 차이는 ① LGES는 상장사라 시장가로 SOTP가 가능하지만 SK온은 비상장(PRS 공정가치만 공시), ② LGES는 흑자 전환, SK온은 적자 지속 → SK이노가 지주 할인을 더 크게 받는 구조
→ **롯데케미칼·금호석유화학·한화솔루션**: 석유화학(올레핀·합성고무·태양광) 중심 — SK이노의 화학 부문(SK지오센트릭, 방향족·PX 비중 큼)과 스프레드 지표가 다름(납사 크래커 vs 방향족). 한화솔루션은 '화학 + 신재생(태양광)' 혼합 구조로 SK이노의 '정유 + 배터리' 혼합과 같은 Boundary 성격
→ **글로벌**: Reliance Industries(인도, 정유+석화+통신·리테일 지주형), Valero·Marathon Petroleum(미국 순수 정유, 정제마진 직결) — 이번 버전에서는 피어 수치 미검증 (다음 버전 보강)

### ④ 적정 밸류에이션 방법

**밸류에이션 다이얼 (사업부 mix → 지표 선택):**

| mix 요소 (2025 매출 비중 / 9M26 OP 기여) | 성격 | 적합 지표 | 이유 |
|---|---|---|---|
| 석유 (59% / 9M26 SK에너지 3.14조) | 사이클·장치산업 | **PBR + 정상 EBITDA 배수** | 이익이 마진·유가에 따라 적자↔최대를 오가 PER 무의미. 자산(정제설비) 대비 가치가 사이클 바닥을 지지 |
| 화학·윤활유 (17% / 9M26 2.23조) | 스프레드 사이클 (윤활유는 고마진) | EV/EBITDA | 윤활기유는 그룹III 고급유 중심 — 부문 OPM 2025 15.8% → 3Q26 SK엔무브 46.1%, 12년 중 적자 0회 |
| 배터리 SK온 (9% / 9M26 0.04조) | 적자 성장, 비상장 | **SOTP (PRS 공정가치·증자가)** | 이익 멀티플 불가. SK온 지분가치는 [`SK온_기업개요.md`](SK온_기업개요.md) 6장 — PRS 기초자산 주당 28,591원(2026-06말) 기준 약 20.2조 (추정) |
| E&S (15% / 9M26 1.16조) | 유틸리티형 (LNG·발전·도시가스) | EV/EBITDA (안정) | SMP·LNG 도입가 변수, 사이클 진폭 작음 |

→ **1순위: PBR (사이클 위치 판단) + SOTP (지주 할인 판단)**, 2순위: EV/EBITDA, PER은 정점·저점에서 왜곡되어 참고만
→ **현재 (2026-11-24)**: 보통주 시총 15.57조 / 3Q26 지배기업 소유주지분 25.52조 = **PBR 0.61배** [계산]. 12년 연말 PBR 범위 0.50배 (2014) \~ 1.21배 (2021) — 현재는 2014(사이클 저점) 이후 최저권
→ **EV/EBITDA**: (시총 15.57조 + 순차입금 19.6조 [IR 3Q26] + 비지배지분 11.31조 [DART 3Q26]) / LTM EBITDA 12.77조 (IR 4Q25 1.12 + 1Q26 2.94 + 2Q26 4.25 + 3Q26 4.46조) = **약 3.6배** [계산] — 정점 이익 기준이라 낮게 보이는 '사이클 정점의 저배수' 구간
→ **PER**: LTM 지배순이익 1.53조 (4Q25 -2.24조 + 9M26 3.77조 [DART, 계산]) 기준 약 **10.2배** / 9M26 연환산(5.02조) 기준 3.1배 — 4Q25 SK온 손상(약 4.2조)이 LTM에 남아 있어 두 숫자의 괴리가 큼
→ **SOTP 관점의 지주 할인**: SK온 지분가치만 약 20조(추정, PRS 공정가치 기준) > 현재 SK이노 시총 15.57조 → 시장은 SK온 가치를 크게 할인하거나 SK이노가 PRS로 투자자 손실을 보전하는 의무(파생상품부채 1H26 1.62조)를 차감해 보고 있다 [SK온_기업개요 6장]
→ **피어 차별화**: S-Oil은 순수 정유라 PBR·배당수익률 프레임, LG화학은 상장 자회사 시장가 SOTP. SK이노는 비상장 SK온 때문에 SOTP 불확실성이 가장 크고, 2023 이후 3차례 증자·합병으로 주식수가 92.5백만 → 169.1백만주(+83%)로 늘어 주당가치 희석이 누적됨

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **석유 부문 OPM이 4개 분기 연속 2% 미만** + 싱가포르 복합 정제마진 장기평균 하회 시 → 현재 '정점3' 판단 철회, 사이클 하강 국면으로 갱신 (2026-11 알파디스틸 인용 복합마진 주간 $32.9(10/30 주) — 회사 IR 수치 아님)
- **SK온 연간 영업흑자 (AMPC 포함) 2개 연도 연속** 또는 SK온 IPO로 시장가 형성 시 → Secondary를 '적자 자회사'에서 '배터리 성장 옵션'으로 상향, 밸류에이션 1순위를 SOTP로 전환
- **E&S 부문 OP가 연결 OP의 50% 이상을 2개 연도 연속** 차지 시 → Primary에 '유틸리티 혼합' 병기 (2025년 1회 발생, 2026 9M은 12%)
- **SKIET 흡수합병(2026-08 결정) 이후 주주환원 정책(연말\~연초 발표 예정)** 에서 배당·자사주 소각 규모가 명시되면 → 배당수익률 지표를 밸류 프레임에 추가 [머니투데이 2026-09-14]
- **추가 증자·합병으로 주식수 10% 이상 증가** 시 → PBR 비교 시계열 단절 표기, 주당 지표 재산정

→ 2026-02-28 미·이스라엘-이란 전쟁 개시, 이란의 호르무즈 해협 사실상 봉쇄 (평시 일 120척 → 7척 통항), Brent 3월 한때 $119 [알자지라 2026-03-30]

### ③ 사업부별 디테일

(1) 석유 — "정제마진 × 처리량 ± 래깅효과"
→ **정제능력 1,215천 b/d** (울산 CDU 5기 840 + 인천 375천 b/d), 고도화설비 울산 HOU 45·No.1 RFCC 68·No.2 RFCC 94.5천 b/d, 탈황 VRDS 2기·RHDS 2기 [DART 분기보고서(2026.09) II-3]
→ 울산CLX 9M26 가동률 **93.0%** (가동가능 237일, 처리 185,093천 배럴) [DART 분기보고서(2026.09)]
→ **제품 mix (SK에너지 9M26 매출 41.33조)**: 경유 36.4% · 휘발유 19.0% · 등유 0.7% · B-C 1.0% · 납사 등 기타 42.2% [DART 분기보고서(2026.09) II-2]
→ **판매단가 (원/배럴)**: 경유 131,730 (2025) → **199,094 (9M26, +51%)**, 휘발유 121,231 → 159,610 (+32%) — "국제 원유가가 전년 대비 상승하여 석유제품 판매 복합단가 상승" [DART 분기보고서(2026.09)]
→ **래깅효과·재고평가**: 원유 도입(중동산, 운송 약 1개월) 후 제품 판매까지 시차가 있어 유가 상승기에는 재고 이익, 급락기에는 재고 손실이 영업이익에 반영 — 1Q26 SK에너지 OP 1.28조의 상당 부분이 "중동발 유가 상승에 따른 일회성 재고 관련 이익" [IR 1Q26 Look-back]. 반대 사례: 4Q14(석유 OP -5,930억)·4Q18(-5,578억)·1Q20(-16,359억)·4Q22(-6,623억)는 모두 분기 중 유가 급락 분기
→ **정제마진**: 회사 IR은 2026 자료에서 마진 수치를 공시하지 않음 — 언론 기준 호르무즈 봉쇄 우려 시 아시아 정제마진 배럴당 약 $30 [뉴시스 2026-08-03], 10/30 주 복합 정제마진 $32.9 (장기평균 크게 상회) [알파디스틸 2026-11-06]. 사우디 아람코 아시아향 OSP는 8월 -$1.5, 11월 -$5.0 (원가 하락 요인) [뉴스토마토 2026-07-30, 알파디스틸]
→ 정부 유류세·가격상한 관련 기회손실 보상(업계 주장 누적 약 4.7조, 정부 검토 중)이 3Q\~4Q26 반영 여부 변수 [뉴시스 2026-08-03] — 3Q26 IR에는 반영 언급 없음

(2) 화학 — 방향족(PX) 비중이 큰 화학
→ SK지오센트릭: 울산 NCC·방향족·폴리머, 해외 Arkema 기능성 폴리올레핀(2020 인수)·Dow EAA/PVDC(2017 인수)·SABIC 넥슬렌 JV(2015) [DART 사업보고서(2025.12) 종속회사 연혁]
→ SK인천석유화학: PX 공정 4,020톤/일 [DART 분기보고서(2026.09)] — 2026 IR에서 석유+화학 혼재 회사로 표시(9M26 OP 1.74조)
→ 화학 부문 OPM: 2016 16.0% · 2017 14.7% (정점) → 2023 4.8% → 2025 -3.0% (중국 증설발 공급과잉) [계산]. 2025 일부 사업 중단·매각 결정(중단영업) [IR 4Q25 각주], 울산 석유화학 구조조정(설비 이전·폐쇄 포함) 1Q26 계획 발표 예정이었음 [디지털데일리 2026-01-28]
→ 3Q26 SK지오센트릭 Look-back (원문): "역내 PX 설비 정기보수에 따른 공급 우려와 Gasoline 강세에 따른 Aromatic 유분의 blending용 전환으로 수급이 Tight해지며, PX·BZ 스프레드 확대 및 이익 개선" [IR 3Q26]
