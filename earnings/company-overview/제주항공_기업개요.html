## 1. 기업 분류

- **Primary 분류: 사이클 — 이벤트 쇼크형 고정비·고레버리지 사이클** (수요는 해외여행 구조 성장, 이익은 유가·환율·공급경쟁·외부 쇼크(불매·팬데믹·사고)에 따라 흑자 OPM 8\~10% ↔ 적자 사이를 왕복)
- **Secondary 노트: 국내 LCC 구조재편(통합 진에어 2027-03 출범)에 따른 과점화 옵션 + B737-8 기단현대화 원가 개선** — 단, 2024-12-29 무안 사고 이후 안전·신뢰 리스크와 자본 취약성(2025말 부채비율 754%)이 상시 할인 요인

### ② 산업 분류

- 산업: **항공운송 — 단거리 국제선 중심 저비용항공사(LCC)**. 국내 LCC 1위 (2026 9M 국제선 탑승객 649만 명 — 국적 LCC 국제선 탑승객 2,832만 명의 22.9% [DART, 계산])
- DART 업종: 511 항공 여객 운송업 [OpenDART company.json] / KRX 운수창고업
- 워치리스트 섹터: **운송** / 서브섹터: **항공** (대한항공·제주항공)
- 시장 지위 (Airportal, 제주항공 진입 노선 기준 [DART 분기보고서(2026.09) II-7]): 국내선 탑승객 M/S **16.6%** (9M26; 2025 14.7%, 2024 15.4%) / 국제선 **8.5%** (9M26; 2025 8.2%, 2024 9.6%) — 대한항공 19.8%, 아시아나 11.8%, 기타 LCC 28.5%, 외항사 31.5% (9M26 국제선)
- 국제선 탑승객 M/S 장기 추이: 4.8% (2015) → 5.7% (2016) → 7.6% (2017) → 8.5% (2018) → 9.3% (2019) [IR 4Q19] → 9.6% (2024) → 8.2% (2025) → 8.5% (9M26) [DART]

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: 항공운송사업 = 9M26 순매출 14,270억, 연결의 **96.7%** [DART 분기보고서(2026.09) II-1]. 그 안에서 국제선 여객이 생산실적 금액의 83.5% (9M26 11,911억 / 14,270억 [DART, 계산]) → 단거리 국제선(일본·동남아·중국) 레저 수요 = 경기·환율·유가·외부 쇼크 민감 → **사이클**
(2) **영업이익 sub-rule**: 비용의 대부분이 고정비 성격(사용권자산 상각·정비·인건비·공항비) + 달러 연동(연료·리스) → 탑승률·운임 몇 %p 변화가 OPM을 ±10%p 흔든다 (분기 OPM: 1Q24 14.2% → 4Q24 -8.9% → 3Q25 -14.2% → 1Q26 13.4% → 2Q26 -9.7% → 3Q26 11.2% [DART]). 성수기(1Q·3Q) 흑자 / 비수기(2Q·4Q) 적자 계절성도 뚜렷 → Primary 사이클 유지
(3) **Boundary case 처리**:
→ **LCC 구조조정·통합 LCC 출범**: 진에어가 에어부산·에어서울을 흡수해 **2027-03-17 통합 LCC로 출범 예정** — 기단·매출 기준 국내 최대 LCC가 됨 [MTN 2026-11-10]. 제주항공은 "LCC 1위" 지위를 잃게 되는 반면, 국내 LCC 수가 줄어 공급 경쟁이 완화될 수 있음 → 과점화 옵션(Secondary)으로만 반영, 분류 변경 사유는 아님
→ **기타 사업(지상조업 JAS·IT·호텔)**: 9M26 순매출 487억(3.3%). 호텔(홀리데이 인 익스프레스 서울홍대)은 2026-08-20 ㈜애경타운에 영업양도, IT 자회사 에이케이아이에스 지분 100%는 2026-06-10 에이케이홀딩스에 처분 [DART] → 항공 단일 사업화
→ **화물**: 화물수입 9M26 102억(항공운송 매출의 0.7%) — 화물기(B737-800BCF) 사업은 2025 화물 생산실적 18억으로 사실상 축소 [DART] → 분류 영향 없음
→ 결론: **Primary 사이클(이벤트 쇼크형) + Secondary(구조재편 과점화·기단현대화)**
(4) **글로벌 피어 대비**:
→ **Ryanair·Southwest·AirAsia·Peach** (단일기종·단거리·고가동 LCC 모델의 원형): 제주항공도 B737 단일기종(B737-800 / B737-8) 운용으로 동일 모델. 차이는 ① 한국발 아웃바운드 레저 수요 의존(일본 노선 매출 비중 40.0%, 3Q26 [IR]) ② 달러 비용·원화 매출 구조로 원/달러 환율 민감 ③ 그룹(애경) 재무 여력이 약해 위기 때 유상증자·영구채로 버팀 — 이번 버전은 피어 수치 비교 미수행
→ **국내 티웨이항공·진에어**: 같은 단거리 국제선 LCC. 진에어는 대한항공 계열 통합 LCC 주체, 티웨이는 2025 대명소노그룹 계열 편입 [언론 일반 보도, 미검증 ⚠️]. 대형사 대비 비교는 `대한항공_기업개요.md` 참조 (동일 배치 작성)
→ **제주항공 차별점**: 국내선 점유율 1위권 LCC(국내선 16.6%)이면서 국제선 탑승객 국적 LCC 1위 — 그러나 2024-12 사고 후 브랜드·운항 축소로 2025 국제선 M/S가 9.6% → 8.2%로 하락 [DART]

### ④ 적정 밸류에이션 방법

- **1순위: EV/EBITDA (IFRS16 — 리스부채를 순차입금에 포함)** — 항공사는 기단 조달 방식(운용리스·금융리스·구매)에 따라 PER·PBR이 왜곡되므로 리스 포함 EV 기준이 업계 표준
→ LTM EBITDA (4Q25\~3Q26) **2,539억** = 영업이익 978억 + 감가상각비·무형자산상각비·사용권자산상각비 [DART 비용의 성격별 분류, 4Q25 = 2025 연간 − 9M25 계산]
→ 순차입금 (리스 포함) **8,906억** = 차입금 2,363억 + 리스부채 8,241억 − 현금 1,686억 − 단기금융자산 12억 [DART 3Q26 재무상태표, 계산]
→ EV **15,357억** = 시총 6,451억 + 순차입금 8,906억 → **EV/EBITDA 6.0배** [계산] / 신종자본증권 2,000억을 부채로 간주 시 EV 17,357억 → **6.8배**
→ 비교 기준: 2023(리오프닝 정점) EBITDA 2,969억, 2024 2,175억, 2025 354억 [계산]
- **2순위: PBR (보통주 귀속 자본 기준)** — 자본이 적자·증자·영구채로 크게 흔들려 보조 지표. 신종자본증권(자본 계상)을 빼고 보는 것이 보수적
→ 현재 **1.21배** (시총 6,451억 / 3Q26 자본총계 5,311억) · **1.95배** (신종자본증권 2,000억 차감 보통주 귀속 3,311억 [계산])
→ 연말 PBR (자본총계 기준, 연말 종가 × 발행주식수 [계산]): 2022 3.74배 · 2023 3.04배 · 2024 1.87배 · 2025 1.59배 (2021 이전은 Yahoo 수정주가만 확보되어 미산출 ⚠️)
- **PER은 보조**: LTM 순이익 1,498억 기준 **4.3배** (신종자본증권 이자 약 66억 차감 보통주 귀속 1,432억 기준 4.5배) [계산] — 단 3Q26 순이익에 외화환산·외환차익(순) 약 1,000억 + 항공기 매각예정자산처분이익 522억이 포함된 일회성 과다 구간 [DART 주석 28]
- **배당수익률 0%** — FY2019 이후 보통주 무배당 (마지막 DPS 650원, FY2018) [DART 현금흐름표·배당 공시]
- **피어 차별화**: 대한항공(FSC·화물·통합 아시아나) 대비 제주항공은 EBITDA 변동성이 훨씬 커서 정점 EBITDA(2023) 기준 정상화 멀티플 비교가 유효 — 2023 EBITDA 2,969억 적용 시 현 EV/EBITDA 5.2배 [계산]

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **4개 분기 연속 흑자 + LTM OPM 8%+** 시 → 사고 이후 정상화 완료로 보고 "사이클 회복 국면" 명시, 밸류 기준을 정점 EBITDA로 전환
- **통합 진에어 출범(2027-03) 이후 국적 LCC 국제선 좌석 공급 YoY 감소** 시 → Secondary(과점화)를 Primary 보조 축으로 격상
- **B737-8 비중 50%+ 도달 + CASK 하락 확인** 시 → 원가 구조 변화로 저점 OPM 상향 여부 재평가 (3Q26 B737-8 13대 / 44대 = 30% [DART, 계산])
- **사조위 최종 조사 결과 공표 또는 형사 책임·과징금 등 회사 귀속 처분 발생** 시 → 리스크 프리미엄·운항 제한 재평가 (현재 조사 진행 중)
- **부채비율 800%+ 또는 자본잠식** 재발 시 → "재무 구조조정(희석) 리스크" 분류 추가 (2025말 754%, 3Q26 382%)

### ③ 사업부별 디테일

(1) 노선 포트폴리오 — 일본·동남아 단거리 중심, 중거리 확장
→ 3Q26 여객매출 비중: 일본 40.0% · 동남아 23.0% · 국내선 18.5% · 중국 7.7% · 중화권 7.4% [IR 3Q26]
→ 2024\~2026 신규 지점: 가고시마(2024-08)·발리·바탐(2024-10)·하코다테(2025-05)·상하이(2025-07)·고베(2026-06), 폐쇄: 싼야(2025-04)·괌·옌타이(2025-11)·달랏(2026-04) [DART 연혁]
→ B737-8 항속거리 8시간(5,880km) — 우즈베키스탄·인도네시아 등 취항 가능, B737-800은 6시간(4,982km) [IR 3Q26]

(2) 가동률 — 사고 이후 감편으로 하락
→ 여객기 월평균 가동시간: 438시간 (2024) → 384시간 (2025) → 356시간 (9M26) [DART II-3-3]
→ 공급(ASK, 별도): 2024 23,722 → 2025 21,394 백만석km (-9.8%) [DART]

(3) 원가 — 연료·리스·정비가 3대 비용
→ 2025 연결 비용: 연료유류비 4,711억 (총비용의 27.9%), 종업원급여 3,856억, 공항관련비 2,122억, 정비비 1,789억, 사용권자산상각 1,135억, 임차료 658억 [DART 주석 성격별 분류]
→ 항공유 매입: 2024 422.7 → 2025 328.2 → 9M26 349.3 백만 USD (GS칼텍스·SK에너지 외 경쟁입찰) [DART II-3-1]
→ 9M26 연료유류비 5,003억 (9M25 3,487억 대비 +43.5%) — 급유 단가 상승 (국내 317.21 / 해외 374.08 US cents/gallon vs 2025 218.06 / 259.05) [DART, 계산]

(4) 부가매출
→ 9개 언어 홈페이지·앱 직판, 기내특화서비스 10종, Aircafe [DART II-4-2]
