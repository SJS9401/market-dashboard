# 달바글로벌 기업 개요 (v1.0 — K-뷰티 브랜드사, 고성장)
> **Fact verify cutoff**: 2026-11-15. 재무는 **2026.06 반기보고서(2Q26)까지 확정**. **3Q26 실적(잠정·분기보고서)은 작성 시점 미확보** — 웹 검색으로 발표 확인 불가, 샌드박스에서 OpenDART 공시목록 직접 조회 불가. 주가·시총은 Yahoo Finance 2026-11-13 종가 121,000원 단일 소스

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (해외 확장형 K-뷰티 브랜드)**

→ 매출 2022 1,452억 → 2025 5,197억 (3년 CAGR **+53%**), 회사 제시 2019~2025 CAGR **67.8%**. **38분기 연속 YoY 매출 성장**(2Q26 IR)
→ 2Q26 매출 1,869억(+46% YoY), 영업이익 472억(+62%), OPM 25.3% — 역대 최대 분기. 해외 비중 75.7%
→ 성장 엔진이 국내 → 해외로 교체됨: 해외 매출 2023 443억(22%) → 2025 3,260억(63%) → 1H26 2,592억(72%). 국내는 2Q26 -4% YoY로 정체

**Secondary 노트: 마케팅 레버리지형 이익 구조 (원가율 고정, 판관비율이 OPM 결정)**

→ GPM은 73~77%로 안정적(OEM 위탁 생산). OPM 변동은 판관비율(광고선전비·판매수수료·운반비)이 결정 — 3Q25 OPM 14.6%(마케팅 선행투자) vs 1Q26 26.3%
→ 단일 영업부문(화장품) — 사업부별 영업이익 미공시. 제품별·권역별 **매출만** 공시(권역은 IR 관리회계)

**Entity 구조 (2026.06)**

→ **(1) (주)달바글로벌** — 서울 마포 본사. 브랜드 d'Alba(스킨케어), d'Alba Signature(고가 라인·홈뷰티 디바이스), Veganery(이너뷰티), Truffle di Alba(한남동 레스토랑, 브랜드 홍보용 F&B)
→ **(2) 연결 종속 3사** — DALBA RUS LLC(러시아, 2023.06), DALBA JAPAN(2024.07), DALBA USA(2024.12). 2Q26 중국 현지법인 설립 완료(IR)
→ **(3) 관계사** — (주)쿠오카스킨(K-향수 브랜드 'Kuoca') 33.61% 지분 취득(2026-07-29, 96억 현금, 3년 후 잔여지분 콜옵션)

(2) Summary Box (연결 2022~2025 + 2026 상반기)

| 지표 | 2022 | 2023 | 2024 | 2025 | 1H26 | 최근 4분기(3Q25~2Q26) |
|---|---|---|---|---|---|---|
| 매출 (억원) | 1,452 | 2,008 | 3,091 | **5,197** | **3,581 (+48% YoY)** | 6,357 |
| 영업이익 (억원) | 146 | 324 | 598 | **1,015** | **923 (+56%)** | 1,345 |
| 순이익 (억원) | 9 | 136 | 154 | 791 | 744 | 1,089 |
| OPM | 10.1% | 16.2% | 19.4% | 19.5% | **25.8%** | 21.2% |
| 해외 매출 비중 | 13.2% | 22.0% | 45.6% | 62.7% | 72.4% | — |

→ 매출 CAGR(2022→2025) **+53%**, OPM 4년 연속 상승(10.1% → 19.5%) 후 1H26 25.8%로 레벨업
→ 사이클 주기·회수: 상장 1.5년·연간 4개 시계열로 **사이클 판정 불가** (매출 역성장 연도 없음)
→ 2022 수치는 K-IFRS 전환일(2022-01-01) 기준 **미감사** 요약재무(2024 사업보고서). 2019~2021은 ③에서 IR 참고치로만 사용

(3) 정량 근거 — 연간 매출·OPM

![달바글로벌 연간 매출 & OPM](charts/달바글로벌_chart1_매출OPM.png)

→ 2019~2021: 국내 홈쇼핑·온라인 중심 '퍼스트 스프레이 세럼(미스트)' 단일 히트 브랜드 단계 (OPM 2~4%, IR 차트)
→ 2022~2023: 국내 확장 + 해외 진출 초기, OPM 10~16%
→ 2024~2025: 일본·러시아·북미·아세안 동시 확장, 해외 비중 46% → 63%, 2025-05 KOSPI 상장
→ 2024 순이익률 저하(5.0%)는 전환상환우선주(RCPS) 관련 금융비용 367억 때문 — 2024년 중 RCPS 보통주 전환(716.5억 자본 편입)으로 해소

| 워치리스트 | 소비재 > 뷰티 > **브랜드사** 핵심 (에이피알·달바글로벌·아모레퍼시픽·브이티) / 밸류체인 연관: ODM(코스맥스·한국콜마·코스메카코리아), 유통(실리콘투) |

(5) 분류 결정 논리

→ 매출 YoY 40~70%가 10분기 이상 지속, 이익 성장이 매출보다 빠름(1H26 OP +56% vs 매출 +48%) → **고성장**
→ 다만 성장 동력이 신규 국가 진입(아마존·틱톡샵 → 오프라인 리테일 입점)이라는 **확장 단계** 의존. 신규 권역 소진·마케팅 효율 저하 시 '지속성장'으로 재분류 검토 `[판단]`
→ 2025년 3Q 실적 쇼크(OP 컨센 대비 -30%, 익일 주가 -20.5%)처럼 **분기 OPM 변동성**이 크다는 점이 일반 소비재와 다름

(6) 적정 밸류에이션 방법

| 우선순위 | 방법 | 현재 값 (2026-11-13 종가 121,000원) | 비고 |
|---|---|---|---|
| 1 | PER (최근 4분기) | 시총 1.51조 / 순이익 1,089억 = **약 13.9배** | 최근 4분기 = 3Q25~2Q26 |
| 2 | PER (2026E) | 회사 가이던스 매출 7,000억·OPM 20% 초반 → OP 약 1,450~1,550억 `[판단: 가이던스 단순 환산]` | 셀사이드 컨센 미확보 |
| 3 | EV/EBIT | (1.51조 − 순현금성 자산 약 2,000억) / 1,345억 = **약 9.7배** | 현금 927억 + 기타금융자산 1,090억(2Q26), 차입금 없음 |
| 4 | PBR | 1.51조 / 자본 2,518억 = 약 6.0배 | 자산경량 모델이라 보조지표 |

(7) 분기 재평가 트리거

→ (1) **분기 OPM 20% 유지 여부** — 1Q26 26.3%, 2Q26 25.3%. 3Q는 계절적 약세 + 하반기 신제품 8종(일본) 마케팅 집행 구간
→ (2) **북미·유럽 오프라인 전환** — US 코스트코 연말 전점(625점)·Canada 코스트코 전점(120점)·세포라 캐나다 3Q 입점, 영국 Boots·독일 Rossmann 2H26 입점 예정
→ (3) **러시아 회복** — 2Q26 -34% YoY(선크림 재고 부족·와일드베리 창고 이슈), 2H 반등 가이드
→ (4) **국내 역성장 지속 여부** — 2Q26 -3.8% (홈쇼핑 -31%, PP용기 수급 차질, 올리브영 미스트 리뉴얼 공백)
→ (5) 2026 가이던스(매출 7,000억) 대비 진도율: 1H26 3,581억 = 51%
