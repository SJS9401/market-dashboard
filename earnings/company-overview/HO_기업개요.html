## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 지속성장 (방산 슈퍼사이클 수혜 구간)**

→ 매출 2014 €13.0bn → 2025 €22.1bn, Adjusted EBIT 마진 7.6% → 12.4%로 **COVID(2020) 1회를 제외하고 단조 상승**

→ 수주잔고 €53.3bn (2025말, 매출의 2.4배) — Defence 잔고 €41.1bn (2026-06, Defence 매출의 약 3.2년치, 회사 표현)

**Secondary 노트: 사이클 일부 (민항 항전·상업 위성 / 디지털 결제)**

→ Aerospace(항전·우주)는 2020 COVID와 상업 통신위성 수요 급감으로 2020 EBIT 적자(-1.8%), 2024 우주 구조조정 → 민수 사이클에 노출

→ Cyber & Digital은 결제카드·생체인식 등 소비재형 수요 + 단기 매출 → 2025~H1 2026 역성장·마진 하락

**3개 사업부 구조 (2025 연간, €m)**

→ **(1) Defence** — 매출 12,234 (55%), Adj. EBIT 1,619 (13.2%) — 레이더·방공·전자전·함정 전투체계·통신·옵트로닉스·이펙터(로켓·탄약)
→ **(2) Aerospace** — 매출 5,910 (27%), Adj. EBIT 560 (9.5%) — 민항·군용 항전(Avionics) + Thales Alenia Space(우주, Leonardo 33%)
→ **(3) Cyber & Digital** — 매출 3,852 (17%), Adj. EBIT 526 (13.7%) — Cyber(Imperva·HSM) + Digital(eSIM·결제·ID, 구 Gemalto)

**한국 방산 5사와의 위치 (2025 각사 주 지표)** — 상세 수치는 각사 기업개요·리뷰 참조

→ Thales Defence 매출 €12.2bn은 한국 5사 방산 매출 합계보다 큼 [판단], Defence 마진 13.2%는 한화시스템·LIG D&A 대비 높은 편이고 현대로템 방산 부문(3Q26 28.1%)보다는 낮다 [판단, 각사 리뷰 참조]

(3) 정량적 분류 근거

→ **수주 3년 연속 €23bn+** (2022 23.6 → 2023 23.1 → 2024 25.3 → 2025 25.3), 2026 9M €19.1bn (+15% 유기적)
→ **€100m 이상 대형 수주** 9M 2026 29건·€7.6bn (+42%)
→ **Defence 마진 개선** — H1 2024 12.9% → H2 2025 13.5% → **H1 2026 13.8%** (반기 최고)
→ **현금 창출** — Free operating cash flow 2021~2025 연 €2.0~2.6bn, H1 2026 €1.87bn (선수금 유입)

(4) 산업 분류

→ **GICS** — Industrials / Aerospace & Defense
→ **지수** — CAC 40
→ **워치리스트** — 섹터 방산 / 서브섹터 **방산 글로벌** (캘린더 표기 "방산전자·레이더, 프랑스 국방예산 (1·3Q 매출만)")

(5) 분류 결정 논리

→ 매출·이익의 55~60%가 Defence (2025 이익 비중 60% [계산]) → 방산 예산 사이클(유럽 재무장·NATO GDP 3.5% 목표) 위에서 생산능력 증설로 성장하는 구조 → **지속성장 Primary**
→ Aerospace·Cyber & Digital은 민수 사이클·소비재형 변동 → Secondary로 표기, 그룹 마진의 하방 요인

(6) 적정 밸류에이션 방법

→ **1차 — Forward PER** (안정적 이익 증가형): 2025 조정 EPS €9.76 기준 **~23x** [계산: €227.1 / €9.76]
→ **2차 — EV/EBIT**: EV ≈ €47.3bn [계산: 시총 €46.8bn + 순차입 €0.5bn(2026-06)] / 2026E Adj. EBIT ~€2.94~3.02bn [계산: 가이던스 매출 €23.3~23.6bn × 마진 12.6~12.8%] → **~16x** [계산]
→ **3차 — SOTP**: Defence(유럽 방산 피어 멀티플) + Avionics + Space(Airbus·Leonardo 우주 합작 'Bromo' 이관 예정) + Cyber & Digital
→ PBR 미사용 — 영업권(Gemalto·Imperva) 비중이 커 자본이 이익 체력을 반영 못함

(7) 분류 변경 조건

→ ① Defence 매출 유기적 성장률이 2개 반기 연속 한 자릿수 초반(<5%)으로 둔화 + Book-to-bill < 1.0 → 방산 사이클 정점 → **Secondary "사이클" 격상**
→ ② 우주 합작(Bromo) 완료로 Space 분리 + Cyber & Digital 매각/분리 → **순수 방산전자 플레이로 재분류**, 비교 피어를 Saab·Leonardo DRS 등으로 이동
→ ③ 그룹 Adj. EBIT 마진이 2028 목표 13~14% 상단 이상 조기 달성 → 고마진 지속성장 재평가

## ② 회사 개요

(1) 기본 정보

- **법인명** — Thales S.A. (프랑스 주식회사)
- **본사** — 4 rue de la Verrerie, 92190 Meudon, France
- **상장** — Euronext Paris (HO), CAC 40 / OTC ADR THLLY
- **회계연도** — 1월~12월 / 실적 공시: 1Q·3Q는 수주·매출만, 반기·연간에 EBIT
- **사업 한 줄 정의** — 레이더·방공·전자전·함정 전투체계·군 통신 등 **"보고·판단·연결하는" 방산전자**와 항전·위성·사이버 보안을 공급하는 유럽 최대 방산전자 그룹
- **회장 겸 CEO** — Patrice Caine (2014~)
- **CFO** — Jérémie Papin (2026-05 선임 공시)
- **임직원** — 85,000명+ (65개국, 2025 보도자료)
- **R&D** — 연 €4.5bn (고객 수탁 포함, 회사 표현) / 자체 R&D 비용 €1,328m (2025 손익)

(3) 주요 연혁

**1기 (~2000) — Thomson-CSF**
→ 1968 Thomson-CSF 출범 (방산전자) → 1998 민영화 → **2000 Thales로 사명 변경**

**2기 (2001~2018) — 프랑스 방산전자 + 우주·운송**
→ 2007 Alcatel-Lucent 우주·운송 사업 인수 → **Thales Alenia Space** (Leonardo 33%) 출범
→ 2009 **Dassault Aviation**이 Alcatel-Lucent 지분 인수 → 산업 파트너 (현 26.6%)
→ 2014 Patrice Caine CEO 취임 / 2015 이집트·카타르 Rafale 수출 → 레이더(RBE2)·전자전(SPECTRA) 동반 수주

**3기 (2019~2023) — 디지털 확장**
→ 2019-04 **Gemalto 인수** (~€4.8bn) → Digital Identity & Security 사업부
→ 2020 COVID 저점 (마진 8.1%) / 2021 Transport 매각 결정 (Hitachi Rail, 2024-05 완료)
→ 2022 우크라이나 전쟁 → 방공 레이더(Ground Master)·로켓 등 수주 급증
→ 2023-12 **Imperva 인수** ($3.6bn), 2023 사업부 재편 → Defence / Aerospace / Cyber & Digital (2024~ 공시)

**4기 (2024~현재) — 유럽 재무장 수혜**
→ 2024-11 CMD: 2024~2028 유기적 매출 CAGR 5~7%, 2028 Adj. EBIT 마진 13~14%
→ 2025-10 Airbus·Leonardo와 **우주 사업 통합(Bromo)** 합의 → 2027 완료 목표 (EU 경쟁당국 승인 필요)
→ 2026-05 우주 정지궤도 통신위성 2기 주문 취소 (H1 매출 약 €-150m)
→ 2026-07-03 **독일 F126 호위함 프로그램 종료** → 특별손실 약 €450m (순이익 -€331m), 수주·현금 목표 상향
→ 2026-07 **Exail 인수 합의** (Gorgé 가문 35.51% + 공개매수, 주당 €134, 수중전·관성항법) — 2027 3Q 지분 인수, 2028 초 공개매수 완료 목표

(2) 사업부별 개요

**Defence — 매출 비중 55% (2025)**

"군의 눈(레이더·소나·광학)·귀(전자전)·신경망(통신·지휘통제)과 일부 주먹(로켓·탄약)을 만드는 사업부."

- **지상·공중 감시 레이더 / 방공**: **Ground Master (GM200·GM400 계열)** — 우크라이나·루마니아(GM200 MM/A 12기, EU SAFE)·중동 다수 수출 / **SAMP/T NG** (EUROSAM — MBDA와 합작, Thales는 Ground Fire 레이더·교전통제) / ControlView·SkyView 방공 지휘통제 / ForceShield 단거리 방공 / LMM·Starstreak 미사일 (영국 Belfast)
- **전자전**: **SPECTRA** (Rafale 자체보호, F5 차세대 개발 2026 수주), 함정·지상 전자전
- **함정 전투체계·센서**: TACTICOS 전투관리체계, SMART-L·Sea Fire 레이더, CAPTAS 소나 — 프랑스 FDI, 영국·네덜란드·그리스(Hydra급 현대화) 등 / **Naval Group 35% 지분** (잠수함·수상함 원청)
- **항공 미션시스템**: Rafale RBE2 AESA 레이더, TALIOS 표적 포드, 차세대 다목적 사격통제 레이더 (DGA 2026)
- **군 통신·네트워크**: SYNAPS 무전기, 위성통신, Hexaforce (AI 지휘통제 SW, 2026-09 출시)
- **지상 차량·이펙터**: **Bushmaster 장갑차** (호주, 2026 268대 추가), 70mm 로켓 (인도 LCH 150대 포드), 호주 탄약 공장 (Mulwala·Benalla)
- 수주잔고 €41.1bn (2026-06), Defence 매출의 약 3.2년치 (회사)

**Aerospace — 매출 비중 27%**

"여객기·군용기의 조종석 전자장비와 위성을 만드는 사업부."

- **Avionics**: 비행관리·디스플레이·IFE·항공통신(Cobham AeroComms 인수) — 두 자릿수 마진 (회사 표현)

**Cyber & Digital — 매출 비중 17%**

"데이터·결제·신원을 지키는 보안 소프트웨어·하드웨어 사업부."
