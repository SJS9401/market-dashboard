# 양쯔장조선 기업 개요 (v1.0 — 조선 글로벌, 중국 최대 민영 조선사)
> **Fact verify cutoff**: 2026-11-14 (3Q26 Business Update 11/10까지 반영. 다음 손익 갱신 = FY2026 실적, 2027년 2월 말 예상)

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 사이클 (조선 신조 사이클) — 현재 사이클 상단에서 마진 확장이 이어지는 구간**

→ 2014~2022년 매출총이익률은 13~28%를 오르내렸고 순이익은 2015년(-29%)·2016년(-29%)·2020년(-19%)에 감소했다(2021년은 분할 재작성으로 비교 불가). 2023년부터 3년 연속 순이익 +30~62% 성장, GPM 22% → 34%로 사이클 상승이 뚜렷하다
→ 매출의 94%가 조선(신조)이고 수주는 2024년 146억달러 → 2025년 24.6억달러 → 2026년 10개월 69.8억달러로 크게 출렁인다. 이익은 2~3년 전 수주 가격이 결정한다

**Secondary 노트: 고배당·순현금 + 해운(선대 28척) 일부**

→ 순현금 125억위안(2026.06), 배당성향 FY2024 38% → FY2025 50%, FY2026~27 50% 유지 가이던스(OCBC 인용)
→ 해운 부문(벌크선 중심 28척)은 매출 3% 수준의 보조 사업이다

**Entity 구조 — 기준 단절 1회**

→ **(1) 계속영업 (2021~)**: 조선(4개 야드 + 신규 훙위안) / 해운 / 기타(터미널·무역·설계·부동산)
→ **(2) 2022.04.28 투자부문 분할**: 부채투자·자산관리 등 투자 사업을 Yangzijiang Financial Holding(SGX: YF8)으로 분할 상장(현물배당 약 200억위안). 2021년 실적은 계속영업 기준으로 재작성됐고, 2020년 이전 수치에는 투자부문(2020년 매출 20.4억·부문이익 19.5억위안)이 포함돼 있다
→ **(3) 지분법 투자**: YAMIC(양쯔-미쓰이 조선 JV), 쓰네이시 저우산(34%, 2025), Poseidon Corp.(Seaspan 지주사, 10%, 2026.05)

(3) 산업 분류
→ 워치리스트: 조선 (섹터 T2 주도 후보) / 서브섹터: 조선 글로벌 (2026-11 편입, 한국 조선 3사의 비교 피어)
→ 상장: SGX Mainboard, STI(스트레이츠 타임스 지수) 구성 종목. 사업·생산은 전부 중국 장쑤성 장강 연안

(4) 분류 결정 논리
→ 이익 결정 변수는 2~3년 전 수주 선가, 철강가, USD/CNY 환율이다. 세 변수 모두 사이클을 탄다. 2023~2025년의 마진 확장은 2021~2024년 고가 수주와 위안 약세·철강가 하락이 겹친 결과라 "지속성장"이 아니라 "사이클 상단"으로 분류한다
→ 다만 순현금·고배당·선별 수주 기조가 하락기 손실을 줄여 왔다(2015~2016년 침체기에도 순이익률 11% 이상)

(5) 적정 밸류에이션 방법
→ 1순위 P/E (셀사이드 표준): UOB KH는 10년 평균 6.2~6.3배, 목표 9.3~10배. CGS 11배(FY27F), OCBC 10.7배(FY27~28 평균 EPS), DBS 12배·3배 P/B (보도 인용)
→ 2순위 P/B + ROE: ROE 29.5%(2025), 1H26 연율 32.3%
→ 한국 피어 비교: 섹터 리뷰 기준 2027F PER 한국 3사 9.8~10.8배 vs 중국 8.5~9.9배(신한 Bloomberg 표). DBS는 양쯔장 FY27 PER 8배로 제시

(6) 분류 변경 조건 (재평가 트리거)
→ **지속성장으로 상향**: 수주 가격 하락기(2027~)에도 조선 GPM 30% 이상이 2년 이상 유지되고 훙위안·LNG선으로 물량이 구조적으로 늘 때
→ **사이클 하강 진입**: 반기 조선 GPM 35% 미만 + 반기 순이익 YoY 한 자릿수 + 연간 수주 목표 미달이 동시에 나올 때
→ **분류 혼합 (조선 + 투자)**: Poseidon(10%) 같은 해운사 지분 투자가 지분법이익의 큰 몫을 차지하게 될 때

→ [판단] 양쯔장은 컨테이너선 비중이 한국 3사보다 훨씬 높다. 한국이 LNG선·해양·특수선으로 고부가 쪽에 서 있다면, 양쯔장은 컨테이너선·탱커·벌크의 대량 표준선에서 원가·속도로 이긴다. 두 회사군이 가장 직접 부딪히는 곳은 초대형 이중연료 컨테이너선 입찰이다
→ 마진 레벨: 양쯔장 1H26 조선 GPM 37.1%·부문이익률 36.9% vs 한국 3사 합산 3Q26 OPM 14.0%(섹터 리뷰). 회계 지표가 달라(GPM·부문이익 vs 영업이익) 단순 비교는 과대평가 쪽이지만, 차이가 20%p 이상이라 수익성 우위는 분명하다 [판단]

(3) 사업부별 개요 (매출 비중 순, 1H26)
→ **조선 (94.2%)**: 장쑤성 장강 연안 야드 4곳 + 훙위안(2026 가동) + JV YAMIC. 회사는 "컨테이너선이 최대 매출원, 그다음이 탱커"라고 설명한다(1H26 Presentation p.8). 2026년 인도 목표 58척(YAMIC 포함)
→ **해운 (3.3%)**: 벌크선 중심 선대 28척(평균 선령 8.5년, 2026.10 보도 인용). 스팟 용선 위주 운용, 노후선 매각으로 선대 교체 중
→ **기타 (2.5%)**: 터미널 서비스, 원자재 무역(관계사 쓰네이시 저우산 대상), 선박 설계, 투자부동산, 강관 말뚝 제조(Chengkang 연결)

(4) 사업부별 디테일
→ **수주 잔고 (2026.10.31, 보도 인용)**: 285척·1,265만 CGT·263억달러. 컨테이너선 173척 194억달러, 탱커 44척 24억달러, 벌크선 43척 23억달러, 가스선 25척 22억달러. 친환경 선박 비중 67%
→ **잔고 내 주력 선형 (2026.06, 회사 원문)**: LNG DF 17,000TEU 28척, LNG DF 24,000TEU 9척(이후 12척 추가), 메탄올 DF 13,000TEU 11척, LR1 탱커 75,000DWT 18척, 82,500DWT 벌크선 14척
→ **YAMIC**: 잔고 54척·31.2억달러, 가스선 비중 53%(2026.10). 2024년 고부가 가스선 중심 재편 후 지분법이익 급증(1H26 3.42억위안)

## ⑤ 지배 구조

(1) 그룹·계열 관계
→ 런(任)씨 일가 지배. 창업자 Ren Yuanlin의 아들 Ren Letian이 회장 겸 CEO다
→ 분할 계열: Yangzijiang Financial Holding(2022 분할, 투자)은 별도 상장사다. 이후 해운 펀드 사업은 Yangzijiang Maritime Development로 다시 분리됐다(보도). 조선 회사와의 지분 관계는 미확인
→ 관계사·JV: YAMIC(미쓰이 계열과 JV), 쓰네이시 저우산(34%), Poseidon Corp.(10%), ENN Yangtze(톈진) 해운(49%, 2026 신설)

(2) 주주 구성
→ 대주주 지분율(런씨 일가 합산), 기관·개인 분포: **미확보** (FY2025 Annual Report 주주 현황 미다운로드). Simply Wall St는 Ren Yuanlin 개인 지분을 4.2%로 표시하나 일가·법인 보유분 합산이 아니어서 쓰지 않았다

(3) 임원·이사회
→ Ren Letian(任乐天): 회장 겸 CEO, 2026년 5월 Poseidon Corp. 이사회 합류. 이사회 구성·약력 상세는 미확보
