## 1. 기업 분류

- **Primary 분류: 지속성장 (구독형 팬덤 플랫폼)** — 매출 97\~99%가 '버블' 월 구독(인앱 결제, 순액법 인식). 차입금 0, CapEx 매출 대비 1% 내외의 asset-light 구조, OPM 33\~41% 고마진
- **Secondary 노트: 꿈 (중국·글로벌 확장 옵션)** — 2025-06 텐센트뮤직(TME) QQ뮤직 버블, 2024 일본·북미 버블, 2026 뉴욕 '버블 하우스'. 다만 2024\~2026 구독수는 정체(분기 평균 190만\~230만 박스권)라 성장 서사는 가격 인상·PG 결제 전환·해외 신규 채널이 떠받치는 구조

### ② 산업 분류

- DART 업종: 응용 소프트웨어 개발 및 공급업 (모바일 앱 플랫폼)
- 실제 비즈니스: K-POP 팬덤 커뮤니케이션 구독 플랫폼 — 엔터 밸류체인에서 기획사(IP 공급) 다음 단계의 **팬덤 결제 레이어**
- 워치리스트: 엔터 섹터 / 서브섹터 **팬덤 플랫폼** (기획사 4사 + 큐브엔터, 음원 글로벌 UMG·Spotify·TME, 공연 글로벌 Live Nation과 함께 운영)
- 소속 기업집단: **카카오** (상호출자제한기업집단) — 최대주주 SM엔터테인먼트의 최대주주가 카카오(21.61%)

### ③ 분류 결정 논리

- 매출의 100%가 반복 구독(+소액 아이템)이고 경기 민감도가 낮다 → 사이클주보다 **지속성장 구독주**
- 그러나 구독수가 3년째 200만 안팎에서 정체 → 고성장주로 보기 어렵고, 성장은 ① 가격(2025-07 인앱 11\~12% 인상) ② 수수료율(PG 웹결제 전환) ③ 신규 시장(중국 QQ뮤직·일본·북미)에서 나와야 함
- 중국 QQ뮤직 버블은 TME가 결제·운영하고 디어유는 로열티 수취 구조 → 성공 시 구독수 대비 매출 레버리지가 아닌 **로열티 매출 레버리지**

### ④ 적정 밸류에이션 방법

- **1순위 PER** — 이익 변동성은 작으나 영업외 손익(외화환산·MG 손상·CPS) 변동이 커서 **영업이익 기준 Core PER**를 함께 본다
- 셀사이드 관행: 2026E 지배순이익 × Target PER 30배 (키움 2025-11), 한화 PER 20.8배(2026E) 등 — 성장 프리미엄은 중국 지표 확인 여부에 연동
- 현재 (2026-11-13): 시가총액 **약 4,902억원** (20,650원 × 23,738,406주) / 최근 4개 분기(4Q25\~3Q26[잠정]) 순이익 191.6억 → **PER 약 25.6배** / 영업이익 380.7억 → 시총/OP 약 12.9배 / 자본 2,087억(3Q26) → **PBR 약 2.3배**

### ⑤ 분기 재평가 트리거

1. **버블 분기 평균 구독수** — 200만 회복 여부 (2Q25 217만 → 3Q26 197만)
2. **해외 채널 지표** — bubble for Japan 분기말 구독(3Q26 11.09만), QQ뮤직 버블·C-POP 입점 수(128명, 2026-06), JOOX(홍콩)
3. **PG 결제 비중** — 앱마켓 수수료 절감이 OPM 40%대 유지의 핵심
4. **뉴욕 버블 하우스** 비용·성과 (4Q26부터 초기 비용 반영 — 셀사이드 코멘트)
5. **핵심 IP 이탈** — SM·JYP 아티스트 군입대·계약 만료, 하이브 위버스와의 경쟁

### ② 사업부별 개요 (매출 비중 큰 순서)

1. **DearU bubble (97\~99%)** — 아티스트 메시지를 1:1 채팅방으로 받고 답장하는 월 구독. 국가별 번역, 구독 일수 표시·답장 길이 확장 등 유지 장치. 앱 형태: 통합 'bubble' + 소속사 전용 앱(Lysn=SM, bubble for JYPnation 등)
2. **기타 (1\~3%)** — 라이선스 매출 등. 2026-03 사업목적에 화장품·식품 유통·MD·캐릭터·문화콘텐츠 추가 → 아티스트 IP 기반 상품 사업 준비 단계 (매출 미미)

### ③ 사업부별 디테일

- **가격**: 2025-07 인앱 구독권 인상(국내 4,500→5,000원, 해외 USD 3.99→4.49). 동시에 PG(웹) 결제 도입 — 기존 가격 유지 + 추가 메시지 혜택 제공으로 웹결제 유도 → 앱마켓 수수료 절감
- **이익 레버리지**: 매출 순액 인식, 원재료·생산설비 없음 → 매출 증분 대부분이 이익. 4Q25\~3Q26 분기 OPM 40\~41%로 상장 후 최고권
- **IP 리스크 사례**: 2Q24 ZB1(제로베이스원) 계약 종료 + 주요 IP 군입대 → 구독 230만 → 190만(4Q24)
- **해외**: 해외 이용 비중 66%(2026-06). 일본(엠업홀딩스 JV), 북미('the bubble'), 중국(QQ뮤직), 홍콩(JOOX), 미국 뉴욕 오프라인 '버블 하우스'(2026)
- **비용 이슈**: 2025 MG(최소보장금) 선급금 손상 128억(기타비용) → 순이익 −24%. 4Q26 뉴욕 버블 하우스 인건비·초기 비용 반영 예정 (셀사이드)
