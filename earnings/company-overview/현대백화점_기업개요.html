## 1. 기업 분류

- **Primary 분류: 사이클 — 내수 소비·인바운드(면세·외국인 관광) 경기 민감형 백화점, 부동산 자산 기반 저PBR 유통주** — 2014\~2018 백화점 단일 사업 시기엔 OPM 19\~23%의 안정 구간이었지만, 2018-11 면세점 진출·2022 지누스 인수로 연결 구조가 바뀐 뒤(2019\~2025) OPM은 6.0\~8.9%로 내려왔고, 이익은 **내수 소비(명품·패션) 경기 + 면세 따이궁/외국인 관광 + 지누스(미국 매트리스) 업황**의 세 사이클에 좌우됨
- **Secondary 노트: (1) 인바운드 관광 회복 테마 (2) 지누스 구조조정 옵션** — 2026 상반기 외국인 매출 더현대서울 +134%·무역센터점 +131% YoY [머니투데이 2026-08-05], 면세점 9M26 영업이익 128억으로 흑자 전환 [DART 분기보고서(2026.09)]. 반면 지누스는 9M26 영업손실 -693억 (매출 -29.0%) — 2023·2025 두 차례 대규모 무형자산 손상 (2,583억·2,056억)

### ② 산업 분류

- 산업: **백화점·아울렛(오프라인 대형 유통) + 면세점(보세판매) + 가구 제조(매트리스, 지누스)**
- DART 업종: 47111 (백화점) [OpenDART 기업개황] / 사업보고서 부문: 백화점 부문·면세점 부문·가구 제조 부문 [DART 분기보고서(2026.09) II-2]
- 워치리스트 섹터: **여행·레저·유통** / 서브섹터: **유통**
- 시장 지위: 국내 백화점 빅3(롯데·신세계·현대) 중 하나. 점포 백화점 13개 + 아울렛 10개, 면세점 무역센터점 + 인천공항(DF7·DF5·DF2) [DART 분기보고서(2026.09) II-1]. 2025 백화점 부문(현대백화점+한무쇼핑) 순매출 2.44조·영업이익 3,934억 [DART 사업보고서(2025.12)]. 판교점은 국내 백화점 최단기간 연 거래액 2조 돌파 [이투데이 2026-02-11]

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준**: 9M26 백화점 부문 순매출 1.89조 = 부문 합계(내부거래 제거 전) 3.29조의 **57.4%**, 2025 55.8% [DART 분기보고서(2026.09) II-2]. 백화점 매출은 명품·패션·식품 소비 — 금리·자산가격·소비심리에 민감 → **소비 사이클**
(2) **이익 비중 sub-rule**: 9M26 부문 영업이익 백화점 3,600억 / 면세점 128억 / 지누스 -693억 → 백화점이 부문합(3,036억)의 **118.6%** (2025 93.9%) [DART 분기보고서(2026.09)]. 이익은 사실상 백화점 단일 엔진 → 백화점 사이클이 전사 이익 사이클
(3) **Boundary case 처리 — 면세점 / 지누스**:
→ 면세점: 매출 비중은 23\~27%지만 2019\~2024 6년 연속 영업적자 (누적 -3,067억 [계산]), 2025 +2억으로 첫 흑자, 9M26 +128억. 이익 기여보다는 매출 변동성(따이궁 의존 2021\~2022 매출 급증 → 2023 -55.8%) 요인
→ 지누스: 2022 인수(이전대가 8,890억 현금, 의결권 지분 38.09%, 영업권 3,027억 [DART 사업보고서(2022.12) 연결 주석 사업결합]) 이후 영업권·무형자산 손상 누계 4,999억 (2022 360억 + 2023 2,583억 + 2025 2,056억) [DART 사업보고서 연결 주석 27, 계산]. **Primary를 바꿀 규모가 아니라 할인 요인(Secondary)**
(4) **국내 피어 cross-ref**:
→ **롯데쇼핑·신세계** (유통 빅3): 같은 소비 사이클 + 면세 노출 구조. 비교 수치는 통합 검수 박스(④-1)와 각 사 기업개요 참조 (동시 작성 중)
→ 3Q26 3사 영업이익 증가율: 롯데백화점 +35.7%, 신세계 +23.5%, 현대백화점 +27.8% (백화점 부문 기준 보도) [CEO스코어데일리 2026-11-10, 제목 기준 — 본문 미대조]
→ 현대백화점의 차별점: ① 3사 중 유일하게 **해외 제조업(지누스)을 연결** ② 면세점 규모는 3사 중 최소 ③ 점포 대부분 자가 소유 (백화점·면세 유형자산 장부가 4.74조, 토지 2.33조 [DART 분기보고서(2026.09) II-3])

### ④ 적정 밸류에이션 방법

- **PBR(지배자본) + 백화점 부문 이익 기준 PER 우선, SOTP 보조**
→ 현재 **PBR 0.42배** [계산: 시총 1.97조 / 3Q26 지배자본 4.69조]. 12년 PBR 밴드(연말) 0.24배(2024) \~ 0.89배(2014), 2025말 0.44배
→ **PER(LTM 지배순이익) 8.3배** [계산: 지배순이익 LTM 2,372억 = 2025 2,077억 − 9M25 1,583억 + 9M26 1,878억]. 2023·2024 손상으로 적자였기 때문에 PER 밴드는 끊김
→ **배당수익률 2.4%** [계산: 2025 DPS 2,150원 / 91,400원]
- **SOTP 관점**: 백화점 부문 영업이익 LTM 4,977억 [계산: 4Q25 1,376 + 1Q26 1,358 + 2Q26 1,102 + 3Q26 1,141 — 부문 OP, 내부거래 제거 전] 대비 시총 1.97조 → 백화점 OP 대비 약 4.0배. 지누스 지분(36.88%) 가치는 지누스 상장 시가로 별도 산정 가능하나 이번 버전 미수집
- **피어 차별화**: 유통 빅3 공통 프레임(PBR·배당)을 쓰되, 현대백화점은 ① 자가 점포 비중이 높아 **자산가치 하방**이 단단하고 ② 지누스 적자 축소/매각 여부가 할인 해소 트리거. 2026-06 PBR 약 0.95배(207,000원 × 21,564,912주 / 3Q26 지배자본 [계산])까지 갔던 것은 인바운드 기대가 단기 과열된 사례

#### ④-1 유통 공통 비교 박스 (통합 검수 예정)

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **면세점 부문 OPM 3%+가 4개 분기 연속** (현재 9M26 1.4%) → Secondary(인바운드 수혜) 격상 검토
- **지누스 매각·지분 축소 또는 연결 제외** → 연결 구조가 "백화점 단일 + 면세"로 단순화 → OPM 레벨 재평가 (지누스 제외 시 9M26 OPM 약 12.8% [계산: (2,727+693)/(31,904−5,123)])
- **백화점 부문 OP YoY 마이너스 2개 분기 연속** (현재 3Q26 +27.8%) → 소비 사이클 하강 국면 태그
- **신규 출점 3개(더현대부산 2027·경산 아울렛 2028·더현대광주 2029, 잔여 투자 1.82조)가 CapEx/매출 15%+를 2년 연속 유발** → 투자 사이클 태그 (FCF·배당 여력 하향)

## 2. 회사 개요

### ① 기본 사항

- **회사명**: ㈜현대백화점 (Hyundai Department Store Co., Ltd.) / KRX 069960 (유가증권시장)
- **본사**: 서울특별시 강남구 테헤란로98길 12 (2020-04 압구정로 201에서 이전) [DART 사업보고서(2025.12) I-2]
- **설립**: 2002-11-01 ㈜현대백화점H&S(현 ㈜현대지에프홀딩스)의 백화점 사업부문이 분할되어 설립, 2002-11-25 유가증권시장 재상장 [DART 사업보고서(2025.12) I-1]. 백화점 영업의 출발은 1985-12 압구정본점 개점 (일반 공지 사실, 원문 미대조) — IR 자료상 "설립일 1971-06-15"는 모회사 기준 [IR 2023-4Q p.3]
- **지배구조**: 최대주주 ㈜현대지에프홀딩스 37.35% + 특수관계인(현대에이앤아이 4.68%, 정지선 1.92%) = **43.95%** (2026-09-30) [DART 분기보고서(2026.09) VII]. 현대지에프홀딩스의 최대주주는 정지선 회장(본인 33.7%, 특수관계인 합산 65.6%) [DART 반기보고서(2026.06) VII]
- **사업 한 줄 정의**: 서울·수도권 핵심 상권에 백화점 13개·아울렛 10개를 운영하는 국내 빅3 백화점 사업자로, 시내·공항 면세점(현대디에프)과 미국 온라인 매트리스 1위권 제조사 지누스를 연결 종속회사로 보유
- **규모**: 2025 연결 총매출(거래액) 9.87조 / 순매출 4.23조 / 영업이익 3,779억. 백화점 시장점유율 23.4% (2025, 통계청 소매판매 기준 — 아울렛 제외, 임대·특약 포함) [DART 사업보고서(2025.12) II-7]
- **대표이사**: 정지선 회장 (1972-10생, 현대백화점그룹 회장·현대지에프홀딩스 대표이사, 2026-03 재선임) / 정지영 사장 (1963-05생, 前 영업본부장·울산점장, 이사회 의장) — 각자 대표 [OpenDART exctvSttus 2025, DART 반기보고서(2026.06) VI]
- **신용등급**: 회사채 **AA+** (한국신용평가·NICE신용평가·한국기업평가 3사, 2023-04\~2025 정기·본평가 유지), 기업어음·전자단기사채 A1 [DART 사업보고서(2025.12) I-1 신용평가]

(1) 2002\~2007: 재상장 후 내수 소비 회복 — 장기 상승
→ 2002-12 월말 19,100원 (시총 약 0.45조) → 2007-10 월말 125,000원 (시총 약 2.93조) [Yahoo, 계산]
→ 백화점 단일 사업, 수도권 핵심 상권 자가 점포 중심

(2) 2008\~2011: 금융위기 급락 → 중국 소비 붐으로 1차 고점
→ 2008-10 장중 41,050원 (금융위기 저점) → 2011-07 월말 **184,000원 (시총 4.31조)**, 장중 2011-08 203,500원 [Yahoo]
→ 2011-07 현대DSF 흡수합병, 2011-08 대구점 개점 [DART 사업보고서(2015.12) I-2]

(3) 2012\~2019: 이익 정체 + 출점 투자 → 장기 하락
→ 2015-08 판교점 개점 (2015 CapEx 5,018억, 매출 대비 30%), 2016\~2018 아울렛 출점 (송도·동대문·가든파이브·대구)
→ 2017 사드 보복 → 중국 단체관광 급감, 2018-11 면세점 진출 후 2019 면세 적자 -742억
→ 2019말 83,100원 (PBR 0.46배) [계산]

(4) 2020\~2024-11: 코로나 → 따이궁·지누스 → 손상 연속 → 12년 최저
→ 2020 OPM 6.0% (12년 저점), 2021-02 더현대서울 개점
→ 2022-05 지누스 인수 (이전대가 8,890억), 2022-09 대전아울렛 화재
→ 2023-02-10 **인적분할(지주사 전환) 임시주총 부결** — 찬성 64.9%로 특별결의(출석 2/3) 미달 [IB토마토 2023-07-06] → 2023-08\~09 현대지에프홀딩스가 공개매수(현물출자 유상증자 방식)로 현대백화점 지분 확보, 2023-09-06 최대주주 변경 (36.08%) [DART 사업보고서(2025.12) I-2]
→ 2023 지누스 손상 2,583억 → 순손실, 2024 현대홈쇼핑 지분 처분 손실 2,990억 → 2년 연속 지배순손실
→ **2024-11-26 종가 43,500원 (일간 기준 최근 저점, 시총 약 0.98조, PBR 약 0.22배)** [Yahoo, 계산]

→ 2024-11-07 기업가치 제고 계획 공시 → 2024-11-14 자사주 773,628주 소각 [DART 사업보고서(2025.12) III-6]

→ 원/달러 1,380원대로 원화 강세 → 외국인 쇼핑 가격 매력 감소 우려, 지누스 1H26 영업손실 -567억 [MTN 2026-09-22]

| 면세점 | ㈜현대디에프 (100%) | 1.01조 | 23.2% | 2억 | 시내(무역센터점) + 인천공항(DF7·DF5·DF2) + 인터넷면세점. 직매입 상품 판매 → 순매출 ≈ 총매출 |

### ③ 사업부별 디테일

(1) 백화점 — 핵심 이익 엔진, 거래액은 정체·마진은 개선
→ 총매출(거래액) 2022 7.25조 → 2023 7.34조 → 2024 7.19조 → 2025 7.10조 (3년 연속 감소), 9M26 5.45조 (+6.3%) [DART 부문정보, 계산]
→ 순매출은 2.29조(2022) → 2.44조(2025)로 증가, OPM 16.6%(2022) → 16.1%(2025) → 9M26 19.0% — 거래액보다 수수료율·직매입 믹스·비용 효율이 이익을 견인
→ 시장점유율 23.4% (2025, 통계청 기준) — 구 기준(빅3 백화점 매출 대비) 27\~29% (2017\~2022) [DART 사업보고서 II-7, 기준 변경으로 직접 비교 불가]
→ 핵심 점포: 판교점(최단기 연 거래액 2조) [이투데이 2026-02-11], 더현대서울(2021-02 개점, 외국인 매출 비중 약 20%) [머니투데이 2026-08-05], 무역센터점, 압구정본점
→ 점포 자산: 백화점·면세 사업장 장부가 4.74조 (토지 2.33조 + 건물 2.41조), 임차 점포는 더현대서울·가든파이브·동대문/대구 아울렛·커넥트현대 청주 등 [DART 분기보고서(2026.09) II-3]

(2) 면세점 — 따이궁 의존 탈피 → 공항 중심 흑자 전환
→ 순매출 2019 3,688억 → 2022 2.26조 (따이궁 대량 매출, OPM -2.9%) → 2023 0.998조 (-55.8%, 저마진 따이궁 축소) → 2025 1.01조 [DART 부문정보]
→ 공항: 2020-09 인천공항 DF7 → 2023-07 DF5 → 2026-04 DF2 추가. 시내점은 동대문점 종료(2025-07)로 무역센터점 1곳 [DART 분기보고서(2026.09) II-1]
→ 2019\~2024 6년 연속 적자 후 2025 +2억 → 9M26 +128억 (OPM 1.4%)

(3) 지누스 — 인수 후 4년, 손상과 구조조정
→ 매출(부문, 지누스 연결 기준): 2023 9,523억 → 2024 9,204억 → 2025 9,132억 → 9M26 5,123억 (-29.0%) [DART 부문정보]
→ 제품 믹스: Mattress 64.3% / Non-Mattress 35.5% (9M26). 매트리스 수출 평균단가 $96.8(2024) → $78.3(2025) → $74.5(9M26) [DART 분기보고서(2026.09) II-2]
→ 생산: 인도네시아(매트리스 CAPA 3,518천개, 가동률 68.9%)·중국·캄보디아(2025-08 가동). 미국 공장 2025-11 생산 중단 [DART 분기보고서(2026.09) II-3]
→ 미국 반덤핑: 인도네시아산 매트리스 AD 관세 최종 판정 2.22% → CIT 재심 명령 → 상무부 재심 결과 0.00% (2025-02 CIT 판결) [DART 사업보고서(2025.12) 연결 주석 우발부채]
→ 손상: 2022 무형자산 360억, 2023 무형자산(영업권) 2,583억, 2025 무형자산 2,056억 (가구 제조 부문 회수가능액 미달) [DART 사업보고서 연결 주석 27]

(4) 기타 — 부동산·관계기업
→ 현대홈쇼핑 지분(1,896,500주): 2024-04 공개매수 참여 1,015,148주 매각, 잔여 881,352주 매각예정 분류 → 2024 관계기업투자주식처분손실 1,207억 + 매각예정비유동자산손상 1,783억, 2025 처분 [DART 반기보고서(2026.06) I, 사업보고서(2024.12)·(2025.12) 연결 주석 27]
→ 현대쇼핑(100%, 부동산 임대), 한무쇼핑(충청점·김포아울렛 등 운영 — 2026-3Q 보통주 일부를 상환우선주·우선주로 전환, 상환우선주부채 492억 인식) [DART 분기보고서(2026.09) 연결 주석 1]

→ 백화점 = 명품·패션 소비 경기 민감. 원화 강세 시 외국인 쇼핑 매력 감소 (2026-07\~09 주가 급락 요인) [MTN 2026-09-22]
(3) 면세 — 업황·임차료

(5) 사고·소송
→ 2022-09 대전아울렛 화재 (재해손실 751억, 보험 624억) [DART 사업보고서(2023.12)]. 연결 피소 7건·소송가액 35억 (지누스 제외, 2025말) [DART 사업보고서(2025.12)]

→ 최대주주 43.95% + 자사주 소각으로 유통주식 감소 — 2023 인적분할 부결 사례처럼 주주가치 이슈가 주가 변동 요인
