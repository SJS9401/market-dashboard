## 1. 기업 분류

- **Primary 분류: 지속성장 — 저성장 방어형 (인프라형 종합물류)** — 택배·계약물류(CL)는 계약·네트워크 기반 반복 매출, 연결 OPM 12년 2.6\~4.4% 좁은 박스. 매출 성장은 M&A(2016\~2018)와 코로나 택배 특수(2020\~2021)로 계단식, 2022 이후 연 +0\~4%대
- **Secondary 노트: ① 글로벌 포워딩 운임 사이클 노출 (매출 비중 35%, OPM 1\~2%) ② 택배 점유율 경쟁(쿠팡 CLS) 이벤트 드리븐** — 2025-11 쿠팡 개인정보 유출 사태 이후 '탈쿠팡' 물량 기대로 주가 2026-02 145,700원까지 급등 후 실적 미스·규제 완화 지연으로 원위치 [서울경제 2025-12-04, 아시아경제 2026-02-11, 더팩트 2026-06-11]

### ② 산업 분류

- 산업: **종합물류 (3PL·택배·포워딩·항만하역) + 건설(물류센터 시공)**
- DART 업종: 493 도로화물 운송업 [OpenDART company.json] / KRX 운수창고업
- 워치리스트 섹터: **운송** / 서브섹터: **물류** (CJ대한통운 단독)
- 시장 지위: 택배 집화량 점유율 **43.4% (2025, 통합물류협회 가맹사 시장 37.26억 Box 중 16.18억 Box)** [DART 사업보고서(2025.12) II] — 단, 이 '시장'에는 쿠팡 CLS 자체배송(로켓배송)이 빠져 있음. 쿠팡 포함 기준으로는 **쿠팡 CLS 37.6% vs CJ대한통운 27.6%로 2위** (2024말, 메리츠증권 리서치 [IB토마토 2025-10-27]) / 항만하역 선석 보유·순수 Bulk 기준 국내 1위 [DART]

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준**: 2025 부문 매출 글로벌 4.36조(35.5%) > O-NE(택배·이커머스) 3.75조(30.5%) > CL 3.37조(27.5%) > 건설 0.81조(6.6%) [IR 4Q25 부문표, DART 사업보고서(2025.12)]. 매출 1위는 글로벌이지만 OPM 2.1%로 이익 기여는 작음
(2) **영업이익 비중 sub-rule**: 2025 부문 OP — O-NE 2,046억(40.3%) · CL 1,877억(36.9%) · 글로벌 907억(17.9%) · 건설 251억(4.9%). **국내 택배+CL = 이익의 77%** → 분류는 국내 인프라형 물류(반복 매출)가 결정 → **지속성장(저성장 방어형)**
(3) **Boundary case 처리**:
→ **글로벌(포워딩+해외CL)**: 2022 해상운임 급등기 매출 5.07조 → 2023 4.21조(-17%) [IR] — 매출은 운임 사이클형이지만 OPM은 0.9\~2.1% 박스라 연결 이익을 흔들지 못함 → Secondary 노출로만 기록
→ **택배 경쟁 구도**: 쿠팡 CLS 자체배송 확대로 협회 기준 점유율 50.1%(2020) → 43.4%(2025) 하락, ASP 2024\~2026 YoY -1\~-4% [IR] — 저성장 방어형 내부의 '점유율 방어 비용' 리스크
→ **건설**: 매출 6\~8%, OP 5% 미만. 물류센터·데이터센터 시공 — 분류 영향 없음
→ 결론: **Primary 지속성장(저성장 방어형) + Secondary(포워딩 운임 사이클·택배 경쟁 이벤트)**
(4) **피어 대비**:
→ **글로벌 3PL·포워더**: DHL Group·Kuehne+Nagel·UPS — 포워딩/특송 비중이 높고 운임 사이클이 이익을 크게 흔듦. CJ대한통운은 국내 택배·CL 비중이 높아 이익 변동성이 상대적으로 작음 (이번 버전은 피어 수치 비교 미수행 ⚠️)
→ **아시아 택배 피어**: SF Express(중국)·Yamato(일본) — 자국 택배 1위 + 이커머스 의존이라는 구조가 유사. Yamato는 아마존·자체배송 확대로 물량 이탈을 겪은 선례 (정성 비교, 수치 미검증 ⚠️)
→ **국내 피어**: 한진(협회 기준 점유율 2위권), 롯데글로벌로지스(10.3%, 비상장) [IB토마토 2025-10-27, 메리츠 2024말 기준 한진 9.7%·로젠 5.3%]
→ **운송 섹터 내 위치**: 해운(HMM·팬오션)·항공(대한항공·제주항공)이 '운임 사이클' 분류인 반면, CJ대한통운은 운송 섹터 유일의 **비사이클(방어형)** 종목 — 섹터 리뷰 시 경기 민감도 대조군

### ④ 적정 밸류에이션 방법

- **1순위: EV/EBITDA (리스 포함 일관 기준)** — 리스부채 1.78조(3Q26) 규모가 커서 PER·PBR만으로는 자본구조 차이를 놓침. IFRS16 이후 EBITDA에 사용권자산 상각이 포함되므로 EV에도 리스부채를 넣어 분자·분모를 일치시킴
→ 현재 **4.9배** (EV 5.67조 / LTM EBITDA 1.16조) [계산, 정의는 ④-1]
→ 연말 추이 (같은 정의): 2019 9.6배 → 2020 9.1배 → 2021 7.2배 → 2022 6.1배 → 2023 5.9배 → 2024 4.7배 → 2025 5.2배 — **2024 이후 역사적 저점권**
- **2순위: PER** — 이익 변동성이 작아 PER이 의미 있음. 현재 **7.3배** (시총 1.58조 / LTM 연결 순이익 2,156억) [계산]. 연말 PER은 2014\~2021 30\~100배(합병·M&A 후 순이익 미미) → 2022 이후 7.8\~12.9배로 정상화
- **3순위(하방 체크): PBR** — 현재 **0.38배** (지배지분 4.11조 기준) / **0.43배** (지배지분 − 신종자본증권 3,989억 = 보통주 자본 기준) [계산]. 연말 PBR 2014 2.00배 → 2024 0.49배 → 2025 0.52배 — 역사적 최저 구간. 미래에셋증권은 2026-06 'PBR 0.5배 저평가'를 매수 논거로 제시 [더팩트 2026-06-11]
- **배당은 보조 지표**: DPS 800원 (2024·2025) → 배당수익률 **1.2%** (69,100원 기준) [계산]. 2014\~2021 무배당, 2022 배당 재개 — 주주환원 매력은 통신·금융 대비 낮음
- **왜 PBR 1순위가 아닌가**: 자산 대부분이 영업용 인프라(물류센터·터미널·항만)와 영업권 7,204억(2025)이라 청산가치형 PBR이 이익 체력을 반영하지 못함. ROE 6% 안팎(2023\~2025)이 PBR 저평가의 근본 원인

| 현금및현금성자산 | 0.378조 | 연결 BS (단기금융상품 제외 — IR '현금자산+단기금융자산' 5,246억과 다름) |
| 비지배지분 | 0.211조 | 연결 BS |
| **EV** | **5.667조** | 시총 + 차입금 + 리스부채 − 현금성자산 + 비지배지분 (신종자본증권 3,989억은 자본 계정이므로 EV에 미가산 — 부채로 볼 경우 EV/EBITDA 5.2배) |
| **EV/EBITDA (LTM)** | **4.9배** | 리스 포함 일관 기준 |
| **PER (LTM)** | **7.3배** | 시총 / LTM 연결 당기순이익 2,156억 (비지배 포함) |
| **PBR** | **0.38배** / 0.43배 | 시총 / 3Q26 지배기업 소유주지분 4.107조 / (지배지분 − 신종자본증권) 3.708조 |
| **배당수익률** | **1.2%** | 2025 사업연도 DPS 800원 / 69,100원 |

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **택배(O-NE) 영업이익 2개 분기 연속 YoY +20% 이상 + 협회 기준 점유율 46%+ 회복** 시 → '탈쿠팡' 물량 구조적 전환 = 지속성장(성장 가속) 재분류 검토 (9M26 점유율 45.1% [DART 분기보고서(2026.09)])
- **연결 OPM 4개 분기 연속 3% 미만** 시 → 주7일 배송 비용 구조 고착 = 방어형 → 수익성 훼손형(Value Trap) 리스크 분류 추가 (1Q26 2.9%, 2Q26 3.0%, 3Q26 3.3%)
- **글로벌 매출 비중 40%+ 이면서 글로벌 OP 비중 30%+** 시 → Secondary(운임 사이클)를 Primary 혼합 분류로 격상
- **CJ그룹 지배구조 이벤트 (CJ제일제당 보유 지분 40.16% 매각·분할·합병)** 시 → 경영권 프리미엄 반영 밸류에이션 프레임 재설정
- **쿠팡의 3PL(외부 화주) 택배 확대 또는 새벽배송 규제(유통산업발전법) 완화 확정** 시 → 경쟁 구도 재평가

### ⑤ 주요 매출처

> DART: **'당기와 전기 중 연결기업 매출액의 10% 이상을 차지하는 외부고객은 없습니다'** [DART 사업보고서(2022.12)·(2025.12) 연결 주석] — 매출처 집중도 낮음

- 택배: 이커머스 플랫폼(네이버·신세계(G마켓·SSG)·알리익스프레스 등)·홈쇼핑·C2C(개인택배 '보내오네') — 화주별 비중 미공시 [아시아경제 2026-02-11, IR 3Q26]
- CL: CJ제일제당 등 계열 식품사 + CPG·제약·리테일 화주 (계열 매출 비중 미공시 ⚠️ — 다음 버전에 특수관계자 거래 주석 추출 필요)

### ④ 주요 리스크

(1) 쿠팡과의 택배 경쟁
→ 쿠팡 CLS 매출 7,685억(2022) → 3.83조(2024), 쿠팡 포함 점유율 CLS 37.6% vs CJ 27.6% (2024말) [IB토마토 2025-10-27]. 쿠팡 제외 3PL 택배 물량 증가율 2% vs 이커머스 거래액 +6% [서울경제 2025-12-04]
→ 매일 오네 대응 비용(허브 연장 약 50억, 재산세 약 30억) + ASP 8개 분기 연속 하락 [더팩트 2026-06-11, IR]
(2) 택배기사 노동 이슈·중대재해
→ 택배기사(약 2만3천명)는 위탁 개인사업자 — 과로·주5일제·사회적 합의 이행이 비용 변수. 2022-01\~03 택배노조 파업 [언론 — 이번 버전 원문 대조 미수행 ⚠️]. 중대재해처벌법 적용(2022-01\~) — 안전경영실 운영 [DART 임원 현황]
(3) 규제
→ 대형마트 새벽배송 규제 완화(유통산업발전법 개정) 지연 — 2026-02 기대 → 2026-06 국회 계류 [더팩트 2026-06-11]
(4) 포워딩 운임·지정학
→ 중동 지정학 리스크(2026 미국-이란 분쟁) → 포워딩 약세, 유가 상승(WTI $90, 2026-06) [IR 3Q26, 더팩트 2026-06-11]. 미국 관세 → 교역량 감소 경로 [서울경제 2025-12-04]
(5) 우발채무·소송
→ 리비아 대수로 공사: 완공보증금 USD 33.5백만 반환 중재 vs 리비아 측 하자·지체상금 반소 [DART 사업보고서(2025.12) II-6]. 금융보증부채 868억 (2025말) [동 II-5]
(6) 재무 레버리지
→ 차입금 + 리스부채 4.26조 (3Q26), 부채비율 144.9%, 영업이익/이자지급 3.3x (2025) — AA- 등급 유지 중이나 CapEx 재확대(2025 6,100억)로 순차입금 증가
