## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 사이클 (장기 수주형 저마진 조선 사이클) — 현재 "회복·마진 확장" 국면**

→ 2014~2025 12년 EBITDA margin 범위는 -0.6%(2015) ~ 7.8%(2013·2018)다. 진폭 8.4%p로 ±10%p cutoff에는 못 미치지만, **12년간 저점이 3회**(2015 Vard 해양 손실, 2019~2020 코로나·Vard 구조조정, 2022 원가 인플레·일회성)였다. 순이익은 12년 중 6개 연도가 적자다

→ 이익을 결정하는 것은 **수주 시점 가격 vs 건조 시점 원가**의 차이다. 크루즈·함정 모두 3~6년 장기 건조라, 원가 인플레(2022) 때는 마진이 무너지고 단가 상승기 수주분이 들어올 때(2024~2026) 마진이 오른다

**Secondary 노트: 지속성장 후보 (수중·함정) + 국영 방산 플랫폼**

→ **수중(Underwater)** 사업부(2025 신설)는 EBITDA margin 17~19%로 그룹 평균의 2배를 넘고, 9M26 매출이 +37.6% 늘었다. 2026-07 인수 4건이 종결되면 pro-forma 매출 €1.1B·EBITDA €220M으로 그룹 EBITDA의 약 30%가 된다

→ CMD 2026 목표: 2030년 **함정+수중 매출 비중 1/3**(2026년 24% → 2030년 32%), 그룹 EBITDA margin **~10%**

**4개 사업부 구조 (9M26, 내부거래 제거 전)**

→ **(1) 조선 Shipbuilding** — 매출 €4,556M (63%), EBITDA €335M, margin 7.3%. 크루즈 €3,477M + 함정(Defense) €1,039M + Ship Interiors €40M

→ **(2) 해양·특수선 Offshore & Specialized Vessels (Vard)** — 매출 €1,124M (16%), EBITDA €61M, margin 5.4%. 해상풍력 CSOV·어선·케이블선·연구선, 크루즈 블록 제작

→ **(3) 수중 Underwater** — 매출 €531M (7%), EBITDA €93M, margin 17.6%. U212 NFS 잠수함, WASS(어뢰·소나·대응체계, 2025-01 Leonardo에서 인수), Remazel

→ **(4) 설비·시스템·인프라 Equipment, Systems & Infrastructure (ESI)** — 매출 €1,037M (14%), EBITDA €70M, margin 6.7%. 전자·디지털, 기계 시스템(추진·안정기), 인프라(교량·철골)

**한국 조선 3사 + 글로벌 피어 이익률 비교 (3Q26, 각사 주 지표)**

→ **HD현대중공업** — OPM 15.6% [잠정] (매출 5조 7,536억원, 상선·엔진·함정)

→ **한화오션** — OPM 14.2% (매출 3조 4,139억원, 상선·해양·특수선)

→ **삼성중공업** — OPM 10.7% [잠정] (매출 3조 1,504억원, 상선·FLNG)

→ **Fincantieri** — **EBITDA margin 8.0%** (분기 단독 [계산], 매출 €2,025M) / EBIT margin 1H26 4.5%

→ (출처: 각사 2026-Q3 리뷰 — earnings-review 폴더. 지표 정의가 다르다: 한국 = K-IFRS 영업이익, Fincantieri = EBITDA(감가상각 전). EBIT 기준이면 격차는 약 2배다)

**한국 조선 3사와의 경쟁 지점**

→ **(1) 해외 호위함·함정 수출** — Fincantieri는 인도네시아 PPA/MPCS 2척(2025 매출 인식), 포르투갈 FREMM EVO 3척(정부 간 합의, 2026-07), 그리스 FREMM 이전 지원, 중동 수명주기 관리 프로그램을 진행한다. 한화오션(태국 호위함)·HD현대중공업(동남아·남미 함정 수출)과 같은 아시아·중동·남미 수출 시장에서 만난다 [판단]

→ **(2) 미 해군** — 자회사 FMG(Marinette)가 Constellation 호위함(2020 수주, 2025년 재편 — 보도상 2척으로 축소)과 LSM 상륙함(2026-04 첫 계약)을 맡는다. 한화(필리조선)·HD현대의 미 해군 MRO·신조 진출과 같은 시장이다. 미국 내 건조 요건(Jones Act·Buy American) 아래에서 FMG는 이미 현지 조선소를 가진 선발 주자다

→ **(3) 잠수함** — 이탈리아 U212 NFS 4척을 건조한다. 해외 잠수함 입찰(폴란드 Orka·캐나다 CPSP 등)에서는 한화오션·HD현대중공업(KSS-III 계열)과 TKMS(212CD)가 주요 경쟁자다. Fincantieri는 주로 TKMS 설계 기반 국내 건조와 WASS 어뢰·소나 공급자로 참여한다 [판단]

→ **(4) 해양·특수선 (Vard)** — Vard는 해상풍력 CSOV·케이블선 같은 중소형 특수선에 특화돼 있다. 한국 3사가 주력하는 FPSO·FLNG(대형 해양 플랜트)와는 겹치지 않는다. 겹치는 것은 일부 연구선·케이블선이며, 주된 경쟁자는 노르웨이·중국 조선소다 [판단]

→ **(5) 크루즈** — 한국 3사는 크루즈 건조 실적이 사실상 없다. Fincantieri는 Meyer Werft(독일·핀란드)·Chantiers de l'Atlantique(프랑스)와 함께 대형 크루즈 시장을 나눈다. 크루즈는 한국과 경쟁하지 않는 Fincantieri 고유 사업이다

(3) 정량적 분류 근거

→ **수주 레코드** — 2024년 €15.4B, 2025년 €20.3B(B/B 2.2x). 9M26은 €9.7B로 연간 목표 €11B의 88%이고, 서명 후 미발효 €12.3B는 별도다

→ **잔고** — Hard backlog €44.7B(9M26, 2025 매출의 4.9배), total backlog €72.6B(7.9배), 크루즈 인도 일정은 2036년(Princess 포함 2039년)까지다

→ **마진 확장** — 그룹 EBITDA margin은 2022년 3.0% → 2025년 7.4% → 9M26 7.7%다. 조선 margin은 9M26 7.3%(9M25 6.5%), 크루즈 자매선 비중은 30/36척이다

→ **재무 개선** — 조정 순차입금/EBITDA가 2024년 2.4x → 2025년 1.9x → 9M26 1.0x(증자 제외 1.7x)로 낮아졌다

(4) 산업 분류

→ **GICS** — Industrials — Aerospace & Defense (GuruFocus 분류) / 회사 자체 정의는 "high complexity shipbuilding"

→ **워치리스트 섹터** — 조선 (섹터 T2 주도 후보) / 서브섹터: 조선 글로벌

(5) 분류 결정 논리

(1) **가장 큰 사업부 기준** — 조선(크루즈+함정)이 매출의 63%, EBITDA의 65%(9M26 335/511)를 차지한다. 이익은 수주 가격과 원가의 차이로 정해진다 → 사이클

(2) **사이클 vs 지속성장** — margin 진폭(8.4%p)은 cutoff 미달이지만 12년 중 저점 3회, 순이익 적자 5개 연도로 단조 우상향이 아니다 → 사이클을 Primary로 둔다

(3) **Boundary case** — 수중(18% margin, +38%)과 함정(정부 장기 프로그램)은 지속성장 성격이다. 2030년 함정+수중 비중 1/3 목표가 달성되면 재분류 후보 → Secondary로 표기

(4) **글로벌 피어 대비** — 한국 3사(상선 중심, OPM 10~16%)보다 마진은 낮다. 대신 크루즈 독과점(3강)과 국영 방산 지위로 수주 가시성(잔고 7.9년)이 더 길다

(6) 적정 밸류에이션 방법

→ **1차 — EV/EBITDA**: 순이익이 작고 변동이 커서(D&A €313M·금융비용 €173M, 2025) EBITDA 기준이 적합하다. 현재 EV 약 €4.8B(시총 €4.09B + 조정 순차입금 €0.73B) / 2026G EBITDA 중간값 €720M = **약 6.7x** [계산]

→ **2차 — P/E (2027~2028)**: 2026G 순이익 중간값 €160M 기준 약 25.6x [계산]다. CMD 목표(2028 순이익 €220M, 2030 €500M)가 실현되면 P/E는 빠르게 낮아진다. 순이익 레버리지가 커서 Forward P/E 민감도가 높다

→ **3차 — SOTP**: 수중 사업부는 회사가 피어 EV/EBITDA를 적용해 "수중만으로 증분 EV €1.6~2.0B"를 제시했다(M&A 보도자료). 크루즈·함정은 유럽 방산·조선 피어 멀티플로 따로 본다

→ **PBR 보조** — 자본 €1,764M(9M26, 증자 반영) 기준 PBR 약 2.3x [계산]. 적자 이력이 있어 저점 판단용으로만 쓴다

(7) 분기 재평가 트리거 (**분류 변경 조건**)

→ ① **그룹 EBITDA margin 4개 분기 연속 9% 이상 + 순이익 흑자 유지** → 사이클 → **지속성장(마진 구조 변화)** 재검토 (CMD 2028 목표 8.5%, 2030 10%)

→ ② **함정+수중 매출 비중 30% 이상 도달** (9M26 약 21%: 함정 €1,039M + 수중 €531M / 제거 전 €7,248M [계산]) → 방산 플랫폼으로 Primary 재검토

→ ③ **크루즈 신규 발주 2개 분기 연속 0 + soft backlog 감소** → 크루즈 사이클 정점 통과 판단, 사이클 하강 국면으로 분류 갱신

③ 사업부별 개요·디테일 (매출 비중 큰 순서)

(1) **조선 — 크루즈 (9M26 매출 €3,477M, +9.1%)**

→ 대형 크루즈선·럭셔리 크루즈·익스페디션선을 건조한다. 주요 조선소는 Monfalcone·Marghera·Ancona·Sestri Ponente다. 고객은 Carnival 그룹(Princess·AIDA 등), NCLH(Norwegian·Oceania·Regent), Viking(누적 28척 파트너십), MSC Explora Journeys, TUI Cruises, Four Seasons, Crystal 등이다

→ 크루즈 수주잔고 36척 중 30척이 자매선이다. 2026~2030 CMD 계획상 크루즈 매출 CAGR 약 3%이고, 그룹 매출 비중은 2026년 46% → 2030년 37%로 낮아진다. 마진 동력은 물량이 아니라 단가(Revenue/GRT)와 반복 건조 효율이다

→ 인도 일정 (2026-09말 수주잔고 기준): 4Q26 2척, 2027년 5척, 2028년 6척, 2029년 4척, 2030년 5척, 이후 14척 (회사)

(2) **조선 — 함정 Defense (9M26 매출 €1,039M, -36.8%)**

→ 이탈리아 해군(FREMM·PPA·DDX 구축함·LHD·군수지원함), 해외(인도네시아 PPA, 카타르 등), 미 해군(FMG — Constellation·LSM)이 고객이다. Riva Trigoso·Muggiano가 주력 조선소이고, Leonardo와 JV(Orizzonte Sistemi Navali)로 이탈리아 해군 대형 프로그램을 수행한다

→ CMD 2026: 이탈리아 조선소의 수상함 생산능력을 2배로 늘리고, 함정 매출 CAGR 약 18%(2026~2030)를 목표로 한다. 2030년 그룹 매출의 24%가 목표다. 함정 신규 수주 목표는 약 €5B다

→ 9M26 감소는 2025년 1Q 인도네시아 PPA 2척 일괄 인식 기저와 Constellation 재편 때문이다. DDX 매출은 2027년부터 들어온다

(3) **해양·특수선 Offshore & Specialized Vessels — Vard (9M26 매출 €1,124M, +8.0%)**

→ 노르웨이 설계·루마니아(Tulcea·Braila) 선체·베트남 건조 체계를 갖췄다. 해상풍력 CSOV(9M26 9척 인도), 케이블선, 어선, 심해 연구선(Inkfish — Vard 사상 최대 수주), 크루즈 블록 제작을 맡는다. CMD 계획상 베트남 신규 조선소에 약 €250M을 투자한다

→ EBITDA margin은 2019년 -30.4%(구조조정)에서 2025년 5.3%, 9M26 5.4%로 회복했다. 회사는 "경쟁적 환경"이라고 표현했다. 2030년 목표 margin은 8%다

(4) **수중 Underwater (9M26 매출 €531M, +37.6%)**

→ U212 NFS 잠수함 4척(Muggiano, 2029년부터 매년 1척 인도), WASS(Black Shark·MU90 어뢰, 소나, 대응체계), Remazel(수중 장비 엔지니어링)로 구성된다. 사우디 MU90 어뢰 계약은 WASS 사상 최대다(미발효)

→ 2026-07 인수 4건: Next Geosolutions(해저 측량·시공 서비스), WSense(수중 IoT·통신), Graal Tech(무인 수중체), Defcomm(무인 수상정·통신). 인수 후 수중 pro-forma 2026년 매출 약 €1.1B·EBITDA 약 €220M, 2030년 매출 €1.4B·순이익 약 €130M이 목표다(M&A 보도자료)

(5) **설비·시스템·인프라 ESI (9M26 매출 €1,037M, +11.9%)**

→ 전자·디지털 제품(+8.6%, EBITDA +34.1%), 기계 시스템·부품(+19.7%, margin 11.1%), 인프라(교량·철골 구조물, +10.0%)의 3개 클러스터다. 매출의 약 40%가 그룹 내부 공급이다(9M26 내부 €412M / €1,037M [계산])
