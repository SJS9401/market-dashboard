## 1. 기업 분류

- **Primary 분류: 사이클** (Cyclical — 규제 전기요금 × 연료비·전력구입비(SMP) 스프레드 사이클)
- **Secondary 노트: 원전 함대 기반 안정 이익 일부 + 해외 원전 수출 옵션(꿈)** — 연결 이익에서 한수원(원자력) 비중이 커질수록 변동성이 줄어드는 구조. 해외 원전(UAE 바라카·체코 두코바니)은 아직 연결 이익 기여 미미

### ② 산업 분류

- 산업: **전력 유틸리티 (송·배전·판매 독점 + 발전 자회사 수직계열)** — 규제 산업이지만 요금 결정이 정치적이어서 연료비 사이클이 이익에 그대로 전달됨
- DART 업종: 35120 송전 및 배전업 / KRX 전기·가스업
- 워치리스트 섹터: **원전** / 서브섹터: **원전 운영** (핵심: 한국전력·Constellation, 확장: Vistra)
- 원전 노출: 100% 자회사 한국수력원자력(한수원) — 국내 원전 26.05GW 운영 [DART 사업보고서(2025.12) II-3], 한전 구입전력량의 31.6% (2025)

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: 전력판매부문(한전 본체) = 외부 매출의 95.7% [DART 사업보고서(2025.12) I-1]. 판매단가는 정부 인가 요금, 원가는 전력시장 SMP·연료비 → 매출은 안정, 이익은 연료비 사이클 → **사이클**
(2) **사이클 사업부 이익 비중 우선 sub-rule**: 2022 연결 영업손실 -32.66조 중 전력판매부문이 -33.91조 — 연결 이익 변동의 거의 전부가 판매부문 스프레드에서 발생. 원자력(한수원) 부문은 12년 중 적자 연도 없음 (2025 OP 2.48조, OPM 16.1%) → 이익 변동을 지배하는 것은 판매부문 → **사이클 유지**
(3) **Boundary case 처리**: 원자력부문 영업이익 비중은 2016 32% → 2025 18% (판매부문 회복으로 오히려 하락). 한수원 정산단가는 "정부규제가격"이라 한수원 이익이 커지면 판매부문 원가가 같이 오름 → 연결 기준으로는 원전 비중 상승 = 구입단가 하락 효과로만 작동. **원전은 사이클 진폭을 줄이는 완충재이지 이익의 성격을 바꾸지 않음** → Primary 사이클 + Secondary(원전 안정·수출 옵션) 병기
(4) **피어 대비 (원전 운영 서브섹터)**:
→ **Constellation (CEG)**: 원전 전력을 시장가격·장기 PPA로 파는 **비규제 발전사** — 전력가격이 오르면 이익 증가. 한국전력은 **규제 요금의 판매사** — 연료·구입전력비가 오르면 이익 감소. 두 회사의 사이클 방향은 반대이고, "원전 비중↑ = 이익 개선"만 공통 [CEG_기업개요.md ① 피어 비교와 동일 결론]
→ 원전 함대 규모는 비슷: CEG 원전 발전량 183TWh (2025, 10-K) vs 한수원 184.7TWh (2025, DART)
→ **Vistra**: 텍사스(ERCOT) 비규제 발전·소매 — CEG와 같은 쪽
→ 국내 원전 밸류체인 내: 한전기술(설계, 한전 51%)·한전KPS(정비, 한전 51%)는 **용역 수주형 지속성장**, 한국전력은 **요금×연료비 사이클** — 같은 그룹이라도 분류가 다름 (각 사 기업개요 참조: `한전기술_기업개요.md`, `한전KPS_기업개요.md`)

### ④ 적정 밸류에이션 방법

- **PBR (사이클 기준) 우선** — ROE가 -46.9%(2022) \~ +22.1%(2015)로 요동, 이익 기준 멀티플은 의미가 약함. 연말 PBR 밴드 (지배자본 기준, Yahoo 연말 종가 × 641.96M주 [계산]):
→ 저점 **0.22배 (2021)** · 0.25배 (2020) · 0.32\~0.35배 (2022\~2024)
→ 고점 **0.51배 (2014)** · 0.63배 (2025말) · **약 0.90배 (2026-01-21 고점, 2025말 지배자본 48.17조 기준)**
→ 현재 **0.35배** (2026-11-13 시총 17.75조 / 2Q26 지배자본 50.68조)
- **PER은 보조** — 2025 EPS 13,311원 기준 PER 2.1배. 사이클 정점 이익이라 저PER이 저평가 신호가 아님
- **요금·연료비 시나리오 (스프레드 감응도)가 실질적 valuation driver**: 판매량 549TWh(2025) 기준 판매-구입 스프레드 1원/kWh ≈ 영업이익 약 0.55조 [계산]
- **Constellation은 EV/EBITDA·PER (PPA 가시성)**, **한국전력은 PBR + 스프레드 시나리오** — 이익이 시장가격이 아니라 정부 요금 결정에 묶여 있기 때문

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **원가 연동형 요금제 실질 작동** (연료비조정단가 상하한 ±5원/kWh 확대 또는 분기 자동 조정 재개 — 2022-3Q 이후 18분기 연속 +5원 상한 고정 [MTN 2026-09-21]) 시 → 사이클 → 지속성장(규제 유틸리티) transition 후보
- **2개 연도 연속 OPM 8%+ 및 OPM range 5%p 이내** 시 → 사이클 진폭 축소로 Secondary 격상 검토
- **해외 원전 사업(한전 주계약자 또는 지분 투자) 이익이 연결 영업이익의 10%+** 시 → Secondary 꿈 → 실적 단계 격상
- **사채 발행 한도 특례 종료(2027말, 자본+적립금 5배 → 2배)** 전 요금 정상화 실패로 자본 확충(정부 출자 등) 발생 시 → 사이클 + 재무 리스크 분류 추가

## 2. 회사 개요

### ① 기본 사항

- **회사명**: 한국전력공사 (Korea Electric Power Corporation, KEPCO) / KRX 015760 (유가증권시장 1989-08-10 상장), NYSE ADR KEP
- **본사**: 전라남도 나주시 전력로 55 (빛가람동) — 2014년 서울 삼성동에서 이전
- **설립**: 1961-07-01 한국전력주식회사 발족 (조선전업·경성전기·남선전기 통합) → 1982-01-01 「한국전력공사법」에 따른 한국전력공사 [DART 사업보고서(2025.12) I-1]
- **지배구조**: 시장형 공기업 — 한국산업은행 32.90% + 대한민국정부 18.20% = 51.10% [DART 사업보고서(2025.12) VII]. 사채 원리금 상환은 정부가 보증할 수 있음 (한국전력공사법 제16조) [IR 2Q26]
- **사업 한 줄 정의**: 국내 송전·변전·배전망 100%와 전력 판매(구역전기사업자 제외)를 독점하고, 한수원(원전)·발전 5사(화력)·한전기술(설계)·한전KPS(정비)·한전원자력연료·한전KDN을 자회사로 둔 수직계열 전력 그룹. 연결 종속회사 169개 (상장 2: 한전기술·한전KPS) [DART 사업보고서(2025.12)]
- **고객·규모**: 25,434천 호, 2025 판매량 549,417GWh (산업용 51.0%), 평균 판매단가 170.4원/kWh [DART 사업보고서(2025.12) II-7, IV]
- **신용등급**: 국내 전력채 AAA (한기평·NICE), 외화 Moody's Aa2 / S&P AA / Fitch AA- [DART 사업보고서(2025.12) I-1]

### ③ 회사 주가 역사 ★ narrative 영역

![시가총액 20년](charts/한국전력_chart11_시가총액_20년.png)

(1) 2006\~2013: 고유가 속 요금 동결 — 박스권
→ 2006말 42,400원 → 2008 금융위기·유가 급등 구간 2008말 29,600원 [Yahoo 월말 종가]
→ 2008\~2012 연료비 상승을 요금에 반영하지 못해 적자 반복, 2012말 30,450원

(2) 2014\~2016: 저유가 + 삼성동 부지 매각 → 1차 대세 상승
→ 2014-09 삼성동 본사 부지 10.55조원에 현대차그룹 낙찰 (미검증 — 비공식 출처: 언론 보도, DART 2015 연결 CF상 유형자산처분이익 8.64조로 간접 확인)
→ 2015말 50,000원, **2016-05 월말 62,900원 (시총 약 40.4조)** — OPM 19.9% 정점 해와 겹침. 2015 DPS 3,100원
→ 2016-12 누진제 완화, 이후 원전 이용률 하락·SMP 반등으로 하락 전환

(3) 2017\~2023: 탈원전 정책 + 연료비 폭등 → 장기 하락
→ 2018 원전 이용률 65.9%(한수원 창사 이래 최저) → 적자 전환, 2018말 33,100원
→ 2021-01 연료비 연동제 도입했으나 정부가 조정 유보 → 2021말 22,100원
→ 2022 연간 영업손실 32.66조 (사상 최대), **2022-10 월말 16,750원 (시총 10.75조) — 20년 최저권**
→ 2023말 18,900원 — 연말 PBR 0.34배, 6년 연속 무배당 구간 (2018\~2023 결산)

(4) 2024\~2026-01: 스프레드 회복 + 원전 르네상스 → 사상 최고가
→ 2024 연간 흑자전환, 2024-10 산업용 요금 인상
→ 2025 영업이익 13.49조 (2016년 이후 최대), DPS 1,542원으로 배당 재개 확대 (2024 결산 213원)
→ 해외 원전 기대: 2025-01 Westinghouse 지재권 분쟁 종결, 2025-06 체코 두코바니 본계약(한수원)
→ **2026-01-21 종가 67,900원 / 장중 69,500원 — 사상 최고, 시총 43.59조** [Yahoo]

(5) 2026-02\~11: 연료비 재상승 + 해외 원전 차질 → 고점 대비 -59%
→ 2026-02 말 중동 분쟁으로 연료가격 상승, 3분기부터 실적 반영 [뉴스핌 2026-11-12]
→ 2Q26 영업이익 1.13조 (-47.2% YoY), 3Q26 1.64조 (-70.9% YoY)
→ 2026-10-29 한수원-대우건설·두산에너빌리티 컨소시엄 체코 원전 시공계약 협상 결렬 [아시아경제 2026-10-29]
→ 요금: 주택용 14분기·산업용 8분기 연속 동결, 연료비조정단가 18분기 연속 +5원 상한 [파이낸셜뉴스 2026-11-08]
→ **2026-11-13 27,650원 (하루 -9.8%, 시총 17.75조)** — 52주 최저

### ③ 사업부별 디테일

(1) 전력판매 — "규제 요금 vs 시장 원가"의 스프레드 사업
→ 구입: 2025 구입량 572,581GWh / 구입전력비 76.38조 — 한수원 181,051GWh (14.92조, 82.4원/kWh), 발전 5사 178,019GWh (26.19조), 기타(민간 IPP·PPA·DR) 213,509GWh (30.24조), 결산조정(RPS 등) 5.05조 [DART 사업보고서(2025.12) II-3]
→ 도매시장 구입 비중 95.2%. 가격 = 전력량가격(SMP·변동비·정산조정계수) + 용량가격 + 부가정산금
→ 요금 구조: 기본요금 + 전력량요금 + **연료비조정요금(±5.0원/kWh 범위)** + 기후환경요금 (2021-01 연료비 연동제 도입) [IR 2Q26]
→ 요금 결정: 한전이 개정안 제출 → 기후에너지환경부 검토·재정경제부 협의 → 전기위원회 심의 → 인가 [DART 사업보고서(2025.12) IV]
