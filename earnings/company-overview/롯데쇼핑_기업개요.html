## 1. 기업 분류

- **Primary 분류: 사이클(턴어라운드) — 성숙 오프라인 유통 + 자산(부동산) 가치주** — 매출은 2016(29.5조, 분할 전) → 2025(13.7조)로 축소. 구조 변화(2017 지주 분할로 롯데카드·코리아세븐 이탈, 2018 중국 마트 철수, 2020 이후 점포 구조조정)에 의한 축소가 대부분이고, 동일 구조(2018\~2025)에서도 매출 CAGR **-3.6%**. OPM은 1.3\~4.2%의 낮은 밴드에서 소비 경기·일회성(희망퇴직·통상임금)에 따라 출렁이고, 순이익은 **12년 중 8년 적자**(대규모 손상차손 반복)
- **Secondary 노트: 백화점 단일 엔진 + 외국인 관광 수요 옵션** — 2025 연결 영업이익 5,470억 중 백화점이 5,042억(**92%**) [IR 4Q25]. 9M26 백화점 영업이익 4,238억(+52.3%), 본점 외국인 매출 구성비 29%(+10%p, 3Q26) [IR 3Q26]. 2024 토지 재평가로 지배자본 15.2조 vs 시총 2.2조 → **PBR 0.15배** 저PBR 자산주 성격 (2026-11-02 한국거래소 저PBR 기업 151곳에 포함 [MTN 2026-11-03])

### ② 산업 분류

- 산업: **종합 오프라인 유통 (백화점·대형마트·기업형슈퍼) + 전문점(가전 양판 하이마트) + TV홈쇼핑 + 영화관(컬처웍스) + 이커머스(롯데ON)** — 국내 대형 유통 3사(롯데·신세계·현대) 중 매출 기준 최대, 해외는 베트남·인도네시아
- DART 업종: 47111 백화점 [OpenDART 기업개황] / 사업보고서 보고부문 8개: 백화점·할인점·전자제품전문점·슈퍼·홈쇼핑·영화상영업·이커머스·기타 [DART 분기보고서(2023.09) 부문정보]
- 워치리스트 섹터: **여행·레저·유통** / 서브섹터: **유통** (2순위 섹터, 4Q26부터 리뷰)
- 시장 지위: **국내 백화점 시장점유율 31.5% (2025, 통계청·당사, 아울렛 제외)** — 2017 39.6% → 2022 33.8% → 2025 31.5%로 하락 [DART 사업보고서(2019.12)·(2022.12)·(2025.12) II]. 점포: 국내 백화점 30·아울렛 17·쇼핑몰 10, 할인점 112, 슈퍼 309 (직영 191+가맹 118), 해외 백화점 4·마트 64 (베트남 17·인니 47) (3Q26) [IR 3Q26 Appendix]

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: 할인점 5.47조 = 연결 매출의 **39.8%** (2025) [IR 4Q25]. 할인점 OPM -0.1% (2025) → 성숙·저마진·역성장(2022 5.90조 → 2025 5.47조) → **사이클/구조조정형**
(2) **이익 비중 sub-rule**: 영업이익의 **92% (2025)·82% (9M26)** 가 백화점 → 이익 성격은 백화점(고가 소비·명품·외국인 관광) 경기에 연동. 백화점 OPM은 12\~17% 밴드(2021 12.1% → 2025 15.1% → 9M26 16.5%)에서 소비심리·자산효과에 민감 → **사이클 유지** (고성장 아님: 백화점 순매출 2022 3.23조 → 2025 3.34조, 연 +1.1%)
(3) **Boundary case 처리 — 순이익 vs 영업이익**: 영업이익은 2018\~2025 연 2,076\~5,970억으로 흑자 유지였지만 연결 순이익은 같은 기간 8년 중 6년 적자. 원인은 ① 점포 손상차손(2019 1.37조, 2020 5,502억, 2021 5,595억, 2022 6,126억, 2023 2,258억, 2024 1.18조) ② 순이자비용(연 4,500억 안팎, 9M26 이자손익 -3,453억 [IR 3Q26]) → 영업이익의 대부분을 이자가 흡수. 이 구조 때문에 "실적 턴어라운드 = 영업이익 증가 + 손상 종료" 두 조건이 같이 충족되어야 함
(4) **국내 유통 피어 cross-ref**:
→ **신세계·현대백화점·이마트**: 같은 유통 서브섹터 피어 — 비교 수치는 `현대백화점_기업개요.md`·`이마트_기업개요.md`와 ④-1 유통 공통 비교 박스 참조 (신세계는 워치리스트 미편입 — 기업개요 없음). 백화점 점유율은 롯데 31.5%로 1위지만 2017 대비 -8.1%p로 하락 추세 (경쟁사 대형점·명품 중심 재편 대비 롯데 지방 중소형점 비중이 큼 — 회사 자료 근거 정성 판단)
→ 롯데쇼핑은 피어 중 유일하게 **해외 리테일(베트남·인니)과 가전 양판(하이마트)·영화관(컬처웍스)을 연결** — 사업 포트폴리오가 넓어 연결 OPM이 백화점 단독 피어보다 낮음
→ 글로벌: 일본 백화점(미쓰코시이세탄·다카시마야 등)도 인바운드 관광 의존 + 부동산 가치 PBR 1배 미만 구간이 길었던 비슷한 프레임 (정성 비교, 수치 미수집)

### ④ 적정 밸류에이션 방법

- **PBR(자산가치) + EV/EBITDA 우선, PER 보조**
→ 토지·건물 22.1조 (3Q26, IR 재무요약) — 2024-12 토지 재평가(장부가 +9.5조) 이후 지배자본 15.2조(3Q26). **PBR 0.145배** [계산: 시총 2.20조 / 3Q26 지배자본 15.20조]. 재평가 전 2023말 PBR 0.22배, 2024말 0.10배(재평가로 분모 증가) — 재평가 전후 PBR은 비교 불가
→ **EV/EBITDA 약 8.0배** [계산: 시총 2.20조 + 순차입금 8.38조(차입금및사채 9.80조 − 현금성자산 1.42조, 3Q26 DART, 리스 제외) + 비지배지분 1.75조 = 12.33조 / LTM EBITDA 1.55조(IR 재무요약 3Q26 열 15,464억 — 사용권자산 상각 포함 EBITDA)]. 리스부채(3.78조)를 넣으면 EV 16.11조 → 10.4배. 리스 포함/제외 정의에 따라 크게 달라짐 — 피어 비교는 같은 정의로
→ **PER 6.0배** [계산: 시총 2.20조 / LTM 지배순이익 3,692억 (4Q25 1,124억 + 9M26 2,568억)] — 단, 9M26에 투티엠 주식처분이익 726억(3Q26) 등 영업외 일회성 포함, 손상차손이 매년 4Q에 집중되는 패턴이라 PER 단독 사용 부적합
- **배당수익률 5.1%** [계산: 2025 DPS 4,000원 / 77,900원]. 밸류업(2024-10): 최소 DPS 3,500원 보장, 총주주환원율 약 30% → 35%, 중간배당 도입(2025 중간 1,200원·2026 중간 1,300원) [MTN 2026-11-03, IR 3Q26 배당현황]
- **PBR 밴드 (연말 종가 × 발행주식 / 지배자본 [계산])**: 2014 0.51배 → 2018 0.51배(분할 후 고점) → 2021 0.24배 → 2023 0.22배 → 2024 0.10배(재평가 후) → 2025 0.14배 → 현재 0.15배. 2026-06 고점(203,500원) 때도 PBR 약 0.38배 [계산]
- **피어 차별화**: 롯데쇼핑은 ① 영업이익보다 이자비용·손상이 순이익을 결정 ② 자산(토지 22조)이 시총의 10배 → 할인 요인은 "자산 수익률(ROA 0.2%)이 낮다는 것"이지 자산 부족이 아님. 재평가 트리거는 **ROE 개선(현재 0.3%)과 순차입금 감축**

→ **읽는 법**: ① **편의점 2강(BGF리테일·GS리테일)** = OPM 2\~3%대 좁은 밴드의 지속성장형 — BGF리테일은 순현금·ROE 15.6%로 PBR 1.65배 프리미엄, GS리테일은 멀티채널(수퍼·홈쇼핑) 구조조정 중이라 PBR 0.51배·ROE 1.3%. ② **백화점 중심(현대백화점·롯데쇼핑)** = 3Q26 OP +30%·+35%로 이익 개선이 가장 뚜렷, 둘 다 부동산 자산 대비 PBR 0.15\~0.42배의 자산가치 구간. 롯데쇼핑은 이익의 80\~90%가 백화점 집중·순차입금 8.4조가 부담. ③ **이마트** = 별도(할인점·트레이더스)는 3Q26 OP +46%로 회복했지만 스타벅스·G마켓 등 자회사 손실로 연결 OP -70%·LTM 적자 — PBR 0.15배로 5사 중 최저(롯데쇼핑과 공동).

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **연결 순이익 흑자 2년 연속 + 연간 손상차손 1,000억 미만** (2025 순이익 736억·4Q25 자산손상 약 1,269억 [IR 4Q25 이미지 OCR 판독 ⚠️], 9M26 순이익 3,009억) 시 → "구조조정 사이클 종료" 태그, PER 밸류에이션 병행 검토
- **백화점 외 사업부 영업이익 비중 30%+** (2025 8%, 9M26 18%) 시 → 백화점 단일 엔진 리스크 완화, Secondary 수정
- **할인점(국내) 연간 영업흑자 전환** (2025 국내 할인점 -566억, 9M26 -154억 [IR]) 시 → 그로서리 회복 → 매출 CAGR 플러스 전환 가능성 점검
- **순차입금(리스 제외) 7조 미만 또는 이자보상배율(영업이익/이자지급) 2배+** (현재 8.4조·1.0배) 시 → 재무 리스크 할인 축소
- **외국인 관광객 매출 의존 급변** (본점 외국인 매출 구성비 29%, 3Q26) — 중국 단체관광·환율 이벤트로 2개 분기 연속 기존점 성장률 마이너스 전환 시 → Secondary 하향

### ⑤ 주요 매출처

> DART 사업보고서: 매출처는 불특정 다수 개인 소비자 — 단일 고객 집중도 공시 없음. 매출 형태 = 상품매출(직매입)·특정매입수수료·임대수수료·기타(경영관리수수료 등)
→ 경영관리계약: 롯데역사·롯데물산·씨에스유통·한화역사의 백화점·쇼핑몰·슈퍼·마트를 위탁 운영하고 EBITDA의 10%(백화점·슈퍼)·9%(쇼핑몰) 등을 경영관리수수료(기타매출)로 수취 [DART 사업보고서(2025.12) II-6]
→ 브랜드 사용료: 롯데지주에 (매출 − 광고선전비)의 0.2% 지급 [DART 사업보고서(2025.12) II-6]
→ 외국인 관광객: 본점 외국인 매출 구성비 29% (3Q26) — 사실상 가장 큰 "고객 집단 변수" [IR 3Q26]
