# Unitree (宇树科技, 688836) 기업 개요 (v1.0 — 휴머노이드 완성체, 휴머노이드·사족보행 로봇 출하량 글로벌 1위 상장사)
> **Fact verify cutoff**: 2026-11-14 (주가 11/13 종가 696.00위안, 시총 약 2,815억위안 [계산: 696.00 × 4.0446억주] — 每日经济新闻 10/28 보도 시총 2,815억위안(695.90위안)과 일치. 상장 후 장중 최고 1,100위안(2026-08-19), 최저 404.03위안(2026-10-15) [Yahoo Finance 52주 범위])

> **기준 메모**: ① 분기 단독 실적은 1Q25부터만 공시돼 2024년 이전 분기 YoY가 없다 ② 2Q25에 일회성 주식보상비용 3.49억위안(관리비)이 잡혀 2Q25 보고 이익이 적자다 — 이 문서의 "조정" 영업이익은 이 금액을 더한 값이다 [계산] ③ 이익 지표는 K-IFRS에 가깝게 매출 − 원가 − 세금 − 판매비 − 관리비 − 연구개발비로 다시 계산했다 [계산]. 중국식 营业利润(투자수익·기타수익 포함)과 차이는 분기 0.1억위안 안팎으로 작다

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (휴머노이드 상용화 초기 선도주) — 매출 2023 1.59억 → 2025 16.99억위안(2년 10.7배), 2024년 흑자 전환**

→ 2025년 매출 YoY +332.6%, 9M26 +55.7%. 2026년 들어 매출 증가율은 낮아졌고(고기저) 영업이익은 역성장 중이다 (2026 3분기 보고서, 상장공고서)

→ 매출총이익률 60.4%(2025) — 상장 휴머노이드 피어(UBTech 37.7%, 越疆 46.5%)보다 높다. 회사 설명: 전기모터·감속기·관절 모듈까지 전 스택을 자체 개발·조립해 원가가 낮다 (투자설명서)

**Secondary 노트: "꿈(밸류에이션 선반영)" 성격**

→ 시총 2,815억위안은 2025 매출의 166배, TTM 매출(23.5억위안 [계산])의 120배다. 숫자보다 "중국 A주 유일의 휴머노이드 선도 순수 플레이" 희소성이 가격을 정한다 [판단]

(3) 정량적 분류 근거

→ 매출 CAGR(2023~2025) +226.8% [계산] — 고성장 기준 충족
→ 영업이익률(조정) -26.0% → 40.2% → 22.5%(9M26): 2025년이 정점, 2026년은 연구개발(대형 모델·컴퓨팅) 투자로 이익률을 낮추는 국면 [판단]
→ 휴머노이드 판매 5대(2023) → 412대(2024) → 5,215대(2025), 평균단가 59.3 → 26.0 → 16.6만위안/대 — 물량은 늘고 단가는 내리는 보급형(G1) 확산 구조 (투자설명서)

(4) 산업 분류

→ 중국증감회 업종: 컴퓨터·통신·기타 전자설비 제조업 계열 과창판 (투자설명서상 "고성능 범용 로봇" 업종)
→ 워치리스트 섹터: 로봇 / 서브섹터: 휴머노이드 완성체 (산업 대분류: 모빌리티·에너지전환)

(5) 분류 결정 논리

→ 2025년 주영업수입의 51.8%가 휴머노이드, 41.6%가 사족보행 — 두 제품군이 매출의 93%다
→ 고객 대부분이 연구·교육 기관이라(2025 1~9월 휴머노이드 매출의 73.6% [보도 인용, 투자설명서 원출처]) 산업 현장 대량 도입 전 단계다. "사이클"이 아니라 "상용화 초기 고성장"으로 분류

(6) 적정 밸류에이션 방법

→ 1차 — PSR: 공모가 기준 35.9배(2025 매출, 발행 후 주식수 — 상장공고서), 현재 약 120배(TTM 매출 23.5억위안 [계산])
→ 2차 — PER: 공모가 기준 219.2배(2025 순이익, 발행 후) / 103.3배(2025 扣非) (상장공고서). 현재 TTM 扣非 5.09억위안 기준 약 553배 [계산]. 雷峰网(10/30)은 롤링 PER 약 465배로 보도 [보도 인용]
→ PBR 31.6배 [계산] (시총 / 지배주주 자본 89.10억위안, 2026-09 말)
→ 현재 이익으로는 설명되지 않는 가격이다. 분기 휴머노이드 출하·산업 고객 비중이 멀티플을 지지하는지 확인하는 방식이 맞다 [판단]

(7) 분기 재평가 트리거 (분류 변경 조건)

→ ① 분기 매출 YoY +30% 미만 2개 분기 연속 → 고성장 → 성장 둔화 재분류 검토
→ ② 조정 영업이익률 15% 미만 2개 분기 연속 → "투자 국면 장기화" 명시
→ ③ 휴머노이드 매출 중 산업 응용 비중 30% 이상 공시 → 상용화 단계 상향

## ② 회사 개요

① 기본 사항

→ 회사명: 宇树科技股份有限公司 (Unitree Robotics), 2016-08-26 설립, 본사 항저우. 2025-05-16 주식회사 전환
→ 창업자·실질지배자: 왕싱싱(王兴兴, 회장·CEO·핵심 기술인) — 직접 21.44% + 상하이위이(上海宇翼, 왕싱싱 지배) 9.85%. 특별의결권(AB주) 구조로 상장 후 의결권 65.31% 이하 (투자설명서, 3분기 보고서)
→ 사업 한 줄: 사족보행 로봇(Go2·B2·A2), 휴머노이드(G1·H1·H2·R1), 로봇 부품(로봇팔·4D 라이다·고성능 연산 모듈), 구현형 AI 모델(UnifoLM)을 자체 개발·생산
→ 규모(2025): 매출 16.99억위안, 총자산 32.09억위안, 임직원 516명(연구개발 184명, 35.7%)
→ IPO: 2026-08-19 과창판 상장, 공모가 150.80위안, 신주 4,044.6만주(발행 후 10%), 총조달 60.99억 / 순조달 59.17억위안. 공모 자금 용도 = 지능형 로봇 모델 연구개발, 로봇 본체 연구개발, 신형 로봇 제품 개발, 제조기지 건설 (상장공고서)

② 사업부별 개요 (매출 비중 순, 2025)

→ **휴머노이드 (51.8%)**: G1(중형, 2024-05 출시 — 판매 주력), H1·H2(풀사이즈), R1(보급형). 2025 1~9월 휴머노이드 매출 구성은 연구·교육 73.6%, 상업·소비(전시·공연 등) 17.4%, 산업 응용 9.0% [보도 인용, 투자설명서 원출처]
→ **사족보행 (41.6%)**: Go2(소비자·교육), B2·B2-W(산업 점검·소방·구조), A2. 2025년부터 京东 자영몰 위탁 판매
→ **로봇 부품 (6.2%)**: 로봇팔, 4D 라이다, 고성능 연산 모듈 — 외부 판매
→ **구현형 AI 모델**: UnifoLM 시리즈(세계 모델·VLA·WLA) 오픈소스. 매출 기여는 미미하나 2026년 연구개발비 증가의 주 원인 (3분기 보고서 "구현형 대형 모델 관련 연구개발과 컴퓨팅 투자 대폭 증가")
