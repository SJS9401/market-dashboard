## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 지속성장 (장기 수주잔고형 방산 조선 — 잔고/매출 8배)**

→ 수주잔고 **€20.1B (2026-06말)** = LTM 매출 €2.48B의 약 8.1배 [계산]. 잠수함 건조 3~10년, 수상함 3~4년 프로젝트라 매출이 잔고에서 수년에 걸쳐 인식된다
→ 매출 FY21/22 €1.70B → FY24/25 €2.17B (3년 CAGR +8.6% [계산]), 중기 목표 **매출 CAGR 약 10%**, FY25/26 가이던스 +10~12%

**Secondary 노트: 마진 턴어라운드 후반 (레거시 수주 소진)**

→ adj. EBIT 마진 **FY21/22 2.0% → FY24/25 6.0% (3배)**, 중기 목표 **>7%**. 2021년 7월 이전 저마진 레거시 수주가 2028년경까지 소진되고, 신규 수주는 수주 시점 총이익률이 레거시 대비 +7%p 높다 (Investor Presentation p.49)
→ 분할 전 thyssenkrupp 세그먼트 기준으로 보면 FY18/19 마진 0.0%·FY19/20 1.0%의 바닥에서 출발한 회복이다

**3개 사업부 구조 (9M FY25/26, 연결조정 전 사업부 합계 €2,021M 기준)**

→ **(1) 잠수함 (Submarines)** — 매출 €1,001M (50%), adj. EBIT €46M, 마진 4.6% — HDW 212CD·214·209·218SG, Kiel·Wismar 조선소. **잔고의 대부분**
→ **(2) Atlas Electronics** — 매출 €612M (30%), adj. EBIT €59M, 마진 9.6% — 소나·센서·전투체계·어뢰(SeaHake)·대어뢰(SeaSpider)·기뢰대항·무인체계. **이익 1위**
→ **(3) 수상함 (Surface Vessels)** — 매출 €408M (20%), adj. EBIT €30M, 마진 7.4% — MEKO 호위함(A-100/A-200/A-400), 쇄빙연구선 New Polarstern, Wismar·브라질 Itajai 조선소

(3) 분류 결정 논리
→ 수주는 대형 프로그램 하나(212CD, 218SG, A-200 DEU, CPSP)에 따라 연간 €1B~€9B로 움직이지만, 매출과 이익은 잔고 소진 속도(조선소 능력)에 묶여 있어 변동이 작다. 이 구조는 "사이클"보다 "잔고형 지속성장"에 가깝다
→ 다만 이익률 3배 개선의 대부분이 레거시 소진이라는 일회성 성격의 이동이라, 2028년 이후에는 "신규 수주 마진 자체"가 마진을 결정한다 → Secondary로 턴어라운드 후반을 둔다

(4) 산업 분류
→ GICS 성격: Industrials / Aerospace & Defense (해군 방산 조선)
→ 지수: MDAX (2025-12 편입, Prime Standard)
→ 워치리스트: 섹터 **조선 (T2 주도 후보)** / 서브섹터 **조선 글로벌** (중국선박공업·양쯔장조선·Seatrium·HII·Fincantieri와 함께 편입)

(5) 한국 조선 3사와의 경쟁 지점
→ **잠수함 수출 입찰이 정면 경쟁 지점이다.** 회사가 꼽은 잠수함 경쟁사는 Naval Group·한화오션·Fincantieri·Navantia·Saab Kockums·BAE, 수상함 경쟁사는 Naval Group·**HD현대**·Fincantieri·Navantia·Damen·BAE다 (Investor Presentation p.33)

→ 시사점 [판단]: 2026년 두 번의 대형 잠수함 입찰(캐나다·폴란드)에서 한화오션이 모두 졌다. TKMS의 무기는 NATO 상호운용성(독일·노르웨이와 같은 212CD 공동 함대)과 기존 설치 기반이고, 한국의 무기는 가격·납기·현지 생산이다. 남은 그리스·사우디에서 한국이 이기면 한국 특수선 내러티브가 회복되고, TKMS가 이기면 "유럽 잠수함 = TKMS" 구도가 굳어진다

(6) 적정 밸류에이션 방법
→ 1순위 **EV/adj. EBIT** — 순현금 + 잔고 선수금 구조라 EV 기준이 맞다. 시총 €4.76B − 순금융자산 €834M = EV 약 €3.93B (연금 €348M 포함 시 €4.28B) → **FY25/26E 컨센 adj. EBIT €163M 기준 24~26배, FY26/27E €201M 기준 20~21배** [계산]
→ 2순위 **EV/수주잔고** — EV/잔고 약 0.2배 [계산]. 대형 수주(CPSP) 반영 전후 비교용
→ PBR은 분할 재편으로 자본이 줄어(€1,031M) 4.6배 [계산]로 왜곡 — 보조 지표

(7) 분기 재평가 트리거 (분류 변경 조건)
→ ① adj. EBIT 마진 2개 회계연도 연속 7% 이상 + 잠수함 마진 7% 이상 → Secondary 턴어라운드 졸업
→ ② 캐나다 CPSP 본계약 + 잔고 €35B 이상 → 성장률 가정 상향 (매출 CAGR 10% → 15% 검토)
→ ③ 2개 분기 연속 adj. EBIT YoY 마이너스 또는 대형 프로젝트 원가 초과(충당금) → "지속성장" 재검토
