# 파마리서치 기업 개요 (v1.0 — 리쥬란(PN 스킨부스터) 플랫폼, 고성장 / 수출 주도 전환기)
> **Fact verify cutoff**: 2026-11-15 (재무는 3Q26 분기보고서 2026-11-13 공시 확정치, 주가·시가총액은 2026-11-13 종가 252,000원, 주주 구성은 2025 사업보고서 기준)

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (매출 12년 CAGR +32.8%, 상장 이후 매출 역성장 연도 0회)**

→ 매출 2013 178억 → 2025 5,363억 (30배). 2019 이후 7년 연속 +26% 이상 성장, 2025년 +53.2%로 오히려 가속

→ 3Q26 누적 매출 4,963억(+26.3% YoY), 영업이익 1,864억(+14.7%) — 성장은 지속되나 **이익 성장률이 매출 성장률을 하회하기 시작** (3Q26 단독 OP YoY +1.2%)

**Secondary 노트: 지속성장 전환 국면 (내수 의료기기 성숙 + 수출·화장품이 성장 축 교대)**

→ 성장 축 이동: 내수 의료기기(리쥬란) YoY 2Q25 +94% → 3Q26 0% (Flat) / 화장품 수출 3Q26 +92%, 의료기기 수출 +53%

→ 수출 비중 2019 21% → 2025 39% → 3Q26 48% (분기 최고)

→ OPM은 30%대 후반 박스권(2021~2026 분기 29~46%) — 경기순환형 이익 사이클보다는 **판관비(광고·인력) 투자 강도**에 따라 움직이는 구조 `[판단]`

**Entity 구조 (2026.09 기준)**

→ **(1) 의료기기 (3Q26 누적 2,633억, 53.1%)** — 리쥬란(PN 스킨부스터: 힐러·HB plus·i·Tone-up 등), HA필러 클레비엘·리쥬비엘, 무릎 관절강 주사 콘쥬란. 피부과·성형외과(리쥬란), 정형외과(콘쥬란)

→ **(2) 화장품 (1,643억, 33.1%)** — 리쥬란 코스메틱(힐러·클리닉·더마힐러 라인, 턴오버 앰플 등). 국내 올리브영·면세점, 해외 미국(아마존·세포라)·일본·중국·동남아

→ **(3) 의약품 (592억, 11.9%)** — PDRN 주사제(리쥬비넥스주·플라센텍스주), 면역증강제(자닥신), 보툴리눔 톡신 리엔톡스주(자회사 파마리서치바이오 생산)

→ **(4) 기타 (95억, 1.9%)** — 건강기능식품·용역·투자자회사(수인베스트먼트캐피탈) 수익 등

→ **연결종속회사 14개** — ㈜파마리서치바이오(46.0%, 톡신, 주요종속회사), ㈜수인베스트먼트캐피탈(70%, VC), ㈜파마리서치메디케어(100%, 판매), ㈜메디코슨(59.2%), ㈜플루토(70%), ㈜튜링바이오(30.4%), ㈜파마리서치에이치앤비(100%), Dr. J Skinclinic(미국 75%), Pharmaresearch USA(100%), PharmaResearch SG(100%) 및 손자회사 Alpha Omega Medical, 신성장 혁신 제1호 투자조합(100%), **PharmaResearch Frontier Inc.(2026.06 신설)**, **Cosmetic Group USA, LLC(2026 지분 100% 취득, 화장품 제조, 자산 390억)**

(4) 산업 분류

→ DART 업종코드 213 (기초 의약물질 및 생물학적 제제 제조업) — 실제 매출은 의료기기 53%, 화장품 33%로 **에스테틱(미용의료) 소비재** 성격

→ BT 워치리스트: 소비재 대분류 > 섹터 "뷰티" > 서브섹터 "미용의료" 핵심 종목

→ 국내 비교군: 클래시스(장비·소모품), 휴젤·메디톡스·대웅제약(톡신), 엘앤씨바이오(ECM 스킨부스터), 제테마·바임글로벌(쥬베룩) 등 `[일반 산업 지식, 출처 미확인]`

(5) 분류 결정 논리

→ 12년 CAGR 30%대 + 역성장 0회 + 2025년 성장 가속 = **고성장** 조건 충족

→ 다만 2026년 내수 의료기기 YoY가 +21%(1Q) → +6%(2Q) → 0%(3Q)로 꺾였고, 4Q25 실적 발표(2026.02) 후 주가가 장중 20% 넘게 하락 — 시장은 "내수 리쥬란 성숙" 여부를 핵심 쟁점으로 다루는 중 (머니투데이 2026-02-05)

→ 수출(유럽 MDR 2024.4Q 이후 26개국 추가 인허가, 미국 화장품 세포라 580개 매장 입점 2026.08)이 내수 둔화를 상쇄하는 한 Primary는 고성장 유지 `[판단]`

(6) 적정 밸류에이션 방법

| 우선순위 | 방법 | 현재 값 (2026-11-13) | 근거 |
|---|---|---|---|
| 1 | **PER (Forward)** | 추정 PER 15.4배 / Trailing 15.7배 | 순현금 기업, 이익 안정, 30%대 OPM |
| 2 | PEG | 이익 성장률 20%대 가정 시 0.6~0.8배 `[판단]` | 고성장주 비교 |
| 3 | PBR | 3.87배 (BPS 65,167원) | ROE 26%(2025) → PBR 보조지표 |
| 참고 | 컨센서스 목표주가 평균 | 427,600원 (투자의견 평균 4.00, 2026-11-12) | 네이버증권 |

→ 시가총액 2.62조(보통주 10,389,648주 × 252,000원) / RCPS 1,175,647주 전환 가정 시 2.91조

→ 2025.07 고점(종가 68만원, 시총 약 7.1조) 대비 -63%

(7) 분기 재평가 트리거

→ **내수 의료기기 YoY** (3Q26 0%) — 마이너스 전환 시 Secondary → Primary 격상(지속성장) 검토

→ **수출 비중 50% 돌파** 및 유럽(MDR 26개국)·중동(사우디 2026.09 런칭)·남미 의료기기 수출 YoY

→ **화장품 수출** (미국 세포라·올리브영 US, 중국 Chicmax MOU) — 3Q26 +92%가 유지되는지

→ **OPM 35% 하회** 여부 (광고선전비·해외 법인 비용)

→ **이익 품질**: 3Q26 순이익 302억(-41% YoY) — 금융원가 157억(외환·금융자산 평가손 등) 일회성 여부

**의료기기 (리쥬란)** — top-seller

→ PN(Polynucleotide)은 PDRN보다 사슬이 긴 DNA 분획으로 3D 겔 지지체를 형성해 섬유아세포 재생·주름 개선. 2014 출시로 국내 스킨부스터 시장을 연 원조 제품 (분기보고서 II. 사업의 내용)

→ 내수: 2025년 외국인 의료관광 수요(방한 외국인 환자 201만명, 피부과 65%) 덕에 2Q25 YoY +94%까지 가속 → 2026년 둔화(1Q +21% → 2Q +6% → 3Q 0%). 회사 IR은 3Q26 내수 의료기기를 "Flat"으로 표기

→ 수출: 3Q26 300억(+53% YoY). 지역 비중 3Q26 아시아 53% / 유럽·오세아니아 40% / 중동 6%. 리쥬란 인허가 **53개국** (2024.4Q 유럽 MDR 후 2026.1H에 유럽 26개국 추가, 사우디 1Q26·레바논 2Q26·아르헨티나 3Q26). 미국 FDA 의료기기 인허가는 IR 목록에 없음

→ 생산: 의료기기 2공장 가동률 110.6%(3Q26, 생산능력 540만관 대비 597만관), 1공장 83.7% — **CAPA가 병목에 근접** `[판단]`

→ 3Q26 누적 +75% YoY, 3Q26 단독 620억으로 의료기기(871억)에 근접. 수출 비중 69%

→ 지역 비중 3Q26 아시아 59% / 미주 38% / 유럽 3%. 2026.08 미국 세포라 580개 매장 입점(올리브영 K-Beauty Edit), 2026.09 중국 Chicmax(CCM) MOU, 국내 올리브영 어워즈 3관왕
