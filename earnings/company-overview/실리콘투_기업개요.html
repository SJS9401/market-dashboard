## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (K-뷰티 수출 구조 성장에 레버리지된 유통 플랫폼)**

→ 매출 2020 994억 → 2025 1조 1,163억 — **5년 11.2배, CAGR +62.2%**. 2023·2024 2년 연속 매출 2배(+107.5%, +101.7%)
→ 2026 3Q 누적 매출 1조 1,735억(IR) — 3개 분기 만에 2025 연간 매출을 넘었다. 3Q26 매출 4,244억(YoY +41.7%)으로 **분기 최대 7분기 연속 경신**
→ 영업이익 2020 80억 → 2025 2,054억 (CAGR +91%), OPM 8.1% → 18.4%

**Secondary 노트: 환율 민감 유통 (수출 98%) + 성장률 감속 국면**

→ 매출의 약 98%가 해외(3Q26 누적 국내 매출 250억 / 1조 1,735억, DART 주석). 원화 강세는 **매출총이익률과 영업외손익을 동시에** 깎는다 — 3Q26 GPM 28.7%(QoQ -3.3%p, "주요 통화 평균 6% 하락"), 영업외손실 -475억(외환차손·외화환산손실)으로 순이익 88억(YoY -85%) (IR 3Q26)
→ 매출 YoY는 +158%(1Q24) → +60%대(2025) → +42%(3Q26)로 감속, 3Q26 영업이익 YoY +10.4% — 고성장 → 지속성장 경계로 가는지가 2027년 쟁점 `[판단]`

**Entity 구조 (2026.09)**

→ **(1) (주)실리콘투** — 판교 본사, 경기 광주 자가 물류센터(AGV 자동화). 브랜드사에서 상품을 사서(매입) 해외 바이어에 파는 **재고 보유형 도매(CA)**가 매출의 94%
→ **(2) 연결 종속회사 21개(2026.09, 상장 0)** — 미국(STYLEKOREAN INC, 서·동부 창고), 폴란드(SKO, 유럽 물류 허브), 네덜란드·영국·프랑스·이탈리아·스페인·포르투갈·독일(MOIDA), 인도네시아·말레이시아·싱가포르·베트남, 러시아(Moida LLC), UAE 2개, 멕시코, 일본(2026 연결편입) 등. "15+ 해외 법인, 8개 글로벌 물류창고"(IR 1Q26)
→ 영업부문 **단일** — 부문별 영업이익 미공시. 공시 분해는 매출유형별(CA·PA·풀필먼트), 권역별(IR 8개 권역), 국가별(DART 주석)

(2) Summary Box (연결 6년 2020~2025 + 2026 3Q 누적)

| 지표 | 6년 평균 (2020~2025) | 정점 | 저점 | 2025년 | 2026 3Q 누적 |
|---|---|---|---|---|---|
| 매출 (억원) | 4,244 | **11,163 (2025)** | 994 (2020) | **11,163 (+61.4%)** | **11,736 (+44.8%)** |
| 영업이익 (억원) | 703 | **2,054 (2025)** | 80 (2020) | 2,054 (+49.3%) | 2,171 (+33.2%) |

→ 매출 CAGR(2020→2025) **+62.2%**, 영업이익 CAGR **+91%**

→ 2026 3Q 누적 YoY는 2025 1~3Q 대비(매출 8,104억, 영업이익 1,630억)

(5) 분류 결정 논리

→ 매출·이익이 2년 연속 2배, 이후에도 +40~60% 성장 → **고성장**
→ 다만 성장의 원천이 "K-뷰티 수출 수요 + 브랜드사가 아직 직접 진출하지 못한 지역"이라, 대형 브랜드사(구다이글로벌·APR 등)의 직진출·자체 유통 확대가 곧 이 회사의 성장 한계선이다 `[판단]`
→ 2027년 매출 YoY가 20%대로 내려가고 OPM이 16~18%에서 안정되면 **지속성장**으로 재분류 `[판단]`

(6) 적정 밸류에이션 방법

| 우선순위 | 방법 | 현재 값 (2026-11-13, 24,000원) | 비고 |
|---|---|---|---|
| 1 | PER (최근 4분기 순이익) | 시총(보통주) 1.57조 / 1,712억 = **약 9.2배** / RCS 포함 희석 1.73조 기준 **약 10.1배** | 최근 4분기 = 4Q25 358 + 1Q26 543 + 2Q26 723 + 3Q26 88 (3Q26 외환손실 반영) |
| 2 | EV/EBIT (최근 4분기 영업이익 2,595억) | EV 약 1.30조 / 2,595억 = **약 5.0배** `[판단: 희석 시총 1.73조 − (현금 4,475 + 단기금융 446 − 차입 657) ≈ 1.30조, 리스부채 제외]` | 순이익이 환율로 흔들려 영업이익 기준 병행 |
| 3 | PBR | 1.73조 / (자본 7,175 + RCS부채 2,619) = **약 1.8배** | 보통주·자본 기준은 2.2배 |

→ 셀사이드 컨센서스(2026E·2027E)는 미확보 — 확보 시 Forward PER로 교체

(7) 분기 재평가 트리거

→ (1) 매출 YoY가 30% 아래로 내려가는지 (3Q26 +41.7%, 7분기 연속 분기 최대지만 증가폭 축소)
→ (2) GPM 30% 회복 여부 — 원화 강세 구간에서 "판가 조정·거래조건 재협상"(IR 3Q26)이 효과를 내는지
→ (3) 북미 성장 지속 — 3Q26 북미 1,085억(YoY +49%, QoQ +24%), Ulta·Target 등 오프라인 리테일 진입
→ (4) 3Q26 RCS 3,000억 사용처 — "글로벌 인프라 확장 및 시장 점유율 확대"(IR) — 물류 허브·M&A 공시
→ (5) 주요 브랜드 이탈 — 구다이글로벌(조선미녀 등) 한성USA 인수(2026.02), 대형 브랜드 직진출 확대
→ (6) 재고 회전 — 재고자산 3,649억(3Q26, QoQ -19%)·영업현금흐름 정상화 여부
