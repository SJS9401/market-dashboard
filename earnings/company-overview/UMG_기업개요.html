## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 지속성장 (스트리밍 구독 기반 로열티 플랫폼)**

→ 매출 2014 €4.56bn → 2025 €12.51bn (11년 CAGR **+9.6%**), 이익률은 Vivendi EBITA 12% → UMG 조정 EBITDA 22%대로 구조적 상승

→ 매출의 절반 이상이 **DSP(Spotify·Apple·Amazon·YouTube·TME 등) 구독·스트리밍 정산** — 가입자 증가 + 요금 인상(Streaming 2.0 도매가 인상)이 성장의 두 축

**Secondary 노트: 소비 경기·이벤트 민감 일부 (피지컬·머천다이즈·싱크)**

→ 피지컬(€1.48bn, 2025)은 K-pop·Taylor Swift 등 팬덤 앨범 판매로 오히려 증가 중이나 히트 의존도 높음 / 머천다이즈(€0.81bn)는 투어 사이클 따라 변동, 마진 2%대

(3) Boundary case: 스트리밍 가입자 성장이 둔화되는 국면에서 성장이 **요금 인상(가격)** 의존으로 바뀌는 중 — 3Q26 유기적 구독 성장의 1/3 이상이 가격 효과(회사 설명). 가격 인상이 멈추면 성장률이 한 자릿수 초반으로 낮아질 수 있어 '지속성장 → 성숙 배당주' 전환 경계에 있음

(4) 피어 cross-reference: Spotify(플랫폼, 고성장·마진 확대 국면) / Tencent Music(중국 플랫폼, SVIP 업셀) / Warner Music(메이저 2위, 같은 지속성장) — UMG는 **콘텐츠 권리 보유자**라 플랫폼 요금 인상의 수혜를 로열티로 받는 위치

(4) 적정 밸류에이션 방법

- **PER (조정 EPS) 1순위** — 회사가 조정 순이익 50% 배당 정책을 쓰고 시장 컨센서스도 조정 EPS 기준. 2025 조정 희석 EPS €1.03 → 현재가 €17.63 기준 **약 17.1배** [계산]
- **EV/조정 EBITDA 보조** — 순차입금 €4.13bn(2026-06) 포함 EV 약 €35.5bn / LTM 조정 EBITDA €2,849m → **약 12.5배** [계산]
- **배당수익률 체크** — DPS €0.52 → **약 2.9%** [계산]
- 리포트 순이익(IFRS)은 Spotify·TME 등 상장 지분 평가손익이 크게 흔들어(2024 €2,086m → H1 2026 €222m) 밸류에이션에 쓰지 않음
- 피어: Spotify는 EV/매출·FCF 수익률, UMG는 PER·EV/EBITDA — 권리 보유자는 이익 안정성이 높아 PER이 맞음

(5) 분기 재평가 트리거 (분류 변경 조건)

- 유기적(Downtown 제외) 구독 매출 성장률이 **2개 분기 연속 5% 미만(cc)** → 지속성장 → 성숙(배당) 재분류 검토
- 조정 EBITDA 마진(Downtown 제외)이 **2개 분기 연속 21% 미만** → Streaming 2.0 효과 소진 여부 재평가
- 피지컬+머천 비중이 매출 **25% 이상**으로 상승 → Secondary(팬덤 이벤트 사이클) 격상

| 시점 | 사건 |
|---|---|
| 1934 | Decca Records (US) 설립 — UMG 계보 시작 |
| 1998 | Seagram이 PolyGram 인수, MCA Music과 합병해 **Universal Music Group** 출범 |
| 2006 | Vivendi 100% 지배 |
| 2012 | EMI Recorded Music 인수 (EU 조건부 승인) |
| 2020-03 | Tencent 컨소시엄 10% 인수 (EV €30bn), 2021-01 추가 10% |
| 2021-09 | Euronext Amsterdam 분리 상장, Pershing Square 10% 인수 |
| 2023-09 | 'Artist-centric' 로열티 모델(Streaming 2.0) Deezer와 첫 도입 |
| 2024-02\~05 | TikTok 라이선스 분쟁 → 재계약 |
| 2026-02-20 | **Downtown Music Holdings 인수 완료** (Virgin Music Group 산하, 연결 편입) |
| 2026-03 | 미국 상장 추진 보류 (이사회 "지금은 적기 아님") |
| 2026-04\~06 | Pershing 인수 제안 → 거절 → Pershing 완전 exit, 자사주 매입 €734m(2Q) |

② 사업부별 개요 (매출 비중 순)

- **Recorded Music (75.6%)** — 아티스트와 녹음 계약을 맺고 마스터를 소유, DSP 스트리밍·피지컬·싱크/라이선스로 수익화. 카탈로그(발매 3년+)가 매출의 과반 수준(업계 일반) → 안정성의 원천
- **Music Publishing (18.1%)** — UMPG. 작곡가 저작권(공연권·기계적 복제·디지털·싱크) 관리. 디지털이 61%
- **Merchandising & Other (6.5%)** — Bravado. 아티스트 굿즈·D2C·투어 MD. 마진 2\~5%로 낮음

③ 사업부별 디테일

- **구독 성장의 두 축**: (1) DSP 가입자 증가(Spotify 3Q26 프리미엄 3.06억, +9%) (2) **Streaming 2.0 도매가 인상** — Spotify·Amazon 등과 신규 계약, Apple Music과는 아직 미체결(3Q26 콜) [MBW]
- **피지컬 역주행**: 2025 €1,475m(+8.6%), 3Q26 +15% — 팬덤형 앨범(K-pop·일본 Mrs. GREEN APPLE·Taylor Swift) 다중 버전 판매
- **K-pop 연결**: Stray Kids(JYP-Republic Records 파트너십)가 3Q26 상위 판매 아티스트 [Music Week] / HYBE 아티스트의 해외 유통·Geffen 공동 프로젝트(KATSEYE) — **한국 기획사 해외 매출과 UMG 피지컬·구독이 같이 움직이는 구조**
- **Downtown**: 독립 아티스트·레이블 대상 유통·권리관리. 3Q26 매출 €195m, 마진 6.7% — 매출은 키우지만 그룹 마진을 약 0.9pp 희석
