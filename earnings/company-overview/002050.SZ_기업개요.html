# Sanhua 산화즈쿵 (三花智控, 002050) 기업 개요 (v1.0 — 로봇 부품 글로벌 피어 / 냉동·공조 밸브·자동차 열관리 부품 글로벌 상위권, Tesla Optimus 관절 액추에이터 개발사)
> **Fact verify cutoff**: 2026-11-14 (A주 2026-11-13 종가 **34.87위안**, H주 **HK$22.76** [Yahoo Finance v8], 시가총액 ≈ **1,393억위안** [계산: A주 3,731.48백만주 × 34.87 + H주 476.54백만주 × HK$22.76 × 0.8489(HKD/CNY, Yahoo 11/13)]. A주 장중 사상 최고 **60.77위안 (2026-01-19)** [Yahoo 일간] → 현재 -42.6% [계산]. H주 장중 최고 HK$41.36 (2026-01-02) → -45.0% [계산])

> **로봇 매출 미분리**: 시장은 Sanhua를 "Tesla Optimus 관절 액추에이터 조립품 공급사"로 보지만, 회사는 로봇 액추에이터를 "제품 개발 성과, 핵심 제품 배치 납품·라인 램프업 추진"으로만 서술하고 금액을 공개하지 않는다. 이 문서의 숫자는 모두 회사 전체(가전 부품 + 자동차 부품) 기준이다 → 로봇 부품 섹터 합산 시 트래킹 처리 권고

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 지속성장 (12년 매출 CAGR 15.2%, 매출 역성장 1회(2015 -6.1%), 조정 영업이익률 11.8~16.2%의 좁은 범위)**

→ 냉동·공조 밸브(4방향 밸브·전자팽창밸브 등)·펌프·열교환기를 세계 가전·공조 업체에, 신에너지차 열관리 부품(전자팽창밸브·전자수펌프·통합 모듈)을 세계 완성차·열관리 시스템 업체에 공급한다 (2025 연간 보고서)

→ 이익률이 안정적인 대신 성장률은 가전 경기·EV 판매에 따라 10~30%를 오간다. 2025년 순이익 +31.1% → 2026년 9M -5.4%

**Secondary 노트: 꿈(로봇 액추에이터) + 사이클(가전·자동차)**

→ 2023년 이후 주가는 로봇 액추에이터 기대가 멀티플을 끌었다 — 2026-01 고점 PER(2026E 동오 순이익 기준, A주가 × 총주식) 약 62배 → 현재 34배 [계산]

(3) 정량적 분류 근거

→ 매출 YoY 12년 범위 -6.1% ~ +33.2%, 조정 영업이익률 범위 11.8~16.2%(4.4%p) — 사이클 cutoff(±10%p) 미만 → 지속성장

→ 2021~2022년 매출 +32~33%는 신에너지차 열관리 확대 덕분이었다. 자동차 부품 매출 비중 2019년 14.6% → 2025년 40.1% [계산]

(4) 산업 분류

→ 회사 분류: 통용설비 제조업(通用设备制造业) (2026 반기 보고서). 심천거래소 자동차 제조 관련 업종 공시 지침 적용 (2025 연간 보고서)

→ 워치리스트 섹터: 로봇 / 서브섹터: 로봇 부품 (글로벌 피어 — 한국 현대모비스·로보티즈와 같은 서브섹터)

(5) 분류 결정 논리

→ 매출 100%가 가전·자동차 부품이다. 로봇은 매출이 공개되지 않아 분류를 바꾸지 않는다. 로봇 부품 섹터 편입 근거는 "Tesla Optimus 관절 액추에이터 개발" 보도와 회사의 "바이오닉 로봇 기전 액추에이터" 사업 서술이다

(6) 적정 밸류에이션 방법

→ 1차 — Forward PER: 2026E 34.0배 / 2027E 27.2배 (동오 순이익 40.94·51.14억위안 [보도 인용·계산]). 국원 2026E 46.89억 기준 29.7배 [계산]

→ 2차 — PBR 4.25배 [계산] (시총 1,393억 / 지배주주 자본 327.8억위안, 2026-09 말). ROE 2025 15.9% [계산, 평균 자본]

→ 로봇 옵션 가치: 본업 저성장(조정 영업이익 +8%) 대비 PER 30배대는 로봇·액랭 기대가 일부 남아 있다는 뜻이다 [판단]

(7) 분기 재평가 트리거 (분류 변경 조건)

→ ① 로봇 액추에이터 매출이 사업부로 분리 공시되고 전사 매출 5% 이상 → Secondary "꿈"을 "성장"으로 승격, 섹터 합산 핵심 편입

→ ② 냉동·공조 부품 매출 2개 반기 연속 역성장 → 가전 사이클 하강 반영(사이클 비중 확대)

→ ③ 조정 영업이익률 12% 미만 2개 분기 연속 → 지속성장 분류 재검토
