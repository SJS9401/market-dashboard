## 1. 기업 분류

- **Primary 분류: 지속성장(저성장) — 내수 필수소비 유통 플랫폼 (편의점 2강 과점)** — 연결 매출은 11번의 연간 변화 중 10번 증가(감소는 2020 코로나 -1.6%), CAGR +8.3% (2014 4.96조 → 2025 11.96조). 단 성장의 상당 부분은 M&A(2015 파르나스호텔 편입, 2021-07 GS홈쇼핑 흡수합병)와 GS25 출점(2014 8,290점 → 2024 18,112점)에서 나옴. OPM은 2.0\~3.6%의 얇고 좁은 밴드 — 이익 변동은 수요 사이클이 아니라 **출점 경쟁·인건비(최저임금)·자회사 손익·연결범위 변경**에서 발생
- **Secondary 노트: 구조조정 후 '본업 집중' 국면 + 수퍼 퀵커머스 성장 옵션** — 2023 프레시몰 철수·텐바이텐 매각, 2024-12 호텔(파르나스)·후레쉬미트 인적분할(GS피앤엘), 2025 인니 수퍼·퍼스프 중단·어바웃펫 매각. 3Q26 수퍼 매출 +14.9%, 퀵커머스 비중 10.1% [IR 3Q26]. 아직 연결 이익 성격을 바꿀 규모는 아님 (수퍼 = 2025 연결 영업이익의 9.3%)

### ② 산업 분류

- 산업: **편의점(GS25) + 기업형 수퍼마켓 SSM(GS THE FRESH) + TV·모바일 홈쇼핑(GS SHOP)** — 가맹(프랜차이즈) 중심의 근린 소매 유통. 부동산 개발·물류(GS네트웍스)·광고(지에스넷비전) 등은 공통 및 기타
- DART 업종: 47122 체인화 편의점 [OpenDART 기업개황]
- 워치리스트 섹터: **여행·레저·유통** / 서브섹터: **유통**
- 시장 지위: 2025년 말 GS25 점포 수는 국내 편의점 전체의 **약 33%** [DART 사업보고서(2025.12) II]. 편의점 4개사 점포 합계 53,821개(2025, -2.9%) [같은 보고서, 회사 추정치] — 점포수 첫 역성장 국면. CU(BGF리테일)와 1위 경쟁: 2025 편의점 매출 GS25 8조9,396억 vs CU 약 8조8,800억(추정) [CEO스코어데일리 2026-02-11]. GS리테일은 2025 IR부터 GS25 점포수 공시 중단 (2024말 18,112점이 마지막 공시치) [CEO스코어데일리 2026-02-11]

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: 편의점 매출 8.94조 = 2025 연결 매출의 **74.8%** [DART 사업보고서(2025.12) 사업부문별 재무정보, 계산]. 가맹점 기반 생활필수품 판매 → 수요는 경기에 둔감, 성장은 점포수 × 점당매출(기존점 신장률) 함수 → **지속성장(저성장)**
(2) **이익 비중 sub-rule**: 2025 사업부 영업이익 편의점 1,862억 (63.7%) · 홈쇼핑 930억 (31.8%) · 수퍼 271억 (9.3%) · 개발 -28억 · 공통및기타 -114억 [DART 사업보고서(2025.12), 계산]. 이익 1·2위 모두 성숙 사업 → **지속성장 유지**. 홈쇼핑은 OPM 8\~12%의 현금창출 사업이지만 TV 시청 감소로 취급액 역성장(4Q25 -12.6%, 3Q26 +1.1%) [IR 4Q25·3Q26]
(3) **Boundary case 처리 — 호텔·개발 등 비유통 자산**: 2015\~2024 연결 이익의 상당 부분이 파르나스호텔(2023 영업이익 1,028억 = 연결의 26%)에서 나왔으나 2024-12-01 인적분할로 GS피앤엘로 이관 [DART 사업보고서(2024.12)]. 분할 후 GS리테일은 "소매 유통업 및 부동산 개발업 중심의 기존 사업에 역량을 집중"하는 구조 [같은 보고서]. 2026부터 개발사업 부문도 보고부문 기준 미충족으로 공통 및 기타에 통합 [DART 분기보고서(2026.09) 연결 주석 4] → **순수 유통 기업으로 재분류 근거 강화**
(4) **유통 피어 cross-ref**:
→ **BGF리테일(CU)**: 같은 편의점 2강 — Primary 분류는 동일(지속성장)이 자연스러움. 차이는 GS리테일이 수퍼·홈쇼핑을 함께 보유한 멀티채널이라는 점. 비교 수치는 `BGF리테일_기업개요.md` 및 ④-1 유통 공통 비교 박스 참조
→ **이마트·롯데쇼핑**: 대형마트 중심 — 오프라인 대형 포맷 구조조정 국면으로 GS리테일(근린 소형 포맷)과 수요 경로가 다름. `이마트_기업개요.md`, `롯데쇼핑_기업개요.md` 참조
→ **현대백화점**: 백화점·면세 — 경기 민감도가 GS리테일보다 큼. `현대백화점_기업개요.md` 참조
→ 글로벌: Seven & i(일본, 세븐일레븐)·Lawson·FamilyMart 등 편의점 업태와 동일 군 (정성 비교, 수치 미수집)

### ④ 적정 밸류에이션 방법

- **PER(정상화 순이익) + PBR 보조, EV/EBITDA 참고**
→ 영업이익은 안정적(2.0\~3.6%)이나 **영업외 변동이 극심** — 관계기업 지분법손실(2025 -1,019억 — 요기요 운영사 등, 구성 ⚠️ 미검증)·투자자산 평가손실·중단영업으로 지배순이익이 2022 404억 → 2023 177억 → 2024 25억 → 2025 434억 [DART]. 연결 PER(LTM)은 왜곡이 커서 "영업이익 × (1−세율) + 정상 금융손익" 기반 정상화 PER가 현실적
→ 현재 **PER(LTM 지배순이익) 19.6배** [계산: 시총 1.72조 / LTM 지배순이익 875억 = 4Q25 -711억 + 9M26 1,586억]. 9M26 지배순이익 1,586억은 이미 2025 연간(434억)의 3.7배
→ **PBR 0.51배** [계산: 1.72조 / 3Q26 지배자본 3.40조] — 12년 밴드 고점 **2.31배 (2015)** → 저점 **0.43배 (2024)** [연말 주가 × 발행주식 / 지배자본, 계산]
→ **배당수익률 2.9%** [계산: 2025 DPS 600원 / 20,550원]. 배당성향(연결) 2025 115.4% — 별도 순이익 841억 기준으로는 약 60% [DART 배당에 관한 사항, 계산]
- **피어 차별화**: BGF리테일 대비 GS리테일은 ① 수퍼·홈쇼핑 멀티채널(편의점 비중 75%) ② 관계기업·투자자산(투자주식및금융자산 1.02조, 3Q26 IR) 손익 변동 ③ 리스부채 1.91조(3Q26)로 순차입 구조가 다름 → 같은 PER 배수 비교 시 영업외 항목 정상화 필수

→ **읽는 법**: ① **편의점 2강(BGF리테일·GS리테일)** = OPM 2\~3%대 좁은 밴드의 지속성장형 — BGF리테일은 순현금·ROE 15.6%로 PBR 1.65배 프리미엄, GS리테일은 멀티채널(수퍼·홈쇼핑) 구조조정 중이라 PBR 0.51배·ROE 1.3%. ② **백화점 중심(현대백화점·롯데쇼핑)** = 3Q26 OP +30%·+35%로 이익 개선이 가장 뚜렷, 둘 다 부동산 자산 대비 PBR 0.15\~0.42배의 자산가치 구간. 롯데쇼핑은 이익의 80\~90%가 백화점 집중·순차입금 8.4조가 부담. ③ **이마트** = 별도(할인점·트레이더스)는 3Q26 OP +46%로 회복했지만 스타벅스·G마켓 등 자회사 손실로 연결 OP -70%·LTM 적자 — PBR 0.15배로 5사 중 최저(롯데쇼핑과 공동).

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **GS25 기존점 신장률이 2개 분기 연속 마이너스** (현재 3Q26 +2.3%, 2Q26 +7.5% [IR]) + 편의점 OPM 연간 2% 미만 (2025 2.1%) 시 → "성숙·역성장" 태그 추가
- **수퍼 매출이 연결의 20%+ 또는 수퍼 OPM 4%+ 연간 지속** (현재 14.6%, 2025 OPM 1.6%; 3Q26 분기 4.5%) 시 → Secondary(퀵커머스 성장) 격상 검토
- **홈쇼핑 OPM 연간 7% 미만** (2025 8.9%, 2022 11.5%) 시 → 현금창출 사업 훼손, 이익 구성 재평가
- **추가 M&A·분할 등 연결범위 변경** (2015·2021·2024처럼) 발생 시 → 12년 비교 기준 재설정
- **편의점 규제 변화** (가맹사업법 개정·근접출점 제한·최저임금 급등(2018 16.4% 같은 두 자릿수)) 시 → 이익 안정성 재평가

### ③ 사업부별 디테일

(1) 편의점 (GS25) — 성숙기 진입, 점포에서 기존점·상품으로
→ 점포 순증 둔화: 2017 +1,701 → 2024 +722점 [IR, 계산]. 업계 전체 2025 -2.9% 역성장 [DART 2025 사업보고서 산업 현황]
→ 기존점 신장률 회복: 4Q24 +0.1% → 2Q26 +7.5% → 3Q26 +2.3% (고기저) [IR]
→ 신선강화점 1,074점(3Q26) — 일반점 대비 누계 매출 신장률 +64.5% [IR 3Q26]
→ 3Q26 영업이익 782억 (-69억 YoY) — "일부 상품의 일시적 손실 반영"으로 매출총이익 감소 [IR 3Q26]
→ 담배 매출 비중이 높고 담배는 저마진 → 담배 외 상품 비중 확대가 본사·가맹점 모두에 유리 [DART 2025 사업보고서 II]
(2) 수퍼 (GS THE FRESH) — 가맹 출점 + 퀵커머스로 성장 전환
→ 운영점 2021 341 → 2025 585 → 3Q26 608점, 가맹 비중 81% [IR, 계산]. 2026-08 업계 최초 가맹 500호점 [IR 3Q26]
→ 3Q26 매출 +14.9%, 기존점 +10.7%, 영업이익 239억 (+147억) — 매출총이익 증가 + 판관비율 개선 [IR 3Q26]
