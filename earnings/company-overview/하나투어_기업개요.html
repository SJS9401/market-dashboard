## 1. 기업 분류

- **Primary 분류: 사이클 — 외생 쇼크 민감형 경기소비재 (해외여행 수요 사이클)** — 매출은 해외여행 출국자수에 연동되고, 이익은 경기·환율·유가(유류할증료)·지정학·전염병 같은 외부 충격에 크게 흔들린다. 12년간 OPM은 10.5%(2014) → 0.8%(2019) → -316.2%(2021) → 9.8%(2025)로 출렁였고, 2020\~2022 코로나 3년 연속 영업적자(누적 -3,434억) 구간이 있다
- **Secondary 노트: 엔데믹 후 "자산 경량 + 순액 마진 + 주주환원" 체질 변화** — 면세점(SM면세점)·국내 호텔(마크호텔) 철수, 사옥 매각, 인력 2,736명(2018) → 1,337명(2025, 별도)으로 비용 구조를 바꿨다. 매출은 2018의 71%(2025 5,869억 vs 2018 8,283억)인데 영업이익은 2.3배(576억 vs 249억)
- **지배구조 특이사항**: 최대주주 **IMM PE(하모니아1호 유한회사 17.28%)** — 2020-02 제3자배정 유상증자로 진입. 2024-05 매각 주관사(씨티글로벌마켓증권) 선정 후 매각을 추진했으나 2026-07 잠정 중단·재검토, 신임 대표 조좌진 선임 [IB토마토 2025-12-16, 다음 2026-07-07]

### ② 산업 분류

- 산업: **여행알선(아웃바운드 패키지 홀세일 + 항공권·호텔 FIT) + 해외 현지 운영(일본 호텔·전세버스)** — 전국 협력여행사(소매대리점)와 온라인 채널에 상품을 공급하는 종합 여행 홀세일러
- DART 업종: 75210 여행사업 [OpenDART 기업개황] / 사업보고서 기준 "여행알선서비스업"
- 워치리스트 섹터: **여행·레저·유통** / 서브섹터: **면세·카지노·여행**
- 시장 지위: 9M26 하나투어 출국자 311.2만명 / 대한민국 총 출국자 2,067.7만명 = **점유율 15.05%** [DART 분기보고서(2026.09) II, 한국관광데이터랩], 국내 아웃바운드 여행사 1위 (회사 기재 "오랜 업력·해외 네트워크·브랜드 가치")

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: 여행부문 5,676억 = 부문 합계(6,213억, 부문간 포함)의 **91.4%** [DART 사업보고서(2025.12) 연결 주석 36 영업부문]. 여행 수요는 소득·환율·항공 공급·이벤트에 민감 → **사이클**
(2) **이익 비중 sub-rule**: 2025 부문 영업이익 여행 456억 / 호텔 83억 / 기타 47억 → **여행부문 77.7%** [DART 사업보고서(2025.12), 계산]. 호텔(일본 아레그록스 TM호텔) OPM 25.7%로 고마진이지만 매출 비중 5% → Primary 유지. 단, 본사·자회사 분리로 보면 **해외자회사(하나투어재팬 등) 영업이익 224억 = 연결의 39%** [IR Fact Sheet 3Q26 연결 손익요약(2), 2025 분기 합산 계산] — 일본 인바운드(외국인의 일본 여행) 수익원이 생각보다 크다
(3) **Boundary case — 지속성장 아님**: 2013\~2018 송출객 262.9만 → 587.8만명(CAGR +17.5%)으로 성장주처럼 보였지만, 2019 일본 불매에 송출객 -12.5%·OPM 0.8%로 꺾였고 2020 코로나로 매출 -86%. 2025 송출객 411.8만명은 아직 2018(신 기준 환산 전) 수준에 못 미친다 → **장기 성장 + 단기 쇼크 사이클**의 혼합. 쇼크 빈도가 높아 "지속성장" 분류는 부적합
(4) **국내 여행사 피어 + 글로벌 cross-ref**:
→ **모두투어·노랑풍선·참좋은여행** 등 국내 패키지 여행사는 같은 수요 사이클을 공유. 비교 수치는 같은 서브섹터 동시 작성 문서 참조 (main session 교차검증 대상)
→ 같은 서브섹터의 면세(호텔신라·현대백화점 면세 등)·카지노(파라다이스·GKL·롯데관광개발)는 **인바운드(외국인 방한)** 수혜, 하나투어는 **아웃바운드(내국인 출국)** 수혜 — 원화 약세·내수 둔화 시 방향이 반대로 갈 수 있음
→ 글로벌: Trip.com·Booking·Expedia 같은 OTA는 "플랫폼" 밸류(고마진·자산경량), 하나투어는 패키지 홀세일 + 대리점 유통이 중심이라 OTA 대비 저마진 (정성 비교, 수치 미수집)

### ④ 적정 밸류에이션 방법

- **PER (정상화 이익) 우선 + 순현금 조정 EV/EBIT 보조, 배당수익률 참고**
→ 현재 **PER 12.3배** [계산: 시총 4,752억 / LTM 지배순이익 385억(4Q25 40억 + 9M26 345억)]. 4Q25 지배순이익은 관계기업 ㈜꿈 자금보충약정 충당부채 약 187억·하나투어재팬 호텔 철거비 약 36억 일회성으로 눌림 [IR 4Q25] → 일회성 제외 시 PER은 더 낮음 (정량 조정 미수행)
→ **순현금 2,520억** [계산: 현금성자산 1,117억 + 단기금융상품 1,426억 − 차입금 23억, 3Q26, 리스부채 971억 제외]. 단 **관광수탁금 1,768억(고객에게 미리 받은 여행대금)** 이 현금의 상당 부분을 차지 → 수탁금을 부채로 차감하면 순현금은 752억
→ **EV/EBIT(LTM)**: 순현금 전액 차감 시 4.5배 / 수탁금 차감 보수 기준 7.7배 [계산: EV = 시총 4,752 + 비지배 233 − 순현금(2,520 또는 752), LTM 영업이익 547억]
→ **배당수익률 3.7%** [계산: 2025 DPS 1,200원 / 32,400원]. 배당정책: '25\~'27년 매년 연결 당기순이익의 30% 이상 배당 (2025-04 기업가치 제고 계획) [DART 사업보고서(2025.12) 배당에 관한 사항]
- **PBR은 부적합** — 자본(지배 1,457억, 3Q26)이 작고 특별배당·유증·적자로 크게 변해 PBR이 3\~12배를 오감. 현재 PBR 3.26배 [계산: 4,752 / 1,457]. ROE는 -108.9%(2020) \~ 47.2%(2024)
- **피어 차별화**: 국내 여행사 중 순현금·배당 여력이 가장 큰 편이고, 하나투어재팬(일본 상장 자회사, 53.98%) 지분 가치가 SOTP 변수 [DART 분기보고서(2026.09) 연결 주석 1, 하나투어재팬 시장가치는 2024말 710억(51.09% 보유분) — DART 사업보고서(2024.12) 별도 주석]
- **경영권 프리미엄 변수**: IMM PE 매각 재개 시 최대주주 지분(17.28%) + 창업주(박상환 6.76%·권희석 4.64%) 동반 매각 구조가 거론됨 [아시아경제 영문 2024-03-27 "Plan for Bulk Sale of Founder Shares According to Shareholders' Agreement" — 제목 기준, 본문 미대조]

#### ④-1 면세·카지노·여행 공통 비교 박스 (통합 검수 예정)

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **기획상품(패키지) 이용객 YoY 감소가 4개 분기 연속** (현재 2Q26 -2% → 3Q26 -11%, 2개 분기 연속 [IR 3Q26]) 시 → "OTA·FIT 잠식에 의한 구조적 쇠퇴" 태그 검토 (사이클 → 구조 변화)
- **연간 OPM 10%+ 2년 연속** (2025 9.8%) 시 → Secondary "플랫폼형 수익성" 격상 검토 (온라인 판매비중 고객수 50%·GMV 46% [IR 3Q26])
- **IMM PE 지분 매각 계약(SPA) 체결** 시 → 지배구조·배당정책 재평가 (경영권 프리미엄·새 최대주주의 자본정책)
- **외생 쇼크(전염병·전쟁·항공 대란)로 분기 송출객 -30% YoY 이상** 시 → 쇼크 국면 태그 (2020-1Q 송출객 -60% 사례)

### ④ 주요 리스크

(1) 외생 쇼크 (최대 변수)
→ 회사 스스로 "관광산업은 정치·외교·사회문화 이슈·경기·질병 등 다양한 요인에 크게 영향" [DART 분기보고서(2026.09) II-1]. 사례: 2017 사드, 2019 일본 불매(송출객 -12.5%), 2020\~2022 코로나(매출 -86%)
→ 2026: 유류할증료 인상·중동 정세로 2Q26·3Q26 기획상품 수요 둔화 [IR 3Q26, 디지털데일리 2026-08-05]
(2) 환율
→ 해외 여행경비 지급(CNY·USD·EUR·JPY 등) 환위험 — 원화 지급 계약·지급기간 단축으로 관리. USD 5% 상승 시 세전손익 -1.3억 수준으로 직접 민감도는 작음 [DART 분기보고서(2026.09) II-5]. 간접적으로 원화 약세 → 해외여행 수요 둔화
(3) 경쟁·채널 변화
→ 글로벌 OTA·국내 플랫폼과의 FIT 경쟁, 대리점 중심 패키지 수요의 자유여행 전환 — 3Q26 기획상품 -11% vs FIT +15% [IR 3Q26]
(4) 지배구조·오버행
→ IMM PE 지분(17.28%) 매각 불확실성 — 매각 지연·가격 괴리 [IB토마토 2025-12-16], 매각 시 창업주 지분 동반 처분 가능성 [아시아경제 영문 2024-03-27 제목 기준]
→ 신임 대표의 前 직장 금융당국 중징계 이력 [다음 2026-07-07]
(5) 우발채무·관계사
→ 관계기업 ㈜꿈 자금보충약정 이행으로 충당부채 약 187억 (4Q25) [IR 4Q25]. ㈜꿈의 사업 성격·잔여 약정 한도는 원문 미대조
→ SM면세점 감사의견 거절(2021\~2024, 영업종료·재무악화) — 연결상 중단사업 처리 [DART 사업보고서(2024.12)]
(6) 유동성 구조
→ 관광수탁금(고객 선수금) 1,768억이 현금성 자산의 70% 수준 — 대규모 취소 시 환급 유출 (2020 영업CF -1,329억 사례) [계산]

- **한국ESG기준원(KCGS)** (회사 ESG 페이지 표기 연도 기준): **2026 통합 A** (환경 A / 사회 A+ / 지배구조 B+) · 2025 B+ (A / A / B+) · 2024 A (A / A / A) [hanatourcompany.com Sustainability > ESG Ratings, 2026-11-25 조회]. 표기 연도가 평가연도인지 발표연도인지는 미확인
