## 1. 기업 분류

- **Primary 분류: 지속성장 (Defensive / 규제형 정비 서비스)**
- **Secondary 노트: 꿈(옵션) 일부 — 해외 원전 O&M·원전 해체·신규 원전(체코·미국) 수주 optionality**

### ② 산업 분류

- 산업: **발전설비 정비(O&M) 서비스** — 원자력·화력·양수·송변전·해외 발전소 정비
- 거래소 업종: KOSPI 건설 / WICS: 전기유틸리티 (WiseReport, 2026-11-02)
- 워치리스트 섹터: **원전 섹터 (T2) — 서브섹터: 원전 정비(O&M)** — ⚠ watchlist.md 미등록 (메인 세션에서 추가 예정)

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준**: 원자력/양수 40.0% + 화력 34.2% (2025 IR 기준) — 둘 다 **발전사(한수원·발전5사)와의 장기 정비계약 기반 반복 매출** → 지속성장
(2) **이익 변동 요인 sub-rule**: OPM 변동의 주원인은 업황(가격)이 아니라 ① 노무비(매출원가의 40%대, 공공기관 경영평가 등급 → 성과급 충당금), ② 계획예방정비 준공 호기수·수명연장 자재비 → **비용측 변동** → 사이클 분류 X
(3) **Boundary case 처리**: 해외(체코 두코바니 5·6호기 시운전정비, 루마니아 체르나보다 4,850억, 미국 원전) 매출 비중이 확대되면 "꿈/고성장" 성격 가미 → 현재는 Secondary 노트로만 표기
(4) **피어 cross-reference**: 한전기술(052690, 원전 설계 — 신규 원전 건설 사이클 노출 큼) / 두산에너빌리티(주기기 — 수주 사이클) / 현대건설(시공) 대비, 한전KPS는 **운영 중 원전·발전소 기수에 비례하는 annuity형 정비 매출** → 원전 밸류체인 중 가장 방어적. (같은 폴더 `한전기술_기업개요.md`, `두산에너빌리티_기업개요.md`, `현대건설_기업개요.md` 병행 작성 중)

### ④ 적정 밸류에이션 방법

- **PER (1순위)** — 이익 안정성 높고 무차입·순현금(2025말 순금융자산 약 3,840억, 하나증권). 셀사이드 표준: 12M fwd EPS × PER 15~17x (유진·교보·하나·알파증류소 모두 PER 방식)
- **배당수익률 (2순위, 하방 지지)** — 배당성향 8년 연속 50%+ (2018 49.9% 경계), 2025 DPS 1,651원 / 2026-11-03 주가 41,600원 → 배당수익률 4.0%
- **PBR 보조** — ROE 9~13%대 → PBR 1.2~1.7x 밴드 (2023 1.2x, 2025 1.65x, 2026-11 1.39x)
- 피어 차별화: 한전기술·두산에너빌리티는 신규 원전 수주 기대가 PER 40~80x로 반영 vs 한전KPS는 PER 13~15x — **해외 수주가 실적으로 확인될 때만 multiple 재평가**

### ⑤ 분기 재평가 트리거

- 해외 부문(해외+대외 중 원전 해외 정비) 매출 비중이 **20%+로 2개 분기 연속** 상승 시 → Secondary "고성장" 격상 검토 (2025 해외 비중 10.5%)
- 체코 두코바니 정비 본계약·미국 원전 정비 계약 **수주 공시** 시 → 꿈 성격 확대, PER 기준 재설정
- 공공기관 지정 해제/지배구조 변경(한전 지분 매각 등) 시 → 노무비·배당정책 구조 변화 → 분류 재검토
- 역으로 2개 분기 연속 OPM 5% 미만(원가 구조 악화 고착) 시 → "저성장 유틸리티"로 하향 검토

## 2. 회사 개요

### ① 기본 사항

- **회사명**: 한전KPS주식회사 (KEPCO Plant Service & Engineering Co., Ltd.) — KRX 051600
- **설립**: 1984년 한국전력공사 전액 출자로 설립된 발전설비 정비 전문회사 (WiseReport 기업개요, 2026-08-31 기준)
- **사업 한 줄 정의**: 국내외 원자력·화력·수력/양수·송변전 설비의 경상정비·계획예방정비·개보수를 수행하는 **한전 자회사(공기업) 정비 전문기업**. UAE·남아공 등 해외 발전설비 정비, 원전 해체·신재생 정비로 확장 중
- **지배구조 성격**: 한국전력공사 외 1인 51.02% 보유 → **공공기관(시장형/준시장형 공기업)** — 경영평가·인사(사장 임명)·배당이 정부 정책 영향권
- **발행주식수**: 45,000,000주 (보통주, 액면 200원) / 자본금 90억원

### ② 사업부별 개요 (매출 비중 큰 순서, 2025 IR 기준)

**원자력/양수 — 매출 비중 40.0% (6,306억)**

"한수원이 운영하는 원전·양수발전소를 고치고 점검하는 사업."
- 경상정비(상시 유지보수) + **계획예방정비**(원전별 약 2년 주기 정지 후 정밀 점검·교체, 이베스트) + 개보수·수명연장 공사
- 운영 원전 대상 순환 정비 (이베스트 2024-02: 운영 24기, 각 원전별 2년 주기 계획예방정비; 신규 원전은 상업운전 1년 후부터 주기 진입 — 신한울 1·2, 새울 3·4호기 순차 편입)
- 원전 수명연장 공사: 호기당 약 150억원, 과거 3~4년 → 최근 1년 이내로 단축 (유진 2026-05 IR Q&A)

**화력 — 매출 비중 34.2% (5,390억)**

"발전5사(남동·중부·서부·남부·동서)의 석탄·LNG복합 발전소 정비."
- 계획예방정비 준공: 2023 95기 → 2024 71기 → 2025 87기 → 2026 계획 97기 (2월 101기에서 하향)
- 2Q·4Q 집중 → 분기 매출 계절성(2Q/4Q 피크)의 주원인
- 장기적으로 석탄 감축(전력수급기본계획) → 구조적 감소 리스크, LNG 복합 전환분은 일부 상쇄

**해외 — 매출 비중 10.5% (1,653억)**

"해외 발전소 정비 — UAE 바라카 원전, 파키스탄·남아공 등."
- UAE 바라카 1~4호기 장기정비(LTMSA, 2019-06 체결, 한수원 컨소시엄)
- 파키스탄 공사 종료로 2024 감소 (IR 2Q24)
- 파이프라인: 루마니아 체르나보다 1호기(4,850억, 매출 2027-09~2030-06 예상), 체코 두코바니 5·6호기 시운전정비·가동전검사(본계약 협의 중, 2026-11 체결 예상 보도), 미국 원전(대미투자 프레임 내 APR1400 — 미확정)

**대외 — 매출 비중 8.2% (1,292억)**

"한전 그룹 외 민간 발전사·산업설비 정비 (포스코 성능개선, 민자 복합화력 등)."
- 프로젝트성 변동 큼: 2Q25 537억 → 2Q26 297억 (계약 종료)

**송변전 — 매출 비중 7.1% (1,124억)**

"한전 송전선로·변전소 설비 정비." 연 1,100억대 안정적 (YoY 0~12%)

### ③ 사업부별 디테일

- **Top-seller**: 원자력/양수 — 2024 +21.3%로 최대 부문 등극 (2023까지는 화력 1위). 원전 계획예방정비 = 상대적 고마진 (교보 2026-05)
- **Growth 엔진(중장기)**: 해외 원전 — 루마니아 4,850억 — 공시 계약기간(2025-08~2030-06) 균등 시 연 약 1,000억, 실매출이 2027-09 착공 이후 집중되면 연 1,700억대 → 2025 해외 매출(1,653억)과 맞먹는 규모
- **이익 outlier**: 4Q25 OP 192억 — 매출 +2.2% 증가에도 영업비용 +8%: 재료비 +39.1%(수명연장 자재), 외주비, 퇴직급여 (2026-02 리포트)
- **비용 구조**: 2Q24 IR 기준 영업비용 3,542억 = 재료비 256억(7%) + 노무비 1,443억(41%) + 경비 1,843억(52%) → **노무비가 핵심 레버**. 공공기관 경영평가 등급 → 성과급 충당금이 2Q(6월 하순 등급 발표)·4Q에 반영 (하나 2026-05)
