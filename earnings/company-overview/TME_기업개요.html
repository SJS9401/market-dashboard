## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 지속성장 (구조전환형 — 구독 프리미엄화)**

→ 매출 2017 RMB 109.8억 → 2025 RMB 329.0억 (8년 CAGR **+14.7%** [계산]) — 다만 2019→2025는 CAGR **+4.4%** [계산]: 고성장 → 정체(2021\~2023) → 재가속(2024\~2025)

→ 2021\~2023 소셜 엔터(라이브 스트리밍·노래방) 매출 반토막 + 음악 매출 2배 → **사업 믹스 전환**. 음악 비중 2021 36.7% → 2025 81.2% [계산]

→ 핵심 영업이익률(매출총이익−영업비용) 2021 **8.7%** → 2025 **29.4%** [계산] — 구독 단가(ARPPU)·SVIP·저마진 소셜 축소가 동시에 작동

**Secondary 노트: 규제·플랫폼 경쟁 민감**

→ 2021 반독점 처분(독점 판권 해제), 숏폼(Douyin·Soda Music) 경쟁, 2026 KPI 공시 중단 이후 주가 디레이팅(2026-03-17 하루 −24.7%)

(4) 산업 분류

→ 워치리스트: 대분류 **소비재** / 섹터 **엔터** / 서브섹터 **음원 글로벌** (핵심: UMG·Spotify·TME)
→ 성격: 중국 디지털 음악 DSP(스트리밍 플랫폼) + 오디오(롱폼, Ximalaya) + 오프라인 공연·MD

(5) 분류 결정 논리

→ 성장 엔진이 **가입자 수 → 단가(ARPPU)·SVIP**로 이동 (유료 가입자 YoY 2023 +20% → 4Q25 +5.3%, ARPPU는 4Q25 +7.2%)
→ 소셜 엔터 축소가 거의 끝나(2025 매출 비중 18.8%) 2026부터 전사 성장률 = 음악 성장률에 수렴
→ 순현금(2025말 약 RMB 345억 [계산])·FCF 90억대로 주주환원 여력이 큼 → 지속성장형 현금창출 구조

(6) 적정 밸류에이션 방법

→ 1순위 **PER (Non-IFRS 순이익 기준)** — 일회성 투자손익이 커서 IFRS 순이익 왜곡
→ 2순위 **EV/핵심 영업이익** — 순현금·투자자산(FVOCI 2025말 RMB 262억)이 시총의 1/3 이상
→ 참고(시점 2026-11-13): TTM 순이익(지배, 3Q25\~2Q26) RMB 89.2억 / 시총 약 RMB 996억(환율 6.99) → **PER 약 11.2배** [계산] / 순현금 차감 EV 약 RMB 650억 → **EV/TTM 핵심 영업이익(99.8억) 약 6.5배** [계산]

(7) 분기 재평가 트리거

→ 음악 관련 서비스 매출 YoY 10% 유지 여부 (2Q26 +11.0%)
→ 멤버십(구독) 매출 성장률 (2Q26 +8.1%, Ximalaya 포함) — 한 자릿수 초반 둔화 시 디레이팅
→ 핵심 OPM 30% 안착 vs Ximalaya 통합 비용
→ KPI 공시 재개 여부, SVIP 정성 코멘트 / 숏폼·Soda Music 경쟁
→ 자사주 매입 속도 (2Q26 $4억)

- **K-pop 연결고리**:
  - **디어유 bubble — QQ Music 입점** (중국판 bubble, TME가 운영·로열티 정산). 3Q25 국내 레이블 아티스트 15명 추가, 2025\~2026 C-pop 아티스트 입점 확대 (디어유 측: 2025-11 15명 → 2026-02 35명 [한경 2026-02]) — 디어유의 중국 로열티 매출로 연결
  - QQ Music **Weverse DM** 도입 — HYBE 등 약 170명 아티스트 (4Q25) [발표문]
  - SVIP 특전에 aespa·RIIZE·RENJUN 등 K-pop 디지털 앨범·기프트 패키지 (2Q26) / G-DRAGON 중국 6개 도시 공연 주최(3Q25)
- **오프라인 공연·MD 고성장**: 2025 음악 구독 외 매출 RMB 90.7억 (+39.2%) [4Q25 발표문]
- **Ximalaya**: 중국 1위 롱폼 오디오(팟캐스트·오디오북). 2Q26 매출 기여 RMB 4.07억(약 6주), 백엔드 통합 진행 중 — 멤버십 매출 증가 요인
- **비용 구조**: 영업비용/매출 2021 21.4% → 2025 14.8% [계산]. 판관비 내 R&D 약 23억(2025)
