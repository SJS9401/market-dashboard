(3) 정량적 분류 근거

→ **마진 정상화**: 매출총이익률이 FY23 -2.9% → 1H26 8.6%로 11.5%p 개선. G&A/매출 5.0% → 2.9%, 차입비용 5.7% → 3.5% (회사 IR)

→ **Series Build 잔고**: 순잔고의 약 95%가 반복 건조(페트로브라스 P-시리즈 FPSO 6척, 미국 걸프만 FPU 3기, TenneT 2GW HVDC 변환 플랫폼 4기). 합병 전 저마진 레거시(비 FPSO) 잔고는 S$140M 미만

→ **수주 공백**: 1H26 신규 수주 S$1억 남짓, 잔고 S$17.8B → S$13.3B (6개월 -26%). 잔고/연매출 1.16배 — 사이클 하강 신호

→ **현금·재무**: 1H26 FCF S$237M(일회성 제외), 순레버리지 0.5배, 순부채 S$0.68B, 유동성 S$3.4B

(4) 산업 분류

→ **SGX 업종**: Industrials — Marine & Offshore Engineering

→ **워치리스트 섹터** — 조선 (섹터 T2 주도 후보) / 서브섹터 **조선 글로벌**

→ 상선(컨테이너선·LNG선 신조)은 거의 하지 않는다. 해양 에너지 설비(FPSO·FPU·FLNG)·해상풍력 변전소·수리개조가 본업이라 한국 3사의 "해양·특수선" 부문과만 겹친다

(5) **한국 조선 3사와의 경쟁 지점** (필수)

| 영역 | Seatrium 포지션 | 한국 경쟁사 | 경쟁 양상 |
|---|---|---|---|
| **FPSO (부유식 원유 생산설비)** | 페트로브라스 P-78~P-85 6척 풀스코프 EPC, 2021~24년 페트로브라스 EPC 약 90% 수주(JPM 질문 인용). 브라질 야드 3곳 로컬 콘텐츠, 가이아나 통합 5기 | **삼성중공업·한화오션** (한화오션 P-79 인도, Venus FPSO 대기) | 페트로브라스가 EPC 직발주 → BOT(운영사 주도)로 전환. SBM·MODEC이 야드를 고르는 구조가 되면 Seatrium·한국·중국 야드가 하도급으로 경쟁 [판단] |
| **FLNG (부유식 LNG 생산설비)** | LNG선 → FLNG 개조 세계 유일 2기(Hilli·Gimi), 신조 설계 FLNG-X AiP. 계약 규모 통상 S$10억 | **삼성중공업** (FLNG 점유율 64%, 델핀 2호기) | 신조 FLNG는 삼성중공업 우위. Seatrium은 "개조형 = 빠르고 싼 대안"으로 경쟁하고 FLNG-X로 신조 진입 시도 |
| **FSRU·FSU 개조 / 파워십** | 세계 FSRU/FSU 개조의 90% 이상, Karpowership 9척, Excelerate 첫 EPCIC | (한국 3사는 신조 FSRU) | 신조 vs 개조. LNG 인프라 긴급 수요(에너지 안보)에서 개조가 공기 우위 |
| **해상풍력 변전소 (HVDC/HVAC OSS)** | TenneT 2GW HVDC 4기(Beta·Gamma·Nederwiek 2·BalWin5), 대만·미국 HVAC. TenneT 할당 사전적격 3곳 중 하나 | **HD현대중공업** (OSS 진입) | 유럽 HVDC 플랫폼은 Seatrium·중동/유럽 야드 과점, 한국은 후발 [판단] |
| **해상풍력 설치선 (WTIV·HLV)** | Maersk·Dominion WTIV, Penta-Ocean HLV | 한국 3사 일부 실적 | 미국 존스법 선박 등 소량. Seatrium은 레거시 손실로 신규 선별 |
| **고정식 플랫폼·가스 톱사이드** | 중동 고정식 플랫폼 파이프라인 S$2B | HD현대중공업 해양 | 중동 EPC 경쟁 |

→ 요약 [판단]: Seatrium은 한국 3사의 **해양 부문 전용 경쟁자**다. 상선 슈퍼사이클의 수혜는 없고, 해양 발주가 멈추면 전사 매출이 바로 줄어든다. 반대로 해양 발주가 재개되면(FPSO·FLNG) 한국 3사와 같은 입찰 테이블에 앉는다

(6) 분류 결정 논리

(1) **매출 비중** — Oil & Gas 71% + Offshore Wind 18%(FY25) → 해양 에너지 설비 전업

(2) **턴어라운드 vs 사이클** — 합병 후 OPM range +30.8%p, 단조 회복 → 턴어라운드 우선. 다만 잔고 반감으로 2027년 이후는 사이클 하강 노출 → Secondary 사이클

(3) **한국 피어 대비** — 한국 3사는 "상선 사이클 + 해양 옵션", Seatrium은 "해양 사이클 + 마진 정상화" — 같은 섹터지만 이익 동인이 다르다

(7) 적정 밸류에이션 방법

→ **1차 — P/B + ROE**: PBR 0.99배(2026-09, stockanalysis), FY2028 목표 ROE ≥8%. 턴어라운드 중이라 ROE 경로가 P/B를 정한다

→ **2차 — EV/EBITDA**: EV/EBITDA 9.2배(LTM, stockanalysis). FY2028 EBITDA 목표 ≥S$1.0B 대비 EV S$8.4B → 8.4배 [계산]

→ **3차 — 잔고 대비 시가총액**: 시총 S$7.1B / 순잔고 S$13.3B = 0.53배 [계산] — 수주 재개 국면의 선행 지표

→ **P/E 보조**: 매각이익·충당금 환입 등 비경상 이익 비중이 커서 단독 사용 부적합 (1H26 순이익의 43%가 매각이익)

(8) 분기 재평가 트리거 (**분류 변경 조건**)

→ ① **매출총이익률 10% 이상 2개 반기 연속 + 매각이익 제외 ROE 8% 도달** → 턴어라운드 종료 → **사이클 Primary 재분류**

→ ② **순잔고 S$10B 미만 + 2개 반기 연속 매출 역성장** → 사이클 하강 확정 → **사이클(하강) Primary 강등**

→ ③ **대형 FPSO·FLNG 수주로 순잔고 S$20B 회복 + OPM(매각 제외) 8% 이상** → 수주·마진 동반 → **사이클(상승) + 지속성장 Secondary 격상**
