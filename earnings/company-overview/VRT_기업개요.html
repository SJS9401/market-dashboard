# Vertiv Holdings 기업 개요 (v1.0 — 전력 인프라 / 배전·DC 전력관리 / AI 데이터센터 전력·냉각 pure-play)
> **Fact verify cutoff**: 2026-11-15 (주가·시가총액·컨센은 작성일 기준. 다음 갱신 시 재확인)
> **기준 단절 주의**: Vertiv는 2016년 Emerson Network Power에서 분사, 2020-02-07 SPAC(GS Acquisition Holdings) 합병으로 상장했다. 공개 재무는 FY18부터이고, FY19 이전 영업이익·조정 영업이익은 공시 기준이 달라 일부 비운다. FY23부터 본사 비용 일부를 지역 세그먼트에 배분하도록 세그먼트 기준이 바뀌었다 (FY24 10-K 재작성)

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (High Growth)** — AI 데이터센터 전력·냉각 수요를 가장 직접적으로 받는 pure-play. 매출 YoY FY23 +20.6% → FY24 +16.7% → FY25 +27.7% → FY26 가이던스 +43%, 2026년 3분기 유기적 수주 +100% 이상

→ **매출 4년 2.9배 경로** — FY22 $5.7B → FY26 가이던스 $14.65B. 수주잔고 FY22 $4.75B → FY25 $15.0B (3.2배)

→ **이익 레버리지가 매출보다 빠르다** — 조정 영업이익 FY22 $439M → FY25 $2,090M (4.8배), FY26 가이던스 $3,515M. 조정 영업이익률 7.7% → 20.4% → 24.0%(가이던스)

→ **매출의 대부분이 데이터센터** — 하이퍼스케일·코로케이션·네오클라우드·엔터프라이즈 데이터센터가 핵심 고객. 통신망·상업·산업은 저성장 보조 시장

**Secondary 노트: 사이클 (데이터센터 설비투자 사이클 노출 + 2020~22년 마진 붕괴 이력)**

→ **조정 영업이익률 범위 12.7%p** (FY22 저점 7.7% ↔ FY25 20.4%) — 사이클 cutoff ±10%p를 넘는다

→ FY23이 변곡점이다. 변곡 이후 4년 연속 매출·마진 동반 상승이라 "고성장" 기준(매출 성장 20% 안팎 지속 + 수주 선행)을 충족한다

(5) 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** — 세그먼트가 지역 단위라 사업부 기준이 의미 없다. 제품 기준으로는 데이터센터용 전력·열관리 제품이 매출 80%(서비스·스페어 20%)다 → 데이터센터 단일 노출

(2) **사이클 vs 고성장 sub-rule**
   - 조정 OPM range 12.7%p → 사이클 cutoff(±10%p) 초과
   - 그러나 range의 대부분이 FY22 저점 이후 단방향 상승이고, 하락 구간은 상장 후 1회(FY20~FY22 인플레이션)뿐
   - 매출 성장 FY23~FY26E 연평균 약 +26%, 수주잔고 3년 3.2배
   → **고성장 Primary**, 사이클은 Secondary로 둔다

(3) **Boundary case 처리**
   - 서비스·스페어 매출 비중 FY20 30% → FY25 20%로 하락 — 성장이 장비(제품)에 쏠려 있어 사이클 민감도가 오히려 커졌다
   - 성장률이 15% 아래로 내려오고 마진이 꺾이면 Primary가 사이클로 넘어간다 (분류 변경 조건 ①)

(4) **글로벌 피어 대비**
   - **Eaton** (지속성장) — 마진은 같지만 항공·유틸리티로 분산, 성장률은 Vertiv의 절반
   - **Schneider·ABB** (지속성장) — 데이터센터 비중이 일부라 사이클 노출이 작다
   - **LS일렉트릭** — 미국 데이터센터 배전반으로 같은 수요를 받지만 마진은 절반(12.4%)
   - Vertiv는 같은 서브섹터에서 **유일한 데이터센터 pure-play** — 분류가 피어와 다르다

(6) 적정 밸류에이션 방법

→ **1차 — Forward PER (고성장 분류 표준)**: 이익이 매년 40~60% 늘어 순이익 기준 PER이 가장 직접적이다. 2026-11 주가 $202 기준 FY26 조정 EPS $7.15 → 28.3배, 2027 컨센 EPS $9.45 → 21.4배. 5년 평균 Fwd P/E 약 27배, 2026-05 고점 약 55배 [TIKR 11/10 인용]

→ **2차 — PEG (성장 대비 멀티플)**: 2027 컨센 EPS 성장 약 +32%에 Fwd P/E 21배 → PEG 약 0.7. 피어(Eaton Fwd P/E 27~29배, EPS 성장 10%대)보다 성장 대비 싸다

→ **3차 — EV/EBITDA (부채 비교)**: 순차입 약 $1.2B (FY25), 순차입/조정 EBITDA 약 0.5배로 부채 부담은 작다. 자본구조보다 이익 성장이 밸류를 정한다

→ **PBR 미사용** — FY19까지 자본잠식, FY25 자본 $3.9B에 시가총액 $60~130B라 P/B 밴드가 의미 없다

→ **삼성전자 대비**: 삼성전자는 메모리 사이클이라 PBR 밴드 단독, Vertiv는 고성장이라 Forward PER·PEG 단독. 다만 Secondary 사이클이라 데이터센터 capex 정점 우려가 커지면 멀티플이 이익보다 먼저 꺾인다 (2026-11 TP 하향 = 멀티플 하향)

(7) 분기 재평가 트리거 (**분류 변경 조건** — 실적 추적 변수는 ⑥ 섹션)

→ ① **매출 YoY 15% 미만 + 조정 OPM 2개 분기 연속 하락** → 고성장 → **사이클 Primary 전환** (데이터센터 capex 정점 통과 판정)

→ ② **서비스·스페어 매출 비중 25% 이상 회복 + 조정 OPM 22% 이상 4개 분기 유지 (성장률 15% 안팎으로 둔화된 상태)** → 고성장 → **지속성장 전환** (설치 기반 서비스로 이익이 안정되는 Eaton·Schneider형)

→ ③ **800V DC·액체냉각 신규 플랫폼 매출화(2028~) 후 매출 YoY 30% 이상 + 조정 OPM 25% 이상 4개 분기 유지** → **Secondary 사이클 해제** (고성장 단독 — 신규 아키텍처가 capex 사이클을 넘어서는 구조적 점유율 확대로 확인)

**1946 ~ 1986 — Liebert 시대 (전산실 냉각의 시작)**

→ 1946: Ralph Liebert가 전신 회사 창업

→ 1965: Liebert Corporation 설립 — 세계 최초 전산실 항온항습기(CRAC) 제조사

**1987 ~ 2015 — Emerson Network Power 시대**

→ 1987: Emerson Electric이 Liebert 인수

→ 2000: Emerson이 Network Power 사업부 출범 — Liebert(냉각·UPS)와 ASCO(전원 절체 스위치) 통합

→ 2000년대: Avansys, Marconi 외부 설비·전원 시스템, Knurr(랙·인클로저), Avocent(IT 관리·KVM) 인수로 포트폴리오 확장

**2016 ~ 2019 — Platinum Equity 시대 (분사·레버리지 인수)**

→ 2016: Emerson이 Network Power를 사모펀드 Platinum Equity에 매각 (약 $4B [보도 인용]), 회사명 Vertiv 출범

→ 2017: ASCO Power Technologies를 Schneider Electric에 매각 [보도 인용]

→ 2018: Energy Labs(맞춤형 공조), Geist(랙 PDU), ERS(전기 설비 신뢰성 서비스) 인수

→ 2019: 레버리지 구조로 이자비용 $310M, 순손실 -$141M, 자본잠식 -$705M

**2020 ~ 2022 — 상장과 인플레이션**

→ 2020-02-07: GS Acquisition Holdings(골드만삭스 SPAC)와 합병해 NYSE 상장. 조달 자금으로 부채 $1.46B 상환

→ 2021-11: E+I Engineering(아일랜드, 스위치기어·버스바·모듈형 전원) 인수 — 현금 약 $1.16B. 데이터센터 전력 배전(화이트 스페이스 밖)까지 확장

→ 2022: 원자재·물류 인플레이션을 고정가 수주가 흡수하지 못해 조정 OPM 7.7%로 저점. 9~10월 주가 $8대

→ 2022-11: Rob Johnson CEO 퇴임 발표, Giordano Albertazzi(EMEA 사장 출신) 후임 지명

**2023 ~ 현재 — 턴어라운드와 AI 데이터센터**

→ 2023-01: Albertazzi CEO 취임, Executive Chairman David Cote(전 Honeywell CEO)와 Vertiv Operating System(VOS, 린 운영 체계) 도입. 가격 재설정으로 마진 회복

→ 2023: 조정 OPM 15.3%로 두 배. 액체냉각 CDU 업체 CoolTera 인수

→ 2024: Platinum Equity 잔여 지분 정리, 자사주 $600M 매입. 수주잔고 $7.2B

→ 2025-08: Great Lakes(랙·캐비닛, 미국·유럽 공장) 약 $200M 인수

→ 2025-12: PurgeRite(액체냉각 배관 세정·유체 관리 서비스) 인수 — 약 $1.0B [투자CF 역산]. 수주잔고 $15.0B로 1년 새 2배

→ 2026: NVIDIA 800V DC 레퍼런스 설계 협력, Oklo(소형원전)와 데이터센터 전력 협력. 10월 3Q 실적과 함께 수주 공시 중단 발표

(2) 사업 개요 — 무엇을 파는가 (매출 비중 큰 순서)

**① 전력 관리 (AC·DC Power Management)** — 데이터센터에 "끊기지 않는 전기"를 공급하는 장비

→ **UPS (무정전 전원 장치)**: 한전 전기가 순간이라도 끊기거나 흔들리면 서버가 멈춘다. UPS는 배터리로 수 분~수십 분 버티면서 발전기가 돌아갈 때까지 전기를 이어준다. 데이터센터 전력 체인의 핵심 장비. 브랜드 Liebert

→ **스위치기어·버스바 (저압·중압)**: 건물로 들어온 전기를 층·구역별로 나누고 차단하는 배전반(스위치기어)과, 전선 대신 구리판으로 큰 전류를 나르는 버스바. 2021년 E+I Engineering 인수로 확보

→ **DC 전원 (NetSure)**: 통신 기지국·데이터센터용 직류 전원. 2027년부터 NVIDIA 800V DC 아키텍처(랙에 고압 직류를 바로 공급해 변환 손실을 줄이는 방식)로 확장 예정

→ **랙 PDU (Geist)**: 서버 랙 안에서 개별 서버로 전기를 나눠 주는 멀티탭형 분배기. 전력 측정·원격 제어 기능

**② 열관리 (Thermal Management)** — 서버가 내는 열을 빼는 장비. Vertiv의 뿌리이자 AI 시대 최대 차별화 영역

→ **공랭 (항온항습기·칠러)**: 전산실 공기를 식히고 습도를 맞추는 정밀 공조기(CRAC/CRAH)와, 건물 단위로 냉수를 만드는 칠러. 1965년 Liebert가 최초 개발. 2026년 칠러 생산능력 2배 증설

→ **액체냉각 (CDU·후면 도어 열교환기)**: AI GPU 랙 하나가 100kW 이상을 쓰면서 공기로는 열을 못 뺀다. 냉각수를 서버 칩 바로 위까지 돌리는 직접 액체냉각(DLC)이 필요한데, CDU(냉각수 분배 장치)가 그 심장이다. CoolTera(2023) 인수로 강화

→ **액체냉각 서비스 (PurgeRite)**: 액체냉각 배관을 처음 채우고 세정하고 유체를 관리하는 서비스. 냉각수가 오염되면 GPU가 망가지므로 필수 작업. 2025-12 인수

**③ 통합 인프라 (Integrated Solutions·랙·모듈형)** — 위 장비를 공장에서 미리 조립해 보내는 사업

→ **랙·캐비닛 (Knurr·Great Lakes)**: 서버를 꽂는 철제 프레임. AI 랙은 무게·전력·배관이 복잡해 맞춤형 수요가 늘었다

→ **모듈형 데이터센터 (SmartRun·MegaMod 등)**: 전력·냉각·랙을 공장에서 컨테이너·스키드 단위로 조립해 현장에 꽂기만 하면 되게 만든 제품. 현장 공사 기간을 줄여 준다. NVIDIA와 Pod 단위 레퍼런스 설계

**④ 서비스 & 스페어 (FY25 매출 20%)**

→ 예방 정비, 프로젝트 관리, 시운전·인수 시험, 원격 모니터링, 부품 공급. 서비스센터 300곳 이상, 엔지니어 약 5,000명, 긴급 출동 1회 해결률 90% 이상

→ 설치 기반이 쌓일수록 매출이 반복되는 구조 — 마진이 제품보다 높고 사이클 방어 역할

**⑤ IT 관리 (Avocent)**

→ 데이터센터 서버를 원격으로 접속·관리하는 KVM 스위치·관리 소프트웨어. 매출 비중은 작다

(3) 사업 디테일

→ **Top-seller**: 데이터센터 UPS·열관리 (Americas 매출 69%가 대부분 데이터센터향)

→ **성장 엔진**: 액체냉각 (회사: 비중이 "훨씬 커지고 있다", 수치 미공개), 스위치기어·버스바, 모듈형. 3Q26 유기적 수주 +100% 이상, 미주 파이프라인 분기 증가 속도 사상 최고

→ **이익 아웃라이어**: Americas 마진 29.4% (3Q26) vs APAC 17.0% — 미국 AI 데이터센터 가격·물량이 이익을 끈다. EMEA는 FY25 마진 하락(24.5% → 20.7%) 후 3Q26 28.0%로 회복
