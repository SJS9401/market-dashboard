## 1. 기업 분류

- **Primary 분류: 지속성장 — 배당 유틸리티형** (Defensive Yield — 규제·과점 통신 인프라. 매출 연 +2%대, 상각 전 이익(EBITDA) 마진 20% 안팎에서 안정, 이익 변동은 인력·부동산 일회성이 지배)
- **Secondary 노트: AI 인프라(AIDC·kt cloud) 성장 옵션 + 부동산·금융 자회사 자산가치(SOTP)** — 2028 중기 목표 "AICT/AX Platform Company" 전환, ROE 9\~10% [IR·아시아경제 2024-11-05]. 아직 연결 이익 기여는 제한적이고 kt cloud 매출 0.997조 (2025, 연결의 3.5%) [IR 4Q25]

### ② 산업 분류

- 산업: **유무선 통신 (기간통신사업자) + ICT 그룹 (금융·미디어·클라우드/IDC·부동산)** — 무선 3사 과점, 유선(초고속·시내전화·IPTV)은 KT가 1위
- DART 업종: 612 전기통신업 [OpenDART company.json] / KRX 통신업
- 워치리스트 섹터: **통신** / 서브섹터: **통신** (SK텔레콤·KT·LG유플러스)
- 시장 지위 (2025말 가입자 기준, 과기정통부 통계 [DART 사업보고서(2025.12) II]): 이동전화 28.9% (2위, SKT 47.3%·LGU+ 23.8%, MVNO 제외) / 초고속인터넷 **40.3% (1위)** / IPTV **43.3% (1위)** / 시내전화 **79.2% (1위)**
- 외국인 지분 한도: 전기통신사업법 제8조 — 기간통신사업자 발행주식의 49% → **2026-09 기준 외국인 한도 소진(49%)**으로 매입 자사주 소각이 보류 중 [뉴스토마토 2026-09-10, IR 4Q25 "소각시점은 외국인한도 고려하여 추후결정"]

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: ICT 부문(≈ KT 별도: 무선·유선·미디어·기업서비스) = 2025 부문매출 19.32조, 부문 합계(연결조정 전 34.47조)의 56.0% [DART 사업보고서(2025.12) II-1 사업부문별 영업수익]. 무선(가입자×ARPU)·유선(초고속·IPTV) 모두 월정액 구독형 반복매출 → 매출은 경기와 무관하게 +1\~3% 성장 → **지속성장(유틸리티형)**
(2) **이익 비중 sub-rule**: ICT 부문 영업이익 = 2015\~2023 연결 영업이익의 63\~75% [DART 부문정보 계산]. 연결 OP 변동의 대부분은 ICT 내부 일회성(2014 명퇴 -4,268억, 2024 -7,450억 (4Q24 단독)) 또는 기타부문 부동산 분양(2025 기타 OP 8,087억, 2Q25 단독 4,487억)에서 발생 — **영업 사이클이 아니라 이벤트** → Primary 유지
(3) **Boundary case 처리**:
→ **금융 (BC카드)**: 2025 부문매출 3.36조 (부문 합계의 9.7%), OP 1,503억 — 카드 결제 프로세싱 수수료 사업이라 신용 사이클 노출이 작음. 케이뱅크는 연결 관계기업 (지분율 33.7%, 지분법 — 연결 매출·OP에는 미포함, 영업외 지분법손익으로만 반영) [DART 사업보고서(2025.12) 관계기업 주석]. 케이뱅크 FI에 부여한 동반매각청구권(Drag-Along) 관련 파생상품부채 존재 [동 주석]
→ **부동산 (KT에스테이트 + 개발 SPC)**: 부동산 부문 OP 900\~1,190억/년 (2022\~2025) 임대·호텔 안정 이익 + 분양 프로젝트(2025 광진구 롯데이스트폴, 2026 대전 둔산)는 **기타부문**에 일회성으로 반영. 분양이익은 반복성이 없어 Secondary(자산가치)로 분리
→ **AI/클라우드 (kt cloud, AIDC)**: 2025 매출 0.997조 (+27.4%) [IR 4Q25], AX 매출 9M26 1.11조 (+11.9%, KT+kt cloud) [IR 3Q26]. 연결 매출 대비 3\~4% — 성장 옵션이지만 분류를 바꿀 크기 아님
→ 결론: **Primary 지속성장(배당 유틸리티) + Secondary(AI 인프라 옵션·SOTP 자산가치)**
(4) **피어 대비 (통신 서브섹터)**:
→ **SK텔레콤**: 무선 점유율 1위(42.7%, 2025말 MVNO 제외 [SK텔레콤 기업개요 — DART 사업보고서(2025.12)]), 2025-04 USIM 해킹 사고로 이익 훼손 → KT와 같은 "보안 사고 → 위약금 면제·고객보답 → 무선 ARPU 하락" 경로. 상세는 `SK텔레콤_기업개요.md`
→ **LG유플러스**: 무선 3위, 유선 3위 — 3사 중 그룹사 포트폴리오가 가장 단순 (순수 통신). 상세는 `LG유플러스_기업개요.md`
→ **KT 차별점**: 3사 중 **유선 인프라(초고속 40%·IPTV 43%·시내전화 79%) 최대 + 비통신 그룹사(BC카드·부동산·클라우드) 비중 최대** — 부문 합계 중 ICT 외 비중 44% (2025). 그래서 3사 중 SOTP 논거가 가장 강하고, 동시에 연결 이익의 일회성 노이즈도 가장 큼
→ 글로벌 피어 (NTT·Verizon·Deutsche Telekom 등 성숙 통신사)도 동일하게 배당·EV/EBITDA 프레임 — 이번 버전은 수치 비교 미수행

### ④ 적정 밸류에이션 방법

- **1순위: 총주주환원수익률 (배당 + 자사주) + PBR-ROE** — 이익이 일회성으로 흔들려 PER은 왜곡이 큼 (2024 PER 23.5배는 인력 일회성 때문 [계산])
→ 연말 PBR (지배자본 기준, Yahoo 연말 종가 × 발행주식총수 [계산]): 저점 **0.45배 (2020)** · 0.52\~0.53배 (2019·2021\~2023) / 고점 **0.79배 (2014)** · 0.75배 (2025)
→ 현재 **0.62배** (2026-11-24 시총 11.34조 / 3Q26 지배자본 18.35조 [DART])
→ 배당: FY26 DPS **최소 2,400원** 약속 [IR 3Q26] → 현재가 기준 배당수익률 **5.3%** [계산]. 2026 자사주 2,500억 매입 완료 → 총주주환원 약 (2,400원 × 유통주식 236.7M주 + 자사주 2,500억) ≈ 0.83조 = 시총 대비 약 **7.2%** [계산, 유통주식 기준 근사]
→ ROE: 2015\~2023 4.1\~9.4%, 2025 10.2% (분양이익 포함) [계산] — 회사 목표 2028 ROE 9\~10% [아시아경제 2024-11-05]
- **2순위: EV/EBITDA** — 현재 **3.4배** (EV 19.4조 = 시총 + 3Q26 차입금 11.10조 − 현금 3.04조, TTM EBITDA 5.66조 [IR 4Q25\~3Q26 합산]; 리스부채·비지배지분 미반영 [계산]). 2015\~2025 연말 2.3\~3.8배 범위 (2014 6.5배는 KT렌탈·캐피탈 차입금 포함으로 왜곡)
- **3순위: SOTP (re-rating 논거)** — 별도 통신(EV/EBITDA) + BC카드·KT스카이라이프(상장 시가 × 지분) + kt cloud(DC 멀티플) + 부동산(장부가 vs 시가, 투자부동산 2.87조 [DART 2025]). 비핵심 자산 유동화는 2028 계획에 포함 [IR 4Q24]
- **PER은 보조**: TTM 지배순이익 1.23조 기준 PER **9.3배** [계산]
- **피어 차별화**: SKT(무선 1위, 2021-11 SK스퀘어 인적분할로 투자자산 분리 [SK텔레콤 기업개요])·LGU+(순수 통신에 가까움)와 달리 KT는 **SOTP + 외국인 한도** 변수가 밸류에이션에 직접 작용 — 외국인 한도 49% 소진은 수급 상단을 제한하고 자사주 소각을 지연시키는 KT 고유의 구조적 디스카운트 요인

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **AX·AIDC·kt cloud 합산 매출이 연결 매출의 15%+ 이고 그 부문 OP가 연결 OP의 20%+** 시 → Secondary(AI 인프라) 격상, 지속성장 → 성장(AI 인프라) 하이브리드 검토 (현재 kt cloud 매출 비중 3.5%)
- **2개 연도 연속 연결 OPM 9%+ (일회성 제외)** 시 → 2028 목표(연결 OPM 9%대) 달성 = 수익성 구조 변화로 재분류 검토 [목표 출처: 아시아경제 2024-11-05]
- **무선 서비스 매출 2년 연속 감소** (요금 규제·보안사고·5G 포화) 시 → 지속성장 → 성숙/역성장(Value Trap 리스크) 분류 추가
- **부동산 분양이익이 3년 연속 연결 OP의 20%+** 시 → 부동산 개발을 반복 사업으로 보고 Secondary를 "부동산 개발 사이클"로 변경
- **외국인 지분 한도 규제 완화 또는 KT의 비기간통신 지주 구조 전환** 시 → 소각·수급 제약 해소로 밸류에이션 프레임 재설정
