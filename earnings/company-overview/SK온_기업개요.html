# SK온 기업 개요 (v1.0 — 배터리 T2, 9년 연속 영업적자의 파우치 셀 메이커가 JV 재편·ESS 전환으로 '생존형 리밸런싱' 중)

> ⚠️ **시계열 단절·표시 변경 5건 — 모든 표·차트 해석 시 주의**
> ① **2021.10.01 물적분할** — SK이노베이션 배터리 사업 일체를 물적분할해 SK온 신설. **본 리포트의 1차 시계열은 'SK이노베이션 연결 영업부문 배터리'(SK이노 계열 내부거래 제거 후)** → 분할 전·후 같은 기준으로 연결됨. 단, 실제 SK온 법인 재무(연결)와는 다름(SK이노 IR 주석 "실제 SK온(합병법인) 실적과 차이")
> ② **2024.11.01~2025.11.01 비배터리 3사 흡수합병** — SK트레이딩인터내셔널(2024.11.01)·SK엔텀(2025.02.01)·SK엔무브(2025.11.01) → SK온 '합병법인'에 석유 트레이딩·탱크터미널·윤활기유 사업이 들어옴. **본 리포트의 '배터리 사업' 숫자는 합병법인이 아닌 배터리 부문만** (합병법인 영업이익은 chart2c에 별도)
> ③ **2023.2Q~ IRA 45X AMPC 인식** — 2023~2025는 '기타영업수익'(매출 외, 영업이익 내)으로 표시
> ④ **2026.1Q~ AMPC를 매출에 병합 표시** (SK이노 반기보고서 2026.06 주석 '재무제표 표시 변경') → SK이노 IR은 2025년 분기도 같은 기준으로 재작성(예: 3Q25 1.808조 → **1.981조**). 본 리포트는 2023~2025에 AMPC를 더한 **'재작성 기준' 매출을 별도 병기**하고 YoY는 재작성 기준으로 계산
> ⑤ **2026년 AMPC 분기 금액 미공시** — 2Q26부터 회사가 AMPC·고객보상금을 따로 밝히지 않음(SBS Biz 2026-08-03 "SK온만 보조금 효과 미공개"). 1Q26 AMPC는 SK이노 1Q26 분기보고서 영업부문 주석(790억), 2Q26은 반기 누적 '기타영업수익' 1.22조에서 1Q 차감한 **AMPC+보상금+파생이익 합계 1.14조(⚠️계산)**, 3Q26은 [미확보 — SK이노 3Q26 분기보고서 공시 후 보완]
> 부가: 2014~2016 배터리 손익은 SK이노 '기타' 부문에 포함되어 분리 공시 없음 [미공시] → 연간 시계열은 2017년부터

## ① 기업 분류

(1) Primary / Secondary 분류

**⚠️ Boundary Case — 매출은 8년 48배 성장(고성장형), 이익은 9년 연속 적자(사업화 미완성)**

연간 배터리 부문 OPM range **-159.3%(2017) ~ -4.5%(2023)**, 흑자 연도 **0회**. 분기 흑자는 35분기 중 **2회**(3Q24 +240억, 2Q26 +8,218억 — 둘 다 AMPC·고객보상금 등 기타영업수익 영향)

**Primary 분류: 꿈(적자 성장) → 사이클 진입 전환기 — 규모는 갖췄지만 흑자 구조는 미증명**

→ 매출 2017 1,457억 → 2023 **12.90조**(정점) → 2024 6.27조(-51.4%) → 2025 6.98조 — 정점 이후 EV 캐즘으로 반토막, 회복 미약

→ 2017~2025 누적 영업손실 **-5.68조** (2023~2025 AMPC 1.63조 포함 후) — AMPC 제외 시 2023~2025 3년만 -4.27조

→ 가동률(DART, 부하시간÷조업시간) 2023 87.7% → 2024 **43.8%** → 2025 48.7% → 1H26 **36.4%** (2024부터 산정 방식 변경·소급)

**Secondary 노트: 사이클(북미 EV 수요·정책) + ESS 신사업 형성 초기**

→ ESS: 2025.09 첫 수주(Flatiron 1GWh, 우선협상 6.2GWh) → 2026.02 국내 중앙계약시장 2차 284MW(낙찰 50.3%) → 2026.08 **NeoVolta 9GWh**(2027~2031, LFP 파우치) — 2026 목표 20GWh 수주(2Q26 컨콜)

→ 북미 JV 재편: Ford JV(BlueOval SK) 종료(2026.05) → 테네시 공장 100% 단독, 현대차 JV(HSBMA, 조지아 35GWh) 2026.06 양산 개시

**Entity 구조 (2026.06말, SK이노 반기보고서)**

→ **SK온㈜ (본사·서산공장)** — 배터리 + 합병된 석유 트레이딩(구 SKTI)·탱크터미널(구 SK엔텀)·윤활기유(구 SK엔무브) 사업. SK이노 지분 90.3%, 나머지 9.7%는 PRS 계약 투자자 SPC 3곳

→ **연결 생산법인** — SK Battery America(조지아 1·2공장), SK Battery Manufacturing Kft.(헝가리 코마롬 1·2), SK On Hungary Kft.(헝가리 이반차 3공장), SK On Jiangsu(옌청 SKOJ, 2026.1Q EVE 지분 30% 인수로 100%), SK On Yancheng(옌청 SKOY), **SK On Tennessee, LLC**(구 BlueOval SK, 2026.05 감자 후 100%)

→ **공동기업(지분법, Capa 제외)** — HSBMA LLC(현대차그룹 50:50, 조지아 바토우), Beijing BESK(BAIC JV, 창저우). Huizhou EVE United Energy(EVE JV, 후이저우) 지분 49%는 2026.1Q 지분 Swap으로 처분

→ **사업부 공시**: SK이노 연결 영업부문은 2024.11 SK E&S 합병 이후 '배터리 및 소재'(SK아이이테크놀로지 분리막 포함)로 통합 → **배터리 단독 분기 숫자는 SK이노 IR '회사별 실적'의 'SK온(배터리 사업)' 행이 1순위**. EV·ESS 제품별 매출은 미공시

(5) 분류 결정 논리

(1) **가장 매출 큰 사업 기준** — 매출의 대부분이 EV 하이니켈 파우치(NCM). ESS는 2026년 국내 소규모·북미 Flatiron 초도 공급 단계, 본격 매출은 2027(NeoVolta)부터 → 현재 실적은 EV 수요(북미·유럽 고객 판매)에 종속

(2) **이익 sub-rule** — 연간 흑자 0회. 고성장 분류에 필요한 '이익의 증명'이 없음 → 고성장(Primary) 불가. 사이클 분류도 '정점 OPM'이 플러스여야 의미 → 현재는 **꿈(적자 성장) 말기 → 사이클 진입 대기**로 판단

(3) **Boundary case 처리** — 대안: AMPC 포함 분기 흑자가 4개 분기 연속 + AMPC 제외 OPM -5% 이내 진입 시 Primary '사이클'로 재분류

(4) **국내외 피어 비교** — LGES·삼성SDI는 북미 ESS 매출이 2026년 의미 있는 비중(LGES 3Q26 ESS 30% 초반)으로 올라와 흑자 전환. SK온은 ESS 공급 개시가 1~2년 늦고 EV 파우치 고객(포드·현대차·VW) 판매 변동성에 노출 — BT 섹터 메모리 가설(LGES 사이클 진입, 삼성SDI 사이클 회복)과 비교하면 **SK온은 '구조조정 후 회복 대기'** 단계
