# Teradyne (TER) 기업 개요 (v1.0 — 반도체 테스트 1위권 + 협동로봇 1위 Universal Robots 보유)
> **Fact verify cutoff**: 2026-11-14 (주가 2026-11-13 종가 $249.55 [Yahoo Finance], 시총 약 $38.96B [계산 — 주식수 1.5612억주(2026-10-26, 10-Q 표지) × 종가], 종가 기준 사상 최고가 2026-06-30 $483.84(장중 $487.91) [Yahoo Finance], 2026-10-14 시총 $56.20B [stockanalysis.com])

## ① 기업 분류

(1) Primary / Secondary 분류

**Robotics 부문 Primary 분류: 턴어라운드 초입 (성장 정체 → 흑자 전환) — 매출 정점 $403.1M(2022) 이후 3년 감소, 2026년 반등 + 3Q26 부문 세전이익 첫 흑자(분기 기준 4Q23 이후)**

→ Robotics 매출 YoY: 2023 -6.9% → 2024 -2.8% → 2025 -15.5% → 1Q26 +32.3% → 2Q26 +33.5% → **3Q26 +27.6%** [계산]

→ 부문 세전이익률: 2023 -14.5% → 2024 -21.3% → 2025 -32.2% → 1Q26 -1.1% → 2Q26 -2.6% → **3Q26 +0.4%($0.3M)** (10-K·10-Q 부문 공시)

→ 이익 개선의 원천은 비용 절감이 먼저다 — 2025-01 구조조정(약 150명, 퇴직비용 $13.5M) 후 판관+개발비가 분기 $54~62M(2024) → $42~46M(2026)으로 줄었다. 3Q26에는 매출총이익률도 59.2%로 회복(3Q25 56.1%) (10-Q)

**모회사 Primary 분류: 사이클 (반도체 테스트) — 2026년 AI 테스트 수요로 사상 최대 실적 구간**

→ 전사 매출 2025 $3,190.0M → 9M26 $3,917.4M(+86.0% YoY). 3Q26 전사 영업이익률 30.8%. Robotics 비중은 2023 14.0% → 2025 9.7% → **3Q26 7.3%**로 계속 작아지고 있다 [계산]

**Secondary 노트: 섹터 비교는 Robotics 부문 숫자만 쓴다**

→ 모회사 주가·밸류에이션은 반도체 테스트(메모리·AI 컴퓨트) 사이클이 결정한다. Robotics의 성과가 TER 주가에 주는 영향은 작다 [판단]

(3) 정량적 분류 근거

→ Robotics는 2015~2022년 인수(UR·MiR·AutoGuide)로 매출을 키웠지만, 2022년 이후 협동로봇 수요 둔화(제조업 설비투자 부진)와 중국 경쟁 심화로 매출이 3년 연속 줄었다 [판단 — 회사 10-K 경쟁사 목록에 Jaka·AUBO·Techman·Doosan 명시]

→ 11년 중 흑자는 2017·2018 두 해뿐. 2023~2025 3년 누적 부문 세전손실 -231.3 [계산]

→ 2026년 반등의 내용: ① 매출 1~3Q 모두 +27~34% YoY ② 3Q26 최대 수요처는 "전자·반도체 고객" (회사 10-Q MD&A) ③ 지역별로 아시아태평양 +82.3%, 미주 +36.9%, 유럽 -3.5% (3Q26, 10-Q 매출 세분) [계산]

(4) 산업 분류

→ SIC 3825 (Instruments for Measuring & Testing Electricity) — 모회사 기준

→ Robotics 부문: 협동로봇(Cobot) 팔 + 자율주행 모바일로봇(AMR)

→ 워치리스트 섹터: 로봇 / 서브섹터: 산업·물류 자동화 (트래킹) — 같은 칸: 두산로보틱스, 현대오토에버, Symbotic

(5) 분류 결정 논리

→ 섹터 델타 비교에는 **Robotics 매출·부문 세전이익**을 쓴다. 전사 영업이익률(30%대)을 섞으면 로봇 업황 신호가 반도체 테스트에 묻힌다

→ "턴어라운드 초입"으로 둔 이유: 흑자가 0.4%로 얇고 1개 분기뿐이다. 매출총이익률이 4Q25 42.3%·1Q26 50.5%처럼 분기마다 크게 흔들려 아직 구조적 흑자로 보기 어렵다 [판단]

(6) 적정 밸류에이션 방법

→ 모회사(시장이 실제로 매기는 값): 시총 약 $38.96B, 현금 $466.6M(현금+유가증권, 3Q26 말), 차입금 0 → EV 약 $38.5B. 최근 4개 분기(4Q25~3Q26) 매출 $5,000.8M, 영업이익 $1,606.1M, 순이익 $1,372.9M → **PER 약 28.4배, EV/매출 약 7.7배** [계산]

→ Robotics 단독: 별도 상장·별도 가치 공시 없음. 9M26 연환산 매출 약 $383M [계산]. 피어 EV/매출 2~4배를 적용하면 $0.8~1.5B로 TER 시총의 2~4% 수준 [판단 — 피어 배수는 가정]

→ 섹터 리뷰에서는 밸류에이션보다 **매출 YoY·부문 세전이익률 델타**로 비교한다

(7) 분기 재평가 트리거 (분류 변경 조건)

→ ① Robotics 부문 세전이익률 +5% 이상 2개 분기 연속 → "턴어라운드" → "이익 성장"으로 변경 검토

→ ② Robotics 매출 YoY 마이너스 전환 → "턴어라운드 실패" 재검토

→ ③ 모회사의 Robotics 매각·분사·대형 로봇 인수($3B+) 발표 → 모회사 확장 트리거 발동, 별도 항목 추가

## ② 회사 개요

① 기본 사항

→ 회사명: Teradyne, Inc. (Nasdaq: TER). 1960년 설립, 매사추세츠주 법인 (10-K). CEO 그레그 스미스(Greg Smith, 3Q26 보도자료 인용 기준), CFO 미셸 터너(Michelle Turner, 2025-11-03 취임 — 8-K 2025-10-28)

→ 사업 한 줄: 반도체·전자제품 자동 테스트 장비(ATE) 세계 선두권 + 협동로봇 1위 브랜드 Universal Robots 보유

→ 3개 보고 부문 (3Q26 매출 비중): **반도체 테스트 82.1%** (SoC·메모리·IST) / **Product Test 10.6%** (방산·항공 테스트, 회로기판 테스트, 무선 테스트 LitePoint, 실리콘 포토닉스·고속 인터커넥트) / **Robotics 7.3%** [계산]
