# UBTech (优必选, 9880.HK) 기업 개요 (v1.0 — 휴머노이드 완성체, 풀사이즈 산업용 휴머노이드 매출 1위 주장 · 홍콩 첫 휴머노이드 상장사)
> **Fact verify cutoff**: 2026-11-14 (주가 11/13 종가 72.35홍콩달러, 시총 약 365.6억홍콩달러 [东方财富 집계, 발행주식 5.054억주 × 72.35]. 52주 범위 60.20~156.40홍콩달러 [Yahoo Finance]. 상장 후 월말 종가 최고 226.20홍콩달러(2024-02))

> **기준 메모**: ① 분기 실적 미공시 — 2026-Q3 실적 리뷰는 작성하지 않았다(섹터 델타 비교 제외) ② 2026-04부터 锋龙股份(002931.SZ, 원예기계·자동차 부품) 43.01% 인수로 연결 편입 — 1H26 매출에 1.39억위안 포함, 2H26부터 6개월치가 들어와 YoY가 부풀려진다 ③ 영업이익 = 홍콩 공시 "经营溢利"(F10 표준 항목)

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 전환기 (적자 축소 중) — 매출 2023 10.56억 → 2025 20.01억위안, 상장 후 매년 영업적자**

→ 2025 매출 +53.3%, 1H26 +104.2% YoY. 풀사이즈 휴머노이드(Walker S 시리즈) 매출이 2025년 8.20억위안(+2,203.7%)으로 최대 사업이 됐다 (36氪·北京日报 4/1 보도, 회사 연간 실적 인용)
→ 영업이익률 -115.4%(2023) → -38.7%(2025) → -20.2%(1H26): 적자는 줄고 있으나 흑자 전환 전이다

**Secondary 노트: 레거시 교육·소비 로봇 + M&A로 확장한 복합 구조**

→ 1H26 기준 휴머노이드 46.5%, 기타 지능형 로봇·솔루션(교육·물류 등) 19.4%, 기타 스마트 하드웨어 20.4%, 锋龙 연결 11.0% [보도 인용 澎湃新闻]

(3) 정량적 분류 근거

→ 매출 CAGR(2020~2025) +22.0% [계산], 최근 2개 기간 가속(+53.3% → +104.2%)
→ 적자 축소: 영업적자 -12.18억(2023) → -7.75억(2025), 1H26 -2.57억(1H25 -4.45억 대비 42% 축소 [계산])
→ 영업CF 6년 연속 적자(2020 -6.03억 ~ 2025 -7.84억), 1H26 -7.49억위안 — 성장 자금은 유상증자(상장 후 6회, 누계 70억홍콩달러 이상 [보도 인용 36氪])로 조달

(4) 산업 분류

→ 홍콩거래소: 18C(특수 기술) 아닌 메인보드 일반 상장 (2023-12)
→ 워치리스트 섹터: 로봇 / 서브섹터: 휴머노이드 완성체 (산업 대분류: 모빌리티·에너지전환)

(5) 분류 결정 논리

→ 이익이 없어 사이클·지속성장 분류 대상이 아니다. 매출 성장 + 적자 축소 속도가 주가를 정하는 "고성장 전환기"로 분류
→ 핵심 동인은 풀사이즈 산업용 휴머노이드(자동차·3C·물류 공장)의 수주·인도 — Unitree(연구·교육용 중형 중심)와 고객층이 다르다

(6) 적정 밸류에이션 방법

→ 1차 — PSR: 시총 365.6억홍콩달러 ≈ 316억위안 [계산, 1홍콩달러 = 0.8656위안 — 2026-08-05 인민은행 기준환율, Unitree 상장공고서 인용] / TTM 매출 26.49억위안(2H25 13.80 + 1H26 12.69 [계산]) = 약 11.9배. Unitree(약 120배)의 1/10 수준
→ 2차 — 회사 목표 기반: 2026 매출 목표 35~40억위안 [보도 인용 澎湃新闻] 기준 Forward PSR 7.9~9.0배 [계산]
→ PBR 약 4.5배 [계산] (316억 / 지배주주 자본 69.66억위안, 2026-06 말)

(7) 반기 재평가 트리거 (분류 변경 조건)

→ ① 반기 영업이익 흑자 전환 → 고성장 흑자 기업으로 재분류
→ ② 휴머노이드 매출 YoY +100% 미만 + 매출총이익률 40% 미만 → 성장 둔화 검토
→ ③ 锋龙 등 비로봇 연결 매출 비중 20% 이상 → 복합 기업 할인 검토

## ② 회사 개요

① 기본 사항

→ 회사명: 深圳市优必选科技股份有限公司 (UBTech Robotics), 2012년 선전 설립. 창업자 저우젠(周剑) 회장·CEO
→ 상장: 2023-12-29 홍콩거래소, 공모가 90.00홍콩달러 — 홍콩 첫 휴머노이드 상장사로 불린다. 이후 6회 유상 배정(2025년 3회, 2025-11 최대 31.09억홍콩달러) [보도 인용 36氪]
→ 사업 한 줄: 풀사이즈 산업용 휴머노이드(Walker S·S1·S2), 소형 휴머노이드(Alpha 등), 교육 로봇·솔루션, 물류 로봇, 소비자 기기(로봇 청소기·잔디깎이·수영장 로봇·반려 기기), 정서 교감 로봇(U1, 2026-09 인도 시작)
