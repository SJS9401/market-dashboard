# SPCX (Space Exploration Technologies Corp., SpaceX) — 기업 개요 리포트 v1.0

> **Fact verify cutoff**: 2026-11-14 (주가·시총 = 2026-11-13 종가 $139.11 [Yahoo Finance v8], 재무 = 3Q26 10-Q 2026-10-22 공시분)

**작성일**: 2026-11-14
**대상 기업**: Space Exploration Technologies Corp. (Nasdaq·Nasdaq Texas: SPCX, CIK 0001181412) — 2026-06-12 상장
**작성 표준**: company-overview v4.8 (US — SEC EDGAR 424B4 + 10-Q 2건 + 8-K) + **하이퍼스케일러 렌즈** (BT 지시: "우주가 있지만 단기적으로는 하이퍼스케일러에 가깝다")
**시계열 깊이**: 연간 3년 (FY2023~FY2025, xAI·X 소급 합산) + **7분기 (1Q25~3Q26)** — 신규 상장사라 12년·60분기 표준 미충족 (아래 Source audit 참조)
**워치리스트**: 미국 빅테크 / 하이퍼스케일러 + 소비자·모빌리티 서브섹터 교차 (industry = 클라우드|우주|통신)

> **한 줄 요약**: 매출의 52%·Adj. EBITDA의 56%·CapEx의 84%가 AI(SI) 세그먼트 — 3Q26 기준 SpaceX의 손익 엔진은 **"GPU 컴퓨트 임대(네오클라우드) + 프런티어 모델(Grok) + AI 앱(Cursor·X)"**이고, Starlink는 현금을 버는 2번 엔진, 발사(Space)는 내부 인프라에 가깝다.

## 1. 기업 분류

- **Primary 분류**: **고성장 (AI 인프라형 — 하이퍼스케일러/네오클라우드 투자 사이클 초입)**
- **Secondary 노트**: **꿈 (Starship·Terafab·우주 데이터센터)** + **지속성장 (Starlink 구독 인프라)**. 3개 세그먼트가 서로 다른 분류를 가지는 복합체 — 단기 주가·실적 변동은 SI가 결정

> **Summary Box (가용 기간 FY23~FY25 + 7분기)**
> - 매출 CAGR (FY23→FY25): **+34.1%** ($10.4B → $18.7B) / 3Q26 YoY **+161%** ($5.6B → $14.6B)
> - OPM: FY23 −33.7% → FY24 +3.3% → FY25 −13.9% → **3Q26 +19.1%** (상장 후 첫 흑자 분기)
> - Adj. EBITDA 마진: FY23~FY25 35~38% 박스권 → **3Q26 60.4%** (SI 클라우드 매출 유입)
> - CapEx/매출: FY23 43% → FY25 111% → **9M26 177%** (하이퍼스케일러 평균 대비 수배)
> - 사이클 회수: 측정 불가 (3년 데이터). 현재 위치 = **AI CapEx 확장 1단계 (컴퓨트 1.7GW → YE27 ~13GW 목표)**

### ③ 분류 결정 논리 — 왜 "하이퍼스케일러 렌즈"인가

| 지표 (3Q26) | Space | Connectivity | **SI (AI)** | SI 비중 |
|---|---:|---:|---:|---:|
| 매출 ($M) | 1,767 | 5,248 | **7,560** | **51.9%** |
| Adj. EBITDA ($M) | 357 | 3,499 | **4,953** | **56.2%** |
| 영업이익 ($M) | (7) | 2,367 | 431 | 15.4% |
| CapEx ($M) | 1,606 | 1,543 | **16,444** | **83.9%** |
| 감가상각 ($M) | 185 | 986 | **2,473** | **67.9%** |
| R&D ($M) | 1,225 | 188 | **3,183** | 69.3% |

(1) **매출·EBITDA·CapEx·감가상각이 모두 SI 중심** — 손익 구조가 "대규모 선투자 → 감가상각 → 컴퓨트 임대 매출"인 하이퍼스케일러 모델. 3Q26 SI 영업이익은 Cursor 인수 관련 주식보상 $1.2B 제외 시 $1.6B.
(2) **단, 전통 하이퍼스케일러(AWS·Azure·GCP)와 다른 점 3가지** — 기업 분석 단계에서 반드시 구분할 것:
- **고객 집중**: Customer B(SI) 1곳이 3Q26 전사 매출의 **34.5%** (≈$5.0B, SI 매출의 약 2/3). Bloomberg 보도 기준 Anthropic으로 추정 (SpaceX·Anthropic 미확인). AWS·Azure는 수백만 고객 분산
- **계약 구조**: "예약 컴퓨트 용량 상시 제공 + 고정 월정액" (S-1: Anthropic 계약 $1.25B/월, 2029-05까지, **초기 3개월 후 양측 90일 통지로 해지 가능**). 경영진은 오히려 **단기·시장가(spot) 계약 선호** 발언 — 장기 백로그형 클라우드보다 **CoreWeave류 네오클라우드 + 컴퓨트 가격 베팅**에 가까움
- **수직계열화 범위**: 칩(Terafab, 2028 양산 목표) → 전력(자체 터빈 블레이드 주조) → 데이터센터(COLOSSUS I·II) → 모델(Grok) → 앱(Cursor·X) → 위성망(Starlink)·발사까지. 하이퍼스케일러보다 넓고 Musk 생태계(Tesla) 의존도가 높음
(3) 결론: **Primary = 고성장 (AI 인프라)**. 우주(Starship·화성)는 장기 옵션(꿈)이며 단기 밸류에이션·주가 변동의 driver는 아님.

### ④ 적정 밸류에이션 방법

| 우선순위 | 방법 | 3Q26 기준 수치 | 코멘트 |
|---|---|---|---|
| 1순위 | **EV/Forward Sales·EV/EBITDA (하이퍼스케일러·네오클라우드 비교)** | EV ≈ **$1.84T** (시총 $1.89T + 부채 $38.8B − 현금·단기증권 $89.9B) · EV/TTM 매출 57x · EV/3Q26 연환산 매출 32x · EV/1Q27 가이던스 연환산($140B) **13x** · EV/3Q26 연환산 Adj.EBITDA **52x** | 가이던스 달성 여부가 곧 멀티플 |
| 2순위 | **컴퓨트 GW당 가치 (ROIC per GW)** | SI 연환산 매출 ≈ **$17.8B/GW** (3Q26 $7.56B×4 ÷ 1.7GW) · 경영진 "신규 컴퓨트 투자 회수기간 1년 미만" | CapEx→매출 전환 속도 검증 지표 |
| 3순위 | **SOTP** | Starlink(구독 인프라, EBITDA 마진 67%) + Space(발사 독점) + SI | Tesla 결합 검토 시 필수 |
| 부적합 | PER / PBR | TTM 순손실, 자본은 IPO·주식인수로 급변 | — |

### ⑤ 분기 재평가 트리거

- (5-1) **Nameplate compute (GW)** — YE26 2.5~3GW, YE27 ~13GW(가능성 20GW+) 경로 이탈 여부
- (5-2) **SI 매출/GW·클라우드 단가($/W)** — 컴퓨트 가격 하락 시 사업모델 전제 훼손
- (5-3) **Customer B 비중·계약 변경** — 해지 통지 가능 시점(보도상 2027-01·2027-03 이후) 전후 확인
- (5-4) **CapEx vs OCF + 조달** — 4Q26 CapEx $35~40B, Apollo GPU 금융리스 $40B, 신용등급
- (5-5) **Starlink 가입자·ARPU·Starlink Mobile** (EchoStar 주파수)
- (5-6) **Starship 재사용 마일스톤 (Flight 15 부스터·쉽 동시 캐치)**, V3 위성
- (5-7) **Tesla 결합 특별위원회 결론** (2026-10-20 발표)

### ② 세그먼트 개요 (3Q26 매출 비중 순)

#### (2-1) SI — Super Intelligence (3Q26 매출 52%)
- **구성**: (i) SI 인프라 솔루션 = **외부 고객 대상 GPU 클라우드** (2Q26 개시), (ii) 프런티어 LLM **Grok**, (iii) AI 코딩 플랫폼 **Cursor** (2026-08-14 편입, 3Q26 매출 $608M), (iv) **X** (광고·구독)
- **인프라**: 데이터센터 COLOSSUS·COLOSSUS II (멤피스·미시시피 인근). Nameplate compute **1.7GW (3Q26말)** → 2.5~3GW (YE26E) → **~13GW (YE27E)**. 월 GB300 약 22만 개 설치 중, Vera Rubin 44만 개 학습 클러스터 2Q27말 목표 (3Q26 콜)
- **수익화 원칙**: 내부(Grok·Cursor) vs 외부 임대 약 50:50, 단기·시장가 계약 선호 ("컴퓨트 W당 가치는 모델 발전으로 상승" — Musk)

#### (2-2) Connectivity — Starlink (3Q26 매출 36%)
- 저궤도 위성 **11,100기+** (3Q26), 174개 시장. 소비자 가입자 **13.6M** (+1.6M QoQ), 엔터프라이즈·정부 매출 +91% YoY
- Starlink Mobile 월 사용자 2,200만 명+ (3Q26 콜), EchoStar 주파수로 지상 5G급 서비스 추진
- 3Q26 GPM 55% (관세 환급 일회성 약 3%p 포함), 영업이익률 45% — **전사에서 가장 안정적인 현금 엔진**

![chart15 Starlink](SPCX_chart15_Starlink.png)

| 시점 | 소비자 가입자(M) | ARPU ($/월) |
|---|---:|---:|
| FY23말 | 2.3 | 99 (연평균) |
| FY24말 | 4.4 | 91 (연평균) |
| FY25말 | 8.9 | 81 (연평균) |
| 1Q26 | 10.3 | 66 |

> ARPU 하락 = 저가 요금제·신흥국 가입 비중 확대 + 소비자 정의 변경(3Q26부터 "Starlink Consumer Subscribers"). 가입자 증가가 ARPU 하락을 압도해 소비자 매출 +57% YoY (3Q26).

#### (2-3) Space (3Q26 매출 12%)
- Falcon 9·Falcon Heavy 발사 서비스 + NASA·국방 개발/임무 계약 (Dragon, Starship HLS 등)
- 발사 횟수: FY23 98 → FY24 138 → FY25 170회 / 3Q26 Falcon 33회(고객 12) + Starship 2회
- 궤도 운송량(Mass to orbit): FY25 2,213톤, 이 중 대부분이 **내부 Starlink 위성** → Space 매출은 외부 고객분만 인식. **Space는 독립 사업이라기보다 Connectivity·SI의 원가 우위 인프라**
