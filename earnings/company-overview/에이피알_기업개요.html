# 에이피알 기업 개요 (v1.0 — 메디큐브·홈뷰티 디바이스, K뷰티 글로벌 고성장 브랜드사)
> **Fact verify cutoff**: 2026-11-15 (재무·주주 = 2026.09 분기보고서(2026-11-13 공시), 주가 = Yahoo v8 2026-11-13 종가 236,000원, 시가총액 약 8.83조)
> ⚠ **IFRS 18 조기 적용(2026 회계연도~)**: 회사 IR은 2025년 비교 수치를 재작성(예: FY25 영업이익 3,655억 → 3,614억, 2Q25 846억 → 813억). 본 문서의 분기·연간 시계열은 **DART 원공시(재작성 전)** 기준이며 2026 분기는 IFRS 18 기준. 2025↔2026 YoY는 회사 발표치와 1\~4%p 차이 날 수 있음.

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (매출 2023→2025 2.9배, 3Q26 누적 이미 전년 연간 초과)**

→ 2025 매출 1조 5,273억(+111%), 영업이익 3,655억(+198%), OPM 23.9%. 3Q26 누적 매출 2조 1,340억, 영업이익 5,035억(OPM 23.6%)

→ 6개 분기 연속 매출 YoY +100% 이상(2Q25\~3Q26). 성장 동력은 **메디큐브 화장품의 미국·유럽 확장** — 해외 매출 비중 2024 55% → 2025 80% → 3Q26 94%

**Secondary 노트: 브랜드 유행 사이클 리스크 + 이익률 정점 통과 신호**

→ 3Q26 OPM 20.8%로 직전 분기(24.8%) 대비 -4.0%p — 원화 강세·유럽 물류비·광고선전비(3Q26 매출 대비 20.9%) 부담. 매출은 QoQ +0.7%로 정체 `[판단: 성장 델타 '둔화' 첫 신호]`

→ 화장품은 100% ODM 외주(코스맥스 등) — 진입장벽이 브랜드·마케팅·채널 실행력에 있어 히트 제품 수명이 핵심 변수 `[판단]`

**Entity 구조 (2026.09 기준)**

→ **(1) 화장품/뷰티 (3Q26 누적 1조 7,831억, 83.6%)** — 메디큐브(더마코스메틱, 매출의 90% 이상 — 언론), 에이프릴스킨(저자극 기초), 포맨트(향수·바디), 글램디바이오(이너뷰티)

→ **(2) 뷰티 디바이스 (3,293억, 15.4%)** — 메디큐브 에이지알(AGE-R): 부스터프로·부스터프로X2(2026.03)·부스터 글로우·하이 포커스 샷 등. ADC(디바이스 R&D센터) 개발 + 자회사 에이피알팩토리(가산·평택) 생산

→ **(3) 기타 (215억, 1.0%)** — 널디(스트릿 의류), 포토그레이(셀프 포토 스튜디오, 가맹). 비핵심으로 축소 중

→ **연결종속회사 13개(2025말)**: 국내 2(에이피알커뮤니케이션즈, 에이피알팩토리 — **2026.12.31 흡수합병 예정**) + 해외 11(미국·일본·홍콩·싱가포르·대만·상하이·캐나다·말레이시아·프랑스·베트남·영국), 전부 100% 지분

(3) 정량적 분류 근거

→ **성장 가속**: 매출 YoY 2023 +31.7% → 2024 +38.0% → 2025 +111.3% → 1\~3Q26 각 +123% / +134% / +100%. 성장 가속 구간은 2Q25부터 6개 분기

→ **이익률 레벨업**: OPM 2022 9.9% → 2023 19.9% → 2025 23.9%. 판관비율(CIR) 63.4% → 52.7%로 영업 레버리지. 매출총이익률(GPM)은 73\~77%로 안정 — 이익률 개선은 원가가 아니라 판관비 레버리지에서 나옴

→ **현금 창출**: 2025 OCF 3,410억, FCF 3,231억(FCF/순이익 112%). 단 **3Q26 누적 OCF 537억**으로 급감 — 재고 +3,400억(1,655 → 4,980억), 매출채권 +1,214억(오프라인 B2B 확대·4Q 성수기 대비)

(4) 산업 분류

→ **한국표준산업분류** — 20423 화장품 제조업 (DART 기업개황)

→ **KRX** — 유가증권시장(KOSPI) 상장 2024.02.27 (특례상장 아님). 중견기업

→ **워치리스트 섹터** — 소비재 > **뷰티 / 브랜드사** 핵심 종목

→ 실질 분류: 제조 설비 없는 **브랜드·마케팅 플랫폼형 화장품사**(화장품 ODM 100%) + 디바이스 수직계열화(R&D·생산 내재화)

(5) 분류 결정 논리

(1) **매출 기준** — 2년 연속 매출 2배 성장, 분기 YoY +100% 지속 → 고성장 확정

(2) **이익 기준** — 연간 적자 없음(2019 이후), OPM 20%대 진입 → '꿈' 아님

(3) **사이클 여부** — 산업 수요 사이클(설비·가격)이 아니라 **브랜드 확산 S커브**. 다만 K뷰티 브랜드사는 히트 제품·채널 소진 시 매출이 꺾이는 '유행 사이클' 전례가 많아 Secondary로 명시(예: 2016\~2017 중국향 K뷰티, 에이피알 자체도 2021 OPM 5.5% 정체 구간 경험) `[판단]`

(6) 적정 밸류에이션 방법

→ **1차 — PER (Forward)**: 고성장 + 순현금 + 고ROE 구조 → 이익 성장률 대비 PER(PEG)가 적합. 2026-11-13 시가총액 8.83조 기준 **Trailing 4Q 순이익(4Q25\~3Q26) 4,678억 → PER 18.9배** / 2025 순이익 2,897억 → 30.5배 `[계산]`

→ **2차 — EV/EBIT**: 순현금성자산(현금+금융자산, 3Q26 약 2,000억) 차감. Trailing 4Q 영업이익 6,338억 기준 EV/EBIT 약 13.6배 `[계산]`

→ **PBR 미사용 근거**: 자본 6,640억 대비 PBR 13.3배 — 무형(브랜드) 가치가 장부에 없고, 배당으로 자본이 계속 유출되는 구조라 PBR 무의미

(7) 분기 재평가 트리거 (**분류 변경 조건**)

→ ① **분기 매출 YoY +50% 미만 2분기 연속** → '고성장'에서 '지속성장'으로 하향 검토

→ ② **분기 매출 QoQ 역성장 + OPM 20% 미만** → 유행 사이클 피크 시그널. 3Q26은 QoQ +0.7%·OPM 20.8%로 경계선 `[판단]`

→ ③ **4Q26 매출이 회사 목표 내재치(약 8,660억 = 3조 − 3Q 누적) 미달** → 가이던스 신뢰도 하락

→ ④ **재고자산/분기매출 비율 정상화 실패**(3Q26 재고 4,980억 = 3Q 매출의 64%) → 재고평가손실·할인판매 리스크

(2) 사업부별 개요 (매출 비중 큰 순서)

**A. 화장품/뷰티 (3Q26 누적 83.6%)**

→ 메디큐브가 핵심. 피부고민별 라인업(PDRN 핑크 라인, 콜라겐 라인, 제로모공패드, 딥비타C 등 — IR 회사소개 자료) + 디바이스와 함께 쓰는 '홈 클리닉' 포지션

→ 생산은 **100% ODM 외주**: 코스맥스, 노디너리, 엔코스, 한국화장품제조 등. 원재료(완제품) 매입액 2024 2,175억 → 2025 3,686억 → 3Q26 누적 7,028억

→ 2026 신규 제품군: '콜라겐 글로우 선크림'(2Q26 누적 40만개) — 선케어로 카테고리 확장

**B. 뷰티 디바이스 (15.4%)**

→ 메디큐브 에이지알: 부스터프로(2023.10)·부스터프로X2(2026.03)·부스터 글로우(2Q26)·하이 포커스 샷 플러스·부스터 브이 롤러 등. 피부과·에스테틱 시술(고주파·EMS·초음파)을 집에서 구현하는 컨셉

→ **밸류체인 내재화**: ADC(R&D) → 에이피알팩토리(가산 1공장 2023, 평택 2공장 2024) 생산 → 자사 판매·A/S. 2026.12.31 에이피알팩토리 흡수합병 예정

→ 2023년엔 디바이스 매출이 화장품을 앞섰으나(2,162 vs 2,143억), 디바이스로 유입된 고객이 화장품 반복구매로 넘어가는 구조 `[판단]` → 2025부터 화장품 중심으로 비중 역전. 3Q26 디바이스 매출 -18% YoY로 첫 역성장

**C. 기타 (1.0%)**

→ 널디(의류), 포토그레이(셀프 포토 가맹). 회사 표현 '비핵심 사업부 비중 축소' — 매출 2022 1,010억 → 3Q26 누적 215억
