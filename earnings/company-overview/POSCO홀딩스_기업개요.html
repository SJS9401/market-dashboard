## 1. 기업 분류

- **Primary 분류: 사이클 (철강 스프레드 사이클 — 중국 철강 수급 + 철광석·원료탄 가격)** — 연결 영업이익의 47\~97%(2016\~2025)를 포스코 별도(포항·광양 제철소)가 벌고, 그 이익은 판가 − 원료비 스프레드에 따라 움직인다. 12년 OPM range 2.6\~12.1% (폭 9.5%p)
- **Secondary 노트: 지주사 할인 + 비철강 옵션 (이차전지소재·리튬 / 인프라·LNG)** — 2022-03 지주사 전환 후 인프라(포스코인터내셔널·포스코이앤씨)가 철강과 맞먹는 이익을 내는 분기가 생겼고(1Q26 인프라 4,050억 > 철강 3,450억), 리튬·니켈·양극재는 아직 적자지만 주가를 크게 움직인다 (2023-07 이차전지 랠리 54.3조, 2026-05 리튬 반등 고점 542,000원). **이익은 철강, 주가 변동성은 이차전지**인 구조

### ② 산업 분류

- **DART 업종코드**: 2411 (1차 철강 제조업) — 지주사 전환 후에도 업종코드 유지 [OpenDART 기업개황]
- **사업부문 (3Q26 분기보고서)**: 철강 / 인프라(무역·건설·물류 등) / 이차전지소재 / 기타 — 연결 종속회사 202개사 (철강 80, 무역 39, 건설 24, 물류 등 16, 이차전지소재 16, 기타 23)
- **워치리스트**: 철강·비철 섹터 → 철강 서브섹터 (label = 철강 부문). 섹터 리뷰 합산 시 철강 부문(포스코 + 해외철강)만 사용
- **글로벌 피어**: Nippon Steel (5401.T), JFE (5411.T), Baoshan Iron & Steel (600019.SS), ArcelorMittal (MT), Nucor (NUE, 전기로), 국내 현대제철 / 이차전지소재 피어: Albemarle (ALB, 리튬), SQM, Umicore — 국내 포스코퓨처엠은 별도 기업 개요(`포스코퓨처엠_기업개요.md`) 참조

### ③ 분류 결정 논리

(1) 가장 큰 사업부 기준: 철강 부문이 합산 매출의 약 51%(2025, 59.4조 / 내부거래 제거 전 116.4조 합산), 연결 영업이익의 대부분 → **사이클(철강)**

(2) 사이클 사업부 영업이익 비중 우선 sub-rule: 포스코 별도 OP / 연결 OP = 47\~97% (2016\~2025, 10년 평균 68%). 해외철강까지 넣은 철강 부문은 2025 기준 연결 OP의 108% (인프라 6,760억 + 이차전지 -4,410억 + 연결조정이 상쇄) → **사이클 유지**

(3) Boundary case 처리:
→ 인프라 부문이 연결 OP의 40% 이상을 **4개 분기 연속** 유지하면 (1Q26 57%, 2Q26 60%, 3Q26 52% — 현재 3개 분기 연속 충족) → "사이클 + 지속성장(인프라·LNG) 혼합"으로 Secondary 격상 검토
→ 이차전지소재 부문이 흑자 전환 후 OPM 5%+를 2개 분기 유지하면 → 테마형 Secondary("리튬·양극재 성장") 추가. 2026-11 현재 2Q26 한 분기만 흑자(410억)

(4) 피어 대비: 현대제철은 철강 단일(봉형강·판재) 순수 사이클, 일본제철·JFE도 철강 비중 80%+. POSCO홀딩스는 **철강 사이클 + 무역/LNG(포스코인터내셔널) 안정 이익 + 리튬 옵션**을 함께 가진 유일한 대형 철강 지주사 — 그래서 사이클 저점에서도 PBR이 피어와 같이 0.3배대로 내려오는 대신, 리튬 뉴스에 주가가 따로 움직인다

### ④ 적정 밸류에이션 방법

- **1순위 PBR (사이클 밴드)** — 이익이 철강 스프레드에 좌우되고 12년 ROE가 0.4\~13.1%로 흔들려 PER은 저점에서 의미가 약하다. 현재 PBR **0.36배** (시총 20.5조 / 3Q26 지배주주 자본 56.2조, 2026-11-27 종가 기준) — 2015-12(14.5조, 약 0.35배)·2020-03(14.0조, 약 0.32배) 저점권과 같은 구간
- **2순위 SOTP (지주사)** — 상장 자회사(포스코인터내셔널·포스코퓨처엠·포스코DX·포스코스틸리온·포스코엠텍) 지분가치 + 비상장 포스코(100%) 철강 가치 + 리튬(아르헨티나 염호·필바라 합작) − 순차입. 지주사 할인율이 핵심 변수. 3Q26 상장 그룹사 지분 매각 대금 2.5조원 유입 [3Q26 IR] — 언론은 지분율 50% 수준까지 낮추고 확보 자금 중 약 90%를 리튬 등 전략자원에 쓰는 계획으로 보도 [IB토마토 2026-08-06]
- **보조 PER** — LTM 지배순이익 1.17조 (4Q25 -2,253억 + 9M26 13,934억) 기준 약 17배. 사이클 저점 이익 기준이라 높게 보이는 구간
- **피어 차별화**: 현대제철은 PBR 단독, POSCO홀딩스는 PBR + SOTP 혼합 — 이차전지·인프라 자회사 지분가치가 시총의 상당 부분을 차지하기 때문

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- 포스코 별도 OP 비중이 연결 OP의 **40% 미만으로 4개 분기 연속** 하락 → Primary를 "사이클(철강) + 지속성장(인프라)" 혼합으로 재분류 검토 (9M26 38% — 1개 분기 시계열로는 2Q26 33%, 3Q26 48%)
- 이차전지소재 부문 **연간 흑자 전환** + 매출 비중 5% 이상 → Secondary에 "리튬·양극재 성장" 추가
- 상장 자회사 지분율 50% 미만으로 하락(연결 제외) → 연결 매출 구조가 바뀌므로 분류 기준 자체 재설정
- 철강 OPM이 5%pt 이내 range에서 **8개 분기 연속** 안정 → 사이클 진폭 축소로 보고 PER 비중 상향

- 생산능력: 포스코 조강 40,461천톤(2024) → 39,810천톤(2025) — 포항 1선재(2024-11)·3기 코크스오븐(2025-07)·2FINEX(2026) 등 노후 설비 정리 [3Q26 분기보고서]
- 판매 경로(2025 판매량): 내수 중 61%는 고객사 직판, 39%는 가공센터·포스코인터내셔널 경유

- 포스코인터내셔널: 2023 이후 연 1.1\~1.2조 OP로 안정. 2026 분기 3,580→4,290→4,010억으로 사상 최고권 (LNG·세넥스·구동모터코아)
- 포스코이앤씨: 2025 OP -4,520억 (2Q25 -910, 3Q25 -1,950, 4Q25 -1,900억 — 현장 안전사고 이후 공사 중단·원가 재산정). 2026 분기 440\~530억 흑자 회복이 3Q26 연결 YoY +48%의 핵심

**이차전지소재 — 옵션 가치**
- 부문 OP: 2023 -1,610억 → 2024 -2,780억 → 2025 -4,410억 → 9M26 +170억 (2Q26 첫 분기 흑자 410억)
