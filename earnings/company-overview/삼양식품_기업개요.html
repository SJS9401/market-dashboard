## 1. 기업 분류

- **Primary 분류: 고성장 (Secular 글로벌 브랜드 성장 — '불닭' 단일 브랜드 수출 엔진)** — 12년 매출 CAGR +20.1%, 영업이익 CAGR +43.7%, 해외 매출 CAGR +49.6%. 해외 비중 7%(2014) → 80%(2025) → 83.5%(3Q26). 성장 제약은 수요가 아니라 **생산 CAPA** (2026 '공급 제약 → 체질 개선의 해' — 회사 IR·셀사이드 간담회)
- **Secondary 노트: 필수소비재 base의 지속성장 성격** — 라면은 경기 방어적 필수소비재라 업황 사이클(반도체·화학식)은 없음. OPM 변동은 '원가(곡물·팜유)·채널 재고·환율'에 의한 **수익성 미니사이클**(2015, 2021\~22 저점)이며 매출 자체는 2015·2021 두 해를 빼고 매년 성장

### ② 산업 분류

- 산업: **식품 제조업 — 라면(즉석면)·소스 브랜드 제조/수출** (DART 업종코드 108 기타 식품 제조업)
- 워치리스트: 소비재 대분류 **개별주 카드** (2026-11-16 신설) — 국내 음식료 피어(농심·오뚜기)는 내수 비중이 높아 '성장 피어'가 아니므로 섹터 리뷰 묶음에서 제외, 실적 리뷰 단독 판정
- 산업기초 연결: `industry=음식료`
- 성격 구분: 매출의 91.7%가 면스낵(2025), 그중 84.6%가 수출 → 실질적으로 **'수출형 글로벌 브랜드 소비재'** (국내 라면 점유율은 12.1%로 3위 — aT 2025 소매 기준)

### ③ 분류 결정 논리

(1) **가장 큰 사업부 기준 적용 시** — 면스낵(91.7%)은 필수소비재 라면 → 디폴트는 '지속성장(방어주)'. 그러나 삼양 면스낵 매출의 84.6%가 수출이고 2022→2025 수출 CAGR이 +45%라 국내 라면 산업(성숙기, 연 0\~2% 성장)과 성장 궤적이 완전히 다름 → **고성장**

(2) **이익 기여 sub-rule** — 영업이익 성장의 원천이 '해외 ASP·믹스'(미국·유럽 고ASP 채널, 2023 GPM 34.9% → 2025 44.8%). 국내 사업은 매출 4,680억(2025, IR 내수)으로 정체 수준. 이익의 대부분이 해외에서 발생 → 국내 음식료 방어주 프레임 적용 불가

(3) **Boundary case 처리** — ① 성장률이 수요가 아닌 CAPA에 의해 결정되는 '공급 제약형 고성장' (2025 면류 가동률 93.6%, 3Q26 원주 101% · 익산 119% · 밀양 86%) → 증설 계단(2022 밀양1 → 2025 밀양2 → 2027.01 中 자싱 8라인)마다 매출 레벨이 점프. 증설 공백기(2026)에는 성장률이 일시 둔화돼도 고성장 분류 유지. ② 단일 브랜드 집중(불닭) → 유행성 소비재(fad) 리스크가 Secondary로 상존. 해외 YoY가 CAPA 여유 상태에서 둔화하면 그때 '수요 피크'로 재판정

(4) **피어 대비** — 농심(해외 비중 26.2%, 2024)·오뚜기(10.2%)는 '내수 성숙 + 해외 옵션' → 지속성장/방어. 삼양은 해외 77.3%(2024)로 국내 라면 3사 중 유일한 수출 주도형. 글로벌 라면 대형사(닛신·인도푸드·캉스푸)는 자국 내수 기반 다국적 생산 구조라 성장률이 한 자릿수 — 삼양은 '한국 생산 → 수출' 구조의 고성장 브랜드라 비교 대상은 오히려 **글로벌 고성장 브랜드 소비재**(에너지음료·K-뷰티 브랜드사 등)

### ④ 적정 밸류에이션 방법

- **PER (12M Forward) 1순위** — 이익 성장(영업이익 3Q26 누적 +42.7% YoY)·고ROE(2025 37.6%) 브랜드 소비재. 자산 대비 이익 창출력이 핵심이라 PER이 가치 다이얼
- **PEG 보조** — 멀티플은 '향후 2\~3년 이익 성장률'에 연동. CAPA 증설 일정(자싱 2027.01)이 이익 성장률 가시성을 결정 → 증설 지연 시 PEG 상단 압축
- **PBR 부적합** — ROE 37%대로 PBR 6배대(2026-11-16 시총 9.68조 / 자본총계 1.58조 = 6.1배)가 정상. 사이클 종목식 PBR 밴드 하단 매수 논리는 적용 불가
- **EV/EBITDA cross-check** — CapEx 대규모 집행기(2025 4,614억, 2023\~2027 주요 CapEx 7,426억)에는 감가상각 증가로 PER이 왜곡될 수 있어 EBITDA(3Q26 OPM+감가 = EBITDA 마진 27.5%, IR)로 교차 확인
- **피어 차별화**: 농심·오뚜기는 '내수 음식료 멀티플'(성숙기 PER 밴드), 삼양은 '해외 고성장 브랜드 멀티플'. 현재 trailing PER 약 20.7배(시총 9.68조 / 4Q25\~3Q26 순이익 4,668억) — 고점(2025-09 시총 12.5조) 대비 디레이팅된 상태

### ⑤ 분기 재평가 트리거 (분류 자체가 바뀌는 조건)

- **해외 매출 YoY가 2개 분기 연속 +10% 미만 & 면류 가동률 80% 미만 동시 발생** → 수요 피크 신호 → '고성장 → 지속성장' 재분류 검토 (CAPA 부족에 의한 둔화는 제외)
- **OPM 4개 분기 연속 18% 하회** (2024\~ 레벨 이탈) → ASP 프리미엄 소멸 → 고성장 프리미엄 재검토
- **중국 법인 매출 YoY 2개 분기 연속 마이너스 + 전사 매출 QoQ 역성장** → 유행성 소비재(fad) 리스크 현실화 → Secondary를 '사이클(유행)'로 격상
- **불닭 외 브랜드(맵탱·탱글·삼양1963·짜르르 등) 매출 비중 20%+** → 멀티브랜드 → Secondary '지속성장' 격상 (단일 브랜드 디스카운트 해소)

### ④ 주요 리스크

- **단일 브랜드 집중**: 면스낵 91.7%, 해외 매출의 대부분이 불닭 시리즈 — 유행 피크(fad) 리스크가 밸류에이션 디스카운트의 핵심
- **중국 채널 재고 사이클**: 중국 법인 매출의 분기 변동이 큼 (3Q25 1,846억 → 4Q25 1,482억, 광군제 부진). 과거 2018·2021·3Q22 역성장이 모두 중국 재고와 연결
- **환율**: 수출 80%+ → 원화 강세 시 매출·마진 동반 압박 + 외화자산 환산손실 (3Q26 순이익 -35% QoQ). 통화선도로 일부 헤지 (2025 통화선도 이익 64억)
- **원재료·에너지**: 밀가루(삼양제분 내재화)·팜유·감자전분, LNG·유가 — 2022 원가 급등기 OPM 9.9%. 3Q26에도 팜유·에너지 원가 상승 언급
- **미국 관세**: 2025 미국 수입관세 인상 영향 (3Q25 IR) — 가격 인상으로 대응, 3Q26 관세환급금 인식
- **CAPA 공백**: 2026은 밀양2 풀가동·자싱 미완공 구간 — 공급 제약으로 성장률 둔화 (2026 매출 YoY +25\~39%)
- **식품 규제**: 2024.06 덴마크 리콜(캡사이신, 일부 해제) 등 국가별 매운맛·성분 규제
- **공정위 조사**: 2026-10-28 라면 4사 현장조사 (언론) — 결과 미정
- **지배구조·오너 리스크**: 2019 국세청 고발 사건(회사·임원 1인) 2026 3Q 대법원 확정 종결 / 오너 일가 횡령 사건 이력(2019\~2020, 언론) / 상표권 지주사 귀속에 따른 대주주 거래 / 3세 승계 증여(2026.07)
- **소송**: 원고 23건·피고 3건 (3Q26) — 경영진은 재무 영향 중요하지 않다고 판단
