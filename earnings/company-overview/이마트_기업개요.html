## 1. 기업 분류

- **Primary 분류: 턴어라운드 — 성숙 오프라인 할인점 + M&A로 비대해진 다각화 지주형 유통** — 연결 매출은 2014 13.15조 → 2025 28.97조로 2배 넘게 늘었지만(CAGR +7.4%) 대부분 **인수·연결편입(2018 신세계건설, 2019 미국 GFH, 2020 신세계I&C, 2021 이베이코리아(G마켓)·SCK컴퍼니(스타벅스))** 효과. 같은 기간 연결 OPM은 4.4% → 1.1%로 무너졌고 2023은 영업적자(-469억). 2024\~2026은 구조조정(에브리데이 합병·신세계건설 완전자회사화·G마켓 JV 전환·저수익 점포/사업 정리)로 본업(별도) 이익을 복원하는 국면
- **Secondary 노트: 자산가치(PBR) 딥밸류 + 정책 옵션** — 3Q26 말 지배자본 11.28조 대비 시총 1.74조(PBR **0.15배** [계산]). 유형자산 9.04조·투자부동산 1.71조·관계기업(스타필드·G마켓 JV 등) 4.43조 보유 [DART 분기보고서(2026.09) 연결 재무상태표]. 대형마트 새벽배송(영업시간 규제) 완화 추진(2026-02-08 고위 당정 합의 [MTN 2026-02-10])이 정책 옵션

### ② 산업 분류

- 산업: **오프라인 대형마트(할인점)·창고형 할인점(트레이더스)·SSM(에브리데이) + 온라인(SSG.COM) + 커피(스타벅스, SCK) + 편의점(이마트24) + 호텔·부동산·건설·IT·미국 식품소매** — 국내 대형마트 3사(이마트·홈플러스·롯데마트) 과점이지만 쿠팡·네이버 등 온라인과 직접 경쟁
- DART 업종: 471 종합 소매업 [OpenDART 기업개황]
- 워치리스트 섹터: **여행·레저·유통** / 서브섹터: **유통**
- 시장 지위: 할인점 132개·트레이더스 24개·에브리데이 248개 (3Q26 말) [IR 3Q26]. 2026 출점 후 트레이더스 포함 158개 vs 롯데마트 112개·홈플러스 98개(계획) [한경비즈니스 2026-02-05]. 이마트24 5,504개점, 스타벅스(SCK) 2,219개점, 노브랜드 279개점, 미국(PK Retail Holdings) 57개·몽골 6개·베트남 3개 [IR 3Q26]

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준**: DART 보고부문 '유통업'(이마트 별도+SSG.COM+이마트24+신세계프라퍼티 등) 21.16조 = 부문 합계(내부거래 차감 전)의 **67.3%** [DART 사업보고서(2025.12) 연결 주석5, 계산]. 별도 본체(할인점·트레이더스·전문점·에브리데이) 순매출 16.63조 = 연결의 57.4% [DART OFS, 계산]. 생필품·식품 중심이라 수요는 경기에 둔감하지만 **채널 점유율이 온라인으로 구조적으로 이동** → '지속성장'이 아니라 '성숙/역성장 방어'
(2) **이익 비중 sub-rule**: 2025 부문 영업이익 — 유통업 3,025억 · 식음료(SCK·신세계푸드) 2,000억 · 호텔·레저 596억 · 해외 562억 · 부동산 521억 · IT 497억 · **건설 -1,569억** · 조정(PPA 상각 등) -2,407억 [DART 주석5]. 별도 OP 2,771억 [DART OFS]. 이익의 축은 여전히 할인점·트레이더스지만 **자회사 적자(건설·SSG.COM)와 연결조정이 본체 이익을 상쇄**하는 구조 → 연결 OPM 1%대
(3) **Boundary case 처리 — 턴어라운드 vs 사이클**: 2024 471억 → 2025 3,225억(+584.8%) 회복은 경기 반등이 아니라 ① 에브리데이 합병·통합 매입 원가 절감 ② 할인점 리뉴얼(스타필드 마켓 등) ③ 2024 희망퇴직 등 비용 구조조정 ④ G마켓 연결 제외 효과 [IR 4Q25, 한경비즈니스 2026-02-05]. 3Q26 연결 OP 461억(-69.6%)은 본체 개선(+525억)에도 SCK(-1,053억 YoY)·건설(-540억 YoY)이 끌어내림 [IR 3Q26] → **턴어라운드는 '본체'에서만 확인, 연결은 미완**
(4) **국내 유통 피어 + 글로벌 cross-ref**:
→ **롯데쇼핑**: 할인점(롯데마트)+백화점+e커머스 구조로 가장 가까운 비교 대상. 비교 수치는 `롯데쇼핑_기업개요.md` 및 ④-1 유통 공통 비교 박스 참조
→ **BGF리테일·GS리테일**: 편의점 비교군(이마트24 5,504점 vs CU·GS25 각 1.8만점대 — 점포수 비교는 해당 문서 참조)
→ 글로벌: Walmart·Costco(창고형) 대비 트레이더스는 회원제 없는 창고형 — 3Q26 트레이더스 OPM 4.7% vs 할인점 2.8% [IR 3Q26, 계산]

### ④ 적정 밸류에이션 방법

- **PBR·자산가치(SOTP) 우선, EV/EBITDA 보조, PER은 부적합**
→ 연결 지배순이익이 2023 -891억·2024 -5,900억·LTM(4Q25\~3Q26) **-2,458억** [계산: 4Q25 -1,482억 + 9M26 -976억, IR 3Q26·4Q25] 적자 → **PER N/M**
→ **PBR 0.15배** [계산: 시총 1.74조 / 3Q26 지배자본 11.28조]. 연말 PBR 밴드 (연말 종가 × 발행주식 / 지배자본 [계산]): 고점 **0.92배(2017)**·0.82배(2014) → 저점 **0.17배(2024)** → 2025말 0.20배
→ **EV/EBITDA 약 8.2배** [계산: 시총 1.74조 + 순차입금 7.58조(3Q26, 차입금·사채 9.24조 − 현금 1.66조, 리스 제외) + 비지배지분 2.27조 = 11.59조 / LTM EBITDA 1.42조(IR: 4Q25 3,032억 + 9M26 11,150억)]. ⚠ IR EBITDA는 사용권자산 상각을 포함(IFRS16)하는 반면 순차입금은 리스부채(3.22조) 제외 — 리스 포함 시 EV 14.8조·약 10.4배
→ **SOTP 관점**: 스타필드(하남·고양·안성·수원 51\~50%), SCK 67.5%, 조선호텔, 신세계프라퍼티 부동산, G마켓 JV(그랜드오푸스홀딩, 신세계 측 50%) 지분이 시총을 크게 상회한다는 것이 셀사이드 논리 — "조선호텔·SCK 2곳 연간 영업이익 2,000억+" [한경비즈니스 2026-02-05]. 개별 가치는 이번 버전 미산정
- **배당**: DPS 2,500원 (2025 사업연도, 2,000원 → 상향) → 배당수익률 **4.0%** [계산: 2,500 / 62,900]. 밸류업 계획: 2025\~2027 최저 DPS 2,500원·최저 배당성향 25%, 자사주 2025-04 28만주 소각 + 2026 28만주 추가 소각 예정, 2027 목표 매출 34조·영업이익 1조 [한국경제 2026-02-20(밸류업 리포트)]
- **피어 차별화**: 롯데쇼핑과 같은 '저PBR 유통'이지만 이마트는 ① 오너(정용진 28.85%) 단일 지배 + 스타벅스·스타필드 같은 프리미엄 자산 ② 건설·온라인 자회사 손실 변동성이 커 연결 이익 가시성이 낮음

#### ④-1 유통 공통 비교 박스 (통일 기준, 2026-11-28 통합 검수)

→ **읽는 법**: ① **편의점 2강(BGF리테일·GS리테일)** = OPM 2\~3%대 좁은 밴드의 지속성장형 — BGF리테일은 순현금·ROE 15.6%로 PBR 1.65배 프리미엄, GS리테일은 멀티채널(수퍼·홈쇼핑) 구조조정 중이라 PBR 0.51배·ROE 1.3%. ② **백화점 중심(현대백화점·롯데쇼핑)** = 3Q26 OP +30%·+35%로 이익 개선이 가장 뚜렷, 둘 다 부동산 자산 대비 PBR 0.15\~0.42배의 자산가치 구간. 롯데쇼핑은 이익의 80\~90%가 백화점 집중·순차입금 8.4조가 부담. ③ **이마트** = 별도(할인점·트레이더스)는 3Q26 OP +46%로 회복했지만 스타벅스·G마켓 등 자회사 손실로 연결 OP -70%·LTM 적자 — PBR 0.15배로 5사 중 최저(롯데쇼핑과 공동).

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **연결 OPM 2%+ 4개 분기 연속** (LTM 0.6%) 또는 2027 영업이익 1조 목표 경로(LTM 5,000억+) 진입 시 → '턴어라운드 완료' → Primary를 '성숙 유통(배당·자산형)'으로 전환 검토
- **신세계건설 연간 영업적자 해소** (2023\~2025 누적 -4,136억 [DART 주석5]) 시 → 연결 이익 변동성 축소, PER 재사용 검토
- **SCK(스타벅스) 분기 OP가 2Q26 이전 수준(분기 300\~600억) 회복 실패 2개 분기 연속** 시 → 식음료 부문 이익 축 훼손으로 SOTP 할인 확대
- **대형마트 영업시간·새벽배송 규제 완화 법 개정 통과** 시 → 온라인 그로서리(SSG.COM 연계) 성장 옵션 반영
- **G마켓 JV 지분법손실 분기 -500억 이상 지속** (3Q26 지분법손익 -506억 [IR 3Q26]) 시 → 자산가치 할인 요인 추가

### ③ 사업부별 디테일

(1) **할인점 — 매출 정체, 이익률은 2024 바닥 후 복원 중**
→ 총매출 2021 11.84조 → 2025 11.65조 (4년 -1.6%), 점포 2018 143개 → 2025 133개 (폐점 > 출점) [IR]
→ OP 2017 5,975억 (OPM 5.1%) → 2024 -199억 → 2025 872억 → **9M26 1,439억 (+431억 YoY)** [IR 3Q26]. 3Q26 기존점 +10.6% (추석 시점 차이 2026-09-25 vs 2025-10-06 포함), 객수 +5.3% [IR 3Q26]
→ 드라이버: 리뉴얼(스타필드 마켓·푸드마켓 포맷), 초저가 이원화(5K Price 식품 223개·와우샵 5,000원 이하 생활용품) [한경비즈니스 2026-02-05], 통합매입(에브리데이 합병)
(2) **트레이더스 — 별도의 성장 엔진**
→ 총매출 2017 1.52조 → 2025 3.85조 (CAGR +12.3% [계산]), 별도 총매출 비중 10.5% → 21.4% [IR, 계산]
→ 3Q26 분기 총매출 1.17조 (+16.6%, 분기 최고) · OP 552억 (+40.5%) · 기존점 +13.3% · 객수 +8.0% [IR 3Q26, CEO스코어데일리 2026-11-11]. 2025 마곡·구월 출점으로 24개 [DART 연혁]
(3) **SCK컴퍼니(스타벅스) — 이익 2위 사업, 2026 브랜드 리스크**
→ 2022\~2024 OP 1,224 → 1,908억 성장 [IR]. 2026-05 '탱크데이' 논란 후 프리퀀시 행사 미진행 → 2Q26 OP -184억, 3Q26 -453억 [IR 2Q26·3Q26]. MoM 점진 회복 추세라는 회사 설명 [IR 3Q26]. SCK PPA 상각 분기 155\~156억이 연결조정으로 별도 반영 [IR 3Q25·3Q26]
(4) **이익 outlier — 신세계건설**
→ 건설 부문 OP 2022 -287억 → 2023 -1,834억 → 2025 -1,569억 [DART 주석5]. 3Q26 건설 영업이익 YoY -540억 [IR 3Q26]. 2024-05 신종자본증권 6,500억 발행(에스이엔씨피닉스 구조) 등 자본 보강 [DART 분기보고서(2026.09) 신종자본증권]
(5) **이익 outlier — 신세계프라퍼티**: 2025 OP 1,740억 (+125%) — 스타필드 수원 등 임대 성장 [IR 4Q25]. 3Q25 스타필드 청라 지분 매각으로 보유 주식 공정가치 이익 2,658억(영업외) [IR 3Q26 각주]
(6) **온라인 — SSG.COM·G마켓 누적 적자**
→ SSG.COM 2019\~2025 7년 누적 영업적자 -6,414억, G마켓 2022\~2025 -2,484억 [IR FY, 계산]. G마켓은 2025-09-18 공정위 조건부 승인 → 알리익스프레스코리아와 50:50 JV(기업가치 약 6조, 알리바바 현금 약 3,200억 출자) [뉴데일리 2025-09-18] → 2025-11 연결 제외·지분법 [IR 3Q26]. 9M26 지분법손익 -1,340억 (전년 +237억) [IR 3Q26]

## 6. 기타 팩트

### ① R&D 인프라

- **유통업 특성상 R&D는 미미** — 이마트 본체는 별도 연구개발 조직·비용을 사업보고서 '연구개발활동'에 정량 공시하지 않고, **자회사 신세계푸드(식품 R&D 담당, 성동구 아차산로·이천 식품안전센터)와 신세계I&C(AX센터, AI·빅데이터)**만 연구개발비를 공시 [DART 사업보고서(2025.12) II-6]
- 공시 연구개발비 (억원): 신세계푸드 2020 63.9 → 2021 103.0 → 2022 84.1 → 2023 117.1 → 2024 127.6 → 2025 66.2 (신세계푸드 매출 대비 0.5\~0.8%) / 신세계I&C 2020 6.5 → 2021 24.8 → 2022 29.6 → 2023 24.8 → 2024 15.8 → 2025 15.7 [DART 사업보고서(2022.12)·(2025.12)]
- 합계 / 연결 매출 = **0.03\~0.05%** [계산] — 기술 R&D가 아니라 **PB(노브랜드·피코크)·상품 소싱·IT 시스템 투자**가 경쟁력의 실체. 2014\~2019 연구개발비 미확보
- 신세계I&C 특허: RFID 통로형 무인 결제, 클라우드 POS, 영상 기반 재고 모니터링 등 13건+ (2021\~2023 등록) [DART 사업보고서(2025.12)]
