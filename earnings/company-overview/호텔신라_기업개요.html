## 1. 기업 분류

- **Primary 분류: 사이클 — 인바운드 관광·면세 수요형 (중국 정책·채널 비용 이벤트 사이클)** — 매출은 2014 2.91조 → 2019 5.72조 → 2020 3.19조 → 2022 4.92조 → 2023 3.57조로 한 번에 ±20\~44% 움직이고, OPM은 -5.8\~5.2%(폭 11.0%p)로 크게 출렁임. 변동 원인은 경기보다 **중국 정책(사드·단체관광·무비자)·코로나·송객수수료(따이궁 알선수수료)·공항 임대료** 같은 외생·채널 비용 이벤트
- **Secondary 노트: 턴어라운드 (구조조정 국면) + 호텔&레저 지속성장** — 2025-09 인천공항 DF1(향수·화장품) 사업권 반납 결정, 2025-11 마카오공항점 종료 후 9M26 TR 영업이익 759억 흑전 (9M25 -267억) [IR 3Q26]. 호텔&레저는 매출 2021 4,352억 → 2025 6,865억(연 +12%), 2022 이후 OPM 9\~12%로 안정 [IR, 계산] — 다만 연결 매출 비중은 17% (2025)

### ② 산업 분류

- 산업: **면세 유통(Travel Retail: 시내·공항·인터넷 면세점) + 호텔·레저(서울/제주신라·신라스테이·신라모노그램, 레포츠, 기업출장 BTM)** — 관세청 특허(시내점)·공항공사 입찰(공항점)로 진입이 제한된 과점 유통업
- DART 업종: 호텔업 계열(관광진흥법·관세법 적용) [DART 사업보고서(2025.12) I-1 "회사사업 영위의 근거가 되는 법률"] — KSIC 세부 코드는 OpenDART 기업개황(company.json)에 기재
- 워치리스트 섹터: **여행·레저·유통** / 서브섹터: **면세·카지노·여행**
- 시장 지위: 2025 국내 면세점 매출 약 12.5조원(2019의 약 50%) [DART 사업보고서(2025.12) II-7] 중 신라 TR 매출 3.38조(해외 창이·첵랍콕 포함) [IR]. 국내 빅4(롯데·신라·신세계·현대) 체제. 회사는 "세계 3위 면세점 사업자로 등극한 바 있다"고 기술 [DART 사업보고서(2025.12) I-1] (시점 명시 없음 — 과거 실적 기준)

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: TR 매출 3.38조 = 연결의 **83.1%** (2025, IR 부문 합산) → 면세 수요(외국인 인바운드 + 내국인 출국) × 객단가 × 채널 비용 구조 → 수요가 외생 이벤트에 크게 흔들림 → **사이클**
(2) **이익 비중 sub-rule**: 2023\~2025는 호텔&레저 영업이익(688·645·608억)이 연결 영업이익(912·-52·135억)을 상회 — 이익 기준으로는 호텔이 "본체"였던 구간. 그러나 9M26 TR 영업이익 759억 > 호텔&레저 608억으로 다시 역전 [IR 3Q26, 계산]. TR 손익이 연결 이익 방향을 결정 → **사이클 유지**
(3) **Boundary case 처리 — 호텔&레저 성장**: 호텔&레저 매출 CAGR(2021→2025) +12.1%, 신라스테이 16개+모노그램 3개(다낭·강릉·시안) 위탁·임차 확장 [IR 3Q26 영업장 현황]. 그러나 매출 비중 17%로 Primary를 바꿀 규모는 아님 → Secondary
(4) **피어 cross-ref (면세·카지노·여행 서브섹터)**:
→ 국내 면세 피어: 롯데면세점(호텔롯데, 비상장), 신세계DF(신세계 연결), 현대면세점(현대백화점 연결) — 상장 순수 면세주는 사실상 호텔신라 단독. 2026-02 인천공항 DF1·DF2 새 운영사로 롯데·현대 선정 [뉴시스 2026-02-26]
→ 같은 서브섹터의 카지노(파라다이스·GKL·강원랜드)·여행(하나투어 등)은 같은 인바운드/아웃바운드 수요 변수에 노출 — 비교 수치는 각 종목 기업개요 및 ④-1 면세·카지노·여행 공통 비교 박스 참조
→ 글로벌 TR 피어: Avolta(구 Dufry), 중국 CDFG(중국중면) — 정성 비교, 수치 미수집

### ④ 적정 밸류에이션 방법

- **PBR 우선, PER·EV/EBITDA 보조** — 순이익이 2020·2022·2024·2025 4개년 적자로 PER이 의미 없는 해가 많음
→ **PBR 밴드** (연말 시총(보통+우선) / 지배자본 [계산]): 2014\~2023 **2.9\~6.1배** (고점 6.13배 2022, 저점 2.89배 2016) → **2024 토지 재평가(지배자본 +111%)로 분모가 바뀌어 1.15배** → 2025말 1.61배 → 현재 **1.32배** (1.51조 / 3Q26 지배자본 1.15조). ⚠ 2024 전후 PBR은 회계 기준(원가→재평가)이 달라 직접 비교 불가 — 재평가 효과(기타포괄손익누계액 7,195억, 3Q26) 제외 시 실질 장부가 약 0.43조 → 재평가 전 기준 PBR 약 3.6배 [계산, 기타포괄손익누계액 전체를 차감한 근사치]
→ **PER**: LTM 지배순이익 492억 [계산: 4Q25 -166 + 1Q26 60 + 2Q26 214 + 3Q26 384억] 기준 **30.7배**. 4Q25 일회성 손실 영향 — 2026 정상화 이익 기준 재계산 필요
→ **EV/EBITDA**: LTM EBITDA **2,642억** [IR 분기 EBITDA 합산: 4Q25 295억(연간 1,543 − 1\~3Q25 443·327·478) + 1Q26 533 + 2Q26 936 + 3Q26 878, 계산] — IR EBITDA는 사용권자산 상각 포함 → EV에도 리스부채를 넣어야 정합: EV = 시총 1.51조 + 순차입금 0.58조 + 리스부채 0.35조 = 2.44조 → **약 9.2배** (리스 제외 EV 2.09조 기준 7.9배) [계산]
- **피어 차별화**: 면세 단독 상장사라 국내 직접 피어 부재. 시장은 사이클 저점에서 PBR, 회복기에 "정상화 영업이익 × 목표 PER"로 평가해 옴 — 증권사들이 2026-04 1Q26 흑전 직후 목표가를 일제히 상향(DB +39%, NH +29.3%) [머니투데이 2026-04-27]

#### ④-1 면세·카지노·여행 공통 비교 박스 (통일 기준, 2026-11-28 통합 검수)

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **호텔&레저 영업이익이 연결 영업이익의 50%+를 4개 분기 연속** 유지 (2023\~2025 대부분 충족, 9M26은 44%) → "호텔 지속성장 + 면세 옵션" 복합 분류로 전환 검토
- **TR OPM 5%+ 2개 분기 연속** (2Q26 4.7%·3Q26 3.6%) → 사이클 회복 국면 태그 부여 (2018·2019 수준 복귀)
- **중국 단체관광(유커) 정책·무비자 확대로 시내점 매출 YoY +20%+ 2개 분기 연속** (3Q26 시내 -3.4%) → 인바운드 업사이클 진입 판단
- **인천공항 DF1 위약금(약 1,900억 추산 [한국경제 2025-09-18]) 관련 소송 결과** — 부당이득 반환 소송 진행 중 [더팩트 2026-08-05] → 승소 시 일회성 이익, 패소 시 추가 손실 없음(이미 비용 반영 여부는 ⑥-④ 참조)

**(1) TR 부문 — 국내 시내점 + 공항 + 해외 공항**
→ 상품 구성: 향수·화장품, 시계·보석, 의류·가방 — 루이비통·에르메스·샤넬 등 명품부터 컨템포러리까지 [DART 사업보고서(2025.12) II-7]. 2026 1\~9월 화장품 카테고리 매출 두 자릿수 성장, 브랜드 협업 단독상품 확대 [비즈니스워치 2026-11-18]
→ 고객: 방한 외국인(중국·일본 등) + 내국인 출국자. 시내점은 여행사·프리랜서(가이드·따이궁) 판촉에 의존 — 이 비용이 "알선수수료"(송객수수료) [DART 사업보고서(2025.12) II-4 판매경로]
→ 원가 구조: 재료비(상품원가)/매출 55\~60% (2023 60.2% → 2025 55.3%) [OpenDART IS 성격별, 계산] + 공항 임대료(K-IFRS 1116 리스 또는 변동임대료) + 알선수수료(기타영업비용)
→ 인천공항 4기(2023-07\~): 신라는 DF1(향수·화장품, 객당 8,987원 제시 [비즈니스워치 2026-11-18])·DF3(패션·부티크) 낙찰. 2025 인천공항 임대료 납부액 4,347억 [더팩트 2026-08-05] → DF1은 객단가 하락·여객당 임대료 구조로 월 적자 누적 → 법원 임대료 조정(25% 인하안)을 공항공사가 거부 → **2025-09-18 반납 결정** [한국경제 2025-09-18]. DF3는 계속 운영
→ 해외: 창이(2013\~)·첵랍콕(2017-12\~) 유지, 마카오(2019-11\~2025-11) 계약 만료 종료 → 해외 사업장 2곳 [디지털데일리 2025-11-04]
→ 이익 outlier: **2Q26 TR OPM 4.7%** — 2023-2Q(6.1%) 이후 최고. DF1 임대료 부담 소멸(5월 이후)과 비용 절감 효과 [IR 2Q26·3Q26, 비즈니스워치 2026-11-18]

**(2) 호텔&레저 부문 — 직영 2 + 임차/위탁 확장형**
→ 서울신라: 포브스 트래블 가이드 5성 8년 연속(2019\~), 한식당 '라연' 미쉐린 3스타(2016\~2021 6년 연속) [DART 사업보고서(2025.12) II-7, IR 3Q26 연혁]
→ 3Q26: 서울호텔 매출 +9.4%, 제주 +9.9%, 스테이 +19.0%, 레저 +4.1% YoY, 부문 영업이익 279억(+28.0%) [IR 3Q26 p.9]
→ 신라스테이 운영: 동탄·역삼·제주·서대문·울산·마포·광화문·구로·천안·서초·해운대·삼성·서부산·여수·전주·염성(중국) [IR 3Q26 p.5]
→ 이익 outlier: 2022-2Q 호텔&레저 OPM 18.2% — 리오프닝 직후 객실·연회 단가 급등 [IR, 계산]

### ⑤ 주요 매출처

- **B2C 유통업 — 특정 매출처 의존 공시 없음**. DART 사업보고서는 판매경로(내방 고객·여행사·프리랜서·인터넷/모바일)만 기술 [DART 사업보고서(2025.12) II-4]
- 실질적 "대량 고객"은 시내점 따이궁(중국 보따리상) — 2021\~2022 시내점 매출 대부분을 차지한 것으로 업계 추정되나 회사 공시 수치 없음 **[⚠️ 추정 — 비공식, 수치 미확보]**
- 호텔&레저 BTM(에스비티엠·Samsung Hospitality 해외법인)은 삼성 계열사 출장 대행이 주력 — 특수관계자 거래 규모는 감사보고서 주석 확인 필요 (v1.0 미집계)
