**1기 (1911~1978) — 차량 axle 제조 출발**

→ **1923년** — Eaton Axle and Spring Company

→ **1932년** — Eaton Manufacturing Company

**2기 (1978~2011) — Power Management 다각화**

→ **1978년** — Cutler-Hammer (electrical) 인수 — 전력 사업 본격 진입

→ **1994년** — Westinghouse Industrial Controls 인수

→ **1999년** — Aeroquip-Vickers $1.7B 인수 — Hydraulics·Aerospace 강화

→ **2007년** — Sandvik Industrial Automation 인수

→ **2008년** — Phoenixtec Power $750M 인수 — UPS 진입

→ **2010년** — Wright Line 인수 (data center cooling)

**3기 (2012~2020) — Cooper Industries Mega-deal + Irish 재구조**

→ **2012년 5월** — **Cooper Industries plc 인수 발표** ($11.8B cash+stock, 가장 큰 deal)

→ **2012년 11월** — Cooper 인수 close + Irish parent (Eaton Corporation plc) 재구조 — tax inversion

→ **2013년 1월** — Eaton Corporation plc 신주 상장 (NYSE:ETN)

→ **2016년 6월** — **Craig Arnold CEO 부임** (전 COO, Sandy Cutler 후임)

→ **2017년** — Hydraulics 일부 매각 (gain $1,077M)

**4기 (2020~2026) — 전기화 secular + 포트폴리오 정제**

→ **2020년 9월** — **Souriau-Sunbank Connection Technologies $920M 인수** (Aerospace + military connector)

→ **2021년 1월 26일** — **Hydraulics segment Danfoss $3.3B 매각 발표** (2021.08 close)

→ **2021년 8월** — Hydraulics 매각 close → Electrical Americas + Electrical Global 신 segment 출범

→ **2021년 9월** — Cobham Mission Systems $2.83B 인수 (Aerospace fuel systems)

→ **2022년 4월** — Royal Power Solutions 인수 (eMobility)

→ **2023년 4월** — Mission Systems 추가 + 신규 BU expansion

→ **2023년 8월** — **Dow Jones Industrial Average constituent 진입** — Eaton 최초

→ **2024년 3월** — **Capital Markets Day 2024 (CMD 2024)** — 2030 strategy 발표 (Mid-Single-Digit growth + 25%+ OPM target)

→ **2024년** — Fibrebond Corporation (modular Pre-Engineered Buildings for data centers) + Resilient Power Systems 인수

→ **2025년 6월** — **Paulo Ruiz CEO 부임** (전 COO, Craig Arnold → Executive Chair)

→ **2026년 1월 26일** — **Mobility (Vehicle + eMobility) Q1 2027 spin-off 계획 발표** — ~$3B 매출 분사 → Electrical+Aerospace pure-play 전환

→ **2026년 Q1** — **Boyd Thermal $11B 인수 close** (data center thermal) + **Ultra PCS Limited 인수 close** (aerospace mission-critical electronics)
