# 현대제철 기업 개요 (v1.0)
> **Fact verify cutoff**: 2026-11-25 (주가·시가총액 = 2026-11-24 종가 27,150원·시총 3조 6,231억원 이투데이 확인, 2026-11-25 종가 26,900원 Yahoo Finance / 주가 ATH = Yahoo Finance 월봉 / 점유율 = 2026년 3분기보고서(철강협회 내수 기준))

> **데이터 기준 주의**: 연간 표(2014\~2025)는 OpenDART 각 연도 사업보고서 연결 기준(2014는 2015 사업보고서 비교표시). 분기는 1\~3Q = 해당 3개월, 4Q = 연간 − 3Q 누적. 현대제철은 **보고부문이 '철강' 단일**(기타부문 비중 미미)이라 사업부별 영업이익 공시가 없다 → 사업부 시계열은 **① 별도(국내 철강 본체) vs ② 자회사 등(연결 − 별도)** 으로 분해하고, 제품(봉형강·판재) 축은 매출·ASP로 본다. 제품별 매출은 2025년 3분기부터 분류 기준이 바뀌어 2024년 이후는 재작성치(신분류)를 쓴다.

## 1. 기업 분류

- **Primary 분류: 사이클** (Cyclical) — 원료(철광석·원료탄·스크랩)와 제품가(열연·철근·H형강) 스프레드에 연동되는 소재 사이클. 12년 OPM 0.4%\~10.7%
- **Secondary 노트: 자동차강판 captive + 美 현지화 옵션** — 판재 판매량의 약 46%가 자동차강판(3Q26 별도: 자동차 1,243천톤 / 판재 2,702천톤, IR)으로 현대차·기아 물량이 하방을 지지. 2029년 상업생산 목표의 美 루이지애나 전기로 제철소(270만톤, 총 58억달러)가 성장 옵션이나 아직 실적 기여 없음

### (2) 산업 분류

- 산업: **철강 — 일관제철(고로) + 전기로 제강**, 판재(열연·냉연·도금·후판·자동차강판)·봉형강(철근·H형강·형강·특수강 봉강)
- DART 업종코드: **2411** (1차 철강 제조업)
- MSCI Sector: Materials — Steel
- 워치리스트 섹터: **철강·비철 / 철강** (국내 피어: POSCO홀딩스(철강 부문)·동국제강·대한제강·세아베스틸지주 / 글로벌: Nippon Steel·JFE·Baowu(바오산)·Nucor·Steel Dynamics·ArcelorMittal)
- 국내 점유율 (내수 판매 기준, 수입 제외, 철강협회 — 2026년 3분기보고서): **봉형강 38.6%** (2025 39.9%·2024 35.7%) · **판재 31.4%** (2025 29.4%·2024 25.3%)
- 위치: 국내 2번째 고로사(2010 당진 일관제철소 가동), 국내 최대 전기로 제강사

### (3) 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시 판재(2025 단순합계의 51%, 해외판재 포함 71%) → 열연·냉연·후판은 원료탄·철광석 가격과 중국 수출 물량에 좌우되는 전형적 스프레드 산업 → **사이클**

(2) **사이클 사업부 영업이익 비중 우선 sub-rule**: 사업부별 영업이익 비공시. 대신 별도(국내 철강 본체)가 연결 영업이익을 사실상 전부 결정 — 2021 별도 OP 2.30조 / 연결 2.45조(94%), 2024 별도 OP 150억 / 연결 1,595억. 별도 OPM이 3Q21 15.2% → 4Q23 -6.3% → 3Q26 0.3%로 출렁이며 전사 사이클을 결정 → Primary 사이클 유지

(3) **Boundary case 처리**: ① 자동차강판은 현대차·기아 연간 가격 협상(반기 단위) 구조라 분기 변동이 작고, ② 자회사 등(해외 SSC·현대비앤지스틸·현대스틸파이프 등)은 연 매출 4.5\~5.1조·OPM 1\~10% 수준으로 완충 역할. 그러나 두 요소 모두 본체 스프레드 사이클을 상쇄할 규모는 아님 → **Primary 사이클 + Secondary 자동차강판 captive 노트**. 美 전기로 제철소(2029\~)는 지분법 투자(관계기업·공동기업)로 잡히고 있어(관계기업·공동기업 투자 2025말 2,606억 → 3Q26 1조 2,554억) 상업생산 전까지 분류에 영향 없음

(4) **피어 cross-reference**:
   - **POSCO홀딩스(철강 부문) 대비**: 동일 고로 사이클이지만 POSCO는 고로 비중이 압도적·수출 비중이 높아 원료탄·철광석과 글로벌 열연가에 민감. 현대제철은 전기로 봉형강(건설) 비중이 23\~33%로 **국내 건설 경기 + 스크랩 스프레드**라는 두 번째 사이클을 동시에 탐 → 이중 사이클
   - **동국제강·대한제강 대비**: 전기로 철근·형강 순수 업체는 봉형강 스프레드 하나에만 노출. 현대제철은 봉형강 1위(38.6%)로 가격 리더 역할
   - **Nucor·Steel Dynamics 대비**: 美 전기로 업체는 관세 보호 하 고마진(美 열연가가 아시아·유럽보다 30% 이상 높다는 보도, 한경비즈니스 2026-09). 현대제철 루이지애나 제철소가 이 구조를 겨냥

### (4) 적정 밸류에이션 방법

- **PBR (사이클 기준) 1순위** — 별도 철강 본체가 이익의 전부를 결정하는 소재 사이클 종목. 12년 자본총계 13.81조 → 19.84조 (+3.4% CAGR)로 장부가치가 안정적이라 사이클 위치 판단에 적합
  - 2026-11-24 시총 3.62조 / 3Q26 자본총계 19.67조 → **PBR 약 0.18배**. 2014년 말(시총 약 7.0조/자본 13.8조 ≈ 0.5배), 2021년 리오프닝 고점(약 7.4조/18.3조 ≈ 0.4배) 대비 밴드 최하단. 이투데이(2026)는 저PBR 공표 이슈로 주가가 11% 급등한 사례를 보도
- **EV/EBITDA 보조** — 순차입금 7.1조(2025말, 자본 대비 35.9%)·유형자산 17.8조의 장치산업. 감가상각 부담이 커 영업이익보다 EBITDA가 사이클 비교에 유용
- **PER 비적합** — 2024\~2025 지배순이익 적자(-116억·-69억)로 PER 산출 불가. 정점 이익(2021 지배 1.46조) 기준 normalized PER은 참고용
- **피어 차별화**: POSCO홀딩스는 리튬·인프라 등 지주 가치(SOTP)가 섞여 PBR 단독이 왜곡되지만, 현대제철은 철강 단일 사업이라 **PBR 단독 + EV/EBITDA 보조**가 가장 깨끗하다

### (5) 분기 재평가 트리거

- **별도 OPM이 2개 분기 연속 5%+ 회복 + 봉형강−스크랩 스프레드 60만원/톤 상회 시** → 사이클 업턴 확인 (현재 3Q26 별도 OPM 0.3%)
- **자동차강판 판매량 비중(별도 판재 판매량 대비)이 50%+로 고정되고 차강판 가격이 반기 협상에서 2회 연속 인상 시** → Secondary 'captive 지속성장' 노트 격상 검토
- **美 루이지애나 제철소 상업생산(2029 목표) 후 해외 매출 비중 30%+ 도달 시** → 국내 스프레드 사이클 → 美 관세 보호 지역 마진 구조로 분류 근거 일부 이전 (Primary 재검토)
- **봉형강 매출 비중 20% 하회 (현재 22\~23%)** → 건설 사이클 노출 축소 → POSCO형 단일 고로 사이클로 재분류
