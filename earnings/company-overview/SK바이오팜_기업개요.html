# SK바이오팜 기업 개요 (v1.0 — XCOPRI 단일 블록버스터 램프업, 고성장 + 멀티 프로덕트 전환기)
> **Fact verify cutoff**: 2026-11-25 (재무는 2026.09 분기보고서까지 확정치. 매출 구성(XCOPRI·DP/API·용역)은 회사 IR 표 기준 — DART는 제품/용역 2분류만 공시. 시가총액·52주 고저는 Yahoo Finance(2026-11-24 종가 기준)와 알파스퀘어 교차 확인. Opakalim 계약금 원화 환산은 언론(데일리팜) 기준, 거래종결은 2026.09 분기보고서 시점 '진행 중')

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (단일 CNS 블록버스터 상업화 램프업형 — "꿈 → 실적" 전환 완료)**

→ 매출 CAGR(2019→2025) **+33.7%** (1,239억 → 7,067억), 상업화 원년 기준(2020→2025) +93.6%. 핵심 제품 XCOPRI 美 매출은 2021→2025 CAGR **+68.5%**(원화) / +59.5%(달러, $68.4M → $443.2M)
→ 3Q26 누적 매출 7,337억(**+43.2% YoY**), 영업이익 3,031억(+92.2%), OPM **41.3%** — 이미 2025 연간 매출을 9개월 만에 넘어섰다
→ 매출원가율 5\~8%(GPM 92\~95%, 2023\~3Q26) — 자체 공장 없이 CMO 위탁생산 + 美 직판(SK Life Science, Inc.). 이익 레버리지는 "XCOPRI 매출 증가 vs 판관비(R&D 포함) 증가"의 차이로 결정

**Secondary 노트: 꿈(파이프라인 옵션) + 단일 제품 집중 리스크**

→ 3Q26 누적 매출의 **88.0%가 XCOPRI US**, DP/API 4.4%, 용역(기술료·마일스톤·로열티) 7.6% — DART 품목 기준으로는 세노바메이트 98.6%·솔리암페톨 1.4%
→ 차기 성장축은 아직 매출이 없는 옵션: ① **Opakalim(Kv7 활성화제, 2026.08 Biohaven에서 도입 — 계약금 $400M·총 $795M, 부분발작 임상 2/3상)** = 세컨드 프로덕트, ② RPT(방사성의약품) SKL35501 임상 1상(2026.01 IND), SKL37321 2H27 IND, ③ TPD SKT-18416 1H27 IND `[판단: 파이프라인 가치는 기업 개요 범위 밖 — 기업 분석 모드에서 다룸]`
→ 2021·4Q23처럼 **일회성 기술료가 OPM을 왜곡**하는 구간이 있어, 분류·추세 판단은 XCOPRI 매출과 "용역 제외" 손익을 우선한다

**Entity 구조 (2025말 연결 종속 4사 + 공동기업)**

→ **(1) SK바이오팜(주)** — 경기 성남 판교 본사. 신약 R&D(Neuroscience·RPT·AI/DT), 기술수출(L/O)·기술도입(L/I) 주체, DP/API 공급
→ **(2) SK Life Science, Inc. (100%, 美 뉴저지 Paramus)** — XCOPRI 美 직판·임상개발. 2025 매출 9,078억(내부거래 포함)·순이익 301억, 자산 6,560억 (DART)
→ **(3) SK Life Science Labs, Inc. (美 펜실베이니아, 舊 ProteoVant — 2023.08 인수)** + 100% 자회사 Oncopia Therapeutics — TPD 연구
→ **(4) SK생물의약과기(상해)** — 중국 임상·사업개발
→ **공동기업**: Ignis Therapeutics(중국, 2021.11 설립 — 1대주주, 재무적투자자와 공동지배, 지분법) 등. 공동기업투자 382억(3Q26)
→ 영업부문은 **신약사업 단일 부문** — 부문별 영업이익 미공시. 회사 IR이 XCOPRI US / DP·API / 용역 3분류 매출을 분기 공개

(5) 분류 결정 논리 (4단계)

→ **(1) 매출 큰 사업부 기준**: XCOPRI US가 매출의 88%(3Q26 누적). 3Q26 $156.8M(QoQ +4.9%, YoY +26.4% 달러 기준), 월 TRx **51,007건(2026.09)**, 월 NBRx 약 1,800건 유지 (회사 IR). 2026 가이던스 $550\~580M → 상단 달성 전망 → 고성장 근거
→ **(2) Secular 변수 sub-rule**: 글로벌 CNS 시장 2025년 1,087억 달러 → 2032년 1,884억 달러(연 8%, EvaluatePharma — DART 인용). 美 뇌전증 경쟁 브랜드 특허만료 — Vimpat(UCB) 기만료, Aptiom·Fycompa 2025.05, **Briviact 2026.02 제네릭 출시** (DART). XCOPRI 글로벌 뇌전증 시장 점유율 3.1%(2023) → 4.7%(2024) → **6.6%(2025)** (EvaluatePharma, DART 인용). 브랜드 경쟁자는 줄지만 제네릭 저가 처방 압력은 커지는 양면 `[판단]`
→ **(3) Boundary case 처리**: ① 2021 흑자(OPM 22.7%)는 용역 3,294억(매출 79%) 효과 → 분류상 "흑자 전환"으로 보지 않음. ② 4Q23 첫 분기 흑자(148억)도 용역 438억 동반 — 용역 제외 시 적자. ③ **2024년부터 용역 비중 15% 이하 + 4개 분기 연속 흑자**(1Q24\~) → 구조적 흑자 전환으로 판정. ④ 순이익은 이연법인세 인식으로 과대 → OP로 판정
→ **(4) 글로벌 피어 cross-reference**: 美 CNS 상업화 기업은 ① **Neurocrine형** — 단일 CNS 제품(Ingrezza) 美 직판으로 고마진 → 세컨드 프로덕트 확보가 밸류 과제, ② **Jazz형** — M&A·도입으로 수면·뇌전증 포트폴리오 확장(Epidiolex 뇌전증 점유율 1위 15.7%, 2025), ③ **UCB형** — 다제품 뇌전증 포트폴리오 보유 후 특허절벽을 신제품(Briviact·Fintepla)으로 메움. SK바이오팜은 현재 ①에서 Opakalim 도입으로 ②·③ 방향 전환을 시도하는 단계 `[판단 — 피어 재무 수치는 v1.1에서 SEC 10-K로 보강]`

| 2 | PER (TTM) | 6.59조 / 3,748억 = **약 17.6배** | TTM 순이익에 4Q25 법인세수익(이연법인세 인식) 포함 → 정상 세율 가정 시 PER은 더 높다 `[판단]` |
| 3 | PSR (TTM) | 6.59조 / 9,281억 = **약 7.1배** | 적자기(2020\~2023) 비교용 — 상장 초기(2020.07 시총 14조대) PSR은 수십 배 |
| 참고 | PBR | 6.59조 / 자본 1.05조 = **약 6.3배** | 결손금(−1,097억) 잔존으로 자본이 이익 체력을 과소 반영 — 참고용 |

→ **적자→흑자 전환 기업이라 PSR → PER/EV-EBIT으로 다이얼이 넘어가는 중**: 2020\~2023은 이익이 없어 PSR(또는 XCOPRI 피크 매출 기반 DCF)만 가능했고, 2024 흑자 전환 후 이익 기반 지표가 유효해졌다. 다만 ① 이연법인세로 순이익이 왜곡되고 ② R&D(2025 1,743억, 매출의 25%)를 전액 비용 처리하므로 **EV/EBIT(또는 EV/EBITDA) 1순위**, 정상 세율 반영 후 PER 2순위 `[판단]`
→ **Opakalim 계약금 $400M(약 5,532억, 데일리팜) 지급 시 순현금 4,701억 → 순차입 전환 가능** — 거래종결(HSR 대기기간 2026.10.28 만료, 종결 절차 진행 중) 후 EV 재계산 필요. 계약금은 실질에 따라 자산 또는 비용 인식 예정(DART) → 비용 처리 시 4Q26 영업이익 일회성 급감 가능 `[판단]`
→ 삼성전자 비교: 삼성전자(사이클)는 PBR 1순위, SK바이오팜(고성장·흑자 초기)은 EV/EBIT 1순위 — 분류 차이가 방법 차이를 만든다

(7) 분기 재평가 트리거 (분류 변경 조건)

→ (1) **XCOPRI 美 분기 매출 YoY(달러) 15% 미만 2분기 연속** → 고성장 → "지속성장(성숙 단일제품)"으로 하향 검토 (3Q26 +26.4%)
→ (2) **Opakalim 임상 2/3상(RISE2·RISE3) 성공 + NDA** → Secondary 꿈 → "멀티 프로덕트 CNS 고성장"으로 격상. 실패 시 계약금 손상 + 단일 제품 리스크 재부각
→ (3) **美 제네릭 특허소송(Aurobindo·Apotex, 2024.06 제소) 불리한 판결** 또는 美 약가 규제(IRA 협상 대상 등) 적용 → 성장 기간 단축 `[IRA 적용 시점은 미확인]`
→ (4) **용역 매출 비중 30%+ 회귀** (일회성 의존) → OPM 해석 시 일회성 조정 필수 — 분류 유지하되 주의 플래그
→ (5) SK(주) PRS(주가수익스왑) 정산·추가 지분 처분 → 지배구조 이벤트, 오버행
