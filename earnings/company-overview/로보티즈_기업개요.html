# 로보티즈 기업 개요 (v1.0 — 로봇 부품, 꿈 → 고성장 전환 Boundary case)
> **Fact verify cutoff**: 2026-11-14 (주가·시가총액·52주 고저는 2026-11-13 Yahoo Finance meta 단일 소스 — 2차 소스 교차 확인 미완. 재무는 2026.06 반기보고서까지 — **3Q26 분기보고서는 2026-11-14 작성 시점 미공시**)

## ① 기업 분류

(1) Primary / Secondary 분류

**⚠️ Boundary Case — 적자 연구개발형 부품사 → 휴머노이드 부품 고성장 전환 초입**

**Primary 분류: 꿈 (휴머노이드 액츄에이터 옵션가치)**

→ 2018~2025 8년 중 영업흑자는 3개 연도(2018·2019·2025)뿐. 8년 평균 OPM -3.4%, 평균 영업이익 -8억 — 이익으로 설명되는 회사가 아니다

→ 시가총액 3.56조(2026-11-13) vs 2025 매출 389억 → PSR 90배대. 주가는 2024말 2만원대 → 2026.06 장중 46.4만원까지 **약 20배** — 휴머노이드(중국 Unitree 등) 양산 기대가 만든 재평가

**Secondary 노트: 고성장 전환 신호 (2025~2026)**

→ 매출 YoY: 2025 +29.6% (2018 상장 후 최고), 1H26 +50.3% (181억 → 272억), 2Q26 +95.1%

→ 2025년 영업이익 33억(OPM 8.6%)으로 2019년 이후 6년 만에 흑자. 1Q26 영업손실 -118억은 **임직원 성과보상 자기주식 교부 118억(일회성, 판관비)** 때문이며 이를 빼면 약 -1억 (DART 2026 반기보고서). 2Q26 OPM 12.9%

→ 회사가 매출의 90% 이상을 액츄에이터 '다이나믹셀'에서 번다 — 1H26 액츄에이터 98.0% / 자율주행로봇 2.0% (DART)

**Entity 구조 (2026.06)**

→ **(1) (주)로보티즈** — 서울 마곡 본사, 액츄에이터(DYNAMIXEL X/P/Y/Q)·정밀감속기(DYNAMIXEL Drive)·휴머노이드 플랫폼(AI Worker / AI Sapiens)·로봇핸드·SW(CYCLO)
→ **(2) 로보티즈AI** — 2025.06 자율주행로봇 사업 물적분할 자회사(실내외 배송로봇 GAEMI), 대표 김병수 겸직
→ **(3) 해외 지사** — 미국·중국(2026.02 영업 재개)·일본
→ 영업부문은 로봇 단일 — 사업부별 영업이익 미공개, 제품별 매출(액츄에이터 / 자율주행로봇)과 지역별 매출(한국·북미·일본·중국·유럽·기타)만 공시

| 2 | PBR | 3.56조 / 자본 3,611억(2026.06) = **약 9.9배** | 유상증자 후 현금성 자산 풍부 |

→ (1) 분기 매출 200억 돌파 + 일회성 제외 OPM 10% 이상 유지
→ (2) DYNAMIXEL-Q·AI Sapiens 출시(2H26 예정)와 첫 양산 공급 계약 공시
→ (3) 중국·북미 매출 비중 변화 (2Q26 북미 35%, 중국 10%)
→ (4) 1H26 시작한 설비투자(1H26 유형자산 취득 117억)의 2027 초 매출 가시화 여부
→ (5) 단일 고객 의존도 (10% 이상 A사: 1H25 22.5억 → 1H26 10.1억)
