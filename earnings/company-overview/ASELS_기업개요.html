## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (수주잔고 주도형)**

→ 수주잔고 **$30.7B** (3Q26 말, 회사) = 2025년 매출(USD 환산 $4.2B)의 약 7배. 9M26 신규수주 **$14.0B** (9M25 $5.7B), Book-to-bill **4.4x**

→ 9M26 매출 실질 +28%, USD 환산 +42%, EBITDA 마진 26.8% (+1.9%p) — 회사 2026 가이던스(실질 매출 +10% 초과, EBITDA 마진 24% 초과)를 크게 웃도는 속도

**Secondary 노트: 국가 예산 연동 (튀르키예 국방 예산 + Çelik Kubbe/Steel Dome) + 수출 초기 확장**

→ 매출의 80% 이상이 내수 (주 고객: 튀르키예 방위산업청 SSB·군), 수주잔고의 97%가 방산 (2Q26, İnfo Yatırım)

→ 수출 비중이 2025년 3Q 6% → 2026년 3Q 19%로 커지는 중 (İş Yatırım) — 내수 정책 의존에서 수출 성장주로 넘어가는 초기 국면 `[판단]`

**한국 방산 5사 + 글로벌 피어와의 위치 (제품 겹침 기준)**

→ **LIG D&A**: 가장 직접적 경쟁자 — 중거리 방공(천궁-II vs HİSAR-O+/SİPER), 레이더, 전자전, 유도무기. 중동(사우디·UAE·이라크·카타르) 방공 수출 시장이 정면 충돌 지점

→ **한화시스템**: 다기능 레이더(천궁 MFR vs Aselsan 방공 레이더), 전투기 AESA 레이더(KF-21 vs Aselsan MURAD — KAAN·F-16 개량), 해상 전투체계(한화 Naval Shield vs Aselsan GENESIS/ADVENT), 전술통신(TICN vs Aselsan 무전기)

→ **현대로템·한국항공우주**: 플랫폼사. Aselsan은 경쟁 플랫폼(Altay 전차·KAAN 전투기·Hürjet)의 사격통제·레이더·전자전을 공급 → 동남아·중동 패키지 경쟁에서 간접 경쟁

→ **한화에어로스페이스**: 직접 겹침 적음 (자주포 사격통제·무인포탑 일부)

(3) 분류 결정 논리

→ 수주잔고/매출 7배, 신규수주/매출 4.4배 — 향후 2~3년 매출 성장의 상당 부분이 이미 계약으로 확보됨 → "고성장" `[판단]`

→ 다만 잔고의 다수가 단일 국가 프로그램(Çelik Kubbe)이고 고객이 정부라 예산·재정 여건에 묶인다 → "국가 예산 연동" Secondary

→ 리라 변동성 때문에 TL 명목 성장률은 의미가 작다. **실질 TL YoY(같은 보고서 내 비교) + USD 환산 YoY 두 축으로 판단**

(4) 적정 밸류에이션 방법

→ 1순위 **EV/EBITDA** (회사 주 지표 = EBITDA, İş Yatırım 2026T 19.6x / 2027T 14.4x — 글로벌 피어 대비 14%/22% 할인, 2026-10-28)

→ 2순위 **EV/수주잔고** (Aselsan 1.05x vs 피어 1.18x, İş Yatırım) — 잔고 성장주라 보조 지표로 유효

→ P/E (2026T 24.2x, 2027T 17.7x — USD 기준, İş Yatırım)는 IAS 29 화폐성 손익(parasal kayıp)과 이연법인세 변동이 커서 보조로만

③ 이번 성장 국면의 디테일

→ **Çelik Kubbe (Steel Dome)**: 2025~2026 SSB 대형 계약이 잇따름 (2026-06 $905M, 2026-09~10 €1B+·€2.46B 등). 3Q26 신규수주 $9.12B 중 대부분이 내수 방공 (İş Yatırım은 10월 상반 계약 포함 약 $7.9B 공개 계약 추정)

→ **수출**: 9M26 신규 수출 계약 $1.93B (+34%), FY25 $2.1B (+104%), 2025년 수출 인도 $958M (+89%), 16개 제품 첫 수출 (İnfo Yatırım). 고객은 대부분 비공개("foreign end user")

→ **증설**: 2026 CapEx 가이던스 TL 50bn 초과. 9M26 설비 투자 $684M (+228%), R&D $1.3B (+36%). 1H26에 로봇 자동화 라인 19개 신설
