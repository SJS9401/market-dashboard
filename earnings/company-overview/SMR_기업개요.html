# NuScale Power (SMR) 기업 개요 (v1.0 — 미국 최초 NRC 설계승인 SMR, 매출 0·현금 $1.86B의 마일스톤 대기 개발사)
> **Fact verify cutoff**: 2026-11-14 (주가 2026-11-13 종가 **$4.66** [Yahoo Finance / stockanalysis.com], 시총 **$2.00B** [stockanalysis.com, A+B 4.299억주 기준], 52주 범위 $4.275~$25.57 [stockanalysis.com], 총주식 Class A 410,568,229 + Class B 19,332,018주(2026-10-30, 3Q26 10-Q 표지))

> **한 줄 요약**: 회사는 설계승인(NRC SDA 2건)과 두산에너빌리티 제작 착수까지 왔지만, **구속력 있는 첫 원자로 주문(OEM 계약)이 아직 0건**이다. 매출은 3Q26 $0.28M, 분기 영업비용 약 $65M, 현금·투자자산 $1,864M. 시총($2.00B)이 순현금과 거의 같아 **EV ≈ $0.14B** [계산] — 시장은 기술·인허가 가치를 거의 0으로 보고 있다. 다음 주가 변곡점은 ENTRA1–TVA PPA 체결 → NuScale OEM 수주 여부다.

→ 19년간 누적 투자 $1.8B+(DOE 비용분담 $578.3M 포함) (10-K FY25). 수익 모델은 "NPM 1기당 판매 + 연료·서비스"인데, 첫 구속력 있는 주문이 없어 이익 체계 자체가 아직 존재하지 않는다

**Secondary 노트: ① 단일 파트너 종속 (ENTRA1 독점 상업화) ② 지분 희석으로 연명하는 자금 구조 ③ 주가 = 마일스톤 옵션**

(3) 정량적 분류 근거

→ 매출 구성이 전부 "고객 프로젝트 지원 용역·라이선스": FY23 Fluor(CFPP·RoPower FEED) 74.1%, FY24 RoPower 기술 라이선스(4Q24 $34.2M 집중), FY25 Fluor FEED Phase 2 76.0% (10-K FY25). FEED 2단계가 2025년 말 끝나 2026년 매출이 사실상 0

→ 비용은 R&D(설계 완성도·부품 기술) + G&A + "기타비용"(상업 프로젝트에 배정되지 않은 엔지니어 인건비). 3Q26 영업비용 $64.9M — 회사는 "이 수준이 비교적 일정하게 유지될 것"이라고 함 (Earnings Whispers 콜 요약 — 비공식 출처)

→ 이자·투자수익이 손실의 일부를 메운다: 3Q26 투자수익 $19.1M (영업손실 -64.8 → 순손실 -45.7) (3Q26 10-Q)

(4) 산업 분류

→ SEC SIC 3443(Fabricated Plate Work — Boiler Shops) 등록 (EDGAR submissions) / 경수형 소형모듈원자로(LW-SMR) 설계·공급사 — 원자로 모듈(NPM) 1기 77MWe, 6·12기 단위 플랜트

→ 워치리스트 섹터: 원전 / 서브섹터: SMR·차세대 원자로 (핵심) — 같은 칸: Oklo(OKLO), X-energy(XE). 원전 기자재 글로벌(BWXT)·한국 원전 기자재(두산에너빌리티)와 공급망으로 연결

(5) 분류 결정 논리

→ (1) 매출 큰 사업 기준: 모듈 판매 매출 0, 용역 매출도 소멸 → 실적 기반 분류(고성장·사이클·지속성장) 적용 불가

→ (2) 이익 구조 sub-rule: 영업이익이 한 번도 흑자였던 적 없음, 손익 변화는 사업이 아닌 일회성(PMA 마일스톤·워런트 평가) 때문 → "꿈"

→ (3) Boundary case: OEM 계약(구속력 있는 NPM 구매)이 체결되고 매출 인식(진행률)이 시작되면 → "고성장(초기)" 후보. 단, 첫 플랜트 상업운전은 계약 후 수년이라 이익 단계 전환은 더 늦다 [판단]

→ (4) 피어 대비: Oklo도 매출 0의 개발사(같은 "꿈" 분류)지만 자체 발전소 운영(전력 판매) 모델. NuScale은 **원자로 공급(OEM) 모델** — 고객(ENTRA1·TVA)이 투자 결정을 내려야 매출이 생긴다. BWXT·두산에너빌리티는 이미 이익을 내는 기자재 공급사로, NuScale 수주 시 매출을 함께 나눠 갖는 위치 [판단]

(6) 적정 밸류에이션 방법

→ 1차 — **순현금 대비 시총(EV)**: 시총 $2.00B − 현금·투자자산 $1,864.1M(3Q26, 차입금 0) = **EV 약 $0.14B** [계산]. 시장이 매긴 "기술·인허가·공급망 가치"가 사실상 0에 가깝다는 뜻

→ 2차 — **PBR**: 지배주주 자본 $2,024.1M(3Q26) → PBR 약 0.99배 [계산]. 자산의 92%가 현금·투자자산이라 장부가 ≈ 청산가치에 가깝다

→ 3차 — **모듈 옵션 가치(시나리오)**: TVA–ENTRA1 6GW = 77MWe NPM 약 72기(12기 플랜트 6개, 10-K FY25 "six 12-module power plants"). 모듈 단가·마진은 미공시 — CFO "OEM 주문이 있어야 마진 가이던스 가능" (콜 요약 — 비공식 출처). 따라서 지금은 수주 확률 × 모듈 가치를 추정할 근거가 부족 [판단]

→ PER·EV/EBITDA는 적용 불가. **Oklo와 같은 '현금 대비 프리미엄' 비교**로 보는 것이 실무적 [판단]

(7) 분기 재평가 트리거 (분류 변경 조건)

→ ① 첫 구속력 있는 OEM(NPM 구매) 계약 체결 + 수주잔고(RPO) 공시 시작 → "꿈" → "고성장(초기)" 재분류 검토

→ ② ENTRA1 PMA 마일스톤2(구속력 있는 PPA) 발동 → 대규모 현금 지급(동일 단가 가정 시 약 $1.18B [계산]) — 분류보다 **재무 구조(런웨이)** 재평가 트리거

→ ③ ENTRA1 독점 계약 해지·변경 또는 RoPower 프로젝트 취소 → 상업화 경로 재평가 (Secondary 재검토)

## ② 회사 개요

① 기본 사항

→ 회사명: NuScale Power Corporation (NYSE: SMR). 2007년 오리건주립대(OSU)·아이다호 국립연구소 연구에서 출발 — OSU 특허 독점 라이선스(2007) 후 2015년 매입 (10-K FY25)

→ 지배 구조: **Up-C 구조**. 상장사(NuScale Corp)가 NuScale Power, LLC 지분 95.5%를 보유, 나머지 4.5%는 LLC Class B 유닛(비지배지분, Japan NuScale Innovation 등)이 보유 (3Q26 10-Q). Class B 유닛은 Class A 주식으로 1:1 교환 가능

→ 사업 한 줄: 77MWe 경수로 원자로 모듈(NPM)을 공장에서 만들어 6·12기씩 묶는 "모듈형 원전" 설계사 겸 원자로 공급사(OEM). 냉각재 펌프 없이 자연순환·피동 안전(전원·운전원 조치 없이 냉각)이 특징

→ 규모(FY25 말): 매출 $31.5M, 총자산 $1,412.5M, 임직원 428명 (10-K FY25). 특허 513건 등록 + 268건 출원
