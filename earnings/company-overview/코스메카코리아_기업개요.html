# 코스메카코리아 기업 개요 (v1.0 — 한국 인디브랜드 수출 붐을 탄 3위 ODM, 잉글우드랩(미국) 66.7% 보유)

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 고성장 (2023\~ K-뷰티 인디브랜드 수출 사이클)**

→ 2023\~2025 3년 매출 CAGR **+17.1%**, OPM 2.6%(2022) → 10.4% → 11.5% → **13.0%(2025)**. 3Q26 누적 매출 6,588억 **+42.4% YoY**로 이미 2025 연간(6,409억)을 넘었다
→ 성장은 **한국법인** 한 곳이 만들었다: 한국법인 분기 매출 2023년 평균 672억 → 3Q26 **2,011억 (+54.9% YoY)**. 3Q26 연결 매출의 78.3%. 고객은 아누아(더파운더즈)·티르티르 등 인디브랜드 — 이들의 미국·유럽 수출(아마존·세포라 등)이 코스메카의 '간접 수출'이 된다
→ 주가는 2022.10 저점(시가총액 약 700억) → 2026.08 고점(약 1.6조) **약 23배**. 2026-11-13 시가총액 약 9,708억

**Secondary 노트: 사이클 (2017\~2022 OPM 2\~6% 정체기의 기억)**

→ 2017\~2022 6년 평균 OPM 3.7%. 매출은 1,823억 → 3,994억으로 2배가 됐지만(잉글우드랩 편입 효과), 한국법인 고객 이탈(2018\~19 로드샵 업황 붕괴)·중국법인 상시 적자로 이익이 따라오지 못했다
→ 3Q26 OPM 11.0% (2Q26 14.2%에서 -3.2%p) — 미국법인 매출 -26.1% YoY, 영업이익 -61.0% YoY. **'한국 성장 vs 미국 둔화 vs 중국 적자'의 3법인 분해가 핵심 관전 포인트**

| DART 업종 | 20423 화장품 제조업 |

| 사업 모델 | B2B 제조자개발생산(ODM) / OEM. 회사 명칭은 'OGM'(Original Global Standard & Good Manufacturing — 국가별 유통·규제 검토까지 포함한 토털 서비스) |

(5) 분류 결정 논리

→ 고성장 Primary: 한국법인 매출이 3Q25 이후 5개 분기 연속 +50% 이상 성장(+54\~+91% YoY, 2Q25는 +16%). 수요원은 국내 인디브랜드의 미국·유럽·일본 수출 — 2026년 연간 가이던스는 YoY +20% → **+30%로 상향**(2026-08, 셀사이드 리포트 인용)
→ 사이클 Secondary: ODM은 고객 브랜드 히트상품에 매출이 집중되는 구조(DART상 10% 이상 고객 '고객 1' 존재). 2018\~19 로드샵 붕괴 때 한국법인 매출이 2년간 정체된 전례
→ 미국법인(잉글우드랩)은 3Q25 정점(매출 618억, OPM 21.4%) 후 3분기 연속 감소 — 연결 성장률을 깎는 요인

(6) 적정 밸류에이션 방법

| 우선순위 | 방법 | 현재 수치 (2026-11-13, 90,900원) |
|---|---|---|
| 1 | **PER (지배주주순이익)** | 최근 4분기(4Q25\~3Q26) 지배순이익 약 580억 → **PER 약 16.7배** / 2025 EPS 4,255원 기준 21.4배 |
| 2 | EV/EBIT | 최근 4분기 영업이익 1,022억, 3Q26말 순차입금 약 1,705억(차입금 2,544억 − 현금 839억), 비지배지분 562억 → EV/EBIT 약 11.7배 (단순 계산) |
| 3 | PBR | 3Q26말 지배주주지분 2,747억 (BPS 약 25,720원) → **PBR 약 3.5배**, 최근 4분기 ROE 약 21% |

→ ODM은 설비 기반 B2B라 PER이 1순위. 잉글우드랩 지분 33.3%가 외부에 있어 연결 순이익의 약 8\~10%가 비지배 귀속 — 반드시 지배주주 기준 사용
→ 잉글우드랩(950140) 시가총액 × 66.67% 지분 가치는 별도 SOTP 항목 (잉글우드랩 주가 2026-10-20 7,590원 × 발행주식 약 1,987만주 ≈ 시총 1,500억 → 66.67% ≈ 1,000억, 언론 시세 기준 추정)

(7) 분기 재평가 트리거

→ 한국법인 매출 YoY가 +30% 아래로 꺾이는 분기 (현 +54.9%) — 인디브랜드 수출 사이클 둔화 신호
→ 미국법인 매출 회복 여부 (3Q26 457억, -26.1% YoY) — EWLK(인천) 매출 -41.2% YoY가 핵심. 미국 관세·고객 재고조정 여부
→ 연결 GPM 22%대 고착 여부 (오창공장 2,000억 투자 감가상각 개시 전후)
→ 중국법인 적자 폭 (3Q26 -10억) — 구조조정(소주 청산 완료) 후 손익분기 진입 여부
→ 오너 2세 미공개정보 이용 혐의 재판 결과 (⑥ 리스크)

(3) 법인별 개요 (매출 비중 큰 순서, 3Q26 기준)

**A. 한국법인 — 매출 78.3% / 영업이익의 약 86% (3Q26)**

→ 충북 음성 뷰티1·2 사업장 + 청주(2025.05 가동) + 오창(2026.06 인수, 2,000억 투자 MOU). 2026년 예상 생산 CAPA: 음성 6.74억개 + 청주 1.72억개 + 잉글우드랩코리아(인천) 0.84억개 = KOREA 9.30억개 (IR 2026-11)
→ 고객: 국내 인디브랜드 중심 — DART 연결주석 '국내 주요 고객' 2025: 더파운더즈(아누아), 브랜드501 등 / 2024: 더파운더즈, 티르티르 등 / 2022: 제이오알알앤디, 티르티르 / 2020: 브이티코스메틱, 제이오알알앤디, 지피클럽 / 2016\~2018: 씨티케이코스메틱, 클리오, 에이블씨앤씨(미샤)
→ 고객 소재지: 국내 고객 81.4%(2024) → 84.2%(2025) → 88.1%(2026 최근) — 국내 브랜드사 경유 수출 비중 확대
→ 강점: 색조 베이스(BB·CC·쿠션·선베이스) 원조 + 토너패드·앰플 등 기초. '1품목 1처방', 소비자 품평단 '메카프렌즈', 자체 생산시스템 CPS(Toyota TPS 응용)·MES

**B. 미국법인 (잉글우드랩 연결) — 매출 17.9% / 영업이익의 약 19% (3Q26)**

→ 잉글우드랩(EWL): 뉴저지 토토와 공장(CAPA 2.11억개), 미국 현지 브랜드 고객(DART 국외 주요고객: BEAUTYLISH INC.(2025), Galderma S.A.(2024), EIIO(2022)). 9M26 매출 897억(+0.3%), OPM 7.6%
→ 잉글우드랩코리아(EWLK): 인천 남동구, 미국 FDA OTC 등록 공장 — 한국산 선크림·OTC를 미국으로 수출. 2025 매출 997억·OPM 30.8%의 **고마진 핵심**이었으나 9M26 매출 592억(-21.1%), 3Q26 186억(-41.2% YoY), OPM 19.8%

→ 지분 66.67% (2026.03\~) — 연결 순이익의 비지배 귀속분 축소 진행 중

**C. 중국법인 (코스메카차이나) — 매출 3.8% / 상시 적자**
