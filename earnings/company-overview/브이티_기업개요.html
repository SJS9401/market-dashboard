# 브이티 기업 개요 (v1.0 — 리들샷 브랜드사, 고성장 → 성장 둔화·마진 리셋 구간)
> **Fact verify cutoff**: 2026-11-15. 재무는 **3Q26 분기보고서(확정)까지 반영** — 11/13 보도치(매출 1,378억 +25%, OP 149억)와 공시 원문 일치(차이 없음, 아래 ①-(2) 참조). 주가·시가총액은 2026-11-13 Yahoo Finance meta 단일 소스(2차 소스 교차 확인 미완).

## ① 기업 분류

(1) Primary / Secondary 분류

**⚠️ Boundary Case — 히트상품(리들샷) 주도 고성장 → 2025 하반기부터 이익 꺾임, 매출은 재가속**

**Primary 분류: 고성장 (브랜드 히트 사이클형)**

→ 연결 매출 2017 699억 → 2025 4,372억, **8년 CAGR +25.8%**. 화장품 부문만 보면 2018 673억 → 2025 4,092억 (**6.1배**)
→ 성장 동력이 단일 히트 제품에 집중: 2021\~2022 '시카' 라인이 별도 매출의 86\~89%, 2023.09 출시 '리들샷'이 2024\~2025 별도 매출 최대 라인(리들샷+파생 2025 2,127억, 별도의 56%) — 회사 IR 2026.08

**Secondary 노트: 이익 사이클 꺾임 (2H25\~)**

→ 분기 OPM: 3Q24 **29.6%** 정점 → 3Q25 11.0% → 2Q26 **8.1%** 저점 → 3Q26 10.8%
→ 원인(회사 IR 1H26): 광고판촉비 164억 → 361억(+119%, 매출 대비 7.8% → 14.7%), 운반보관비 +49%, GPM 62.4% → 57.9% — 일본 의존도 하락과 함께 미국·유럽·중동·러시아로 채널을 넓히는 비용
→ 매출은 오히려 재가속: YoY 1Q26 +13.8% → 2Q26 +18.1% → **3Q26 +25.0%**. 3Q26 영업이익은 5개 분기 만에 YoY 플러스(+22.5%) 전환
→ 주가는 2025.06 월고가 45,550원 → 2026.11.13 9,720원 (**−79%**) — 이익 꺾임을 이미 크게 반영

**Entity 구조 (2026.09)**

→ **(1) (주)브이티 본사(별도)** — 'VT COSMETICS' 브랜드 기획·마케팅·유통. 자체 공장 없이 OEM/ODM 외주 생산 (주요 매입처: 코스메카코리아, 연결 자회사 이앤씨 — DART)
→ **(2) (주)이앤씨** — 2024.07 50.27% 인수 후 추가 취득(2026.3Q 1.54%), 용인 시트마스크·파우치·기초 화장품 제조사 (2025 매출 1,192억 / OP 121억, 임직원 144명 — 회사 IR)
→ **(3) (주)VT JAPAN** — 일본 유통 법인 (2025말 자산 486억, 주요 종속회사)
→ **(4) (주)지엠피** — 2023.07 라미네이팅 사업 물적분할 100% 자회사 (파주, 라미네이터·필름 — 창업 본업)
→ **(5) 기타** — 지엠피글로벌(부동산 개발·여행), 브이티바이오(천연물·세포치료제 VT301), 브이티에이아이솔루션즈, **VT COSMETICS US INC(2026.06.18 설립)**
→ **지분법**: (주)큐브엔터테인먼트 8.93% (2024.07 일부 매각으로 연결 제외). 큐브엔터는 역으로 브이티 지분 12.29% 보유 (상호 보유)

→ 2014\~2016은 (주)지엠피(라미네이팅) 별도 — 2012.11 산업은행 경영정상화 약정 → 2016.10 워크아웃 종료·강승곤 회장 인수 (회사 IR)
→ 2018 VT코스메틱 실적 반영 후 흑자 전환, 2021 매출 2배는 큐브엔터(엔터 366억) 연결 + 지엠피글로벌 완성주택 일회성 356억 — **화장품 본업 성장이 아닌 연결 범위 효과가 섞여 있음**
→ 2024 매출 +46%·OP 2.4배는 리들샷 + 일본·국내(올리브영·다이소) 확장. 2024.07 큐브 연결 제외(엔터 매출 539억 → 0) + 이앤씨 편입이 동시에 일어나 2025 연결 매출 YoY(+1.3%)는 **화장품 +19.4%가 가려진 수치**

(5) 분류 결정 논리

→ 매출은 2017 이후 연 20%대 복리로 커졌고 2026 1\~3Q도 +19% — **고성장** 유지
→ 다만 이익은 단일 히트 제품의 수명주기(시카 → 리들샷 → PDRN)와 마케팅 투자 강도에 크게 흔들린다 — 뷰티 브랜드사 특유의 "히트 사이클형" 고성장. 연속 2\~3개 분기 OPM 15% 회복이 확인되기 전까지는 **"고성장(이익 재가속 미확인)"** 꼬리표 유지 `[판단]`

(6) 적정 밸류에이션 방법

| 우선순위 | 방법 | 현재 값 (2026-11-13 종가 9,720원) | 비고 |
|---|---|---|---|
| 1 | PER (LTM 지배순이익) | 시총 3,248억 / 377억 = **약 8.6배** | LTM = 4Q25 102 + 1Q26 182 + 2Q26 27 + 3Q26 66 (지배). 시총은 2026.10.20 소각 후 33,416,480주 기준 |
| 2 | EV/EBIT (LTM) | (3,248 − 순현금 374) / OP 556 = **약 5.2배** | 순현금 = 현금 535 + 기타유동금융자산 140 − 단기차입금 301 (3Q26) |
| 3 | PBR | 3,248 / 지배자본 2,555 = **약 1.27배** | ROE 2025 25.7% |
| 4 | PER (2027E) | 컨센서스 미확보 | 셀사이드 확보 시 보완 |

→ 뷰티 브랜드사는 PER 우선. 히트 사이클이 꺾이면 PER이 한 자릿수로 디레이팅되는 업종 특성 `[판단]`

→ (1) 분기 OPM 15% 회복 여부 — 광고판촉비/매출 14.7%(1H26)가 정상화되는지
→ (2) 화장품 부문 분기 매출 1,300억 유지·YoY 20%대 지속 (3Q26 1,314억, +26%)
