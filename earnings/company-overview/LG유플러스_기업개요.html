## 1. 기업 분류

- **Primary 분류: 지속성장 — 규제 과점 통신 (배당 유틸리티형)** — 매출은 11번의 연간 변화 중 9번 증가(CAGR +3.1%, 감소는 2015·2018), OPM은 5.2\~7.8%의 좁은 밴드. 이익 변동은 수요가 아니라 **네트워크 세대 투자(LTE→5G)와 상각·마케팅 비용 주기**, 그리고 일회성(손상·희망퇴직)에서 발생
- **Secondary 노트: AIDC(AI 데이터센터) 성장 옵션** — 기업인프라 내 AIDC 매출 4,220억 (2025, +18.4%) = 연결 서비스수익의 3.4% [IR 4Q25]. 3Q26 AIDC +27.7% YoY, 파주 AIDC 1동 2027-06 준공 예정 [아이뉴스24 2026-11-04]. 아직 연결 이익 성격을 바꿀 규모는 아님

### ② 산업 분류

- 산업: **이동통신(MNO) + 유선(초고속인터넷·IPTV) + 기업 인프라(데이터센터·회선·솔루션)** — 주파수 할당과 요금·유통 규제를 받는 3사 과점 시장
- DART 업종: 61220 무선 및 위성 통신업 [OpenDART 기업개황] / 사업보고서 기준 "전기통신업"
- 워치리스트 섹터: **통신** / 서브섹터: **통신 (SK텔레콤·KT·LG유플러스)**
- 시장 지위: 모바일 가입회선 3,214만 (MNO 2,305만 + MVNO 909만, 3Q26) [IR 3Q26], 국내 통신 3사 중 3위 사업자. 초고속인터넷 571만·IPTV 578만 회선 [IR 3Q26]

### ③ 분류 결정 논리

(1) **가장 매출 큰 사업부 기준** 적용 시: 모바일 수익 6.67조 = IR 서비스 사업 합계(모바일+스마트홈+기업인프라+전화 11.37조)의 **58.7%** [IR 4Q25, 계산]. 가입자 기반 월정액 매출 → 수요는 경기에 둔감, 성장은 가입회선·ARPU 함수 → **지속성장(저성장)**
(2) **이익 비중 sub-rule**: DART 보고부문은 LG유플러스·LG헬로비전 2개 — 2025 부문 영업이익 8,887억 vs 66억으로 **LG유플러스 부문이 99.3%** [DART 사업보고서(2025.12) 연결 주석 부문정보]. 사업별(모바일·스마트홈·기업인프라) 영업이익은 공시되지 않음 → 이익 성격 판단은 부문 OPM 안정성(2021\~2025 LGU+ 부문 OPM 6.2\~8.3%)으로 대체 → **지속성장 유지**
(3) **Boundary case 처리 — AIDC/기업인프라**: 기업인프라 1.81조 (2025) 중 AIDC 0.42조. AIDC는 "서비스수익의 4%, 영업이익률은 전사 평균의 약 2배" [IR NDR 2026-05] → 이익 기여는 약 7\~8% 수준 **[⚠️ 추정 — 회사 정성 코멘트(매출 4% × OPM 2배) 기반 계산, 정량 미공시]**. 2030E 용량 400MW(IT Load, 2026 165MW 대비 CAGR 25%) 계획 [IR NDR 2026-05]. **AIDC는 성장 옵션(Secondary)이지 Primary를 바꾸지 않음** — 전환 조건은 ⑤ 트리거 참조
(4) **국내 통신 3사 + 글로벌 피어 cross-ref**:
→ **SK텔레콤·KT**: 같은 규제 과점 3사로 Primary 분류는 동일(지속성장·배당형)이 자연스러움. 차이는 비통신 포트폴리오 — 비교 수치는 `SK텔레콤_기업개요.md`, `KT_기업개요.md` (동시 작성, main session 교차검증 대상) 참조
→ 2025 해킹 사태의 비대칭: SKT(유심 정보 유출)·KT(펨토셀 경유 유출, 개인정보위 과징금 539.79억 [보안뉴스 2026-07-30]) 대비 LG유플러스는 임직원·협력사 계정 정보 유출 + 서버 폐기 은폐 의혹으로 **수사 의뢰** 단계 (과징금 미부과) [보안뉴스 2026-07-30]. 경쟁사 위약금 면제로 LGU+ MNO 순증 확대 [디지털데일리 2026-02-20]
→ 글로벌: Verizon·AT&T(미국), NTT·KDDI·SoftBank(일본) 등 선진국 MNO도 같은 "저성장·고배당·EV/EBITDA" 밸류에이션 군 (정성 비교, 수치 미수집)
→ 국내 3사 내 위치: LG유플러스는 유일하게 **케이블 MSO(LG헬로비전)를 연결**하는 사업자 — 2020 이후 연결 매출의 약 8%가 저마진 케이블(2024 부문 영업적자 -28억, 유무형 손상 1,497억)

### ④ 적정 밸류에이션 방법

- **배당수익률 + EV/EBITDA 우선, PBR-ROE 보조**
→ 통신은 감가상각비가 매출의 17\~18%(2025 2.70조 / 15.45조)로 커서 영업이익보다 **EBITDA(2025 3.59조, IR)** 가 현금창출력을 더 잘 보여줌
→ 현재 **EV/EBITDA 약 2.8배** [계산: 시총 6.35조 + 순차입금 4.57조(3Q26, 리스 제외, IR) = 10.92조 / LTM EBITDA 3.84조(4Q25\~3Q26 IR 합산)]
→ **배당수익률 4.4%** [계산: 2025 DPS 660원 / 14,960원]. 배당정책: 별도 순이익(일회성 제외)의 40% 이상 배당 + 순이익의 0\~20% 탄력적 자사주 매입 → 총주주환원 40\~60% [IR NDR 2026-05, DART 사업보고서(2022.12) 배당 정책]
- **PBR 밴드 (연말 종가 × 발행주식 / 지배자본 [계산])**: 고점 **1.20배 (2014)**·1.17배 (2017) → 저점 **0.53배 (2023·2024)** → 2025말 0.71배 → 현재 **0.70배** (6.35조 / 3Q26 지배자본 9.07조). ROE 4.4\~10.9% (2015\~2025)
- **PER은 보조** — LTM 지배순이익 6,699억 [계산: 4Q25 890억 + 9M26 5,809억] 기준 **9.5배**. 손상·희망퇴직 등 영업외·일회성 변동이 커 PER 단독 사용은 부적합
- **피어 차별화**: SKT·KT와 같은 프레임(배당수익률·EV/EBITDA)을 쓰되, LG유플러스는 ① 비통신 자회사 가치(SOTP) 비중이 작아 **본업 현금흐름 = 기업가치**에 가깝고 ② AIDC 성장률이 차별 포인트 → 할인율보다 **배당 성장률(DPS 2014 150원 → 2025 660원)** 이 핵심 driver

| **EV/EBITDA (LTM)** | **4.0배** | **3.8배** | **2.9배** |

→ **읽는 법**: 3사 모두 EV/EBITDA 3\~4배·PBR 1배 미만의 "배당 유틸리티" 밸류 구간. 차이는 ① **SKT** = 이익률 최상위(EBITDA 마진 30%)지만 해킹 감배로 2025 배당수익률이 3사 최저 + 앤트로픽 지분 SOTP 변수, ② **KT** = 매출 규모 최대·마진 최저(비통신 그룹사 mix), 배당수익률 최고, 외국인 한도 49% 소진, ③ **LG유플러스** = EV/EBITDA 최저(2.9배) — 3사 중 가장 싼 본업 현금흐름.

### ⑤ 분기 재평가 트리거 (분류 변경 조건)

- **AIDC 매출이 연결 서비스수익의 10%+** (현재 3.4%) 도달 시 → Secondary 격상 검토 (AI 인프라 성장주 성격 병기)
- **6G·신규 주파수 경매로 CapEx/매출 20%+가 2년 연속** (2019\~2023 20.5\~22.2% 구간과 동일 패턴) 시 → "투자 사이클 국면" 태그 추가 (배당 여력·FCF 하향)
- **개인정보 유출 관련 과징금(전체 매출 3% 이내 상향 추진 [보안뉴스 2026-07-30]) 또는 손해배상이 연간 순이익의 30%+** 시 → 규제 리스크 분류 추가
- **요금·유통 규제의 구조적 변화** (예: 단통법 폐지(2025-07-22 시행 [뉴시스 2025-07-01]) 이후 지원금 경쟁 재점화로 마케팅비/서비스수익 23%+ 2개 분기 연속) 시 → 이익 안정성 재평가

→ 2010-01 합병 출범 월말 9,010원 → **2011-08 4,985원 (20년 최저권, 시총 약 2.18조)** [Yahoo]

(2) 2013\~2018: LTE 성숙 + 유선 성장 → 장기 상승
→ 2013-07 13,700원, 2017말 14,000원 [Yahoo]
→ 2017 OPM 6.7% (1차 고점), 2014→2017 DPS 150 → 400원
→ **2018-09 장중·월말 18,300원 — 합병 후 최고가 (시총 7.99조)** [DART·Yahoo]. 2018-06 5G 3.5GHz 주파수 확보, 2019-02 CJ헬로 인수 결정 공시 [DART 사업보고서(2019.12)]

→ 2019-04 5G 상용화 — 2019 CapEx(연결) 2.56조, CapEx/매출 20.7% (2018 13.4%)
→ 2019-12 LG헬로비전 50%+1주 8,000억원 취득 [DART 사업보고서(2019.12) I-2]. 2020 4Q 순손실 -2,247억 (28GHz 주파수 손상 1,942억 + 헬로비전 영업권 손상 1,725억) [DART 사업보고서(2020.12) 연결 주석]
→ 2022 영업이익 1.08조 (OPM 7.8%, 12년 최고)에도 주가는 2022말 11,050원 — 금리 상승기 배당주 디레이팅
→ 2023 감익(-7.7%), **2023-07 월말 10,010원, 2023·2024말 PBR 0.53배 (12년 최저)** [계산]

(4) 2024\~2026-02: 비용 효율화 + 주주환원 강화 + 경쟁사 해킹 반사이익 → 재평가

→ 2025: 저수익 사업 정리, 3Q25 희망퇴직 약 1,500억 일회성 (제외 시 3Q25 영업이익 3,117억, +26.7%) [아이뉴스24 2025-11-05]
→ 2025-07-21 이사회 — 2021 매입 자기주식(1,000억, 6,783,006주) 소각 결정. 2025 매입 자기주식 800억(1.26%, 5,400,623주)은 2026-05-15 전량 소각 [DART 반기보고서(2026.06) 주식의 총수, IR NDR 2026-05]

→ **2026-02 장중 17,810원 (52주 최고)** [DART 반기보고서(2026.06) 월별 주가]

(5) 2026-03\~11: 자체 해킹 은폐 수사 리스크 + 박스권
→ 2026-01-16 증권신고서에 경찰 수사 관련 투자위험 첫 기재 [SBS Biz 2026-01-21]
