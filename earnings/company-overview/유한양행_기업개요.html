# 유한양행 기업 개요 (v1.0 — 국내 1위권 전통 제약 + 렉라자 로열티 옵션, 지속성장 저마진 + 기술료 이벤트형)
> **Fact verify cutoff**: 2026-11-25 (재무는 2026.09 분기보고서까지 확정치. 주가·시가총액·52주 고저는 Yahoo Finance 2026-11-25 종가 단일 소스 + StockAnalysis 2026-09-23 시총으로 주식수 교차 확인. 렉라자 로열티율·얀센 판매액은 미공시 — 본문에 추정치 없음)

---

## ① 기업 분류

(1) Primary / Secondary 분류

**Primary 분류: 지속성장 (저성장·저마진 내수 제약 base)**

→ 2014\~2025 매출 CAGR **+7.2%** (10,175억 → 21,866억). 12년 중 매출 역성장은 2019년(-2.5%) 1회뿐 — 처방약(ETC) 도입품목 교체·약가 인하가 있어도 국내 1위권 영업망이 매출 바닥을 받친다
→ 12년 평균 OPM **4.4%**, GPM은 27\~35% 밴드(12년 평균 30.7%) — 매출의 절반 이상이 다국적사 도입 상품(트라젠타·자디앙·비리어드·빅타비·베믈리디 등) 유통이라 원가율이 70% 안팎으로 구조적으로 높다
→ 여기에 **R&D 비용이 매출의 10\~13%** (2020년 이후) 얹히면서 OPM이 1\~5% 수준으로 눌려 있다. 영업이익보다 **지분법이익(유한킴벌리 30% 등)이 더 큰 해**가 12년 중 3번(2019·2021·2022), 2023·2024도 근접

**Secondary 노트: 기술료 이벤트형 + 로열티 옵션 (꿈 → 실현 전환 구간)**

→ 이익 변동은 경기가 아니라 **라이선스(기술료) 수익의 유입 시점**이 만든다: 2020년 기술료 1,556억(얀센 병용 마일스톤 $35M·$65M) → OPM 5.2%, 2024년 3Q 기술료 982억(美 FDA 승인 마일스톤 $60M) → 3Q24 OPM 7.9%, 2026년 2Q 589억(EU 상업화 $30M) → 2Q26 OPM 10.5%(분기 사상 최대 영업이익 669억)
→ 2024.08 렉라자(레이저티닙)+리브리반트(아미반타맙) 병용요법 美 FDA 승인 이후 마일스톤이 '일회성 → 지역별 상업화 연쇄(美→日→中→EU)'로 바뀌었고, 판매 로열티가 분기 라이선스 수익의 바닥(분기 40\~80억)을 형성하기 시작 `[판단: 로열티 금액 별도 미공시]`
→ 얀센 계약 총액 $950M 중 수취 누계 **$300M** (2026.05 기준, DART) — 잔여 $650M은 매출 달성 마일스톤 등 조건부

**Entity 구조 (2026.09)**

→ **(1) (주)유한양행(별도)** — 처방약(ETC)·일반약(OTC) 제조·도입·판매, 생활건강(유한락스 등), 해외사업(원료의약품 수출), 라이선스 수익. 오창공장(완제의약품). 별도 매출이 연결의 약 96%
→ **(2) (주)유한화학 (100%)** — 원료의약품(API)·중간체 CDMO (HIV·HCV 치료제 원료 등, 화성·안산). 2025 매출(내부거래 포함) 2,897억, 대부분 유한양행 해외사업부를 통해 수출 → 연결 시 내부매출 제거
→ **(3) 기타 종속 13개사** — (주)와이즈메디(48.9%, 수액), (주)유한메디카(100%), (주)유한건강생활(77.7%), 애드파마(65.9%), (주)이뮨온시아(65.9%, 2025.05 코스닥 상장), (주)에이투젠(62.6%), YUHAN USA 등
→ **(4) 관계기업(지분법)** — **유한킴벌리 30%** (킴벌리클라크 JV, 2025 순이익 1,239억), 유한클로락스 50%, 한국얀센 29.1%, 테라젠이텍스·유한코스메틱·에이프릴바이오·제이인츠바이오·프로젠 등 → 영업외로 연 400\~650억 지분법이익
→ 사업부별 영업이익은 미공시 → 사업부(약품·헬스케어·해외)별 매출·자산만 공시. OPM은 전사 기준

(5) 분류 결정 논리 (4단계)

→ **(1) 매출 큰 사업부 기준**: 약품사업(ETC+OTC) 비중 62\~64%(2025\~3Q26), 처방약(ETC)만 51\~53%. 도입 상품 중심 → 매출은 안정적이나 마진은 낮다 → '지속성장(저성장)' base
→ **(2) Secular 변수 sub-rule**: 국내 처방약 시장은 고령화로 완만 성장하나 정부 약가 인하(2026 약가 제도 개편 우려, 언론) + 도입품목 특허만료(트라젠타 2025 -21.8%, 자디앙 3Q26 누적 -20.2%, 회사 IR)가 상쇄. 성장 엔진은 ① 해외 원료(유한화학, 2025 +26%) ② 렉라자 로열티 — 둘 다 글로벌 파트너(길리어드·J&J) 의존
→ **(3) Boundary case 처리 — 저마진 상품 유통 제약사 + 기술료/로열티 업사이드 혼합**: 라이선스 수익은 매출의 4\~6%지만 **영업이익의 거의 전부**를 설명한다 (2025: 라이선스 1,041억 vs 영업이익 1,044억 / 2024: 1,053억 vs 549억). 즉 '본업 OPM ≈ 0% + 로열티 = 이익' 구조 `[판단: 라이선스 원가(원개발사 오스코텍·제노스코 배분액)를 차감하지 않은 단순 비교 — 실제 본업 이익은 이보다 높다]` → Primary는 매출 성격(지속성장), Secondary는 이익 성격(기술료 이벤트형 + 로열티 옵션)으로 분리 처리
→ **(4) 국내·글로벌 피어 cross-reference**: ① 한미약품 — 2015 기술수출 후 반환 반복(이벤트형 사이클의 실패 사례) vs 유한은 **상업화까지 도달**(美·EU·日·中 허가) → 로열티가 반복 매출로 전환되는 첫 국내 대형 사례 ② 종근당·대웅제약 — 내수 ETC 중심 OPM 6\~10%대로 유한(본업 OPM 0\~3%)보다 높다 → 유한의 R&D 강도(10\~13%)가 마진 차이의 원인 ③ 글로벌 — J&J 리브리반트 병용요법(MARIPOSA 3상)이 EGFR 변이 폐암 1차 치료에서 오시머티닙(AZ 타그리소)과 경쟁 → **유한 이익의 레버리지는 J&J 병용요법 처방 점유율에 연동** `[판단]`

(6) 적정 밸류에이션 방법 (밸류에이션 다이얼)

| 우선순위 | 방법 | 현재 값 (2026-11-25) | 비고 |
|---|---|---|---|
| 1 | **SOTP** (본업 PER + 관계사 지분가치 + 렉라자 로열티 NPV) | 구성요소만 제시 — 본문 추정치 없음 | 본업: 라이선스 제외 이익 기준 PER / 유한킴벌리 30%(장부 1,869억, 2025 지분법 372억·배당 465억) / 렉라자: 잔여 마일스톤 $650M + 판매 로열티 (로열티율 미공시) |
| 2 | PER (TTM 지배순이익) | 시총 6.15조 / 2,324억 = **약 26.4배** | TTM = 4Q25 1,144 + 1Q26 270 + 2Q26 703 + 3Q26 206 (억원) — 4Q25 관계기업 처분익 등 일회성 포함으로 과소 왜곡 |
| 3 | PBR | 6.15조 / 지배자본 23,904억 = **약 2.57배** | 자본의 19%가 관계기업투자(4,558억) — 장부가는 유한킴벌리 등 시가 미반영 |
| 참고 | EV/EBIT (TTM) | (시총 − 순현금 1,145억) / 1,350억 = 약 45배 | 순현금 = 현금 3,788 + 단기금융상품 624 + 단기투자자산 111 − 차입금 3,378 (억원). 영업이익이 얇아 의미 제한적 |

→ 사업 mix상 **본업(저마진 유통)과 로열티(고마진 무형자산)의 가치 결정 변수가 다르다** → 단일 PER보다 SOTP가 1순위. 본업 이익이 얇아 PER은 기술료 유입 분기마다 크게 흔들린다 `[판단]`
→ 로열티 NPV는 J&J 리브리반트 병용요법 매출 × 로열티율(미공시)의 함수 — 셀사이드 리포트의 가정(로열티율·피크 매출)을 별도 확인해야 한다 (본 문서 범위 밖)
→ 삼성전자 비교: 삼성전자(사이클)는 PBR 1순위, 유한양행(지속성장 base + 로열티 옵션)은 SOTP 1순위 — 분류 차이가 방법 차이를 만든다

(7) 분기 재평가 트리거 (분류 변경 조건)

→ (1) **라이선스 수익 TTM 비중 10% 이상** (현재 TTM 1,420억 / 매출 23,166억 = **6.1%**) **+ 마일스톤 없는 분기에도 라이선스 분기 200억 이상** (= 판매 로열티만으로 바닥 형성) → Secondary '로열티 옵션'을 **Primary '로열티 성장형'으로 격상** 검토
→ (2) 반대로 **렉라자 병용요법의 美·EU 처방 둔화**(J&J 분기 실적에서 Rybrevant 매출 역성장 2분기 연속) → 로열티 옵션가치 하향, '내수 제약 지속성장(저마진)'으로 단순화
→ (3) 라이선스 제외 본업 OPM이 2년 연속 3% 이상 개선 (원가율·R&D 효율화) → '지속성장' 내 마진 레벨업으로 PER 비중 상향
→ (4) 신규 대형 기술수출(계약금 $50M+) 또는 차세대 파이프라인(YH35995 고셔병, YH32367 HER2 이중항체 등) 임상 2상 진입 → '꿈' 성격 재부각

→ (4) **원료의약품 고객 집중**: 해외사업(매출 18\~20%)이 소수 글로벌 고객 발주에 좌우, 분기 변동 큼 (10% 이상 단일 고객 'A업체' 매출 15%)
→ (5) **바이오벤처 투자 손상**: 관계기업·투자주식 손상·평가손실 반복 (2024 관계기업투자 평가손실 320억, 무형자산 손상 168억)
→ (6) 소송: 대한민국 원고 손해배상 청구(소가 11.9억, 유한양행 외 26명, 1심 계류) / 에이투젠 용역비 청구(2.2억, 1심 패소·항소 준비) — 회사는 결과 예측 불가로 기재 (DART 2026.09). 제재 해당사항 없음
→ (7) 환율: 원료 수출(달러)·기술료(달러) 수취 → 원화 약세 시 우호적

⑤ ESG

→ ESG 등급(KCGS 등) **미확보** (DART 미기재). 이사회 내 ESG위원회 운영(위원장 오인서 독립이사), ESG경영실 별도 조직

⑥ 인증·라이선스

→ 생산: 오창공장 KGMP, 유한화학 원료 — FDA DMF 등 국제인증 취득 통한 선진국 진출 기재 (DART '원료의약품 산업 특성') `[개별 인증 목록 미대조]`
→ 품목허가: 렉라자(국내), Lazcluze(美 FDA, J&J 보유) / 국내 개량신약 다수 허가
