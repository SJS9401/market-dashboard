# NVIDIA 2026-Q4 팔로업 — 마진 저점 이후 이익이 다시 붙는지, 운전석이 채워지는지

## (1) 이번 분기 숫자와 판정

> 성장 델타: **꺾임 (규칙 판정 — GAAP 영업이익 YoY +147% → +124% → +115%, 4Q 가이던스 약 +85%)** | 내러티브: **유지** → 매매 제외(관찰) 구간 — 재진입 조건은 1Q FY28 가이던스 이익 YoY 재가속 + CEO 선임

> ⚠ 비영업 요인 플래그: 판정을 '꺾임'으로 만든 정점 1Q26 YoY +147%는 1Q25(FQ1 FY26) H20 재고·구매약정 비용 $4.5B가 만든 저기저 효과다. 이 비용을 되돌리면(1Q25 GAAP 영업이익 약 $26.1B) 1Q26 YoY 약 +105% → 2Q26 +124% → 3Q26 +115%로 '가속 후 1회 둔화' = 둔화 판정 [계산, 참고만 — 판정은 보고 기준]. 반대로 4Q26 가이던스는 1주가 더 있는 14주 분기인데도 이익 YoY가 약 +85%로 내려간다

| 지표 | 3Q26 (FQ3 27) | 직전 분기 (FQ2 27) | 4Q26 가이던스 (FQ4 27) |
|---|---|---|---|
| 매출 | $115,844M | $96,221M | $130,000M (±3%, 14주) |
| 영업이익 (GAAP / Non-GAAP) | $77,520M / $77,883M | $63,734M / $63,956M | 약 $81,950M / 약 $82,250M [계산] |
| OPM (GAAP / Non-GAAP) | 66.9% / 67.2% | 66.2% / 66.5% | 약 63.0% / 약 63.3% |
| 매출 YoY | +103.2% | +105.9% | +90.8% |
| 영업이익 YoY (GAAP / Non-GAAP) | +115.3% / +106.3% | +124.1% / +112.0% | 약 +85.0% / 약 +78.4% |

→ 컨센 대비 매출 +6.2%, Non-GAAP 영업이익 +7.8%, EPS $2.68(+8.4%). Vera Rubin 첫 분기 약 $20B. FY28 매출 성장 전망 +70% → +75%

## (2) 지난 분기 체크 결과

→ Vera Rubin 시점·디테일: **확인** (기대 초과 — 첫 분기 약 $20B)
→ 3Q 가이던스 $100B+ 진입: **확인** (가이던스 $108B, 실적 $115.8B)
→ 자사주 분기 $20B+ 페이스: **확인** (3Q $22.1B, 잔여 한도 $227.3B)
→ China 재개: **반대로 나옴** (라이선스 Hopper $2.4B 후 출하 중단, 신규 BIS 수출통제)
→ ACIE 소버린 AI 메가딜: **확인** (ACIE +195% YoY, 소버린 AI 3배 이상)

## (3) 핵심 쟁점 요약

→ **젠슨 황 없는 엔비디아**: 이사회 복귀 불가 명시, 크레스 임시 CEO, 후임 시한 없음. 셀사이드 공통 결론은 "단기 실적 영향 제한, 멀티플에 반영" — 재평가는 승계 확인 후(HSBC·삼성·대신)
→ **FY28 +75%**: 발표 전 하향 우려와 반대로 상향. 구매 약정 $390B로 공급 선확보. 모건스탠리만 +56%로 할인, BIS 렌털 규정·동남아 물량이 변수
→ **마진 저점**: 4Q 71～72%가 바닥, FY28 72～73% — 2027년 초 ASP 15%+ 인상(유진). 이익 델타의 바닥도 4Q
→ **생태계 vs 환원**: 네오클라우드 지원은 '선별'(LPS 우선), 약정 $518B·보증 $118B·매출채권 $81B. 잔여 자사주 소진에 분기 약 $45B 필요(KB)

## (4) 다음 분기 봐야 할 것

**1. 4Q FY27 매출 $130B·GAAP 영업이익 약 $82B 달성 & 1Q FY28 가이던스 내재 영업이익 YoY +85% 이상($99B 이상)** — 충족 시 델타 재평가(둔화/재가속), 미달 시 꺾임 지속
*엔비디아 4Q FY27 실적·컨콜 (2027-02 하순), 1Q FY28 컨센(모건스탠리 $92.1B·HSBC $102.1B)*

**2. CEO 후임 선임과 조사 결과** — 후임 발표 시점·내부/외부, DOJ·SEC·내부 조사, 핵심 임원 이탈
*8-K Item 5.02, 회사 보도자료, 뉴스 키워드 "NVIDIA CEO search", "NVIDIA investigation" (상시)*

**3. GPM 저점 확인** — 4Q 71～72% 실현, 1Q FY28 가이던스 72% 이상
*4Q 실적·가이던스, HBM4 계약가(SK하이닉스·삼성전자 4Q 컨콜 1월, 마이크론 FQ1 12월)*

**4. 수출통제 영향 정량화** — BIS 렌털 규정 범위, 동남아 클라우드 출하, FY28 +75% 유지
*상무부 규정 세부, 4Q 컨콜, TSMC·대만 공급망 월매출 (2026-12～2027-02)*

**5. 현금·생태계 균형** — 분기 자사주 약 $45B 페이스, DSO 64일 이하, 4Q ACIE QoQ 성장(3Q +17.8%)
*4Q 실적·10-K, 코어위브·네비우스 자금 조달·실적 (2027-02～03)*
