# 현대모비스 4Q26 팔로업

## (1) 이번 분기 숫자와 판정

> 성장 델타: 가속 | 내러티브: 약화 → 관찰 구간 (본업 델타는 3Q26이 정점 후보, 로봇 액추에이터는 실행이 진전됐지만 멀티플 하향이 그보다 컸다 — 재점화는 액추에이터 공장 투자 공시)

> ⚠ 비영업 요인 플래그 (BT 2026-11-23 기준 재검토: 비영업발 가속 불인정 — 대칭 적용 결과 **가속 유지**): 화재 비용 971억 가산, A/S 관세 기저·환급과 고객사 비용 회수·보조금(미공개, 범위 추정) 차감 시 비영업 제외 영업이익 YoY는 2Q26 **-2.4\~+0.7%** → 3Q26 **+7.5\~+24.3%** — 보고 기준보다 델타가 크다. 가속을 부정하려면 회수·보조금이 1,620억 이상이어야 함 → 주원인은 본업

| 3Q26 (확정) | 매출 | 영업이익 | OPM | 매출 YoY | 영업이익 YoY |
|---|---|---|---|---|---|
| 실적 (억원) | 157,233 | 9,141 | 5.8% | +4.6% | +17.2% |
| 컨센 대비 | -1.0\~0% | -1.4\~0% (부합) | | | |
| 4Q26E (국내 4사 평균) | 162,820 | 10,246 | 6.3% | +5.7% | +10.1% |

→ 영업이익 YoY 3개 분기 연속 확대(+3.3% → +12.1% → +17.2%). 모듈·핵심부품 335억 흑자(2개 분기 연속), A/S 8,807억(+7.8%). 지배순이익 5,979억(-35.7%)은 컨센 -41% 하회(지분법·외환)
→ 4Q26E는 사상 첫 분기 1조원이지만 YoY +10.1%로 **둔화 경로**, 1Q27E +6.9%(하나) — 컨센상 YoY 정점은 3Q26
→ TP: 첨부 7곳 평균 58.3만 → 53.2만(-8.7%), 하향 5·유지 2. 영업이익 추정은 유지·상향 — **하향 원인은 멀티플** → 내러티브 유지 → 약화로 변경

## (3) 핵심 쟁점 요약

→ **4Q 1조원**: 화재 비용 소멸·연말 정산·모듈 흑자 확대로 7/7이 1조 안팎(0.92\~1.07조). 1조는 이미 컨센 — 델타 기준선은 1.09조, 국내 4사 중 이를 넘는 추정은 0곳
→ **모듈 흑자 구조성**: 일회성·원가 비용 2,461억을 맞고도 흑자. 2027E 모듈 OP 920억(JPM)\~6,610억(삼성)으로 7배 편차 — 2027 증익은 거의 전부 모듈 몫(A/S는 환율로 -2\~-3%)
→ **로봇 액추에이터**: BD 수주 확정·양산용 31종 시제품·공장 검토 막바지. 그러나 2027은 90대 분량(NH), 마진 가정이 EBITDA 30%(메리츠)\~영업이익률 3.5%(Citi)로 갈려 TP 반영액 0\~8조
→ **TP 하향 = 멀티플**: 삼성 P/E 14.8 → 13.7배, 하나 13.5 → 11.9배, NH 11.9 → 11.5배. 컨센 TP 66.6만 → 60.2만(-9.6%), 영업이익 컨센은 불변
→ **램프 매수청구**: 청구가 40.8만원 > 주가 34.6만원 → 한도 2,300억 초과 가능성. Citi "차익·소각 기회" vs MS "오버행"

## (4) 다음 분기 봐야 할 것

① **4Q26 영업이익 1.09조 / 1조원, 모듈 OP 1,700억+** — 1.09조 초과면 가속 연장, 1.0\~1.09조면 둔화(컨센 경로). 연말 비용 정산·보험 회수는 비영업으로 차감해 판정. 모듈 1,700억은 회사 "연간 앞자리 변화" 가이던스 충족선. *4Q26 IR·컨콜(2027.1 하순)*

② **액추에이터 공장 투자 공시·BD 양산 계획** — 입지·투자 금액·CAPA(연산 35만 개), 그리퍼 공급 형태, 퍼셉션 입찰, 그룹 외 고객. 로봇 내러티브 재점화 트리거. *회사 시설투자 공시, CES 2027, BD·그룹 발표*

③ **램프 임시주총·매수청구 규모** — 11/24 특별결의, 12/14까지 청구 규모(청구가 40.8만원, 한도 2,300억), 진행·소각 결정. *임시주총·매수청구 결과 공시*

④ **2027 반도체 원가 분담·A/S 환율** — 메모리·기판 고객사 분담 비율, 2027 모듈 OPM, A/S OPM 25% 유지. *4Q 컨콜 2027 가이던스, 현대차·기아 컨콜, 원/달러*

⑤ **Non-captive 핵심부품 달성률·2027 목표** — 2026 목표 89.7억 달러 대비(3Q 13%), 순연분 2027 반영. *4Q26 IR 수주 페이지*
