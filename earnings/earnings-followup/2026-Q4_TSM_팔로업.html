## (3) 핵심 쟁점 요약

→ **AI 수요 > 공급**: HPC +22% QoQ·비중 68%, 4Q 가이던스 컨센 +5.9%, 2026 +44%. 반면 스마트폰 달러 YoY −1% — 성장은 HPC 단독
→ **마진 희석**: GPM 66.4%(−1.3%p), 해외 팹 희석 2%p → 3～4%p. 2027 OPM FactSet 55.8% vs BofA 60.8%
→ **CapEx 상승**: 2026 US$60～64B 유지, '26～'28 "크게 증가", BofA 2027 US$80～90B. 배당 NT$7 → NT$9
→ **2027 숫자 공백**: AI CAGR 미상향·"2027 prudent" — 비트에도 ADR −8%(10/15 → 11/10), 멀티플 압축
