## (3) 핵심 쟁점 요약

→ **3Q 미스**: ITO 단가 협상 지연(약 200억 이연). 2024년에도 3Q 이연 → 4Q 회수(4Q24 영업이익 +37%) 패턴
→ **이익 정체**: 1~3Q 매출 +16.4%인데 영업이익 +1.0%. Enterprise IT GPM 11.1% → 10.1%(단품 믹스), 차량SW 매출총이익 -19%, 판관비 +14%
→ **차량SW**: 매출 YoY 4개 분기째 0% 안팎. 관세·내비 선택률 하락·외부 내비 앱 허용 — 2027 회복 가정 하향 여지
→ **로봇·피지컬AI**: 매출화는 2027~2028 이후가 공통 시각. "로보틱스 관제 매출 조기 가시화 기대 하락"(흥국)으로 TP 하향(NH 72만 → 34만). 시가총액 7.83조는 교보 기존사업 가치(8.73조) 아래 — 로봇 옵션 가치가 사실상 빠짐
