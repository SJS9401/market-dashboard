# Arm 2026-Q4 팔로업 — 로열티가 바닥을 찍고 AGI CPU가 붙는지 확인한다

## (1) 이번 분기 숫자와 판정

> 성장 델타: **가속 (라이선스 주도, 로열티는 +8%로 둔화)** | 내러티브: **유지** → 경계 구간

| 지표 | 3Q26 (FQ2 27) | 직전 분기 | 4Q26 가이던스 (FQ3 27) |
|---|---|---|---|
| 매출 | $1,443M | $1,289M | $1,540M |
| 영업이익 (GAAP / Non-GAAP) | $201M / $638M | $91M / $531M | Non-GAAP 약 $670M (유진·컨센) |
| OPM (GAAP / Non-GAAP) | 13.9% / 44.2% | 7.1% / 41.2% | Non-GAAP 약 43.5% |
| 매출 YoY | +27.1% | +22.4% | +24.0% |
| 영업이익 YoY (Non-GAAP) | +36.6% | +28.9% [계산] | 약 +32.7% |

→ 라이선스 $773M(+50.1%), 로열티 $670M(+8.1%). 로열티 내 데이터센터 약 2배, Physical AI +50%, 모바일(Edge AI) 보합

## (2) 지난 분기 체크 결과

→ 스마트폰 로열티 정상화: **반대로 나옴** (FQ1 +22% 회복 후 FQ2 +8% 재악화)
→ 데이터센터 로열티 2배 지속: **확인**
→ AGI CPU 출하·추가 고객: **부분 확인** (주문·고객 확인, 본격 출하는 FQ4 27)
→ FY27 라이선스·로열티 +20%: **엇갈림** (라이선스 초과, 로열티 미달)
→ NVIDIA Vera 출하: **확인** (2026년 말 본격화, 일정 유지)

## (3) 핵심 쟁점 요약

→ **모바일 로열티 둔화**: 메모리 가격 → 스마트폰 출하 감소. FQ3 로열티도 "한 자릿수 초반". 회사는 내년 모바일 최소 두 자릿수 성장 주장
→ **라이선스 $773M 지속성**: FQ3·FQ4 추가 상승 코멘트. 유진은 로열티 선행지표, NH는 12～24개월 시차로 해석
→ **AGI CPU**: FY27～28 누적 $20억(2배 상향, 컨센 $12.7억), 본격 매출 FQ4 27, 1세대 GPM 30%대 후반～40%대 초반 — 마진 희석
→ **데이터센터 로열티·점유율**: "수년간 세 자릿수 성장", 하이퍼스케일러 CPU 점유율 2026년 말 60% 돌파, 고객 4곳 집중
