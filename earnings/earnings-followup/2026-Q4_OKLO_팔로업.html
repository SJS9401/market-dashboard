# Oklo 4Q26 팔로업 리포트

> 분기: 2026-Q4 (모니터링 시점)
> 직전 분기 자료: `2026-Q3_OKLO_리뷰.md` (10-Q 3Q26 + 컨콜 요약(비공식) + 보도 인용 TP — 셀사이드 첨부 0건)
> 작성 시각: 2026-11-16 15:40 KST
> 섹터: 원전 / 서브섹터: SMR·차세대 원자로 (섹터 델타 합산 제외 — 마일스톤·현금 추적)

## 1. 3Q26 숫자와 판정

> 성장 델타: 합산 제외 — 마일스톤 판정: 정체 | 내러티브: 약화 → 매매 제외 구간

매출 $1.86M(인수 자회사 용역, 전력 매출 0), 영업비용 $84.3M(+132% YoY, 정점 4Q25 +271% 이후 3개 분기 둔화), 순손실 −$41.7M(EPS −$0.22, FactSet 컨센 −$0.27 대비 양호 — 토지 매각익 $11.4M·이자수익 $27.9M 영향). 분기 현금 소진(영업CF+CapEx) $199.5M 사상 최대, CapEx $154.0M. 유동성 $3.13B·차입 0, 런웨이는 2026 가이던스 기준 4.8\~6.0년·3Q 연환산 기준 3.9년. 3Q 증자 $401.8M을 주당 $42.2에 조달(1Q26 $95.5), 발행주식 195.2M주(YoY +25%). 2026 가이던스(영업CF −$120\~150M, CapEx $400\~500M) 유지.

## 2. 지난 분기 체크 결과

첫 리뷰라 직전 체크 항목이 없다. 기업개요 OKLO v1.0(2026-11-15)의 분기 재평가 트리거를 이번 팔로업 항목으로 이어받았다.

## 3. 핵심 쟁점 요약

**Aurora 일정 후퇴** — 첫 가동 "2028" → "2028\~2029". DSA 승인이 공사 완료 즈음인 2028경이라 2029가 기본값에 가깝다.

**7/4 임계 미달 vs Groves 첫 임계** — DOE 목표일에 경쟁사 4곳이 먼저 임계, Oklo Groves는 8/5 첫 임계(민간 부지 첫 사례). 실물 운영 증거지만 주가 촉매로는 소진됐다.

**구속력 PPA 0건** — CEO 스스로 Meta 계약은 "원자로 건설엔 비구속"이라고 했다. 공급망은 Aurora 27기분을 예약했는데 확정 수요는 0기.

**PJM·FERC 패소** — 버지니아 계통연계 철회, FERC 이의 기각. 오하이오 1.2GW도 PJM 관할(절차 약 24개월)이라 계통이 인허가와 별개의 두 번째 병목이 됐다.

**Centrus HALEU** — 9/30 본계약, 11/2 Meta 자금이 Centrus로 직접 집행. 이번 분기 유일하게 돈이 움직인 상업 계약이지만 Meta 프로젝트 조건부.

**자금 vs 희석** — 셀사이드 2026\~30 소진 경로 약 $6.3B = 현금의 2배. TP 하향(Wedbush $110 → $36, Craig-Hallum $53 → $27, Canaccord $100 → $66)은 실적이 아니라 멀티플·자본비용 하향.

## 4. 4Q26 봐야 할 것

**(1) 4Q CapEx·소진과 Aurora-INL 공사비 공개** — 4Q CapEx $119\~219M(가이던스 역산) 중 하단 미달이면 공사 지연 신호. 총공사비 공개 여부(Piper 추정 $7,000/kW ≈ $525M)와 2027 소진 가이던스. *FY2026 10-K·4Q 컨콜 (2027-03 중순)*

**(2) 구속력 PPA 첫 체결** — Meta 오하이오·Switch 중 "non-binding"이 빠진 계약 1건, Equinix ROFR(2027-02 만료) 행사 여부, Meta 선급 2차분. *8-K Item 1.01, 10-K Commercialization 섹션 (2027-02\~03)*

**(3) Aurora-INL 일정** — 주요 기기 설치 착수·첫 A3F 연료집합체(2027 목표), 가동 목표 문구에 "2030"이 등장하면 후퇴 판정. *10-K/10-Q Plan of Operations, DOE 인가 공지 (2027-03\~08)*

**(4) 희석 속도** — ATM 2 잔여 약 $911M 사용 속도, 주당 단가 $30 이하 여부, 발행주식 200M주 돌파, 비주식 조달(DOE 대출·고객 선급) 등장. *10-K 자본변동표·표지 주식수, 8-K (2027-03)*

**(5) 계통연계·동위원소 첫 매출** — 오하이오 PJM 절차, 추가 FERC 분쟁, Groves-2 착공과 첫 계약 동위원소 납품(2027) — 분기 매출 $10M+면 "초기 매출" 트리거. *10-Q 위험요인, PJM 대기열·FERC 도켓 (2027 내내)*
