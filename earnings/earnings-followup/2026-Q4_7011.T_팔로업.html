# Mitsubishi Heavy (원자력 부문) 4Q26 팔로업 리포트

> 분기: 2026-Q4 (모니터링 시점, MHI 회계 FY2026 3Q = 10\~12월)
> 직전 분기 자료: `2026-Q3_7011.T_리뷰.md` (1H FY2026 결산 설명자료·결산단신·Q&A 요지 2026-11-06, 셀사이드 미확보 — 숫자 중심)
> 작성 시각: 2026-11-16 15:40 KST
> 섹터: 원전 / 서브섹터: 원전 기자재 글로벌
> 비영업 요인: IGCC 충당금(일회성)·저기저
> 다음 발표: FY26 3Q 결산 — 2027-02 초 예상 (회사 미공지)

## 1. 3Q26 숫자와 판정

> 성장 델타: 유지 | 내러티브: 강화 → 델타 유지(ES 사업이익 YoY +79.6% → +80.2%, 단 회사 2H 계획은 +26%로 둔화 경로) + 내러티브 강화 → 관심 구간 (원자력 매출은 강하지만 판정 이익 단위가 Energy Systems이고, 매매 수단 7011.T의 주가는 GTCC·방산·그룹 이슈가 결정 — 순수 노출 아님)

> ⚠ 비영업 요인 플래그: Energy Systems 보고 이익에 원자력 무관 IGCC 충당금 약 ¥70bn 포함(일회성 비용) + 3Q25 저기저 — 보고 이익률 7.5% vs 충당금 제외 19.4%(참고)

판정 기준은 v11 이익 기준이다 — 원자력 이익이 미공시라 원자력을 포함하는 최소 공시 이익 단위인 Energy Systems 사업이익(보고치, IGCC 충당금 포함)으로 판정한다 (BT 결정 2026-11-16). 3Q26 Energy Systems 사업이익 ¥43.8bn(이익률 7.5%), YoY +80.2%로 2Q26(+79.6%) 대비 델타 +0.6%p → 유지다. 다만 3Q25 기저(¥24.3bn, 5.4%)가 낮아서 나온 YoY이고, 보고 이익률은 2Q26 18.9%에서 급락했다(IGCC 충당금 약 ¥70bn 제외 시 19.4%, 참고). 회사 2H 계획은 ES 사업이익 YoY +26%라 다음 분기 기본값은 둔화다 [계산]. 참고로 원자력 매출 ¥71.8bn(+46.5%), 수주 ¥122.9bn(+51.7%), TTM 매출 ¥410.5bn(사상 최고)이고, FY26 원자력 계획은 수주 ¥450bn → ¥600bn, 매출 ¥400bn → ¥550bn(+52%)으로 올랐다.

## 2. 지난 분기 체크 결과

첫 리뷰라 직전 체크 항목은 없다. 기업개요(2026-11-15)의 분류 재평가 트리거 4개 중 "원자력 매출 2년 연속 +20%"는 FY25 +20.8%로 1년차 확인, FY26 계획 +52%로 진행 중이다. SRZ-1200 첫 수주·원자력 이익 별도 공시는 미발생이다.

## 3. 핵심 쟁점 요약

**계획 상향의 하반기 몰림** — 상향분 ¥150bn이 사실상 전부 하반기 몫이다. 1H 진척률 27.7%는 최근 4년 중 최저이고, 회사 사유는 "핵연료 사이클 공사 추가"다. 롯카쇼·J-MOX 공정이 하반기 매출의 핵심 변수다.

**마진은 대용 지표로만** — ES 이익률 급락은 증기발전 IGCC 때문이고 원자력과 무관하다. 원자력 애프터서비스 비율 71%(GTCC 42%)라 평균보다 마진이 높을 개연성이 있지만 공시로 확인할 수 없다.

**파이프라인** — 설명자료에 원자력 생산능력 투자 약 ¥100bn을 "신규 건설 대비"로 처음 명시했다. 도마리 3호기 2027 초 재가동, 간사이 미하마 사전조사(SRZ-1200 후보) 2027-03 전후 완료가 다음 이정표다.

**그룹 맥락** — 그룹 FY26 사업이익 계획 ¥540bn → ¥600bn, 자사주 최대 ¥300bn. 설명회 질문 11개 중 원자력은 0개였고, 주가는 발표일 −4.6%, 11/13 −7.4%로 GTCC·데이터센터 쪽 논의에 묶여 움직였다.

## 4. 4Q26 봐야 할 것

**(1) 4Q26(FY26 3Q) Energy Systems 사업이익(보고) ¥116bn+ (YoY +75% 이상)** — 델타 판정 1순위. 4Q25 기저 ¥66.0bn 대비 ¥119bn 초과면 가속, ¥116\~119bn 유지, 그 아래는 둔화다. 회사 2H 계획대로면 약 ¥83bn(+26%)이라 둔화가 기본값이다. IGCC 등 일회성도 보고치 그대로 판정한다. *FY26 3Q 결산 설명자료 세그먼트 표(9M − 1H), 2027-02 초*

**(2) 원자력 매출 ¥110bn+ (YoY +49%), FY26 계획 ¥600bn / ¥550bn 유지 (참고)** — 9M 매출 진척률 약 48%(FY25 49%)면 하반기 몰림 계획이 확인되고, ¥90bn 미만이면 ¥550bn 하향 위험이다. 2H 수주는 계획상 −10%라 9M B/B 1.3 이상이면 정상이다. *설명자료 'Main Businesses' 표, 2027-02 초*

**(3) IGCC 추가 비용 없음, ES 보고 이익률 15%+ 회복** — 충당금 추가·리스크 버퍼 ¥20bn 사용 여부, 원자력 애프터서비스 비율 70%대 유지도 함께 본다. *설명자료 이익 bridge·Appendix, 2027-02 초*

**(4) 롯카쇼 재처리공장 준공(2027-03 목표) 28번째 연기 여부** — 연기 시 연료사이클 매출 이연인지 추가 공사 수주인지 구분한다. *JNFL 발표, NRA 심사회의, 키워드 "六ヶ所 竣工 延期", 2026-12\~2027-03*

**(5) 도마리 3 재가동·미하마 사전조사·SRZ-1200·2027 MTBP** — 신규 건설 옵션이 계약·목표 숫자로 바뀌는지 본다. *전력사·NRA 발표, MHI 보도자료, 2027 MTBP 설명자료, 2027-01\~05*
