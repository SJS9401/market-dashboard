# Teradyne Robotics 4Q26 팔로업 리포트

> 분기: 2026-Q4 (모니터링 시점)
> 종목: Robotics 부문 (Teradyne, TER) — 섹터: 로봇 / 서브섹터: 산업·물류 자동화
> 섹터 합산: 제외 (트래킹 피어, Robotics 부문만)
> 직전 분기 자료: `2026-Q3_TER_리뷰.md` (2026-10-27 발표, 10-Q 2026-10-30 · 숫자 중심 리뷰, 리서치 첨부 0건)
> 작성 시각: 2026-11-23 11:50 KST

---

## 1. 3Q26 숫자와 판정

> 성장 델타: **가속** | 내러티브: **유지** → 관찰 구간 (가속 초입, 흑자 0.4%로 얇음 — v1 "유지"를 BT 2026-11-24 % 기준으로 재판정)

| 지표 (Robotics 부문) | 3Q26 | 직전 분기 대비 |
|---|---|---|
| 부문 매출 | $95.8M (+27.6% YoY, 3분기 기준 최대) | YoY +33.4% → **+27.6%** (-5.8%p) |
| 부문 세전이익 | **+$0.3M** (전년 -$17.6M, 흑자 전환) | YoY +86.1% → **+102.0%** (+15.9%p) |
| 부문 세전이익률 | 0.4% | -2.6% → 0.4% (YoY 변화 +22.2%p → +23.8%p) |
| 매출총이익률 | 59.2% | 53.5% → 59.2% |
| 전사 (참고) | 매출 $1,306.0M(+69.8%), GAAP 영업이익 $402.0M(OPM 30.8%) | 영업이익 YoY +382.7% → +176.7% |

판정은 부문 세전이익 기준이다(영업이익 미공시). 전년 적자 분기도 % 공식 (당기 − 전년) ÷ |전년|으로 계산한다(BT 2026-11-24): 2Q26 (−2.6 − (−18.5)) ÷ 18.5 = +86.1% → 3Q26 (0.3 − (−17.6)) ÷ 17.6 = +102.0% → +15.9%p 확대 = 가속. 매출 YoY 둔화(-5.8%p)와 엇갈리지만 부문이익 % 중심으로 판정. YoY 개선 $17.9M 중 82%가 매출총이익 증가(물량·믹스)다. Robotics 가이던스는 없다 — 전사 4Q26 가이던스 매출 $1,250\~1,350M만 있음.

## 2. 지난 분기 체크 결과

> 첫 리뷰 — 직전 체크 없음 (2026-11-14 트래킹 피어 편입)

## 3. 핵심 쟁점 요약

**(1) 흑자의 질** — 비용 절감보다 매출 레버리지(매출총이익 +$14.6M)가 주 원인. 감원 효과는 이미 반영돼 앞으로는 매출·GPM이 이익을 결정한다.

**(2) 수요처** — 최대 수요처는 전자·반도체 고객, 아시아 +82%·미주 +37%, 유럽 -3.5%. CFO는 데이터센터 밸류체인의 로봇 보조 테스트·조립을 강조. Goldman 질문에 "주요 고객 밖 모멘텀은 고르지 않다".

**(3) 피지컬 AI** — 회사가 2027 파일럿, 2028 본격 채택으로 일정을 둠. SIG 질문에 Robotics는 "모델 기대치대로". 기대를 올리지 않았다.

**(4) 지속성** — 흑자 폭 0.4%는 GPM 1%p(약 $1M)에 뒤집힌다. 전사 R&D 재투자 방침과 4Q25 GPM 42.3% 전례가 리스크, 4Q 성수기가 상쇄 요인.

## 4. 4Q26 봐야 할 것

**(1) 4Q26 부문 세전이익 YoY +102.0% — 가속 판정선 (1순위)**
부문 세전이익 +$1.8M 초과면 가속(YoY +107% 초과, 기저 4Q25 -$26.1M), -$0.8M\~+$1.8M 유지, -$26.1M\~-$0.8M 둔화, -$26.1M 미만 꺾임. 보조: 매출 YoY +20% 이상($107M+, 기저 $89.4M). 4Q26 +$3.2M 이상이면 2026 연간 흑자(2018년 이후 처음).
*모니터링: 4Q26 실적 8-K(\~2027-02-01 AMC), 10-K 2026 부문 정보 / 뉴스 키워드 "Teradyne Robotics fourth quarter", "Universal Robots revenue"*

**(2) Robotics 매출총이익률 55% 이상**
3Q26 59.2%가 믹스 정점인지, 4Q25 42.3% 같은 급락이 재발하는지.
*모니터링: 10-K 2026 부문 손익(4Q = 연간 − 9M, 2027-02 중순)*

**(3) 판관+개발비 분기 $45M대 유지**
3Q26 $45.5M. $50M 이상이면 손익분기 매출이 $100M 위로 올라간다. 2027 R&D 재투자 규모.
*모니터링: 10-K 부문 정보, 4Q26 컨콜 투자 계획*

**(4) 수요처·지역 — AI 하드웨어 수요 지속, 유럽 회복**
아시아·미주 성장 유지, 유럽 플러스 복귀, "주요 고객 밖" 모멘텀 개선 언급.
*모니터링: 10-K 지역 매출 세분, 4Q26 컨콜 Q&A, 두산로보틱스·Symbotic 실적 교차 확인*

**(5) 피지컬 AI·대형 고객 진척**
2027 연구소·시험 단계 활동, NVIDIA 협력 제품화, 2027 Robotics 성장에 대한 정성 가이드.
*모니터링: 4Q26 컨콜, 회사 보도자료 / 뉴스 키워드 "Universal Robots physical AI", "Teradyne Robotics NVIDIA", "MiR AMR order"*
