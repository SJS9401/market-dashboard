## (2) 지난 분기 체크 결과

→ FQ4 매출 $3.80B·클라우드 90%+: **부분 확인** (매출 OK, 클라우드 88%)
→ 40TB ePMR 램프: **확인** (출하 비중 FQ2 30% → FQ3 50%)
→ HAMR 4개 고객 → 2027 램프: **부분 확인** (2개 하이퍼스케일러 선행, 2개는 2027 상반기 인증 시작)
→ UltraSMR 60%, 샌디스크 잔여 지분: **미확인** → 이월

## (3) 핵심 쟁점 요약

→ **가격 가속은 언제까지**: TB당 가격 +18% → +28%, 가이던스상 +35%. 회사가 3～4개 분기 뒤 둔화를 예고
→ **원가·CapEx**: 메모리 가격 상승으로 원가 절감률 10% 하회, CapEx 2년간 4～6% 상단 초과 → 시간외 −6.4%
→ **EB 성장 저점과 HAMR**: 이번 분기가 EB 성장률 저점, 2027년 HAMR로 물량이 가격의 바통을 받는다
