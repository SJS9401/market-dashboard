# AMD 4Q26 팔로업

## (1) 이번 분기 숫자와 판정

> 성장 델타: **둔화 (일시 — 조정 기준 영업이익 YoY 82% → 75%, 4Q 가이던스 +96%로 재가속)** | 내러티브: **강화** → 메모리와 달리 델타가 아직 위로 열려 있는 '가속 대기 구간' [판단]

| 지표 (Non-GAAP, $M) | 2Q26 | **3Q26** | 4Q26 가이던스 |
|---|---|---|---|
| 매출액 | 11,536 | **13,377** | 17,000 (±3%) |
| 영업이익 | 3,094 | **3,923** | 약 5,600 |
| OPM | 26.8% | **29.3%** | 약 32.9% |
| 매출 YoY | +50.1% | **+44.7%** | +65.5% |
| 영업이익 YoY (조정) | +82.3% | **+75.3%** | 약 +96.2% |

→ 컨센 대비 매출 +2.3%, 영업이익 +6.7%. 4Q 가이던스 매출 컨센 대비 +4～5%
→ 2027 매출 +80% 이상, 서버 CPU 약 2배, 데이터센터 비중 80% 이상
→ 데이터센터 +97% YoY(OPM 34%), Client & Gaming −8%(Gaming −40%), Embedded +29%

## (2) 지난 분기 체크 결과

→ 직전 팔로업(2026-Q2) 5개 항목 중 3개 확인(서버 CPU +70% → 3Q 2배, Helios 3Q 매출 인식, Gaming 둔화·GPM 희석 예고대로), 2개 미확인(Verano 출시, 삼성전자 HBM4 공급)

## (3) 핵심 쟁점 요약

→ **2027 +80% 공급**: 제약은 수요가 아니라 공급. 회사가 확보한 공급 기준 가이던스라 하방은 단단, 상단은 HBM 배정이 결정
→ **마진 희석**: GPM 55.9% → 55%(4Q). Citi는 2027 GPM 54.2%로 EPS −11%. 영업이익 상방은 opex 레버리지에서
→ **현금흐름**: FCF $0.55B(−64%), 재고 +$3B, 패키징 장비 직접 투자 — 2027 램프 선투자
→ **PC 붕괴**: 2027 PC 두 자릿수 감소, Client 4Q −20% 이상. 매출 비중 축소로 희석
→ **주가**: 11/5 −17%(S&P 500 −4.4% 섹터·매크로 매도), 52주 고점 대비 약 −39%

## (4) 다음 분기 봐야 할 것

(1) **4Q26 매출 $17B·영업이익 $5.6B & 데이터센터 +50% QoQ(약 $12.8B)**
→ 달성 시 델타 '가속' 복귀, 미달 시 '둔화' 지속
→ *모니터링: AMD 4Q26 실적·컨콜 (2027-02 초)*

(2) **1Q27 가이던스 — 계절성 속 QoQ 성장, GPM 54% 이상**
→ AI GPU 믹스 확대 속 마진 하한 확인
→ *모니터링: 4Q 컨콜 가이던스, FactSet·Citi 1Q27 컨센*

(3) **HBM 공급·원가**
→ 2027 HBM4/4E 배정, 원가 분담 구조, 삼성전자 HBM4 공급 여부
→ *모니터링: SK하이닉스·삼성전자 4Q 컨콜(1월), 마이크론 FQ1 27(12월), TrendForce*

(4) **현금흐름·재고 정상화**
→ 재고 증가 둔화, FCF 회복, 워런트 비현금 비용 규모
→ *모니터링: 4Q 10-K·실적 자료*

(5) **하이퍼스케일러 2027 CapEx·Helios 신규 고객**
→ 매크로(규제·금리) 속 AI 투자 지속, 5곳 외 신규 고객·GW 계약
