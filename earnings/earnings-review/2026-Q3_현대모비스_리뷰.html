# 현대모비스 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 가속 | 내러티브: 유지 → 관찰 구간 (본업 델타는 살아 있으나 로봇 부품 내러티브는 2028 공급 전까지 숫자 공백)

→ 숫자: 매출 15.72조(+4.6% YoY), 영업이익 9,141억(+17.2%), OPM 5.8%. 영업이익 YoY가 1Q26 +3.3% → 2Q26 +12.1% → 3Q26 +17.2%로 **3개 분기 연속 확대**, 매출 YoY도 2.4% → 4.6%로 반등 → 가속. 컨센 부합(키움·유진)
→ 델타의 주인공은 A/S가 아니라 **모듈·핵심부품의 흑자 정착**(3Q25 -370억 → 3Q26 +335억, 2개 분기 연속 흑자). A/S는 +7.8%로 오히려 둔화(2Q +15.1%)
→ 로봇: 아틀라스용 액추에이터 시제품 생산이 2026.11 의왕에서 시작, 2028 공급 목표. 키움은 "양산 수주 미확보 — 샘플만으로는 리레이팅 어렵다"고 본다. 주가는 2026-06 ATH 822,000원 대비 -57%(11/13 355,500원)
→ 다음 분기 관건: 4Q26 **첫 분기 영업이익 1조원** 달성(회사 시사, 키움 1.03조) — 달성 시 델타 가속 4개 분기 연속, 그리고 로봇 부품 외부·추가 품목(핸드그리퍼·퍼셉션) 수주

## 2. 시장 쟁점

① 2-0 지난 분기 체크

→ 첫 리뷰 — 직전 체크 없음 (2Q26 리뷰 미작성)

② 이번 분기 쟁점 4개

| # | 쟁점 | 근거 소스 |
|---|---|---|
| (1) | 모듈·핵심부품 흑자는 구조적인가 — 전장 믹스 vs 일시적 | 회사 IR, 키움, 유진 |
| (2) | 로봇 액추에이터 — 시제품에서 리레이팅까지 거리 | 회사 IR·컨콜(SBS Biz·딜사이트), 키움 |
| (3) | 밸류에이션 기준 논쟁 — 로봇 장기 성장을 얼마나 넣나 | 토요경제(현대차증권·KB), 키움 |
| (4) | Non-captive 수주 부진과 램프 매각 | 회사 IR, 키움 |

③ 쟁점별 분해

(1) **모듈·핵심부품 흑자는 구조적인가**

(1-1) 회사 설명
→ "인도 화재 및 메모리 반도체 비용 부담에도 불구, 유럽 전기차 판매 증가 및 전장 중심의 제품 믹스 개선으로 영업이익 흑자 전환" (회사 3Q26 IR p.5)
→ 4Q26에도 모듈·핵심부품 흑자·성장 지속, 분기 영업이익 첫 1조원 가능성 시사 (키움 11/03 컨콜 정리)

(1-2) 증권사별 해석

| 소스 | 핵심 가정·추정 | 논리 |
|---|---|---|
| 키움 (11/03) | 부품제조 매출 +5.8% vs 완성차 생산 -2.3%, 4Q26E 영업이익 1.03조 | 피어가 파업·메모리 비용으로 미스할 때 흑자 유지 = 고부가 전장 전환. A/S 의존도 하락 |
| 유진 (11/02, 보도) | 모듈 매출 12.27조, 영업이익 335억 흑전 | 컨센 부합, TP 63만원 유지 |

(1-3) 공통 vs 갈림
→ 공통: 흑자의 원인은 물량이 아니라 **믹스(전장·전동화)** — 고객 생산이 줄어도 이익이 났다
→ 갈림: 지속성. 3Q 흑자 335억은 OPM 0.3%로 얇다. 1Q26처럼 비용(인도 화재·메모리) 한 번에 다시 적자 전환 가능

(1-4) [판단]
→ 4Q는 계절적으로 모듈 이익이 가장 큰 분기(4Q24 1,740억, 4Q25 1,706억). **4Q26 모듈 OP 2,000억+가 나와야 "구조적 개선"**으로 볼 수 있다. 1조원 달성 여부의 대부분이 여기 달렸다 `[판단]`

(2) **로봇 액추에이터 — 시제품에서 리레이팅까지 거리**

(2-1) 회사 설명
→ 로보틱스 액추에이터 2종 최초 공개(9월) 및 시제품 생산(11월). "기술 내재화 및 핵심부품 공급으로 그룹 내 핵심 파트너 입지 확보" — 액추에이터(수주 완료), 핸드그리퍼(공동개발), 퍼셉션모듈(입찰참여중) (회사 3Q26 IR p.12)
→ 의왕연구소 시제품 생산, 2028 공급 시점에 맞춰 고객사와 성능·신뢰성 검증. 액추에이터는 휴머노이드 재료비의 약 60%. 로보틱스 핵심부품 조직 신설, 인력 약 2배 (SBS Biz·딜사이트 10/30)
→ 2026.08 BD에 4,100만 달러 추가 출자 (IR p.13) — 키움은 소프트뱅크 보유 BD 지분 취득 목적으로 해석

(2-2) 증권사별 해석

| 소스 | 핵심 가정 | 논리 |
|---|---|---|
| 키움 (11/03) | 양산 물량 미확보 | 샘플만으로 리레이팅 기대 어려움. 다른 로봇 부품 수주가 있어야 재평가 |
| KB (10/14, 발표 전) | DCF 고성장 기간 2034 → 2032년 단축, 장기 성장 가정은 유지 | TP 90만 → 80만, 12MF 내재 P/E 18.1배 |
| 현대차증권 (10/13, 발표 전) | 적용 P/E 14.4배 → 11.2배 | TP 69만 → 52만, 이익 추정은 -2.6%만 하향 |

(2-3) 공통 vs 갈림
→ 공통: 로봇은 **2028 공급 전까지 매출 0** — 이번 분기 숫자에 로봇은 없다
→ 갈림: 로봇 가치를 TP에 넣는 방식(DCF 장기 성장 vs P/E 멀티플). 같은 이익 추정에서 TP가 52만~80만원으로 갈린다

(2-4) [판단]
→ 그룹 계획(2028 액추에이터 연 35만 개 시설 — 헤럴드경제 05/18)이 맞다면 모비스는 BD 다음으로 확실한 수혜처다. 하지만 **공급 가격·물량·외부 고객**이 공개되기 전에는 "옵션"에 머문다. 리레이팅 트리거는 ① 그룹 외 휴머노이드 업체 수주 ② 액추에이터 공장 투자 공시 `[판단]`

(3) **밸류에이션 기준 논쟁**

## 3. 내러티브 점검

① 성장 스토리 정의
→ "현대차그룹 휴머노이드(아틀라스) 양산의 **핵심 부품 공급사** — 재료비 60%인 액추에이터를 내재화해 2028년부터 로봇 부품 매출을 만든다. 그 사이 A/S 캐시카우와 전장 믹스로 본업 이익이 받친다"

② 이번 분기가 스토리에 준 영향
→ 강화: 본업(모듈 흑자 정착, 영업이익 +17%)과 로봇 실행(시제품 생산 개시, 조직·인력 2배)이 모두 계획대로 진행
→ 약화: 로봇 양산 물량·가격·외부 고객이 여전히 없음, Non-captive 핵심부품 수주 급랭
→ 종합 **유지** — 스토리 전제는 그대로, 증명은 2028로 미뤄진 상태

③ 국면 판단
→ 델타 가속(OP YoY 3개 분기 연속 확대) + 내러티브 유지 → **관찰 구간**. 본업 델타는 BT 기준 "살아 있음"이지만 4Q26E YoY(+10.7%)가 3Q(+17.2%)보다 낮아 **가속은 이번 분기가 정점일 가능성**이 크다. 로봇 섹터 종목으로서의 모멘텀(로봇 내러티브 강화)은 이번 분기에 없었다 `[판단]`

④ 트리거와 리스크
→ 트리거: ① 4Q26 분기 영업이익 1조원 첫 돌파 ② 그룹 외 휴머노이드 업체 액추에이터·그리퍼 수주 ③ 미국 액추에이터 공장 투자 공시
→ 리스크: ① 원화 강세 → A/S 마진·외환손익(키움 지적) ② 메모리 등 원자재 비용 ③ 현대차·기아 파업 등 물량 차질 ④ Section 232 로봇·부품 관세(현대차 리뷰 참조)
