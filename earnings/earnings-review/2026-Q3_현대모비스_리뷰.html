# 현대모비스 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 가속 | 내러티브: 약화 → 관찰 구간 (본업 델타는 3Q26이 정점 후보, 로봇 액추에이터는 실행이 진전됐지만 멀티플 하향이 그보다 컸다 — 재점화는 액추에이터 공장 투자 공시)

> ⚠ 비영업 요인 플래그: 가속은 인수·환입이 아니라 본업에서 나왔다 — 인도 화재 비용 **971억을 영업이익에서 떠안고도 +17.2%**. 화재 비용을 더하면 영업이익 약 1.01조, YoY 약 +30% `[참고, 하나·삼성 971억 단순 가산 — 판정 미사용]`. 반대로 고객사 비용 회수·보조금(금액 미공개)과 3Q25 관세 저기저가 YoY를 받쳤고, 직전 분기 2Q26(+12.1%)에는 A/S 관세 환급 일회성이 있었다 — 인수 주도 가속 아님

→ 숫자(확정): 매출 15.72조(+4.6% YoY), 영업이익 9,141억(+17.2%), OPM 5.8% — 3Q26 분기보고서(2026-11-16) 확정치가 10/30 발표치와 동일. 영업이익 YoY +3.3% → +12.1% → **+17.2%로 3개 분기 연속 확대**(+5.1%p), 매출 YoY도 2.4% → 4.6% → 판정표상 **가속** (변화폭 +5.1%p로 유지 경계선을 간신히 넘은 가속). 컨센 대비 매출 -1.0\~0%, 영업이익 -1.4\~0%로 부합. 지배순이익 5,979억(-35.7%)은 컨센 1.01조를 -41% 하회(지분법·외환)
→ 다음 분기 경로: 4Q26E 영업이익 1.02조(첨부 국내 4사 평균, YoY +10.1%) — **사상 첫 분기 1조원이지만 YoY는 17.2% → 10.1%로 둔화**, 1Q27E(하나) +6.9%. 컨센상 YoY 정점은 3Q26. 가속을 이어가려면 4Q 영업이익이 **1.09조(4Q25 × 1.172)를 넘어야** 한다
→ 쟁점: 10개 리포트 전부가 "4Q 1조원"과 "모듈 흑자 유지"에 동의하고, 갈리는 건 **2027년 모듈 영업이익(920억\~6,610억, 7배 편차)**과 **로봇 액추에이터 가치(TP에 0원 vs 8조원)**. 로봇은 BD 액추에이터 수주 확정·31종 시제품 생산·공장 입지 검토 막바지로 실행이 진전됐으나 "2027년은 90대 분량"(NH), "대량 양산은 2029년 이후"(메리츠)
→ TP: 첨부 7곳 평균 58.3만 → 53.2만(-8.7%), 하향 5·유지 2·상향 0(Citi는 의견만 Neutral → Buy 상향). FnGuide 컨센 TP 66.6만(25곳) → 60.2만(23곳, -9.6%). **영업이익 추정은 유지\~상향(NH +3.5%, Citi +4.1%)인데 TP가 내렸다 = 멀티플(업종·로봇 피어)과 영업외(지분법) 하향** → 내러티브 v1 "유지"에서 **약화로 변경**
→ 다음 분기 관건: 4Q26 영업이익 1.09조 초과 여부(가속 유지선)와 모듈 4Q 1,700억+, 그리고 액추에이터 전용 공장 입지·투자 공시(로봇 내러티브 재점화 트리거)

(3-3) 공통 vs 갈림
→ 공통: **2027년까지 로봇은 실적에 없다**(7/7). BD가 모비스의 핵심 공급망 파트너라는 점(수주 확정·그리퍼 공동개발)은 이견 없음. 액추에이터·그리퍼가 고부가라는 회사 설명도 수용
→ 갈림 ① 물량: 2028\~2029 1만 대(삼성 2028) vs 3만 대(JPM·Citi 2029\~2030), NH는 2027 90대 분량만 확인
→ 갈림 ② 마진: EBITDA 30%(메리츠) vs 영업이익률 3.5%(Citi) vs 적자(JPM 2028\~2029) — **같은 매출이라도 가치가 10배 차이**
→ 갈림 ③ 가치 반영: 액추에이터에 4.9조(메리츠)·8.0조(JPM)를 더하는 곳이 TP 상단(60\~62만), 0원인 곳이 하단(Citi 44.3만·MS 48만)

(3-4) [판단]
→ 가장 큰 변수는 물량보다 **마진**이다. 삼성은 "바디 액추에이터 설계 IP는 BD에 있고, 그리퍼는 공동개발"이라고 적었다 — 설계 IP가 고객에게 있는 부품은 자동차 모듈처럼 위탁 생산 마진에 가까워질 가능성이 크고, Citi(3.5%)·JPM(초기 적자) 쪽 숫자가 현재 정보와 더 맞는다. 모비스 고유의 부가가치는 **그리퍼(공동개발)와 원가 재설계 역량**에서 나온다 `[판단]`
→ 결론을 바꿀 확인 사항: ① 액추에이터 공장 투자 규모(CAPEX → 연산 35만 개 물량 역산) ② BD 양산 계획(2028 RA 3만 대 CAPA — 메리츠 11/05) ③ 그리퍼 수주 형태(공동개발 → 단독 공급). 이 중 ①이 연내\~1Q27 가장 먼저 나올 이벤트 `[전망]`

(4) **TP 하향 — 실적이 아니라 멀티플인가**

(4-1) 회사 설명

→ "주가가 저평가되었다는 판단은 확고. 내부 모델상 A/S 사업 현금가치에도 못 미치는 수준이며 로보틱스 옵셔널리티와 제조 정상화 가치는 미반영" (컨콜 Q&A, 하나 11/02)

→ 시사점: 회사가 직접 저평가를 언급 → 매수청구를 "일부 주주환원의 일환으로 볼 여지"(같은 답변) → 쟁점 (5)와 연결

(4-3) 공통 vs 갈림
→ 공통: **영업이익 하향이 아니다**. 현재 주가는 2026E P/E 약 8.7배, 2027E 6.6배(JPM), P/B 0.5\~0.6배 — 7곳 전원 Buy/OW

(4-4) [판단]
→ 하향 5건의 공통분모는 **현대차·기아 업종 멀티플 + 로봇 피어 밸류 조정**이다. 모비스 자체 영업이익 추정이 유지·상향되는 가운데 멀티플만 내려간 건 내러티브 판정 기준상 **약화**의 전형 — "스토리는 유지되나 멀티플 하향" `[판단]`
→ 셀사이드 TP 최저(Citi 44.3만)도 현재가 대비 +28%. 이 괴리는 셀사이드가 아니라 주가가 로봇 옵션을 이미 지웠다는 뜻 — JPM "자동차 사업의 낮은 이익 가시성이 주가를 박스에 가두고, 로봇 진척은 아직 시장을 흥분시키지 못했다" `[판단]`

(5) **램프 매각과 매수청구권**

(5-1) 회사 설명

→ "매수청구 금액을 보고 판단할 예정… 기계적으로 판단하지 않으며… 재무 건전성 논리를 넘는 금액까지 감수하지는 않으나… 취소 시 모비스 귀책이 아니므로 위약금 조항으로 연결되지 않음" (컨콜 Q&A, 하나 11/02)

→ 시사점: 임시주총 11/24(분할계획서 승인 단독 안건, 특별결의) → 매수청구 기간 11/24\~12/14, **청구가 40.8만원**(하나 11/13, Citi 408,394원) vs 주가 34.6만원 → 청구 유인이 크다 → 한도 2,300억(Citi) 초과 가능성 높음

(5-2) 증권사별 해석 편차

| 증권사 | 시각 | 논리 |
|---|---|---|
| Citi (10/30) | **기회** | 한도 초과에도 회사는 매각 진행할 것. 주가 < 청구가면 매수 후 청구로 차익, 매입 주식은 소각 → EPS 상향. Buy 상향 근거 3번 |
| MS (10/30) | **오버행** | 매수청구 불확실성이 단기 주가 부담 (MS는 OPmobility 측 재무자문사 — 이해상충 고지) |
| 하나 (11/13) | 긍정 | 비주력 매각으로 역량 집중, 내년 해외 범퍼 사업 매각도 예상(보도 인용) |
| 삼성·메리츠 | 긍정 | 포트폴리오 재편, 저수익 비주력 매각으로 부품 수익성 개선(메리츠) |

(5-3) [판단]
→ 이 쟁점은 성장 델타와 무관한 **이벤트**다. 램프(2025 매출 2.5조)는 2027-04-01 물적분할 후 2027 하반기 거래 종결 목표 — 종결 시점부터 연결에서 빠지고(매각예정·중단영업 분류 가능) 셀사이드 2027\~2028E 매출에 반영 여부가 제각각이라 **YoY 기준 단절 주의** `[판단]`
→ 12/14 청구 규모가 한도를 크게 넘고 회사가 진행을 택하면 사실상 대규모 자사주 매입·소각(Citi 논리) — 단기 주가 하방을 받치는 장치 `[판단]`

④ 낙관 vs 보수

→ 낙관(JPM 62만): 부품 사업을 2028E 순이익 5.36조(7사 중 최고) × 8배로 놓고 액추에이터를 P/S 12배(아시아 로봇 부품 순수 업체 평균)로 8조 더했다. "P/S 프레임이라 매출 가시성만 생겨도 주가가 움직인다"
→ 낙관(메리츠 60만): 액추에이터 EBITDA 마진 30%·피어 최고 멀티플 28배 — 로봇을 고마진 부품으로 가정. 다만 같은 리포트 제목은 "휴머노이드 수주 확인 필요"
→ 보수(Citi 44.3만): 2027E core 9배(역사 평균) + BD 지분만. 액추에이터 마진을 3.5%로 봐 별도 가치 0원 — 등급은 오히려 Buy로 상향(가이던스·로봇 개시·램프 매수청구 차익)
→ 보수(MS 48만): 로봇 반영 없이 P/E 9.5배. 모듈 턴어라운드와 로봇 리더십은 인정
→ 셀사이드 vs 주가: 7/7 Buy/OW, 컨센 TP 60.2만 vs 주가 34.6만(괴리 -43%). 발표일 10/30 종가 334,000원(전일 353,000원 대비 -5.4%, MS·Citi 기준가) → 11/04 355,000원 → 11/18 346,000원으로 박스. 바이사이드는 로봇 옵션을 가격에 거의 넣지 않은 상태 `[판단]`
