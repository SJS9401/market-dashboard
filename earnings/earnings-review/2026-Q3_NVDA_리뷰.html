# NVIDIA 3Q26 (FQ3 FY27) 실적 리뷰 — 숫자는 또 이겼고, 시장은 숫자가 아니라 CEO 자리를 보고 있다

## 0. 한 줄 판정

> 성장 델타: **꺾임 (규칙 판정 — GAAP 영업이익 YoY +147% → +124% → +115%, 2개 분기 연속 둔화 + 4Q 가이던스 내재 약 +85%로 정점(1Q26) 통과. 매출 YoY는 +106% → +103%로 고원)** | 내러티브: **유지** (FY28 +75% 상향·추정치 상향 ↔ CEO 공백·조사·수출통제로 멀티플 하향이 상쇄) → **델타 꺾임 + 내러티브 유지 → 매매 제외(관찰) 구간. 이익 레벨과 추정치는 계속 올라가지만, 재진입 조건은 1Q FY28 가이던스의 이익 YoY 재가속 + CEO 선임** [판단]

> ⚠ 비영업 요인 플래그: 판정을 '꺾임'으로 만든 정점 1Q26 YoY +147%는 1Q25(FQ1 FY26) H20 재고·구매약정 비용 $4.5B가 만든 저기저 효과다. 이 비용을 되돌리면(1Q25 GAAP 영업이익 약 $26.1B) 1Q26 YoY 약 +105% → 2Q26 +124% → 3Q26 +115%로 '가속 후 1회 둔화' = 둔화 판정 [계산, 참고만 — 판정은 보고 기준]. 반대로 4Q26 가이던스는 1주가 더 있는 14주 분기인데도 이익 YoY가 약 +85%로 내려간다

→ 숫자: 매출 $115.8B(+103.2% YoY, +20.4% QoQ, 순증 $19.6B 역대 최대), GAAP 영업이익 $77.5B(+115.3% YoY, OPM 66.9%), Non-GAAP 영업이익 $77.9B(+106.3%, OPM 67.2%). 컨센 대비 매출 +6.2%, Non-GAAP 영업이익 +7.8%, EPS $2.68(+8.4%). Vera Rubin 출하 첫 분기 약 $20B
→ 가이던스: 4Q FY27 매출 $130B ±3%(+90.8% YoY, 컨센 $125.3B 대비 +4%, 14주), GPM 71～72%(저점), 내재 GAAP 영업이익 약 $82.0B(+85%) [계산]. **FY28(CY27) 매출 성장률 전망 +70% → +75%**(FY28 매출 약 $740B, 컨센 $695～700B 대비 +6～7%)
→ 쟁점: ① 젠슨 황 퇴진 후 첫 실적 — 이사회는 복귀 불가 명시, 후임 시한 없음 ② FY28 +75%는 신규 BIS 수출통제·중국 Hopper 중단 후에도 유효한가 ③ 4Q GPM 71～72% 저점 → FY28 72～73% 회복 ④ 네오클라우드 지원 '선별' 전환과 총 약정 $518B vs 잔여 자사주 $227B
→ 주가: 11/17 종가 $155.46(1개월 −27%), 시간외 +4.6% → 11/19 $145.98(KB). 12MF P/E 10.8배(5년 평균 33.5배, 대신)
→ 다음 분기 관건: 4Q $130B·영업이익 약 $82B 달성과 1Q FY28 가이던스 내재 GAAP 영업이익 YoY가 +85%를 다시 넘는지(1Q FY28 영업이익 $99B 이상), CEO 선임 시점

(1) YoY 위치
→ GAAP 영업이익 YoY 정점은 1Q26(+147%)이다. 다만 이 정점은 1Q25 H20 비용 $4.5B가 만든 저기저 — 비용을 되돌리면 실질 정점은 2Q26(+124%) [계산]. 어느 기준이든 3Q26(+115%)은 정점 이후 두 번째 분기, 4Q26 가이던스(+85%)는 세 번째 감속
→ 매출 YoY는 2Q26 +106% → 3Q26 +103%로 고원, 4Q26 가이던스 +91%(14주 포함). 주 수를 보정하면 4Q 주당 순차 증가율은 4%대(대신)
→ 컨센 경로상 YoY는 계속 내려간다 — GAAP 영업이익 YoY 1Q27E: 모건스탠리 +72%($92.1B), HSBC +91%($102.1B). HSBC 경로라면 1Q27에 한 번 재가속, 모건스탠리 경로라면 감속 지속 [전망]. FY28 연간 매출은 회사 +75%, 모건스탠리 +56%

(2) QoQ로 다시 보기
→ 매출 QoQ: +19.8%(1Q26) → +17.9%(2Q26) → **+20.4%**(3Q26) → +12.2%(4Q26G). 분기 순증 +$13.5B → +$14.6B → **+$19.6B**(역대 최대) → +$14.2B
→ GAAP 영업이익 QoQ: +20.9% → +19.0% → **+21.6%** → 약 +5.7%(4Q26G). 4Q는 GPM이 3.4%p 내려가고(74.9% → 71.5%) 영업비용이 +20%(1주 추가·경영진 교체 비용, 대신) 늘어 이익 증분이 매출 증분의 3분의 1 수준으로 줄어든다 [계산]

(1-4) [판단]
→ 숫자로 보면 CEO 공백은 아직 실적에 없다 — 3Q는 가이던스 초과폭 역대 최대, FY28 상향. 다만 이번 분기 숫자는 젠슨 황 체제가 수주·공급을 확보해 둔 결과다(백로그 12～24개월, GS). **CEO 공백의 실적 영향은 FY28 하반기 이후 신규 공급 계약·차세대(Feynman) 실행에서 처음 나타날 수 있다** [판단]
→ 결론을 바꿀 데이터: ① 후임 CEO 발표(내부 vs 외부, 기술 리더 여부) ② 핵심 임원·엔지니어 이탈 보도 ③ DOJ·SEC·내부 조사 결과 ④ 1Q FY28 가이던스가 FY28 +75% 경로를 유지하는지

(2) 쟁점 2 — FY28 +75%, 수요·공급·수출통제

(2-1) 회사 설명
→ "수요가 계속 늘고 공급망 지원으로 추가 물량을 확보해 70% → 75% 상향. FY27 기반이 이미 높아진 상태라 의미가 크다. 이번 주 발표된 새 수출통제는 검토 중이지만 확보한 수요·공급을 감안하면 75%는 달성 가능"(컨콜, KB 11/20·NH). 실제 수요가 100% 수준인지는 확답 없음(대신)
→ 수요 근거: 클라우드 업계 수주잔고 $2.0T → $2.5T, 하이퍼스케일러 클라우드 매출 성장률 6개 분기 연속 가속, 오픈라우터 주간 토큰 YoY 35배·3개월 3.5배(80%가 에이전틱), 에이전틱 수요가 2028년까지 이월(KB·NH·JPM)
→ 공급 근거: 구매 약정 $390B(+$111B), Kinsus·삼성전기(기판)·SPIL(첨단 패키징) 신규 계약. Kinsus는 엔비디아 전용 ABF 기판 생산능력 3.5배 이상 확대(HSBC)
→ 중국: 3Q 라이선스 Hopper $2.4B, 이후 출하 중단·가이던스 미반영. BIS 신규 규정 = 엔비디아 고객의 제한 지역(중국 포함) 데이터센터 렌털 제한(GS)
→ 제품: FY28 CPU 매출·엔터프라이즈 매출 각각 2배 이상(모건스탠리·KB). 프런티어 랩은 FY27 데이터센터 매출의 약 15%(JPM·KB)

(2-3) 공통 결론 vs 갈리는 지점
→ 공통(14/14): 발표 전 시장은 하향을 걱정했는데 상향이 나왔다. 성장 제약은 수요가 아니라 공급
→ 갈림: **+75%를 그대로 믿느냐.** GS·HSBC·국내사는 회사 가이던스를 반영(+74～78%), 모건스탠리만 +56%로 20%p 가까이 할인. 핵심 변수는 BIS 렌털 규제의 범위와 동남아 물량(JPM)

(2-4) [판단]
→ 회사가 CEO 공백·조사·신규 규제라는 최악의 타이밍에 가이던스를 올렸다는 것 자체가 정보다 — 모건스탠리도 "업데이트를 안 할 가능성이 크다고 봤다"고 적었다. 구매 약정 +$111B로 공급을 먼저 묶어 둔 만큼 FY28 매출 하단은 단단하다 [판단]
→ 다만 델타 관점에서 +75%는 FY27 +96% 대비 감속이다. 분기 YoY는 4Q +91% → FY28 평균 +75%로 내려가는 경로 — 이익 YoY 재가속은 매출보다 마진 회복(쟁점 3)과 기저(1Q27 1Q26 $53.5B)에 달렸다 [전망]
→ 결론을 바꿀 데이터: BIS 규정 세부(렌털 범위), 동남아 클라우드 출하, 하이퍼스케일러 4Q 실적의 2027 CapEx 가이던스(1～2월)

(3) 쟁점 3 — 마진 4Q 저점, FY28 회복

(3-1) 회사 설명
→ 3Q GPM 74.9%(GAAP 74.8%) — 가이던스 74.0% 상회, Rubin 초기 램프로 QoQ −0.1%p(KB 11/20)
→ "지난 분기 공급 원가가 크게 올라 FY27 하반기·FY28 전망을 다시 짰고 원가 상승분의 상당 부분을 흡수해 반영. 4Q는 기존 주문을 이전 가격으로 이행해 저점(71～72%), 새 가격이 적용되는 FY28은 72～73% — 달성 자신 있음"(컨콜, KB 11/20·NH)
→ 장기 가격은 "시스템 성능과 전체 로드맵이 주는 가치를 반영해 계속 검토"(NH). 4Q 영업비용 GAAP 약 $11.0B·Non-GAAP 약 $10.7B(+20% QoQ, 1주 추가·경영진 교체 비용)(대신)

→ 공통: 4Q 71～72%가 저점, FY28 72～73% 회복은 신뢰(가격 재협상·ASP 인상)
→ 갈림: **2028년 이후.** GS는 CY28 72.0%로 낮췄고, SK는 ASIC·AI 랩의 마진 압력을 구조적 리스크로 본다

(3-4) [판단]
→ 메모리 섹터 리뷰의 "HBM 2027 가격 큰 폭 인상"이 엔비디아에게는 원가다. 엔비디아가 AMD와 다른 점은 이를 **판가 15% 인상으로 넘길 수 있다**는 것 — AMD가 HBM 원가를 고객과 '분담'하며 GPM 55%에 묶인 것과 대비된다(AMD 리뷰) [판단]
→ 이익 YoY 관점: GPM이 74.9%에서 71.5%로 3.4%p 내려가는 4Q가 이익 델타의 바닥이고, 1Q FY28 GPM이 72%대로 돌아오면 이익 YoY가 매출 YoY에 다시 붙는다 [전망]
→ 결론을 바꿀 데이터: 1Q FY28 GPM 가이던스(72% 이상 여부), HBM4 2027 계약가 보도, ASIC(TPU·Trainium) 신규 대형 수주

(4) 쟁점 4 — 생태계 금융 지원 vs 주주환원

(4-1) 회사 설명
→ 약정: 총 미래 약정 $518B(직전 $366B) = 공급·생산능력 $390B + 데이터센터 임차 $74B + 클라우드 서비스 $28B + 지분투자 $20B + CapEx $6B(GS). 네오클라우드 약정 $32B, 보증 최대 노출 $118B(PORTS-Pike 캠퍼스 토지·전력·건물 신용보강 $105B 포함 — 약 4.25GW, OpenAI 20년 리스, 첫 효력 FY29)(KB 11/18·HSBC)
→ 새 공시 문구: "네오클라우드 약정은 네오클라우드가 인프라·컴퓨트 구매 자금을 확보해야만 효력이 생기며, 그렇지 못하면 축소·소멸될 수 있다"(CFO 코멘터리) → 크레스 "바뀐 것은 없고 질문이 많아 명확히 적은 것"(KB 11/20·NH)
→ 기조: "시장이 성숙하고 다른 자금원이 늘어나는 만큼 향후 투자·약정·보증은 엄격히 평가. 지원은 부지·전력·건물(LPS) 확보 우선, 인프라 금융 파트너와 투자등급 고객 선급금 활용. 공급 배분은 가동 준비도·자금 조달·오프테이크 기준, 가격은 모든 고객 동일"(KB·NH·대신)
→ 환원: 3Q $28.1B(자사주 $22.1B·배당 $6.0B), 연초 이후 FCF의 65%. "전략적 용도를 뺀 초과 FCF 전액 환원", 잔여 $227.3B를 FY28 말까지 소진. 자본 배분 1순위는 공급사 선급금(KB 11/20)
→ 현금흐름: 3Q FCF $43.8B(2Q $21.3B의 2배), FCF/조정 순이익 40% → 67%. 매출채권 $81.0B(DSO 60 → 64일 — Rubin 출하 시점·투자등급 대형 고객 결제 기간 연장), 비상장 지분 $65.5B, 3Q 비상장 지분 손상 $1.8B(KB 11/18)

(4-3) 공통 결론 vs 갈리는 지점
→ 공통: 네오클라우드 지원은 '중단'이 아니라 '선별', 주주환원 우선순위는 강해졌다
→ 갈림: **선별이 ACIE 성장에 주는 영향.** SK는 네오클라우드 성장 둔화·하이퍼스케일 의존 심화로, KB·유진은 상위 네오클라우드 중심의 질적 개선으로 읽는다

(4-4) [판단]
→ 이번 분기 가장 눈에 띄는 숫자 변화는 현금이다 — FCF 2배, 환원 사상 최대. 그러나 매출채권(+$17.9B QoQ)·재고(+$8.1B)가 매출(+$19.6B)과 비슷한 속도로 늘고 있다 [계산]. 이익의 질은 4Q·1Q의 DSO가 64일에서 멈추는지로 확인해야 한다 [판단]

→ 셀사이드 vs 시장: 셀사이드는 숫자 상향 일색인데 주가는 실적 후 시간외 +4.6%에서 이틀 만에 $145.98(11/17 종가 대비 −6.1%, KB 11/20)로 밀렸다. JPM은 발표 전 테크 투자자 심리를 "4년 내 가장 약세"로, GS는 투자자 포지셔닝을 "중립～부정"으로 적었다 — 바이사이드는 아직 숫자보다 불확실성을 가격에 넣고 있다 [판단]

## 3. 내러티브 점검

① 성장 스토리 정의
→ "AI 컴퓨트 수요가 공급을 계속 웃도는 가운데, GPU·CPU·네트워킹·소프트웨어를 묶은 랙 단위 시스템으로 데이터센터 매출의 90% 이상을 가져가고, 그 이익을 공급망 선점과 주주환원에 동시에 쓴다"

② 이번 분기 평가 — **유지** (두 축이 반대로 움직여 상쇄)
→ 강화된 축(숫자): 가이던스 초과폭 역대 최대, Rubin 첫 분기 $20B, FY28 +75% 상향, 구매 약정 $390B, 추정치 전원 상향, FCF 2배·환원 사상 최대
→ 약화된 축(멀티플·지배구조): 창업자 퇴진과 복귀 불가 선언, DOJ·SEC·내부 조사 보도, 신규 BIS 수출통제와 중국 Hopper 중단, 네오클라우드 지원 '선별' 전환. 하우스 TP는 멀티플 하향으로 정체, 컨센 TP 30일 −16%
→ 훼손은 아니다: 스토리의 핵심 전제(수요 > 공급, 엔비디아 점유율·가격결정력)는 숫자로 재확인됐다. 다만 SK가 든 '밸류체인 지배력·인재'는 전제 자체에 대한 첫 질문이다 [판단]

③ 국면 — 델타 꺾임(규칙) × 내러티브 유지
→ 비유하면 엔비디아는 여전히 가장 빠른 차지만, 지난 1년간 가속 페달을 끝까지 밟아 온 탓에 속도계(YoY)의 바늘은 정점에서 내려오는 중이고, 운전석(CEO)이 비어 있다. 차는 잘 달리지만(QoQ +20%), BT 프레임이 보는 것은 '속도가 더 붙느냐'다
→ 판정 기준상 GAAP 영업이익 YoY 2개 분기 연속 둔화 + 정점 통과 = 꺾임. 단 첫 번째 둔화는 1Q25 H20 비용 저기저 효과이고(⚠ 플래그), 3Q 자체는 QoQ 가속 분기였다. 보정 기준이면 '둔화'
→ 로직·CPU 서브섹터 안에서: 엔비디아 3Q 매출 $115.8B는 CPU 3사(AMD·Intel·Arm) 3Q26 합산 $31.3B의 3.7배, 4사 합산의 약 79% [계산, 섹터 리뷰]. 영업이익 YoY +115%는 AMD(Non-GAAP +75%)·TSMC(NT$ +75%)보다 높지만 방향은 AMD(4Q 재가속 가이던스)와 반대로 내려가는 중 [판단]
→ BT 프레임: 이익 레벨·추정치가 오르는데 델타가 내려가는 '고점권 이익 성장주' — 델타 매매 구간이 아니라 밸류에이션(12MF P/E 10.8배)·이벤트(CEO 선임) 매매 구간에 가깝다 [판단]

④ 다시 강해질 트리거
→ 1Q FY28 가이던스가 GPM 72%대 회복과 함께 GAAP 영업이익 YoY +85% 이상(약 $99B 이상)을 내재 — 델타 재가속
→ 후임 CEO 선임(특히 기술·공급망 연속성을 보여주는 인물)과 조사 종결 — 멀티플 정상화
→ BIS 규정 영향이 제한적으로 확인되고 FY28 +75%가 유지·상향

⑤ 깨뜨릴 리스크
→ CEO 공백 장기화 + 핵심 인력 이탈 → 차세대(Feynman) 일정·공급 계약 협상력 약화(SK)
→ 수출통제 강화로 FY28 매출 최대 −11%(HSBC 민감도), 동남아·원격 렌털까지 확대
→ 네오클라우드 자금 경색 → ACIE 둔화, 매출채권·보증 부담이 현실화
