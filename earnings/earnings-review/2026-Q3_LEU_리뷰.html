# Centrus Energy 3Q26 실적 리뷰 — 잔고는 $7.0B로 두 배, 분기 영업이익은 4개 분기 연속 역성장: "트레이더의 숫자"는 꺾이고 "농축 공장의 이야기"만 커졌다

## 0. 한 줄 판정

> 성장 델타: 꺾임 | 내러티브: 강화 → 델타 꺾임 + 내러티브 강화(2029년 이후 이야기) → 매매 제외 구간 (실적 델타가 아니라 12/7 Investor Day·12/31 Piketon 리스 연장 같은 마일스톤 이벤트로만 움직이는 종목)

→ **숫자**: 3Q26 매출 $55.5M(**−25.9% YoY**), 매출총이익 **−$10.6M**(GPM −19.1%), 영업이익 **−$29.7M**(OPM −53.5%). 판정 기준인 보고 분기 영업이익 YoY는 4Q25 **−71.6%** → 1Q26 **−96.1%** → 2Q26 **−69.0%** → 3Q26 **적자 확대**(−$16.6M → −$29.7M)로 **4개 분기 연속 마이너스**다. 2Q26의 소폭 개선(+27.1%p)도 마이너스 안의 움직임이라 이어지지 못했다. (참고: TTM 영업이익 $50.2M → $30.5M → $7.4M → −$5.7M, 회사 조정 영업이익 9M $48.2M → $32.9M(−32%) — 어느 기준으로도 방향은 같다) 순이익 $31.6M(희석 EPS $1.41)은 **워런트 평가이익 $46.4M**(비현금) 덕분이고, 이를 빼면 −$10.2M이다

→ **쟁점 ①**: 매출총손실의 원인은 두 갈래다. LEU 사업은 3Q가 원래 인도가 적은 분기(3Q25도 GP −$7.8M)라 계절성이 크지만, **SWU 단위원가 +28% vs 판매단가 +10%**(9M: +30% vs +12%)로 스프레드가 구조적으로 좁아지고 있다. Technical Solutions는 DOE HALEU 운영계약 매출이 −$10.2M 줄며 GP −$3.7M로 돌아섰다

→ **쟁점 ②**: 잔고는 $3.8B(FY25말) → **$7.0B**(2Q26말 $4.5B), 그중 LEU **조건부 $5.4B**(확정계약 $5.1B)는 Piketon 증설 완공·가동 마일스톤에 묶여 있다. 새 원심분리기 가동은 **2029년**이라 2028년까지의 손익에는 거의 들어오지 않는다. 지금 이익을 만드는 확정 LEU 잔고(RPO)는 **$0.8B**뿐이다

→ **쟁점 ③**: 증설 자금 — 현금 $2.24B, 9M CapEx $226M(3Q $132M, 컨콜 비공식 요약), 2026 자본배치 가이던스 $350\~500M, 2027 가속 예고. 9월 $500M 주식+워런트 공모, 보통주 워런트 699만주, 전환사채 2종까지 합친 **완전희석 잠재주식 약 37.3M주(현 발행 대비 +81%)** — 주가는 사상 최고 대비 −76%, 연초 대비 −57%

→ **다음 분기 관건**: ① 4Q26 매출 가이던스 내재 $142\~192M(FY $450\~500M 유지)와 **LEU GPM 30%대 회복** → **4Q26 영업이익이 4Q25 $12.8M을 넘어 YoY 플러스로 돌아서는지** ② **12/31 Piketon 리스 장기 연장**(실패 시 증설 지연·손상 처리 위험, 10-Q 명시) ③ 12/7 Investor Day의 2027 CapEx와 추가 자금조달 규모 ④ 2028년 러시아 LEU 수입 전면 금지 앞 TENEX 대체 경로

→ **판정 기준 — 보고 분기 영업이익 YoY**: 분기 매출 YoY가 +92% → +13% → +46% → +67% → −18%처럼 인도 시점에 따라 부호가 바뀌고, 회사도 "LEU 고객은 분기가 아닌 연간 구매 약정을 갖는다 — 매출총이익은 계약 인도 시점에 따라 변한다"고 쓴다 (10-Q). 그래도 판정은 평활화하지 않고 보고 분기 숫자로 한다 — 이런 종목은 높은 델타의 분기가 **연속으로** 찍히기 전까지 실적이 아닌 이벤트·테마로 거래되고, 실적 리뷰는 보고 실적의 질과 일관성을 본다 (BT 결정 2026-11-16). TTM·조정 행은 참고용이다

→ **YoY 위치**: 보고 분기 영업이익 YoY의 마지막 플러스는 2Q25(+58.8%)다. 이후 3Q25 적자 확대 → 4Q25 −71.6% → 1Q26 −96.1% → 2Q26 −69.0% → 3Q26 적자 확대로 **5개 분기째 플러스가 없다**. 12개 분기 중 영업이익 YoY가 플러스였던 분기는 4개(4Q23·2Q24·4Q24·2Q25)뿐이고 두 분기 연속 플러스는 한 번도 없다 — "일관된 고델타 분기" 이력이 없다. 매출은 연 $450M 안팎에서 2년째 횡보(참고: TTM 매출 +0.1%)하고 내려간 것은 마진이다. FY26 가이던스 중간값($475M)도 매출 +5.9%에 그친다

→ **LEU — 3Q 손실은 계절성 + 스프레드 압축의 합**: 3Q26 SWU 매출 +$3.4M(물량 +19%, 단가 +10%)인데 SWU 단위원가가 **+28%** 올랐다. 우라늄 매출은 물량 감소로 −$16.4M(−48%). 9M 기준으로 보면 SWU 물량 −26%, 단가 +12%, **단위원가 +30%** → LEU GPM 33.4% → 31.6% (10-Q). 3Q는 2년 연속 LEU 매출총손실(3Q25 −$7.8M, 3Q26 −$6.9M)이라 분기 손실 자체는 인도 일정의 계절성이다. 문제는 9M에서도 확인되는 **"판매가는 몇 년 전 계약가, 조달가는 지금 시세"**의 시차다 — 회사도 "청구 SWU 평균가는 공표 가격지표를 수년 시차로 따라간다"고 쓴다 (10-Q). 현물 SWU는 $203/SWU(9/30)로 고점에서 횡보 중이다

→ 시사점: 회사는 **인도 시점·믹스** 문제로 설명 → 10-Q 원문도 "LEU 손실 감소는 분기 간 계약 구성 변화 때문"이라고만 씀 → 단가 대비 원가 **+28% vs +10%**의 스프레드 문제는 설명에 없다

(1-2) 숫자로 분해 `[판단]`

→ 계절성: 3Q는 2년 연속 LEU 매출총손실(3Q25 −$7.8M → 3Q26 −$6.9M)이고, 1Q26(GPM 62.6%)·2Q26(33.6%)는 높았다. 분기 손실만으로 구조 변화를 단정할 수 없다는 회사 설명은 숫자와 맞는다

→ 구조: 9개월로 넓혀도 SWU 단가 +12% vs 단위원가 +30%다. SWU 1단위의 판매가를 100, 원가를 70(GPM 30% 가정)으로 두면, 단가 112·원가 91로 **마진이 30 → 21로 30% 줄어드는 셈**이다 [계산 예시]. LEU GPM이 FY22 55.4% → FY24 26.8% → FY25 32.2% → 9M26 31.6%로 30% 근처에 머무는 이유다

→ 원가가 오르는 이유: TENEX 계약가는 "시장 연동 가격 + 기타 요소" 공식이고 (10-Q), 러시아 제재로 운송·결제 경로 비용이 붙는다. 판매가는 수년 전 계약가라 시세를 늦게 따라간다

→ **결론이 바뀌는 조건**: 4Q26(통상 인도 성수기) LEU GPM이 4Q25 30.1%를 넘으면 "믹스·계절성" 해석이 맞다. 25% 밑이면 스프레드 압축이 4Q에도 이어진다는 뜻이다

(2) **잔고 $7.0B — 조건부 $5.4B는 언제, 얼마나 이익이 되나**

(2-1) 회사 설명

→ 10-Q: "조건부 판매약정은 **운영 마일스톤 달성**과 연계된다." 조건부 $5.4B 중 $5.1B가 확정계약(definitive agreements)이며 "Piketon의 LEU·HALEU 생산설비 건설을 지원"한다. 잔고는 2040년까지 이어지고 "고객 운영 관련 위험 주문은 없다"

→ 컨콜(TD Cowen 질문): 잔고 대부분은 **가동 중인 원전용**이고, 신규 원전은 조기 연료 약정이 필요해 앞으로 추구하겠다 (StockStory 비공식 요약)

(2-2) 숫자로 분해 `[판단]`

→ 시점: 새 원심분리기 첫 가동은 2029년(10-Q) → 조건부 잔고의 첫 매출도 2029년 이후다. 첫 Oak Ridge 원심분리기는 10/29 출하(당초 "2026년 중")로 일정은 앞당겨졌고, 핵심 공급사 계약은 약 75% → 100%다 (보도자료·Finviz)

→ 규모 감각: 조건부 $5.4B를 2029\~2040년 12년에 고르게 나누면 연 $0.45B로 지금 연매출($0.45B)과 비슷한 규모가 추가된다 [계산 — 단순 균등 가정]. 다만 이는 자체 생산 SWU라 TENEX 조달 마진이 아니라 **설비 보유 농축사 마진**(Urenco형)이 붙는다는 것이 이 스토리의 핵심이다

→ 지금 숫자와의 관계: 2026\~2028년 이익은 RPO $0.8B + 신규 단기 계약 + TENEX·Orano 조달 스프레드에서만 나온다. **잔고 증가가 2028년까지의 이익 델타를 바꾸지 않는다**

(3) **HALEU — DOE 계약 종료 후 상업 전환, Piketon 리스**

(3-1) 회사 설명

→ "*because that supply chain is unobligated, we are able to serve both the national security and commercial markets*"

→ "그 공급망이 **비의무(unobligated, 외국 의무 없는 순수 미국산)**이기 때문에 **국가안보와 상업 시장 모두**에 공급할 수 있다" (CEO Vexler, 보도자료)

→ 시사점: 국방(NNSA) 수요까지 열어두는 포지셔닝 → William Blair도 NNSA 연계를 질문 → 다만 숫자로 확정된 정부 계약은 **DOE $900M HALEU task order**(2032-03까지 1MTU, 마일스톤 지급)뿐

(3-2) 진행 상황 (10-Q·8-K)

→ DOE 운영계약: 9/30 생산 옵션 종료 → 10/20 **HALEU Transfer Agreement**로 HALEU·재고·설비 책임이 Centrus 자회사 ACO로 이전, 16대 시범 캐스케이드는 상업 고객용 HALEU 농축 중

→ Piketon 리스: 10/19 개정으로 만료일 **2027-10-01 확정**, 대신 Centrus가 DOE의 해체(D&D) 책임을 인수(NRC 승인 조건). DOE는 "**2026-12-31 전까지** 장기 연장 완료에 성실히 협력"한다고 했지만 의무는 없다. 연장 실패 시 증설 "지연·축소·포기" 가능성과 **Piketon 자본화 개선비 손상**을 10-Q가 명시

→ 상업 고객: Oklo(Meta 자금, 2026-11-02 에스크로에서 Centrus로 직접 지급 — Oklo 10-Q, 기업개요), X-energy·Radiant·Antares(선급 포함). LEU 부문 선수금·이연수익은 $131.1M(FY25말) → $85.3M(3Q26말)로 오히려 줄었다 — 3Q 신규 선급의 금액은 공시되지 않았다

(3-3) **[판단]**

→ HALEU는 "DOE 용역 매출(cost-plus, GPM 한 자릿수)"에서 "상업 판매"로 넘어가는 과도기라 **2027년까지 TS 매출은 공백**이 생긴다. TS 분기 매출 $22\~32M 중 HALEU 운영계약분이 빠지면 4Q부터 TS 매출 YoY 마이너스 폭이 커질 가능성이 높다 `[전망]`

→ 결론이 바뀌는 조건: 12/31까지 리스 장기 연장 + DOE와 캐스케이드 상업 운영 추가 계약이 나오면 HALEU 스토리의 가장 큰 행정 리스크가 해소된다

(4) **증설 자금과 희석 — 현금 $2.2B로 충분한가**

(4-1) 회사 설명 (10-Q)

→ 현금 $2,236.1M(3Q26말), "향후 최소 12개월 영업에 충분한 유동성". 동시에 "추가 부채·지분 조달, 자산 기여·처분, 파트너 참여를 추구할 수 있다", 인수 리스크로 "희석"을 명시. **2026-11-02 신규 S-3(선반등록)** 제출

→ 컨콜: Guggenheim(원심분리기 일정 단축의 반복 가능성) → Palantir 협업 등 공정 개선, Evercore(Palantir 관련 잠재 절감 $300M) → "가치 대부분은 앞으로, Investor Day에 상세", Craig-Hallum(수직계열화) → Westerman은 공급망 리스크 해소 템플릿, 추가 통합 가능 (StockStory 비공식 요약)

(5) **러시아 TENEX 조달과 2028 절벽 + KHNP 연결**

(5-1) 회사 설명 (10-Q 원문)

→ "*Through 2027, well over one-half of the LEU that we expect to deliver to customers was sourced under the TENEX Supply Contract. While we have other sources of supply, they are not sufficient to replace the TENEX supply.*"

→ "2027년까지 고객에게 인도할 LEU의 **절반을 훨씬 넘게** TENEX 계약으로 조달했다. 다른 조달원이 있지만 **TENEX를 대체하기엔 충분하지 않다**"

→ 시사점: 미국 수입 waiver는 **2024\~2027년 인도분**까지 확보 → 러시아 수출 허가령도 2027-12-31까지 → 2026\~27년 미래 판매용 3차 waiver 신청(2024-12)은 결과 미정 → **2028년부터 법상 전면 금지** → TENEX 계약 자체도 2028년까지 → 자체 공장 가동(2029)까지 **최소 1년의 조달 공백** 가능성

(5-2) 추가 변수

→ Graham Act(2026-09-18, 러시아 제재 법제화·최대 500% 관세 권한)는 행정명령으로 대부분 면제됐고 우라늄은 관세 대상 제외지만, 동반 운송 물품 관세와 **면제 철회 가능성**을 10-Q가 리스크로 새로 적시

→ **KHNP(한수원) 연결**: KHNP는 조건부 LEU 장기 고객(2025-02 $0.8B 확정계약 전환, 2025-08 물량 증액 — 전량 Piketon 신규 설비 자금 확보 조건부)이고, 2025-08 KHNP·POSCO인터내셔널과 Piketon 투자 검토 MOU(비구속)를 맺었다 (8-K 2025). **3Q26 10-Q에는 한국·KHNP·POSCO 언급이 없다** — 투자 집행은 미공시 상태다. 조건부 잔고 $5.4B 안에 KHNP 물량이 들어 있다는 점에서, 한국 원전의 연료 조달 다변화가 Centrus 증설 성패에 직접 걸려 있다 `[판단]`

(5-3) **[판단]**

→ 2026\~2027년 숫자는 waiver가 있어 버틴다. 리스크는 2028년 한 해 — TENEX 물량을 Orano·현물·재고로 메워야 하는데 회사 스스로 "충분하지 않다"고 썼다. 2028년 LEU 매출 YoY가 크게 꺾일 수 있다는 점이 기업개요의 분류 변경 조건 ②(TENEX 중단 시 LEU 매출 −30% 2개 연도)와 연결된다

## 3. 내러티브 점검

① 성장 스토리 정의

→ "러시아산 농축우라늄을 되파는 트레이더가, 미국 유일의 자국 원심분리 기술로 **Piketon에 LEU·HALEU 농축 공장**을 지어 2029년부터 설비 보유 농축사(Urenco형)로 바뀐다. 그 수요는 SMR(Oklo·X-energy)·빅테크(Meta)·해외 전력사(KHNP)의 장기 선급 계약이 받쳐준다"

② 이번 분기 평가

→ **강화된 것 (수주·마일스톤)**: 잔고 $3.8B → $7.0B, 조건부 확정계약 $5.1B, HALEU 상업 고객 4곳(선급 포함), 첫 원심분리기 조기 출하, 핵심 공급사 100% 계약, Westerman 인수로 케이싱 내재화, DOE $900M task order 진행

→ **약화된 것 (돈·행정)**: DOE HALEU 운영계약 종료와 FY27 예산 미반영, Piketon 리스가 2027-10까지 "확정"됐을 뿐 장기 연장은 미정, 증설 자금의 희석, TENEX 2028 절벽

→ **숫자와의 관계**: 강화된 항목은 전부 2029년 이후 손익에 들어온다. 보고 분기 영업이익 YoY는 4개 분기 연속 마이너스이고, 2026\~2028년 손익은 TENEX·Orano 스프레드(압축 중) + HALEU 공백 + 증설 비용 증가라 **델타는 꺾임**이다. 이 종목은 지금 "실적 델타"와 "내러티브"가 **반대 방향**으로 움직인다 — BT 프레임(델타 꺾임 = 매매하지 않음)으로는 매매 제외, 주가는 마일스톤 헤드라인에만 반응하는 구간이다 `[판단]`

③ 스토리를 다시 강하게 만들 트리거

→ (1) **12/31 Piketon 리스 장기 연장** + DOE 캐스케이드 상업 운영 계약

→ (2) 12/7 Investor Day — 비희석 조달(정부 대출·전략 지분), Palantir $300M 절감 구체화, 2027 CapEx와 첫 캐스케이드 일정 재확인

→ (3) KHNP·POSCO 등 전략 투자자의 **실제 지분투자** 공시, 조건부 잔고의 무조건부 전환

④ 스토리를 깨뜨릴 리스크

→ (1) 리스 연장 실패 → 증설 지연·손상 처리 (10-Q 명시)

→ (2) TENEX 공급 중단·waiver 불허 → 2027\~28년 LEU 인도 차질

→ (3) 대규모 추가 증자 (현 주가 수준에서) 또는 증설 원가 초과
