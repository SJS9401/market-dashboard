# Intel 3Q26 실적 리뷰 — 서버는 15년 만의 성장, 그런데 PC·공급·현금이 한꺼번에 발목을 잡았다

## 0. 한 줄 판정

> 성장 델타: **꺾임 (조정 기준 — Non-GAAP 영업이익 YoY +142%(1Q26) → +112%(3Q26) → 4Q 가이던스 약 +24%, 매출 YoY +25.4% → +20.9% → +13.4%로 2개 분기 연속 둔화, 정점은 2Q26)** | 내러티브: **약화** → **매매 제외 구간 — 에이전틱 AI 서버 CPU 스토리는 살아 있지만, 공급 제약·PC 재고조정·2027 FCF 적자로 숫자가 스토리를 못 따라간다. 재진입은 1Q27 가이던스의 QoQ 반등 확인 후** [판단]

→ 숫자: 매출 $16.51B(+20.9% YoY, +2.4% QoQ), Non-GAAP 영업이익 $3.23B(OPM 19.6%, 8개 분기 최고), GAAP 영업이익 $2.52B(OPM 15.3%). 컨센 대비 매출 −0.1%(사실상 부합), Non-GAAP 영업이익 +21.8%, EPS $0.52 vs $0.41 +28% (FactSet, 삼성)
→ 사업부: DCAI $7.32B(+77.8% YoY, OPM 41.5%)가 끌고, CCPG $8.10B(−5.1% YoY, −8.8% QoQ)가 꺾였다. 성장축이 PC에서 데이터센터로 완전히 넘어갔다
→ 쟁점 ①: 4Q 가이던스 매출 $15.0～16.0B(중간값 컨센 $17.07B 대비 −9%), Non-GAAP GPM 38%, EPS $0.25(컨센 $0.44 대비 −43%) — 7개 분기 연속 컨센 상회 가이던스가 처음 하회. Fab 28 사고(매출 −$0.3B, GPM −2%p)를 빼도 컨센 미달, 본질은 PC 재고조정(CCPG QoQ −20% 이상)
→ 쟁점 ②: DCAI 수요는 공급 초과인데 Intel 3 수율·EMIB 기판·Fab 28로 출하가 묶였다 — 2027 성장은 "공급의 함수", 기판 증설은 2027 하반기
→ 쟁점 ③: 2027 CapEx "대폭 증액" + FCF 적자 지속 명시 → 10/29 $92.07 → 10/30 $65.80 (−28.5% [계산]). 대신 투자의견 적극매수 → 중립
→ 다음 관건: 1Q27 가이던스가 QoQ 반등(PC 바닥 + DCAI 공급 확대)을 그리는지, 2027 CapEx 실제 규모

서프라이즈: 매출 컨센 $16,537M 대비 **−0.1%**, Non-GAAP 영업이익 $2,654M 대비 **+21.8%**, EPS $0.52 vs $0.41 **+28.1%** (FactSet — 삼성. 대신 LSEG 기준 EPS +26.8%, 매출 −0.2%). 이익 서프라이즈는 매출이 아니라 마진(Non-GAAP GPM 44.1%, +2.3%p QoQ)에서 나왔다

(1) YoY 위치
→ 매출 YoY는 2025년 내내 0% 근처에서 1Q26 +7.2% → **2Q26 +25.4%(정점)** → 3Q26 +20.9% → 4Q26 가이던스 +13.4%. 2개 분기 연속 둔화가 가이던스로 확정
→ Non-GAAP 영업이익 YoY는 1Q26 +142% → 3Q26 +112% → 4Q26 가이던스 약 +24%. 1Q27은 기저(1Q26 $1,668M)가 높지 않지만, 회사가 PC 재고조정이 4Q～1Q에 집중되고 Fab 28 매출 영향(약 −$0.3B)이 1Q에도 남는다고 해 1Q27 YoY가 마이너스로 갈 수 있다 [전망]
→ 발표 전 컨센 경로(유진 표, Bloomberg): 4Q26E 매출 $17.1B·영업이익 $2.9B → 1Q27E $16.9B·$2.8B. 가이던스가 이 경로를 4Q에서 약 −$1.4B(영업이익) 끊어 놓았다 — **컨센 경로상 YoY 정점은 2Q26～3Q26에 이미 지났다** [판단]

(2) QoQ로 다시 보기 (조정 기준 보조)
→ Non-GAAP 영업이익 QoQ: +38%(1Q26) → +66%(2Q26) → **+17%(3Q26)** → 약 **−54%(4Q26G)**. 분기 증가액 +$1.10B(2Q) → +$0.46B(3Q) → −$1.74B(4Q) [계산]
→ 매출 QoQ도 +18.8%(2Q) → +2.4%(3Q) → −6.1%(4Q 가이던스). 3Q의 이익 증가는 거의 마진(믹스·18A 원가 −40%) — 물량은 이미 멈췄다 [판단]

→ 공통: 하회의 본체는 Fab 28이 아니라 **PC 재고조정**. Fab 28을 되돌려도 매출 약 $15.8B(컨센 −7%), GPM 40% [계산]
→ 갈림: 재고조정 기간 — **1Q27에 끝난다(대신·NH)** vs **2Q27까지 + 메모리 정상화 2028(삼성)**. 그리고 PC 웨이퍼를 서버로 돌리는 효과가 언제 나오는지(유진 낙관, NH는 기판 제약으로 미미)

→ 갈림: 하락이 충분한가 — 대신(일부 선반영, 확신도 중간) vs 삼성(이익 하향이 더 크면 멀티플은 오히려 비싸진다)

(3-4) [판단]
→ 10/30 종가 $65.80 기준 시가총액 $349.5B(NH), 2027E 조정 EPS $1.43(NH Bloomberg)이면 PER 약 46배 [계산] — 주가가 28% 빠졌는데도 2027 이익 하향(−15%)이 겹쳐 멀티플은 크게 내려오지 않았다. 삼성의 경고가 숫자로 맞다. 2027 CapEx가 컨센 $26B를 크게 넘으면 FCF 적자 폭이 커져 증자·희석 우려까지 붙을 수 있다

(4) 쟁점 4 — 파운드리·EMIB 외부 고객

(4-1) 회사 설명
→ 파운드리 영업손실 $1.9B, QoQ $0.24B 개선. 18A 수율 두 자릿수 개선, 업계 표준 수준에 예상보다 빨리 접근. 18A 기반 클라이언트 CPU 비중 5% 미만 → 약 1/3. 18AP 연말 출시 유지, 14A 0.9 PDK 10월 선별 고객 공개, 1.0 PDK 1Q 예정 (NH·하나·대신)

→ 공통: 손실 축소는 진짜(OPM 3개 분기 연속 개선), 외부 매출은 아직 없다
→ 갈림: EMIB 외부 고객이 **2027 실적에 기여하는지(유진: 주요 램프는 2028)** — 대부분 2028 스토리로 본다

(4-4) [판단]
→ 파운드리 개선은 외부 고객이 아니라 **내부 CPU 물량 증가 + 18A 원가 하락**이 만든 것이다. PC 물량이 4Q에 −20% 이상 빠지면 18A(클라이언트 CPU) 가동률이 떨어져 이 개선 속도가 4Q에 멈출 수 있다 — 하나가 지적한 "생산량 조정에 따른 고정비 부담"과 같은 이야기 [전망]. EMIB 고객 발표(2개 분기 내)는 내러티브 트리거이지 2027 숫자 트리거는 아니다

## 3. 내러티브 점검

① 성장 스토리 정의
→ "에이전틱 AI로 서버당 CPU 수요가 폭증하고(GPU:CPU 비율 역전), x86 서버 1위 인텔이 Xeon·맞춤형 실리콘·18A/EMIB 파운드리로 그 수요를 가장 크게 담는다 — 동시에 Lip-Bu Tan 체제의 턴어라운드로 파운드리 손실이 줄어든다"

② 이번 분기 평가 — **약화**
→ 강화 요소: DCAI +78%(15년 만의 성장), DCAI OPM 41.5%, 2026 DCAI 연초 대비 +$10B, 서버 CPU TAM 5배·2028까지 공급 부족, 맞춤형 실리콘 YoY 2배, Foundry 손실 3개 분기 연속 축소, 18A 원가 −40%, Clearwater Forest 출하·OCI 계약
→ 약화 요소: 4Q 가이던스 매출·GPM·EPS 모두 하회(7분기 만에 처음), PC 재고조정 2027 상반기까지, **DCAI가 공급에 묶여 AMD에 성장률 열위**, 2027 CapEx 대폭 증액 + FCF 적자, 2027 영업이익 컨센 −15%, 투자의견 하향, 주가 −28.5%
→ 스토리의 수요 전제는 오히려 강해졌지만, **"인텔이 그 수요를 담는다"는 두 번째 전제가 공급·현금 제약으로 늦춰졌다.** 훼손이 아니라 타이밍 지연·추정치 하향 = 약화 [판단]

③ 국면 — 델타 꺾임 × 내러티브 약화
→ Non-GAAP 영업이익 YoY: +142% → +112% → 약 +24%(가이던스), 매출 YoY 2개 분기 연속 둔화, 컨센 경로상 정점은 2Q26～3Q26에 통과 — 기준표의 "꺾임" [판단]
→ BT 프레임상 **매매 제외 구간.** 같은 서브섹터의 AMD(델타 '가속 대기', 4Q 가이던스 +96%)와 정반대 위치 — 로직·CPU 서브섹터 안에서 에이전틱 CPU 수혜는 AMD 쪽으로 기울어 있다 [판단]
→ 직전 Q1 리뷰 시점의 "trend, not noise" 구간(델타 형성·내러티브 형성)에서 2개 분기 만에 반대편으로 넘어왔다

④ 다시 강해질 트리거
→ 1Q27 가이던스가 QoQ 플랫 이상(CCPG 바닥 + DCAI 공급 증가) — 꺾임 판정 철회 조건
→ EMIB 패키징 외부 고객 발표(회사: 2개 분기 내), 14A 1.0 PDK 공개(1Q27)와 외부 수주
→ 기판·Intel 3 공급 확대가 예상보다 빨라 DCAI QoQ 20%대 재가속

⑤ 깨뜨릴 리스크
→ 1Q27 Non-GAAP 영업이익 YoY 마이너스 + PC 재고조정 2Q27 이후까지 연장 (메모리 가격 추가 상승)
→ 2027 CapEx가 컨센 $26B를 크게 넘고 FCF 적자 확대 → 추가 증자·희석
→ 공급 제약 기간 동안 AMD·ARM(하이퍼스케일러 자체 칩)에 서버 점유율 구조적 이탈
