# 와이지엔터 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 꺾임 | 내러티브: 약화 → 매매 제외 구간 (영업이익 YoY +31.2% → −56.6%로 마이너스 전환, 컨센 200억 대비 −32%. 4Q26은 빅뱅 아시아 투어로 YoY +13% 회복이 컨센이지만 2027년은 매출 −12%·영업이익 −7% 역성장 컨센 — 신인 2팀 데뷔 전까지는 성장 스토리가 비어 있다)

> ⚠ 비영업 요인 플래그: 3Q26 영업이익 YoY −56.6%(−176억)는 ① 3Q25 BLACKPINK 투어 고기저 ② 일회성 비용(대손상각 약 20억 + 빅뱅 투어 미주·유럽 구간 베뉴·운반·판매수수료) ③ 투자 자회사 기타영업손익 −65억(76억 → 11억)이 겹친 결과. 본업 영업이익(다올·KB 분리치)만 봐도 235억 → 123억, **−48%** — 기타손익을 빼도 꺾임 판정은 같다. 대손상각은 채권 회수 시 환입 가능(삼성)

→ 숫자: 매출액 1,567억 (−9.4% YoY, +22.7% QoQ), 영업이익 135억 (−56.6% YoY, OPM 8.6%). 매출 YoY 46.9%(1Q26) → 27.2% → **−9.4%**, 영업이익 YoY 103.9% → 31.2% → **−56.6%** — 3개 분기 연속 둔화 후 마이너스 전환
→ 컨센 대비: 매출 −4.0%, 영업이익 −32.5% (FnGuide 컨센 매출 1,632억·영업이익 200억, 삼성·다올·하나·키움 인용) — 미스의 원천은 비용(대손·빅뱅 투어 초기 운영비)과 투자 자회사 손익, 매출은 MD가 받쳤다
→ 쟁점 ①: **3Q 미스는 일회성인가** — 6건 모두 "4분기부터 비용 부담 완화"에 동의, 4Q26E 영업이익 평균 252억(224\~278억, YoY +12.8%)
→ 쟁점 ②: **MD 406억(+44%) 분기 최대** — 블랙핑크 투어가 있던 3Q25(281억)를 빅뱅·베이비몬스터·트레저로 넘었다. IP 사업 확장이 구조적인지가 2027년 이익 방어의 관건
→ 다음 분기 관건: 4Q26 영업이익 252억(YoY +13%) 회복 여부 + 신인 보이그룹(5인)·걸그룹 데뷔 일정(1H27) 공식화 — 2027E 매출 역성장 컨센을 뒤집을 유일한 변수

| KB (11/12) | (업종 전망 — 원인 언급 없음) | 224억 | 본업 영업이익 204억 + 기타 20억 |

(1-3) 공통 결론: 3Q 미스의 대부분은 4Q부터 소멸하는 비용 — **6건 모두 4Q26 YoY 플러스 회복**(+0.4%\~+24.7%). 갈리는 지점: 4Q 레버리지 크기(키움·하나·다올 270억대 vs 삼성·교보·KB 220\~230억대). 차이는 빅뱅 아시아 회차·회당 모객 가정
(1-4) [판단] 대손 20억과 기타영업손익 감소(−65억 YoY)를 모두 더해도 85억 — 3Q 이익 감소폭(−176억)의 절반이다. 나머지는 본업 마진 자체(블랙핑크 고기저 + 빅뱅 투어 원가 구조)라 "전부 일회성"은 아니다. 4Q26 본업 영업이익이 200억 이상(다올 267억·KB 204억 추정)으로 나와야 일회성 설명이 성립

(2) **MD 분기 최대 — IP 사업이 구조적으로 커지나**

(2-1) 회사 설명(IR): "간접 매출 강화 — 비활동기에도 수익 창출이 가능한 IP Biz 확대, 아티스트 직접 활동 없이도 지역·사업 영역 확장". 간접 매출(디지털·MD/굿즈·로열티)은 2025년 2,000억대로 2016년 이후 최대(IR 차트 기준)
(2-2) 증권사별 해석

(2-4) [판단] MD는 투어와 함께 움직이는 매출이라 2027년 투어 규모(빅뱅 추가 회차·베이비몬스터 돔 확대)가 결정한다. 키움의 MD 성장 가정이 맞으려면 비활동기 IP 상품(라이선싱·팝업)이 별도 매출로 확인돼야 한다

(3) **2027년 라인업 공백과 매출 역성장**

(3-1) 사실: 2027E 매출 6사 평균 5,465억(−11.9%), 영업이익 641억(−7.1%). 하나 "2027년은 사실상 트레저와 베이비몬스터 활동이 대부분일 정도로 라인업 부족", 키움 "메가 IP 활동 가시성 제한으로 매출 역성장 불가피, 데뷔 비용을 보수적으로 반영하면 시장 추정치 하회 여지"
(3-2) 증권사별 2027E 영업이익: 키움 724억 > KB 684억 > 삼성 679억 > 교보 615억 > 하나 605억 > 다올 537억 — 범위 537\~724억(폭 35%)
(3-3) 갈리는 지점: 빅뱅 2027년 투어 기여(39회 중 2027년 분량)와 신인 데뷔 비용. 다올은 2027E 영업이익 −24.3%로 가장 보수적(본업 517억)
(3-4) [판단] 블랙핑크 그룹 활동이 2027년 컨센에 거의 없다는 점에서 하방은 제한적이지만, 상방은 신인과 빅뱅 회차 추가에만 걸려 있다. 매출 성장 스토리가 없는 해 — 모멘텀 매매 관점에서 2027년 상반기 신인 지표 전까지 '대기'

(4) **신인 보이그룹·걸그룹 데뷔(1H27)가 리레이팅 트리거가 될 수 있나**

(4-1) 사실: 신인 보이그룹(5인) 데뷔가 당초 4Q26 → 1H27로 이동, 회사는 걸그룹(3명 공개)과 동시 공개까지 검토(키움). 다올 가정: 보이그룹 1Q27·걸그룹 3Q27. IR 포트폴리오 표에 "NEXT BOY, GIRL — TBA"

(4-3) 공통 결론: 6건 모두 신인을 핵심 변수로 지목하고, **추정치에는 신인 기여를 낮게 반영**했다. 갈리는 지점은 타이밍뿐(1Q27 vs 1H27 동시 데뷔 vs 3Q27 걸그룹)
(4-4) [판단] 신인 흥행은 추정 상향으로 바로 이어지는 '옵션'이지만 숫자(초동·스트리밍)가 나오기 전까지는 판정에 반영할 수 없다. 데뷔 일정 공식 발표 → 초동 판매량이 순서대로 확인 포인트

(5) **빅뱅 월드투어 확대 가능성**

(5-1) 사실(IR): 빅뱅 19개 도시 39회 전 회차 돔·스타디움급, 3Q26 8회·4Q26 24회(하나). 블랙핑크 DEADLINE 투어는 33회로 BORN PINK(66회)보다 회차는 절반이지만 스타디움급 28회로 회당 모객 확대
(5-2) 해석: 하나 "빅뱅 월드투어가 발표된 일정보다 추가될 가능성이 높아 내년 상반기까지는 빅뱅 매니지먼트 기반 안정적 호실적", 교보 "빅뱅 공연 추가 회차 공개 가능성", 삼성·다올 4Q 일본·아시아 회차 증가
(5-3) [판단] 빅뱅 추가 회차는 2027년 컨센 하방을 받치는 요인 — 다만 빅뱅은 전속 재계약이 아닌 매니지먼트 형태(하나 도표 "재계약X")라 이익 기여율은 자체 IP보다 낮을 수 있다 [판단]

## 3. 내러티브 점검

→ 성장 스토리: **블랙핑크 재계약·월드투어로 만든 이익 레벨을 빅뱅(매니지먼트)·베이비몬스터·트레저가 이어받고, 신인 2팀으로 다음 사이클을 여는 기획사** — 2025년 흑자 전환 이후 시장이 와이지를 보는 이유
→ 이번 분기: 블랙핑크 투어 종료 후 첫 분기에서 영업이익이 반 토막(−57%) 났고, 본업만 봐도 −48%. MD 분기 최대·베이비몬스터 돔 진입은 긍정이지만, 성장 스토리의 다음 장(신인)은 아직 숫자가 없고 2027년 컨센은 역성장 → **델타 꺾임 + 내러티브 약화 → 매매 제외 구간**
→ 다시 강하게 만들 트리거: 신인 보이그룹·걸그룹 데뷔 일정 공식화와 초동(베이비몬스터 데뷔 수준) / 빅뱅 2027년 추가 회차 공개 / 블랙핑크 그룹 활동(앨범·투어) 2027년 재개 발표
→ 깨뜨릴 리스크: 4Q26 영업이익이 230억 아래(본업 마진 회복 실패) / 신인 데뷔 추가 지연(2H27 이후) / 빅뱅 투어 원가 구조가 아시아 구간에서도 개선되지 않음
