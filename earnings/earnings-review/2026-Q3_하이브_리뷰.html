# 하이브 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 가속 | 내러티브: 약화 → 정점 경계 구간 (분기 최대 실적·컨센 +14%로 이익 증가폭은 커졌지만, BTS 투어가 끝나는 2027년 하반기 공백을 이유로 증권사 10곳 중 5곳이 TP 하향 — 실적이 아니라 멀티플이 깎이는 국면)

> ⚠ 비영업 요인 플래그: 3Q26 영업이익 YoY는 기저(3Q25 −422억) 적자로 n.m. — 판정은 영업이익 증가액(YoY +1,050억 → **+2,307억**)과 2년 전 동기 대비(2Q24 대비 +236% → 3Q24 대비 **+248%**)로 대체. 1Q26 적자는 주식증여 비용 2,550억(일회성, 조정 영업이익 585억). 3Q26 순이익 113억(지배 −68억)은 외화평가손실(영업외) 때문으로 영업이익 판정과 무관

→ 숫자: 매출액 1조 5,257억 (+109.8% YoY, +5.2% QoQ), 영업이익 1,885억 (흑자전환, +10.3% QoQ, OPM 12.4%). 매출 YoY 105.5%(2Q26) → **109.8%**, 영업이익은 2Q26 1,709억(+159%) → 3Q26 1,885억으로 2개 분기 연속 분기 최대
→ 컨센 대비: 매출 +3.9%, 영업이익 +14.6% (FnGuide 컨센 매출 1조 4,690억·영업이익 1,650억, 유안타 인용) — 이익 서프라이즈의 원천은 매출이 아니라 **판관비 −5.5% QoQ**
→ 쟁점 ①: **2027년 하반기 BTS 공백** — 회사가 "투어 이후 그룹·솔로 활동 준비"를 언급했지만 구체 일정 없음. 증권사 2027E 영업이익은 4,310억(다올)\~5,620억(GS)으로 갈린다
→ 쟁점 ②: **MD 수익화가 마진을 지킨다** — 공연 비중 48%로 GPM은 −1.5%p QoQ(30.3%) 하락했지만, BTS 북미 투어 MD만 1,070억(현지 생산·공급망)
→ 다음 분기 관건: 4Q26 영업이익 컨센 평균 약 1,320억(증권사 10곳 1,070\~1,560억) — 기타판관비 정상화 후에도 OPM 11%를 지키는지, BTS 2027년 하반기 활동 공지가 나오는지

(1-4) [판단] 숫자상 2027년 감익(조정 기준)은 컨센에 이미 들어 있다. 확인되면 결론이 바뀌는 것은 **완전체 앨범·차기 투어 일정 공지**(하나: 내년 초 구체화 예상) — 공지 전까지는 보수 쪽(4,300\~4,800억)이 숫자와 더 맞다

(2) **공연 비중 확대 속 마진 방어**

(2-1) 회사 설명: BTS ARIRANG 북미 투어(4\~9월) 12개 도시·31회, 공연장당 MD 부스 15개, MD 200만 개 판매. 위버스 픽업(선주문 후 현장 수령)·RFID 결제로 구매 경험 고도화, 아티스트별 MD·캐릭터로 확대 계획 (IR)

(2-2) 증권사별 해석 편차

(2-3) 공통 결론 vs 갈리는 지점: MD 현지화가 구조적이라는 데 공통. 갈리는 지점은 **3분기 판관비 감소의 지속성** — 유안타는 일회성으로 보고 4분기 OPM을 낮췄다
(2-4) [판단] IR 요약재무상 판관비 감소분(−160억 QoQ) 중 운반비·기타판관비가 −155억이라 일회성 쪽 논리가 숫자와 맞다. 4Q26 OPM 컨센(평균 약 11%)이 유지되면 마진 구조 개선은 MD 효과로 확인된다

(3) **저연차 IP 수익화**

(3-1) 회사 설명: 캣츠아이 3rd EP 'WILD' 빌보드200 1위, 유럽·북미 27개 도시 31회 아레나 투어, 2027년 아시아·오세아니아 11회 추가, 롤라팔루자 인디아 2027 헤드라이너. 3Q 스트리밍의 52%가 2026년 발매곡 (IR)

(3-3) 공통 결론 vs 갈리는 지점: 저연차 IP 체급은 숫자로 확인됐다는 데 전원 동의. 갈리는 지점은 **이익 기여 시점** — 2027년(키움·유안타) vs 2028년(하나·HSBC)
(3-4) [판단] 2027년 BTS 역기저(공연 매출 −40%대, 다올·유안타 추정)를 저연차가 2027년 안에 메우기는 어렵다는 쪽이 숫자와 맞다. 미국 신인 남자 그룹(2027년 상반기 데뷔) 초기 성과가 2027년 기여 논리의 첫 확인점

(4) **디레이팅과 주주환원**

(4-1) 사실: 11/3 주가 155,900원, 11/10 143,400원(52주 저점 138,000원), 2027E P/E 약 15배(하나 11/11) — 공모가 대비 115% 수준(하나). HSBC는 K팝 IP의 비기획사 흥행·동남아 현지 IP 확산으로 업종 밸류 프리미엄이 사라졌다고 진단
(4-2) 갈리는 지점: 하나는 "역사적 저점 주가에서 높은 주주환원 계획 동반 필요", 한화는 "센티먼트가 실적과 별개로 나빴던 만큼 강한 반등 기대". 11/19 HYBE Japan의 KeyHolder(노기자카46 운영사 지분 50%) 최대 50.1% 공개매수(주당 1,200엔, 약 1,057억, 2027-01-06 종료) 발표 후 주가 166,600원 (삼성)
(4-3) [판단] TP 하향의 원인이 멀티플(아래 표)이라 주가 반등은 이익보다 **BTS 일정 확정 + 주주환원**이라는 이벤트에 달려 있다

(5) **순이익 적자 — 외화평가손실**
(5-1) 회사·증권사 공통: 영업외비용 1,428억, 원화 강세로 외화 현금·예금 평가손실 약 1,400억(하나) — 현금창출력과 무관한 회계 손실(GS·HSBC·한화)
(5-2) [판단] 영업이익 판정에는 영향 없음. 다만 대규모 외화 현금 보유 구조라 원화 방향에 따라 분기 순이익 변동성이 계속 크다

## 3. 내러티브 점검

→ 성장 스토리: **BTS 완전체 복귀로 공연·MD 사상 최대 실적을 내는 동안, 캣츠아이·코르티스·미국 신인이 다음 성장축으로 자리 잡는 '신구 교체'** — 시장이 하이브를 사는 이유는 BTS 이후의 이익 레벨
→ 이번 분기: BTS 효과(공연 +197%, MD +99%)와 저연차 체급(캣츠아이 빌보드 1위·아레나 매진, 코르티스 누적 400만 장)은 숫자로 확인. 그러나 2027년 하반기 BTS 일정이 비어 있어 **이익 정점(2026년) 이후 경로에 대한 확신이 약해졌고**, 셀사이드는 추정치 대신 멀티플을 깎았다 → **델타 가속 + 내러티브 약화 → 정점 경계 구간** (모멘텀 관점: 분기 숫자는 최고지만 2027년 감익 경로가 컨센에 있음)
→ 다시 강하게 만들 트리거: BTS 완전체 앨범·차기 투어 공지 / 미국 신인 남자 그룹 데뷔 흥행 / 의미 있는 주주환원(자사주 소각·배당 확대)
→ 깨뜨릴 리스크: BTS 2027년 하반기 활동이 솔로 위주로 축소 / 4Q26 판관비 정상화로 OPM 10% 하회 / KeyHolder 등 M&A가 주주환원 대신 자본 배분을 가져감
