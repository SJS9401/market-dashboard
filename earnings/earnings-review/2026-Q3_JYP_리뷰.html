# JYP Ent. 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 가속 | 내러티브: 약화 → 정점 경계 구간 (분기 최대 매출·영업이익 +17.6%로 반등했지만 4Q26 컨센이 바로 −35% YoY로 꺾이고, 스트레이키즈 군입대·TWICE 일부 멤버 이탈로 외국계 2곳이 실적 발표 전후 Hold·UW로 하향 — 다음 성장축은 아직 숫자가 없는 저연차 IP)

> ⚠ 비영업 요인 플래그: 2Q26 영업이익 YoY −41.4%는 2Q25 고기저(+469%, 2Q24 93억 저기저의 반동) 효과 — 3Q26 +17.6%의 직전 비교 대상이 비정상적으로 낮았다. 3Q26 이익 서프라이즈의 한 축인 출연 매출 264억(+138%)은 STRAYCITY 남미 5회·Rock in Rio 헤드라이너라는 이벤트성 매출. 순이익 243억(−10.6%)은 외화환산손실(영업외, 하나 116억) 때문으로 영업이익 판정과 무관

→ 숫자: 매출액 2,675억 (+15.0% YoY, +46.0% QoQ, 분기 최대), 영업이익 480억 (+17.6% YoY, OPM 17.9%). 매출 YoY −15.2%(2Q26) → **+15.0%**, 영업이익 YoY −41.4% → **+17.6%**
→ 컨센 대비: 매출 +14.7%, 영업이익 +14.0% (FnGuide 컨센 매출 2,332억·영업이익 421억, 다올·KB·상상인 인용) — 서프라이즈의 원천은 스트레이키즈 **서구권 음반(높은 판매단가)·MD(+46.7%)·출연(+138%)**
→ 쟁점 ①: **스트레이키즈 의존과 군입대** — 2027년 투어 46회·약 220만 명이 2027년 실적을 받치지만, 리노 1Q27 입대 시작으로 2028년 이후가 시험대
→ 쟁점 ②: **TWICE 일부 멤버 이탈** — 개별 활동을 외부 소속사에서(HSBC·JPM), 완전체 활동 재개는 빨라야 2027년 말\~2028년(HSBC)
→ 다음 분기 관건: 4Q26 영업이익 컨센 평균 274억(7사 228\~333억, YoY −35%) — 대형 공연 공백 분기라 델타 '꺾임' 판정이 유력. 2027년 1월 11일 신인 보이그룹 oftheblue 데뷔 초동이 리레이팅의 첫 확인점

② 이번 분기 쟁점 (리포트 10건 기준)

(1) **스트레이키즈 서구권 레버리지 vs 군입대** — 10건 전부 언급. 2027년 투어가 군백기 우려를 덮을 수 있나
(2) **TWICE 일부 멤버 이탈과 완전체 활동 가시성** — 7건. 두 번째 메가 IP의 이익 기반이 줄어드나
(3) **저연차 IP(oftheblue·NMIXX·킥플립·NEXZ)가 다음 성장축이 될 수 있나** — 10건
(4) **4Q26 공백과 2027년 실적 경로** — 7건. 2027E 영업이익 1,330억(JPM)\~1,616억(다올)
(5) **3Q 서프라이즈의 질** — 6건. 출연·MD 이벤트 매출과 영업외 손실

③ 쟁점별 분해

(1) **스트레이키즈 서구권 레버리지 vs 군입대**

(1-1) 회사 설명: 2027년 서구권 스타디움 1차 발표 — 2Q27 북미 14개 도시(직전 투어 대비 +4개), 3Q27 유럽 7개 도시(+1개), 회차당 4만 명 이상 모객 계획, 2Q27 일본 스타디움 추가. 주요 도시 투어 연계 팝업으로 MD 고도화 지속. 8월 미니 앨범으로 '빌보드 200' 9연속 1위 (IR)

(1-2) 증권사별 해석 편차

| 증권사 | 핵심 가정·추정 | 논리 |
|---|---|---|
| 하나 | 2027년 투어 총 46회·약 220만 명, 2027E 영업이익 1,468억 | 7월까지 일정 + 추가 공연 감안 시 2027년 영업이익 1,500억 내외 재반등. 리노 1분기 입대 결정 |
| 리딩 | 2027F 콘서트 3,200억 (2026F 2,662억) | 대형 투어가 군백기 우려를 완충, 공개 투어 일정 유지로 단기 공백 우려 낮아짐 |
| 상상인 | 2027E 콘서트 2,500억 (2026E 1,530억) | 북미 14·유럽 7개 도시 추가 — 남미가 페스티벌로 대체된 점·회차 추가 가능성 감안 시 직전 투어와 유사 규모 |
| KB | 2027E 영업이익 −7.7% 하향 | 최근 성과는 예상 상회지만 2027년 콘서트 규모는 예상 하회. 리노 1Q27 입대로 Peak-out 우려 |
| HSBC (실적 전) | 2028년 동시 입대 시나리오 | 순차 입대가 아니라 BTS식 동시 입대면 2028년 스트레이키즈 기여 급감, 하이브보다 IP 분산이 약해 충격이 더 크다 |
| JPM (실적 전) | 입대 사이클 2027년 말 시작 (기존 2028년) | 마지막 월드투어가 2027년까지 버텨 주지만 '2028E가 진짜 시험대' — 2028E 영업이익 −17% YoY |

(1-3) 공통 결론 vs 갈리는 지점: 2027년 상반기\~3분기까지는 스트레이키즈 투어가 실적을 받친다는 데 전원 동의. 갈리는 변수는 **2027년 투어 체급**(KB는 예상 하회, 상상인·리딩은 확대)과 **2028년 입대 방식**(순차 vs 동시)
(1-4) [판단] 3Q26 숫자는 스트레이키즈 코어 팬덤이 오히려 커지고 있다는 쪽(음반 409만 장, MD +47%)을 지지한다. 결론을 바꿀 변수는 2027년 공연 회차의 실제 확정(46회 → 추가)과 다음 입대 멤버 공지 — 후자가 나오기 전까지 2028년 이익은 셀사이드마다 ±20% 폭으로 갈릴 수밖에 없다

(2) **TWICE 일부 멤버 이탈과 완전체 활동 가시성**

(2-1) 회사 설명: 10월 투어 피날레 라이브 바이닐, 11월 나연 솔로 싱글, 데뷔 11주년 팬파티·신규 캐릭터 '트둥즈' 팝업 (IR). 계약 관련 언급은 IR에 없음

(2-2) 증권사별 해석 편차

(2-3) 공통 결론 vs 갈리는 지점: "그룹은 유지되지만 완전체 활동 빈도·강도는 줄어든다"에 공통. 갈리는 지점은 **이탈 규모**(1명 vs 3명 — 시점 차이로 보이며 최신 리포트인 하나 11/12가 3명)와 **JYP 수익 배분 축소 폭**
(2-4) [판단] 2026년 공연의 약 40%가 TWICE였다는 점(하나)을 감안하면, 2027년은 스트레이키즈 단독 체제(JPM "2026 둘 다, 2027 스트레이키즈만, 2028 TWICE만")가 숫자와 맞다. 회사가 재계약 결과를 공식화하는 시점이 멀티플 하단을 정하는 이벤트

(3) **저연차 IP가 다음 성장축이 될 수 있나**

(3-1) 회사 설명: 본사 SQU4D 산하 4인조 보이그룹 oftheblue 2027년 1월 11일 정식 데뷔(11/11 선공개 음원, 11/12 팝업). NMIXX 11월 일본 데뷔(워너 재팬 협업), 킥플립 매 앨범 자체 최고 기록·2027년 첫 투어, NEXZ 미니 초동 43만 장·남미 첫 진출 (IR)

## 3. 내러티브 점검

→ 성장 스토리: **스트레이키즈·TWICE 두 메가 IP의 서구권·일본 팬덤 확장이 음반 판매단가·MD·투어로 레버리지를 만드는 기획사** — 2023\~2025년 JYP를 사는 이유
→ 이번 분기: 스트레이키즈 레버리지는 숫자로 다시 확인됐다(음반·MD·출연 사상 최대). 그러나 스토리의 두 기둥 중 TWICE는 일부 멤버 이탈로 약해졌고, 스트레이키즈는 군입대가 시작된다. 이를 메울 저연차 IP는 아직 숫자가 없다 → **델타 가속(3Q 단일 분기) + 내러티브 약화 → 정점 경계 구간**. 4Q26·1Q27 컨센 YoY가 모두 마이너스라 '가속'은 한 분기짜리일 가능성이 높다
→ 다시 강하게 만들 트리거: oftheblue 초동·스트리밍 흥행(2027-01) / TWICE 완전체 재계약·활동 일정 공식화 / 스트레이키즈 2027년 공연 회차 추가·입대 순차 진행 확인 / M&A(넥스로크 등) 구체화
→ 깨뜨릴 리스크: TWICE 추가 이탈 / 스트레이키즈 동시 입대 결정 / 저연차 IP 초동 부진으로 2028E 공백 확대
