# 현대차 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 가속 | 내러티브: 약화 → 관찰 구간 (가속은 판매보증비 환율효과·관세 기저발 — 아래 ⚠ 플래그, 본업은 감익. 로봇 실체 이벤트 — 연말 로봇생산법인·BD 증자 — 확인 전까지 관망)

> ⚠ 비영업 요인 플래그: 영업이익 +1,400억(YoY +5.5%)을 만든 주된 원인 = **판매보증비 감소 1.22조**(기말환율 급락에 따른 충당부채 환율효과, 하나·삼성·JPM·MS 공통 지목) + 관세율 인하 기저. 판매보증비 감소분을 빼면 영업이익 약 1.45조, YoY 약 -43% `[추정, 회사 IR p.13 판관비 내역 단순 차감]` — 물량 -1.11조·믹스 -0.57조로 본업은 감익

→ 숫자(확정): 매출 45.11조(-3.4% YoY), 영업이익 2.68조(+5.5%), OPM 5.9% — OpenDART 3Q26 분기보고서 확정치가 10/29 발표치와 동일. 영업이익 YoY는 2Q26 -20.8% → +5.5%로 5개 분기 만에 플러스, **매출 YoY는 +1.9% → -3.4%로 마이너스 전환** → 판정은 보고 기준 영업이익 YoY 변화(-20.8% → +5.5%, +26.3%p)로 **가속** — 로봇 섹터 통합 검수(2026-11-23)에서 매출 방향과 무관하게 영업이익 YoY 중심으로 판정 기준을 통일 (매출 YoY 마이너스 전환은 보조 지표로만 표기, 이익 증가의 원천은 ⚠ 플래그)
→ 컨센 대비: 영업이익 FnGuide 2.44조 대비 +9.9%(삼성 집계), Bloomberg 2.61조 대비 +2.4%(메리츠), 2.34조 대비 +15%(MS·JPM). 지배순이익 1.70조는 -20\~-25% 하회
→ 쟁점: 10개 리포트 전부가 "beat의 질이 낮다"(보증충당부채 환입)에 동의하고, 갈리는 건 **2027년이 감익(삼성 -8%·메리츠 -8%)이냐 하반기 증익 전환(하나 -2%·상상인 +14%)이냐**. 로봇은 "실행 국면 진입"(하나)과 "협력의 실체 부재"(메리츠) 사이
→ TP: 원문 7곳 최신 평균 48.0만 원, 직전 대비 비교 가능한 6곳 57.8만 → 48.8만(-15.6%), FnGuide 컨센 TP 59.9만(25곳) → 51.7만(24곳, -13.7%). 하향 6건·유지 4건·상향 0건, **하향의 주된 원인은 멀티플**(삼성 Target P/E -25%, 하나 자동차 배수 9배, 메리츠 Peer PER 12.9 → 10.5배)
→ 다음 분기 관건: 4Q26E 영업이익 2.32조(4곳 평균, YoY +37% — 4Q25 저기저)가 컨센상 **YoY 정점**이고 1Q27E는 -4%(하나)로 다시 마이너스 → 1Q27에 꺾임 판정이 날 경로. 이를 뒤집을 변수는 4Q 도매 회복 강도(111만 대 역산)와 연말 로봇생산법인 설립·BD 1조 원+ 제3자 유증(삼성 11/18)

(4-1) 회사 설명
→ "이자비용 증가가 핵심. 자산과 부채를 동일 만기로 매칭하는 구조상 장기금리 상승이 조달비용에 영향. 중고차 지수 하락(EV 중심)에 따른 반납 차량 매각손실 반영 … 연체율 상승으로 신용비용도 소폭 증가" (컨콜 Q&A, 하나 10/30)
→ HCA: 영업수익 +24%, 영업비용 +26%, 영업이익 -22%, 9월 말 유동성 190억 달러 (하나 10/30)

(4-2) 증권사별 해석

| 증권사 | 핵심 가정·추정 | 논리 |
|---|---|---|
| 삼성 (11/18) | 금융 = 연결이익의 20%, 리스 수익이 금융 수익의 45% | **구조적 리스크** — L2+·로보택시 확산 시 업그레이드 안 되는 차의 중고차 가치 하락 → 리스 반납 매각손실이 수년간 이어질 가능성 |
| 메리츠 (10/29) | 금융 OPM 5.1%, 3분기 기준 2018년 이후 최저. 4Q26E 금융 OPM 3.8% | 금리·중고차·대손 3중 부담. 2027E 금융 영업이익 -4.6% |
| 하나 (11/13) | 4Q26E 금융 OPM 4.8%, 2027E 6.0% 회복 | 일시적 — 2027 금융 영업이익 2.39조로 증가 |

(4-3) 공통 vs 갈림
→ 공통: 3Q 금융 이익 급감(-18%, QoQ -38%)의 원인 = 조달비용 + 중고차 매각손실 + 신용비용
→ 갈림: 지속성 — 삼성은 기술 변화(SDV)로 인한 잔존가치 하락을 **다년간 구조 문제**로, 하나는 2027 회복으로 본다

(4-4) [판단]
→ 금융은 2025년까지 차량 감익을 메워 주던 완충재였는데 3Q부터 같은 방향으로 꺾였다. 금융 OPM이 4Q에도 5% 아래면 삼성 논리가 맞는 쪽이고, 2027 감익 시나리오에 힘이 실린다 `[판단]`

(5) **주주환원 재검토 — 4조 원 자사주 계획 축소와 Physical AI 투자 사이클**

(5-1) 회사 설명
→ "2024년 밸류업 프로그램에서 최소 배당금 주당 1만원과 TPR 35%를 제시 … 경영환경 변화를 반영한 방향을 검토 중이며 주주와 소통하기 전까지 최소 배당금 주당 1만원은 준수" (컨콜 Q&A, 하나 10/30). 3년·4조 원 자사주 매입·소각 계획은 재검토 중

(5-2) 증권사별 해석

→ 배당수익률 3.9%(삼성, 11/18 주가 259,000원 기준)는 하방 지지이지 상승 촉매가 아니다. 투자 사이클(데이터센터 SPC·로봇 공장·BD 증자)이 커질수록 자사주는 줄어드는 구도 `[판단]`

④ 낙관 vs 보수

→ 낙관(미래에셋 65만·상상인 60만): 미래에셋은 2027F 지배순이익 8.9조에 애플카 기대 구간 고점 PER 14배 + BD 지분가치 25.6조 — **멀티플과 로봇 옵션**이 근거. 상상인은 2027E 영업이익 12.08조(+14%), OPM 6.0%로 **이익 회복**을 가정한 유일한 곳
→ 보수(삼성 38만·메리츠 38만): 삼성은 2027E 영업이익 9.34조(원/달러 1,297원 가정)에 글로벌 상위 모빌리티 평균 P/E 12.7배, 메리츠는 2028E EPS 36,157원(2028년까지 3년 연속 감익)에 Tier-4 Peer PER 10.5배. 둘 다 **원화 강세 + 중국 경쟁에 따른 구조적 감익**을 가정
→ 핵심 차이: 같은 2027년을 두고 영업이익 9.3조 vs 12.1조(30% 차이), 원/달러 1,297원 vs 회복 시나리오. 로봇은 양쪽 모두 TP 근거에서 비중이 작다
→ 셀사이드 vs 바이사이드: 전원 매수(OW) 유지인데 주가는 10/29 292,500원 → 11/18 259,000원(-11%). JPM 세일즈는 "공매도가 많고 투자자들은 더 높은 가격에서 숏을 추가하겠다"고 전했다 — **바이사이드의 중기 바이어스는 부정적** `[판단]`

## 3. 내러티브 점검

① 성장 스토리 정의
→ "관세·환율을 버티는 글로벌 3위권 완성차 + **보스턴다이내믹스 아틀라스를 2028년 자사 공장에 대량 투입하고 Nvidia·Google의 피지컬 AI 데이터 디바이스가 되는 휴머노이드 완성체 회사**" — 2026 상반기 주가 고점(선행 PER 20배, 메리츠)은 후자를 샀다

② 이번 분기가 스토리에 준 영향
→ 본업: 영업이익 beat이지만 원천이 보증충당부채 환입, 가이던스 하향, 물량 -11%, 금융 수익성 최저, 2027E 컨센 -4.3% → **약화**
→ 로봇: 새 숫자 없음. IPO 부인(컨콜) + 피지컬 AI 협력 실체 부재(메리츠) + 투자자의 수요 전망 회의(JPM) → **약화**. 단 하나·삼성이 제시한 구체 일정(연말 로봇생산법인·BD 증자·2027 공장 착공)은 살아 있어 **훼손은 아님**
→ 셀사이드 반응: 10곳 전원 매수 유지, TP 하향 6건(멀티플 주도), 로봇을 이유로 TP를 올린 곳 0 — 판정표상 "스토리는 유지되나 타이밍 지연·마진 의문으로 추정치·멀티플 하향" = 약화

③ 국면 판단
→ 델타 유지(보고 기준 영업이익 YoY +5.5% vs 매출 YoY -3.4%, 방향 엇갈림. 영업이익 증가는 보증충당부채 환입 주도 — ⚠ 플래그) + 내러티브 약화 → **매매 제외 구간** (v1과 동일, 근거 교체)
→ 컨센 경로상 4Q26E YoY +37%가 정점, 1Q27E -4% — **다음 분기 숫자 가속은 저기저 착시이고, 그다음 분기 꺾임이 대기** 중이다. 로봇 섹터 관점에서 현대차는 숫자로 델타를 보여주는 종목이 아니라 이벤트(BD 증자·생산법인)로 움직이는 완성체 옵션 `[판단]`

④ 트리거와 리스크
→ 트리거: ① BD 제3자 유증에 미국 빅테크 참여(연말, 삼성) ② 로봇생산법인 설립·2027 공장 착공 확정 공시, BD/RA 지분구조 결론(하나) ③ 4Q 도매 105만 대+와 4Q OPM 5%대 유지 → 2027 하반기 증익론(하나) 신뢰도 상승
→ 리스크: ① 기말환율 반등 시 보증충당부채 역효과 + 2027 원화 강세(삼성 1,297원 가정) ② 금융부문 잔존가치 하락의 구조화(삼성) ③ 미국 Section 232 로봇·산업기계 관세(미래), Nvidia 협력의 비독점화(메리츠)
