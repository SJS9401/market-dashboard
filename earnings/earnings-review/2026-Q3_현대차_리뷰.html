# 현대차 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 유지 | 내러티브: 약화 → 매매 제외 구간 (로봇 옵션 재점화 이벤트 전까지 관망)

→ 숫자: 매출 45.11조(-3.4% YoY), 영업이익 2.68조(+5.5%), OPM 5.9%. 영업이익 YoY가 2Q26 -20.8% → 3Q26 +5.5%로 **5개 분기 만에 플러스 전환**, 컨센(2.38조, 연합인포맥스) 대비 +12.4%
→ 그러나 플러스 전환의 원천은 **관세 기저(+1.0조)와 환율(+1.28조)**이다. 물량 -1.11조·믹스(인센티브) -0.57조로 본업 체력은 약했고, 관세 기저를 빼면 영업이익은 약 1.68조로 YoY -34% 수준 `[추정, 미래에셋 분해 기준]` → 표면은 가속, **조정 기준은 바닥권 유지**로 판정
→ 매출 YoY는 +1.9% → -3.4%로 마이너스 전환(도매 -11.3%: 국내 파업·중동 수요 감소·부품사 화재). 회사는 2026 가이던스를 하향(도매 416만 → 400만 대, OPM 6.3~7.3% → 5.5~6.5%)
→ 로봇 내러티브: "해외 자회사 IPO 계획 없음" 발언으로 BD IPO 기대가 꺼졌고, 18개 증권사 중 11곳이 TP 하향(아시아경제 11/02). 미래에셋은 BD 지분가치를 32.5조 → 25.6조로 낮췄다
→ 다음 분기 관건: 4Q26 영업이익 2.4조(미래에셋, +42% YoY — 관세 기저) 이상과 **2027 가이던스(1월 CEO Investor Day·4Q 컨콜)**, 그리고 2028 아틀라스 양산 일정의 구체화(공장 착공·고객 외부 판매)

(2-4) [판단]
→ 가이던스 하향폭(OPM 중간값 6.8% → 6.0%)이 크고 투자까지 줄였다. 회사 스스로 2026년 "버티기"를 선언한 셈이라, **본업 델타 재가속의 근거는 아직 없다** `[판단]`

(3) **로봇(BD) 가치 — IPO 기대 소멸과 SOTP 할인**

(3-1) 회사 설명
→ 3Q26 컨콜: 해외 자회사 IPO 계획 없음 (아시아경제 11/02 인용). BD IPO는 "결정된 바 없고 검토 중"(이투데이 09/12)
→ 그룹 계획: 2028 미국 로봇 생산시설 연 3만 대·액추에이터 연 35만 개, 현대차·기아 공장 로봇 2만 5천 대 이상 투입 (헤럴드경제 05/18), 아틀라스 2028 HMGMA 투입 → 2030 조립 공정 확대 (SBS Biz 10/30)

(3-2) 증권사별 해석

|---|---|---|
| 미래에셋 (10/30) | BD 기업가치 82.9조 = 2030 매출 3조 × PSR 27.6배(유니트리·유비테크 평균). 현대차 지분 약 30.9%(소프트뱅크 풋옵션 행사 후 가정) → 지분가치 25.6조(기존 32.5조) | 주가 모멘텀은 미국 생산 계획(ROI 2년 목표)·조립시간 단축. 추가 자금조달·NDAA·FCC Covered List 등 정책 리스크 주시 |
| IBK (이투데이 09/12 인용) | 2028 아틀라스 1만 1,290대 × ASP 13.4만 달러 = 매출 2.19조, 2030 3만 대 4.72조 | 양산 램프업 경로 제시 |
| 아시아경제 집계 | IBK TP 67만 → 46만, 미래에셋 84만 → 65만 | IPO 기대 소멸이 상반기 랠리를 지탱하던 축을 제거 |

(3-3) 공통 vs 갈림
→ 공통: 로봇은 여전히 장기 성장 동력(로보택시·아틀라스 상용화)으로 매수 논리에 남아 있다
→ 갈림: **BD 가치의 크기** — PSR 기반(미래에셋 82.9조) vs 매출 램프 기반(IBK 2030 매출 4.7조). BD 실제 실적은 2025 매출 1,501억·순손실 5,284억(이투데이) — 2030 매출 3조는 20배 성장 가정

(3-4) [판단]
→ 로봇 가치는 **IPO(가격 발견)·외부 고객 수주·양산 착공** 셋 중 하나가 있어야 다시 주가에 반영된다. 이번 분기에는 셋 다 없었고, 미국 Section 232(로봇·산업기계 국가안보 조사, 2026.10 말 포고문 — 미래에셋)라는 새 변수가 생겼다 `[판단]`

(4) **주주환원 — DPS 1만원 유지 vs 자사주 축소 가능성**

(4-1) 회사 설명
→ 3Q 배당 주당 2,500원, 밸류업 최소 연 DPS 1만원 유지 재확인 (파이낸셜뉴스 10/29)

(4-2) 해석

(4-3) [판단]
→ 투자 축소(17.8 → 16조)로 현금 여력은 생겼지만 BD 추가 출자·관세 부담이 우선순위. 주주환원은 하방 지지(배당수익률 3%대)이지 상승 촉매는 아니다 `[판단]`

④ 낙관 vs 보수

→ 낙관(미래에셋 65만): 2027F 지배순이익 8.9조에 **애플카 기대 구간 고점 PER 14배**를 주고 BD 지분가치 25.6조를 더했다. 본업 125.3조 + BD 25.6조 − 우선주 19.0조 = 보통주 131.9조. 즉 낙관의 근거는 이익이 아니라 **멀티플과 로봇 옵션**
→ 보수(IBK 46만, 키움·DB 50만): 원문 미확보 — TP 하향폭(-31%·-17%)만 확인 (아시아경제 11/02)
→ 셀사이드 vs 주가: 다수 매수 유지인데 주가는 10월 한 달 약 -20%, 11/13 종가 269,500원은 미래에셋 TP 대비 상승여력 +141%. 2026-06 ATH 783,000원 대비 -66% — 바이사이드는 "로봇 옵션"을 이미 대부분 지웠다 `[판단]`

## 3. 내러티브 점검

① 성장 스토리 정의
→ "관세·환율을 버티는 글로벌 3위권 완성차 + **보스턴다이내믹스 아틀라스를 2028년 자사 공장에 대량 투입하는 휴머노이드 완성체 회사**" — 2026 상반기 주가(+164%)는 후자를 샀다

② 이번 분기가 스토리에 준 영향
→ 본업: 영업이익 beat이지만 가이던스 하향·물량 -11% → **약화**
→ 로봇: 새 숫자 없음. IPO 기대 소멸 + Section 232 조사 + BD 가치 하향 → **약화** (훼손은 아님 — 2028 양산 계획 자체는 변경 공시 없음)

③ 국면 판단
→ 델타 유지(표면 OP YoY 플러스 전환이나 관세 기저 제외 시 감익, OPM 5%대 정체) + 내러티브 약화(TP 11/18 하향, BD 가치 할인) → **매매 제외 구간**
→ 로봇 섹터 관점에서 현대차는 "완성체 옵션"이지 숫자로 델타를 보여주는 종목이 아니다. 델타를 보여줄 숫자(로봇 매출)는 2028년 전에는 연결에 잡히지 않는다 `[판단]`

④ 트리거와 리스크
→ 트리거: ① BD 외부 고객 수주·IPO 재추진 ② 미국 로봇 공장 착공·투자 확정 공시 ③ 4Q26 OPM 6%+ 회복과 2027 가이던스 OPM 6%대 제시
→ 리스크: ① Section 232 로봇·산업기계 관세 ② 원화 강세(3Q 환율 효과 +1.28조 역전) ③ 1Q27부터 관세 기저 소멸로 YoY 재악화
