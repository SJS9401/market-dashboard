# 삼성전자 3Q26 실적 리뷰 — 숫자는 한 단계 더 올라섰고, 시장은 자사주를 기다렸다

## 0. 한 줄 판정

> 성장 델타: **둔화 (영업이익 YoY 정점 2Q26 통과, 단 4Q26 QoQ 재가속 예상)** | 내러티브: **강화** → **메모리 3사 중 델타 수명이 가장 긴 종목 — 주가는 주주환원 '타이밍' 실망으로 눌린 '경계 속 선별 구간'** [판단]

→ 숫자: 매출 195.3조원(+127% YoY), 영업이익 107.4조원(+783% YoY), OPM 55.0%. 글로벌 테크 최초 분기 영업이익 100조원. 영업이익 YoY는 1,812%(2Q26, 2Q25 기저 4.7조원) → 783%로 축소 = 둔화
→ 다만 QoQ는 +56% → +20% → 4Q26E 약 +24%로 **4Q에 다시 빨라진다** (DRAM 출하 가이던스 10% 중후반). SK하이닉스(4Q26E +23% 후 1Q27E +3%)·마이크론(4Q26G +14%)보다 델타가 길게 유지 [판단]
→ 쟁점 ①: HBM4 경쟁력 회복 — HBM 내 HBM4 비중 60%, HBM4 매출 3배 이상, 점유율 40%(KB). 2027 HBM 물량은 목표 가격에 완판
→ 쟁점 ②: 주주환원 — 잔여 재원 55~75조원은 확인됐지만 즉각적 자사주 발표 없이 "2027년 1월 말 이사회"로 미룸 → 발표일 주가 −4.1% (24.2만원 → 23.2만원)
→ 다음 분기 관건: 4Q26 영업이익 130조원대(중간값 132.8조원) 달성, 1Q27 모바일 DRAM 가격 인상, 1월 말 차기 주주환원 정책 규모

→ 1Q24~3Q24 영업이익 YoY 델타는 2023년 저기저(분기 0.6~2.4조원)로 n.m.

서프라이즈: 영업이익은 10월 초 잠정실적으로 이미 공개 — 확정치 107.4조원은 FnGuide 컨센 106.0조원 대비 **+1.4%**, 매출 195.3조원은 컨센 200.3조원 대비 **−2.5%** (유안타·메리츠 인용). 세전이익은 금융손익 −9.5조원(환율)으로 컨센 대비 −11%. 서프라이즈의 무게는 3Q가 아니라 **4Q 가이던스**에 있었다 — 4Q26 영업이익 중간값 132.8조원은 1M 컨센 116.0조원(유안타)·116.8조원(다올) 대비 **+14%**

(1) YoY 위치
→ 영업이익 YoY는 2Q26 +1,812%가 정점. 단 2Q25 영업이익이 4.68조원(재고평가손 등으로 이례적 저점)이었던 기저 왜곡이 크다
→ 매출 YoY는 2Q26 +130% → 3Q26 +127%로 거의 횡보, 4Q26E +138%로 오히려 한 번 더 확대 → 매출 기준으로는 아직 정점이 오지 않았다
→ 컨센 경로상 영업이익 YoY는 4Q26E +562% → 1Q27E +145%로 수렴

(2) 기저효과 조정 — QoQ로 다시 보기
→ 영업이익 QoQ: +185%(1Q26) → +56%(2Q26) → **+20%(3Q26)** → **약 +24%(4Q26E)** → 약 +6%(1Q27E)
→ 분기 증가액: +37.2조원 → +32.3조원 → +17.9조원 → **약 +25.4조원** → 약 +7.6조원
→ 3Q26은 DRAM 출하가 +3%에 그쳐 가이던스를 하회(하나: "공정 선단화 과정에서 출하량이 예상보다 적었다")한 일시 감속. 4Q는 출하 만회로 QoQ가 재가속 → **판정은 '둔화'지만 4Q 실적이 중간값을 넘으면 '유지'로 상향 가능** [판단]

(3) 해석 — 누가 델타를 끌고 누가 꺾이나
→ **메모리가 전사 이익의 100% 이상.** 메모리 영업이익 약 108조원 > 전사 107.4조원 — 비메모리·DX 합산이 마이너스. 삼성전자는 이제 "세트가 붙은 메모리 회사"다 [판단]
→ **이익 개선의 대부분은 범용 DRAM 가격.** HBM은 DRAM 매출의 10% 미만이어서(유안타) HBM4 3배 성장이 전사 숫자를 움직이진 못했다. HBM 회복은 2027 이익의 '질'에, 범용 가격은 2026 이익의 '양'에 기여
→ **꺾이는 곳 = DX.** MX 영업이익 3.6조원(3Q25) → −0.6조원, 메모리 원가 상승이 세트 마진을 잠식(키움: 4Q DX 적자 확대 예상). 메모리 호황이 세트 사업에는 역풍 — 사업 포트폴리오 내 자연 헤지가 이번 사이클엔 오히려 상쇄 요인
→ Foundry는 가동률 상승(8나노 이하 Full capa, DS투자)과 HBM4 베이스 다이 수요로 적자 축소 중이나, 성과급 비용으로 3Q 적자 지속

→ 발표일 주가 −4.1%(10/28 24.2만원 → 10/29 23.2만원, DS투자·KB 기준가)는 숫자가 아니라 **자사주 '지금 안 함'에 대한 반응**이다. DS투자는 전일 시장 반등의 기저와 Google 실적 실망을 함께 들었다. 같은 주 SK하이닉스가 100조원 환원·분기별 자사주로 발표일 +10.9% 반등한 것과 정반대 — 메모리 2사의 주가 차이는 실적이 아니라 환원 실행 속도에서 났다 [판단]
→ 1월 말 이사회가 이 쟁점의 결론. 보통주보다 우선주 중심 매입이면 보통주 주가에 대한 직접 효과는 제한적일 수 있다

(4) 쟁점 4 — 2027~28 사이클과 CapEx

(4-1) 회사 설명
→ 2027 공급 부족 "올해 대비 오히려 심화". 장기계약 기반 안정적 판매 기반 구축 (IR p.7)
→ 컨콜(유안타·한화·메리츠 정리): 10개 대형 고객과 LTA 체결 완료, 10개 고객 추가 협상 중. 메모리 LTA 매출 비중 60~70% 가이던스 차질 없이 진행. 2027 CapEx 증가하나 상당 부분이 신규 공간 확보와 장비 가격 상승 — Bit 증가 효과 제한적

(4-3) 공통 결론 vs 갈리는 지점
→ 공통: 2027년 공급 부족 지속, LTA로 이익 하방 상승
→ 갈림: 2028년. SK하이닉스와 동일하게 BNK·키움 vs 다수. 삼성전자 고유 변수는 **DX 적자 확대**(메모리 원가 상승이 세트 마진 잠식)와 **파운드리 CapEx 부담**

(4-4) [판단]
→ BNK의 "고객이 성능은 유지하되 용량을 낮춘다"는 관찰은 SK하이닉스 컨콜의 HBM 적층 단수 하향(de-spec)과 같은 현상을 수요 측에서 본 것. 공급사들은 이를 "더 많은 시스템을 만들기 위한 선택"으로, BNK는 "메모리 원가 한계 도달"로 해석한다. 1Q27 모바일 DRAM 가격 인상 수용 여부가 어느 해석이 맞는지를 가장 먼저 보여줄 데이터 [판단]

## 3. 내러티브 점검

① 성장 스토리 정의
→ "범용 DRAM 최대 캐파 보유자가 AI발 메모리 공급 부족의 가장 큰 수혜를 받고, 뒤처졌던 HBM에서 경쟁력을 회복해 **2027년 메모리 1위 이익**을 되찾는다. 넘치는 현금은 대규모 주주환원으로 돌아온다"

② 이번 분기 평가 — **강화**
→ HBM: 지난 1년간 가장 큰 약점이던 HBM4 경쟁력이 점유율 40%·HBM4 비중 60%·2027 완판으로 숫자로 확인
→ 이익: 4Q26 중간값 132.8조원(컨센 +14%), 2027 +10% 상향
→ 환원: 규모(잔여 55~75조원)와 방향(2027 정책 강화, 우선주 매입)은 확인 — **실행 시점만 1월로 이연**
→ 약점: DX 적자 확대(MX 3Q25 3.6조원 → −0.6조원), 파운드리 적자 지속. 비메모리가 스토리를 깎는 구조는 그대로

③ 국면 — 델타 둔화 × 내러티브 강화
→ 메모리 3사를 나란히 놓으면 마이크론(2Q26 정점, 4Q 가이던스 QoQ +14%) → SK하이닉스(3Q26 정점, 1Q27E QoQ +3%) → **삼성전자(YoY는 2Q26 정점이지만 4Q26E QoQ +24%로 재가속)**. 출하 여력이 가장 큰 삼성전자의 델타가 가장 늦게 꺾인다 [판단]
→ 비유하면 3명이 같은 오르막을 오르는데 삼성전자는 3Q에 신발 끈(선단 공정 전환)을 묶느라 잠시 느려졌고 4Q에 다시 속도를 낸다. 다만 오르막 자체(메모리 가격 상승률)가 완만해지고 있다는 점은 셋 모두 같다
→ BT 프레임: 둔화 + 강화 = 경계 구간이지만, 메모리 3사 중에서는 **델타 잔여 기간이 가장 길고, 1월 환원이라는 날짜가 정해진 촉매가 있는 종목** [판단]

④ 다시 강해질 트리거
→ 연말 자사주 선집행(메리츠 예상) 또는 1월 말 대규모 환원(KB: 75조원)
→ 4Q26 영업이익 135조원 이상 + 1Q27 모바일 DRAM 가격 +30% 이상 확인
→ NVIDIA Rubin향 HBM4 점유율 1위 시그널, 2나노 대형 고객 공개

⑤ 깨뜨릴 리스크
→ 1월 환원이 우선주 중심·기대 이하 규모 → "기다림의 비용"이 실망으로 확정
→ 1Q27 모바일 DRAM 가격 인상 거부·세트 수요 감소 → 범용 가격 탄력 둔화(키움 시나리오)
→ 중국 메모리 증설·YMTC 상장, AI 기업 신용위험 재부각(BNK)
