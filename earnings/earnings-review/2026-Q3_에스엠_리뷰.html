# 에스엠 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 꺾임 | 내러티브: 유지 → 매매 제외 구간 (2027년 재가속 대기 — 영업이익 YoY +18.4% → +11.1% → **−30.3%**로 2개 분기 연속 둔화 끝에 마이너스 전환. 셀사이드는 2027년 'Full Cycle' 증익(+14\~38%)을 유지해 TP는 대부분 유지)

> ⚠ 비영업 요인 플래그: 1Q26 영업이익 YoY +18.4%에는 디어유 연결 편입 효과(1Q25 미연결) 포함 — 별도(본사) 영업이익은 이미 1Q26 −6%, 2Q26 −5%, 3Q26 −29%로 3개 분기 연속 감익 (신한 분해) → 꺾임은 편입 효과가 빠지면서 드러난 본업 둔화. 3Q26 순손실(−28억)은 외화평가손실·디어유 영업외 비용으로 영업이익 판정과 무관. 확정치(매출 2,880억·영업이익 336억)가 IR 잠정치(2,911억·355억)보다 각각 −31억·−19억 낮다 — 차이 원인 미공시

→ 숫자: 매출액 2,880억 (−10.4% YoY, −17.6% QoQ), 영업이익 336억 (−30.3% YoY, OPM 11.7%) [확정]. 매출 YoY 20.6%(1Q26) → 15.4% → **−10.4%**, 영업이익 YoY 18.4% → 11.1% → **−30.3%**
→ 컨센 대비: 증권사가 쓴 컨센이 369억(하나·상상인·삼성 "부합")\~398억(KB·Bloomberg, "−10.7% 하회")으로 갈린다. 확정치 336억 기준으로는 컨센 369억 대비 **−8.9%** [계산]
→ 쟁점 ①: **본사 활동 공백** — 신보 판매량 550만 장(3Q25) → 167만 장, 공연은 팬미팅·팬콘 위주 소규모 회차로 별도 매출 −22.8%. 증권사 전원 "예상된 감익, 2027년 정상화"
→ 쟁점 ②: **2027년 증익 폭** — 2027E 영업이익 1,925억(하나)\~2,306억(키움, +38%)으로 갈림. 변수는 NCT WISH·RIIZE 투어 체급, SMTR25 데뷔(1Q27\~1H27), 에스파 유럽 투어
→ 다음 분기 관건: 4Q26 영업이익 컨센 평균 약 448억(증권사 7곳, 397\~501억) = YoY −18% [계산] — 4Q에도 YoY 마이너스가 확실해 델타 반전은 **1Q27(기저 386억)**이 첫 시험대

(1-3) 공통 결론 vs 갈리는 지점: 전원 "아티스트 활동 공백에 따른 일시적 감익"에 동의. 갈리는 변수는 **본사 수익성의 구조적 요인** — 하나만 엔저(일본)와 북미 확장 한계를 구조적 요인으로 짚었다
(1-4) [판단] 본사 영업이익이 이미 1Q26부터 YoY 감익이었다는 점(신한 분해)은 '3분기만의 공백'보다 넓은 둔화다. 다만 4Q26 NCT WISH·NCT DREAM 컴백, 1Q27 대형 투어 일정이 확정돼 있어 **2027년 1H 본사 OPM이 18%대로 돌아오는지**가 일시/구조를 가를 숫자

(2) **컨센 부합 vs 하회**

(2-1) 같은 잠정치 355억에 대해: 하나·상상인 "컨센 369억 부합", 삼성 "부합", 신한 "컨센 383억 대비 −7.3%", KB "Bloomberg 컨센 398억 대비 −10.7% 하회"

(3) **MD/라이선싱 — 상시 수익원**

(3-1) 회사 설명: 팝업스토어(NCT 127 BLINGY 팝업), EXO 캐릭터 'EXO-MUNGCHIZ' 굿즈, 콘서트·팬미팅 MD, aespa×PUBG 협업 라이선싱으로 MD/라이선싱 621억(+23.5%) (IR)

(5-3) [판단] 2027E P/E 10.5배(키움)\~13배(신한)로 역사적 하단이라는 데 이견이 없지만, 모멘텀 관점에서 밸류에이션은 델타가 돌아선 뒤의 이야기

## 3. 내러티브 점검

→ 성장 스토리: **SM 3.0 이후 멀티 레이블·IP 다변화로 특정 아티스트 의존 없이 이익을 키우는 '실적 가시성' + MD/라이선싱 업계 최고 수익화 역량** — 시장이 에스엠을 사는 이유는 분산된 포트폴리오의 안정 증익
→ 이번 분기: 분산 포트폴리오도 활동 사이클이 한쪽으로 몰리면 본사 이익이 −29% 꺾인다는 게 확인됐다. 다만 셀사이드는 2027년 'Full Cycle' 증익 스토리를 그대로 유지(TP 대부분 유지) → 스토리는 유지, 델타는 꺾임 → **델타 꺾임 + 내러티브 유지 → 매매 제외 구간 (2027년 1H 재가속 확인 대기)**
→ 다시 강하게 만들 트리거: 1Q27 영업이익 YoY 플러스 복귀(NCT WISH 투어 17회·aespa 유럽 9회) / SMTR25 데뷔 초동 흥행 / RIIZE·NCT WISH 월드투어 규모 발표
→ 깨뜨릴 리스크: 1Q27에도 본사 감익 지속(앨범 판매 회복 실패) / 엔저 장기화로 일본 수익성 훼손 / 히트 분산(A2O LITE 등)으로 신인 SMTR25 초기 흥행 부진
