# SK온 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 꺾임 | 내러티브: 약화 → 매매 제외 구간 (2Q 일회성 흑자 소멸·매출 YoY -23%로 역성장 전환, ESS 반전은 2027 공급 개시 이후)

→ 숫자: 매출 1조5,263억 (YoY -23.0%, QoQ -48.2%), 영업손실 -805억 (OPM -5.3%). 매출 YoY가 2Q26 +23.7% → 3Q26 **-23.0%** (델타 -46.7%p). 영업손익은 전년 -1,248억 대비 +443억 개선이지만, 2Q26 +8,218억(고객보상금·AMPC 포함)에서 다시 적자 (SK이노 IR 3Q26 p.6)
→ 쟁점 ①: 2Q26 흑자는 일회성이었다 — 2Q26 기타영업수익(AMPC+고객보상금+파생이익) 약 1.14조(⚠️계산)를 빼면 -3,217억. 회사는 "일회성 제외 본원적 수익성 개선 흐름"이라고 했지만 AMPC 미공시로 검증 불가
→ 쟁점 ②: EV 판매량 감소 — 비중국 시장 1~9월 사용량 -17.9%, 북미 -46.7%, 점유율 10.0% → 6.6% (SNE). 3Q26 K-배터리 3사 중 유일한 적자 (LGES +7,560억, 삼성SDI +4,078억)
→ 쟁점 ③: ESS 수주는 붙기 시작 — NeoVolta 9GWh(2027~2031), 국내 중앙계약 284MW, Flatiron 1GWh. 2026 목표 20GWh 대비 약 절반, 매출 기여는 2027부터
→ 다음 분기 관건: 4Q26에 회사가 말한 "주요 고객 물량 증가로 일부 판매 회복"이 매출 YoY 플러스(4Q25 1.559조 초과)로 나오는지, 그리고 AMPC를 다시 공시하는지

→ **위치**: 매출 YoY는 2Q25 +43.0%를 정점으로 3Q25 +32.8% → 4Q25 -7.2% → 1Q26 +5.3% → 2Q26 +23.7%(고객보상금 포함 매출 효과) → 3Q26 **-23.0%**. 2Q26의 회복은 일회성 기타영업수익이 끌어올린 것이라 **추세 반등이 아니었다** [판단]. 4Q25(1.559조)가 낮은 기저라 4Q26 YoY는 플러스 가능성이 있지만, 이는 기저효과다 [전망]
→ **영업이익**: 12개 분기 중 흑자는 3Q24(+240억)·2Q26(+8,218억) 2번, 둘 다 AMPC·보상금 영향. AMPC 제외 기준으로는 **12개 분기 연속 적자**(공시 범위 내)

→ 갈림: 회사는 '본원 수익성 개선'을 주장하지만, 기타영업수익 제외 기준 2Q26 -3,217억은 전년 2Q25 -3,398억과 거의 같다 — 개선 폭은 YoY로 보면 미미

(4) **[판단]** 3Q26 AMPC가 1Q26 수준(약 800억)이라면 AMPC 제외 영업이익은 약 -1,600억 안팎(⚠️추정)으로 전년 3Q25 -2,979억보다 좋아진 셈이 된다 — BOSK 종료로 연 5,000억(감가상각 3,000억+이자 2,000억, 이자는 영업외) 고정비가 빠진 효과와 방향은 맞다. 반대로 3Q26 AMPC가 2,000억 이상이었다면 본원 개선은 없다. **SK이노 3Q26 분기보고서의 기타영업수익(9M 누적)이 결론을 가른다**

② **EV 판매량 감소 — 4Q 회복 여부**

(1) 회사 설명
→ "판매량 감소 영향으로 매출 및 손익은 전분기 대비 하락" / 4Q26 "주요 고객사 물량 증가에 따라 일부 판매 회복 기대" (SK이노 IR 3Q26 p.7)
→ 1Q26 "북미 판매량 소폭 증가, 유럽/아시아 물량 일부 회복" → 2Q26 "아시아 지역 판매량 확대" → 3Q26 "판매량 감소" (IR 1Q26~3Q26 Look-back)

(2) 외부 데이터

| 지표 | 값 | 출처 |
|---|---|---|
| 글로벌 EV 사용량 1H26 | 19.0GWh, -6.7% YoY, 점유율 4.0% → 3.1%, 8위 | SNE (디지털데일리 2026-08-05) |
| 비중국 1~9월 | 28.2GWh, -17.9%, 점유율 10.0% → 6.6% | SNE (더팩트 2026-11-04) |
| 지역 | 북미 -46.7%, 유럽 -2.2% | 같은 자료 |
| 가동률 (DART, 연결법인) | 2025 48.7% → 1H26 **36.4%** | SK이노 반기보고서 |

(3) 공통 vs 갈림
→ 공통: 북미 30D 보조금 폐지(2025.09.30) 이후 포드·현대차·VW의 북미 EV 생산 조정이 직격. 한국 3사 중 북미 EV 의존도가 가장 높은 구조
→ 갈림: HSBMA(현대차 JV, 2026.06 양산)·테네시 단독 공장이 물량을 늘릴지 vs 북미 EV 수요 자체가 정체할지

(4) **[판단]** 4Q26 매출이 4Q25(1.559조)를 넘으면 YoY는 플러스로 돌아서지만 기저효과다. 판단 기준은 **QoQ 회복 폭**(3Q26 1.526조 대비)과 HSBMA 가동률이다

③ **ESS — EV 공백을 언제 메우나**

(1) 회사 설명
→ "ESS는 당사의 핵심 성장축" — 김영광 실장 / NeoVolta 9GWh LFP 셀(2027년부터 5년), 국내 소재사 LFP 양극재 공급 계약(엘앤에프·포스코퓨처엠) / 신규 공장 없이 한국·북미 EV 라인 단계적 ESS 전환, 추가 투자는 수주 규모에 연동 (지디넷·비즈워치 2026-10-29)
→ "기존 중국산 셀 사용 업체들로부터 제품 사양과 공급 가능 물량, 가격 조건, 장기계약 가능 여부 등에 대한 문의가 늘고 있다… 다만 실제 계약으로 이어지려면 가격 경쟁력과 현지 조달 요건, 인증 및 납기 등을 충족해야 한다" (비즈워치 2026-10-29)
→ 북미 ESS 시장 2026 80~100GWh, 2030년까지 2배 이상 (뉴스토마토 2026-10-29) / 2026 수주 목표 20GWh (2Q26 컨콜)

(2) 수주 집계

| 시점 | 고객 | 물량 | 공급 |
|---|---|---|---|
| 2025.09 | Flatiron Energy (미국) | 1GWh 확정 + 6.2GWh 우선협상 | 2026~, 조지아 라인 전환 |
| 2026.02 | 국내 중앙계약시장 2차 | 284MW (565MW 중 50.3%) | 2027말 |
| 2026.02 | 장주기 ESS (국내) | 약 1.8GWh | 서산, 2027.3Q~ |
| 2026.08.27 | NeoVolta Power (미국) | **9GWh** (+ 추가 9GWh 연내 추진) | 2027~2031, 조지아 |

→ (출처: 헤럴드경제 2025-09-03, 디지털데일리 2026-07-30, 아이뉴스24 2026-09-01, SK이노 IR 1Q26 Highlights)

(3) 공통 vs 갈림
→ 공통: 미국 PFE(금지외국기업) 규제로 비중국 LFP 셀 수요가 생기고 있음. SK온은 확정 물량 기준 약 11GWh+ (Flatiron 확정 1 + NeoVolta 9 + 국내 약 1.8, MW 건 제외)
→ 갈림: LGES(ESS 매출 비중 30% 초반, 3Q26)·삼성SDI 대비 1~2년 늦은 진입 — 2027 매출 기여 규모와 LFP 파우치 원가 경쟁력은 미검증

(4) **[판단]** ESS는 2026년 실적 변수가 아니라 2027년 변수다. 3Q26 숫자에 ESS가 보이지 않는 건 예정대로다. 4Q26까지 20GWh 목표의 나머지 약 9GWh(NeoVolta 2차 등)가 채워지는지가 내러티브 쪽 체크포인트

④ **재무구조 — BOSK 종료 효과와 SK온 가치**

(1) 회사·공시
→ BOSK 종료로 테네시 단독, 켄터키 → 포드. 연 고정비 감가상각 약 3,000억·이자 약 2,000억 절감 (2Q26 컨콜, 디지털데일리 2026-07-30). 차입금 약 5.38조 포드 이전, 부채비율 242% → 212% (한경비즈니스 2026-08-26)
→ 1Q26 2차전지 유형자산 손상 약 4.7조 반영, 총차입금 21.59조·순차입금 16.93조 (IB토마토 2026-07-06)
→ SK이노 반기보고서: SK온 PRS 공정가치 '주당 기초자산 가치' 2025말 **45,014원 → 2026.06말 28,591원**, PRS 파생부채 5,814억 → **1.62조**

(2) 공통 vs 갈림
→ 공통: JV 종료로 고정비·차입 부담은 줄었다 (구조조정 효과)
→ 갈림: 테네시 45GWh(2028 상업가동 계획)를 EV로 쓸지 ESS로 전환할지 미정 — 고객 확보 전까지는 유휴 자산

(3) **[판단]** SK온 가치 하락은 SK이노 손익(PRS 평가손)으로 바로 넘어온다. 상장 대리변수인 SK이노베이션은 3Q26 정유·윤활기유 호황으로 영업이익 3.70조(역대 최대)를 냈지만, SK온 주당가치 지표가 연말에 추가 하락하면 4Q 영업외 손실 요인이 된다

2-3. 낙관 vs 보수 (셀사이드 부재 — 회사 vs 외부 데이터)
→ 낙관(회사): 고정비 효율화로 본원 수익성 개선 중, 4Q 고객 물량 회복, ESS 문의 급증 → 2027 ESS 매출
→ 보수(외부 데이터): SNE 점유율 하락(비중국 6.6%), 가동률 36%, AMPC 미공시로 검증 불가, PRS 주당가치 반기 -36.5%
→ 차이의 핵심 가정: **AMPC 제외 손익이 실제로 개선되고 있는지** — 회사는 개선을 말하고, 외부는 확인할 숫자가 없다

2-4. 추정치·TP 변화 — [해당 없음: 비상장, 셀사이드 SK온 단독 추정 미입수]. SK이노베이션 리포트의 SK온 가치 평가(SOTP) 변화는 BT 첨부 시 보완

## 3. 내러티브 점검

→ **성장 스토리 정의**: "비중국 하이니켈 파우치 셀로 북미 JV(포드·현대차)를 통해 IRA 수혜를 받으며 규모의 흑자에 도달한다" — 2022~2023 FI 유치(연 7.5% 보장·2026 IPO 전제)의 근거였던 스토리

→ **이번 분기**: 약화. ① 포드 JV는 이미 해체(2026.05) — 북미 EV 볼륨 전제가 축소 ② 2Q 흑자가 일회성으로 확인 ③ 비중국 점유율 하락 지속. 다만 새 스토리 'ESS(LFP 파우치) + JV 정리 후 고정비 축소'가 형성 초기 — 숫자 확인은 2027

→ **국면**: 델타 꺾임(매출 역성장, 적자 복귀) + 내러티브 약화(EV 스토리 축소, ESS는 미실현) → **매매 제외 구간**. 비상장이라 직접 매매 대상은 아니며, SK이노베이션 매매 시 'SK온 리스크 할인' 유지 근거 [판단]

→ **스토리를 다시 강하게 만들 트리거**: ① AMPC 포함 4Q26 흑자 + AMPC 재공시 ② ESS 누적 수주 20GWh 달성(연내) ③ 테네시 공장 ESS 전환·고객 확정

→ **깨뜨릴 리스크**: ① 4Q26 판매 회복 실패(매출 1.5조 이하 지속) ② PRS 기초자산 가치 추가 하락(2026말 공정가치) ③ AMPC 요건 변경·고객 보상금 소멸 후 분기 적자 -3,000억대 고착
