# SK하이닉스 3Q26 실적 리뷰 — 마지막 가속, 그리고 반 토막 난 주가

## 0. 한 줄 판정

> 성장 델타: **가속 (단, 컨센 경로상 이번 분기가 YoY 정점)** | 내러티브: **강화** → **이익 가속의 마지막 분기 — 주가는 이미 델타 정점을 선반영해 고점 대비 −49%, 추세 매매보다 '추정치 상향 반등' 구간** [판단]

→ 숫자: 매출 104.6조원(+328% YoY), 영업이익 83.3조원(+632% YoY), OPM 79.7%. 영업이익 YoY가 557% → 632%로 한 번 더 확대(가속). 컨센(77.0조원) 대비 +8.3%
→ 다만 QoQ 증가율은 +96% → +61% → +38% → 4Q26E 약 +23%로 감속. 발표 후 증권사 추정 중간값 기준 영업이익 YoY는 4Q26 +434%, 1Q27 +179%로 **3Q26이 정점**
→ 쟁점 ①: DRAM ASP +28~29%(컨센 10% 중후반)와 4Q DRAM 출하 +20% 중반 가이던스 → 4Q26·2027 추정치 일제 상향(2027 영업이익 중간값 464조원, 발표 전 컨센 404조원 대비 +15%)
→ 쟁점 ②: "2029년까지 DRAM·HBM 사실상 완판", LTA 14개사·2027~28 Capa 50%+ 확보 vs BNK·키움의 2028 이익 감소 전망(BNK 2028 영업이익 −74%) — **2028년 시각 차가 셀사이드 내 최대 쟁점**
→ 다음 분기 관건: 4Q26 영업이익 100조원 돌파(중간값 102조원) 여부, 1Q27 모바일 DRAM 가격 인상 폭, 주가 반등이 추정치 상향을 따라오는지

서프라이즈: 매출 FnGuide 컨센 98.2조원 대비 **+6.5%**, 영업이익 77.0조원 대비 **+8.3%** (FnGuide, 메리츠·NH·하나 인용). 1M 기준 컨센 상단(매출 99.9조원, 영업이익 80.0조원) 대비로도 +4.7%, +4.1% (유안타). 순이익은 39.8조원으로 컨센 57.9조원 대비 **−31%** — 외환관련손실 11.6조원 + 투자자산(Kioxia 등) 평가손실 22.9조원, 영업 외 일회성

(1) YoY 위치
→ 영업이익 YoY는 2025년 하반기 바닥(+62%)에서 4분기 연속 확대, 3Q26 +632%로 사이클 최고치. 판정 기준상 **가속**
→ 그러나 가속 폭(영업이익 YoY 델타)은 +268%p → +152%p → +75%p로 이미 줄고 있었고, 증권사 추정 경로상 4Q26 +434%, 1Q27 +179%로 꺾임. **이번 분기가 "마지막 가속"** [판단]

(2) 기저효과 조정 — QoQ로 다시 보기
→ 영업이익 QoQ 증가율 +96%(1Q26) → +61%(2Q26) → +38%(3Q26) → 약 +23%(4Q26E) → 약 +3%(1Q27E)
→ 분기 증가액은 +18.4조원 → +22.9조원 → **+22.8조원** → 약 +19.1조원으로 아직 크게 줄지 않았다. 증가율은 감속하지만 "매 분기 20조원씩 더 버는" 속도는 4Q26까지 유지 [판단]
→ 마이크론(3Q26 FQ4 26)은 영업이익 YoY가 이미 2Q26에 정점을 지나 이번 분기 둔화로 판정했다. SK하이닉스는 한 분기 늦게 정점에 도달 — 상반기 판가·출하가 시장 평균을 하회했던 기저(메리츠) 때문

→ 갈림: "격차 축소"의 방향. 다수는 **HBM 마진이 올라와** 격차가 준다고 보지만, 범용 DRAM 마진(83%)이 이미 HBM보다 높아 생긴 격차라는 점에서 **범용 가격이 꺾이면 반대 방향으로 벌어질 수 있다** [판단]

(3-4) [판단]
→ 마이크론에서도 CMBU(HBM 포함) GPM 83% < 범용 사업부 90%로 같은 구조가 확인됐다. 이번 사이클의 이익은 HBM보다 **범용 DRAM 가격**이 더 많이 끌고 있다. HBM은 "수요 확실성", 범용은 "이익 레버리지"를 담당 — 2027 하반기 범용 가격이 사이클 판정의 핵심

(4) 쟁점 4 — 100조원 주주환원과 저PER 논쟁

(4-1) 회사 설명
→ "FY2026 약 100조원 주주환원: 현금배당 30조원 이상, 자사주 매입·소각 60조원 이상(8월 40조원 포함). 3분기 이사회 현금배당 14조원(주당 2만원 = 실적 1만원 + Kioxia 특별 1만원) 및 자사주 20조원(임직원 보상 약 10조원 포함) 결의" (IR p.13, 컨콜)

→ 공통: 환원 규모(시총 약 10%)는 기대 이상이며 주가 하방을 지지

→ 발표 당일 주가 134.1만원 → 148.7만원(**+10.9%**, 대신·각 사 기준가). 환원은 즉각 반등을 만들었다. 다만 PER 3배는 "이익이 지속되지 않는다"는 시장 가정이므로 환원만으로 해소되긴 어렵고, 쟁점 ②(2028)가 정리될 때 멀티플이 움직인다 [판단]

## 3. 내러티브 점검

① 성장 스토리 정의
→ "HBM 1위가 AI 메모리 수요를 독점적으로 흡수하고, 장기계약(LTA)으로 사이클 변동성을 줄여 **경기민감주에서 구조적 성장주로 재평가**된다" — 시장이 SK하이닉스를 사는 이유

② 이번 분기 평가 — **강화**
→ 숫자: 컨센 +8% 비트, 2026·2027 추정치 +8%·+15% 상향, 분기 OPM 80%
→ 구조: LTA 14개사·2027~28 Capa 50%+, 2029년 DRAM·HBM 완판, HBM4 수율·점유율 우려 해소, 100조원 환원 — 지난 분기 시장이 의심한 항목(NH: HBM 품질 논란, LTA, 환원 지속성)에 모두 숫자로 답했다
→ 그럼에도 재평가는 일어나지 않았다. 스토리의 앞 절반(AI 수요)은 강화됐지만, 뒤 절반(**사이클 변동성 축소 → 멀티플 확장**)은 시장이 아직 받아들이지 않았다

③ 국면 — 델타 가속(정점) × 내러티브 강화
→ 비유하면 마라톤에서 **지금이 가장 빠른 구간 기록**인데, 관중(시장)은 다음 구간부터 페이스가 떨어질 걸 알고 미리 자리를 뜬 상태. 영업이익 YoY는 이번 분기가 꼭대기, QoQ는 4Q26 +23% → 1Q27 +3%로 평탄화 [판단]
→ BT 프레임에서 "델타 가속 + 내러티브 강화"는 원래 적극 구간이지만, 컨센 경로상 다음 분기부터 둔화가 확정적이라 **신규 추세 매매 구간은 아님**. 대신 주가가 고점 대비 −49%로 델타 둔화를 선반영한 만큼, "추정치 상향(리비전) → 반등" 구간은 열려 있다 (메리츠: 향후 3개월 추정치 상향 기반 회복) [판단]

④ 다시 강해질 트리거
→ 2028 물량 LTA 추가·연장 체결 공시 — 2028 논쟁을 숫자로 종료
→ 1Q27 모바일 DRAM·2027 HBM 가격 인상 확인 → 1Q27 이후 QoQ 경로 상향(현 컨센 +3%)
→ 4Q26 실적과 함께 2027 자사주 매입 규모·분기 환원 지속 발표

⑤ 깨뜨릴 리스크
→ 중국 범용 DRAM 증설·가격 공세 → 2027 하반기 범용 가격 하락 (키움)
→ AI 기업 신용위험 재부각 → CSP·네오클라우드 CapEx 조정 (BNK)
→ HBM 사양 하향 확산으로 큐브 수 대비 비트 수요 둔화, 범용 가격 하락 시 HBM–범용 마진 역전 확대
