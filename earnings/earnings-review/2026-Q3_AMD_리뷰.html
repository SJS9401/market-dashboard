# AMD 3Q26 실적 리뷰 — 숫자는 잠시 숨을 골랐고, 가이던스는 다시 가속을 그렸다

## 0. 한 줄 판정

> 성장 델타: **둔화 (일시 — 조정 기준 영업이익 YoY 82% → 75%, 4Q 가이던스 +96%로 재가속)** | 내러티브: **강화** → **메모리와 달리 델타가 아직 위로 열려 있는 '가속 대기 구간' — 4Q 실적이 가이던스를 확인하면 적극 구간 재진입** [판단]

→ 숫자: 매출 $13.38B(+44.7% YoY), Non-GAAP 영업이익 $3.92B(+75.3% YoY), OPM 29.3%. 컨센 대비 매출 +2.3%, 영업이익 +6.7%. 2Q25 MI308 재고 비용(약 $0.8B)으로 부풀었던 2Q26 YoY(+245%)를 조정하면 82% → 75%로 소폭 둔화
→ 가이던스: 4Q26 매출 $17.0B(±3%, +66% YoY, 컨센 $16.2～16.3B), 가이던스 내재 영업이익 약 $5.6B(+96% YoY). **2027 매출 +80% 이상, 서버 CPU 약 2배(직전 +70%), 데이터센터 비중 80% 이상**
→ 쟁점: ① 2027 +80%는 공급이 받쳐주나 ② AI GPU 믹스·HBM 원가로 GPM 55%가 지켜지나(Citi 2027 EPS −11%) ③ FCF $0.55B(−64%)·재고 +$3B는 선투자인가 ④ PC·게이밍 급감을 데이터센터가 메우나
→ 주가: 11/3 $483.9 → 11/5 $404.4. 발표 다음날(11/4)은 약 +1%였고, 11/5 −17%는 S&P 500 −4.4%·반도체 동반 급락일(웹서치, Trefis) — 실적보다 매크로
→ 다음 분기 관건: 4Q 데이터센터 +50% QoQ·AI GPU > 서버 CPU 달성, GPM 55% 유지, 1Q27 비수기에도 QoQ 성장

서프라이즈: 매출 컨센 $13.08B 대비 **+2.3%**, 영업이익 $3.68B 대비 **+6.7%**, EPS $2.09 vs $1.97 **+6.1%** (FactSet·LSEG — 신한·삼성·NH). 4Q 가이던스 매출은 컨센 $16.2～16.3B 대비 **+4～5%**, 내재 영업이익은 컨센 대비 **+10.4%**(하나), EPS $2.92 vs $2.68 **+9%**(Citi)

(1) YoY 위치
→ 매출 YoY는 2Q26 +50%에서 3Q26 +45%로 한 번 쉬었다가 4Q26 가이던스 +66%로 **사상 최고 성장률**을 다시 쓴다. 영업이익 YoY(조정)도 82% → 75% → 96%
→ 컨센 경로상 정점은 아직 보이지 않는다. 회사 2027 가이던스(매출 +80% 이상)가 맞다면 2027년 분기 매출 YoY는 대부분 +60～100% 구간 [전망]

(2) QoQ로 다시 보기
→ 영업이익 QoQ: −11%(1Q26) → +22%(2Q26) → +27%(3Q26) → 약 +43%(4Q26G). 분기 증가액 +$0.55B → +$0.83B → 약 +$1.68B로 **QoQ 기준으로는 오히려 가속 중**
→ 3Q26 YoY 둔화는 Client·Gaming 감소(C&G 매출 −8% YoY)가 만든 숫자이고, 데이터센터는 4개 분기 연속 성장률이 올라가고 있다(KB) [판단]

## 3. 내러티브 점검

① 성장 스토리 정의
→ "x86 서버 CPU 점유율을 계속 빼앗고, 에이전트 AI로 CPU 수요 자체가 커지는 가운데, Helios 랙으로 **엔비디아의 유일한 범용 GPU 대안**이 되어 데이터센터 매출이 매년 2배씩 커진다"

② 이번 분기 평가 — **강화**
→ 서버 CPU: 2027 성장 가이던스 +70% → 약 +100%, 클라우드·엔터프라이즈 CPU 이미 2배 성장 중
→ AI GPU: MI455X·Helios 매출 첫 인식, 4Q에 AI GPU가 서버 CPU를 추월, 고객 5곳(Anthropic·Meta·Microsoft·OpenAI·Oracle) 공개
→ 전사: 2027 매출 +80% 이상, 데이터센터 비중 80% 이상 — 1년 전(47%) 대비 회사 정체성이 바뀌었다
→ 균열 신호(훼손 아님): GPM 정체, FCF 급감, PC 붕괴, 워런트 희석

③ 국면 — 델타 일시 둔화 × 내러티브 강화
→ 메모리 3사가 "이익 레벨은 최고, 델타는 정점 통과"였다면 AMD는 반대다. 3Q 영업이익 YoY는 75%로 한 번 쉬었지만 4Q 가이던스 +96%, 2027 매출 +80%로 **델타가 아직 위로 열려 있다** [판단]
→ 비유하면 메모리는 정상을 지난 등산객, AMD는 중턱 쉼터에서 물 마시고 다시 오르기 시작한 등산객. 다만 AMD가 오르는 길(HBM)은 메모리가 가격을 올리고 있는 길이라 체력(마진) 소모가 크다
→ BT 프레임: 판정 기준상 이번 분기는 '둔화'지만, 4Q 실적이 가이던스대로 나오면 다음 리뷰는 '가속' — **적극 구간 재진입 대기** [판단]

④ 다시 강해질 트리거
→ 4Q 실적에서 데이터센터 +50% QoQ·AI GPU > 서버 CPU 확인 + 1Q27 가이던스가 계절성에도 QoQ 성장
→ Helios 신규 고객(5곳 외) 또는 GW 단위 추가 계약 발표
→ MI500(2027) 일정·HBM4E 공급 확정

⑤ 깨뜨릴 리스크
→ HBM 배정 부족으로 2027 Helios 출하 지연 — 쟁점 1·2가 동시에 터지는 시나리오
→ 고객 데이터센터 전력·부지 지연 → 재고 $3B+ 부담으로 전환
→ AI 규제·AI 기업 신용위험 등 매크로로 하이퍼스케일러 CapEx 조정
