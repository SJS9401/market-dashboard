# Symbotic 3Q26 (FQ4 26) 실적 리뷰 — GAAP 영업이익 $54.7M(OPM 7.0%, 전년 -$11.6M), 매출 $777.6M(+25.7%) 재가속. Walmart EMAA로 수주잔고 최대 +$6.9B 예고, FQ1 27 매출 가이던스 +28\~31%

> 성장 델타: 가속 | 내러티브: 강화 → 델타 가속(흑자 확대 · 영업이익 YoY 개선액 +$58.7M → +$66.3M, 매출 YoY +21.7% → +25.7%) + 내러티브 강화(Walmart 신규 약정 $6B, 다음 분기 매출 가속 가이던스) → 적극 구간 (단, 단일 고객 86.7%·Systems 마진 정체는 확인 변수)

> ⚠ 비영업 요인 플래그: 판정을 만든 주된 원인은 아님 — YoY 개선 +$66.3M 중 매출총이익 +$46.3M(70%), R&D 감소 +$18.2M(27%, 엔지니어의 고객 프로젝트 배치·2025 구조조정 절감 — 영업 내 요인). 구조조정비는 양쪽 분기에 있어(3Q26 $5.4M, 3Q25 $6.5M) 빼고 보면 개선액 +$42.3M(2Q26) → **+$65.2M**(3Q26)로 가속 폭이 더 크다. 소규모 인수 2건(Fox Robotics·ARMS)은 매출 기여 미공시 — 분리 불가

→ **판정 방식 (전년 적자 구간)**: 3Q25 -$11.6M → 3Q26 +$54.7M이라 YoY %는 n/m. 규칙대로 **영업이익 YoY 증감액**으로 판정 — 2Q26 +$58.7M → 3Q26 **+$66.3M**(+$7.6M 확대). 매출 YoY도 +21.7% → +25.7%(+4.0%p)로 같은 방향 → **가속** (OPM YoY 변화는 +9.0%p → +8.9%p로 보합)
→ **숫자**: 매출 $777.6M(+25.7% YoY, +7.9% QoQ), GAAP 영업이익 $54.7M(OPM 7.0%, 사상 최고), 매출총이익률 22.6%(+1.7%p YoY), 순이익 $55.0M(지배주주 $11.3M, EPS $0.09). 참고 — 조정 EBITDA $113.9M(+130%, 가이던스 $100\~105M 상단 초과). FY26 연간 첫 GAAP 영업흑자 $100.2M
→ **쟁점**: (1) 이익 개선의 질 — Systems 마진은 21.4%로 오히려 하락, 개선은 운영서비스 흑자 전환과 R&D 감소 (2) Walmart EMAA $6B와 수주잔고 — RPO는 $22.3B로 아직 감소, 반영은 FQ1 27 (3) 단일 고객 집중 86.7%와 매출채권 구조 변화 (4) 매출 가속의 지속성 — 배치 시스템 84개, FY27 인식 16%
→ **다음 분기 관건**: 4Q26(FQ1 27) GAAP 영업이익 **$72.8M 이상**(개선액 +$66.3M 유지)이면 가속 지속. 가이던스 매출 $805\~825M(+27.8\~31.0%) · 조정 EBITDA $110\~120M — EBITDA 가이던스를 3Q26 차이($59M)로 역산하면 GAAP 영업이익 약 $51\~61M → **둔화 경로** [추정]

→ **서프라이즈 (가이던스 대비 — 컨센 미확보)**: 매출 $777.6M = 가이던스 $760\~780M 상단(중간값 대비 +1.0%), 조정 EBITDA $113.9M = 가이던스 $100\~105M 상단 대비 +8.5%
→ **YoY 위치**: 매출 YoY는 3Q25 +9.5%(저점, 직전 4Q 14주 기저) → 4Q25 +29.4% → 1Q26\~2Q26 +23.1%·+21.7%로 둔화 → **3Q26 +25.7% 재가속** → 가이던스 4Q26 +27.8\~31.0%로 한 번 더 가속. 회사 경로상 매출 YoY 정점은 아직 오지 않았다 [전망]
→ **이익 위치**: OPM -4.4%(2Q25) → 1.0% → 0.9% → 4.6% → **7.0%**. 개선액은 +$26.6M(1Q26) → +$58.7M → +$66.3M. 4Q25 기저가 +$6.5M(흑자)이라 **4Q26부터 영업이익 YoY %가 계산 가능**해진다 — 판정선은 개선액 +$66.3M 유지 = 영업이익 $72.8M

③ 쟁점별 분해

(1) **이익 개선의 질 — Systems 마진 정체, 개선은 운영서비스·R&D에서**

→ "*Systems gross profit increased ... primarily driven by 84 Systems in Deployment during the fiscal year ended September 26, 2026, as compared to 50 Systems in Deployment ..., our capture of the increased value we are driving for customers, and profit mix.*" (10-K MD&A, 연간)

→ "Systems 매출총이익 증가는 주로 **배치 중 시스템 84개(전년 50개)**, 고객 가치 증가분 확보, 수익 믹스 때문"

→ 시사점: 연간으로는 Systems GPM **19.7% → 21.5%** 개선 → 그러나 분기로는 3Q26 **21.4%**로 YoY·QoQ 모두 하락 → 분기 개선은 **운영서비스 흑자 전환(+$14.2M)·R&D 감소(+$18.2M)**가 만든 몫이 크다

→ 운영서비스 개선 설명: "*achieving operational scale at certain customer sites ..., certain loss contracts from the prior year which did not recur*" (10-K) — 전년 손실 계약 소멸은 **저기저 성격**(비영업은 아님)
→ R&D 감소 $18.2M 중 주식보상 -$7.4M, 조정 R&D -$12.3M. 같은 기간 매출원가 주식보상은 +$9.2M — 엔지니어를 고객 프로젝트로 돌리면 비용이 R&D에서 매출원가로 이동한다 [판단]
→ **[판단]** 영업 내 요인이라 가속 판정은 그대로지만, 다음 가속의 연료는 **Systems GPM 회복**(22% 이상)이어야 한다. R&D를 더 줄여 만드는 이익은 한계가 있다(분기 $37.7M, 매출의 4.9%)

(2) **Walmart EMAA — $6B 신규 약정, 잔고 반영은 FQ1 27**

→ "*Walmart made a new commitment to purchase our systems and fund certain development programs in an initial aggregate additional amount of approximately $6,000,000,000 ... We expect that the Initial Commitment could add up to $6.9 billion to our future backlog.*" (10-K)

→ "Walmart가 시스템 구매·개발 프로그램 자금으로 **약 $60억 신규 약정** — 향후 수주잔고에 **최대 $69억 추가** 가능"

→ 시사점: 잔고 $22.3B → 반영 시 **최대 $29.2B** [계산] → CFO "*first quarter of fiscal year 2027 highlighted by accelerating year-over-year revenue growth and significant backlog expansion*" → 다만 **FY27 인식 비중은 16%**($3.6B)로 잔고 증가가 바로 매출 가속이 되지는 않는다

→ 약정은 상호 서면 동의 없이 줄일 수 없다(10-K). 초기 약정에는 차세대 랙 기술 개발비 $125M(DPA)이 포함 — R&D 일부를 고객이 부담하는 구조 [판단]
→ **[판단]** 내러티브 "강화"의 핵심 근거. 확인 포인트는 FQ1 27 RPO가 $28B 이상으로 실제 올라가는지, 그리고 EMAA 배치가 FY27 몇 개 사이트로 시작되는지

(3) **단일 고객 집중 — Walmart 86.7%, 고객 B 등장**

→ "*Customer A 86.7 % 84.6 % 86.9 %*" (FY26·FY25·FY24 매출 비중) / 매출채권은 "*Customer A 54.5 % ... Customer B 25.5 %*" (10-K)

→ "고객 A(Walmart) 매출 비중 **86.7%**(전년 84.6%) — 매출채권은 고객 A 54.5%, **고객 B 25.5%**(전년 10% 미만)"

→ 시사점: 매출 집중은 오히려 심화 → 고객 B(매출 10% 미만이지만 채권 25.5%)가 새 대형 배치 고객으로 보임(Walmex·Exol·Medline 등 후보, 회사 미특정) [판단] → EMAA로 Walmart 비중은 더 올라갈 가능성

→ **[판단]** 집중은 리스크이자 내러티브의 원천(Walmart 전 물류망 표준). 해지 조항이 사실상 없는 계약 구조(10-K)라 단기 실적 리스크보다 **밸류에이션 할인 요인**이다

(4) **매출 가속의 지속성 — 배치 시스템 84개, 인식 속도**

→ "*Systems revenue increased ... due to there being 84 Systems in Deployment for the fiscal year ended September 26, 2026, as compared to 50 Systems in Deployment*" (10-K)

→ "Systems 매출 증가는 **배치 중 시스템 84개(전년 50개, +68%)** 때문"

→ 시사점: 배치 수 +68% vs Systems 매출 +23.6% → 시스템당 연 인식액은 줄었다(신규 배치 초기 단계 비중 증가 [판단]) → 초기 단계 시스템이 진행률을 올리는 FY27에 매출 레버리지 → 회사 가이던스 4Q26 +27.8\~31.0%가 그 경로

→ 분기 매출 QoQ: +1.9%(4Q25) → +7.4% → +6.6% → **+7.9%** → 가이던스 +3.5\~6.1% [계산]
→ **[판단]** 매출 쪽 가속은 가이던스로 뒷받침된다. 이익 쪽은 조정 EBITDA 가이던스가 QoQ 보합이라 4Q26 증감액 판정선(+$66.3M)을 넘기 어렵다 — **매출 가속 + 이익 둔화**로 엇갈릴 가능성 (그 경우 판정 유지·둔화)

## 3. 내러티브 점검

→ **성장 스토리**: Walmart 42개 RDC 전면 자동화를 축으로, AI 소프트웨어 + 자율 로봇 + 고밀도 구조물로 대형 유통 물류센터를 통째로 바꾸는 사실상 독점 사업자. 배치 시스템 수가 늘며 매출 20%대 성장, 2026년 GAAP 흑자 전환으로 "이익이 나기 시작한 물류 로봇"
→ **이번 분기**: ① 매출 재가속(+25.7%) ② OPM 7.0% 사상 최고·첫 연간 흑자 ③ Walmart EMAA $6B(잔고 최대 +$6.9B) ④ 다음 분기 매출 가속 가이던스 → 스토리가 **숫자와 계약으로 동시에 확인** → **내러티브 강화** (셀사이드 TP 변화는 미확보 — 숫자 중심 기준)
→ **판정**: 델타 가속 + 내러티브 강화 → **적극 구간**. 다만 이익 가속이 Systems 마진이 아닌 운영서비스·R&D에서 나왔고, 다음 분기 이익 가이던스는 보합 → "매출 가속은 이어지고 이익 델타는 4Q26에 한 번 쉬는" 그림이 기본 시나리오 [전망]
→ **스토리 강화 트리거**: ① FQ1 27 RPO $28B+ (EMAA 반영) ② Systems GPM 22% 이상 회복 ③ Walmart 외 신규 대형 고객(고객 B) 공개·해외 비중 10%+
→ **훼손 리스크**: ① 배치 지연·차세대 랙 전환 비용(재고 충당금 $8.1M 증가) ② 내부통제 중대한 취약점 개선 지연(2024-11 재작성 이후, 개선 비용 분기 $1.5M 지속) ③ FCC 해외 로봇 기기 규제(2026-07 Covered List)의 공급망 영향 — 회사 "평가 중" (10-K)
