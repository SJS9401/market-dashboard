# Micron 3Q26 (FQ4 26) 실적 리뷰 — 이익 레벨은 또 올랐고, 델타는 정점을 지났다

## 0. 한 줄 판정

> 성장 델타: **둔화 (영업이익 YoY 정점 2Q26 통과)** | 내러티브: **강화** → **이익 레벨업은 진행 중이지만 델타 매매 구간은 지나간 '고점권 경계 구간'** [판단]

→ 숫자: 매출 $54.2B(+379% YoY), Non-GAAP 영업이익 $44.6B(+1,029% YoY), OPM 82.3%. 매출 YoY는 +34%p 확대됐지만 영업이익 YoY는 1,253% → 1,029%로 −224%p 축소. QoQ 기준으로도 영업이익 증가율 +105% → +33% → 가이던스 +14%로 3분기 연속 감속
→ 쟁점 ①: FQ1 27 GPM 가이던스 86.25%가 컨센 87%를 하회 — 성과급 재고자산화·신규 팹 초기비용 같은 일회성인지, HBM 믹스로 인한 구조적 천장인지
→ 쟁점 ②: FY27 CapEx 2배 이상(>$50B) — "건설비 중심이라 2028 공급과잉은 시기상조"가 8개사 공통 결론. 다만 주가는 "2028~29 범용 메모리 업황 확신"을 요구하는 단계로 이동
→ 쟁점 ③: SCA 16 → 26건, 2030년까지 매출 35%+ 확보, RPO $150B — 사이클 지속 기간 가시성은 강화
→ 다음 분기 관건: 2Q27 GPM이 회사 말대로 반등하는지(86.25% → 87%+), 12/9 이사회 주주환원 규모, 2028 공급 계약(SCA 연장) 체결 여부

서프라이즈: 매출 컨센 대비 **+5.3%** ($51.49B), 영업이익 **+4.4%** ($42.76B), EPS $33.42 vs $31.83 **+5.0%** (Bloomberg 컨센 — 한화투자증권). 가이던스 중간값은 매출 컨센 $56.8B 대비 **+8.3%**, EPS $38.15 vs $36.02 **+5.9%**

(1) YoY 위치
→ 영업이익 YoY는 **2Q26(+1,253%)이 정점**, 3Q26 +1,029%로 첫 축소. 가이던스 기준 4Q26 약 +694%, 컨센 경로상 1Q27 +216% → 2Q27 +65% → 3Q27 +32%로 수렴 (Bloomberg 컨센, 한화투자증권 표)
→ 매출 YoY는 3Q26(+379%)이 정점. 4Q26 가이던스로 +351%로 꺾임 시작

(2) 기저효과 조정 — QoQ로 다시 보기
→ 1년 전 영업이익이 $3~4B대였기 때문에 YoY 수치 자체는 왜곡이 크다. 같은 흐름을 QoQ로 보면 영업이익 증가율 **+156% (1Q26) → +105% (2Q26) → +33% (3Q26) → 약 +14% (4Q26G)**, 분기 증가액 **+$17.2B → +$11.0B → 약 +$6.3B**
→ 즉 YoY·QoQ 어느 기준으로도 2Q26이 가속의 꼭대기. 이익 레벨은 계속 신고점이지만 "올라가는 속도"는 이미 3분기째 줄고 있다 [판단]
→ 판정 기준상 '꺾임'(2개 분기 연속 둔화 + YoY 정점 통과)은 아직 아님 — 4Q26이 가이던스대로 나오면 다음 리뷰에서 기계적으로 '꺾임' 조건 충족

→ **델타를 끄는 곳 = CDBU (서버 범용 DRAM·데이터센터 SSD)**. 매출 비중 1위로 올라섰고(33%), GP 증가분 $6.2B로 전사 GP 증가분($12.0B)의 절반 이상. DC SSD가 분기 약 $10B(YoY 10배 이상, NAND 매출의 2/3 이상)
→ **먼저 꺾인 곳 = CMBU (HBM 포함)**. 매출 YoY +307% → +258%로 4개 사업부 중 유일하게 감속, GPM도 83%로 정체. 한화: "상대적으로 원가가 높은 HBM이 오히려 전체 이익 개선 폭을 희석"
→ MCBU는 **비트 출하 감소에도 가격으로 매출 +14%** — 수요가 아니라 가격이 매출을 끌고 있는 사업부 [판단]
→ 정리하면 이번 사이클은 "HBM이 끄는 사이클"에서 "범용 DRAM·NAND 가격이 끄는 사이클"로 무게중심이 이동했다. 이익 레벨에는 유리하지만, 가격 의존도가 높아진 만큼 델타의 민감도도 커졌다 [판단]

→ "FQ1 27 GPM 약 86.25%. 성과급(bonus) 증가분 일부가 재고자산으로 자본화되고, 신규 시설 초기 가동비용(start-up)이 반영. **1Q가 FY27 GPM의 저점**이며 2Q 이후 메모리 가격 상승률이 완만해지더라도 원가 절감으로 GPM은 더 높아질 것" (컨콜, KB·한화증권 인용)

| 한화 | 일회성 (성과급·초기 가동비·재고 판매) | 시간외 미온적 반응의 원인 1순위로 GPM 가이던스 하회 지목. 2Q부터 원가 절감으로 개선 |
| 하나 | 믹스 요인 비중 큼 | HBM 비중 상승에 따른 믹스 희석. P(가격)·Q(물량) 모두 제한된 가운데 기대치 상회는 지속 |

→ 공통: 86.25%의 대부분은 성과급 자본화·초기 가동비라는 비현금·일시 요인이며, GPM 87% 근처는 사실상 천장권이라는 인식은 공유
→ 갈림: "GPM이 2Q27 이후 다시 올라간다"(회사·한화·메리츠) vs "HBM 믹스로 87%가 구조적 상한"(하나). 숫자로 보면 CMBU(HBM 포함) GPM 83%가 CDBU·MCBU 90%보다 7%p 낮다는 점이 하나 쪽 논리를 지지

(1-4) [판단]
→ 이익 레벨 관점에서는 0.75%p는 사소하다 ($61.5B × 0.75%p ≈ $0.46B). 의미는 **"GPM 상승이 멈췄다"는 신호**다. 1Q26 74.9 → 2Q26 84.9 → 3Q26 87.0 → 4Q26G 86.25로 GPM 델타가 +10.0 → +2.1 → −0.75%p로 꺾였다 [판단]
→ 2Q27(FQ2 27) GPM이 87% 이상으로 반등하면 일회성 해석이 맞는 것이고, 86%대 정체면 "가격 상승의 이익 기여가 끝물" 해석이 힘을 얻는다

→ 2027 공급 부족은 숫자(고객 약정 75%+, SCA 26건)로 뒷받침되므로 낙관 쪽이 맞다. 다만 "건설비 중심"이라는 말은 **2028 말 이후 장비 투자가 따라온다**는 뜻이기도 하다. 우려가 사라진 게 아니라 1년 뒤로 밀린 것 [판단]

(3) 쟁점 3 — SCA 26건과 사이클 지속 기간

(3-1) 회사 설명
→ SCA 16 → 26건(모바일 고객 포함 +10건). 2030년까지 예상 매출의 35% 이상(DRAM은 약간 하회, NAND는 약간 상회), 2건은 2031년까지 연장
→ 약 75%는 가격 하한·상한 밴드, 나머지는 주기적 시장가격 연동. 신규 계약은 더 높은 가격
→ 고객 재무 약정 $32B(대부분 현금 선수금), RPO $150B (키움). 장기 SCA 비중 목표 약 50% 유지. 2027 생산량의 75% 이상 이미 약정, 2028 협상 중

(3-2) 증권사별 해석 편차

| 증권사 | 핵심 가정·추정 | 논리 |
|---|---|---|
| 메리츠 | 사이클 중반을 아직 지나지 않음 | 장기계약 = 고객이 공급 확보에 돈을 미리 내는 구조 → "더 높고, 더 긴 사이클" |
| 키움 | 자체 시장 전망과 부합 | SCA·RPO·$32B 약정 모두 예상 범위. 서프라이즈는 아님 |
| 한화 | 시장이 가장 주목한 항목 | 2030년까지 35% 조기 확보 → 이익 가시성 개선 |
| NH·IBK | 2028까지 부족 지속의 근거 | 2028 계약 협상 중이라는 점 자체가 수요 신호 |

(3-3) 공통 결론 vs 갈리는 지점
→ 공통: SCA 확대는 이익의 바닥을 높이고 사이클을 길게 만든다
→ 갈림: 75%가 가격 **상한**도 있다는 점. 메리츠는 바닥 효과를, 키움은 "이미 예상된 숫자"라는 점을 강조. 상한이 있는 계약 비중이 커지면 업황이 더 좋아져도 마이크론 ASP 상승은 시장보다 둔해진다 [판단]

(3-4) [판단]
→ SCA는 모멘텀 트레이더 관점에서 양날이다. **하방(꺾임 폭)은 줄이지만, 상방(델타 재가속)도 제한**한다. 이익 변동성이 낮아지는 대신 밸류에이션이 '경기민감주 PER'에서 벗어날 수 있느냐가 관건 — 현재 12개월 선행 PER 6.7배(2년 평균 12.9배), PBR 3.9배(5년 평균 2.3배)로 시장은 아직 사이클 피크 PER을 적용 중 (한화)

## 3. 내러티브 점검

① 성장 스토리 정의
→ "AI 데이터센터가 HBM뿐 아니라 범용 DRAM·NAND까지 빨아들이면서 메모리가 경기민감 원자재에서 **장기계약 기반 인프라 부품**으로 바뀐다" — 시장이 MU를 사는 이유

② 이번 분기 평가 — **강화**
→ 숫자: 매출·영업이익·가이던스 모두 컨센 상회, FY27 영업이익 컨센 $209~217B로 5개월 새 거의 2배
→ 구조: SCA 26건, RPO $150B, 2027 물량 75%+ 약정, 2027·28 "2026보다 더 타이트" — 스토리의 핵심 전제(장기계약·지속 기간)가 이번 분기에 가장 많이 확인됐다
→ 균열 신호(아직 훼손 아님): GPM 상승 정지, HBM의 상대 마진 열위, 상한 있는 가격 밴드

③ 국면 — 델타 둔화 × 내러티브 강화
→ 비유하면 차의 **속도(이익 레벨)는 계속 신기록**인데 **가속 페달(델타)은 2Q26부터 떼고 있는** 상태. 모멘텀 매매가 가장 잘 먹히는 구간은 가속 구간이었고, 지금은 스토리가 좋아도 주가가 델타를 따라 횡보·조정하는 구간 [판단]
→ 이 판정이 다음 분기에 '꺾임'으로 넘어갈지 '유지'로 돌아설지는 아래 트리거·리스크로 결정

④ 다시 강해질 트리거
→ 12/9 이사회 대규모 주주환원 (FCF 100% 환원 등) — 멀티플 재평가 촉매
→ 2028 물량 SCA 체결 발표 + 2Q27 GPM 87%+ 반등 — "델타는 줄어도 마진 천장 없음" 확인
→ 컨센 재상향 (메리츠 예상: 연말~연초)으로 1Q27 이후 YoY 경로가 위로 이동

⑤ 깨뜨릴 리스크
→ 삼성·SK하이닉스의 2027 CapEx 급증·장비 발주 → 2028 하반기 공급과잉 논리 현실화

→ 계약 가격 밴드 상한 도달 → ASP 상승률 급감, GPM 하락 전환
