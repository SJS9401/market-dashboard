# Oklo 3Q26 실적 리뷰 — 마일스톤 & 현금 판정

## 0. 한 줄 판정

> 성장 델타: 합산 제외 — 마일스톤 판정: 정체 | 내러티브: 약화 → 매매 제외 구간 (Groves 임계·연료 계약은 진전, 핵심인 Aurora 첫 발전은 2028 → 2028\~2029로 후퇴, 구속력 PPA 여전히 0건)

→ 판정 방식: 매출이 없는 개발사라 성장 델타(매출·영업이익 YoY) 대신 **마일스톤 진전/정체/후퇴 × 내러티브**로 판정한다. 워치리스트 원칙(2026-11-14)대로 원전 섹터 델타 합산에는 넣지 않는다

→ 숫자: 매출 $1.86M (인수 자회사 용역), 영업비용 $84.3M (+132% YoY), 순손실 −$41.7M (EPS −$0.22, FactSet 컨센 −$0.27 대비 양호). 분기 현금 소진(영업CF+CapEx) **$199.5M로 사상 최대**, 유동성 $3.13B, 차입 0 (10-Q)

→ 마일스톤: 진전 4 (Groves 첫 임계 8/5, Centrus HALEU 본계약 9/30 + Meta 자금 11/2 집행, Aurora-INL 구조물 공사, NRC 규칙 확정) vs 후퇴 4 (Aurora 가동 일정, 동위원소 첫 납품 2027로 이연, 7/4 DOE 임계 목표 미포함, PJM·FERC 패소). **발전 사업 일정이 후퇴하고 상업 계약은 그대로라 "정체"**

→ 현금: 3Q 증자 $401.8M을 주당 $42.2에 조달 (1Q26 $95.5의 44%) — 같은 돈을 절반 이하 가격에 찍는 구조. 유동성은 +$125M 늘었을 뿐 [계산]

→ 다음 분기 관건: ① 4Q CapEx가 가이던스($400\~500M) 하단을 채우는지 = 공사 속도 ② Meta 1.2GW의 **구속력 PPA 전환** 또는 Aurora-INL 공사비 공개 (FY2026 10-K, 2027-03)

→ 델타 해석: 영업비용 YoY는 4Q25 +271%가 정점이고 3개 분기 연속 둔화(186 → 165 → 132%). 하지만 이건 "성장 둔화"가 아니라 **비용이 손익계산서에서 CapEx(현금흐름표)로 옮겨가는 단계** — 분기 소진은 3Q25 $23M → 3Q26 $200M로 8.7배 [계산]. 손실 YoY 급둔화(238 → 40%)도 3Q 이자수익 $27.9M(영업CF 유출의 61%)이 만든 착시다

→ 4Q 경로: 2026 CapEx 가이던스 $400\~500M을 채우려면 4Q CapEx $119\~219M — 3Q $154M 수준이 이어지면 중간값, 하단이면 공사 속도 둔화 신호 [계산]

③ 쟁점별 분해

(1) 쟁점 1 — Aurora-INL 가동 2028 → 2028\~2029

(1-1) 회사 설명

→ 10-Q: "our ambitious target of deploying our first powerhouse in 2028-2029 … amidst a range of supply chain, geopolitical, macroeconomic, and design complexities" (Plan of Operations). FY2025 10-K\~2Q26 10-Q까지는 "2028"

→ 컨콜(요약): CEO DeWitte는 Groves-1의 시운전 경험 — 장비 재보정, 통합, 시운전, 원자력 계측계통의 전기 노이즈 관리 — 때문에 일정 여유를 뒀다고 설명. 남은 DOE 절차는 DSA 승인 → 가동 준비 검토 → 가동 승인, **DSA는 공사 완료 즈음인 2028경** [MarketBeat·Quartr 요약, 비공식]

(1-2) 시장 시각

| EarningsWhispers (11/6) | 2025 4Q\~2026 2Q 반복한 "확정 2028"에서 넓힌 것 — 투자자는 신중함보다 첫 슬립으로 읽을 수 있음 |
| Citi (2025-11, 참고) | DOE 인가 경로 전환이 일정을 더 밀 수 있다고 이미 경고 (당시 2027\~28 기준, TP $68 중립) |
| Wedbush (11/2, 커버리지 승계) | Groves 착공 11개월 만의 임계 = 미국 차세대 원전 중 실행이 가장 앞섬 (Outperform, TP $36) |

(1-3) 공통 vs 갈림

→ 공통: 2028 단일 목표는 사실상 1년 범위로 넓어졌고, DSA 2028이면 2028 상반기 가동은 어렵다

→ 갈림: "Groves 교훈을 반영한 현실화"(Wedbush 계열) vs "FOAK 첫 슬립의 시작"(EarningsWhispers·Citi 계열)

(1-4) [판단]

→ DSA를 공사 완료 즈음(2028)에 받는 구조라 **2028 가동은 공사·DSA·시운전이 모두 일정대로 갈 때만 가능**. Groves(100W 시험로)에서 착공→임계 11개월이 걸렸고 7/4 목표도 한 달 늦었다 — 75MWe 발전로에서 "2029"가 기본값이라고 보는 게 숫자와 맞다. 결론이 바뀌는 조건: 2027 중 주요 기기 설치(회사 2027 목표) 완료 + DSA 제출 일정 공개

(2) 쟁점 2 — DOE 7/4 임계 목표 미포함 vs Groves 첫 임계

(2-1) 회사 설명

→ 10-Q: DOE가 6/30 최종 안전분석, 7/23 가동 승인 → **8/5 첫 임계**. "privately owned land, financed with private capital" — RPP 과제 중 민간 부지 첫 임계. Groves-1 건설비 약 $65M + 연료 약 $10M (컨콜 요약)

→ Groves-2 Forge(동위원소 생산 파일럿, 원자로 조사 + 핫셀)는 NRIC Launch Pad 선정, Framatome 연료 구매 완료 (EarningsWhispers 요약)

(2-2) 시장 시각

(2-3) 공통 vs 갈림

→ 공통: Groves 임계는 Oklo가 "설계만 하는 회사"에서 "원자로를 실제로 돌려본 회사"로 넘어간 첫 실물 증거

→ 갈림: 임계 속도 경쟁에서 마이크로로 스타트업에 졌다는 점(희소성 하락) vs Oklo만 발전·연료·동위원소 통합 플랫폼이라는 점

(2-4) [판단]

→ 7/4 미포함은 **"첫 번째 원자력 스타트업" 프리미엄을 지웠다**. Groves는 100W 시험로라 매출·발전과 무관하고, 가치는 Aurora 일정 리스크를 줄이는 학습 효과에 있다 — 그런데 이번 분기 회사는 바로 그 학습을 근거로 Aurora 일정을 넓혔다. 진전이지만 주가 촉매로서는 소진됐다

(3) 쟁점 3 — 구속력 PPA 0건 (Meta·Switch·Equinix)

(3-3) 공통 vs 갈림

(3-4) [판단]

→ Meta 자금의 첫 실집행은 의미 있는 변화지만, 원자로 건설·전력 구매 의무가 없는 한 **매출 가시성은 0**. 공급망을 27기분 예약하면서 수요는 0기 확정인 비대칭이 이 종목 할인의 핵심이다. 결론이 바뀌는 조건: Meta 오하이오 1단계 구속력 PPA 또는 Equinix ROFR(2027-02 만료) 행사

## 3. 내러티브 점검

① 성장 스토리 정의

→ "AI 데이터센터에 원전 전기를 직접 파는 첫 차세대 원자로 — 소유·운영(PPA) 모델로 반복 매출을 만들고, 사용후연료 재활용과 동위원소로 연료·매출을 수직계열화한다"

② 이번 분기가 스토리에 준 영향

→ 강화: Groves 첫 임계(실물 운영 경험), Centrus 연료 본계약 + Meta 자금 첫 집행, Aurora 27기분 공급망 예약, NRC의 DOE 데이터 활용 규칙

→ 약화: 첫 발전 일정 후퇴(2028\~29), 동위원소 첫 납품 이연(2027), 구속력 PPA 0건 재확인("not binding to build the reactor"), PJM·FERC 패소, 주당 $42 증자

→ 시장 반응: 실행 진전은 인정하지만 **"언제·누구에게·얼마에 파는가"가 하나도 확정되지 않았다**는 쪽으로 이동 — TP는 멀티플 하향, 손실 추정은 확대

③ 국면 판단

→ 마일스톤 정체(발전 일정 후퇴 + 상업 계약 불변, 연료·동위원소는 진전) + 내러티브 약화(TP 평균 −14%, 2027E 손실 확대, 원전 테마 수급 피로) → **매매 제외 구간**

→ BT 프레임상 주의: 3Q 발표일 +22.7%·2Q 발표일 +14.8%처럼 **이벤트성 급반등은 반복**되지만 추세로 이어지지 않았다. 순현금 $16/주가 하방처럼 보여도 ATM 잔여 $911M·소진 경로 $6.3B 때문에 하방이 매 분기 낮아진다 [판단]

④ 트리거와 리스크

→ 트리거: ① Meta 오하이오 1단계 **구속력 PPA** (또는 Switch 12GW 중 첫 개별 PPA) ② Aurora-INL 공사비 공개 + 비주식 조달(DOE 대출·고객 선급) ③ 2027 주요 기기 설치 완료로 "2028" 복귀

→ 리스크: ① Aurora 2차 후퇴(2030 이후) 또는 DSA 지연 ② 주가 $20 이하에서 ATM 재개(분기 순조달 $500M+) ③ Equinix ROFR 2027-02 미행사 만료 / 고객의 대체 전원(가스터빈·기존 원전 PPA) 선택

## 4. 향후 봐야 할 것

① **4Q26 CapEx·소진과 Aurora-INL 공사비 공개** (마일스톤 판정 1순위)

→ 무엇을: 4Q CapEx $119\~219M(가이던스 역산) 중 어디인지 — 하단 미달이면 공사 지연 신호. FY2026 10-K에서 Aurora-INL 총공사비(Piper 추정 $7,000/kW ≈ $525M) 공개 여부, 2027 소진 가이던스

→ 어떤 데이터로: FY2026 10-K 현금흐름표·MD&A, 4Q 컨콜

→ 언제: 2027-03 중순

② **구속력 PPA 첫 체결 (Meta 오하이오 / Switch / Equinix ROFR)**

→ 무엇을: "non-binding" 문구가 빠진 전력구매계약 1건 이상, Equinix ROFR(2027-02 만료) 행사 여부, Meta 선급 2차분 집행

→ 어떤 데이터로: 8-K Item 1.01, 10-K "Commercialization Developments", Meta·Equinix 발표

→ 언제: 2027-02 (ROFR) \~ 2027-03 (10-K)

③ **Aurora-INL 일정 — 주요 기기 설치와 DSA 제출**

→ 무엇을: 원자로 용기·주요 기기 설치 착수(회사 2027 목표), 첫 A3F 연료집합체(2027), 가동 목표가 "2028\~2029"에서 더 밀리는지(2030 문구 등장 = 후퇴 판정)

→ 어떤 데이터로: 10-K/10-Q Plan of Operations 문구, DOE 인가 공지, 컨콜

→ 언제: 2027-03 \~ 2027-08

④ **희석 — ATM 2 잔여 $911M 사용 속도와 단가**

→ 무엇을: 분기 순조달·주당 단가($42.2 → $30 이하 여부), 발행주식 200M주 돌파, 비주식 조달 등장

→ 어떤 데이터로: 10-K 자본변동표·표지 주식수, 8-K(새 ATM·전환사채)

⑤ **계통연계·동위원소 첫 매출**

→ 무엇을: 오하이오 PJM 절차 진행(약 24개월), 추가 FERC·PJM 분쟁, Groves-2 착공과 첫 계약 동위원소 납품(2027) — 분기 매출 $10M+면 기업개요 Secondary "초기 매출" 추가 트리거

→ 어떤 데이터로: 10-Q 위험요인 문구, PJM 대기열·FERC 도켓, 매출 구성 Note
