# Ronbay 3Q26 실적 리뷰 — 매출 +115%인데 다시 적자. 볼륨은 터졌고 메탈가 래깅이 마진을 지웠다

## 0. 한 줄 판정

> 성장 델타: 꺾임 | 내러티브: 약화 → 델타 꺾임 + 내러티브 약화 → 매매 제외 구간 (4Q26 흑자 복귀와 한국 공장 구조 확정 전까지)

→ **판정 지표**: 중국 회계의 营业利润(이하 "중국식 영업이익")은 투자수익·기타수익·자산/신용손상·재무비용을 포함해 K-IFRS 영업이익과 다르다. 그래서 ① 중국식 영업이익 ② **한국식 영업이익 근사** (= 매출총이익 − 세금및부가 − 판매비 − 관리비 − R&D) ③ 지배순이익을 함께 보고, 판정은 셋의 방향으로 한다. 이익이 적자와 흑자를 오가 YoY %가 의미 없어서, **YoY 증감액(억위안)** 으로 델타를 본다
→ **숫자**: 3Q26 매출 58.83억위안 (+114.9% YoY, +19.1% QoQ), 한국식 영업이익 0.19억 (OPM 0.3%), 중국식 영업이익 −1.19억, 지배순이익 −1.25억, GPM 5.3% (QoQ −4.1%p). 이익 YoY 개선폭이 2Q26 대비 급감 — 중국식 영업이익 +1.48억 → +0.25억, 순이익 +1.51억 → +0.10억. 한국식 영업이익은 QoQ −89% (1.80 → 0.19억)
→ **왜**: 삼원 판매 3.8만톤+ (+81% YoY, +36% QoQ)로 볼륨은 사상 최대권인데, 3Q 메탈가(리튬) 반락 → 판매 마진 축소 + 재고평가손실 약 0.8억 (회사·东吴证券). 한국식 근사에는 재고손실이 빠져 있어, K-IFRS 기준으로 보면 3Q26 영업이익은 적자 (약 −0.6억위안 [계산])
→ **쟁점**: (1) 볼륨 vs 래깅 — 매출 +115%의 대부분은 가격·저기저, 이익은 메탈가 방향에 종속 (2) 한국 충주 공장(6.7만톤)을 실소유주 관련회사 AKB에 임대 — 북미 PFE 규제 대응이지만 2027 연결 매출 감소·관련거래 (3) LFP·나트륨 신사업 램프 = CapEx·재고·차입 확대 (재고 50억, 순차입 53.8억)
→ **원화 참고**: 3Q26 매출 ≈ 1조 2,364억원, 한국식 영업이익 ≈ 40억원, 중국식 영업이익 ≈ −250억원 [계산: 3Q26 평균 CNY/KRW 210.16 = Yahoo USD/KRW ÷ USD/CNY 일별 평균]
→ **다음 분기 관건**: 东吴 추정 4Q26 매출 88.8억 (+171% YoY)·순이익 1.43억 [계산: 2026E − 9M26] — 메탈가 반락이 이어지면 재고손실이 반복된다. 그리고 한국 공장 임대 주총 통과·미국 PFE 세부 규칙(연말 예정)

→ **컨센 대비**: 공개 집계 컨센서스 [미확보]. 东吴证券 "3Q 실적 기본 부합" (2026-11-03) — 시장 기대 자체가 낮았다
→ **델타 해석**: 매출은 3개 분기 연속 YoY 확대 (+28% → +50% → +115%) = **가속**. 반면 이익은 중국식 영업이익·순이익 모두 YoY 개선폭이 2Q26 정점(+1.48억·+1.51억) 대비 1/6 이하로 줄었다. 한국식 근사 증감액(+1.60억)만 커 보이는 건 3Q25가 −1.41억 적자였던 기저효과 — QoQ는 −89%, OPM 3.6% → 0.3%. **이익 기준 판정 = 꺾임**
→ **재고손실 반영 시**: 3Q26 자산손상 0.81억 중 재고평가손실 약 0.8억 (东吴). K-IFRS는 재고평가손실을 매출원가에 넣으므로 한국 양극재 3사와 같은 기준의 3Q26 영업이익은 약 −0.6억위안 (OPM 약 −1.0%) [계산: 0.19 − 0.8]

③ 쟁점별 분해

(1) **매출 +115%인데 왜 적자인가**

(1-1) 회사 설명
→ "매출 증가는 판매량 증가 + 판가 상승. 9M 주력제품 판매량 +30%, 3Q 단독 +78% (전년 3Q 대비). 주요 원재료 평균가가 크게 올라 판가가 따라 올랐다" (3Q26 보고서)
→ "판매량 증가·가동률 상승으로 단위 고정비가 희석돼 이익에 긍정적. 다만 3Q 이후 원재료 가격 반락으로 3Q 판매 마진 하락, 재고평가충당금 증가, 해외 기지 운영 확대로 관리비 증가" (3Q26 보고서)
→ 1H26 흑자(순이익 1.09억)의 이유 중 하나는 "원재료 가격 상승기에 재고 관리로 이익에 플러스" (반기보고서) — 즉 1H는 래깅 수혜, 3Q는 래깅 역풍

(1-2) 시장 해석

| 출처 | 핵심 가정·추정 | 논리 |
|---|---|---|
| 东吴证券 (11/3) | 3Q 삼원 사업 "대체로 손익분기", 4Q 단위 이익 QoQ 보합 | 메탈가 반락으로 단위 이익 압박, 재고손실 약 0.8억 |
| 东吴证券 (11/3) | 2026E 순이익 4억 → 1.3억 | 삼원 마진 반락이 하향의 첫 번째 이유 |
| 회사 (반기보고서) | 1H 래깅 수혜 명시 | 메탈가 방향이 분기 이익을 정한다는 걸 회사도 인정 |

(1-3) 공통 vs 갈림
→ 공통: 볼륨은 진짜다 (삼원 3.8만톤+, 가동률 상승). 이익 변동은 메탈가 래깅
→ 갈림: 4Q26 — 东吴는 4Q 순이익 1.4억 [계산]으로 회복을 그리지만, 메탈가가 4Q에도 내려가면 재고 50억(연초 대비 +134%)에서 추가 손실이 날 수 있다

(1-4) [판단]
→ Ronbay의 이익은 "얼마나 파느냐"보다 "메탈가가 어느 쪽으로 움직이느냐"에 더 민감하다. 3Q26이 그 증거 — 사상 최대권 볼륨에서도 적자. 재고가 연초의 2.3배라 메탈가 추가 하락 시 손실 폭이 3Q보다 커질 수 있다. 4Q26에 GPM이 8%대로 돌아오고 자산손상이 0.3억 아래면 "3Q는 일회성 래깅", 5%대에 머물면 "구조적 저마진"으로 본다

(2) **한국 충주 공장 AKB 임대**

(2-1) 회사 설명
→ 배경: 미국 「One Big Beautiful Bill Act」 공급망 규제(PFE — 중국계 지분 25% 초과 기업)와 북미 고객의 구매 조정. 2026-03 한국 JS를 분할해 JS Old 지분을 AKB에 0.97억달러에 팔기로 했으나 **인수자 자금 조달 지연으로 미교부** (회사 공고 2026-059)
