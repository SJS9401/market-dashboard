# 디어유 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 꺾임 | 내러티브: 약화 → 매매 제외 구간 (영업이익 YoY +100% → +77% → +26% → +6%로 3개 분기 연속 둔화, 4Q26 컨센은 −2%로 마이너스 전환. 구독자 역성장은 197만에서 멈췄지만 성장 스토리는 '구독'에서 증명 전인 '뉴욕 버블 하우스·중국'으로 넘어가는 중)

> ⚠ 비영업 요인 플래그: 3Q26 순손실 −74억(적자전환)은 영업외 요인 — 기타비용 68.5억(MG 선급금 손상)·금융비용 105.6억(외화환산손실, 보유 현금의 약 70%가 달러예금) (OpenDART·iM). 영업이익 판정과 무관. MG 손상은 2Q25(119억)에 이어 두 번째라 반복성 점검 필요. 4Q25 영업이익 YoY +100%에는 QQ뮤직 버블 3Q\~4Q25 매출 합산 반영 효과(약 4억)가 섞여 있다

→ 숫자: 영업수익 228억 (+2.4% YoY, −2.2% QoQ), 영업이익 92억 (+5.6% YoY, OPM 40.3%) — 컨센 부합(삼성 기준 컨센 대비 영업이익 +3.3%). 매출 YoY 33.9%(4Q25) → 33.4% → 15.7% → **2.4%**, 영업이익 YoY 100.4% → 76.9% → 26.4% → **5.6%**
→ 쟁점 ①: **구독자 바닥** — 분기 평균 구독 197만, 2개 분기 보합(3Q25 219만 → 4개 분기 감소 후 멈춤). 10/1 입점 배우 이광수 효과로 4Q 반등 기대(4건 공통)
→ 쟁점 ②: **뉴욕 버블 하우스** — 11/14 가오픈·12/4 정식 오픈. 미국 법인 영업손실 약 17억(삼성 추정)으로 별도 영업이익 +19.8%가 연결 +5.6%로 줄었다. 흥행 시 "실적 2\~3배"(키움) vs "성과 확인 후 추정 조정"(삼성)
→ 다음 분기 관건: 4Q26 영업이익 컨센 평균 96억(4사 93\~98억, YoY −1.6%) — 판정 '꺾임'을 뒤집으려면 구독자 200만 회복 + 버블 하우스 초기 매출이 비용을 덮어야 한다

## 2. 시장 쟁점

① 지난 분기 체크
→ 첫 리뷰 — 직전 체크 없음

② 이번 분기 쟁점 (리포트 4건 기준)

(1) **구독자 역성장이 끝났나** — 4건 전부. 197만 보합이 바닥인가
(2) **뉴욕 버블 하우스의 수익성** — 4건 전부. 새 성장 동력 vs 비용 부담
(3) **중국(QQ뮤직)·일본이 본업 정체를 메울 수 있나** — 4건 전부
(4) **순이익 변동성(MG 손상·환율)과 EPS 하향** — 3건(삼성·키움·iM)

③ 쟁점별 분해

(1) **구독자 역성장이 끝났나**

(1-1) 회사 설명: "2Q26 평균 197만 → 3Q26 평균 197만, 전분기 대비 구독 수 보합. FX 효과로 영업수익 감소. 2Q26 중국 로열티 6월 초과분 3Q26 인식, QQ Music 버블 구독수는 지속적인 증가 중". 신규 입점: AEN(스타쉽), 소유, CIIU 뻔푸소년(JYP). 서비스 종료: 탁보영·이영지·Peso Pluma (IR 3Q26)

(1-2) 증권사별 해석 편차

| 증권사 | 핵심 가정·추정 | 논리 |
|---|---|---|
| 키움 | 4Q26E 평균 구독 201만(+2% QoQ), 2027E 206만 | 네 분기 연속 역성장이 멈췄고 이광수의 폭발적 반응이 배우·개그맨·아이돌 신규 입점 문의로 확산 — 4Q 기점 우려 해소. 다만 구독 반등만으로 추정치 상회는 어렵다 |
| iM | 4Q 반등 기대 | 첸백시 버블 서비스 종료에 따른 이탈 우려가 있으나 이광수 콘텐츠의 SNS 바이럴로 기존 팬층 외 신규 유입 확인 — 이탈 일부 상쇄 |
| 삼성 | 평균 구독 197만 "견조한 흐름 유지" | 구독자 자체보다 신사업 성과가 핵심 변수 |
| 흥국 | 평균 구독 197만 | 신규 IP 유입 구독자의 웹 결제 비중 33% — 구독 수보다 수수료 구조 개선에 주목 |

(1-3) 공통 결론 vs 갈리는 지점: 4건 모두 "바닥 통과"에 동의. 갈리는 건 **반등의 폭** — 키움은 4Q 201만(+2%)으로 소폭, 나머지는 수치 제시 없음. 2027년 구독 성장을 두 자릿수로 보는 곳은 없다
(1-4) [판단] 구독 197만 보합은 '바닥'이지 '성장 재개'가 아니다. 3Q25 219만 대비 −10%라 버블 본업 매출은 YoY 보합(−0.2%). 판정을 바꾸려면 4Q 평균 200만 회복 + 2027년 상반기 210만대 복귀가 필요. 첸백시 등 대형 IP 이탈이 반복되는 구조라 IP 순증(입점 − 종료)을 분기마다 따져야 한다

(2) **뉴욕 버블 하우스의 수익성**

(2-1) 회사 설명: 글로벌 신사업 'bubble House' 1호점 뉴욕 — 소규모 공연·팬미팅 아레나, 라이브 버블 파드(POD), 상설 굿즈 매장 '버블 마트'. 기존 구독 기간에 따라 입장료 차등 (IR·삼성)

(2-2) 증권사별 해석 편차

| 증권사 | 핵심 가정·추정 | 논리 |
|---|---|---|
| 키움 (낙관) | 4Q26E 영업수익 284억(+24.5% QoQ, 버블 하우스 매출 반영), OPM 34.2%. 2027E 영업수익 1,178억·영업이익 476억 | 소속사는 미국 팝업 인테리어 비용 10\~20억을 절감 — 양측 유인 존재. 4Q는 인건비·초기 비용 불가피하나 흥행 시 "실적 2\~3배 성장도 불가능하지 않은 구조". 현 추정은 보수적, 증명 시 추정치·멀티플 동시 상향 |
| iM | 2027F 영업이익 440억 | 월 임대료가 낮아 인건비 외 고정비 부담 제한, 초기 재고 최소화. 비용이 1Q26부터 반영돼 마진 희석 우려는 주가에 상당 부분 반영 |
| 흥국 | 2027E 영업이익 400억 | 수익원 = 입장료($15)·MD·기업 스폰서십. 4Q는 뉴욕점 인력 채용으로 인건비 QoQ 소폭 상승, 2027년은 추가 출점 전까지 현 수준 유지 |
| 삼성 (보수) | 2027E 영업이익 409억, 추정치에 신사업 성과 미반영 | 디지털 소통 모델을 오프라인 경험·소비로 확장한다는 점은 주목. 소프트 오프닝으로 수익 모델 초기 성과를 확인한 뒤 추정치 조정 예정 |

(2-3) 공통 결론 vs 갈리는 지점: 신사업 비용은 이미 1Q26부터 들어와 있고(연결 조정 −4억 → −17억), 4Q에 한 번 더 늘어난다는 데 동의. 갈리는 건 **매출 기여 가정** — 키움만 4Q부터 매출(약 50억 [계산 — 키움 4Q 영업수익 284억 − 타사 평균 236억])을 넣었고, 나머지는 성과 확인 전 0에 가깝게 둔다
(2-4) [판단] 3Q26 숫자로 보면 신사업은 아직 '비용'이다(연결 영업이익 성장률을 +19.8% → +5.6%로 14%p 깎음). 4Q26 실적에서 버블 하우스 매출이 미국 법인 손실(−17억 이상)을 줄이는지가 결론을 바꿀 첫 숫자. 키움의 4Q 매출 가정이 맞으면 4Q 영업수익 YoY는 +19%, 틀리면 0%대

(3) **중국(QQ뮤직)·일본이 본업 정체를 메울 수 있나**

(3-1) 회사 설명: QQ Music 버블 구독수 지속 증가, bubble for Japan 3Q 말 구독 110,940 (IR)

(3-2) 증권사별 해석 편차

|---|---|---|

(3-3) 공통 결론 vs 갈리는 지점: 중국·일본 구독은 증가 추세라는 데 전원 동의. 그러나 **절대 규모**가 문제 — 삼성 기준 QQ뮤직 매출은 분기 7억(영업수익의 3%), 2027E 42억(4%). 갈리는 건 G.E.M. 같은 대형 C-POP IP가 구독 '급증'을 만들 수 있느냐(iM 적극, 삼성 숫자상 점진)
(3-4) [판단] 중국 로열티 증가분(YoY +7억)이 본업 정체를 메우는 유일한 성장원이지만, 매출 228억 회사의 성장률을 두 자릿수로 되돌리기엔 작다. G.E.M. 입점 후 QQ뮤직 매출이 분기 15억 이상으로 뛰는지가 이 쟁점의 결론을 바꿀 숫자

(4) **순이익 변동성과 EPS 하향**

(4-1) 회사 설명: "아티스트 MG 선급 비용 손상 인식, F/X 하락에 따른 보유 달러예금의 외화환산평가손실 반영" — 당기순이익 −74억 적자전환 (IR)
(4-2) 증권사별 해석: 삼성 — 2026E EPS 1,299원 → 677원(−47.9%), 2027E −9.6%, 목표 P/E 20 → 18배. iM — 손상차손·외화환산손실 합산 약 160억, 달러예금이 전체 현금의 70%. 키움 — 순이익 2026E 160억·2027E 287억(영업이익 대비 낮게 유지)
(4-3) 공통 결론 vs 갈리는 지점: 영업 실적과 무관한 일회성이라는 데 동의. 갈리는 건 **반복성** — MG 손상은 2Q25(119억: 미국 법인 71억·본사 48억)에 이어 두 번째이고, 달러예금 비중이 커서 환율이 순이익을 계속 흔든다
(4-4) [판단] 아티스트 MG(최소 보장 선급금)는 IP 확보 비용이라 대형 IP를 들일수록 커진다. 손상이 반복되면 'MG를 주고 들인 IP가 기대만큼 구독을 못 모은다'는 신호 — 영업이익 판정과 별개로 IP 획득 효율을 보는 지표로 추적할 가치가 있다

④ 낙관 vs 보수

→ 가장 낙관: **키움**(TP 30,000원 유지, 2027E 영업이익 476억 — 4사 최고) — 버블 하우스가 소속사·팬 양쪽 유인을 가진 구조라 흥행 시 실적 2\~3배 가능. **iM**(32,000원, TP 최고) — 중국 대형 IP 입점과 신사업 가시화, 12MF P/E 12배는 저평가

## 3. 내러티브 점검

→ 성장 스토리: **K-팝 팬덤의 '1:1 메시지 구독'이라는 높은 이익률(OPM 40%)의 구독 플랫폼이, 입점 IP 확대와 해외(일본·중국) 진출로 구독자를 늘리는 구간** — 2025년 하반기 반등(영업이익 +37% → +100%)의 근거였다
→ 이번 분기: 구독자 감소는 멈췄지만 늘지 않았고(197만 보합), 본업 매출은 YoY 보합이다. 성장분은 중국 로열티(분기 7억)뿐이다. 시장의 관심은 구독 성장에서 **'아직 숫자가 없는' 뉴욕 버블 하우스와 대형 C-POP IP**로 옮겨 갔다. 기존 스토리는 약화, 새 스토리는 형성 전 → **델타 꺾임 + 내러티브 약화 → 매매 제외 구간** (신사업 숫자 확인 시 재검토)
→ 다시 강하게 만들 트리거: 4Q26 버블 하우스 매출이 미국 법인 손실을 상쇄(연결 조정 −17억 → 축소) / G.E.M. 입점 후 QQ뮤직 매출 분기 15억 이상 / 평균 구독 210만 복귀
→ 깨뜨릴 리스크: 대형 IP 추가 이탈(첸백시 사례) / MG 손상 3회째 / 버블 하우스 초기 흥행 부진으로 2호점 계획 지연·비용만 남음
