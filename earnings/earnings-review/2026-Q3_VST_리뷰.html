# Vistra 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 가속 | 내러티브: 약화 → 경계 구간 (3Q26이 조정 EBITDA YoY 정점, 4Q26 가이던스 역산 YoY 마이너스 + 텍사스 정책 리스크로 멀티플 하향)

→ 숫자: Ongoing 조정 EBITDA **$2,378M(+50.4% YoY, 분기 최대)**, YoY 1Q26 +20.5% → 2Q26 +31.0% → 3Q26 +50.4%로 3개 분기 연속 확대(+19.4%p). GAAP 매출 $6,347M(+27.7%), 영업이익 $1,706M(+64.5%), OPM 26.9%

→ 컨센 대비: GAAP EPS $3.23 vs $2.94(+9.9%), 매출은 $6.85B(Zacks)·$7.44B(Earnings Whispers) 대비 미달 — 헤지 회계 노이즈라 의미 작음. 2027 가이던스 신규 $7.7\~8.5B, 중간값 $8.1B는 발표 전 컨센 $7.96B(TIKR) 대비 +1.8%

→ 쟁점은 **"성장의 질"**: 2027 중간값 +11%(vs 2026 중간값 $7.3B) 중 약 $700M이 Cogentrix 인수 + Meta Perry PPA — 이를 빼면 약 $7.4B로 +1% 안팎 [계산]. 3Q26 YoY에도 Lotus(2025-10 인수) 편입분이 섞여 있다

→ 텍사스 리스크가 주가를 끌었다: 11/4 주지사 선거(데이터센터 모라토리엄 공약 후보 당선) → 당일 -13.8%, KeyBanc Sector Weight 하향, BMO TP $210 → $188. 3Q 실적 다음 날 +10.5% 반등(11/6)했지만 11/13 $133.01은 ATH($217.92) 대비 -39%

→ 다음 분기 관건: 4Q26 Ongoing 조정 EBITDA가 가이던스 역산 $1,661M(YoY -4.6%)을 넘어 플러스 YoY를 내는지, 그리고 Comanche Peak 잔여 1,200MW·Beaver Valley 원전 계약이 텍사스 정책 변화 속에서 나오는지

→ 컨센 대비: GAAP EPS $3.23 vs $2.94(+9.9%, Zacks·Earnings Whispers), 매출 $6.35B vs $6.85B(-7.3%, Zacks) / $7.44B(-14.7%, Earnings Whispers). 분기 조정 EBITDA 컨센은 공개 출처에서 미확보

→ **YoY 정점은 3Q26**: 조정 EBITDA YoY는 3개 분기 연속 확대됐지만 4Q26 가이던스 역산은 -4.6%(범위 상단에서도 +6.8%). 4Q25($1,742M)가 높은 기저인 데다 4Q26엔 Cogentrix가 2개월만 들어온다. 2027 가이던스 중간값 기준 연간 YoY는 +11% → **분기 YoY 경로상 정점이 이번 분기** [판단]

→ **Organic vs reported**: 3Q25에 Lotus(2025-10-22 인수, 가스 2.6GW)가 있었다고 가정한 프로포마 매출은 $5,150M(10-Q Note 2) → 3Q26 매출 YoY는 보고 기준 +27.7%, **Lotus 제외 +23.2%** [계산]. 회사는 Lotus의 인수 후 매출·이익을 "포트폴리오 단위 운영이라 분리 불가"로 공시. Lotus 분기 조정 EBITDA를 $60\~80M으로 가정하면(인수가 $1.9B ÷ EV/EBITDA 6\~8배 ÷ 4 [추정]) Lotus 제외 조정 EBITDA YoY는 약 +45\~47% [추정] — 가속 판정은 유지

③ 국면 판단

→ 4Q26 가이던스 역산 YoY가 마이너스라 다음 분기 "꺾임" 조건에 걸릴 가능성이 있다. BT 프레임상 **3Q 숫자에 올라탈 구간이 아니라, 텍사스 정책·원전 계약 이벤트를 기다리는 구간** [판단]

④ 트리거와 리스크
→ 트리거: ① Comanche Peak 2호기 1,200MW 또는 Beaver Valley 하이퍼스케일러 원전 PPA ② 4Q26 조정 EBITDA $1.74B+(YoY 플러스) ③ PJM 2028/29 이후 용량가격 상한 유지 + 업레이트 일정 가속
→ 리스크: ① 텍사스 데이터센터 모라토리엄 법제화(2027 의회) ② ERCOT 선도가격 $30/MWh대 고착 → 2028 비헤지 22% 노출 ③ PJM 용량시장 개편(가격 상한·하한 재설정)·FERC co-location 규제
