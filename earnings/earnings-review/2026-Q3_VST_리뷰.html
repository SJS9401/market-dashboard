# Vistra 3Q26 실적 리뷰

## 0. 한 줄 판정

> 성장 델타: 가속 | 내러티브: 약화 → 경계 구간 (보고 영업이익 YoY +7.4% → +64.5%, 매출 YoY도 확대된 강한 가속이지만, 텍사스 정책 리스크·원전 계약 지연으로 추정치·멀티플 하향)
> ⚠ 비영업 요인 플래그: 3Q GAAP 영업이익 +64.5% 중 **미실현 헤지 이익 $559M**(전년 $184M) — 헤지 제외 참고치 약 $1,147M vs $853M, **+34.5%** [계산] / **Lotus 편입 기여는 미공시**(10-Q: 분리 불가, 3Q25 프로포마 매출 $5,150M 기준 매출 기여 약 $179M — 이익 기여 추정 분기 $60\~80M [추정]) / 조정 EBITDA 기준 4Q26 가이던스 역산 YoY -4.6% 역성장 경로, 4Q26부터 Cogentrix(인수) 편입

→ 숫자 (판정 기준): GAAP 영업이익 **$1,706M(+64.5% YoY)**, 영업이익 YoY 2Q26 +7.4% → 3Q26 +64.5%(**+57.1%p**), 매출 $6,347M(+27.7%, 매출 YoY -5.5% → +27.7%로 +33.2%p) → 강한 가속. OPM 26.9%. 단 영업이익엔 미실현 헤지 이익 $559M(전년 동기 $184M)이 들어 있다 — 이를 빼면 약 $1,147M vs $853M, +34.5% [계산, 참고]. 참고: Ongoing 조정 EBITDA $2,378M(+50.4%, 분기 최대)

→ 컨센 대비: GAAP EPS $3.23 vs $2.94(+9.9%), 매출은 $6.85B(Zacks)·$7.44B(Earnings Whispers) 대비 미달 — 헤지 회계 노이즈라 의미 작음. 2027 가이던스 신규 $7.7\~8.5B, 중간값 $8.1B는 발표 전 컨센 $7.96B(TIKR) 대비 +1.8%

→ 쟁점은 **"성장의 질"**: 2027 중간값 +11%(vs 2026 중간값 $7.3B) 중 약 $700M이 Cogentrix 인수 + Meta Perry PPA — 이를 빼면 약 $7.4B로 +1% 안팎 [계산]. 3Q26 YoY에도 Lotus(2025-10 인수) 편입분이 섞여 있다

→ 텍사스 리스크가 주가를 끌었다: 11/4 주지사 선거(데이터센터 모라토리엄 공약 후보 당선) → 당일 -13.8%, KeyBanc Sector Weight 하향, BMO TP $210 → $188. 3Q 실적 다음 날 +10.5% 반등(11/6)했지만 11/13 $133.01은 ATH($217.92) 대비 -39%

→ 다음 분기 관건: 4Q26 GAAP 영업이익이 4Q25 $474M(미실현 헤지 손실 약 $441M 포함 — 낮은 기저)을 넘어 YoY 플러스를 유지하는지. 참고 지표인 조정 EBITDA는 가이던스 역산 $1,661M(YoY -4.6%)이라 "질"은 둔화 방향. 그리고 Comanche Peak 잔여 1,200MW·Beaver Valley 원전 계약이 텍사스 정책 변화 속에서 나오는지

→ 지표 선택: 판정은 **GAAP 영업이익 YoY**(v11 규정, BT 결정 2026-11-16). GAAP 이익은 발전 세그먼트 선도 매도 헤지의 시가평가로 크게 출렁인다 — 3Q24 영업이익 $2,588M(미실현 이익 포함), 1Q25 적자(미실현 손실) — 그래도 보고 숫자 그대로 판정한다. 조정 EBITDA(회사 가이던스·컨센 기준 지표)는 이익의 "질"을 보는 참고 행이다

→ 컨센 대비: GAAP EPS $3.23 vs $2.94(+9.9%, Zacks·Earnings Whispers), 매출 $6.35B vs $6.85B(-7.3%, Zacks) / $7.44B(-14.7%, Earnings Whispers). 분기 조정 EBITDA 컨센은 공개 출처에서 미확보

→ **판정 경로**: GAAP 영업이익 YoY는 4Q25 -20.9% → 1Q26 흑자전환 → 2Q26 +7.4% → 3Q26 +64.5%. 1Q26은 전년 적자 기저라 YoY 산출 불가, 비교 가능한 직전 분기(2Q26) 대비 +57.1%p 확대 → **가속**(매출 YoY도 +33.2%p 확대 = 강한 가속). 4Q26은 GAAP 가이던스가 없고 4Q25 기저가 미실현 손실로 낮아($474M) 숫자상 YoY 플러스 가능성이 크다 [판단]. 반면 참고 지표 조정 EBITDA는 4Q26 가이던스 역산 YoY -4.6% — **보고 이익과 기초 이익의 방향이 4Q에 엇갈릴 수 있다** [판단]

→ 약화: ① 2027 성장의 대부분이 인수(Cogentrix)·Meta 계약 — 기존 자산 무기 성장 약 +1% ② 텍사스 주지사 교체·데이터센터 모라토리엄 공약·ERCOT 부하 전망 하향 ③ 신규 원전 계약 공백(Comanche Peak 2호기·Beaver Valley "대화 단계") ④ FCF/주 2027 $16 → $14 ⑤ 원전 발전 비중 하락(23.4% → 20.7%, Cogentrix로 추가 하락)

③ 국면 판단
→ 델타 가속(GAAP 영업이익 YoY +7.4% → +64.5%, +57.1%p, 매출 YoY도 +33.2%p — 강한 가속) + 내러티브 약화(추정치·멀티플 하향, 원전 계약 지연) → **경계 구간**
→ 내러티브 판정 근거: 스토리 자체(원전 계약형 전환)는 유지되나 타이밍 지연(텍사스 원전 계약)과 TP·EPS 추정 하향이 동반 — 판정표의 "약화" 정의에 해당 [판단]
→ 보고 이익은 강한 가속이지만 그중 미실현 헤지 이익 $559M이 크고(제외 시 +34.5% [참고]), 기초 이익(조정 EBITDA)의 4Q26 가이던스 역산 YoY는 마이너스다. BT 프레임상 **숫자는 적극 구간 신호, 내러티브 약화가 이를 상쇄 → 텍사스 정책·원전 계약 이벤트를 확인하며 대기하는 구간** [판단]

④ 트리거와 리스크
→ 트리거: ① Comanche Peak 2호기 1,200MW 또는 Beaver Valley 하이퍼스케일러 원전 PPA ② 4Q26 조정 EBITDA $1.74B+(YoY 플러스) ③ PJM 2028/29 이후 용량가격 상한 유지 + 업레이트 일정 가속
→ 리스크: ① 텍사스 데이터센터 모라토리엄 법제화(2027 의회) ② ERCOT 선도가격 $30/MWh대 고착 → 2028 비헤지 22% 노출 ③ PJM 용량시장 개편(가격 상한·하한 재설정)·FERC co-location 규제
