# CATL 3Q26 실적 리뷰 — 매출 +59%인데 이익 +15~17%. 이익 YoY가 4Q25 정점 이후 3개 분기 연속 내려왔고 4Q26은 마이너스 가능성

> 성장 델타: 꺾임 | 내러티브: 약화 → 델타 꺾임 + 내러티브 약화 → 매매 제외 구간 (단위이익 바닥 확인 전까지)

→ **판정 지표**: 한국식 근사 영업이익(= 매출 − 매출원가 − 세금과공과 − 판매비 − 관리비 − R&D, [계산])으로 판정했다. 중국 회계의 营业利润(이하 "중국식 영업이익")은 지분법·정부보조금·공정가치·손상을 포함해 K-IFRS 영업이익과 다르므로 병기만 한다. **세 지표(한국식 영업이익·중국식 영업이익·지배순이익) 모두 같은 방향(3개 분기 연속 YoY 하락)**
→ **숫자**: 3Q26 매출 1,652.2억위안(+58.6% YoY), 영업이익(한국식) 203.2억(+16.7%), OPM 12.3%(-4.4%p), 중국식 영업이익 252.7억(+16.3%), 지배순이익 212.5억(+14.5%, QoQ -5.8%), GPM 20.7%(-5.1%p YoY, -2.5%p QoQ). 영업이익(한국식) YoY가 +93.2%(4Q25) → +86.8%(1Q26) → +56.8%(2Q26) → **+16.7%(3Q26)**, 델타 **-40.2%p**
→ **컨센 대비**: 지배순이익 212.5억은 사전 기대 GS 240억(-11%)·CLSA 250~260억(-15~18%)에 미달, 매출·출하량은 부합~소폭 상회 (东方财富·Tiger 종합, 보도 인용). 발표일 10/21 A주 -12.0%, H주 -11.4% (Yahoo)
→ **쟁점**: (1) 판매량은 ~265GWh(+44~60%)로 사상 최대인데 단위 순이익이 82위안/kWh로 전년 112에서 -27% (GS) — 리튬 재상승·저가 ESS 구계약·수출환급 축소 (2) 9/1 배터리 소비세 2%, 2027-01 수출환급 폐지 — 4Q가 첫 완전 반영 분기이고 고객 분담 협상은 진행 중 (3) 3Q 영업현금흐름 약 14억(2Q 265억) — 운전자본·CapEx 동시 확대 (4) 그래도 점유율은 오른다(글로벌 EV 39.1%, 비중국 33.7%, 북미 ESS 38.8%)
→ **다음 분기 관건**: 4Q26 지배순이익이 4Q25(231.7억) 대비 플러스인지. 셀사이드 연간 추정 역산으로 JPM 약 218억(-6%) ~ UBS 약 257억(+11%) [계산] — 마이너스면 "꺾임" 확정, GPM 21% 이상 방어 + 소비세 분담 합의면 둔화로 완화

| Jefferies (Buy, A TP 535) | 2027 단위이익·이익 -10% 시 P/E 12x(A)·16x(H) | 하향을 감안해도 밸류는 낮다 |

→ (출처: Tiger Brokers 종합, 东方财富 10/21 — 보도 인용)

(1-3) 공통 vs 갈림
→ 공통: 단위이익은 이미 꺾였고 2027 단위이익 추정도 내려갔다. 물량(점유율)은 문제 없다
→ 갈림: 하락이 "믹스·정책 일회성"(회사·GS: 2027 분담으로 회복)인지, "판가 협상력 약화"(JPM: 완성차 압박·내재화)인지

(1-4) [판단]
→ 숫자는 JPM 쪽에 가깝다. 매출총이익이 QoQ로 정체(342.2 → 341.8억)한 것은 소비세(세금과공과 계정, GP 아래)와 무관한 **원가·판가 문제**다. 리튬 상승(2025 중반 6만 → 2026-06 21만 위안/톤 돌파)에 연동 조항이 있어도 시차 때문에 GP가 먼저 눌리는 구조로 본다. 4Q26 GPM이 21% 이상으로 반등하면 "믹스" 설명이 맞고, 20% 아래면 구조적 하락이 확인된다 `[판단]`

(2) **소비세·수출환급 폐지 비용을 누가 떠안나**

(2-1) 회사 설명
→ 리튬전지 소비세: 2026-09-01 2% (과도 세율) → 2027-09 4%. 수출 증치세 환급: 2026-04-01 9% → 6%, **2027-01-01 폐지** (CnEVPost 10/21, Gasgoo 10/22)
→ CFO 정수: 소비세는 가격에 내재(가내세)라 하류 전가는 고객과 재협상이 필요, "비용 분담 협상은 진행 중". 아직 재무제표에 결과 미반영 (CnEVPost 10/21)

(2-2) 시장 해석

| 출처 | 핵심 가정 | 논리 |
|---|---|---|
| GS | 2026 CATL 전액 부담, 2027 고객 분담 | 업계 1위 협상력 |
| JPM | 새 세금이 CATL 손익에 머문다 — 협상 타결 전까지 | 완성차 이익 압박으로 전가 어려움 |
| 회사 | 일부 압박은 일시적 | 신제품·신기술·분담 협상 |

(2-3) 공통 vs 갈림
→ 공통: 4Q26이 소비세 첫 완전 반영 분기(3개월), 2027-01부터 수출환급 0% — **2027 상반기까지 정책 비용이 계단식으로 커진다**
→ 갈림: 전가 비율과 시점

(2-4) [판단]
→ 3Q 세금과공과 +15억(9월 1개월)을 단순 3배하면 4Q 약 45억으로 3Q 영업이익의 약 22% 규모 ⚠️추정 (9월에 일회성 계상 여부 미확인). 2027-09 세율 4%로 오르기 전 분담 합의가 나오는지가 2027 이익 추정의 1번 변수 `[판단]`

(3) **영업현금흐름 급감과 CapEx 재가속**

(3-1) 회사 설명
→ 3Q 영업CF 약 14억 (2Q 265억) [계산: 9M 616 − 1H 602]: 선급금 확대, 상류 결제기간 단축, 공급사 증설 지원 — 지원은 2~3개 분기 더 이어진다 (Tiger 종합, longportapp). 현금+거래성금융자산 4,300억+
→ 일부 해외 AC측(시스템) 프로젝트는 출하에서 매출 인식까지 6개월~1년 이상 (같은 출처)

(3-2) 숫자
→ 3Q26말 재고 1,448억 (연초 +53%), 매출채권 1,129억 (+48%), 선급금 265억 (+85%), 단기차입 399억 (연초 129억), 사채 527억 (연초 34억) (3Q26 보고서 원문·东方财富)
→ CapEx 3Q 171억 (+73% YoY), 9M 422억 — 2025 연간(423억)과 같은 수준을 9개월에 [계산]. 3Q FCF 약 -157억 (GS 집계 -156.9억) → 순현금 2,728억(2025말) → 2,427억 [계산]

(3-3) 공통 vs 갈림
→ 공통: 순현금이 커서 재무 위험은 아니다. 다만 "현금 창출 기계"라는 2023~2025 내러티브(FCF 592 → 658 → 909억)는 2026에 쉬어 간다
→ 갈림: 재고 증가가 물량 대비(수요 대응)인지, 리튬 고점 재고(손상 리스크)인지

(3-4) [판단]
→ 3Q 자산손상 17.1억(리튬가 연동 재고 충당)이 이미 나왔다. 리튬이 꺾이면 재고 손상이 커지고, 계속 오르면 셀 마진이 눌린다 — **어느 쪽이든 2H26 이익엔 부담**인 비대칭 구간 `[판단]`

(4) **2027 수요 +20~30%와 ESS 4Q 감소**

(4-1) 회사 설명
→ 2027 글로벌 동력+ESS 배터리 수요 +20~30%는 "달성 가능하고 높지 않다". 중국 승용 판매는 2026 소폭 감소했지만 전동화율·대당 탑재량(9M 69.5kWh, +32%) 상승, 유럽 전동화 지속, 미국은 성장 제한 (Gasgoo 10/22, Tiger 종합)
→ ESS: 해외 수요는 자신, 중국 국내는 불확실 — 설치·인수 갭과 채널 재고 우려로 국내 ESS 성장이 기대보다 낮을 수 있음 (longportapp 정리)

(4-2) 시장 해석
→ JPM 2027 수요 +20~25% (회사보다 보수), UBS "20~30% 달성 가능" (Tiger 종합)

(4-3) [판단]
→ 물량 쟁점은 이번 분기 약세의 원인이 아니다. 1H26 가동률 94.9%, 건설 중 CAPA 764GWh는 물량 성장 의지를 보여 준다. 다만 **신규 CAPA의 2027~28 수주 커버율을 회사가 밝히지 않았다**(longportapp) — 물량 성장 + 단위이익 하락이 겹치면 "증설해서 마진을 내주는" 2022년 패턴과 닮는다 `[판단]`

(5) **해외 — 유럽 현지화와 미국 규제**

(5-1) 숫자·회사 설명
→ 점유율 (SNE Research): 글로벌 EV 1~9월 39.1% (389.2GWh, +24.9%) / 비중국 EV 33.7% (전년 28.6%, +46.7%) — 같은 기간 한국 3사 합산 38.2% → 26.5% / 유럽 CATL 96.8GWh (+35.4%) / ESS 1H26 글로벌 27.1%, **북미 38.8%** (CnEVPost 8/4·11/2·11/5)
→ 해외 공장: 독일 14GWh·헝가리 1기 생산 개시(시험생산 9/22, 최종 100GWh), 스페인 50GWh JV 순조 (Tiger 종합, PR Newswire 9/22). 현지 생산이 무역 장벽 일부 회피 (东方财富 10/21)
→ VW T6 LFP 수주 진행 (东方财富 10/21)

(5-2) 미국 리스크
→ 2026-08-26 행정명령 14420 — 대규모 ESS·인버터 등 전력망 장비의 우려국 관련 품목을 금지·조건부 허가 가능, 시행규칙 120일 내 (Korea Herald 9/15). 9/8 교통부 장관이 Ford에 CATL 관계 단절 서한. Ford 미시간 라이선스 공장은 6월 양산 개시, ESS용 연 20GWh+ 계획 (CarScoops 7/1)

(5-3) [판단]
→ **BT 배터리 섹터 가설 1("미국 ESS는 사실상 한국 셀 독점 구간")과 충돌하는 숫자**: 1H26 북미 ESS 출하 점유율 CATL 38.8% vs LGES 13.6%·SDI 6.1%. 다만 SNE 출하 기준은 2025 이전 계약분 인도가 섞여 있고, EO 14420 시행규칙(2026-12 말 전후)이 신규 설치를 막으면 2027부터 숫자가 바뀐다 — 가설 1의 검증 지표를 "북미 ESS 출하 점유율"로 바꿔 추적할 필요 `[판단]`

④ 낙관 vs 보수

→ 낙관 (GS Buy A TP 507·H TP 777, Jefferies Buy A TP 535): 정책 비용은 2027부터 고객과 분담, 점유율·물량 우위 불변, 하향 후에도 2027 P/E 10~12x(A)로 싸다
→ 보수 (JPM H 중립·TP 725 → 500, Citi A TP 500 → 479): 완성차 이익 압박 속 소비세·환급 폐지·무역장벽이 업계 수익성을 예상보다 빨리 떨어뜨린다
→ 셀사이드 vs 주가: 등급은 대부분 매수 유지인데 A주는 10/20 259.08 → 10/22 220.41 (-14.9%, 2거래일) → 11/13 237.70, ATH(468.75) 대비 -49% [Yahoo] — **시장은 셀사이드보다 단위이익 하락을 더 길게 본다** [판단]

⑤ 추정치·TP 변화 (압축)

| 출처 | 직전 TP | 현재 TP | 4Q26 순이익 E | 2026E / 2027E 순이익 | 핵심 변화 |
|---|---|---|---|---|---|
| GS (Buy) | A 559 / H 859 | A 507 / H 777 | — | EPS -4~7% (2026~28) | 소비세 2026 전액 부담 가정 |
| JPM (A 비중확대 / H 중립↓) | H 725 | H 500 | 217.7 [계산] | 863 / 939 (-4% / -6%) | H주 등급 하향, 단위이익 하향 |
| UBS (Buy, H) | 820 | 730 | 256.7 [계산] | 902 (-11~14%, 2026~28) | 단위이익 자신감 약화 |
| Citi | A 500 / H 765 | A 479 / H 732 | — | — | |
| Jefferies (Buy, A) | — | 535 | — | 하향 민감도 -10% 제시 | 밸류 근거 매수 유지 |

→ (출처: Tiger Brokers 종합, 东方财富 10/21 — 보도 인용. TP 단위: A주 위안, H주 HK$)
→ TP 하향 6건(A 2·H 4), 상향 0건. 평균 하향률 A주 -6.8%, H주 -14.0% [계산: GS·Citi A / GS·JPM·UBS·Citi H 단순 평균]
→ **A주 TP 하향은 실적 하향(EPS -4~14%)과 거의 같은 폭, H주 TP 하향은 실적보다 크다(JPM -31%)** — H주는 A주 대비 프리미엄(+32%, 11/13 [계산]) 축소, 즉 **멀티플 하향이 겹쳤다** `[판단]`

## 3. 내러티브 점검

① 성장 스토리 정의
→ "세계 EV 배터리 40%를 쥔 원가 1위 셀 메이커 — LFP·소재 수직계열화로 사이클 저점에서도 두 자릿수 마진을 내고, ESS·유럽 현지화로 물량을 계속 키우며, 배당성향 50%로 현금을 돌려준다"

② 이번 분기가 스토리에 준 영향
→ 유지: 점유율 상승(글로벌 39.1%, 비중국 33.7%, 북미 ESS 38.8%), 판매량 사상 최대, 유럽 공장 가동, 2027 수요 +20~30% 발언
→ 약화: **"저점에서도 두 자릿수 마진"의 마진 쪽** — 한국식 OPM 12.3%로 2023년(11.3%) 수준까지 내려왔고, 리튬 상승·정책 비용·완성차 단가 압박이 동시에 작용. 현금흐름 내러티브도 2026에 쉬어 간다
→ 추정치·TP 전면 하향 + H주 디레이팅 → **내러티브 약화** (훼손은 아님 — 물량·점유율 전제는 그대로)

③ 국면 판단
→ 델타 꺾임(영업이익 YoY +87 → +57 → +17%, 3개 분기 연속 하락 + 4Q26 순이익 YoY -6~+11% 경로로 정점 통과) + 내러티브 약화 → **매매 제외 구간**
→ 한국 셀과 비교: LGES·SDI는 3Q26 ESS로 이익 **개선** 국면, CATL은 이익 **감속** 국면 — 같은 서브섹터 안에서 델타 방향이 반대다. 마진 격차(보조금 제외 OPM)는 CATL 12.3% vs LGES 3.5%·SDI 6.1%로 아직 6~9%p `[판단]`

④ 트리거와 리스크
→ 트리거: ① 소비세·환급 비용 고객 분담 합의 공시 ② 4Q26 GPM 21% 이상 반등(ESS 시스템 신계약 믹스) ③ 나트륨이온 4Q26 양산·钠电 ESS 출하로 리튬 의존 축소
→ 리스크: ① 4Q26 순이익 YoY 마이너스(JPM 경로) ② 리튬 추가 상승 or 급락 시 재고 손상 ③ 미국 EO 14420 시행규칙이 CATL 셀 ESS·라이선스 공장까지 포함

## 4. 향후 봐야 할 것

① **4Q26 이익 YoY 부호와 GPM** (델타 판정 1순위)
→ 무엇을: 4Q26 지배순이익이 4Q25 231.7억 대비 플러스인지 (JPM 역산 217.7 vs UBS 256.7), 한국식 OPM 12% 유지, GPM 21% 이상
→ 어떤 데이터로: 2026 연차보고서(4Q = 연간 − 9M), 1월 업적 예고(业绩预告) 공시 여부
→ 언제: 2027-01 (예고 시) ~ 2027-03 중순

② **소비세·수출환급 비용 분담 합의**
→ 무엇을: 고객 분담 비율·판가 인상 공지, 4Q 세금과공과 규모(3Q 22.1억), 2027-01 수출환급 폐지 후 해외 GPM 30% 유지 여부
→ 어떤 데이터로: 회사 IR 기록(投资者关系活动记录表), CATL 온라인몰 셀 판가, 보도
→ 언제: 2026-12 ~ 2027-1H

③ **단위이익·리튬 가격**
→ 무엇을: 분기 단위 순이익 82위안/kWh(3Q26) 바닥 여부, 탄산리튬 21만 위안/톤 전후 방향, 재고 손상
→ 어떤 데이터로: SMM·上海钢联 탄산리튬 가격, 셀사이드 4Q 리뷰의 단위이익
→ 언제: 매주 / 2027-03

④ **영업현금흐름·CapEx**
→ 무엇을: 분기 영업CF 200억대 회복(3Q 14억), CapEx 분기 170억 지속 여부, 순현금 2,400억 유지
→ 어떤 데이터로: 2026 연차보고서 현금흐름표
→ 언제: 2027-03

⑤ **해외 점유율과 미국 규제**
→ 무엇을: SNE 비중국 EV 점유율 33.7% 유지·북미 ESS 38.8% 추이, 헝가리 양산 램프업, 미국 EO 14420 시행규칙(배터리 ESS 포함 여부)
→ 어떤 데이터로: SNE Research 월간 발표, 미 에너지부 규칙, Ford 미시간 공장 뉴스
→ 언제: 2026-12 말 (EO 120일) ~ 2027-1Q
