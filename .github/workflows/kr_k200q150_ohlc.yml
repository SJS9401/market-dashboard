name: kr-k200q150-ohlc-backfill

on:
  workflow_dispatch:
  schedule:
    - cron: '5 19 * * *'    # 04:05 KST temp - remove after backfill completes
    - cron: '35 22 * * *'   # 07:35 KST safety net - remove after backfill completes

permissions:
  contents: write

concurrency:
  group: kr-k200q150-ohlc
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run backfill
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          MAX_DAYS: '3300'
        run: python kr_k200q150_ohlc_backfill.py
      - name: Validate (informational)
        continue-on-error: true
        run: |
          python - <<'EOF'
          import gzip, json
          h = json.loads(gzip.decompress(open('data/kr_k200q150_ohlc.json.gz','rb').read()))
          print('dates', len(h['dates']), 'days', len(h['days']), 'last', h.get('last_date'), 'codes', len(h['codes']))
          d = h['days'][-1]
          print('last day size', len(d))
          v = next(iter(d.values()))
          print('sample', v)
          EOF
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr_k200q150_ohlc.json.gz
          git diff --cached --quiet || git commit -m "kr_k200q150_ohlc backfill chunk"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push retry $i"; sleep 20
          done
