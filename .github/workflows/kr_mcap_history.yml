name: kr-mcap-history-backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr-mcap-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run backfill chunk
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          MAX_DAYS: '1200'
          START: '20100104'
        run: python kr_mcap_history_backfill.py
      - name: Validate
        run: |
          python - <<'EOF'
          import gzip, json
          h = json.loads(gzip.decompress(open('data/kr_mcap_history.json.gz','rb').read()))
          assert len(h['dates']) == len(h['days']) == len(h['tot']) > 10
          print('dates', len(h['dates']), 'first', h['dates'][0], 'last', h.get('last_date'), 'codes', len(h['codes']))
          print('first tot', h['tot'][0], 'last tot', h['tot'][-1])
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr_mcap_history.json.gz
          git diff --cached --quiet && echo "no changes" || git commit -m "kr_mcap_history backfill chunk"
          git push || (git pull --rebase --autostash && git push)
