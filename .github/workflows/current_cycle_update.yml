# 되살리는 법:
#   1) 아래 on: 블록의 schedule 주석을 해제
#   2) 'Commit + push if changed' 스텝의 주석(#) 해제
#   3) 단, 그 순간부터 Current_cycle.html 은 GitHub Actions 관리 파일이 되어
#      로컬(deploy_dashboard.bat) 수정이 force-restore 로 덮어써진다는 점에 유의
#
# 원래 스케줄: 06:45 / 07:45 / 11:45 KST (yahoo_dashboard_update 직후)
# ----------------------------------------------------------

name: Current Cycle Update (disabled)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '45 21 * * *'   # 06:45 KST
  #   - cron: '45 22 * * *'   # 07:45 KST
  #   - cron: '45 2 * * *'    # 11:45 KST

permissions:
  contents: write

concurrency:
  group: current-cycle-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: false   # DISABLED — 수동 실행해도 스킵. 되살리려면 이 줄 제거.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build (dry-run only)
        run: |
          python build_current_cycle.py
          echo "DISABLED: commit/push skipped"

