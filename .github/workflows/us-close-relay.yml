name: US Close Relay (KIS)

on:
  schedule:
    - cron: '40 21 * * 1-5'   # 06:40 KST 화~토 (미 마감 후, EST/EDT 모두 커버)
  workflow_dispatch:
    inputs:
      probe:
        description: 'PROBE mode (1 = raw response log)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run relay
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          PROBE: ${{ github.event.inputs.probe || '0' }}
        run: python3 scripts/us_close_relay.py

      - name: Commit data
        run: |
          git config user.name "us-close-relay"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add data/us_close_*.json
          git diff --cached --quiet || git commit -m "us_close $(date -u +%Y-%m-%d) [skip ci]"
          git push
