# US Close Relay (KIS) — 미국장 마감 릴레이
# ----------------------------------------------------------
# 2026-09-09 장애 수정 — push 재시도 5회 루프 + concurrency 그룹 + 슬롯 1개→4개.
#   구 코드는 `git pull --rebase || true` 를 git add 보다 먼저 실행해 매번 실패했고
#   `|| true` 가 그걸 삼켰다. 그 상태로 push 하니 커밋 경합 순간 non-fast-forward 로 사망.
# 2026-09-10 슬롯 4개 → 6개 (여름 전용 05:25·05:45 추가)
# 2026-09-11 대기 루프 + 04:30 슬롯 신설 (wait_for_close)
#
# ----------------------------------------------------------
# 2026-09-12 ★★ 크론 전면 재배치 — 04:30 슬롯은 실패했다.
#
# [실측] 9/12 새벽 kis-relay 7슬롯 전수 발화 지연:
#   19:30→21:51(+141) / 20:25→22:39(+134) / 20:45→22:47(+122) / 21:05→23:10(+125)
#   21:25→23:24(+119) / 21:45→23:31(+106) / 22:05→00:09(+124)  [모두 UTC]
#   → 평균 약 125분. market-dashboard 도 동일(9/11 22:33Z vs kis-relay 22:29Z, 4분 차).
#
# [A/B 결론] 전용 리포 분리는 효과 없음. 지연은 리포 단위가 아니라 계정·플랫폼 단위다.
#   9/11 md 22:33:49Z vs kis 22:29:30Z (4분) / 9/12 md 21:49:35Z vs kis 21:52:53Z (3분)
#   — 이틀 연속 오차 범위, 방향도 엇갈렸다.
#
# [04:30 슬롯이 왜 안 먹혔나] 19:30 UTC 예약이 21:51 UTC 에 발화했다.
#   마감(20:00 UTC)을 이미 지난 시각이라 market_closed() 가 즉시 True →
#   대기 루프가 한 번도 돌지 않았다(notes 에 「마감 대기」 줄 없음). 착지 06:51 KST.
#   대기 루프를 쓰려면 **크론을 마감보다 지연폭(약 2시간)만큼 더 앞에** 놔야 한다.
#
# [대응] 크론을 17:05~19:25 UTC(02:05~04:25 KST)로 이동.
#   지연  60분 → 18:05 발화 → 115분 대기 → 20:05 착지 (05:05 KST)
#   지연 125분 → 19:10 발화 →  50분 대기 → 20:05 착지 (05:05 KST)
#   지연 240분 → 21:05 발화 → 대기 0분   → 21:05 착지 (06:05 KST)
#   어떤 지연값에서도 구 배치보다 이르게 착지한다. 최종 안전망으로 21:05 UTC 1슬롯 유지.
#
# [겨울] 대기 루프가 뉴욕 시계를 직접 보므로 서머타임 전환이 자동 흡수된다.
#   겨울 마감 21:00 UTC 기준 17:05 발화 시 대기 235분 — MAX_WAIT_MIN(300) 안이다.
#   11/1 전환일에 손댈 것 없음. 구 규격의 "겨울엔 06:25가 첫 유효 슬롯"은 적용되지 않는다.
#
# ----------------------------------------------------------
# 2026-09-29 ★ 지연 325분 사고 — 슬롯 3개 앞당김 + 대기 상한 330분
#
# [실측] 9/28 1차 슬롯(17:05 UTC)이 22:30 UTC 에 발화(+325분). 9/17~9/25 는 +148~+235분.
#   마감(20:00 UTC)을 이미 지나 대기 루프가 한 번도 돌지 않고 즉시 수집 → 착지 07:31 KST.
#   데일리 프리뷰 실행(07:01 KST)을 30분 넘겨, 프리뷰는 파일이 없는 것으로 보고 폴백으로 돌았다.
#   → 지연이 사다리 최대 커버(약 240분)를 넘으면 착지 시각이 지연폭을 그대로 따라간다.
#
# [대응] 15:05 / 15:35 / 16:05 UTC(00:05 / 00:35 / 01:05 KST) 신설. 기존 7슬롯 중 17:25 는 정리.
#   대기 상한 MAX_WAIT_MIN 300 → 330 (scripts/us_close_relay.py), timeout-minutes 350 → 358.
#   ★ GitHub 잡 하드리밋 = 360분. 470 같은 값을 적어도 360분에 강제 종료된다 — 358 이 상한.
#   너무 일찍 깨서 대기가 330분을 넘는 슬롯은 [SKIP] 으로 조용히 나가고 다음 슬롯이 잇는다
#   (파일을 건드리지 않으므로 이른 슬롯을 늘려도 부작용 없음).
#
#   여름(마감 20:10 UTC 수집) 15:05 발화 기준 착지:
#     지연   0분 → 15:05 발화 → 대기 305분 → 20:10 착지 (05:10 KST)
#     지연 200분 → 18:25 발화 → 대기 105분 → 20:10 착지 (05:10 KST)
#     지연 325분 → 20:30 발화 → 대기   0분 → 20:30 착지 (05:30 KST)  ← 9/28 실측값
#     지연 410분 → 21:55 발화 → 즉시 수집   → 21:55 착지 (06:55 KST)  ← 07:01 전 마지노선
#   겨울(마감 21:10 UTC 수집) 15:05·15:35 는 대기 초과로 SKIP, 16:05 슬롯(대기 305분)이 주력이 된다.
#   410분을 넘는 지연은 구조적으로 못 막는다 — 프리뷰 쪽 폴백 경로는 계속 유지할 것.
#
# [커밋 메시지] 실행일(UTC)이 아니라 스크립트가 산출한 base_date(세션일)를 쓴다.
#   자정을 넘겨 착지한 날도 커밋 로그만 보고 어느 세션분인지 읽히게.
# ----------------------------------------------------------
# [스케줄 근거] ⚠ 정각(:00)·:30 금지 — 2026-06-02 정각 cron 통째 skip 사고 전례.
#   already_have 가드가 있어 앞 슬롯이 성공하면 뒤 슬롯은 자동 스킵(커밋 하루 1건 유지).
#   concurrency 가 직렬화하므로 대기 중인 러너는 항상 1개다.
# ----------------------------------------------------------

name: US Close Relay (KIS)

concurrency:
  group: us-close-relay
  cancel-in-progress: false

on:
  schedule:
    # ⚠ 정각(:00)·:30 회피 필수 — 2026-06-02 정각 cron 통째 skip 사고 전례
    # 전부 대기 루프 전제 슬롯. 마감 전에 깨면 마감까지 자고, 마감 후에 깨면 즉시 수집.
    - cron: '05 15 * * 1-5'   # 00:05 KST — 0차 ★주력 (2026-09-29 신설, 여름: 지연 410분까지 07:01 전 착지)
    - cron: '35 15 * * 1-5'   # 00:35 KST — 0.5차 (2026-09-29 신설)
    - cron: '05 16 * * 1-5'   # 01:05 KST — 1차 (2026-09-29 신설, 겨울 주력 / 지연 325분 = 9/28 실측 커버)
    - cron: '05 17 * * 1-5'   # 02:05 KST — 2차 (구 1차)
    - cron: '45 17 * * 1-5'   # 02:45 KST — 3차
    - cron: '05 18 * * 1-5'   # 03:05 KST — 4차
    - cron: '45 18 * * 1-5'   # 03:45 KST — 5차
    - cron: '25 19 * * 1-5'   # 04:25 KST — 6차
    - cron: '05 21 * * 1-5'   # 06:05 KST — 7차 ★최종 안전망 (앞 슬롯이 전부 실패한 날 대비)
  workflow_dispatch:
    inputs:
      probe:
        description: 'PROBE mode (1 = raw response log)'
        required: false
        default: '0'
      force:
        description: 'FORCE mode (1 = 같은 거래일이어도 재수집·재커밋)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 358   # ★ 대기 루프가 최대 330분 자므로 20분으로는 죽는다 (2026-09-11). GitHub 하드리밋 360 아래 (2026-09-29)
    steps:
      - uses: actions/checkout@v4

      - name: Run relay
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          PROBE: ${{ github.event.inputs.probe || '0' }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: python3 scripts/us_close_relay.py

      - name: Commit data
        run: |
          set -e
          git config user.name "us-close-relay"
          git config user.email "actions@users.noreply.github.com"
          git add data/us_close_*.json
          if git diff --cached --quiet; then
            echo "no changes — skip"; exit 0
          fi
          # 커밋 메시지 = 세션일(base_date). 실행일(UTC)이 아니다 (2026-09-29)
          SD=$(python3 -c "import json;print(json.load(open('data/us_close_latest.json')).get('base_date','unknown'))" 2>/dev/null || echo unknown)
          git commit -m "us_close ${SD} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed (attempt $i)"; exit 0
            fi
            echo "push rejected — rebase & retry ($i/5)"
            git pull --rebase --autostash
            sleep $((i * 5))
          done
          echo "::error::push 5회 실패 — 커밋 경합 지속"; exit 1
