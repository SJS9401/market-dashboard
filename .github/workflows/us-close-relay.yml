# US Close Relay (KIS) — 미국장 마감 릴레이
# ----------------------------------------------------------
# 2026-09-09 장애 수정 (스케줄 실행 #2·#3 연속 실패)
#
# [원인] Commit data 스텝의 git push 가 거부되면 그대로 죽었다.
#   구 코드는 `git pull --rebase || true` 를 git add 보다 먼저 실행했는데,
#   그 시점엔 스크립트가 이미 JSON 을 써놔서 unstaged changes 로 매번 실패했고
#   `|| true` 가 그걸 삼켰다 — 도입 이후 단 한 번도 동작한 적이 없다.
#   그 상태로 push 하니 다른 워크플로와 커밋이 겹치는 순간 non-fast-forward 로 사망.
#   #1(수동)이 성공한 건 그 시각에 경쟁 커밋이 없었기 때문이지 pull 이 됐기 때문이 아니다.
#
# [대응]
#   - push 재시도 5회 루프 (add → commit 이후에 pull --rebase, 순서 교정)
#   - concurrency 그룹 (리포 24개 중 16개가 이미 보유, 릴레이만 누락이었음)
#   - 슬롯 1개 → 4개. 06시대 혼잡을 14회 → 8회로 줄인 뒤 그 사이에 끼워 배치
#     (Dotcom·Multiasset 아침 슬롯 삭제 / Yahoo·US Breadth 4연발 → 2연발)
#
# ----------------------------------------------------------
# 2026-09-10 슬롯 4개 → 6개 (여름 전용 05:25·05:45 추가)
#
# [근거] 9/9 수정 자체는 정상 작동했다. 9/10 산출물은 generated_at 08:01:03 KST /
#   base_date 2026-09-09 / rank 60행으로 제대로 생성됐다. 그런데도 데일리는 폴백으로 나갔다 —
#   마지막 슬롯 07:05 대비 착지가 약 56분 늦어 데일리 수집창 마감 07:15 를 넘겼기 때문이다.
#   남은 문제는 '생성 실패'가 아니라 '발화 지연'이다. 지연 자체는 못 없애므로
#   여름 마감(05:00 KST) 직후까지 사다리를 늘려 60분 지연에도 07:15 안에 착지하게 한다.
#   already_have 가드가 있어 앞 슬롯이 성공하면 뒤 슬롯은 자동 스킵된다(커밋은 하루 1건 유지).
#
# [스케줄 근거]
#   ⚠ 정각(:00)·:30 금지 — 2026-06-02 정각 cron 통째 skip 사고로 ^IXIC 14h 누락 전례.
#   실측 발화 지연은 12~20분(다른 워크플로 14일 관측). 릴레이 #2·#3 은 118분, 9/10 은 56분이었다 —
#   신규 워크플로 등록 지연만으로는 설명되지 않으므로 발화 시각 관측을 계속한다.
#   서머타임: 여름 마감 05:00 KST / 겨울 06:00 KST. cron 은 UTC 고정이라 계절을 못 따라가므로
#   스크립트가 뉴욕 시각을 직접 보고 마감 전이면 파일을 건드리지 않고 종료한다.
#   → 겨울엔 05:25·05:45·06:05 가 자동 스킵되고 06:25 가 첫 유효 슬롯이 된다. 11/1 전환일에 손댈 것 없음.
#
#   데일리 프리뷰 수집창 마감 07:15 KST. 07:05 슬롯은 도착이 07:25경이라 당일 브리핑은
#   놓치지만 파일은 확보된다(익일 회차·위클리용).
# ----------------------------------------------------------

name: US Close Relay (KIS)

concurrency:
  group: us-close-relay
  cancel-in-progress: false

on:
  schedule:
    # ⚠ 정각(:00)·:30 회피 필수 — 2026-06-02 정각 cron 통째 skip 사고 전례 (yahoo/us_breadth 주석 참조)
    - cron: '25 20 * * 1-5'   # 05:25 KST — 1차 ★여름 첫 유효 슬롯 (마감 25분 후 / 겨울은 스크립트가 스킵)
    - cron: '45 20 * * 1-5'   # 05:45 KST — 2차 (여름 전용)
    - cron: '05 21 * * 1-5'   # 06:05 KST — 3차
    - cron: '25 21 * * 1-5'   # 06:25 KST — 4차 ★겨울 첫 유효 슬롯
    - cron: '45 21 * * 1-5'   # 06:45 KST — 5차
    - cron: '05 22 * * 1-5'   # 07:05 KST — 6차 (도착 07:25경, 당일 브리핑은 놓치나 파일은 확보)
  workflow_dispatch:
    inputs:
      probe:
        description: 'PROBE mode (1 = raw response log)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run relay
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          PROBE: ${{ github.event.inputs.probe || '0' }}
        run: python3 scripts/us_close_relay.py

      - name: Commit data
        run: |
          set -e
          git config user.name "us-close-relay"
          git config user.email "actions@users.noreply.github.com"
          git add data/us_close_*.json
          if git diff --cached --quiet; then
            echo "no changes — skip"; exit 0
          fi
          git commit -m "us_close $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed (attempt $i)"; exit 0
            fi
            echo "push rejected — rebase & retry ($i/5)"
            git pull --rebase --autostash
            sleep $((i * 5))
          done
          echo "::error::push 5회 실패 — 커밋 경합 지속"; exit 1
