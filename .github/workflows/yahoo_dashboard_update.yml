# Yahoo Dashboard Cache Update (CORS proxy 의존성 제거)
# ----------------------------------------------------------
# dashboard.html 가 야후에서 직접 fetch 하던 12개 symbol 을
# GitHub Actions 가 매일 yfinance 로 fetch → data/yahoo_dashboard.json commit.
# dashboard.html getData() 는 JSON cache 우선, fail 시 야후/proxy fallback.
#
# 사고 배경 (2026-05-27):
#   - 야후 query1.finance.yahoo.com 가 sjs9401.github.io origin 에 503 차단
#   - corsproxy.io / api.allorigins.win 도 fragile (오늘 다운, 내일 부활)
#   - 사이트 카드 로딩 멈춤 사고 재발 방지
#
# 스케줄 (2026-09-09 갱신 — 주석과 실제가 어긋나 있던 것을 바로잡음):
#   실측 14일간 첫 커밋이 매일 06:55~56 고정이었다. 즉 구 4연발(06:05/15/25/35) 중
#   앞 세 번은 야후 데이터 미갱신 상태에서 헛돌았고 06:35 슬롯만 실제로 일했다.
#   BT 확인 시각이 07시 이후라 2연발로 충분하다는 판단(2026-09-09 BT 결정).
#   ⚠ 정각(:00)·:30 회피는 유지 — 2026-06-02 skip 사고.
#   - 06:15 KST (21:15 UTC) — 1차, 조기 갱신 대비 보험
#   - 06:35 KST (21:35 UTC) — 2차, 실질 일꾼 (도착 06:55경)
#   - 07:35 KST (22:35 UTC) — 3차, 1·2차 skip 시 후행
#   - 11:35 KST (02:35 UTC) — 안전망
#   - 17:35 KST (08:35 UTC) — 한국 종가 당일 반영
#   - workflow_dispatch: 수동 실행

name: Yahoo Dashboard Update

on:
  schedule:
    # 옵션 B 유지: 정각(:00, :30) 회피 (2026-06-02 정각 cron skip 사고).
    # 2026-09-09: 06:05/06:25 삭제 — 실측 14일간 첫 커밋이 매일 06:55(=06:35 슬롯 도착)로
    #   앞 세 번은 데이터 미갱신 상태에서 헛돌고 있었음. BT 확인 시각이 07시 이후라 2회로 충분.
    - cron: '15 21 * * *'   # 06:15 KST — 1차 (조기 갱신 대비 보험)
    - cron: '35 21 * * *'   # 06:35 KST — 2차 (실질 일꾼, 도착 06:55경)
    - cron: '35 22 * * *'   # 07:35 KST — 3차 (1·2차 skip 시 후행)
    - cron: '35 2 * * *'    # 11:35 KST — 안전망
    - cron: '35 8 * * *'    # 17:35 KST — 한국 종가 당일 반영
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yahoo-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Fetch yahoo data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}   # ^KS11 야후 지연 시 KRX 보충용 (2026-07-24)
        run: |
          python yahoo_dashboard_backfill.py

      - name: US F&G Oscillator 재계산
        run: python -u us_fg_oscillator_build.py
        continue-on-error: true

      - name: KR F&G Oscillator 재계산 (^KS11 아침 유입분 반영 — 전일 값 완성)
        run: python -u kr_fg_oscillator_build.py
        continue-on-error: true

      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/yahoo_dashboard.json data/us_fg_oscillator.json data/kr_fg_oscillator.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): yahoo_dashboard + fg_oscillator 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push || (git pull --rebase --autostash && git push)
            echo "committed"
          fi
