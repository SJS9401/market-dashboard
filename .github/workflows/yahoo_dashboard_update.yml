# Yahoo Dashboard Cache Update (CORS proxy 의존성 제거)
# ----------------------------------------------------------
# dashboard.html 가 야후에서 직접 fetch 하던 12개 symbol 을
# GitHub Actions 가 매일 yfinance 로 fetch → data/yahoo_dashboard.json commit.
# dashboard.html getData() 는 JSON cache 우선, fail 시 야후/proxy fallback.
#
# 사고 배경 (2026-05-27):
#   - 야후 query1.finance.yahoo.com 가 sjs9401.github.io origin 에 503 차단
#   - corsproxy.io / api.allorigins.win 도 fragile (오늘 다운, 내일 부활)
#   - 사이트 카드 로딩 멈춤 사고 재발 방지
#
# 스케줄 (us_breadth_update 와 동일 패턴):
#   - 21:30 UTC = 한국 06:30 (1차)
#   - 22:30 UTC = 한국 07:30 (2차 — 1차 fail retry)
#   - 02:30 UTC = 한국 11:30 (3차 안전망)
#   - workflow_dispatch: 수동 실행
# ----------------------------------------------------------

name: Yahoo Dashboard Update

on:
  schedule:
    # 옵션 B (2026-06-02): GitHub Actions cron 정각 (`:00`, `:30`) skip 사고 후 정각 회피 + 10분 간격 4단계.
    # 6/2 새벽 06:00·06:30 cron 모두 skip 으로 ^IXIC 6/1 데이터 14h 누락.
    # GitHub Actions docs: "scheduled workflows may be delayed during periods of high loads ... start of every hour."
    # 데일리 프리뷰 07:10~15 전 4번 시도 → 최소 1번은 success.
    - cron: '5 21 * * *'    # 06:05 KST — 1차
    - cron: '15 21 * * *'   # 06:15 KST — 2차
    - cron: '25 21 * * *'   # 06:25 KST — 3차
    - cron: '35 21 * * *'   # 06:35 KST — 4차
    - cron: '35 22 * * *'   # 07:35 KST — 5차 (1-4차 모두 fail 시 후행)
    - cron: '35 2 * * *'    # 11:35 KST — 6차 안전망
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yahoo-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Fetch yahoo data
        run: |
          python yahoo_dashboard_backfill.py

      - name: US F&G Oscillator 재계산
        run: python -u us_fg_oscillator_build.py
        continue-on-error: true

      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/yahoo_dashboard.json data/us_fg_oscillator.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(data): yahoo_dashboard + us_fg_oscillator 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "committed"
          fi
