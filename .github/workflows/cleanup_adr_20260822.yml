# 일회성 정리 워크플로 (2026-08-22 핸드오프 이행)
# ----------------------------------------------------------
# ADR 카드 삭제(2026-08-21)에 따라 dead 가 된 ADR 파이프라인과
# KIS IP 검증용 임시 워크플로를 repo 에서 제거한다.
#   - adr-daily.yml (KRX 웹 로그인 경로 — Actions 해외 IP 차단으로 failure 반복)
#   - adr-backfill.yml, kis-ip-test.yml
#   - scripts/update_adr.py, scripts/backfill_adr.py, data/kr_adr.json
# dashboard.html 은 kr_adr.json 을 참조하지 않음 (F&G ADR factor 는 kr_breadth.json) — 삭제 안전.
# 실행 후 자기 자신도 삭제. workflow_dispatch 전용 (스케줄 없음).
# ----------------------------------------------------------

name: Cleanup ADR pipeline (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: dead 파일 제거 + 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            .github/workflows/adr-daily.yml \
            .github/workflows/adr-backfill.yml \
            .github/workflows/kis-ip-test.yml \
            scripts/update_adr.py \
            scripts/backfill_adr.py \
            data/kr_adr.json \
            .github/workflows/cleanup_adr_20260822.yml; do
            git rm -f --ignore-unmatch "$f"
          done
          if git diff --cached --quiet; then
            echo "::notice::제거할 파일 없음"
          else
            git commit -m "chore: ADR 파이프라인 제거 (카드 삭제에 따른 정리, 2026-08-22 핸드오프)"
            git push || (git pull --rebase --autostash && git push)
            echo "::notice::정리 완료"
          fi
