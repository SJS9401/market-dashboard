name: fetch-case-stocks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance
      - run: python fetch_case_stocks.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr_stock_cases.json
          git diff --cached --quiet && echo "no changes" || git commit -m "case stocks one-shot"
          git push || (git pull --rebase --autostash && git push)
