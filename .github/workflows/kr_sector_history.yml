name: kr-sector-history-backfill

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr-sector-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run backfill chunk
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          MAX_DAYS: '900'
        run: python kr_sector_history_backfill.py
      - name: Validate JSON
        run: |
          python - <<'EOF'
          import json
          h = json.load(open('data/kr_sector_history.json', encoding='utf-8'))
          assert len(h['dates']) > 100, 'too few dates'
          assert len(h['sectors']) == len(h['ret']) == len(h['val'])
          print('dates', len(h['dates']), 'last', h.get('last_date'))
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kr_sector_history.json
          git diff --cached --quiet && echo "no changes" || git commit -m "kr_sector_history backfill chunk"
          git push || (git pull --rebase --autostash && git push)
