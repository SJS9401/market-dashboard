# US Breadth 자동 갱신 (시장폭 200/50MA + 골드만 시장폭 + NH/NL)
# ----------------------------------------------------------
# us_breadth_backfill_local.py 매일 1회 실행 → data/us_breadth.json 갱신
# 데이터 소스: SPX 다중 소스 폴백 (FRED → Yahoo HTTP direct → yfinance) +
#              503 종목 yfinance + Wikipedia (티커 리스트)
#
# 스케줄 (2026-09-09 갱신 — 실측 반영):
#   미국 close 16:00 ET = 한국 05:00 (서머타임 3-11월) / 06:00 (표준시 11-3월).
#   실측 14일간 첫 커밋이 매일 06:56 고정 → 구 4연발(06:05/15/25/35) 중 06:35 만 실제로 일했다.
#   BT 확인 시각이 07시 이후라 2연발로 축소(2026-09-09 BT 결정).
#   ⚠ 정각(:00)·:30 회피 유지 — 2026-06-02 skip 사고.
#   ※ 구 주석의 "BT 데일리 프리뷰 07:10~15 영향"은 현재 클라우드판 브리핑이
#     대시보드를 읽지 않으므로 더 이상 해당하지 않는다.
#   - 06:15 KST (21:15 UTC) — 1차 (보험)
#   - 06:35 KST (21:35 UTC) — 2차 (실질 일꾼, 도착 06:56경)
#   - 07:35 KST (22:35 UTC) — 3차
#   - 11:35 KST (02:35 UTC) — 안전망
#   - workflow_dispatch: 수동 실행

name: US Breadth Update

on:
  schedule:
    # 옵션 B 유지: 정각(:00, :30) 회피 (2026-06-02 정각 cron skip 사고).
    # 2026-09-09: 06:05/06:25 삭제 — 실측 첫 커밋이 매일 06:56 고정.
    - cron: '15 21 * * *'   # 06:15 KST — 1차 (보험)
    - cron: '35 21 * * *'   # 06:35 KST — 2차 (실질 일꾼, 도착 06:56경)
    - cron: '35 22 * * *'   # 07:35 KST — 3차
    - cron: '35 2 * * *'    # 11:35 KST — 안전망
  workflow_dispatch:        # 수동 실행

permissions:
  contents: write           # data/us_breadth.json 커밋/푸시 권한

concurrency:
  group: us-breadth-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests lxml html5lib

      - name: 백필 시작/종료 날짜 계산
        id: dates
        run: |
          # SPX 데이터 시작은 2015-01-01 고정.
          # 종료는 '오늘+1' (UTC) — yfinance 의 end 는 exclusive 라 오늘을 주면 그날 봉이 잘린다.
          # (2026-08-01: 이 때문에 미 마감 3.5h 뒤 실행에도 늘 전일 데이터만 들어오던 버그 수정)
          TODAY=$(date -u +%Y-%m-%d)
          END=$(date -u -d '+1 day' +%Y-%m-%d)
          echo "start=2015-01-01" >> $GITHUB_OUTPUT
          echo "end=${END}" >> $GITHUB_OUTPUT
          echo "백필 기간: 2015-01-01 → ${END} (exclusive, 실효 종료일 ${TODAY})"

      - name: 풀 백필 실행
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -u us_breadth_backfill_local.py --backfill ${{ steps.dates.outputs.start }} ${{ steps.dates.outputs.end }}
        timeout-minutes: 25

      - name: JSON 구조 검증
        run: |
          python - <<'PY'
          import json, sys
          from datetime import date, datetime, timedelta
          d = json.load(open('data/us_breadth.json'))
          required = ['dates', 'spx', 'pct_above_200ma', 'pct_above_50ma',
                      'goldman_breadth', 'new_highs_pct', 'new_lows_pct']
          for k in required:
              if k not in d:
                  print(f"::error::missing key: {k}")
                  sys.exit(1)
              if not isinstance(d[k], list) or not d[k]:
                  print(f"::error::empty: {k}")
                  sys.exit(1)
          n = len(d['dates'])
          last = d['dates'][-1]
          last_d = datetime.strptime(last, "%Y-%m-%d").date()
          today = datetime.utcnow().date()

          # business-day staleness check: count weekdays between last and today
          bd = 0
          cur = last_d
          while cur < today:
              cur += timedelta(days=1)
              if cur.weekday() < 5:  # Mon-Fri
                  bd += 1
          MAX_STALE_BDAYS = 5
          stale = bd > MAX_STALE_BDAYS

          print(f"rows: {n}, last date: {last}  (today={today}, business_days_since_last={bd})")
          print(f"  SPX: {d['spx'][-1]}")
          print(f"  >200MA: {d['pct_above_200ma'][-1]}%  >50MA: {d['pct_above_50ma'][-1]}%")
          print(f"  Goldman breadth: {d['goldman_breadth'][-1]}%p")
          print(f"  NH%: {d['new_highs_pct'][-1]}  NL%: {d['new_lows_pct'][-1]}")

          if stale:
              print(f"::error::data is stale: last_date={last} is {bd} business days old (threshold={MAX_STALE_BDAYS}). yfinance likely returned cached/throttled response.")
              sys.exit(1)
          else:
              print(f"::notice::data freshness OK: last_date={last} ({bd} business days old)")
          PY

      - name: 변경사항 있을 때만 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us_breadth.json data/us_breadth_health.json
          if git diff --cached --quiet; then
            echo "::notice::us_breadth 데이터 변경 없음 — 커밋 생략"
          else
            TS=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore(data): us_breadth + health 자동 갱신 (${TS})"
            # push 경쟁 (동시간대 yahoo cron) 대비 rebase retry (2026-07-24)
            git push || (git pull --rebase --autostash && git push)
            echo "::notice::us_breadth.json + health.json 갱신 & 푸시 완료"
          fi
