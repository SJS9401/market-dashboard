# KR Price Probe — 일회성 확인용 (2026-10-16 BT 승인)
# KIS 시세 API 중 정규장(KRX) 종가를 주는 조합을 찾는다. 로그 출력만 하고 커밋하지 않는다.
# 수동 실행 전용 — 예약 없음. 확인이 끝나면 삭제해도 된다.
name: KR Price Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python3 scripts/kr_price_probe.py
