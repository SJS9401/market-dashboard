# IBD Stock Market Today Relay — IBD 장 마감 라이브 자막 릴레이 (2026-10-09 신설)
# ----------------------------------------------------------
# 데일리 프리뷰(클라우드)는 YouTube 에 직접 접근할 수 없다. 이 작업이 IBD 「Stock Market Today」
# 라이브(뉴욕 16:05~16:30) 자막을 받아 data/ibd_smt_latest.json 으로 올리고, 프리뷰는 Pages 로 읽는다.
#
# [1단계 — 시험] Actions 탭에서 수동 실행(Run workflow) + probe=1
#   → GitHub 서버에서 YouTube 가 막히는지 확인. 결과는 data/ibd_smt_probe.json
# [2단계 — 운영] 시험 통과 시 아래 schedule 이 매일 돈다.
#
# [스케줄 근거] GitHub cron 은 2~5시간 늦게 깨는 날이 있다(us-close-relay 실측).
# 그래서 일찍 깨워 스크립트가 뉴욕 16:35 까지 자고 그 뒤 5분 간격으로 자막을 확인한다.
# 대기가 300분을 넘는 너무 이른 발화는 [SKIP] 하고 다음 슬롯이 잇는다.
# 이미 오늘 파일이 있으면 뒤 슬롯은 자동 SKIP (커밋 하루 1건).
# ⚠ 정각(:00)·:30 회피 — 2026-06-02 정각 cron 통째 skip 사고 전례.

name: IBD SMT Relay

concurrency:
  group: ibd-smt-relay
  cancel-in-progress: false

on:
  schedule:
    - cron: '45 15 * * 1-5'   # 00:45 KST
    - cron: '45 16 * * 1-5'   # 01:45 KST (겨울 주력)
    - cron: '45 17 * * 1-5'   # 02:45 KST
    - cron: '45 18 * * 1-5'   # 03:45 KST
    - cron: '15 20 * * 1-5'   # 05:15 KST
    - cron: '05 21 * * 1-5'   # 06:05 KST — 최종 안전망
  workflow_dispatch:
    inputs:
      probe:
        description: 'PROBE mode (1 = 대기 없이 최신 회차로 자막 경로 시험)'
        required: false
        default: '1'
      force:
        description: 'FORCE mode (1 = 오늘 파일이 있어도 다시 받기)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: pip install --quiet --upgrade yt-dlp youtube-transcript-api

      - name: Run relay
        env:
          PROBE: ${{ github.event.inputs.probe || '0' }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: python3 scripts/ibd_smt_relay.py

      - name: Commit data
        run: |
          set -e
          git config user.name "ibd-smt-relay"
          git config user.email "actions@users.noreply.github.com"
          git add data/ibd_smt_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes — skip"; exit 0
          fi
          SD=$(python3 -c "import json;print(json.load(open('data/ibd_smt_latest.json')).get('base_date','probe'))" 2>/dev/null || echo probe)
          git commit -m "ibd_smt ${SD} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed (attempt $i)"; exit 0
            fi
            echo "push rejected — rebase & retry ($i/5)"
            git pull --rebase --autostash
            sleep $((i * 5))
          done
          echo "::error::push 5회 실패"; exit 1
